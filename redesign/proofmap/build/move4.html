id": "p7-e24", "displayId": "e24", "caption": "mark 족의 닫힘", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "유리수값·절댓값 1 이하이면 족 안", "stmt": "mark specification은 유한 개 $n\\ge0$ 의 이름 붙은 Rademacher 좌표, 각 좌표에 배정한 깊이 $\\in\\{1,\\ldots,L-1\\}$, 두 함수 $g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, 그리고 $S_0=1$ 또는 $S_0=\\sigma_i$ 의 선택이다. 각 좌표는 보조 path를 따라 배정된 깊이에서 뽑는다. 서로 다른 좌표는 독립이고, 한 좌표의 값은 공유한 vertex에서 공유되며 다른 vertex에서는 독립이다. $n=0$ 은 상수 함수를 포함한다. 이런 specification을 모두 쓴다(부호 정의역이 유한하므로 가산 개). 부호의 곱과 그 유리수 평균은 이 모임에 속한다.", "src": "perturbations.tex 28–38, 488–489", "nottaken": "type 매개변수와 Poisson 개수는 싣지 않는다."}, {"from": "T4", "to": "T5", "type": "flow", "id": "p7-e13", "displayId": "e13", "caption": "미분 소거", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N\\rvert_0\\to0$", "stmt": "$k\\ge1$ 이고 $g_0,g_1,\\ldots,g_k$ 가 같은 유한 개 보조 mark에서 함께 만든 유리수값 함수이며 절댓값이 $1$ 이하일 때, 독립인 새 균일 site $i$ 와 mark의 독립 사본으로 $A_{\\boldsymbol z}=1+\\sum_{j=1}^kz_jg_j\\sigma_i$ 를 삽입하고 $$\\Phi_N(\\boldsymbol z)=J^{\\boldsymbol z}_{N,\\mathcal T}-\\mathbb Ef\\,J^{\\boldsymbol z}_{N,\\{a_*\\}},\\qquad J^{\\boldsymbol z}_{N,\\mathcal T}=\\mathbb E\\Bigl[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A_{\\boldsymbol z}^{a_*}}\\,W_{\\mathcal T}(A_{\\boldsymbol z})\\Bigr]$$ 로 둔다($J^{\\boldsymbol z}_{N,\\{a_*\\}}$ 는 anchor 하나뿐인 tree와 시험함수 $1$). 기대값은 삽입 없는 reservoir를 독립 삽입 변수의 prior kernel로 넓힌 것이고, 이 계산의 mark는 모두 base reservoir와 독립이다. 이런 $(g_0,\\ldots,g_k)$ 마다 선택된 수열을 따라 $$\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N(\\boldsymbol z)\\big\\rvert_{\\boldsymbol z=0}\\longrightarrow0 .$$ $k=0$ 이면 같은 진술을 상수 mark의 상수 계수 $H_N(0,0)\\to0$ 으로 읽는다. 고정한 $L$, old tree, anchor, $f$, $k$, $g_0,\\ldots,g_k$ 에서의 진술이고 이들에 대한 균일성은 없다.", "src": "perturbations.tex 474–490, 512, 526–527", "nottaken": "polarization 식과 $Q_N$ 은 싣지 않는다. 단계 5는 혼합 미분이 $0$ 으로 간다는 것만 쓴다."}, {"from": "P3", "to": "T5", "type": "flow", "id": "p7-e14", "displayId": "e14", "caption": "mark 선택", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "mark 평균 = 공유 지시함수", "stmt": "color 쌍 $a,b\\in\\{0,\\ldots,k\\}$(anchor는 color $0$)와 깊이 $1\\le d\\le L-1$ 에 대해 ‘split 깊이가 $d$ 이상’은 ‘깊이 $d$ vertex를 공유한다’와 같다. 그 깊이에 새 독립 Rademacher 좌표를 두고 $g_a$, $g_b$ 둘 다에 그 인자를 준다. 유한 개의 요구에는 요구마다 다른 독립 좌표를 쓰고 각 $g_a$ 를 배정된 인자의 곱으로 정의한다. 그러면 서로 다른 replica 위치를 쓰는 history $E$ 마다 $$\\mathbb E_{\\rm marks}\\Bigl[g_0^{a_*}\\prod_{j=1}^kg_j^{a_j(E)}\\Bigr]=\\prod_{(a,b,d)\\ \\text{요구}}\\mathbf 1_{\\{a,b\\text{ 가 깊이 }d\\text{ vertex를 공유}\\}} .$$ 공유 지시함수를 $H_d(a,b)$, 서로 다른 위치에 대해 $H_0=1$, $H_L=0$ 으로 두면(값이 같아도 위치로 판정) 깊이 $d$ 에서 정확히 갈라짐은 $H_d-H_{d+1}$($0\\le d\\le L-1$)이다. 그 곱과 유한 일차결합으로 처방한 일관된 colored shape 하나 또는 허용한 shape들의 모임을 고를 수 있다. 일차결합의 각 항에서 $g_0,\\ldots,g_k$ 는 부호의 곱이라 값이 $\\{-1,1\\}$ 에 있고, 이 함수들과 그 polarization 평균은 처음 고정한 mark 족에 속한다. 상수 mark가 $k=0$ 을 덮는다. 쓰는 mark는 깊이 $L-1$ 까지뿐이다.", "src": "perturbations.tex 494–524, 533–535", "nottaken": "없음."}, {"from": "XC", "to": "T5", "type": "call", "id": "p7-e12", "displayId": "e12", "caption": "혼합 전개", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "상쇄 anchor 전개의 혼합 방향 판", "stmt": "유한 깊이의 임의 확률 kernel 열에서, root가 주어진 조건부로: $H$ 가 old tree 변수의 유계 함수이고 삽입 매개변수에 무관하며 $D_1,\\ldots,D_k$ 가 유계 실수 path 함수일 때 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$ 에 대해 $$\\partial_{t_1}\\cdots\\partial_{t_k}\\,E^{A_{\\boldsymbol t}}_{\\mathcal T}\\!\\left[\\frac{H}{A_{\\boldsymbol t}^{a_*}}\\right]\\Bigg\\rvert_{\\boldsymbol t=0}=\\sum_{E}c_E\\;E_{\\mathcal T_E}\\!\\Bigl[H\\prod_{j=1}^kD_j^{a_j(E)}\\Bigr].$$ 식은 color의 어떤 고정 순서에서도 성립하고, 빈 extension의 무게는 $1$ 이다. old tree $\\mathcal T$ 와 anchor leaf $a_*$ 에서 시작해 color $1,\\ldots,k$ 를 차례로 준다. 다음 color마다 (i) $a_*$ 가 아닌 아직 안 쓴 old leaf를 계수 $1$ 로 고르거나, (ii) 현재 tree(안 쓴 것을 포함한 모든 old path와 이미 더한 path)의 내부 vertex $\\beta$ 에서 fresh path를 만들어 계수 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$ 을 받는다. fresh path는 갈라지는 vertex에서 새 자식, 그보다 깊은 모든 깊이에서 새 vertex를 쓴다. 고른 leaf는 그 color를 받고 다시 고를 수 없다. history $E$ 는 이 선택의 기록이고, $a_j(E)$ 는 color $j$ 를 받은 leaf, $\\mathcal T_E$ 는 마지막 tree, $c_E$ 는 계수들의 곱이다. 고정한 $k$ 에서 history는 유한 개이고, $c_E$ 는 $(\\mathcal T,a_*,k)$ 와 수 $m_d$ 만으로 정해진다. 방향이 서로 다른 혼합 미분에서는 이 전개가 순서 있는 extension 규칙 그대로이고 계수에 factorial이 더 붙지 않는다.", "src": "trees.tex 259–296; perturbations.tex 491–492, 526–527", "nottaken": "같은 방향 판의 $1/k!$ 는 단계 2가 쓴다(p7-e6). 해석적 경계는 p7-e25."}, {"from": "XE", "to": "T5", "type": "call", "id": "p7-e25", "displayId": "e25", "caption": "교환 근거", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "kernel 균일 해석적 경계", "stmt": "$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$($D_j$ 유계 실수 path 함수)에 대해 $Y_d$, 밀도 $W_{\\mathcal T}(A)$, 그 상쇄판 $E^{A_{\\boldsymbol t}}_{\\mathcal T}[H/A_{\\boldsymbol t}^{a_*}]$ 는 복소 영역 $\\sum_j\\lvert t_j\\rvert\\lVert D_j\\rVert_\\infty<1$ 에서 해석적이다. 이 합이 $\\rho<1$ 이하인 더 작은 닫힌 영역에서 이 식들과 더 작은 영역에서의 그 도함수들은 유계이고, 그 한계는 kernel에 대해 균일하다. 한계가 의존하는 것은 고정한 깊이, 수 $m_d$, tree 크기, 삽입 함수의 한계($\\lVert D_j\\rVert_\\infty$, $\\lVert H\\rVert_\\infty$)뿐이다.", "src": "trees.tex 156–176, 294–295", "nottaken": "없음."}, {"from": "XB", "to": "T5", "type": "def", "id": "p7-e26", "displayId": "e26", "caption": "새 변수·표본", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "넓힌 kernel, 표본 규칙", "stmt": "양의 path 함수 $A$(root가 주어졌을 때 위로 유계이고 0에서 떨어짐)에 대해 $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d},\\qquad K_d^A=\\Bigl(\\frac{Y_d}{Y_{d-1}}\\Bigr)^{m_d}K_d .$$ $K_d^A$ 는 확률 kernel이고, 위첨자 $A$ 는 tree 기대값이 이 kernel을 쓴다는 뜻이다. 삽입 미적분: spin 가중치에 $A$ 를 곱하면 kernel이 $K_d^A$ 로 바뀌고, 처방된 tree의 바뀐 법칙의 조건부 결합 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta},\\qquad\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1},$$ 곧 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 이다($Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$). 삽입은 원래 모형에 없던 변수를 써도 된다. 그 변수들의 독립 prior kernel로 각 path kernel을 넓힌 뒤 위 내용을 적용한다. 원래 backward 로그는 그 변수에 의존하지 않으므로 원래 tilt는 그 변수들의 조건부 prior kernel을 바꾸지 않는다. 추가한 root 변수는 quenched로 남는다. tree $\\mathcal T$ 는 공통 root와 깊이 $L$ 에서 끝나는 유한 개의 이름 붙은 path다. 각 vertex에서 서로 다른 자식은 prefix가 주어졌을 때 해당 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 root가 주어진 조건부의 이 표본 기대값이다. leaf 일부와 남은 leaf가 쓰지 않는 path 부분을 지워도 남은 tree의 표본 법칙은 그대로다. 깊이 $L$ 의 replica 위치는 서로 다른 vertex이고, 거기서 뽑힌 값은 같아도 된다. 지정하지 않은 기대값 $\\mathbb E$ 는 root와 지정한 tree의 표본을 포함한다.", "src": "trees.tex 29–39, 67–110, 135–140", "nottaken": "multioverlap $R_S$ 정의는 싣지 않는다($R_E$ 는 T5가 직접 정의한다)."}, {"from": "XF", "to": "P3", "type": "def", "id": "p7-e27", "displayId": "e27", "caption": "mark 규칙", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "Rademacher 좌표의 공유와 독립", "stmt": "mark specification은 유한 개 $n\\ge0$ 의 이름 붙은 Rademacher 좌표, 각 좌표에 배정한 깊이 $\\in\\{1,\\ldots,L-1\\}$, 두 함수 $g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, 그리고 $S_0=1$ 또는 $S_0=\\sigma_i$ 의 선택이다. 각 좌표는 보조 path를 따라 배정된 깊이에서 뽑는다. 서로 다른 좌표는 독립이고, 한 좌표의 값은 공유한 vertex에서 공유되며 다른 vertex에서는 독립이다. $n=0$ 은 상수 함수를 포함한다. 이런 specification을 모두 쓴다(부호 정의역이 유한하므로 가산 개). 부호의 곱과 그 유리수 평균은 이 모임에 속한다.", "src": "perturbations.tex 28–38", "nottaken": "type 매개변수와 Poisson 개수는 싣지 않는다."}, {"from": "T5", "to": "OUT", "type": "flow", "id": "p7-e15", "displayId": "e15", "caption": "항등식", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "P7", "stmt": "$S_0=\\sigma_i$ 이면 spin anchor, $S_0=1$ 이면 marker anchor라 한다. 더하는 color는 $1,\\ldots,k$ 로 순서를 매기고 anchor는 color $0$ 이다. color들은 상쇄 anchor extension 규칙에 따라 anchor가 아닌 서로 다른 replica 위치를 차지한다. 제약 $\\mathcal C$ 는 더한 color들과 anchor 사이의 쌍별 const VERTEX = {"T2": {"map": "p7", "label": "펼친 상자 보기 (완결 아님)", "title": "단계 2 — Taylor 계수의 꼴", "kind": "단계", "source": "perturbations.tex 331–348(정의), 399–405(이 단계), 439–449($R_E$), 512(mark의 독립)", "claim": "완결이 아니다. 유도가 일곱 걸음이라 그 안이 다시 node와 edge의 지도로 풀려야 하고, edge의 내용이 edge가 아니라 이 상자 안에 적혀 있다. 단순한 vertex의 예는 미분 규칙의 유도 › 첫 변분의 유도에 있다.", "context": ["깊이 $L$ 과 수 $0=m_0<\\cdots<m_L=1$ 고정. $N$ 은 선택된 수열의 한 크기. 이 상자의 진술은 그런 $N$ 마다 성립하고 극한은 쓰지 않는다.", "old tree $\\mathcal T$, anchor $a_*$, 시험함수 $f$ 고정. $f$ 는 old replica들의 multioverlap의 유계 다항식이고 그 계수는 $N$ 과 삽입 매개변수에 무관하다.", "mark specification 고정: mark의 함수 $g$, $g_0$ ($\\lvert g\\rvert,\\lvert g_0\\rvert\\le1$)와 anchor 종류 $S_0\\in\\{\\sigma_i,\\,1\\}$.", "$\\mathbb E$ 는 삽입이 없는 reservoir의 기대값(root 평균과 tree 표본 포함)이고, 독립인 삽입 변수(새 균일 site $i$, mark 과정의 독립 사본)를 그 prior로 붙여 넓힌 것이다. 섭동 매개변수는 선택된 값에 고정.", "대상: $E_{\\mathcal T}$ 는 root가 주어졌을 때 원래 kernel로 뽑는 tree 기대값, $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 는 삽입 $A$ 로 바뀐 kernel의 것. $R_U=\\frac1N\\sum_i\\prod_{a\\in U}\\sigma_i^a$."], "inputs": [{"id": "I1", "from": "단계 1 앞의 정의", "type": "정의", "stmt": "$A=1+tg\\sigma_i+ug_0S_0$ 에 대해 $$\\Pi_{N,\\mathcal T}(t,u)=\\mathbb E\\!\\left[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A^{a_*}}\\,W_{\\mathcal T}(A)\\right],\\qquad\\Xi_N(t,u)=\\Pi_{N,\\mathcal T}(t,u)-\\mathbb Ef\\;\\Pi_{N,\\{a_*\\}}(t,u).$$ $\\Pi_{N,\\{a_*\\}}$ 는 anchor 하나뿐인 tree에서 시험함수를 1로 둔 같은 식이다.", "fit": "정의라서 조건이 없다. (원문 기호로 $\\Pi=J$, $\\Xi=H$.)", "nottaken": "단계 1의 결과인 한계 $\\lvert\\Xi_N(t_\\nu,u_\\nu)\\rvert\\le\\lVert f\\rVert_\\infty e_{\\nu,N}$ 는 이 상자로 오지 않는다. 단계 3으로 간다.", "src": "perturbations.tex 331–348"}, {"id": "I2", "from": "P6′ ① history 전개", "type": "호출", "stmt": "임의의 유한 확률 kernel 열에서, root가 주어진 조건부로: $G$ 가 old tree 변수의 유계 함수이고 $\\boldsymbol t$ 에 무관하며 $D_1,\\ldots,D_k$ 가 유계 실수 path 함수이면, $A_{\\boldsymbol t}=1+\\sum_jt_jD_j$ 에 대해 $$\\partial_{t_1}\\cdots\\partial_{t_k}\\,E^{A_{\\boldsymbol t}}_{\\mathcal T}\\!\\left[\\frac{G}{A_{\\boldsymbol t}^{a_*}}\\right]\\Bigg\\rvert_{\\boldsymbol t=0}=\\sum_{E}c_E\\;E_{\\mathcal T_E}\\!\\Bigl[G\\prod_{j=1}^kD_j^{a_j(E)}\\Bigr].$$ 우변은 유한 합이다. history $E$, 마지막 tree $\\mathcal T_E$, color $j$ 를 받은 leaf $a_j(E)$, 계수 $c_E$ 는 $(\\mathcal T,a_*,k)$ 와 수 $m$ 만으로 정해지고 kernel, $G$, $D_j$ 와 무관하다.", "inst": "$G=f\\,g_0^{a_*}S_0^{a_*}$. 한 방향일 때 $D_j=g\\sigma_i$ (모든 $j$), 여러 방향일 때 $D_j=g_j\\sigma_i$.", "fit": "$f$ 는 old replica의 함수이고 $g_0^{a_*}S_0^{a_*}$ 는 anchor path의 함수이며 둘 다 유계이고 $t$ 에 무관하다. $\\lvert g\\sigma_i\\rvert\\le1$.", "nottaken": "history의 정의를 푸는 내용, 곧 $c_E$ 를 걸음마다의 $+1$ 과 $\\gamma_\\beta$ 의 곱으로 계산하는 방법은 오지 않는다. 이 상자는 $c_E$ 가 $N$ 과 무관한 수라는 것만 쓴다.", "src": "trees.tex, lemma tree:extension-expansion"}, {"id": "I3", "from": "P6′ ① 해석적 경계", "type": "호출", "stmt": "같은 조건에서 $\\boldsymbol t\\mapsto E^{A_{\\boldsymbol t}}_{\\mathcal T}[G/A_{\\boldsymbol t}^{a_*}]$ 는 복소 영역 $\\sum_j\\lvert t_j\\rvert\\lVert D_j\\rVert_\\infty<1$ 에서 해석적이고, 더 작은 닫힌 영역마다 그 절댓값의 한계가 kernel에 무관하다(고정한 $L$, 수 $m$, tree 크기, $\\lVert G\\rVert_\\infty$, $\\lVert D_j\\rVert_\\infty$ 에만 의존).", "inst": "위와 같은 $G$, $D_j$.", "fit": "root와 $i$ 가 달라지면 kernel이 달라질 뿐이므로, 한계가 root와 $i$ 에 균일하다.", "nottaken": "$u$ 방향의 해석성과 $\\partial_u$ 의 한계는 오지 않는다. 단계 3이 쓴다.", "src": "x:tree-analytic-bounds; perturbations.tex 391–394"}, {"id": "I4", "from": "삽입이 새 변수를 써도 된다는 사실", "type": "호출", "stmt": "삽입 $A$ 가 원래 모형에 없던 변수의 함수여도 된다. 그 변수를 독립인 prior kernel로 path에 붙여 넓힌 kernel 열에 I2와 I3을 적용한다.", "inst": "새 변수 = 새 site $i$ 에서의 spin과 mark 과정의 독립 사본.", "fit": "문맥의 $\\mathbb E$ 가 바로 그렇게 넓힌 reservoir의 기대값이다.", "nottaken": "없음.", "src": "x:tree-extra-variables; perturbations.tex 335–337"}, {"id": "I5", "from": "mark의 독립", "type": "사실", "stmt": "새 mark는 삽입 전 reservoir와 독립이고 site $i$ 와도 독립이다.", "fit": "문맥의 넷째 줄이 정한 것이다.", "nottaken": "없음.", "src": "perturbations.tex 332, 512"}], "steps": [{"n": 1, "text": "$u=0$ 으로 둔다. $A=1+tD$, $D=g\\sigma_i$. $G=f\\,g_0^{a_*}S_0^{a_*}$ 로 두면 $G$ 는 유계이고 $t$ 에 무관하다.", "uses": "문맥, I4"}, {"n": 2, "text": "밀도의 정의로 $\\Pi_{N,\\mathcal T}(t,0)=\\mathbb E\\,\\varphi(t)$, 여기서 $\\varphi(t)=E^{A}_{\\mathcal T}[G/A^{a_*}]$ 는 root와 $i$ 가 주어진 조건부 양이다.", "uses": "I1, 문맥(대상)"}, {"n": 3, "text": "방향이 모두 같으면 $A_{\\boldsymbol t}=1+(t_1+\\cdots+t_k)D$ 라서 I2의 좌변은 $\\varphi^{(k)}(0)$ 이다. 그러므로 $$\\varphi^{(k)}(0)=\\sum_Ec_E\\,E_{\\mathcal T_E}\\Bigl[G\\prod_{j=1}^kD^{a_j(E)}\\Bigr].$$", "uses": "I2"}, {"n": 4, "text": "$\\varphi$ 는 원판 $\\lvert t\\rvert<1$ 에서 해석적이고 한계가 root와 $i$ 에 균일하다. 그래서 $\\mathbb E\\varphi$ 도 해석적이고 Taylor 계수는 계수의 평균이다: $$[t^k]\\,\\Pi_{N,\\mathcal T}(t,0)=\\frac1{k!}\\,\\mathbb E\\,\\varphi^{(k)}(0)=\\frac1{k!}\\sum_Ec_E\\,\\mathbb E\\Bigl[f\\,g_0^{a_*}S_0^{a_*}\\prod_{j}(g\\sigma_i)^{a_j(E)}\\Bigr].$$", "uses": "I3", "flag": "평균과 미분의 교환을 I3으로 정당화한 것은 지도 작성자가 채운 것이다. 원문 399–405는 이 교환을 따로 말하지 않는다."}, {"n": 5, "text": "인자를 셋으로 가른다: $f$, mark 인자 $g_0^{a_*}\\prod_jg^{a_j(E)}$, spin 인자 $S_0^{a_*}\\prod_j\\sigma_i^{a_j(E)}$. mark가 독립이므로 mark 평균이 따로 나온다. $\\mu_E=\\mathbb E_{\\rm marks}\\bigl[g_0^{a_*}\\prod_jg^{a_j(E)}\\bigr]$ 는 mark 법칙과 $\\mathcal T_E$ 의 모양만으로 정해지는 수다. $i$ 를 평균하면 spin 인자가 $$R_E=\\frac1N\\sum_iS_0^{a_*}\\prod_j\\sigma_i^{a_j(E)}$$ 가 된다(spin anchor이면 anchor 포함, marker anchor이면 제외).", "uses": "I5, 문맥"}, {"n": 6, "text": "그러므로 $$[t^k]\\,\\Pi_{N,\\mathcal T}(t,0)=\\frac1{k!}\\sum_{E}c_E\\,\\mu_E\\,\\mathbb E[f\\,R_E].$$ anchor 하나뿐인 tree와 시험함수 1에 같은 계산을 하면 $[t^k]\\,\\Pi_{N,\\{a_*\\}}(t,0)=\\frac1{k!}\\sum_{E'}c_{E'}\\,\\mu_{E'}\\,\\mathbb E[R_{E'}]$ 이다($E'$ 는 anchor 하나에서 시작하는 history).", "uses": "1–5"}, {"n": 7, "text": "방향을 $D_j=g_j\\sigma_i$ 로 달리해 3–6을 되풀이하면, 혼합 미분에 대해 같은 식이 $\\prod_jg^{a_j(E)}$ 자리에 $\\prod_jg_j^{a_j(E)}$ 를 넣은 꼴로 나온다. 좌변이 혼합 편미분이라 $(g_1,\\ldots,g_k)$ 에 대해 대칭이고, 우변이 각 $g_j$ 에 선형이다.", "uses": "I2, I3, 3–6"}], "outputs": [{"id": "O1", "to": "단계 3 — Taylor 계수 소거", "stmt": "모든 $k\\ge0$ 에 대해 $$[t^k]\\,\\Xi_N(t,0)=\\frac1{k!}\\Bigl[\\sum_{E}c_E\\,\\mu_E\\,\\mathbb E[f\\,R_E]\\;-\\;\\mathbb Ef\\sum_{E'}c_{E'}\\,\\mu_{E'}\\,\\mathbb E[R_{E'}]\\Bigr].$$ 두 합은 유한하고, $c_E$ 와 $\\mu_E$ 는 $N$ 과 무관하다. $f$ 가 old replica의 multioverlap의 다항식이므로 $\\mathbb E[fR_E]$ 는 유한 prescribed tree $\\mathcal T_E$ 위 multioverlap 유한곱의 기대값들의 일차결합이다. 곧 각 Taylor 계수는 그런 모멘트와 그런 모멘트 둘의 곱의, $N$ 에 무관한 계수를 가진 유한 일차결합이다.", "by": "1–6", "src": "perturbations.tex 399–405"}, {"id": "O2", "to": "단계 4 — 한 방향에서 여러 방향으로", "stmt": "$Q_N(g)=k!\\,[t^k]\\,\\Xi_N(t,0)$ 를 $g$ 의 함수로 보면, 대칭 $k$-선형 형식 $$M_N(g_1,\\ldots,g_k)=\\sum_Ec_E\\,\\mathbb E\\Bigl[f\\,g_0^{a_*}S_0^{a_*}\\prod_jg_j^{a_j(E)}\\sigma_i^{a_j(E)}\\Bigr]-\\mathbb Ef\\cdot(\\text{anchor 하나 tree의 같은 식})$$ 의 대각이다: $Q_N(g)=M_N(g,\\ldots,g)$. $M_N$ 은 $A=1+\\sum_jz_jg_j\\sigma_i$ 를 삽입한 $\\Xi$ 의 혼합 미분 $\\partial_{z_1}\\cdots\\partial_{z_k}\\rvert_0$ 이고 factorial이 붙지 않는다.", "by": "3, 4, 7", "src": "perturbations.tex 477–481, 491–492"}], "symbols": [["$\\Pi$, $\\Xi$", "I1"], ["$c_E$, $\\mathcal T_E$, $a_j(E)$, history $E$", "I2"], ["$E^A_{\\mathcal T}$, $E_{\\mathcal T}$, $W_{\\mathcal T}$, $R_U$", "문맥(대상)"], ["$f$, $g$, $g_0$, $S_0$, $i$, $\\mathbb E$", "문맥"], ["$\\varphi$, $G$, $D$, $\\mu_E$, $R_E$, $Q_N$, $M_N$", "이 상자 안에서 정의"]], "found": ["지도에는 단계 1 → 단계 2 → 단계 3이 한 줄로 그려져 있지만, 단계 1의 한계는 단계 2를 거치지 않고 단계 3으로 간다. 단계 2가 단계 1에서 받는 것은 정의뿐이다. 정의는 따로 상자로 두는 것이 맞다.", "단계 2 → 단계 4의 화살표(O2)가 지도에 없다. 지도는 단계 4가 history 전개를 다시 호출하는 것으로 그렸다.", "단계 2는 해석적 경계(I3)와 \"새 변수를 써도 된다\"(I4)도 받는다. 지도에는 이 두 화살표가 없다.", "유도 4의 평균과 미분의 교환은 원문과 현행 L2가 말로 적지 않은 걸음이다."]}, "D1": {"map": "diff", "atomic": true, "title": "밀도의 로그를 미분", "label": "vertex 보기 (미완결)", "where": "", "source": "trees.tex 92–110, 142–154, 184–191", "context": ["$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방. $G$ 는 유계이고 $\\boldsymbol t$ 에 무관."], "floor": ["유한 곱의 로그와 유한 합의 항별 미분", "연쇄 법칙", "등식의 대입", "확률 kernel 평균은 유계 함수의 sup 크기를 넘지 않는다"], "premiseMode": "legacy", "introductions": [], "edgesIn": [{"id": "e1", "rawId": "diff-e1", "kind": "정의", "from": "대상: tree와 삽입", "stmt": "path는 깊이 $0,\\ldots,L$ 마다 변수 하나, 깊이 $d$ 의 변수는 prefix가 주어지면 kernel $K_d$ 로 뽑는다. tree $\\mathcal T$ 는 root를 공유하는 유한 개의 path. 삽입 $A$ 에 대해 $$Y_L=A,\\quad Y_{d-1}=(K_dY_d^{m_d})^{1/m_d},\\quad W_{\\mathcal T}(A)=\\prod_{a}A^a\\prod_{\\beta}Y_\\beta^{\\gamma_\\beta},\\quad \\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}<0 .$$ 재귀의 단조성으로, 양의 root-가측 경계 $a\\le A\\le b$ 이면 모든 깊이에서 $a\\le Y_d\\le b$. 미분 계산에서는 원래 kernel 열과 지수 $m_d$를 고정하고 $D_j$도 매개변수에 무관하게 둔다. $A_{\\boldsymbol t}=1+\\sum_{j=1}^k t_jD_j$이며 $D_j$는 유계 실수 path 함수다. $U$는 $0<a\\le A_{\\boldsymbol t}\\le b$인 실수 근방이다. (top.O1의 진술과 fv_inputs.insertion 항목에서 옮김.)", "src": "trees.tex 16–23, 67–72, 92–110, 142–145"}, {"id": "e11", "rawId": "diff-e11", "kind": "사실", "from": "첫 변분", "stmt": "각 깊이 $0\\le d\\le L$에 대해 $$\\partial_{t_j}\\log Y_d=K_{d+1}^{A_{\\boldsymbol t}}\\cdots K_L^{A_{\\boldsymbol t}}\\!\\left[\\frac{D_j}{A_{\\boldsymbol t}}\\right]=E^{A_{\\boldsymbol t}}\\!\\left[\\left.\\frac{D_j}{A_{\\boldsymbol t}}\\right|\\mathscr F_d\\right].$$ $\\mathscr F_d$는 주어진 깊이 $d$의 prefix이고 오른쪽은 그 아래로 삽입 후 확률 kernel $K_{d+1}^{A_{\\boldsymbol t}},\\ldots,K_L^{A_{\\boldsymbol t}}$를 따라 새 path 하나를 뽑는 평균이다. $d=L$에서는 kernel의 빈 합성을 항등 연산으로 읽는다.\n\n성립 조건: 유한 깊이 $L$과 확률 kernel 열, $0=m_0<\\cdots<m_L=1$을 고정한다. $A_{\\boldsymbol t}=1+\\sum_jt_jD_j$이고 $D_j$는 유계 실수 path 함수이며 kernel과 함께 매개변수에 무관하다. $0<a\\le A_{\\boldsymbol t}\\le b$가 성립하는 실수 근방 안이다. root는 고정하며 $j$ 방향으로 미분한다.", "src": "diff.D2.outputs.kernel_form; trees.tex 142–154"}, {"id": "e13", "rawId": "diff-e13", "kind": "정의", "from": "대상: tree와 삽입", "stmt": "유한 tree $\\mathcal T$ 는 공통 root와 깊이 $L$ 에서 끝나는 유한 개의 path로 이루어진다. 내부 vertex는 자식이 하나 이상이고, 자식이 하나뿐인 구간도 그대로 둔다. $\\operatorname{Leaves}(\\mathcal T)$ 는 깊이 $L$ 의 끝 vertex, $\\operatorname{Int}(\\mathcal T)$ 는 내부 vertex의 집합이다. (trees.tex 29–31, 97–104)\n\nprescribed tree의 내부 vertex $\\beta$ 에 대해 $d_\\beta$ 는 그 깊이, $n_\\beta$ 는 자식 수다. (trees.tex 92–93)\n\n$Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$ 다. (trees.tex 105)", "src": "trees.tex 29–31, 92–93, 105"}], "node": {"kind": "원자 node — 계산 하나", "chain": [{"expr": "$$\\log W_{\\mathcal T}(A)=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\log A^a+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\log Y_\\beta,\\qquad Y_\\beta:=Y_{d_\\beta}\\ (\\beta\\text{의 prefix에서}).$$ 모든 path에서 $a\\le A\\le b$, 모든 깊이에서 $a\\le Y_d\\le b$이므로 각 로그가 정의된다.", "by": "diff-e1의 $W_{\\mathcal T}(A)$ 정의와 재귀의 단조성 경계, 문맥 FD의 균등한 양성. 유한 곱의 로그. $Y_\\beta$를 깊이 $d_\\beta$의 prefix에서 평가한 $Y_{d_\\beta}$로 읽는 것은 trees.tex 105의 정의이고 O1이 싣지 않는다(review.open). 이 정의는 diff-e13(top.O1.outputs.tree_defs)가 싣는다."}, {"expr": "$$\\partial:=\\partial_{t_j},\\qquad \\partial A^a=D_j^a,\\qquad \\partial\\log A^a=\\frac{D_j^a}{A^a}.$$", "by": "diff-e1: $A=1+\\sum_jt_jD_j$이고 $D_j$는 매개변수에 무관하다. 연쇄 법칙."}, {"expr": "$$\\partial\\log Y_\\beta=E^{A}\\!\\left[\\left.\\frac{D_j}{A}\\right|\\mathscr F_{d_\\beta}\\right]\\ (\\beta\\text{의 prefix에서}),\\qquad |\\partial\\log Y_\\beta|\\le\\frac{\\|D_j\\|_\\infty}{a}.$$", "by": "diff-e11의 kernel_form에 $d=d_\\beta$와 β의 prefix를 대입한다. kernel_form은 $U$의 각 점에서 성립하므로 $\\log Y_\\beta$는 $U$에서 미분 가능하다. 오른쪽은 확률 kernel $K^A_{d_\\beta+1},\\ldots,K^A_L$의 합성 평균이고, diff-e1의 $D_j$ 유계와 $A\\ge a$로 $|D_j/A|\\le\\|D_j\\|_\\infty/a$. 이 정의는 diff-e13(top.O1.outputs.tree_defs)가 싣는다.", "flag": "경계 $|\\partial\\log Y_\\beta|\\le\\|D_j\\|_\\infty/a$는 원문이 이 자리에서 적지 않는다. 원문은 미분 가능성과 이후의 미분을 trees.tex 156–176의 복소 영역 해석적 경계로 정당화한다."}, {"expr": "$$\\partial\\log W_{\\mathcal T}(A)=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\frac{D_j^a}{A^a}+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,\\partial\\log Y_\\beta .$$", "by": "식 1의 유한 합을 항마다 미분하고 식 2, 3을 넣는다. $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$는 고정한 지수(diff-e1)와 old tree의 자료 $d_\\beta,n_\\beta$로 정해지므로 $\\boldsymbol t$와 표본 변수에 무관하다. $d_\\beta,n_\\beta$의 뜻(깊이, 자식 수)은 trees.tex 92–93이고 O1이 싣지 않는다(review.open). 이 정의는 diff-e13(top.O1.outputs.tree_defs)가 싣는다."}, {"expr": "$$0<W_{\\mathcal T}(A)\\le b^{|\\operatorname{Leaves}(\\mathcal T)|}\\,a^{\\sum_{\\beta}\\gamma_\\beta},\\qquad \\sup_{\\text{leaf}}\\Bigl|\\frac{D_j}{A}\\Bigr|\\le\\frac{\\|D_j\\|_\\infty}{a},\\qquad |\\partial\\log W_{\\mathcal T}(A)|\\le\\Bigl(|\\operatorname{Leaves}(\\mathcal T)|+\\sum_\\beta|\\gamma_\\beta|\\Bigr)\\frac{\\|D_j\\|_\\infty}{a}\\qquad(U\\text{ 위에서 균일}).$$", "by": "식 1의 경계에서 leaf 인자는 $b$ 이하이고, diff-e1의 $\\gamma_\\beta<0$과 $Y_\\beta\\ge a$로 $Y_\\beta^{\\gamma_\\beta}\\le a^{\\gamma_\\beta}$. 식 3, 4. $a,b$는 $U$ 전체에서 같은 경계다(diff-e1, 문맥 FD).", "flag": "균일 경계 전체를 작성자가 채웠다. 원문은 trees.tex 173–176에서 밀도와 그 도함수의 경계를 해석적 경계로 말한다."}]}, "edgesOut": [{"id": "e2", "rawId": "diff-e2", "kind": "흐름", "to": "leaf 항: 상쇄와 protected", "stmt": "고정한 tree $\\mathcal T$와 $U$의 각 $\\boldsymbol t$, old tree의 각 표본값에서 $\\partial=\\partial_{t_j}$에 대해 $$\\partial\\log A^a=\\frac{D_j^a}{A^a}\\quad(a\\in\\operatorname{Leaves}(\\mathcal T)),\\qquad \\partial\\log W_{\\mathcal T}(A)=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\frac{D_j^a}{A^a}+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,\\partial\\log Y_\\beta .$$ $\\gamma_\\beta$는 $\\boldsymbol t$와 표본 변수에 무관한 상수이고 $\\partial\\log Y_\\beta$는 β의 prefix의 함수로 $U$에서 존재한다. $U$ 위에서 균일하게 $$0<W_{\\mathcal T}(A)\\le M_W:=b^{|\\operatorname{Leaves}(\\mathcal T)|}a^{\\sum_\\beta\\gamma_\\beta},\\qquad \\sup_{\\text{leaf}}\\Bigl|\\frac{D_j}{A}\\Bigr|\\le\\frac{\\|D_j\\|_\\infty}{a},\\qquad |\\partial\\log Y_\\beta|\\le\\frac{\\|D_j\\|_\\infty}{a}.$$", "by": "식 2, 4, 5", "src": "trees.tex 98–110, 142–154, 184–191"}, {"id": "e3", "rawId": "diff-e3", "kind": "흐름", "to": "내부 vertex 항: fresh path", "stmt": "로그 밀도의 내부 항은 $\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\partial\\log Y_\\beta$이다. $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$에서 $n_\\beta$는 미분 전 old tree의 자식 수이며 매개변수와 무관하다. $Y_\\beta$는 깊이 $d_\\beta$의 prefix에서 평가한다. 여기서는 이 항에 기존 적분 인자를 곱한 기여를 재표현한다.", "by": "식 1, 4. 내부 항, old tree의 $n_\\beta$, prefix에서 평가한 $Y_\\beta$.", "src": "trees.tex 180–202"}], "checks": [["$\\log Y_\\beta$가 $\\boldsymbol t$에 대해 미분 가능한 근거는?", "diff-e11(D2 kernel_form)이 $U$의 각 점에서 $\\partial\\log Y_d$를 준다. 식 3이 $d=d_\\beta$를 대입한다."], ["$\\gamma_\\beta$가 매개변수에 무관한가?", "지수 $m$은 고정(diff-e1)이고 $d_\\beta,n_\\beta$는 고정한 tree의 자료다. 단 $d_\\beta,n_\\beta$의 정의는 O1에 없다."], ["식 5의 경계가 $U$ 전체에서 균일한가?", "$a,b$가 $U$ 전체의 경계(fv_inputs.insertion 항목의 $U$)이므로 균일하다. D3의 교환에 쓴다."], ["d_β·n_β·Y_β의 정의는 어디서 오는가?", "diff-e13가 top.O1.outputs.tree_defs의 해당 항목을 고른다. 통합 때 원문 줄과 대조해 O1에 given 출력으로 더했다."]], "open": []}, "D3": {"map": "diff", "atomic": true, "title": "leaf 항: 상쇄와 protected", "label": "vertex 보기 (미완결)", "where": "", "source": "trees.tex 180–196", "context": ["$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방. $G$ 는 유계이고 $\\boldsymbol t$ 에 무관."], "floor": ["연쇄 법칙과 곱의 미분", "유한 합의 항별 미분과 기대값의 선형성", "적분 기호 아래의 미분: 도함수가 매개변수 근방에서 균일 유계이면 평균값 정리와 유계 수렴 정리로 미분과 기대값을 바꾼다", "유한 곱의 재배열"], "premiseMode": "legacy", "introductions": [], "edgesIn": [{"id": "e2", "rawId": "diff-e2", "kind": "흐름", "from": "밀도의 로그를 미분", "stmt": "고정한 tree $\\mathcal T$와 $U$의 각 $\\boldsymbol t$, old tree의 각 표본값에서 $\\partial=\\partial_{t_j}$에 대해 $$\\partial\\log A^a=\\frac{D_j^a}{A^a}\\quad(a\\in\\operatorname{Leaves}(\\mathcal T)),\\qquad \\partial\\log W_{\\mathcal T}(A)=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\frac{D_j^a}{A^a}+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,\\partial\\log Y_\\beta .$$ $\\gamma_\\beta$는 $\\boldsymbol t$와 표본 변수에 무관한 상수이고 $\\partial\\log Y_\\beta$는 β의 prefix의 함수로 $U$에서 존재한다. $U$ 위에서 균일하게 $$0<W_{\\mathcal T}(A)\\le M_W:=b^{|\\operatorname{Leaves}(\\mathcal T)|}a^{\\sum_\\beta\\gamma_\\beta},\\qquad \\sup_{\\text{leaf}}\\Bigl|\\frac{D_j}{A}\\Bigr|\\le\\frac{\\|D_j\\|_\\infty}{a},\\qquad |\\partial\\log Y_\\beta|\\le\\frac{\\|D_j\\|_\\infty}{a}.$$", "src": "trees.tex 98–110, 142–154, 184–191"}, {"id": "e10", "rawId": "diff-e10", "kind": "정의", "from": "대상: tree와 삽입", "stmt": "$E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$. $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$이고 $G$가 old tree 변수의 유계 함수일 때 $$F[\\mathcal T,C,G]:=E^A_{\\mathcal T}\\left[G\\prod_{a\\in C}(A^a)^{-1}\\right].$$ $C$는 삽입 밀도의 leaf 인자가 상쇄된 protected 집합이다. $G$와 $D_j$는 $\\boldsymbol t$에 무관하며, $A=1+\\sum_jt_jD_j$이다. 미분 계산에서는 원래 kernel 열과 지수 $m_d$를 고정한다. $D_j$는 유계 실수 path 함수이고, $U$는 $0<a\\le A_{\\boldsymbol t}\\le b$인 실수 근방이다. (top.O1의 진술과 fv_inputs.insertion 항목에서 옮김.)", "src": "trees.tex 67–82, 142–145, 180–183"}, {"id": "e14", "rawId": "diff-e14", "kind": "정의", "from": "대상: tree와 삽입", "stmt": "유한 tree $\\mathcal T$ 는 공통 root와 깊이 $L$ 에서 끝나는 유한 개의 path로 이루어진다. 내부 vertex는 자식이 하나 이상이고, 자식이 하나뿐인 구간도 그대로 둔다. $\\operatorname{Leaves}(\\mathcal T)$ 는 깊이 $L$ 의 끝 vertex, $\\operatorname{Int}(\\mathcal T)$ 는 내부 vertex의 집합이다. (trees.tex 29–31, 97–104)\n\n각 vertex에서 서로 다른 자식은 해당 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 이 표본 추출의, root가 주어진 기대값이다. (trees.tex 32–34)", "src": "trees.tex 29–34"}], "node": {"kind": "원자 node — 계산 하나", "chain": [{"expr": "$$\\Psi:=W_{\\mathcal T}(A)\\prod_{a\\in C}(A^a)^{-1}>0,\\qquad F[\\mathcal T,C,G]=E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\Bigr]=E_{\\mathcal T}[G\\Psi].$$", "by": "diff-e10의 $F$ 정의와 $E^A_{\\mathcal T}[\\cdot]=E_{\\mathcal T}[\\cdot\\,W_{\\mathcal T}(A)]$. diff-e2의 $W>0$과 diff-e10의 $A\\ge a>0$. $E_{\\mathcal T}$가 원래 kernel로 tree를 뽑는 root 조건부 평균이라 $\\boldsymbol t$에 무관하다는 것은 trees.tex 32–34의 정의이고 O1이 싣지 않는다(review.open). 이 정의는 diff-e14(top.O1.outputs.tree_defs)가 싣는다."}, {"expr": "$$\\partial\\log\\Psi=\\partial\\log W_{\\mathcal T}(A)-\\sum_{a\\in C}\\frac{D_j^a}{A^a}=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)\\setminus C}\\frac{D_j^a}{A^a}+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,\\partial\\log Y_\\beta .$$", "by": "식 1의 로그를 미분한다. diff-e2의 $\\partial\\log A^a=D_j^a/A^a$와 $\\partial\\log W$의 식. $a\\in C$의 leaf 항 $+D_j^a/A^a$는 분모 $(A^a)^{-1}$의 미분 $-D_j^a/A^a$와 정확히 상쇄된다."}, {"expr": "$$\\partial(G\\Psi)=G\\Psi\\,\\partial\\log\\Psi,\\qquad \\sup_{U}|\\partial(G\\Psi)|\\le\\|G\\|_\\infty\\,a^{-|C|}M_W\\Bigl(|\\operatorname{Leaves}(\\mathcal T)\\setminus C|+\\sum_\\beta|\\gamma_\\beta|\\Bigr)\\frac{\\|D_j\\|_\\infty}{a}.$$", "by": "$G$는 유계이고 $\\boldsymbol t$에 무관하다(문맥 FD, diff-e10). $\\Psi>0$이므로 $\\partial\\Psi=\\Psi\\,\\partial\\log\\Psi$. 경계는 diff-e2의 $W\\le M_W$, $|D_j/A|\\le\\|D_j\\|_\\infty/a$, $|\\partial\\log Y_\\beta|\\le\\|D_j\\|_\\infty/a$와 diff-e10의 $A\\ge a$.", "flag": "균일 경계는 원문에 없다. 원문은 trees.tex 173–176의 해석적 경계로 갈음한다."}, {"expr": "$$\\partial F[\\mathcal T,C,G]=E_{\\mathcal T}\\bigl[G\\Psi\\,\\partial\\log\\Psi\\bigr]\\qquad(U\\text{의 각 점}).$$", "by": "식 1에서 $F=E_{\\mathcal T}[G\\Psi]$이고 $E_{\\mathcal T}$는 $\\boldsymbol t$에 무관하다. 식 3의 균일 경계로 차분몫이 평균값 정리에 의해 같은 상수로 유계이므로 유계 수렴으로 미분과 기대값을 바꾼다. $U$가 근방이므로 충분히 작은 증분의 선분은 $U$ 안에 있다. 이 정의는 diff-e14(top.O1.outputs.tree_defs)가 싣는다.", "flag": "미분과 기대값의 교환 정당화를 작성자가 채웠다. 원문 184–194는 교환을 말없이 쓰고 정당화는 156–176의 해석적 경계에 맡긴다."}, {"expr": "$$E_{\\mathcal T}\\Bigl[G\\Psi\\,\\frac{D_j^a}{A^a}\\Bigr]=E^A_{\\mathcal T}\\Bigl[GD_j^a\\prod_{a'\\in C\\cup\\{a\\}}(A^{a'})^{-1}\\Bigr]=F[\\mathcal T,C\\cup\\{a\\},GD_j^a]\\quad(a\\notin C),$$ $$E_{\\mathcal T}\\bigl[G\\Psi\\,\\gamma_\\beta\\,\\partial\\log Y_\\beta\\bigr]=\\gamma_\\beta\\,E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial\\log Y_\\beta\\Bigr].$$", "by": "diff-e10의 $F$ 정의와 $E^A_{\\mathcal T}=E_{\\mathcal T}[\\cdot\\,W]$. $GD_j^a$는 old tree 변수의 유계 함수이고 $\\boldsymbol t$에 무관하다(diff-e10: $D_j$ 유계·매개변수 무관). $C\\cup\\{a\\}\\subseteq\\operatorname{Leaves}(\\mathcal T)$이므로 $F$의 인자로 쓸 수 있고, leaf $a$는 이제 protected다. $\\gamma_\\beta$는 상수(diff-e2)."}, {"expr": "$$\\partial F[\\mathcal T,C,G]=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)\\setminus C}F[\\mathcal T,C\\cup\\{a\\},GD_j^a]+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial\\log Y_\\beta\\Bigr].$$", "by": "식 4에 식 2를 넣고 유한 합을 항마다 기대값으로 가른 뒤 식 5로 바꾼다. leaf 항의 계수는 $+1$."}]}, "edgesOut": [{"id": "e6", "rawId": "diff-e6", "kind": "흐름", "to": "미분 규칙", "stmt": "고정한 tree $\\mathcal T$, protected 집합 $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$, $\\boldsymbol t$에 무관한 유계 $G$에 대해 $U$의 각 점에서 $$\\partial_{t_j}F[\\mathcal T,C,G]=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)\\setminus C}F[\\mathcal T,\\,C\\cup\\{a\\},\\,GD_j^a]+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,E^A_{\\mathcal T}\\!\\left[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial_{t_j}\\log Y_\\beta\\right].$$ $a\\in C$의 leaf 항은 분모의 미분과 상쇄된다. 남은 leaf 항의 계수는 $+1$이고 그 leaf는 protected가 된다. 각 $GD_j^a$는 old tree 변수의 유계 함수로 $\\boldsymbol t$에 무관하다. $D_j$는 유계이고 매개변수에 무관하다. 계수 $\\gamma_\\beta$는 미분 전 tree의 값이다.", "by": "식 4–6. 식 5의 $GD_j^a$ 유계·매개변수 무관.", "src": "trees.tex 180–196"}], "checks": [["이미 protected인 leaf의 항이 남지 않는가?", "식 2에서 $a\\in C$의 $+D_j^a/A^a$가 분모의 미분과 지워진다."], ["새 상태 $F[\\mathcal T,C\\cup\\{a\\},GD_j^a]$가 $F$의 정의역 안인가?", "$GD_j^a$는 유계이고 $\\boldsymbol t$에 무관하며 $C\\cup\\{a\\}\\subseteq\\operatorname{Leaves}(\\mathcal T)$다(식 5)."], ["미분과 기대값의 교환 근거는?", "식 3의 $U$ 위 균일 경계와 바닥 3(평균값 정리·유계 수렴). 원문의 근거(156–176 해석적 경계)와 다른 길이라 author_filled로 적었다."], ["E_T의 정의는 어디서 오는가?", "diff-e14가 top.O1.outputs.tree_defs의 해당 항목을 고른다. 통합 때 원문 줄과 대조해 O1에 given 출력으로 더했다."]], "open": []}, "OUT": {"map": "diff", "atomic": true, "title": "미분 규칙", "label": "vertex 보기 (미완결)", "where": "", "source": "trees.tex 178–202, 299–301", "context": ["$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방. $G$ 는 유계이고 $\\boldsymbol t$ 에 무관."], "floor": ["등식의 대입", "유한 합의 재배열"], "premiseMode": "legacy", "introductions": [], "edgesIn": [{"id": "e6", "rawId": "diff-e6", "kind": "흐름", "from": "leaf 항: 상쇄와 protected", "stmt": "고정한 tree $\\mathcal T$, protected 집합 $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$, $\\boldsymbol t$에 무관한 유계 $G$에 대해 $U$의 각 점에서 $$\\partial_{t_j}F[\\mathcal T,C,G]=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)\\setminus C}F[\\mathcal T,\\,C\\cup\\{a\\},\\,GD_j^a]+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,E^A_{\\mathcal T}\\!\\left[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial_{t_j}\\log Y_\\beta\\right].$$ $a\\in C$의 leaf 항은 분모의 미분과 상쇄된다. 남은 leaf 항의 계수는 $+1$이고 그 leaf는 protected가 된다. 각 $GD_j^a$는 old tree 변수의 유계 함수로 $\\boldsymbol t$에 무관하다. $D_j$는 유계이고 매개변수에 무관하다. 계수 $\\gamma_\\beta$는 미분 전 tree의 값이다.", "src": "trees.tex 180–196"}, {"id": "e7", "rawId": "diff-e7", "kind": "흐름", "from": "내부 vertex 항: fresh path", "stmt": "각 old 내부 vertex $\\beta$에서 $$\\gamma_\\beta E^A_{\\mathcal T}\\left[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial\\log Y_\\beta\\right]=\\gamma_\\beta F[\\mathcal T\\oplus\\beta,C\\cup\\{x\\},GD_j^x].$$ 새 leaf $x$는 protected다. $G$는 old 변수 전부에 의존해도 되며, 계수 $\\gamma_\\beta$는 추가 전 tree의 값이다. 이 등식을 유한한 내부 vertex들에 대해 더할 수 있다.", "src": "trees.tex 180–202"}], "node": {"kind": "원자 node — 계산 하나", "chain": [{"expr": "$$\\partial F[\\mathcal T,C,G]=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)\\setminus C}F[\\mathcal T,C\\cup\\{a\\},GD_j^a]+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\,\\partial\\log Y_\\beta\\Bigr].$$", "by": "diff-e6."}, {"expr": "$$\\partial F[\\mathcal T,C,G]=\\sum_{a\\notin C}F[\\mathcal T,\\,C\\cup\\{a\\},\\,GD_j^a]+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,F[\\mathcal T\\oplus\\beta,\\,C\\cup\\{x_\\beta\\},\\,GD_j^{x_\\beta}].$$ $\\mathcal T\\oplus\\beta$는 β에 새 path를 붙인 tree, $x_\\beta$는 그 새 leaf(diff-e7의 $x$).", "by": "diff-e7의 등식을 각 old 내부 vertex β에서 식 1의 β 항에 대입한다. 내부 vertex는 유한 개이고 계수 $\\gamma_\\beta$는 추가 전 tree의 값 그대로다."}, {"expr": "식 2의 각 항은 다시 $F[\\mathcal T',C',G']$ 꼴이다: $\\mathcal T'\\in\\{\\mathcal T,\\mathcal T\\oplus\\beta\\}$, $C'\\subseteq\\operatorname{Leaves}(\\mathcal T')$, $G'\\in\\{GD_j^a,\\,GD_j^{x_\\beta}\\}$는 유계이고 $\\boldsymbol t$에 무관하다. 그래서 규칙을 반복 적용할 수 있다.", "by": "diff-e6의 $GD_j^a$ 유계·매개변수 무관과 $D_j$ 유계·매개변수 무관, diff-e7의 '새 leaf $x$는 /* 노드 장애물을 피하는 연결선과 선 위의 라벨 기준점. DOM에 의존하지 않는다. */
function routeHits(a,b,r,pad=9){
  const minX=r.x-pad,maxX=r.x+r.w+pad,minY=r.y-pad,maxY=r.y+r.h+pad;
  let lo=0,hi=1;
  for(const [start,delta,min,max] of [[a[0],b[0]-a[0],minX,maxX],[a[1],b[1]-a[1],minY,maxY]]){
    if(Math.abs(delta)<1e-9){if(start<min||start>max)return false;}
    else{let u=(min-start)/delta,v=(max-start)/delta;if(u>v)[u,v]=[v,u];lo=Math.max(lo,u);hi=Math.min(hi,v);if(lo>hi)return false;}
  }
  return true;
}
function routeLength(points){let len=0;for(let i=1;i<points.length;i++)len+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);return len;}
function edgeRoute(a,b,obstacles){
  const clip=(r,tx,ty)=>{const cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;const k=Math.min(dx?(r.w/2+3)/Math.abs(dx):1e9,dy?(r.h/2+3)/Math.abs(dy):1e9);return [cx+dx*k,cy+dy*k];};
  const direct=[clip(a,b.x+b.w/2,b.y+b.h/2),clip(b,a.x+a.w/2,a.y+a.h/2)];
  const hits=points=>obstacles.reduce((sum,r)=>sum+points.slice(1).filter((p,i)=>routeHits(points[i],p,r)).length,0);
  if(!hits(direct))return direct;
  const ys=[...obstacles.flatMap(r=>[r.y-25,r.y+r.h+25]),Math.min(a.y,b.y)-30,Math.max(a.y+a.h,b.y+b.h)+30];
  let best=null;
  for(const y of ys){
    const start=[a.x+a.w/2,y<a.y+a.h/2?a.y-3:a.y+a.h+3];
    const end=[b.x+b.w/2,y<b.y+b.h/2?b.y-3:b.y+b.h+3];
    const points=[start,[start[0],y],[end[0],y],end];
    // 자기 양 끝 상자를 다시 가로지르는 우회 경로도 배제한다.
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);
    const score=100000*hits(points)+(selfCross?100000:0)+routeLength(points);
    if(!best||score<best.score)best={points,score};
  }
  const xs=[...obstacles.flatMap(r=>[r.x-25,r.x+r.w+25]),Math.min(a.x,b.x)-30,Math.max(a.x+a.w,b.x+b.w)+30];
  for(const x of xs){
    const start=[x<a.x+a.w/2?a.x-3:a.x+a.w+3,a.y+a.h/2];
    const end=[x<b.x+b.w/2?b.x-3:b.x+b.w+3,b.y+b.h/2];
    const points=[start,[x,start[1]],[x,end[1]],end];
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);

function boundaryCheck(mapId){

  const missing = [...want].filter(x => !have.has(x));

function layoutRest(m, maxc, maxr){
  const rect = id => { const el = canvas.querySelector(`.node[data-id="${id}"]`); return {x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight}; };
  let H = 0; m.nodes.forEach(n => { const r = rect(n.id); H = Math.max(H, r.y + r.h); });
  const W = PADX*2 + maxc*COLW + NW; H += PADY + 10;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const fit = Math.max(0.62, Math.min(1, ($('#stage').clientWidth - 32) / W));
  canvas.style.transformOrigin = '0 0'; canvas.style.transform = `scale(${fit})`;
  canvas.style.marginBottom = (-(H * (1 - fit))) + 'px'; canvas.style.marginRight = (-(W * (1 - fit))) + 'px';
  // frames
  m.frames.forEach(f => {
    let x0=1e9,y0=1e9,x1=0,y1=0;
    f.nodes.forEach(id => { const r = rect(id); x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); });
    const d = document.createElement('div'); d.className = 'frame';
    d.style.left = (x0-14)+'px'; d.style.top = (y0-52)+'px'; d.style.width = (x1-x0+28)+'px'; d.style.height = (y1-y0+64)+'px';
    d.innerHTML = `<div class="cap">${esc(f.cap)}</div>`;
    d.style.pointerEvents = 'none';
    canvas.insertBefore(d, canvas.firstChild);
    tex(d);
  });
  // edges
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
  const sel = getComputedStyle(document.documentElement).getPropertyValue('--sel').trim();
  let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ink}"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${muted}"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${sel}"/></marker></defs>`;
  const clip = (r, tx, ty) => { // 상자 중심에서 (tx,ty) 방향으로 나가 테두리와 만나는 점
    const cx = r.x + r.w/2, cy = r.y + r.h/2, dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return [cx, cy];
    const k = Math.min(dx ? (r.w/2 + 3)/Math.abs(dx) : 1e9, dy ? (r.h/2 + 3)/Math.abs(dy) : 1e9);
    return [cx + dx*k, cy + dy*k];
  };
  const occupied = m.nodes.map(n => rect(n.id));
  const labels = [];
  const overlaps = (a,b,pad=5) => a.x < b.x+b.w+pad && a.x+a.w+pad > b.x && a.y < b.y+b.h+pad && a.y+a.h+pad > b.y;
  m.edges.forEach((e, i) => {
    const a = rect(e.from), b = rect(e.to);
    const loop = e.from === e.to;
    let [x1,y1] = clip(a, b.x + b.w/2, b.y + b.h/2), [x2,y2] = clip(b, a.x + a.w/2, a.y + a.h/2);
    if (loop){ x1 = a.x + a.w*0.68; x2 = a.x + a.w*0.32; y1 = y2 = a.y + a.h + 3; }
    const route = loop ? null : edgeRoute(a,b,m.nodes.filter(n => n.id !== e.from && n.id !== e.to).map(n => rect(n.id)));
    const isSel = selEdge === i;
    const col = isSel ? sel : (e.type === 'def' ? muted : ink);
    const dash = e.type === 'call' ? ' stroke-dasharray="6 4"' : '';
    const wdt = (e.type === 'def' ? 1 : 1.6) + (e.member ? 1.4 : 0);
    const mk = isSel ? 'ahs' : (e.type === 'def' ? 'ahm' : 'ah');
    s += loop ? `<path d="M${x1},${y1} C${x1+30},${y1+70} ${x2-30},${y1+70} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${wdt}"${dash} marker-end="url(#${mk})"/>` : `<polyline data-edge="${esc(e.id)}" points="${route.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${wdt}"${dash} marker-end="url(#${mk})"/>`;
    const l = document.createElement('button'); l.type = 'button';
    l.className = 'elabel' + (isSel ? ' sel' : '') + (!e.contentComplete ? ' pending' : '') + (e.open || e.contractIssues.length ? ' open-edge' : '');
    const status = e.contractIssues.length ? '출력 대응 재검토 필요' : e.open ? '열린 연결' : (e.contentComplete ? '내용 완결' : '내용 미작성');
    l.title = `${e.id} · ${e.caption} · ${status}`;
    l.setAttribute('aria-label', `${e.displayId} ${e.caption} — ${status}`);
    l.innerHTML = `<span class="edge-id">${esc(e.displayId)}</span>${showPass ? ' · ' + esc(e.caption) : ''}${e.open || e.contractIssues.length ? '<span class="edge-pending">!</span>' : (!e.contentComplete ? '<span class="edge-pending">?</span>' : '')}`;
    l.onclick = ev => { ev.stopPropagation(); selEdge = i; selNode = null; render(); };
    canvas.appendChild(l);
    const lw = l.offsetWidth, lh = l.offsetHeight;
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
    let best = null;
    const slots = loop ? [0.5] : [0.5,0.35,0.65,0.2,0.8];
    for (const t of slots) for (const offset of [0,18,-18,36,-36,54,-54]){
      const anchor = loop ? {x:(x1+x2)/2,y:y1+65,dx:1,dy:0} : routePoint(route,t);
      const cx = anchor.x-anchor.dy*offset;
      const cy = anchor.y+anchor.dx*offset;
      const box = {x:cx-lw/2,y:cy-lh/2,w:lw,h:lh};
      const score = 10000*occupied.filter(r => overlaps(box,r)).length + 1000*labels.filter(r => overlaps(box,r)).length + Math.abs(offset) + 100*Math.abs(t-0.5);
      if (!best || score < best.score) best = {cx,cy,box,score,anchor,offset};
    }
    if (Math.abs(best.offset)>10) s += `<line x1="${best.anchor.x}" y1="${best.anchor.y}" x2="${best.cx}" y2="${best.cy}" stroke="${muted}" stroke-width="0.7" stroke-dasharray="2 3"/>`;
    l.dataset.edgeId = e.id;
    l.style.left = best.cx + 'px'; l.style.top = best.cy + 'px'; labels.push(best.box);

  });
  svg.innerHTML = s;
}

  }
  h += `<div class="vgrid"><div><h3>받는 edge ${v.edgesIn.length}개</h3>${v.edgesIn.map(e => ecard(e,'in')).join('')}</div>`;
  h += `<div><h3>node</h3><div class="vc step"><div class="hd"><b>${esc(v.title)}</b><span class="tag">${esc(v.node.kind)}</span></div>${v.node.chain.map((c,i) => `<div class="chain"><div class="cn">식 ${i+1}</div><div class="formula">${esc(c.expr)}</div><div class="row"><span class="lab">근거</span>${esc(c.by)}</div>${c.flag ? `<div class="flag">${esc(c.flag)}</div>` : ''}</div>`).join('')}</div></div>`;
  h += `<div><h3>보내는 edge ${v.edgesOut.length}개</h3>${v.edgesOut.map(e => ecard(e,'out')).join('')}</div></div>`;
  el.innerHTML = h; tex(el);
  let q = `<h2>검사</h2><div class="kind">vertex · 입력과 명시적 도입 ⊢ 출력</div><dl>`;
  v.checks.forEach(c => { q += `<dt>${esc(c[0])}</dt><dd>${esc(c[1])}</dd>`; });
  q += `<dt>판정이 필요한 것</dt><dd><ul>${v.open.map(x => `<li>${esc(x)}</li>`).join('')}</ul></dd>`;
  q += `<dt>근거</dt><dd>${esc(v.source)}<br>상태: ${PROPOSED}</dd></dl><p class="note">검사표는 작성자가 손으로 채운 것이고 기계가 확인한 것이 아니다.</p>`;
  panel.innerHTML = q; tex(panel);
}

function renderVertex(){
  const id = cur.slice(2), v = VERTEX[id];
  mapStatus(MAPS[v.map]);
  canvas.style.display = 'none'; const el = $('#vertex'); el.style.display = 'block';
  const chain = []; let c = v.map; while (c){ chain.unshift(c); c = MAPS[c].parent ? MAPS[c].parent.map : null; }
  $('#crumbs').innerHTML = chain.map(m => `<a data-go="${m}">${esc(MAPS[m].title)}</a>`).join(' › ') + ` › <b>${esc(v.title)}</b>`;
  $('#crumbs').querySelectorAll('a').forEach(a => a.onclick = () => go(a.dataset.go));
  if (v.atomic) return renderAtomic(v);
  const cls = t => t === '호출' ? 'call' : (t === '정의' ? 'def' : '');
  let h = `<h2>${esc(v.title)}</h2><div class="claim">${esc(v.claim)}</div>`;
  h += `<h3>문맥 (context)</h3><div class="vc ctx"><ul>${v.context.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h += `<h3>받는 화살표 ${v.inputs.length}개 — 넘어오는 내용 전체</h3>`;
  v.inputs.forEach(i => {
    h += `<div class="vc in ${cls(i.type)}"><div class="hd"><span class="tag">${i.id}</span><b>${esc(i.from)}</b><span class="tag">${i.type}</span></div><div class="row formula">${esc(i.stmt)}</div>`;
    if (i.inst) h += `<div class="row"><span class="lab">대입</span>${esc(i.inst)}</div>`;
    h += `<div class="row"><span class="lab">맞음</span>${esc(i.fit)}</div><div class="row"><span class="lab">오지 않는 것</span>${esc(i.nottaken)}</div><div class="row"><span class="lab">근거</span>${esc(i.src)}</div></div>`;
  });
  h += `<div class="arrowdown">↓</div><h3>상자 안의 유도 ${v.steps.length}걸음</h3>`;
  v.steps.forEach(st => { h += `<div class="vc step"><div class="hd"><span class="tag">${st.n}</span><span class="tag">쓰는 것: ${esc(st.uses)}</span></div><div class="row formula">${esc(st.text)}</div>${st.flag ? `<div class="flag">${esc(st.flag)}</div>` : ''}</div>`; });
  h += `<div class="arrowdown">↓</div><h3>보내는 화살표 ${v.outputs.length}개 — 넘기는 내용 전체</h3>`;
  v.outputs.forEach(o => { h += `<div class="vc out"><div class="hd"><span class="tag">${o.id}</span><b>→ ${esc(o.to)}</b></div><div class="row formula">${esc(o.stmt)}</div><div class="row"><span class="lab">유도</span>걸음 ${esc(o.by)}</div><div class="row"><span class="lab">근거</span>${esc(o.src)}</div></div>`; });
  el.innerHTML = h; tex(el);
  let q = `<h2>검사</h2><div class="kind">펼친 상자 · ${esc(v.kind)}</div><dl>`;
  q += `<dt>보내는 화살표가 모두 유도되는가</dt><dd><ul>${v.outputs.map(o => `<li>${o.id} ← 걸음 ${esc(o.by)}</li>`).join('')}</ul></dd>`;
  q += `<dt>걸음이 받는 것과 문맥만 쓰는가</dt><dd><ul>${v.steps.map(st => `<li>${st.n}: ${esc(st.uses)}</li>`).join('')}</ul></dd>`;
  q += `<dt>기호가 어디서 정의되는가</dt><dd><ul>${v.symbols.map(x => `<li>${esc(x[0])} — ${esc(x[1])}</li>`).join('')}</ul></dd>`;
  q += `<dt>완결하면서 드러난 것</dt><dd><ul>${v.found.map(x => `<li>${esc(x)}</li>`).join('')}</ul></dd>`;
  q += `<dt>근거</dt><dd>${esc(v.source)}<br>상태: ${PROPOSED}</dd></dl>`;
  q += `<p class="note">이 검사표는 작성자가 손으로 채운 것이고 기계가 확인한 것이 아니다. 유도 4의 붉은 글은 원문에 없는 걸음을 작성자가 채웠다는 표시다.</p>`;
  panel.innerHTML = q; tex(panel);
}

function showPanel(){
  const m = MAPS[cur];
  let h = '';
  if (selNode){
    const n = m.nodes.find(x => x.id === selNode);
    const name = id => { const x = m.nodes.find(y => y.id === id) || MAPS["top"].nodes.find(y => y.id === id); return x ? x.title : id; };
    h += `<h2>${esc(n.title)}</h2><div class="kind">${KIND[n.kind]}${n.type && n.type !== '-' ? ' · 유형 ' + esc(n.type) : ''}</div><dl>`;
    h += auditPanel(n);
    h += inputCoverage(n);
    const fr = m.frames.filter(f => f.nodes.includes(n.id));
    if (fr.length) h += `<dt>틀의 전제</dt><dd>${fr.map(f => esc(f.cap.replace(/^틀:\s*/, ''))).join('<br>')}</dd>`;
    h += `<dt>받는 것</dt><dd>`;
    if (!n.in.length) h += n.kind === 'ext' ? '이 장의 밖에서 온다.' : (m.premiseMode === 'edges_only' ? '별도 입력 없음.' : '틀의 전제 외에 없음.');
    n.in.forEach(id => {
      const src = m.nodes.find(y => y.id === id) || MAPS["top"].nodes.find(y => y.id === id);
      const e = m.edges.find(x => x.from === id && x.to === n.id);
      const tn = e ? {flow:'흐름', call:'호출', def:'정의'}[e.type] : '정의';
      h += `<div class="recv"><div class="rh"><b>${esc(src ? src.title : id)}</b> <span class="tag">${tn}</span></div>`;
      if (e && e.stmt) h += `<div class="rl"><span class="lab">edge ${esc(e.id)}</span>${esc(e.stmt)}</div>`;
      else if (e && e.type === 'flow' && e.pass) h += `<div class="rl"><span class="lab">넘어오는 것</span>${esc(e.pass)}</div>`;
      if (!e) h += '<div class="node-warning">입력 edge가 없습니다. 아래 원본 진술은 참고이며 이 vertex에 전달된 내용이 아닙니다.</div>';
      const so = src ? full(src).out : '', sc = src ? full(src).cond : [];
      if (so && !(e && e.stmt)) h += `<details${e && e.type === 'flow' ? '' : ' open'}><summary>${e && e.type === 'flow' ? '보낸 상자의 진술 전체' : '진술'}</summary><div class="formula">${esc(so)}</div>${sc.length ? '<div class="rl"><span class="lab">그 조건</span>' + sc.map(esc).join(' ') + '</div>' : ''}</details>`;
      if (e && e.inst) h += `<div class="rl"><span class="lab">대입</span>${esc(e.inst)}</div>`;
      if (e && e.fit) h += `<div class="rl"><span class="lab">맞음</span>${esc(e.fit)}</div>`;
      h += `</div>`;
    });
    h += `</dd>`;
    h += `<dt>조건</dt><dd>${full(n).cond.length ? '<ul>' + full(n).cond.map(c => `<li>${esc(c)}</li>`).join('') + '</ul>' : (m.premiseMode === 'edges_only' ? '가정·대상 정의는 입력 edge에 포함됩니다.' : '틀의 전제 외에 없음')}</dd>`;
    h += `<dt>${n.coverage.pending.length && n.coverage.bodyMode !== 'reference' ? '기존 전체 본문 · 선택 출력과 별도' : '주는 것'}</dt><dd class="formula">${esc(full(n).out || '—')}</dd>`;
    if (Object.keys(n.outputs).length) h += `<dt>이름 붙은 출력</dt><dd>${Object.entries(n.outputs).map(([key,o]) => `<code>${esc(key)}</code> · ${esc(o.title || key)}<br>유도: ${o.proof ? esc(o.proof.graph) + ' / ' + esc(o.proof.node) : '선언된 외부 가정·정의·인용 사실'}`).join('<br>')}</dd>`;
    const outs = m.edges.filter(x => x.from === n.id);
    if (outs.length) h += `<dt>쓰이는 곳</dt><dd><ul>${outs.map(x => `<li>${esc(m.nodes.find(y => y.id === x.to).title)}${x.inst ? ' — ' + esc(x.inst) : ''}${x.stmt ? ' — edge ' + esc(x.id) : ''}</li>`).join('')}</ul></dd>`;
    h += `<dt>근거</dt><dd>${n.cards.length ? n.cards.map(c => `<code>${esc(c)}</code>`).join(', ') : '—'}${n.source ? '<br>' + esc(n.source) : ''}${n.cards.length ? '<br>상태: ' + PROPOSED : ''}</dd>`;
    h += `<dt>library 대응</dt><dd>${esc(n.lib || '—')}</dd>`;
    const cc = callCount(cur, n.id); if (cc) h += `<dt>이 장에서 호출되는 횟수</dt><dd>${cc}곳</dd>`;
    if (n.note) h += `<dt>메모</dt><dd>${esc(n.note)}</dd>`;
    if (n.example) h += `<dt>예로 확대</dt><dd>${esc(n.example)}</dd>`;
    h += `</dl>`;
    if (VERTEX[n.id] && VERTEX[n.id].map === cur) h += `<button class="zoom" data-go="v:${n.id}">${esc(VERTEX[n.id].label)} ◆</button>`;
    if (n.zoom){
      const g = groundCount(n.zoom), b = boundaryCheck(n.zoom);
      h += `<button class="zoom" data-go="${n.zoom}">증명으로 확대 ▸</button>`;
      h += `<div class="check ${b.ok ? 'ok' : 'bad'}">닿는 면: ${b.ok ? '일치' : '불일치'}${b.missing.length ? ' · 하위 지도에 없는 입력: ' + b.missing.map(name).join(', ') : ''}${b.extra.length ? ' · 상자에 없는 입력: ' + b.extra.map(name).join(', ') : ''}<br>하위 지도의 상자 ${g.all}개 가운데 카드에 닿는 것 ${g.grounded}개. 사용자 확인(confirmed) 0개.</div>`;
    }
  } else if (selEdge !== null){
    const e = m.edges[selEdge];
    const a = m.nodes.find(x => x.id === e.from), b = m.nodes.find(x => x.id === e.to);
    const tn = {flow:'흐름', call:'호출', def:'정의'}[e.type];
    h += `<h2>edge ${esc(e.displayId)} · ${esc(e.caption)}</h2><div class="kind"><code>${esc(e.id)}</code> · ${tn} · ${e.open ? '열린 연결' : (e.contentComplete ? '내용 완결' : '내용 미작성')}</div><dl>${e.outputRef ? '<dt>연결 검토</dt><dd>' + (e.contractIssues.length ? '재검토 필요' : (MAPS[e.outputRef.graph].nodes.find(n => n.id === e.outputRef.node).outputs[e.outputRef.output].role === 'given' ? '선언 입력 항목 참조 연결 · 기존 전체 본문 대응은 별도 검토' : '출력 참조 연결됨 · 검토 기록 일치')) + '</dd><dt>참조 출력</dt><dd><code>' + esc(e.outputRef.graph + '/' + e.outputRef.node + '.' + e.outputRef.output) + '</code></dd>' : ''}${e.contractIssues.length ? '<dt>출력 대응 문제</dt><dd class="node-warning">' + e.contractIssues.map(esc).join('<br>') + '</dd>' : ''}${e.useNote ? '<dt>받는 쪽의 사용 설명</dt><dd>' + esc(e.useNote) + '</dd>' : ''}<dt>보낸 node</dt><dd>${esc(a.title)} · ${esc(a.audit.label)}</dd><dt>받는 node</dt><dd>${esc(b.title)} · ${esc(b.audit.label)}</dd><dt>${e.contentComplete ? '싣는 내용 전체' : '현재 초안 · 전달 내용 미완결'}</dt><dd class="formula">${esc(e.stmt || e.pass || '아직 작성되지 않음')}</dd>${e.inst ? '<dt>예전 대입 표기</dt><dd>' + esc(e.inst) + '</dd>' : ''}${e.fit ? '<dt>연결 설명</dt><dd>' + esc(e.fit) + '</dd>' : ''}${e.nottaken ? '<dt>싣지 않는 것</dt><dd>' + esc(e.nottaken) + '</dd>' : ''}<dt>근거</dt><dd>${esc(e.src || '미기재')}</dd></dl><p class="note">edge 내용의 완결과 양 끝 vertex의 완결은 별도로 표시합니다.</p>`;
  } else {
    h += coveragePanel(m);
    const g = groundCount(cur);
    const pendingNodes = m.nodes.filter(n => ['incomplete','unassessed'].includes(n.audit.state));
    if (pendingNodes.length) h += `<h3>미완결·미평가 위치</h3><ul class="audit-list">${pendingNodes.map(n => `<li><button class="focus-node" data-node="${esc(n.id)}">${esc(n.title)} · ${esc(n.audit.label)}</button>${n.audit.missing.length ? ' — 입력 edge 누락' : ''}</li>`).join('')}</ul>`;
    const ne = m.edges.length, nc = m.edges.filter(e => e.type === 'call').length;
    h += `<h2>${esc(m.title)}</h2><div class="kind">지도</div><p>${esc(m.intro)}</p><dl><dt>센 것</dt><dd>상자 ${m.nodes.length}개 (밖 ${m.nodes.filter(n => n.kind==='ext').length}개 포함), 화살표 ${ne}개 (호출 ${nc}개), 틀 ${m.frames.length}개.<br>카드에 닿는 상자 ${g.grounded}/${g.all}.</dd></dl>`;
    if (m.parent){ const b = boundaryCheck(cur); h += `<div class="check ${b.ok ? 'ok' : 'bad'}">닿는 면: ${b.ok ? '상위 상자 「' + esc(b.parent.title) + '」의 받는 것과 일치' : '불일치'}</div>`; }
    h += `<p class="note">상자를 누르면 칸이 열립니다. "확대할 수 있음"이 붙은 상자는 두 번 누르거나 오른쪽 단추로 하위 지도에 들어갑니다. 화살표의 이름표를 누르면 넘기는 것과 맞음이 뜹니다.</p>`;
  }
  h += `<p class="note">내용은 현행 L2 §6, rules.md, 카드에서 옮겼다. 모든 근거의 상태는 proposed이고 사용자 확인 전이다. 닿는 면 검사는 이 파일의 자료에서 계산한 것이다.</p>`;
  panel.innerHTML = h;
  panel.querySelectorAll('button.focus-node').forEach(b => b.onclick = () => { selNode = b.dataset.node; selEdge = null; render(); });
  panel.querySelectorAll('button.zoom').forEach(b => b.onclick = () => go(b.dataset.go));
  panel.querySelectorAll('button.follow-import').forEach(b => b.onclick = () => { cur=b.dataset.map; selNode=null; selEdge=MAPS[cur].edges.findIndex(e => e.id === b.dataset.edge); if (selEdge < 0) selEdge=null; render(); });
  tex(panel);
}
function go(id){ cur = id; selNode = null; selEdge = null; render(); $('#stage').scrollTo(0,0); }
canvas.addEventListener('click', e => { if (e.target === canvas || e.target === svg){ selNode = null; selEdge = null; render(); } });
window.addEventListener('load', () => { $('#tp').onchange = ev => { showPass = ev.target.checked; render(); }; render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
</script>
</body>
</html>
