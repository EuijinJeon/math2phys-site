<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증명 지도 — 수 4 — prescribed-tree 항등식</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#fbfaf7; --ink:#1d1d1b; --muted:#6b6a65; --line:#cfcdc6; --panel:#ffffff;
  --obj:#eeeeea; --obj-b:#8a8983;
  --rule:#e3edf9; --rule-b:#2f6fb5;
  --fact:#fbf0d9; --fact-b:#b07a12;
  --step:#e4f3e6; --step-b:#2f8a45;
  --ext:#ffffff; --ext-b:#8a8983;
  --frame:#9a6fb0; --sel:#d2452f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191918; --ink:#ecebe6; --muted:#a3a29b; --line:#4a4944; --panel:#232321;
    --obj:#2e2e2b; --obj-b:#8f8e87;
    --rule:#1d3048; --rule-b:#6aa6e6;
    --fact:#3d3115; --fact-b:#d9a441;
    --step:#1c3523; --step-b:#62bd78;
    --ext:#232321; --ext-b:#8f8e87;
    --frame:#b993cd; --sel:#ff7a63;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 4px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--rule-b);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:4px}
.lk{display:inline-block;width:26px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.lk.call{border-top-style:dashed}
.lk.def{border-top:1px solid var(--muted)}
main{display:flex;gap:0;align-items:stretch;min-height:calc(100vh - 110px)}
#stage{flex:1 1 auto;overflow:auto;padding:16px;min-width:0}
#canvas{position:relative}
#edges{position:absolute;left:0;top:0;pointer-events:none}
#panel{flex:0 0 340px;max-width:340px;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto}
@media (max-width:1100px){main{flex-direction:column}#panel{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line)}}
.node{position:absolute;width:210px;border:1.5px solid;border-radius:8px;padding:7px 9px 8px;cursor:pointer;background:var(--obj)}
.node .k{font-size:11px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.node .t{font-weight:600;margin:1px 0 3px}
.node .s{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.node.obj{background:var(--obj);border-color:var(--obj-b)}
.node.rule{background:var(--rule);border-color:var(--rule-b)}
.node.fact{background:var(--fact);border-color:var(--fact-b)}
.node.step{background:var(--step);border-color:var(--step-b);border-radius:18px}
.node.ext{background:var(--ext);border-color:var(--ext-b);border-style:dashed}
.node.out{background:var(--rule);border-color:var(--rule-b);border-width:2.5px}
.node.sel{outline:3px solid var(--sel);outline-offset:2px}
.node.done{border-width:3px}
.node.todo{opacity:.72;border-style:dotted}
.elabel.member{border:1.5px solid var(--ink)}
.elabel.wide.member .et b{color:var(--ink)}

.node .z{font-size:11px;color:var(--rule-b);margin-top:4px}
.frame{position:absolute;border:1.5px dashed var(--frame);border-radius:14px}
.frame .cap{position:absolute;left:10px;right:10px;top:5px;font-size:12px;line-height:1.4;color:var(--frame);max-height:40px;overflow:hidden}
.elabel{position:absolute;transform:translate(-50%,-50%);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.elabel.sel{border-color:var(--sel);color:var(--sel)}
.elabel.wide{white-space:normal;width:max-content;max-width:176px;text-align:left;border-radius:6px;padding:2px 6px;line-height:1.35;color:var(--ink)}
.elabel .et{display:block;font-size:10px;color:var(--muted)}
.recv{border-left:2px solid var(--line);padding:2px 0 4px 8px;margin:6px 0}
.recv .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:4px}
.recv .rl{margin-top:3px}
.recv .rl > span.lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.recv details{margin-top:3px}
.recv summary{font-size:12px;color:var(--rule-b);cursor:pointer}
#panel h2{font-size:15px;margin:0 0 2px}
#panel .kind{font-size:12px;color:var(--muted);margin-bottom:10px}
#panel dl{margin:0}
#panel dt{font-size:12px;color:var(--muted);margin-top:10px}
#panel dd{margin:2px 0 0}
#panel ul{margin:2px 0 0;padding-left:18px}
#panel .formula{overflow-x:auto;padding:4px 0}
button.zoom{margin-top:12px;font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--rule-b);background:var(--rule);color:var(--ink);cursor:pointer}
.check{margin-top:10px;font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.check.ok{border-color:var(--step-b)}
.check.bad{border-color:var(--sel)}

#vertex{display:none;max-width:1180px}
#vertex h2{font-size:16px;margin:0 0 2px}
#vertex h3{font-size:13px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
#vertex .claim{margin:6px 0 0;color:var(--muted)}
.vc{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--panel)}
.vc.ctx{border-color:var(--frame);border-style:dashed}
.vc.in{border-left:5px solid var(--ink)}
.vc.in.call{border-left-style:dashed}
.vc.in.def{border-left-color:var(--muted)}
.vc.step{border-color:var(--step-b);background:var(--step);border-radius:14px}
.vc.out{border-right:5px solid var(--ink)}
.vc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vc .hd b{font-size:14px}
.vc .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.vc .row{margin-top:5px}
.vc .row > .lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.vc .formula{overflow-x:auto}
.vc .flag{margin-top:5px;font-size:12.5px;color:var(--sel)}
.vc ul{margin:0;padding-left:18px}

#vertex.wide{max-width:none}
.vgrid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.35fr) minmax(240px,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.vgrid{grid-template-columns:1fr}}
.vc.edge{border:1.5px solid var(--ink);border-radius:4px}
.vc.edge.def{border-color:var(--muted)}
.vc.edge.fact{border-color:var(--fact-b)}
.vc .eid{font-weight:700;color:var(--ink);border-color:var(--ink)}
.chain{border-top:1px solid var(--step-b);margin-top:8px;padding-top:6px}
.chain:first-of-type{border-top:0}
.chain .cn{font-size:11px;color:var(--muted)}
.arrowdown{text-align:center;color:var(--muted);font-size:18px;line-height:1;margin:2px 0}
.note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
code{font-size:12px}

/* 상태와 edge 식별자 */
.node.state-incomplete{border-color:var(--sel);border-style:dashed}
.node.state-unassessed{border-style:dotted;border-color:var(--fact-b)}
.node.state-complete{border-width:3px}
.node .state-tag{font-weight:600;color:var(--muted)}
.node.state-incomplete .state-tag,.issue{color:var(--sel)}
.node .issue{font-size:11px;margin-top:5px;font-weight:600}
.node .child-state{font-size:11px;color:var(--muted);margin-top:4px}
#map-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.status-pill{border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.status-pill.incomplete{border-color:var(--sel);color:var(--sel)}
.status-pill.unassessed{border-color:var(--fact-b)}
.elabel{font:11px/1.3 -apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);padding:3px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--bg)}
.elabel.pending{border-style:dashed;border-color:var(--fact-b)}
.elabel.open-edge{border-color:var(--sel);color:var(--sel)}
.elabel.sel{outline:2px solid var(--sel);outline-offset:1px}
.elabel .edge-id{font-weight:700;font-variant-numeric:tabular-nums}
.elabel .edge-pending{margin-left:4px;font-weight:700;color:var(--fact-b)}
.elabel:focus-visible,.node:focus-visible{outline:3px solid var(--sel)}
.focus-node{font:inherit;text-align:left;background:transparent;color:var(--rule-b);border:0;padding:4px 0;cursor:pointer}
.audit-list{padding-left:17px;font-size:12px}
.node-warning{border-left:3px solid var(--sel);padding:5px 8px;margin:9px 0;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>증명 지도 — 수 4 — prescribed-tree 항등식</h1>
  <div class="crumbs" id="crumbs"></div>
  <div class="legend">
    <span><span class="chip" style="background:var(--obj);border-color:var(--obj-b)"></span>대상</span>
    <span><span class="chip" style="background:var(--rule);border-color:var(--rule-b)"></span>rule</span>
    <span><span class="chip" style="background:var(--fact);border-color:var(--fact-b)"></span>사실</span>
    <span><span class="chip" style="background:var(--step);border-color:var(--step-b);border-radius:7px"></span>단계</span>
    <span><span class="chip" style="background:var(--ext);border-color:var(--ext-b);border-style:dashed"></span>밖</span>
    <span><span class="lk"></span>흐름</span>
    <span><span class="lk call"></span>호출</span>
    <span><span class="lk def"></span>정의</span>
    <span id="frame-legend"><span class="chip" style="border-color:var(--frame);border-style:dashed;background:transparent"></span>틀</span>
    <label><input type="checkbox" id="tp" checked> edge 핵심어 표시</label>
    <span>edge는 ID + 핵심어로 표시합니다. ?는 내용 미작성, !는 열린 연결입니다.</span>
  </div>
  <div id="map-status" aria-live="polite"></div>
</header>
<main>
  <div id="stage"><div id="canvas"><svg id="edges"></svg></div><div id="vertex"></div></div>
  <aside id="panel"></aside>
</main>

 종류, $f$, $k$, $\\mathcal C$ 마다.", "수렴 속도와 $L$·type에 대한 균일성은 주장되지 않는다.", "처방할 수 있는 것은 anchor와 color들 사이의 쌍별 split 깊이뿐. mark 깊이는 $1,\\ldots,L-1$."], "out": "$$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\;\\mathbb E\\bigl[f\\,R_E\\bigr]\\;-\\;\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\;\\mathbb E\\bigl[R_E\\bigr]\\;\\longrightarrow\\;0 .$$ anchor에 새 섭동 하나를 더한 효과가, 계수 $c_E$ 를 붙인 부호 있는 합으로서, old tree의 시험함수 $f$ 와 분리된다.", "type": "blackbox", "cards": ["pert:tree-identity", "pert:palm", "pert:analytic"], "source": "L2 6.3, rules.md P7", "lib": "현행: 선행 연구와의 관계는 직관 칸에만. 서로 유도되는지 미확인.", "col": 3, "row": 3, "audit": {"state": "incomplete", "label": "미완결", "issues": ["하위 vertex 미완결: 9/9"], "missing": [], "declared": null, "child": {"done": 0, "total": 9, "complete": false}, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "zoom": "p7"}, {"id": "XM6", "kind": "ext", "title": "수 6", "short": "삽입의 계산 (P11)", "in": ["R2"], "cond": [], "out": "", "type": "-", "cards": [], "source": "", "lib": "-", "col": 4, "row": 0, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}}, {"id": "XM5", "kind": "ext", "title": "수 5", "short": "집중 (P8, P9): $N\\to\\infty$ 먼저, 깊이 평균 뒤 $L\\to\\infty$", "in": ["R4", "F1", "F2"], "cond": ["균등 격자 $m_d=d/L$, $\\delta=1/L$. 고정 topology와 $\\eta>0$. 각 $L$마다 P5 선택 수열.", "$\\eta$-regular: 서로 다른 branching 깊이 좌표를 $L$로 나눈 값이 $(\\eta,1-\\eta)$ 안이고 상호 간격은 $\\eta$보다 큼. 추가 prefix 좌표에도 같은 조건. 일치시킨 두 사본의 대응 깊이는 좌표 하나로 센다."], "out": "수 5의 목표는 각 고정 labeled topology $S$와 $\\eta>0$에서 $\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)=0$ (P9), 그리고 해당 조건부 공분산의 제곱 평균에 대한 P8이다. 이는 이 node의 목표이며 이번 PoC에서 증명 완료한 것이 아니다. $\\mathcal A_{L,\\eta}z=L^{-a}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}z(\\mathbf q)$는 깊이 좌표 $a$개의 비정규화 평균이다. 총 질량은 1 이하이며, 고정 깊이별 집중으로 바꾸지 않는다.\n\n수용 조건: 먼저 고정 $L,k,\\eta$의 유한 항등식 목록에서 P7 오차를 $N\\to\\infty$로 없앤다. 양의 $J$로 나누는 것도 이 단계에서 한다. $L$이 충분히 클 때 $\\eta$-regular 배정의 지연 target에서 $J=\\kappa(S^+)^2\\ge c_{k,\\eta}L^{-2b(S)}>0$이고, 사영 오차의 상대 절댓값 계수는 $C_{k,\\eta}$로 $L$에 균일하게 제어된다. 이 계수 한계와 P7 오차의 $L$-의존 증폭을 구분한다. 남는 낮은 차수 공분산 평균 및 martingale 비용을 따로 제어한 뒤 $L\\to\\infty$로 간다. P7만으로 집중이 따라온다고 주장하지 않는다.", "type": "-", "cards": [], "source": "decorrelation.tex 4–58, 63–74, 332–359, 446–457, 512–523, 613–622", "lib": "-", "col": 4, "row": 2, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "문맥 건넘 PoC의 수용 경계만 명시했다. 이 external node 내부의 P8/P9 증명 graph는 아직 만들지 않았다."}], "edges": [{"from": "O1", "to": "R1", "type": "def", "id": "top-e1", "displayId": "e1", "caption": "기호", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "O1의 현재 진술에 없고 원문(trees.tex 29–39)에서 옮긴 것: $E_{\\mathcal T}$ 의 정의, 내부 vertex가 자식 하나인 것을 포함한다는 것, 서로 다른 자식의 독립 표집, 위첨자 $a$ 의 뜻. 기호 $F[\\mathcal T,C,G]$ 는 원문에 이름이 없는 지도 작성자의 표기다. R1 하위 graph에서는 diff.S1이 표집 규칙을 따로 갖는다.", "short": "tree, 재귀 $Y_d$, 밀도 $W_{\\mathcal T}$, $E^A_{\\mathcal T}$, $\\gamma_\\beta$, $F[\\mathcal T,C,G]$", "stmt": "깊이 $0,\\ldots,L$ 마다 path는 변수 하나를 갖고, 깊이 $d$ 의 변수는 그 앞 prefix가 주어지면 확률 kernel $K_d$ 로 뽑는다($1\\le d\\le L$). $\\mathscr F_d$ 는 깊이 $d$ 까지의 prefix sigma-field다. 수 $0=m_0<m_1<\\cdots<m_{L-1}<m_L=1$ 과 root 분포는 모든 삽입에서 고정한다. tree $\\mathcal T$ 는 root를 공유하고 깊이 $L$ 에서 끝나는 유한 개의 path다. 내부 vertex는 자식이 하나 이상이며 자식이 하나뿐인 것도 포함한다. 한 vertex의 서로 다른 자식은 prefix가 주어지면 같은 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 이렇게 tree를 뽑는, root가 주어진 기대값이다. path 함수의 위첨자 $a$ 는 leaf $a$ 의 path에서 본 값이다($A^a$, $D_j^a$ 등). 양의 path 함수 $A$ 는 root가 주어졌을 때 위로 유계이고 0에서 떨어져 있다. $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d}\\quad(d=L,\\ldots,1).$$ 삽입 후의 kernel은 $$K_d^A(dz\\mid\\mathscr F_{d-1})=\\Bigl(\\frac{Y_d(z)}{Y_{d-1}}\\Bigr)^{m_d}K_d(dz\\mid\\mathscr F_{d-1})$$ 이고 재귀로 확률 kernel이다. $E^A_{\\mathcal T}$ 는 이 kernel로 tree를 뽑은 기대값이다. 양의 root-가측 $a,b$ 에 대해 $a\\le A\\le b$ 이면 모든 깊이에서 $a\\le Y_d\\le b$ 다. 내부 vertex $\\beta$ 의 깊이를 $d_\\beta$, 자식 수를 $n_\\beta$ 라 하고 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$ 로 둔다. 삽입 후 tree 법칙의 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta}$$ 이고 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 다. $Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$ 다. 삽입은 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$ 꼴이고, $D_j$ 는 유계 실수 path 함수이며, $A_{\\boldsymbol t}$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방에서 다룬다. 삽입 후 kernel로, 유계 path 함수 $h$ 에 대해 $$E^A[h\\mid\\mathscr F_d]:=K_{d+1}^A\\cdots K_L^A[h]\\qquad(0\\le d\\le L)$$ 이다. 주어진 prefix 아래로 path 하나를 끝까지 뽑는 평균이며 $d=L$ 의 빈 합성은 항등 연산이다. $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$ 이고 $G$ 가 old tree 변수의 유계 함수일 때 $$F[\\mathcal T,C,G]:=E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\Bigr].$$ $C$ 는 삽입 밀도의 leaf 인자가 상쇄된 protected leaf의 집합이다. $G$ 와 $D_j$ 는 $\\boldsymbol t$ 에 무관하다.", "src": "trees.tex 16–23, 29–39, 67–82, 92–110, 142–154, 180–183", "nottaken": "O1의 진술은 이 edge가 전부 싣는다. 원문에서 O1이 다루지 않는 것은 싣지 않는다. 복소 $A$ 로 확장한 재귀와 해석적 경계(trees.tex 156–176)는 R3의 출력으로 R4에 간다(top-e6). 분배함수에서 tilted kernel이 나오는 방식(51–65)은 R1이 쓰지 않는다. R1은 kernel을 주어진 확률 kernel 열로 받는다."}, {"from": "R1", "to": "R2", "type": "call", "id": "top-e2", "displayId": "e2", "caption":  t}^{a_*}}\\right]\\Bigg\\rvert_{\\boldsymbol t=0}=\\sum_{E}c_E\\;E_{\\mathcal T_E}\\!\\Bigl[G\\prod_{j=1}^kD_j^{a_j(E)}\\Bigr].$$ 우변은 유한 합이다. 색의 순서를 어떻게 정해도 성립하고, 혼합 미분에는 factorial이 붙지 않는다. $D_j=D$ 이면 $t^k$ 의 계수는 우변을 $k!$ 로 나눈 것이다. 빈 확장의 무게는 1이다. 좌변은 복소 영역 $\\sum_j\\lvert t_j\\rvert\\lVert D_j\\rVert_\\infty<1$ 에서 해석적이고, 이 영역 안의 더 작은 닫힌 영역에서 그 절댓값의 경계는 kernel 열에 대해 균일하다. 경계가 의존하는 것은 고정한 깊이, 지수 $m_d$, tree 크기, 삽입 함수들의 경계뿐이다. 그래서 reservoir의 크기 $N$ 과 고른 섭동 매개변수 벡터에 대해서도 균일하다. 이 edge는 정확한 항등식과 경계이고 $N$ 에 대한 극한을 포함하지 않는다.", "src": "trees.tex 156–176, 259–304; perturbations.tex 391–398, 478–492", "nottaken": "계수의 모양별 합 $\\kappa(S)$ 와 절댓값 합의 한계는 R4가 쓰지 않으므로 싣지 않는다(F1, F2로 간다, top-e4, top-e5). R1 규칙을 되풀이해 이 전개를 얻는 증명 단계도 싣지 않는다."}, {"from": "XP5", "to": "R4", "type": "flow", "id": "top-e7", "displayId": "e7", "caption": "선택 수열", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "고정 $L\\ge2$ 의 선택 수열: (ii) $e_{\\nu,N_j}(\\mathbf u_j)\\to0$ (각 type), (iii) tree 모멘트 수렴", "stmt": "고정한 $L\\ge2$ 와 $\\varepsilon>0$ 에 대해 크기 $N_j\\uparrow\\infty$ 와 결정적 벡터 $\\mathbf u_j$ 가 있어서 다음이 성립한다. (ii) 모든 고정한 type $\\nu$ 에서 reservoir의 $e_{\\nu,N_j}(\\mathbf u_j)\\to0$. (iii) reservoir에서 깊이 $L$ 의 모든 고정된 유한 prescribed tree 위의 multioverlap 유한 곱의 기대값이 이 수열을 따라 수렴한다. 여기서 tilted path 위에서 $$D_\\nu=\\sum_{q=1}^{n_\\nu}\\frac{g_{0,q}S_{0,q}}{1+t_\\nu g_q\\sigma_{i_q}+u_\\nu g_{0,q}S_{0,q}}$$ 이고(terminal Gibbs 배치 포함), $\\langle\\cdot\\rangle$ 는 root가 주어진 한 tilted path 위의 기대값, $\\mathbb E_{\\mathbf u}$ 는 고정한 $\\mathbf u$ 에서 root를 평균한 기대값이며 $$e_{\\nu,N}(\\mathbf u)=\\frac{1}{c_\\nu s_N}\\,\\mathbb E_{\\mathbf u}\\Big\\langle\\big\\lvert D_\\nu-\\mathbb E_{\\mathbf u}\\langle D_\\nu\\rangle\\big\\rvert\\Big\\rangle.$$ $n_\\nu$, $t_\\nu$, $c_\\nu$, $s_N$, $g$, $g_0$, $S_0$ 는 섭동족(top-e8)의 기호다. $\\mathbf u_j$ 는 선택된 결정적 값이고 평균하지 않는다. 수열은 $L$ 마다 다를 수 있다. 이 수열을 따르는 $N\\to\\infty$ 는 고정한 $L$ 에서만 뜻이 있다. $L$, 경로의 수, type에 대한 균일성은 주장되지 않는다. (ii)는 type마다 따로 성립하고 type들에 걸친 균일한 수렴이 아니다.", "src": "perturbations.tex 75–93, 255–267, 301–312, 538–546; decorrelation.tex 4–7", "nottaken": "(i) $\\Delta_{N_j}(\\mathbf u_j)\\le\\underline F+2\\varepsilon$ 는 R4가 쓰지 않는다. 수 6의 조립이 쓴다(comparison.tex 13–15, 235–245). 평균 $\\int e_{\\nu,N}\\,d\\pi\\to0$ (집중 보조정리)과 수열을 고르는 증명은 수 3의 내용이므로 싣지 않는다."}, {"from": "XFAM", "to": "R4", "type": "flow", "id": "top-e8", "displayId": "e8", "caption": "섭동족", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "mark specification, type $(t_\\nu,u_\\nu)$, Poisson 개수 $c_\\nu s_N$, $\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$", "stmt": "mark specification은 유한 개 $n\\ge0$ 의 labeled Rademacher 좌표, 각 좌표에 배정된 깊이($\\{1,\\ldots,L-1\\}$ 의 원소), 함수 $g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, 그리고 $S_0=1$ 또는 $S_0=\\sigma_i$ 의 선택으로 이루어진다. 각 좌표는 배정된 깊이에서 보조 path를 따라 뽑힌다. 서로 다른 좌표는 독립이고, 한 vertex를 공유하면 값을 공유하고 다른 vertex에서는 독립이다. $n=0$ 은 상수 함수를 포함한다. 이런 specification 전부를 쓴다. 부호의 곱과 그 유리수 평균은 이 모임에 속한다. 각 specification과 각 정수 $j\\ge4$ 에 type $\\nu$ 가 하나 있고 $$t_\\nu=j^{-1},\\qquad I_\\nu=[j^{-j},2j^{-j}],\\qquad u_\\nu\\in I_\\nu.$$ $u_\\nu$ 는 $t_\\nu$ 의 어떤 고정 거듭제곱보다도 작게 잡는다($j\\to\\infty$). type을 $\\nu\\in\\mathbb N$ 으로 세고 $\\sum_\\nu c_\\nu=1$ 인 $c_\\nu>0$ 을 고른다. type마다 독립으로 $n_\\nu\\sim\\operatorname{Poisson}(c_\\nu s_N)$, $s_N=N^{3/4}$ 이다. 각 항은 독립인 균일 site $i\\in[N]$ 와 mark 과정의 독립 사본을 갖고, leaf에서 spin weight에 $$\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$$ 를 곱한다. $1/2<\\psi_\\nu<3/2$ 이다. 개수, type, site는 root에 속하고 mark 변수는 배정된 보조 깊이에서 곱 prior로 뽑는다. 총 개수는 $\\operatorname{Poisson}(s_N)$ 이어서 거의 확실히 유한 개의 항만 쓴다. mark specification과 양의 가중치 $c_\\nu$ 는 고정한 $L$ 에 대해 먼저 정한다. $t_\\nu$, $I_\\nu$, $c_\\nu$ 는 $N$ 에 무관하고, $N$ 은 $s_N$ 과 $u_\\nu\\in I_\\nu$ 의 선택(top-e7)으로만 들어온다.", "src": "perturbations.tex 26–70, 538–546", "nottaken": "type 하나의 score $D_\\nu$, 오차 $e_{\\nu,N}$ 와 그 집중은 이 edge가 아니라 P5(top-e7)가 싣는다. 구간 $I_\\nu$ 위의 균등측도 $\\pi$ 는 결정적 매개변수를 고르는 데만 쓰이므로 싣지 않는다. Poisson add-one 항등식의 증명은 R4 하위 graph(p7의 P1)에 있다."}, {"from": "R4", "to": "XM5", "type": "flow", "id": "top-e9", "displayId": "e9", "caption": "극한 순서", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$\\epsilon_{N,L,k}\\to0$ (고정 $L,k$); $N\\to\\infty$ 뒤 $L\\to\\infty$", "stmt": "각 고정 깊이 $L\\ge2$에서 P5로 선택한 수열 $\\mathfrak s_L=(N_n^{(L)},\\mathbf u_n^{(L)})$을 쓴다. 수열은 $L$마다 달라도 되며, P5의 외부 선택 오차도 고정한다. 아래 $N\\to\\infty$는 이 수열을 따른다는 뜻이고, 섭동 매개변수는 선택된 결정적 값이다.\n\nP7의 한 적용 $\\alpha=(\\mathcal T,a_*,f,k_\\alpha,\\mathcal C)$에서 $\\mathcal T$는 고정한 유한 old tree, $a_*$는 spin 또는 marker anchor, $f$는 old multioverlap들의 유계 다항식이다. 다항식과 계수는 $N$에 무관하게 고정한다. 유한 개의 ordered color를 더하고, $\\mathcal C$는 anchor와 추가 color 사이의 일관된 쌍별 split 깊이만 지정한다. 다른 old replica와의 추가 split 제약은 허용하지 않는다. 빈 추가도 허용한다.\n\n$c_E$는 anchor를 보호한 extension history의 계수다: 안 쓴 old leaf를 택하는 걸음은 $+1$, 내부 vertex $\\beta$에서 fresh path를 붙이는 걸음은 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$이고 $c_E$는 걸음별 계수의 곱이다. $R_E=N^{-1}\\sum_{i=1}^N\\prod_j\\sigma_i^{a_j(E)}$에 spin anchor이면 $\\sigma_i^{a_*}$를 곱하고 marker anchor이면 곱하지 않는다. 기대값은 root와 tree sampling을 포함한다. 그러면\n$$I_{N,L}(\\alpha):=\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E[R_E]\\ \\longrightarrow\\ 0.$$\n\n수 5의 한 유한 크기 귀납 단계에 실제로 쓰는 적용들의 유한 목록을 $\\mathcal F_{L,k}$라 쓰자. $k$는 이 목록의 tree 크기·color 수를 제한하는 고정 지표다. 고정 $L$에서 깊이 배정도 유한 개이므로, 고정한 유한 종류의 시험 다항식까지 모은 이 목록에 대해\n$$\\epsilon_{N,L,k}:=\\max_{\\alpha\\in\\mathcal F_{L,k}}|I_{N,L}(\\alpha)|\\longrightarrow0\\qquad(L,k\\text{ 고정}).$$\n이는 모든 유계 다항식이나 무제한 크기 tree에 대한 supremum이 아니다. $\\mathcal F_{L,k}$와 수렴 속도는 $L$에 의존해도 된다. 원문 $\\varepsilon_{N,L,k}$의 유한 최대를 여기서는 $\\epsilon$으로 적어 P5의 선택 오차와 구별한다.\n\n받는 쪽에서 고정한 $L,k,\\eta$의 유한 상수 $B_{L,k,\\eta}$가 이 오차에 곱해져도\n$$\\limsup_{N\\to\\infty}B_{L,k,\\eta}\\epsilon_{N,L,k}=0.$$\n따라서 이 항을 먼저 없앤 다음 $L\\to\\infty$로 간다. $B_{L,k,\\eta}$에는 정규화 계수로 나누는 비용이 포함될 수 있다. $L$-균일한 $N$ 수렴 속도, $N=N(L)$에 따른 공동 극한, 순서를 바꾼 극한은 이 edge가 주지 않는다.", "src": "perturbations.tex 257–265, 308–312, 432–469, 538–546; decorrelation.tex 4–9, 49–58, 446–457, 613–622", "nottaken": "$J=\\kappa(S^+)^2$의 하한과 $(\\sum_E|c_E|)/|J|\\le C_{k,\\eta}$는 P7의 출력이 아니다. 이들은 모양별 계수와 절댓값 한계(top-e10, top-e11), 균등 격자 및 지연한 regular target 선택에서 받는 쪽이 얻는다. 수 5의 사영 오차·martingale 오차와 P8/P9 결론도 이 edge가 운반하지 않는다. P7 오차의 계수 $B_{L,k,\\eta}$를 $L$-균일 상수로 바꾸지 않는다."}, {"from": "F1", "to": "XM5", "type": "flow", "id": "top-e10", "displayId": "e10", "caption": "모양별 합", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "R3의 history 정의(top-e4)와 O1의 $m_d$, $\\gamma_\\beta$, split 깊이(top-e16)를 쓴다.", "short": "한 걸음 총합 $m_d-j\\,m_{d+1}$ 과 모양별 총합 $\\kappa(S)=\\prod_{v}\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$", "stmt": "일반 격자 $0=m_0<\\cdots<m_L=1$ 에서, 다음 color가 깊이 $d$ 까지 지정된 reference prefix를 따라간 뒤 그 vertex에서 reference를 담은 $j\\ge1$ 개의 자식과 다른 자식으로 들어가야 하고 그 밖의 연속은 제한이 없을 때, 허용되는 모든 선택의 계수 합은 $$m_d-j\\,m_{d+1}.$$ 처방한 split 깊이들이 서로 일관되고 anchor와 color들이 이룰 prescribed tree가 $S$ 이면, 어떤 old tree에서 시작하든 호환되는 모든 extension의 계수 총합은 $$\\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}\\ \\prod_{j=1}^{a_v-1}\\bigl(m_{d_v}-j\\,m_{d_v+1}\\bigr).$$ $a_v$ 와 $d_v$ 는 처방한 reference tree $S$ 의 각 branching vertex $v$ 의 자식 수와 깊이다. 이 합은 color의 순서와 old tree의 모양에 의존하지 않는다. 이미 만든 reference 집합에서 시작해 같은 한 걸음 규칙을 되풀이해도 된다. 이 edge는 $N$ 에 대한 극한이 없는 정확한 항등식이다. 모든 $L$ 과 모든 일반 격자에서 성립하고, 균일한 것은 old tree, color의 순서, 일관된 처방 깊이다. $L$ 에 대한 균일성은 아니다: $\\kappa(S)$ 의 크기는 $m$ 과 $L$ 에 따라 달라진다. 균등 격자 $m_d=d/L$ 로의 대입과 $L$ 이 큰 쪽의 하한은 받는 쪽이 한다.", "src": "trees.tex 337–386; decorrelation.tex 332–334, 414–423, 546–549", "nottaken": "$J=\\kappa(S^+)^2$ 은 받는 쪽의 정의(decorrelation.tex 332–334)이고 여기서 정하지 않는다. $\\lvert J\\rvert$ 의 하한과 marker 계수 $C(S,e)=-\\delta\\kappa(S)$ (546–549)는 받는 쪽이 이 식으로 계산한다. 절댓값 합의 한계는 F2가 싣는다(top-e11). 증명 안의 old 부분 tree의 telescoping($q+\\sum(m_{d_\\beta}-n_\\beta m_{d_\\beta+1})=m_{d+1}$, trees.tex 366–371)은 F1 내부이고 싣지 않는다."}, {"from": "F2", "to": "XM5", "type": "flow", "id": "top-e11", "displayId": "e11", "caption": "상대 한계", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "원문 lemma의 $J$ 는 지정한 $b$ 개 vertex만의 곱이다. 수 5의 $J=\\kappa(S^+)^2$ 에 적용하려면 두 사본의 $2b$ 개 target vertex 전부를 지정한 경우여야 한다(decorrelation.tex 345–353, rules.md P6′ ③). R3의 history 정의(top-e5)와 O1의 $m_d$, $\\gamma_\\beta$, 깊이(top-e17)를 쓴다.", "short": "$\\sum_E\\lvert c_E\\rvert\\le C_{q,k}\\delta^{b_{\\rm sep}}$ 와 $\\lvert J_{\\rm sep}\\rvert^{-1}\\sum_E\\lvert c_E\\rvert\\le C_{q,k,\\eta}$ ($m_d=d/L$)", "stmt": "$m_d=d/L$, $\\delta=L^{-1}$ 로 둔다. old tree의 leaf 수를 $q$ 라 하고 canceled-anchor extension 규칙으로 $k$ 개의 color를 배정한다. anchor와 color들의 reference shape를 처방하되 허용되는 extension을 더 제한하는 조건이 붙어도 된다. 처방한 shape의 branching vertex 가운데 깊이가 old tree의 어느 branching 깊이와도 다른 것 $b_{\\rm sep}$ 개를 고르면 $$\\sum_{E\\text{ 허용}}\\lvert c_E\\rvert\\le C_{q,k}\\,\\delta^{\\,b_{\\rm sep}}.$$ 상수 $C_{q,k}$ 는 $L$, 지정한 깊이, 서로 다른 vertex에서 깊이가 겹치는 경우에 무관하다. 고른 vertex들에 대해 $J_{\\rm sep}=\\prod_v\\prod_{j=1}^{a_v-1}(m_{d_v}-j\\,m_{d_v+1})$ 로 두자. 고른 vertex 모두에서 $m_{d_v}\\ge\\eta>0$ 이면 $J_{\\rm sep}\\ne0$ 이고 $$\\frac1{\\lvert J_{\\rm sep}\\rvert}\\sum_{E\\text{ 허용}}\\lvert c_E\\rvert\\le C_{q,k,\\eta}.$$ 이 edge는 $N$ 에 대한 극한이 없는, 각 $L$ 에서 성립하는 부등식이다. 균일한 것은 $L$, 처방 깊이, 깊이의 겹침이고, 상수는 $q$, $k$ 와 (비의 경우) $\\eta$ 에 의존한다. $\\lvert J_{\\rm sep}\\rvert$ 자체에 대해 원문이 주는 하한은 $\\lvert J_{\\rm sep}\\rvert\\ge\\delta^{b_{\\rm sep}}\\eta^{\\sum_v(a_v-2)}$ 이고, $L$ 에 균일한 양의 하한은 아니다.", "src": "trees.tex 388–456; decorrelation.tex 332–359, 456–457", "nottaken": "부호 있는 모양별 총합은 F1이 싣는다(top-e10). $J=\\kappa(S^+)^2$ 의 $2b$ 개 target vertex가 모두 fresh unary split으로만 생긴다는 확인(regular 깊이와 깊이를 한 칸 미루는 선택, decorrelation.tex 345–353)과 두 사본의 정렬된 깊이는 받는 쪽의 일이고 싣지 않는다. 이 한계로 오차를 누르는 조립(P7 오차 $\\times$ 상수)은 top-e9와 수 5에 있다."}, {"from": "R2", "to": "XM6", "type": "flow", "id": "top-e12", "displayId": "e12", "caption": "log 급수", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "같은 전개를 수 1의 상한(upper.tex 70–127)도 쓴다. top에는 그 받는 node가 없다(notes). R2의 정의 입력은 top-e13이다.", "short": "$\\log Y_0=\\sum_{k\\ge1}\\frac{(-1)^{k-1}t^k}{k}\\mathbb E_{Q_k}E_{\\mathcal T}\\prod D^a$ 와 나머지 $\\le\\sum_{k>K}c^k/k$", "stmt": "유계 실수 path 함수 $D$ 와 실수 $t$ 에 대해 $A=1+tD$ 의 삽입 재귀(top-e13)가 주는 $Y_0$ 는, root가 주어진 조건부로 $$\\log Y_0=\\sum_{k\\ge1}\\frac{(-1)^{k-1}t^k}{k}\\;\\mathbb E_{Q_k}E_{\\mathcal T}\\prod_{a=1}^kD^a\\qquad(\\lvert t\\rvert\\,\\lVert D\\rVert_\\infty<1).$$ $Q_k$ 는 leaf에 $1,\\ldots,k$ 를 붙인 tree의 법칙이다. path 하나에서 시작해, 현재 tree의 leaf가 $n$ 개일 때 내부 vertex $\\beta$ 를 확률 $$\\frac{n_\\beta m_{d_\\beta+1}-m_{d_\\beta}}{n}=\\frac{-\\gamma_\\beta}{n}$$ 로 골라 거기에 새 자식을 만들고 깊이 $L$ 까지 완전히 새 path를 잇는다. 그 끝의 leaf에 label $n+1$ 을 준다. 뽑힌 tree는 그 위에서 이후 뽑는 모든 변수와 독립이다. 확률의 합이 1인 것은 $\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}(n_\\beta m_{d_\\beta+1}-m_{d_\\beta})=n$ 이기 때문이다. $\\lvert t\\rvert\\lVert D\\rVert_\\infty\\le c<1$ 이면 $K$ 차 뒤 나머지의 절댓값은 $$\\sum_{k>K}\\frac{c^k}{k}$$ 이하다. 이 edge는 정확한 항등식이다. 임의의 $L$, 임의의 유한 확률 kernel 열, 각 root 값에서 성립하고 극한을 포함하지 않는다. 나머지 한계는 $c$ 와 $K$ 만의 함수라서, $\\lvert t\\rvert\\lVert D\\rVert_\\infty\\le c$ 가 모든 root 값에서 같은 $c$ 로 성립하면 kernel, $N$, $L$ 에 대해 균일하다. 받는 쪽(수 6)은 Poisson 개수의 절단 $M$ 을 먼저, 전개 차수의 절단 $q$ 를 그다음 고정하고, 남는 유한 개의 항에 대해서만 $N$ (선택된 수열) 먼저, 그다음 $L\\to\\infty$ 의 극한을 취한다.", "src": "trees.tex 204–256; comparison.tex 123–129, 195–222", "nottaken": "$Q_k$ 아래에서 예외적(비정규) tree의 확률 $\\le C_k(\\eta+L^{-1})$ (trees.tex 469–484)은 R2의 출력이 아니다. 별도 lemma이고 top에 node가 없다. 수 6이 comparison.tex 141 에서 직접 쓴다. 각 차수에서 $\\prod D^a$ 의 평가 오차를 $\\sum_{S\\ne\\varnothing}\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert$ 로 누르는 것은 수 5의 집중과 수 6의 일이고 싣지 않는다."}, {"from": "O1", "to": "R2", "type": "def", "id": "top-e13", "displayId": "e13", "caption": "log 전개의 대상", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "R2가 O1에서 받는 정의가 지금까지 edge로 연결되어 있지 않았다(입력 O1 → R2 누락). O1의 현재 진술에 없고 원문에서 옮긴 것은 top-e1의 use_note와 같다.", "short": "$Y_0$ 재귀, $E_{\\mathcal T}$, $\\gamma_\\beta$, $F[\\mathcal T,C,G]$", "stmt": "깊이 $0,\\ldots,L$ 마다 path는 변수 하나를 갖고, 깊이 $d$ 의 변수는 그 앞 prefix가 주어지면 확률 kernel $K_d$ 로 뽑는다($1\\le d\\le L$). $\\mathscr F_d$ 는 깊이 $d$ 까지의 prefix sigma-field다. 수 $0=m_0<m_1<\\cdots<m_{L-1}<m_L=1$ 과 root 분포는 모든 삽입에서 고정한다. tree $\\mathcal T$ 는 root를 공유하고 깊이 $L$ 에서 끝나는 유한 개의 path다. 내부 vertex는 자식이 하나 이상이며 자식이 하나뿐인 것도 포함한다. 한 vertex의 서로 다른 자식은 prefix가 주어지면 같은 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 이렇게 tree를 뽑는, root가 주어진 기대값이다. path 함수의 위첨자 $a$ 는 leaf $a$ 의 path에서 본 값이다($A^a$, $D_j^a$ 등). 양의 path 함수 $A$ 는 root가 주어졌을 때 위로 유계이고 0에서 떨어져 있다. $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d}\\quad(d=L,\\ldots,1).$$ 삽입 후의 kernel은 $$K_d^A(dz\\mid\\mathscr F_{d-1})=\\Bigl(\\frac{Y_d(z)}{Y_{d-1}}\\Bigr)^{m_d}K_d(dz\\mid\\mathscr F_{d-1})$$ 이고 재귀로 확률 kernel이다. $E^A_{\\mathcal T}$ 는 이 kernel로 tree를 뽑은 기대값이다. 양의 root-가측 $a,b$ 에 대해 $a\\le A\\le b$ 이면 모든 깊이에서 $a\\le Y_d\\le b$ 다. 내부 vertex $\\beta$ 의 깊이를 $d_\\beta$, 자식 수를 $n_\\beta$ 라 하고 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$ 로 둔다. 삽입 후 tree 법칙의 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta}$$ 이고 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 다. $Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$ 다. 삽입은 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$ 꼴이고, $D_j$ 는 유계 실수 path 함수이며, $A_{\\boldsymbol t}$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방에서 다룬다. $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$ 이고 $G$ 가 old tree 변수의 유계 함수일 때 $$F[\\mathcal T,C,G]:=E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\Bigr].$$ $C$ 는 삽입 밀도의 leaf 인자가 상쇄된 protected leaf의 집합이다. $G$ 와 $D_j$ 는 $\\boldsymbol t$ 에 무관하다.", "src": "trees.tex 16–23, 29–39, 67–82, 92–105, 142–145, 180–183, 204–219", "nottaken": "O1의 $E^A[h\\mid\\mathscr F_d]$ 정의와 단조성 이후의 부분은 R2의 진술이 직접 쓰지 않는다. R2의 첫 걸음이 쓰는 첫 변분 $\\partial_{t}\\log Y_0=E^A[D/A]$ 는 O1의 출력이 아니다(top-e2의 not_carried). 복소 영역에서의 재귀(주 가지 거듭제곱)와 해석적 경계(trees.tex 156–176)는 O1의 진술에 없고 R2의 증명 몫이다."}, {"from": "O1", "to": "R3", "type": "def", "id": "top-e14", "displayId": "e14", "caption": "history의 대상", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "R3가 O1에서 받는 정의가 지금까지 edge로 연결되어 있지 않았다(입력 O1 → R3 누락). O1의 현재 진술에 없고 원문에서 옮긴 것은 top-e1의 use_note와 같다.", "short": "$E_{\\mathcal T}$, 재귀 $Y_d$, $E^A_{\\mathcal T}$, $W_{\\mathcal T}$, $\\gamma_\\beta$, $F[\\mathcal T,C,G]$", "stmt": "깊이 $0,\\ldots,L$ 마다 path는 변수 하나를 갖고, 깊이 $d$ 의 변수는 그 앞 prefix가 주어지면 확률 kernel $K_d$ 로 뽑는다($1\\le d\\le L$). $\\mathscr F_d$ 는 깊이 $d$ 까지의 prefix sigma-field다. 수 $0=m_0<m_1<\\cdots<m_{L-1}<m_L=1$ 과 root 분포는 모든 삽입에서 고정한다. tree $\\mathcal T$ 는 root를 공유하고 깊이 $L$ 에서 끝나는 유한 개의 path다. 내부 vertex는 자식이 하나 이상이며 자식이 하나뿐인 것도 포함한다. 한 vertex의 서로 다른 자식은 prefix가 주어지면 같은 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 이렇게 tree를 뽑는, root가 주어진 기대값이다. path 함수의 위첨자 $a$ 는 leaf $a$ 의 path에서 본 값이다($A^a$, $D_j^a$ 등). 양의 path 함수 $A$ 는 root가 주어졌을 때 위로 유계이고 0에서 떨어져 있다. $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d}\\quad(d=L,\\ldots,1).$$ 삽입 후의 kernel은 $$K_d^A(dz\\mid\\mathscr F_{d-1})=\\Bigl(\\frac{Y_d(z)}{Y_{d-1}}\\Bigr)^{m_d}K_d(dz\\mid\\mathscr F_{d-1})$$ 이고 재귀로 확률 kernel이다. $E^A_{\\mathcal T}$ 는 이 kernel로 tree를 뽑은 기대값이다. 양의 root-가측 $a,b$ 에 대해 $a\\le A\\le b$ 이면 모든 깊이에서 $a\\le Y_d\\le b$ 다. 내부 vertex $\\beta$ 의 깊이를 $d_\\beta$, 자식 수를 $n_\\beta$ 라 하고 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$ 로 둔다. 삽입 후 tree 법칙의 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta}$$ 이고 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 다. $Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$ 다. 삽입은 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$ 꼴이고, $D_j$ 는 유계 실수 path 함수이며, $A_{\\boldsymbol t}$ 가 균등하게 양인 실수 $\\boldsymbol t$ 근방에서 다룬다. $C\\subseteq\\operatorname{Leaves}(\\mathcal T)$ 이고 $G$ 가 old tree 변수의 유계 함수일 때 $$F[\\mathcal T,C,G]:=E^A_{\\mathcal T}\\Bigl[G\\prod_{a\\in C}(A^a)^{-1}\\Bigr].$$ $C$ 는 삽입 밀도의 leaf 인자가 상쇄된 protected leaf의 집합이다. $G$ 와 $D_j$ 는 $\\boldsymbol t$ 에 무관하다.", "src": "trees.tex 16–23, 29–39, 67–82, 92–110, 180–183, 278–296", "nottaken": "$E^A[h\\mid\\mathscr F_d]$ 의 정의는 R3의 진술이 쓰지 않는다. 복소 $A$ 로 확장한 재귀와 해석적 경계(trees.tex 156–176)는 O1의 진술에 없고, R3가 출력의 일부로 R4에 넘긴다(top-e6). 그 경계의 증명은 R3의 몫이다."}, {"from": "O1", "to": "R4", "type": "def", "id": "top-e15", "displayId": "e15", "caption": "삽입·밀도", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "R4가 O1에서 받는 정의가 R4의 inputs에는 있었으나 edge가 없었다(입력 O1 → R4 누락). O1의 현재 진술에 없고 원문에서 옮긴 것: $E_{\\mathcal T}$ 의 정의, 내부 vertex가 자식 하나인 것을 포함, 독립 표집, 새 변수를 쓰는 삽입(135–140), 깊이 $L$ 이 spin 배치일 때의 replica 위치, $\\mathbb E$ 의 뜻.", "short": "$E_{\\mathcal T}$, 재귀 $Y_d$, 밀도 $W_{\\mathcal T}(A)$, 새 변수를 쓰는 삽입", "stmt": "깊이 $0,\\ldots,L$ 마다 path는 변수 하나를 갖고, 깊이 $d$ 의 변수는 그 앞 prefix가 주어지면 확률 kernel $K_d$ 로 뽑는다($1\\le d\\le L$). $\\mathscr F_d$ 는 깊이 $d$ 까지의 prefix sigma-field다. 수 $0=m_0<m_1<\\cdots<m_{L-1}<m_L=1$ 과 root 분포는 모든 삽입에서 고정한다. tree $\\mathcal T$ 는 root를 공유하고 깊이 $L$ 에서 끝나는 유한 개의 path다. 내부 vertex는 자식이 하나 이상이며 자식이 하나뿐인 것도 포함한다. 한 vertex의 서로 다른 자식은 prefix가 주어지면 같은 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 이렇게 tree를 뽑는, root가 주어진 기대값이다. path 함수의 위첨자 $a$ 는 leaf $a$ 의 path에서 본 값이다($A^a$, $D_j^a$ 등). 양의 path 함수 $A$ 는 root가 주어졌을 때 위로 유계이고 0에서 떨어져 있다. $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d}\\quad(d=L,\\ldots,1).$$ 삽입 후의 kernel은 $$K_d^A(dz\\mid\\mathscr F_{d-1})=\\Bigl(\\frac{Y_d(z)}{Y_{d-1}}\\Bigr)^{m_d}K_d(dz\\mid\\mathscr F_{d-1})$$ 이고 재귀로 확률 kernel이다. $E^A_{\\mathcal T}$ 는 이 kernel로 tree를 뽑은 기대값이다. 양의  표본을 포함한다. 말단 변수가 spin 배위 $\\sigma^a\\in\\{-1,1\\}^N$ 일 때 replica leaf 부분집합 $S$ 의 multioverlap은 $R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a$, $R_\\varnothing=1$ 이다. 양의 path 함수 $A$(root가 주어졌을 때 위로 유계이고 0에서 떨어짐)에 대해 $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d},\\qquad K_d^A=\\Bigl(\\frac{Y_d}{Y_{d-1}}\\Bigr)^{m_d}K_d .$$ $K_d^A$ 는 확률 kernel이고, 위첨자 $A$ 는 tree 기대값이 이 kernel을 쓴다는 뜻이다. 삽입 미적분: spin 가중치에 $A$ 를 곱하면 kernel이 $K_d^A$ 로 바뀌고, 처방된 tree의 바뀐 법칙의 조건부 결합 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta},\\qquad\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1},$$ 곧 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 이다($Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$). 삽입은 원래 모형에 없던 변수를 써도 된다. 그 변수들의 독립 prior kernel로 각 path kernel을 넓힌 뒤 위 내용을 적용한다. 원래 backward 로그는 그 변수에 의존하지 않으므로 원래 tilt는 그 변수들의 조건부 prior kernel을 바꾸지 않는다. 추가한 root 변수는 quenched로 남는다.", "type": "exact", "cards": ["tree:density", "tree:insertion", "tree:multioverlap", "x:tree-sampling", "x:tree-extra-variables"], "source": "trees.tex 16–49, 67–110, 135–140", "lib": "-", "col": 0, "row": 1, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": {"node": "XB", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": null, "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "note": "이 진술은 상위 `top.O1` 의 진술보다 넓다. 표본 규칙과 투영성(trees.tex 29–39, 48–49), multioverlap(41–47), 새 변수(135–140)는 `top.O1` 에 아직 없다. notes의 top 변경 제안 참조.", "ref": "O1"}, {"id": "XF", "kind": "ext", "title": "섭동족 (mark 족과 type)", "short": "mark specification, $t_\\nu=1/j$, $u_\\nu\\in[j^{-j},2j^{-j}]$, Poisson 개수", "in": [], "cond": [], "out": "mark specification은 유한 개 $n\\ge0$ 의 이름 붙은 Rademacher 좌표, 각 좌표에 배정한 깊이 $\\in\\{1,\\ldots,L-1\\}$, 두 함수 $g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, 그리고 $S_0=1$ 또는 $S_0=\\sigma_i$ 의 선택이다. 각 좌표는 보조 path를 따라 배정된 깊이에서 뽑는다. 서로 다른 좌표는 독립이고, 한 좌표의 값은 공유한 vertex에서 공유되며 다른 vertex에서는 독립이다. $n=0$ 은 상수 함수를 포함한다. 이런 specification을 모두 쓴다(부호 정의역이 유한하므로 가산 개). 부호의 곱과 그 유리수 평균은 이 모임에 속한다. specification마다 모든 정수 $j\\ge4$ 로 색인한 type을 둔다. 이 specification과 $j$ 에 대응하는 type $\\nu$ 는 $$t_\\nu=j^{-1},\\qquad I_\\nu=[j^{-j},2j^{-j}],\\qquad u_\\nu\\in I_\\nu .$$ type을 $\\nu\\in\\mathbb N$ 으로 나열하고 $c_\\nu>0$, $\\sum_\\nu c_\\nu=1$ 로 잡는다. type마다 독립으로 $n_\\nu\\sim\\operatorname{Poisson}(c_\\nu s_N)$, $s_N=N^{3/4}$. 각 항은 독립인 균일 site $i\\in[N]$ 와 자기 mark 과정의 독립 사본을 갖고, leaf에서 spin 가중치에 $\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$ 를 곱한다($1/2<\\psi_\\nu<3/2$). 개수, type, site는 root에 속하고, mark 변수는 배정된 보조 깊이에서 곱 prior로 뽑는다. $\\mathbf u=(u_\\nu)_\\nu$ 는 결정적 값으로 고정해 쓴다.", "type": "exact", "cards": ["pert:parameters", "pert:factor"], "source": "perturbations.tex 26–71", "lib": "-", "col": 0, "row": 2, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": {"node": "XF", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": null, "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "note": "예전에는 문맥 FP의 `provides` 로 받았다. 이제 edge로 받는다. 상위 `top.XFAM` 의 진술(L2 4.2 요약)보다 넓으므로 notes의 top 변경 제안 참조.", "ref": "XFAM"}, {"id": "XC", "kind": "ext", "title": "P6′ ① history 전개", "short": "혼합 미분 $=\\sum_Ec_E\\,E_{\\mathcal T_E}[\\cdots]$", "in": [], "cond": [], "out": "", "type": "blackbox", "cards": ["tree:extension-expansion", "x:tree-extension-history"], "source": "trees.tex 259–296", "lib": "-", "col": 0, "row": 3, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": {"node": "XC", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": null, "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "inherited"}, "note": "보내는 edge(p7-e6, p7-e12)는 `top.R3` 진술에 없는 두 가지를 싣는다: 같은 방향일 때 $t^k$ 계수는 우변$/k!$ (trees.tex 292–294), 임의 kernel 열에서 성립하고 history가 유한하며 $c_E$ 가 $(\\mathcal T,a_*,k,m)$ 로만 정해진다는 것(trees.tex 11–12, 259–276). notes 참조.", "ref": "R3", "pull": true}, {"id": "XD", "kind": "ext", "title": "P5 (iii)", "short": "tree multioverlap 모멘트의 수렴", "in": [], "cond": [], "out": "P5의 (iii): reservoir에서 깊이 $L$ 의 모든 고정 유한 prescribed tree 위 multioverlap의 모든 유한곱의 기대값이 선택된 수열을 따라 수렴한다. 고정한 깊이 $L\\ge2$ 에서 P5가 고른 수열 $(N_n,\\mathbf u_n)$ 을 따른다. 기대값은 선택된 결정적 벡터에서 평가하며 그 $N$ 의존은 적지 않는다. $L$, path 수, 섭동 type에 대한 균일성은 주장하지 않는다.", "type": "blackbox", "cards": ["pert:selection"], "source": "perturbations.tex 255–267, 301–312", "lib": "-", "col": 2, "row": 2, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": {"node": "XD", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": null, "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "ref": "XP5"}, {"id": "XE", "kind": "ext", "title": "P6′ ① 해석적 경계", "short": "kernel에 균일한 해석적 경계", "in": [], "cond": [], "out": "$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$($D_j$ 유계 실수 path 함수)에 대해 $Y_d$, 밀도 $W_{\\mathcal T}(A)$, 그 상쇄판 $E^{A_{\\boldsymbol t}}_{\\mathcal T}[H/A_{\\boldsymbol t}^{a_*}]$ 는 복소 영역 $\\sum_j\\lvert t_j\\rvert\\lVert D_j\\rVert_\\infty<1$ 에서 해석적이다. 이 합이 $\\rho<1$ 이하인 더 작은 닫힌 영역에서 이 식들과 더 작은 영역에서의 그 도함수들은 유계이고, 그 한계는 kernel에 대해 균일하다. 한계가 의존하는 것은 고정한 깊이, 수 $m_d$, tree 크기, 삽입 함수의 한계($\\lVert D_j\\rVert_\\infty$, $\\lVert H\\rVert_\\infty$)뿐이다. 상쇄 anchor 전개의 좌변에도 이 경계가 kernel에 균일하게 적용된다.", "type": "blackbox", "cards": ["x:tree-analytic-bounds"], "source": "trees.tex 156–176, 294–295", "lib": "-", "col": 2, "row": 3, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": {"node": "XE", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": null, "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "ref": "R3"}, {"id": "P1", "kind": "fact", "title": "Palm 항등식 (Poisson add-one)", "short": "$\\mathbb E\\sum_{q\\le n}F(\\xi_q;\\text{나머지})=\\lambda\\,\\mathbb EF(\\xi';\\text{원래 계})$", "in": [], "cond": [], "out": "개수 $n\\sim\\operatorname{Poisson}(\\lambda)$ 이고 항 $\\xi_1,\\xi_2,\\ldots$ 가 i.i.d.이며 개수, 항, 계의 나머지 $X$ 가 서로 독립이면, 적분 가능한 $F$ 에 대해 $$\\mathbb E\\sum_{q=1}^{n}F\\bigl(\\xi_q;\\,X,(\\xi_r)_{r\\le n,\\,r\\ne q}\\bigr)=\\lambda\\,\\mathbb E\\,F\\bigl(\\xi';\\,X,(\\xi_r)_{r\\le n}\\bigr),$$ $\\xi'$ 는 모든 것과 독립인 새 항이다. 말로: 합의 한 항을 골라내면 나머지 개수는 다시 평균 $\\lambda$ 의 Poisson이고 다른 것은 바뀌지 않아 나머지 계는 원래 법칙을 가지며, 골라낸 항은 독립인 새 항이 된다.", "type": "blackbox", "cards": ["pert:palm"], "source": "perturbations.tex 363–368 (이름과 말로 된 귀결만); 식의 꼴은 L2 6.3 단계 1", "lib": "없음 (현행 \"규칙으로 못 옮긴 것\")", "col": 2, "row": 1, "audit": {"state": "incomplete", "label": "미완결", "issues": ["edge 내용 미작성: p7-e3"], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "원문은 이 사실을 'Poisson add-one identity'라는 이름으로 증명 없이 인용하고 그 귀결을 말로만 적는다(363–368). 식의 꼴과 적분 가능 조건은 원문에 없고 L2 6.3 단계 1의 식을 옮겼다. 그래서 보내는 edge p7-e3은 complete:false.", "status": "미완결"}, {"id": "P2", "kind": "fact", "title": "polarization", "short": "대칭 $k$-선형 형식을 대각값에서 되찾는다", "in": [], "cond": [], "out": "대칭 $k$-선형 형식 $M$ 과 그 대각 $P(w)=M(w,\\ldots,w)$ 에 대해 $$M(w_1,\\ldots,w_k)=\\frac1{2^kk!}\\sum_{\\epsilon\\in\\{-1,1\\}^k}\\Bigl(\\prod_{j=1}^k\\epsilon_j\\Bigr)P\\Bigl(\\sum_{j=1}^k\\epsilon_jw_j\\Bigr)=\\frac{k^k}{2^kk!}\\sum_{\\epsilon\\in\\{-1,1\\}^k}\\Bigl(\\prod_{j=1}^k\\epsilon_j\\Bigr)P\\Bigl(k^{-1}\\sum_{j=1}^k\\epsilon_jw_j\\Bigr).$$ 둘째 꼴은 $P$ 가 $k$ 차 동차라서 나온다.", "type": "blackbox", "cards": ["pert:tree-identity"], "source": "perturbations.tex 479–487 (이름 'polarizing'과 적용한 식만)", "lib": "없음 (현행 \"규칙으로 못 옮긴 것\")", "col": 2, "row": 4, "audit": {"state": "incomplete", "label": "미완결", "issues": ["edge 내용 미작성: p7-e11"], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "원문은 일반형을 적지 않고 적용한 식(483–487)만 준다. 일반형은 지도 작성자가 적었고, 단계 4의 대입으로 483–487의 계수 $k^k/(2^kk!)$ 가 그대로 나오는 것을 손으로 확인했다($k=1,2$ 와 일반 $k$). 그래서 보내는 edge p7-e11은 complete:false.", "status": "미완결"}, {"id": "T0", "kind": "step", "title": "단계 0 — score와 f의 분리", "short": "$\\lvert\\mathbb E[fD_\\nu^{a_*}]-\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle\\rvert/(c_\\nu s_N)\\le\\lVert f\\rVert_\\infty e_{\\nu,N}$", "in": ["XA", "XB"], "cond": [], "out": "old tree $\\mathcal T$, anchor $a_*$, old replica multioverlap의 유계 다항식 $f$(계수는 $N$ 과 삽입 매개변수에 무관)를 고정한다. $\\mathbb Ef$ 는 이 tree 위의 root 평균 기대값이다. $D_\\nu^{a_*}$ 는 anchor path에서 평가한 score다. 고정 type $\\nu$ 와 선택된 수열의 각 $N$ 에서 $$\\frac{\\bigl\\lvert\\mathbb E[fD_\\nu^{a_*}]-\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle\\bigr\\rvert}{c_\\nu s_N}\\le\\lVert f\\rVert_\\infty\\,e_{\\nu,N},$$ 그리고 우변은 선택된 수열을 따라 $0$ 으로 간다. 근거: anchor의 주변 법칙은 tilted path 하나다(표본 규칙의 투영성). $\\mathbb E\\langle D_\\nu\\rangle$ 은 상수라 $\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle=\\mathbb E[f\\,\\mathbb E\\langle D_\\nu\\rangle]$ 이고 $\\mathbb E\\lvert D_\\nu^{a_*}-\\mathbb E\\langle D_\\nu\\rangle\\rvert=\\mathbb E\\langle\\lvert D_\\nu-\\mathbb E\\langle D_\\nu\\rangle\\rvert\\rangle$ 이다.", "type": "exact", "cards": ["pert:score-identity", "pert:tree-identity"], "source": "perturbations.tex 316–329", "lib": "-", "col": 1, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "원문은 'Therefore (pert:error) implies'(321–322) 한 문장이다. 진술의 '근거' 두 줄은 지도 작성자가 풀어 쓴 것이고 원문보다 아래 수준이다(author_filled 성격).", "status": "미완결"}, {"id": "T1", "kind": "step", "title": "단계 1 — Palm: score를 삽입으로", "short": "$J$, $H_N$ 의 정의와 $\\lvert H_N(t_\\nu,u_\\nu)\\rvert\\le\\lVert f\\rVert_\\infty e_{\\nu,N}$", "in": ["T0", "P1", "XB", "XF"], "cond": [], "out": "고정한 mark specification $(g,g_0,S_0)$ 에서 독립인 새 균일 site $i$ 와 그 mark 과정의 독립 사본을 들여 $A=1+tg\\sigma_i+ug_0S_0$ 로 둔다. $Y$ 는 이 $A$ 의 삽입 재귀, $W_{\\mathcal T}(A)$ 는 바뀐 tree 밀도다. 아래 기대값은 삽입 없는 reservoir를 독립 삽입 변수들의 prior kernel로 넓힌 것에서 잡는다: $$J_{N,\\mathcal T}(t,u)=\\mathbb E\\Bigl[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A^{a_*}}\\,W_{\\mathcal T}(A)\\Bigr],\\qquad H_N(t,u)=J_{N,\\mathcal T}(t,u)-\\mathbb Ef\\;J_{N,\\{a_*\\}}(t,u).$$ $J_{N,\\{a_*\\}}$ 는 anchor 하나뿐인 tree에서 시험함수를 $1$ 로 둔 같은 식이다. 이 specification의 type $\\nu$ 마다 $$\\frac{\\mathbb E[fD_\\nu^{a_*}]}{c_\\nu s_N}=J_{N,\\mathcal T}(t_\\nu,u_\\nu),\\qquad\\frac{\\mathbb E\\langle D_\\nu\\rangle}{c_\\nu s_N}=J_{N,\\{a_*\\}}(t_\\nu,u_\\nu)$$ 이고, 단계 0의 한계와 합치면 이 specification의 type $\\nu$ 마다, 선택된 수열의 각 $N$ 에서 $$\\lvert H_N(t_\\nu,u_\\nu)\\rvert\\le\\lVert f\\rVert_\\infty\\,e_{\\nu,N},$$ 여기서 $u_\\nu$ 는 선택된 벡터의 좌표다. 고정한 specification에서 함수 $H_N(t,u)$ 는 그 모든 type $j$ 에 대해 같은 함수다(base reservoir가 모든 type을 포함한 원래 Poisson 족 전체를 담는다). 그리고 고정 $\\nu$ 마다 $e_{\\nu,N}\\to0$ (선택된 수열, 고정 $L$). 이 node 안의 대입: Palm 항등식의 항 $=$ type $\\nu$ 의 섭동 항, $\\lambda=c_\\nu s_N$, $F=$ 그 항이 anchor path에서 내는 score $g_0^{a_*}S_0^{a_*}/A^{a_*}$ 곱하기 $f$. 나머지 계는 원래 reservoir 법칙을 갖고(남은 type-$\\nu$ 개수는 다시 평균 $c_\\nu s_N$ 의 Poisson, 다른 개수는 그대로), 골라낸 항은 매개변수 $(t_\\nu,u_\\nu)$ 의 독립인 새 삽입이 된다. 바뀐 tree 밀도가 $W_{\\mathcal T}(A)$ 이므로 score의 분모가 밀도의 anchor 인자 $A^{a_*}$ 를 지운다.", "type": "exact", "cards": ["pert:palm", "pert:palm-expression", "pert:analytic-difference"], "source": "perturbations.tex 331–381", "lib": "-", "col": 1, "row": 1, "audit": {"state": "incomplete", "label": "미완결", "issues": ["edge 내용 미작성: p7-e3"], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "예전 edge p7-e3의 substitution(항, $\\lambda$, $F$ 의 선택)은 이 node 안에 두었다. 안쪽 node가 이미 9개라 별도 대입 node를 두지 않았다. 원문 기호 $J,H$ 를 그대로 쓴다(L2의 $\\Pi=J$, $\\Xi=H$).", "status": "미완결"}, {"id": "T2", "kind": "step", "title": "단계 2 — Taylor 계수의 꼴", "short": "$[t^k]H_N(t,0)$ = tree multioverlap 모멘트의 유한 결합", "in": ["T1", "XC", "XB", "XE", "XF"], "cond": [], "out": "고정한 specification, old tree, anchor, $f$ 와 선택된 수열의 각 $N$, 각 $k\\ge0$ 에서 $$[t^k]\\,H_N(t,0)=\\frac1{k!}\\Bigl[\\sum_{E}c_E\\,\\mu_E\\,\\mathbb E\\bigl[f\\,R_{U_E}\\bigr]-\\mathbb Ef\\sum_{E'}c_{E'}\\,\\mu_{E'}\\,\\mathbb E\\bigl[R_{U_{E'}}\\bigr]\\Bigr].$$ $E$ 는 $(\\mathcal T,a_*)$ 에서, $E'$ 는 anchor 하나뿐인 tree에서 시작하는 $k$ color의 history(제약 없음)다. $U_E$ 는 leaf $a_1(E),\\ldots,a_k(E)$ 에 spin anchor이면 $a_*$ 를 더한 서로 다른 leaf의 집합이다. $\\mu_E=\\mathbb E_{\\rm marks}\\bigl[g_0^{a_*}\\prod_jg^{a_j(E)}\\bigr]$ 는 mark 법칙과 $\\mathcal T_E$ 의 vertex 공유만으로 정해지는 수다. $\\mathbb E[fR_{U_E}]$ 는 삽입 없는 reservoir에서 tree $\\mathcal T_E$ 위의 기대값이다. 두 합은 유한하고, $c_E$, $\\mu_E$, $f$ 의 계수는 $N$ 과 무관하다. $f$ 가 old replica multioverlap의 유계 다항식이므로, 각 Taylor 계수는 깊이 $L$ 의 고정 유한 prescribed tree 위 multioverlap 유한곱의 기대값과 그런 기대값 둘의 곱의, $N$ 과 무관한 계수를 가진 유한 일차결합이다. 이 node 안의 대입: $u=0$, 모든 방향 $D_j=g\\sigma_i$, $H=f\\,g_0^{a_*}S_0^{a_*}$ (anchor tree는 $H=g_0^{a_*}S_0^{a_*}$). $H$ 는 old tree 변수의 유계 함수로 $t$ 에 무관하고 $\\lvert g\\sigma_i\\rvert\\le1$ 이다. $E^{A}_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\,W_{\\mathcal T}(A)]$ 이므로 $J_{N,\\mathcal T}(t,0)=\\mathbb E\\,\\varphi(t)$, $\\varphi(t)=E^{A}_{\\mathcal T}[H/A^{a_*}]$ (root와 $i$ 가 주어진 조건부; 넓힌 kernel 열에 전개를 적용). 전개의 같은 방향 판으로 $\\varphi$ 의 $t^k$ 계수를 얻고, root 평균과 계수 추출을 맞바꾼 뒤, mark가 독립이고 prior가 바뀌지 않으므로 mark 평균 $\\mu_E$ 가 따로 나오며, 균일 site $i$ 를 평균하면 spin 곱이 $R_{U_E}$ 가 된다.", "type": "exact", "cards": ["pert:analytic", "tree:extension-expansion", "x:tree-extra-variables"], "source": "perturbations.tex 331–348, 399–405; trees.tex 135–140, 292–294", "lib": "-", "col": 1, "row": 2, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "author_filled: root 평균과 $t$ 에 대한 계수 추출의 교환($[t^k]\\mathbb E\\varphi=\\mathbb E[t^k]\\varphi$)은 원문 399–405와 L2 6.3 단계 2가 말로 적지 않는다. 지도 작성자가 XE(p7-e19)의 kernel 균일 해석적 경계로 채웠다(Cauchy 공식과 적분 순서 교환). mark 평균의 분리는 원문 401('mark law')과 512의 독립에서 읽은 것이며 $\\mu_E$ 라는 기호는 원문에 없다. 예전 edge p7-e6의 substitution은 이 node 안에 두었다. 하위 graph 후보 1순위(drafts의 T2 펼친 상자).", "status": "미완결"}, {"id": "T3", "kind": "step", "title": "단계 3 — Taylor 계수 소거", "short": "모든 $k$ 에서 $[t^k]H_N(t,0)\\to0$", "in": ["T2", "T1", "XD", "XE", "XF"], "cond": [], "out": "XE를 $A=1+tg\\sigma_i+ug_0S_0$(방향 $g\\sigma_i$, $g_0S_0$, 변수 $(t,u)$)에 대입하면 어떤 복소 근방 $\\lvert t\\rvert,\\lvert u\\rvert<\\rho$ 에서 $J_{N,\\mathcal T}$, $J_{N,\\{a_*\\}}$, $H_N$ 이 해석적이고 $N$ 과 선택된 매개변수 벡터에 균일하게 유계이며, $\\rho$ 를 줄이면 $u$-도함수도 균일하게 유계다. 상수는 고정 tree, $L$, $\\lVert f\\rVert_\\infty$ 에 의존해도 되지만 specification의 type 지표 $j$ 에는 의존하지 않는다. 단계 2의 꼴과 P5 (iii)으로 $H_N(t,0)$ 의 각 Taylor 계수가 수렴하고, 균일 해석적 경계와 Taylor 꼬리의 기하 경계로 $H_N(t,0)$ 은 더 작은 원판마다 해석함수 $H(t)$ 로 균일 수렴한다. 충분히 큰 고정 $j$ 마다, 대응하는 type과 단계 1로 $$\\limsup_{N\\to\\infty}\\lvert H_N(j^{-1},0)\\rvert\\le C\\limsup_{N\\to\\infty}\\lvert u_{\\nu,N}\\rvert\\le2Cj^{-j}$$ (score 오차는 $j$ 고정에서 $0$ 으로 가고, 모든 $j$ 에 같은 함수 $H_N$ 을 쓴다). 그래서 $\\lvert H(j^{-1})\\rvert\\le2Cj^{-j}$. $H$ 의 첫 0 아닌 Taylor 계수가 $q$ 차라면 충분히 큰 $j$ 에서 $\\lvert H(j^{-1})\\rvert\\ge cj^{-q}$ 여야 하므로 모순이고, $H\\equiv0$. 결론: mark 족에 든 모든 specification, 모든 고정 old tree, anchor, 유계 overlap 다항식 $f$ 에 대해 $H_N(t,0)$ 의 $t=0$ 에서의 모든 Taylor 계수가 선택된 수열을 따라 $0$ 으로 간다. 고정한 $L$ 에서의 진술이고, specification·tree·$f$·차수에 대한 균일성은 없다. 증명 안의 극한은 각 $j$ 를 고정하고 $N\\to\\infty$ 를 먼저 한 뒤 $j\\to\\infty$ 다.", "type": "exact", "cards": ["pert:analytic", "pert:analytic.s1", "pert:analytic.s2", "pert:analytic.s3"], "source": "perturbations.tex 383–425", "lib": "없음 (현행 \"규칙으로 못 옮긴 것\")", "col": 1, "row": 3, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "예전 edge p7-e9의 substitution($A=1+tg\\sigma_i+ug_0S_0$, 변수 $(t,u)$)은 이 node 안에 두었다. $\\lvert H_N(1/j,0)\\rvert\\le\\lvert H_N(1/j,u_{\\nu,N})\\rvert+\\lvert u_{\\nu,N}\\rvert\\sup\\lvert\\partial_uH_N\\rvert$ 로 나누는 걸음은 원문이 한 줄(414–416)로 합쳐 적는다.", "status": "미완결"}, {"id": "T4", "kind": "step", "title": "단계 4 — polarization: 한 방향에서 여러 방향으로", "short": "혼합 미분 $\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N\\rvert_0\\to0$", "in": ["T3", "P2", "XE", "XF"], "cond": [], "out": "$k\\ge1$ 이고 $g_0,g_1,\\ldots,g_k$ 가 같은 유한 개 보조 mark에서 함께 만든 유리수값 함수이며 절댓값이 $1$ 이하일 때, 독립인 새 균일 site $i$ 와 mark의 독립 사본으로 $A_{\\boldsymbol z}=1+\\sum_{j=1}^kz_jg_j\\sigma_i$ 를 삽입하고 $$\\Phi_N(\\boldsymbol z)=J^{\\boldsymbol z}_{N,\\mathcal T}-\\mathbb Ef\\,J^{\\boldsymbol z}_{N,\\{a_*\\}},\\qquad J^{\\boldsymbol z}_{N,\\mathcal T}=\\mathbb E\\Bigl[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A_{\\boldsymbol z}^{a_*}}\\,W_{\\mathcal T}(A_{\\boldsymbol z})\\Bigr]$$ 로 둔다($J^{\\boldsymbol z}_{N,\\{a_*\\}}$ 는 anchor 하나뿐인 tree와 시험함수 $1$). 기대값은 삽입 없는 reservoir를 독립 삽입 변수의 prior kernel로 넓힌 것이고, 이 계산의 mark는 모두 base reservoir와 독립이다. $Q_N(g)=k!\\,[t^k]H_N(t,0)$ (specification $(g,g_0,S_0)$)로 두면 $$\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N\\big\\rvert_{\\boldsymbol z=0}=\\frac{k^k}{2^kk!}\\sum_{\\epsilon\\in\\{-1,1\\}^k}\\Bigl(\\prod_{j=1}^k\\epsilon_j\\Bigr)Q_N\\Bigl(k^{-1}\\sum_{j=1}^k\\epsilon_jg_j\\Bigr).$$ 각 인자 $k^{-1}\\sum_j\\epsilon_jg_j$ 는 유리수값이고 절댓값이 $1$ 이하라 $(g,g_0)$ 가 고정한 mark 족에 든다. 그러므로 단계 3으로 이런 $(g_0,\\ldots,g_k)$ 마다 선택된 수열을 따라 $$\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N(\\boldsymbol z)\\big\\rvert_{\\boldsymbol z=0}\\longrightarrow0 .$$ $k=0$ 이면 같은 진술을 상수 mark의 상수 계수 $H_N(0,0)\\to0$ 으로 읽는다. 고정한 $L$, old tree, anchor, $f$, $k$, $g_0,\\ldots,g_k$ 에서의 진술이고 이들에 대한 균일성은 없다. 이 node 안의 대입: $\\boldsymbol z=t\\epsilon/k$ 이면 $A_{\\boldsymbol z}=1+tg\\sigma_i$, $g=k^{-1}\\sum_j\\epsilon_jg_j$ 라 $\\Phi_N(t\\epsilon/k)=H_N^{(g,g_0)}(t,0)$ 이다. 따라서 $\\Phi_N$ 의 $0$ 에서의 $k$ 차 동차 Taylor 부분 $P_k$ 에 대해 $Q_N(g)=k!\\,P_k(\\epsilon/k)$ 이고, polarization을 $P_k$ 에 적용한다(혼합 미분 $=k!\\,M(e_1,\\ldots,e_k)$).", "type": "exact", "cards": ["pert:tree-identity", "pert:tree-identity.s1", "pert:tree-identity.s2"], "source": "perturbations.tex 472–490", "lib": "-", "col": 1, "row": 4, "audit": {"state": "incomplete", "label": "미완결", "issues": ["edge 내용 미작성: p7-e11"], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "author_filled: 원문 479–481은 '혼합 미분은 한 $g$ 의 $k$ 차 계수를 polarization한 대칭 다중선형식'이라고만 말한다. $\\Phi_N(t\\epsilon/k)=H^{(g,g_0)}_N(t,0)$ 의 동일시, $\\Phi_N$ 이 $\\boldsymbol z$ 에 대해 $0$ 근방에서 해석적이라는 것(root 평균 뒤; XE p7-e23으로 채움), polarization을 Taylor 부분 $P_k$ 에 적용하는 것은 지도 작성자가 채웠다. 예전 edge p7-e11의 substitution('동차식 $=g\\mapsto k![t^k]\\Xi_N$')은 이 node 안에 두었다. 예전 p7-e12(XC→T4)는 원문대로 단계 5로 옮겼다(526–529).", "status": "미완결"}, {"id": "P3", "kind": "step", "title": "mark selector", "short": "mark 평균 = ‘요구된 vertex 공유’의 지시함수", "in": ["XF"], "cond": [], "out": "color 쌍 $a,b\\in\\{0,\\ldots,k\\}$(anchor는 color $0$)와 깊이 $1\\le d\\le L-1$ 에 대해 ‘split 깊이가 $d$ 이상’은 ‘깊이 $d$ vertex를 공유한다’와 같다. 그 깊이에 새 독립 Rademacher 좌표를 두고 $g_a$, $g_b$ 둘 다에 그 인자를 준다. 유한 개의 요구에는 요구마다 다른 독립 좌표를 쓰고 각 $g_a$ 를 배정된 인자의 곱으로 정의한다. 그러면 서로 다른 replica 위치를 쓰는 history $E$ 마다 $$\\mathbb E_{\\rm marks}\\Bigl[g_0^{a_*}\\prod_{j=1}^kg_j^{a_j(E)}\\Bigr]=\\prod_{(a,b,d)\\ \\text{요구}}\\mathbf 1_{\\{a,b\\text{ 가 깊이 }d\\text{ vertex를 공유}\\}} .$$ 공유 지시함수를 $H_d(a,b)$, 서로 다른 위치에 대해 $H_0=1$, $H_L=0$ 으로 두면(값이 같아도 위치로 판정) 깊이 $d$ 에서 정확히 갈라짐은 $H_d-H_{d+1}$($0\\le d\\le L-1$)이다. 그 곱과 유한 일차결합으로 처방한 일관된 colored shape 하나 또는 허용한 shape들의 모임을 고를 수 있다. 일차결합의 각 항에서 $g_0,\\ldots,g_k$ 는 부호의 곱이라 값이 $\\{-1,1\\}$ 에 있고, 이 함수들과 그 polarization 평균은 처음 고정한 mark 족에 속한다. 상수 mark가 $k=0$ 을 덮는다. 쓰는 mark는 깊이 $L-1$ 까지뿐이다.", "type": "exact", "cards": ["pert:tree-identity", "pert:tree-identity.s3"], "source": "perturbations.tex 494–524, 533–535", "lib": "없음", "col": 2, "row": 5, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "예전에는 fact였다. 원문은 이 사실을 인용하지 않고 섭동족의 mark 규칙(26–38)에서 짧게 정당화한다(499–501: 공유하면 같은 부호의 제곱 $1$, 아니면 독립 부호의 곱의 평균 $0$). 그래서 step으로 바꾸고 XF에서 mark 규칙을 받게 했다.", "status": "미완결"}, {"id": "T5", "kind": "step", "title": "단계 5 — 제약 고르기와 site 평균", "short": "혼합 전개, mark selector, site 평균으로 주 식", "in": ["T4", "P3", "XC", "XE", "XB"], "cond": [], "out": "$S_0=\\sigma_i$ 이면 spin anchor, $S_0=1$ 이면 marker anchor라 한다. 더하는 color는 $1,\\ldots,k$ 로 순서를 매기고 anchor는 color $0$ 이다. color들은 상쇄 anchor extension 규칙에 따라 anchor가 아닌 서로 다른 replica 위치를 차지한다. 제약 $\\mathcal C$ 는 더한 color들과 anchor 사이의 쌍별 split 깊이의 일관된 모임을 처방하고, 다른 old replica에 관한 제약은 두지 않는다. $\\mathfrak E(\\mathcal T,a_*,\\mathcal C)$ 는 $\\mathcal C$ 를 지키는 extension history의 모임이고 $c_E$ 는 그 계수다. history $E$ 에 대해 $$R_E=\\frac1N\\sum_{i=1}^N\\begin{cases}\\sigma_i^{a_*}\\prod_{j=1}^k\\sigma_i^{a_j(E)},&\\text{spin anchor},\\\\ \\prod_{j=1}^k\\sigma_i^{a_j(E)},&\\text{marker anchor}.\\end{cases}$$ $k=0$ 이면 각각 $R_{\\{a_*\\}}$ 와 $1$ 이다. P3의 selector로 $\\mathcal C$ 를 고르는 부호 곱 $(g_0^{(r)},\\ldots,g_k^{(r)})$ 와 유한 일차결합 계수 $\\lambda_r$ 를 잡는다. 각 $r$ 에서 단계 4의 $\\Phi_N^{(r)}$ 에 상쇄 anchor 혼합 전개를 적용한다(대입: $H=f\\,g_0^{a_*}S_0^{a_*}$, $D_j=g_j\\sigma_i$; anchor tree는 $H=g_0^{a_*}S_0^{a_*}$). root 평균과 혼합 미분을 맞바꾸면 $$\\partial_{z_1}\\cdots\\partial_{z_k}\\Phi_N^{(r)}\\big\\rvert_0=\\sum_Ec_E\\,\\mathbb E\\Bigl[f\\,g_0^{a_*}S_0^{a_*}\\prod_jg_j^{a_j(E)}\\sigma_i^{a_j(E)}\\Bigr]-\\mathbb Ef\\sum_{E'}c_{E'}\\,\\mathbb E\\Bigl[g_0^{a_*}S_0^{a_*}\\prod_jg_j^{a_j(E')}\\sigma_i^{a_j(E')}\\Bigr]$$ 이고 factorial이 붙지 않는다. mark는 base reservoir와 독립이고 tilt가 그 prior를 바꾸지 않으므로 mark 평균이 따로 나오고, $\\sum_r\\lambda_r$ 를 취하면 selector가 $\\mathcal C$ 를 지키는 history만 남긴다. 균일한 새 site $i$ 의 평균이 정확히 $R_E$ 다. 단계 4로 좌변이 $0$ 으로 가므로 주 식이 나온다. overlap 단항식에서 유한 일차결합으로 일반 유계 다항식 $f$ 로 넓힌다. 구성은 깊이 $L-1$ 까지의 mark만 쓴다: extension 규칙이 anchor나 이미 쓴 color를 다시 쓰지 않으므로 깊이 $L$ 에서의 일치 검사가 필요 없다. 결론: P5에서 고른 모든 수열을 따라 $$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E\\bigl[fR_E\\bigr]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E\\bigl[R_E\\bigr]\\longrightarrow0 .$$ 모든 고정 old tree, 두 종류의 anchor, multioverlap의 모든 유계 다항식 $f$, 순서 있는 추가 color의 모든 유한 개수, 모든 처방 $\\mathcal C$ 에서 성립하고 빈 추가도 허용한다. 오차는 고정한 $L$, tree, 제약에서 $L$ 에 대한 어떤 극한보다 먼저 $0$ 으로 보낸다. 수렴 속도와 $L$·path 수·섭동 type에 대한 균일성은 주장하지 않는다. 섭동 매개변수는 선택된 결정적 값이다.", "type": "exact", "cards": ["pert:tree-identity", "pert:tree-identity.s4"], "source": "perturbations.tex 427–470, 491–492, 512, 526–535", "lib": "-", "col": 1, "row": 5, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "note": "author_filled: 혼합 전개(root가 주어진 조건부)를 root 평균한 $\\Phi_N^{(r)}$ 에 쓰려면 평균과 혼합 미분의 교환이 필요하다. 원문 526–529('apply the mixed canceled-anchor expansion to the difference')와 L2 6.3 단계 4·5는 이를 말로 적지 않는다. XE(p7-e25)로 채웠다. 예전 edge p7-e14의 substitution($g_0,\\ldots,g_k=$ 제약에 맞춘 mark 곱)과 예전 p7-e12의 $D_j=g_j\\sigma_i$ 는 이 node 안에 두었다. 하위 graph 후보 2순위.", "status": "미완결"}, {"id": "OUT", "kind": "out", "title": "P7의 주 식", "short": "$\\sum_Ec_E\\mathbb E[fR_E]-\\mathbb Ef\\sum_Ec_E\\mathbb E[R_E]\\to0$", "in": ["T5"], "cond": [], "out": "", "type": "blackbox", "cards": ["pert:tree-identity"], "source": "perturbations.tex 451–470", "lib": "-", "col": 1, "row": 6, "audit": {"state": "output", "label": "출력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "inherited"}, "pull": true}], "edges": [{"from": "XA", "to": "T0", "type": "flow", "id": "p7-e1", "displayId": "e1", "caption": "score 집중", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$e_{\\nu,N}\\to0$ (고정 $\\nu$, 고정 $L$)", "stmt": "모든 고정 type $\\nu$ 에서 reservoir의 $e_{\\nu,N}\\to0$. 한 tilted path(말단 Gibbs 배위 포함) 위에서 type $\\nu$ 의 score는 $$D_\\nu=\\sum_{q=1}^{n_\\nu}\\frac{g_{0,q}S_{0,q}}{1+t_\\nu g_q\\sigma_{i_q}+u_\\nu g_{0,q}S_{0,q}}$$ 이다. $\\langle\\cdot\\rangle$ 은 root가 주어졌을 때 tilted path 하나를 따른 기대값, $\\mathbb E_{\\mathbf u}$ 는 고정한 $\\mathbf u$ 에서의 root 평균이고 $$e_{\\nu,N}(\\mathbf u)=\\frac1{c_\\nu s_N}\\,\\mathbb E_{\\mathbf u}\\bigl\\langle\\lvert D_\\nu-\\mathbb E_{\\mathbf u}\\langle D_\\nu\\rangle\\rvert\\bigr\\rangle .$$ 고정한 깊이 $L\\ge2$ 에서 P5가 고른 수열 $(N_n,\\mathbf u_n)$ 을 따른다. 기대값은 선택된 결정적 벡터에서 평가하며 그 $N$ 의존은 적지 않는다. $L$, path 수, 섭동 type에 대한 균일성은 주장하지 않는다.", "src": "perturbations.tex 75–93, 255–267, 308–312", "nottaken": "P5의 (i)(낮은 증분)은 이 graph가 쓰지 않는다. (iii)은 같은 P5를 가리키는 XD에서 p7-e8로 들어온다."}, {"from": "XB", "to": "T0", "type": "def", "id": "p7-e16", "displayId": "e16", "caption": "표본 규칙", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "한 leaf의 주변 법칙은 path 하나", "stmt": "tree $\\mathcal T$ 는 공통 root와 깊이 $L$ 에서 끝나는 유한 개의 이름 붙은 path다. 각 vertex에서 서로 다른 자식은 prefix가 주어졌을 때 해당 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 root가 주어진 조건부의 이 표본 기대값이다. leaf 일부와 남은 leaf가 쓰지 않는 path 부분을 지워도 남은 tree의 표본 법칙은 그대로다. 깊이 $L$ 의 replica 위치는 서로 다른 vertex이고, 거기서 뽑힌 값은 같아도 된다. 지정하지 않은 기대값 $\\mathbb E$ 는 root와 지정한 tree의 표본을 포함한다.", "src": "trees.tex 29–39, 48–49; perturbations.tex 320–321", "nottaken": "multioverlap 정의, 삽입 재귀와 밀도, 새 변수 규칙은 싣지 않는다(p7-e4, p7-e18, p7-e26으로 간다)."}, {"from": "T0", "to": "T1", "type": "flow", "id": "p7-e2", "displayId": "e2", "caption": "분리 한계", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$\\lvert\\mathbb E[fD_\\nu^{a_*}]-\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle\\rvert/(c_\\nu s_N)\\le\\lVert f\\rVert_\\infty e_{\\nu,N}$", "stmt": "old tree $\\mathcal T$, anchor $a_*$, 유계 overlap 다항식 $f$ 를 고정한다. 고정 type $\\nu$ 와 선택된 수열의 각 $N$ 에서 $$\\frac{\\bigl\\lvert\\mathbb E[fD_\\nu^{a_*}]-\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle\\bigr\\rvert}{c_\\nu s_N}\\le\\lVert f\\rVert_\\infty\\,e_{\\nu,N},$$ $D_\\nu^{a_*}$ 는 anchor path에서 평가한 score다. 그리고 고정 $\\nu$ 마다 $e_{\\nu,N}\\to0$ (선택된 수열, 고정 $L$).", "src": "perturbations.tex 316–329", "nottaken": "T0 안의 정당화(anchor 주변 법칙, 상수 $\\mathbb E\\langle D_\\nu\\rangle$)는 싣지 않는다."}, {"from": "P1", "to": "T1", "type": "call", "id": "p7-e3", "displayId": "e3", "caption": "Palm", "contentComplete": false, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "label": "1회", "pass": "개수 $n\\sim\\operatorname{Poisson}(\\lambda)$ 이고 항 $\\xi_1,\\xi_2,\\ldots$ 가 i.i.d.이며 개수, 항, 계의 나머지 $X$ 가 서로 독립이면, 적분 가능한 $F$ 에 대해 $$\\mathbb E\\sum_{q=1}^{n}F\\bigl(\\xi_q;\\,X,(\\xi_r)_{r\\le n,\\,r\\ne q}\\bigr)=\\lambda\\,\\mathbb E\\,F\\bigl(\\xi';\\,X,(\\xi_r)_{r\\le n}\\bigr),$$ $\\xi'$ 는 모든 것과 독립인 새 항이다. 말로: 합의 한 항을 골라내면 나머지 개수는 다시 평균 $\\lambda$ 의 Poisson이고 다른 것은 바뀌지 않아 나머지 계는 원래 법칙을 가지며, 골라낸 항은 독립인 새 항이 된다.", "fit": ""}, {"from": "XB", "to": "T1", "type": "def", "id": "p7-e4", "displayId": "e4", "caption": "삽입 밀도", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$E^A_{\\mathcal T}=E_{\\mathcal T}[\\cdot\\,W_{\\mathcal T}(A)]$, 넓힌 kernel", "stmt": "양의 path 함수 $A$(root가 주어졌을 때 위로 유계이고 0에서 떨어짐)에 대해 $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d},\\qquad K_d^A=\\Bigl(\\frac{Y_d}{Y_{d-1}}\\Bigr)^{m_d}K_d .$$ $K_d^A$ 는 확률 kernel이고, 위첨자 $A$ 는 tree 기대값이 이 kernel을 쓴다는 뜻이다. 삽입 미적분: spin 가중치에 $A$ 를 곱하면 kernel이 $K_d^A$ 로 바뀌고, 처방된 tree의 바뀐 법칙의 조건부 결합 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta},\\qquad\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1},$$ 곧 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 이다($Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$). 삽입은 원래 모형에 없던 변수를 써도 된다. 그 변수들의 독립 prior kernel로 각 path kernel을 넓힌 뒤 위 내용을 적용한다. 원래 backward 로그는 그 변수에 의존하지 않으므로 원래 tilt는 그 변수들의 조건부 prior kernel을 바꾸지 않는다. 추가한 root 변수는 quenched로 남는다.", "src": "trees.tex 67–110, 135–140", "nottaken": "표본 규칙의 투영성(p7-e16)과 multioverlap 정의(p7-e18)는 싣지 않는다."}, {"from": "XF", "to": "T1", "type": "def", "id": "p7-e17", "displayId": "e17", "caption": "Poisson 족", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "type별 Poisson 개수, 새 site와 mark 사본", "stmt": "type을 $\\nu\\in\\mathbb N$ 으로 나열하고 $c_\\nu>0$, $\\sum_\\nu c_\\nu=1$ 로 잡는다. type마다 독립으로 $n_\\nu\\sim\\operatorname{Poisson}(c_\\nu s_N)$, $s_N=N^{3/4}$. 각 항은 독립인 균일 site $i\\in[N]$ 와 자기 mark 과정의 독립 사본을 갖고, leaf에서 spin 가중치에 $\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$ 를 곱한다($1/2<\\psi_\\nu<3/2$). 개수, type, site는 root에 속하고, mark 변수는 배정된 보조 깊이에서 곱 prior로 뽑는다. $\\mathbf u=(u_\\nu)_\\nu$ 는 결정적 값으로 고정해 쓴다. mark specification $(g,g_0,S_0)$ 의 각 type $\\nu$ 에서 $t_\\nu=j^{-1}$, $u_\\nu\\in I_\\nu=[j^{-j},2j^{-j}]$ 이다.", "src": "perturbations.tex 26–35, 43–65", "nottaken": "mark 좌표의 공유 규칙과 족의 닫힘은 싣지 않는다(p7-e20, p7-e24, p7-e27)."}, {"from": "T1", "to": "T2", "type": "flow", "id": "p7-e5", "displayId": "e5", "caption": "상쇄량", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$J_{N,\\mathcal T}(t,u)$, $H_N(t,u)$ 의 정의", "stmt": "고정한 mark specification $(g,g_0,S_0)$ 에서 독립인 새 균일 site $i$ 와 그 mark 과정의 독립 사본을 들여 $A=1+tg\\sigma_i+ug_0S_0$ 로 둔다. $Y$ 는 이 $A$ 의 삽입 재귀, $W_{\\mathcal T}(A)$ 는 바뀐 tree 밀도다. 아래 기대값은 삽입 없는 reservoir를 독립 삽입 변수들의 prior kernel로 넓힌 것에서 잡는다: $$J_{N,\\mathcal T}(t,u)=\\mathbb E\\Bigl[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A^{a_*}}\\,W_{\\mathcal T}(A)\\Bigr],\\qquad H_N(t,u)=J_{N,\\mathcal T}(t,u)-\\mathbb Ef\\;J_{N,\\{a_*\\}}(t,u).$$ $J_{N,\\{a_*\\}}$ 는 anchor 하나뿐인 tree에서 시험함수를 $1$ 로 둔 같은 식이다.", "src": "perturbations.tex 331–348", "nottaken": "Palm 단계의 값 $J(t_\\nu,u_\\nu)$ 와 한계 $\\lvert H_N(t_\\nu,u_\\nu)\\rvert\\le\\lVert f\\rVert_\\infty e_{\\nu,N}$, '모든 $j$ 에 같은 함수'는 싣지 않는다. 이들은 단계 2를 거치지 않고 p7-e21로 단계 3에 간다."}, {"from": "XC", "to": "T2", "type": "call", "id": "p7-e6", "displayId": "e6", "caption": "history 전개", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "상쇄 anchor 전개의 같은 방향 판", "stmt": "유한 깊이의 임의 확률 kernel 열에서, root가 주어진 조건부로: $H$ 가 old tree 변수의 유계 함수이고 삽입 매개변수에 무관하며 $D_1,\\ldots,D_k$ 가 유계 실수 path 함수일 때 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$ 에 대해 $$\\partial_{t_1}\\cdots\\partial_{t_k}\\,E^{A_{\\boldsymbol t}}_{\\mathcal T}\\!\\left[\\frac{H}{A_{\\boldsymbol t}^{a_*}}\\right]\\Bigg\\rvert_{\\boldsymbol t=0}=\\sum_{E}c_E\\;E_{\\mathcal T_E}\\!\\Bigl[H\\prod_{j=1}^kD_j^{a_j(E)}\\Bigr].$$ 식은 color의 어떤 고정 순서에서도 성립하고, 빈 extension의 무게는 $1$ 이다. old tree $\\mathcal T$ 와 anchor leaf $a_*$ 에서 시작해 color $1,\\ldots,k$ 를 차례로 준다. 다음 color마다 (i) $a_*$ 가 아닌 아직 안 쓴 old leaf를 계수 $1$ 로 고르거나, (ii) 현재 tree(안 쓴 것을 포함한 모든 old path와 이미 더한 path)의 내부 vertex $\\beta$ 에서 fresh path를 만들어 계수 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$ 을 받는다. fresh path는 갈라지는 vertex에서 새 자식, 그보다 깊은 모든 깊이에서 새 vertex를 쓴다. 고른 leaf는 그 color를 받고 다시 고를 수 없다. history $E$ 는 이 선택의 기록이고, $a_j(E)$ 는 color $j$ 를 받은 leaf, $\\mathcal T_E$ 는 마지막 tree, $c_E$ 는 계수들의 곱이다. 고정한 $k$ 에서 history는 유한 개이고, $c_E$ 는 $(\\mathcal T,a_*,k)$ 와 수 $m_d$ 만으로 정해진다. 모든 방향이 같으면($D_j=D$), $A=1+tD$ 일 때 $t\\mapsto E^{A}_{\\mathcal T}[H/A^{a_*}]$ 의 $t^k$ 계수는 위 우변을 $k!$ 로 나눈 것이다.", "src": "trees.tex 11–12, 259–296; perturbations.tex 403–404", "nottaken": "해석적 경계는 XE에서 따로 온다(p7-e19). 혼합 방향 판의 사용은 단계 5로 간다(p7-e12). ②·③(모양별 총합, 계수 한계)은 이 graph가 쓰지 않는다."}, {"from": "XB", "to": "T2", "type": "def", "id": "p7-e18", "displayId": "e18", "caption": "새 변수", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "넓힌 kernel, 표본 규칙, multioverlap", "stmt": "양의 path 함수 $A$(root가 주어졌을 때 위로 유계이고 0에서 떨어짐)에 대해 $$Y_L=A,\\qquad Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d},\\qquad K_d^A=\\Bigl(\\frac{Y_d}{Y_{d-1}}\\Bigr)^{m_d}K_d .$$ $K_d^A$ 는 확률 kernel이고, 위첨자 $A$ 는 tree 기대값이 이 kernel을 쓴다는 뜻이다. 삽입 미적분: spin 가중치에 $A$ 를 곱하면 kernel이 $K_d^A$ 로 바뀌고, 처방된 tree의 바뀐 법칙의 조건부 결합 밀도는 $$W_{\\mathcal T}(A)=\\frac{dP^A_{\\mathcal T}}{dP_{\\mathcal T}}=\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a\\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}Y_\\beta^{\\gamma_\\beta},\\qquad\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1},$$ 곧 $E^A_{\\mathcal T}[\\,\\cdot\\,]=E_{\\mathcal T}[\\,\\cdot\\;W_{\\mathcal T}(A)]$ 이다($Y_\\beta$ 는 $\\beta$ 의 prefix에서 평가한 $Y_{d_\\beta}$). 삽입은 원래 모형에 없던 변수를 써도 된다. 그 변수들의 독립 prior kernel로 각 path kernel을 넓힌 뒤 위 내용을 적용한다. 원래 backward 로그는 그 변수에 의존하지 않으므로 원래 tilt는 그 변수들의 조건부 prior kernel을 바꾸지 않는다. 추가한 root 변수는 quenched로 남는다. tree $\\mathcal T$ 는 공통 root와 깊이 $L$ 에서 끝나는 유한 개의 이름 붙은 path다. 각 vertex에서 서로 다른 자식은 prefix가 주어졌을 때 해당 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 root가 주어진 조건부의 이 표본 기대값이다. leaf 일부와 남은 leaf가 쓰지 않는 path 부분을 지워도 남은 tree의 표본 법칙은 그대로다. 깊이 $L$ 의 replica 위치는 서로 다른 vertex이고, 거기서 뽑힌 값은 같아도 된다. 지정하지 않은 기대값 $\\mathbb E$ 는 root와 지정한 tree의 표본을 포함한다. 말단 변수가 spin 배위 $\\sigma^a\\in\\{-1,1\\}^N$ 일 때 replica leaf 부분집합 $S$ 의 multioverlap은 $R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a$, $R_\\varnothing=1$ 이다.", "src": "trees.tex 29–49, 67–110, 135–140", "nottaken": "없음."}, {"from": "XE", "to": "T2", "type": "call", "id": "p7-e19", "displayId": "e19", "caption": "교환 근거", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "kernel 균일 해석적 경계", "stmt": "$A_{\\boldsymbol t}=1+\\sum_jt_jD_j$($D_j$ 유계 실수 path 함수)에 대해 $Y_d$, 밀도 $W_{\\mathcal T}(A)$, 그 상쇄판 $E^{A_{\\boldsymbol t}}_{\\mathcal T}[H/A_{\\boldsymbol t}^{a_*}]$ 는 복소 영역 $\\sum_j\\lvert t_j\\rvert\\lVert D_j\\rVert_\\infty<1$ 에서 해석적이다. 이 합이 $\\rho<1$ 이하인 더 작은 닫힌 영역에서 이 식들과 더 작은 영역에서의 그 도함수들은 유계이고, 그 한계는 kernel에 대해 균일하다. 한계가 의존하는 것은 고정한 깊이, 수 $m_d$, tree 크기, 삽입 함수의 한계($\\lVert D_j\\rVert_\\infty$, $\\lVert H\\rVert_\\infty$)뿐이다.", "src": "trees.tex 156–176, 294–295", "nottaken": "$u$ 방향을 포함한 두 변수 판과 $\\partial_u$ 한계는 단계 3이 쓴다(p7-e9)."}, {"from": "XF", "to": "T2", "type": "def", "id": "p7-e20", "displayId": "e20", "caption": "mark 규칙", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "mark 법칙과 균일 site", "stmt": "mark specification은 유한 개 $n\\ge0$ 의 이름 붙은 Rademacher 좌표, 각 좌표에 배정한 깊이 $\\in\\{1,\\ldots,L-1\\}$, 두 함수 $g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, 그리고 $S_0=1$ 또는 $S_0=\\sigma_i$ 의 선택이다. 각 좌표는 보조 path를 따라 배정된 깊이에서 뽑는다. 서로 다른 좌표는 독립이고, 한 좌표의 값은 공유한 vertex에서 공유되며 다른 vertex에서는 독립이다. $n=0$ 은 상수 함수를 포함한다. 각 항의 site $i$ 는 $[N]$ 위 균일이고 독립이며, mark 변수는 배정된 보조 깊이에서 곱 prior로 뽑는다. 개수, type, site는 root에 속한다.", "src": "perturbations.tex 28–35, 54–62", "nottaken": "type 매개변수와 Poisson 개수는 싣지 않는다."}, {"from": "T2", "to": "T3", "type": "flow", "id": "p7-e7", "displayId": "e7", "caption": "모멘트 결합", "contentComplete": true, "open": false, "contractIssues": [], "outputRef": null, "useNote": "", "short": "$[t^k]H_N(t,0)$ 의 꼴", "stmt": "고정한 specification, old tree, anchor, $f$ 와 선택된 수열의 각 $N$, 각 $k\\ge0$ 에서 $$[t^k]\\,H_N(t,0)=\\frac1{k!}\\Bigl[\\sum_{E}c_E\\,\\mu_E\\,\\mathbb E\\bigl[f\\,R_{U_E}\\bigr]-\\mathbb Ef\\sum_{E'}c_{E'}\\,\\mu_{E'}\\,\\mathbb E\\bigl[R_{U_{E'}}\\bigr]\\Bigr].$$ $E$ 는 $(\\mathcal T,a_*)$ 에서, $E'$ 는 anchor 하나뿐인 tree에서 시작하는 $k$ color의 history(제약 없음)다. $U_E$ 는 leaf $a_1(E),\\ldots,a_k(E)$ 에 spin anchor이면 $a_*$ 를 더한 서로 다른 leaf의 집합이다. $\\mu_E=\\mathbb E_{\\rm marks}\\bigl[g_0^{a_*}\\prod_jg^{a_j(E)}\\bigr]$ 는 mark 법칙과 $\\mathcal T_E$ 의 vertex 공유만으로 정해지는 수다. $\\mathbb E[fR_{U_E}]$ 는 삽입 없는 reservoir에서 tree
