a\\cdot b_\\ell)^2$", "by": "e22"}, {"expr": "$\\frac{c_d}2\\mathbb E(a\\cdot b-a\\cdot b_d)^2\\le2\\delta+|\\rho_N|+4p_N(S,e)$", "by": "f13; 앞 줄들; floor: eta_regular"}, {"expr": "$2v_N(S,d)\\le\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\le3\\mathbb E(a\\cdot b-a\\cdot b_d)^2+C(2p_N(S,e))^2$, $p_N\\le k$ 로 $p_N^2\\le kp_N$", "by": "e20; e19; 앞 줄"}, {"expr": "eq decor:covariance-induction-estimate", "by": "앞 줄; f13"}]}, "edgesOut": [{"id": "f14", "rawId": "f14", "kind": "흐름", "to": "fiber 경계, 재귀식, 결론", "stmt": "$v_N(S,d)\\le C_{k,\\eta}(\\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S))+C_{L,k,\\eta}\\varepsilon_{N,L,k}$ (eq decor:covariance-induction-estimate).", "by": "", "src": "decorrelation.tex 485–490, 512–517"}], "checks": [], "open": []}, "s10_average": {"map": "cc", "atomic": true, "title": "fiber 경계, 재귀식, 결론", "label": "vertex 보기 (미완결)", "where": "", "source": "decorrelation.tex 491–523", "context": [], "floor": [], "premiseMode": "legacy", "introductions": [], "edgesIn": [{"id": "e2", "rawId": "e2", "kind": "정의", "from": "평균의 성질 (AVG)", "stmt": "[AVG.shift_regular] 옮긴 좌표의 $\\eta$-regular 배정이 큰 $L$ 에서 $\\eta/2$-regular 배정으로 단사. [AVG.unused_coord] 쓰지 않는 좌표의 합은 많아야 $L$ 배, 정규화가 상쇄 (원상 $\\le L^{D-D_j}$). [AVG.holder] $\\mathcal A(z^\\gamma)\\le(\\mathcal Az)^\\gamma$ (fiber 경계의 둘째 부등식).", "src": "decorrelation.tex 497–506"}, {"id": "e21", "rawId": "e21", "kind": "흐름", "from": "항등식 오차 $\\varepsilon_{N,L,k}$ (IDE)", "stmt": "[IDE.eps_def] eq decor:identity-error 의 $\\varepsilon_{N,L,k}$. [IDE.eps_to_zero] 고정 $L$ 에서 $\\limsup_N$ 하면 그 항은 0.", "src": "decorrelation.tex 512–514"}, {"id": "f2", "rawId": "f2", "kind": "흐름", "from": "귀납의 틀과 $V_{k,L}$", "stmt": "낮은 차수 공분산의 평균(쓰지 않는 좌표, 옮긴 깊이 포함)은 $V_{k-1,L}(\\eta/2)$ 로 막힌다; $V$ 의 최대는 유한 개 topology 위.", "src": "decorrelation.tex 258–262, 512–522"}, {"id": "f3", "rawId": "f3", "kind": "흐름", "from": "잎 하나: $V_{1,L}(\\eta)\\le\\delta/\\eta$", "stmt": "base case $V_{1,L}(\\eta)\\le\\delta/\\eta$.", "src": "decorrelation.tex 290, 522"}, {"id": "f9", "rawId": "f9", "kind": "흐름", "from": "목표 두 쪽의 사영과 깊이 되돌림", "stmt": "$\\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L$ (eq decor:projection-shift-error).", "src": "decorrelation.tex 370–372, 513"}, {"id": "f14", "rawId": "f14", "kind": "흐름", "from": "사영 three-copy 경계와 $v_N(S,d)$ 의 귀납 추정", "stmt": "$v_N(S,d)\\le C_{k,\\eta}(\\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S))+C_{L,k,\\eta}\\varepsilon_{N,L,k}$ (eq decor:covariance-induction-estimate).", "src": "decorrelation.tex 485–490, 512–517"}], "node": {"kind": "원자 node — 계산 하나", "chain": [{"expr": "첫 부등식: 원상 수 $\\le L^{D-D_j}$, 상 좌표 $\\eta/2$-regular", "by": "e2"}, {"expr": "둘째 부등식: $\\mathcal A_{L,\\eta/2}(z^\\gamma)\\le(\\mathcal A_{L,\\eta/2}z)^\\gamma$", "by": "e2"}, {"expr": "$\\mathcal A_{L,\\eta}p_N\\le\\sum_j(\\mathcal A_{L,\\eta/2}v_N(T_j,\\cdot))^{1/4}$, $\\limsup_N$ 뒤 $\\le sV_{k-1,L}(\\eta/2)^{1/4}$", "by": "앞 줄들; f2"}, {"expr": "$\\mathcal A h_N\\le(\\mathcal Ah_N^2)^{1/2}\\le(C_k/L)^{1/2}$, $\\delta\\le L^{-1/2}$, $\\varepsilon$ 항은 $\\limsup_N$ 에서 0", "by": "f9; e21; floor: Cauchy–Schwarz, 총질량 ≤1"}, {"expr": "$V_{k,L}(\\eta)\\le C_{k,\\eta}(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4})$ (eq decor:induction-recursion)", "by": "f14; 앞 줄들"}, {"expr": "$V_{1,L}(\\eta)\\le\\delta/\\eta$ 와 재귀로 $V_{k,L}(\\eta)\\to0$", "by": "f3; 앞 줄"}]}, "edgesOut": [{"id": "f16", "rawId": "f16", "kind": "흐름", "to": "fiber 경계 eq decor:fiber-bound", "stmt": "eq decor:fiber-bound 와 shift 하지 않은 항의 같은 경계.", "by": "", "src": "decorrelation.tex 491–509"}, {"id": "f17", "rawId": "f17", "kind": "흐름", "to": "결론: $V_{k,L}(\\eta)\\to0$ 과 명제", "stmt": "재귀식 $V_{k,L}(\\eta)\\le C_{k,\\eta}(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4})$ 와 base case 로 $V_{k,L}(\\eta)\\to0$; 따라서 명제.", "by": "", "src": "decorrelation.tex 515–523"}], "checks": [], "open": []}};
const SRCLINES = {"decorrelation.tex": {"30": "For a nonnegative array $z(\\mathbf q)$ on $a$ depth coordinates, put", "31": "\\begin{equation}", "32": " \\mathcal A_{L,\\eta}z", "33": "   =L^{-a}\\sum_{\\mathbf q\\;\\eta\\text{-regular}}z(\\mathbf q).", "34": " \\label{decor:average-definition}", "35": "\\end{equation}", "36": "Additional ordering restrictions, such as $d<\\min_v q_v$, are included", "37": "in the summation domain.  These are unnormalized averages: their total", "38": "mass is at most one.  Consequently, for $0<\\gamma\\le1$,", "39": "\\begin{equation}", "40": " \\mathcal A_{L,\\eta}(z^\\gamma)", "41": "       \\le (\\mathcal A_{L,\\eta}z)^\\gamma.", "42": " \\label{decor:average-holder}", "43": "\\end{equation}", "44": "Two elementary comparisons will recur. Summing over an unused coordinate", "45": "costs at most $L$, canceled by its normalization. A fixed integer shift of", "46": "any subset of the coordinates maps $\\eta$-regular assignments injectively", "47": "into $\\eta/2$-regular assignments for all sufficiently large $L$.", "21": "for the number of branching vertices of a topology $S$.  Fix $\\eta>0$.", "22": "A depth assignment is \\emph{$\\eta$-regular} if every assigned depth divided", "23": "by $L$ lies in $(\\eta,1-\\eta)$ and the normalized depths of distinct", "24": "branching vertices differ by more than $\\eta$.  When an additional", "25": "prefix depth $d$ is specified, it must satisfy the same restrictions", "26": "relative to all branching depths.  When two copies of one topology use", "27": "aligned depths, corresponding vertices share one depth coordinate;", "28": "regularity is imposed on these distinct coordinates.", "18": "A topology is a finite rooted tree on labeled leaves, with unary vertices", "19": "suppressed.  Each branching vertex is assigned an integer depth in", "20": "$\\{0,\\ldots,L-1\\}$, increasing strictly along every branch.  Write $b(S)$", "49": "There are only finitely many labeled topologies of any bounded size and,", "50": "at fixed $L$, only finitely many assignments of their depths.  Thus", "51": "errors in Theorem~\\ref{pert:tree-identity} can be maximized over any", "52": "of the finite collections used below before taking $N\\to\\infty$.", "53": "We denote such a maximum by $\\varepsilon_{N,L,k}$; for each fixed $L,k$,", "54": "\\begin{equation}", "55": " \\varepsilon_{N,L,k}\\longrightarrow0.", "56": " \\label{decor:identity-error}", "57": "\\end{equation}", "58": "Constants multiplying this error may depend arbitrarily on $L$.", "4": "Throughout this section $m_d=d/L$ and $\\delta=L^{-1}$.  For each fixed", "5": "$L$, all limits in $N$ are along the sizes and parameter choices supplied", "6": "by \\cref{pert:selection}; they satisfy the identities of", "7": "\\cref{pert:tree-identity}. Different values of $L$ may use different", "8": "sequences. The argument uses only these identities and the tree sampling", "110": "If a random vector $B\\in[-1,1]^N$ is conditionally independent of $A_S$", "111": "given $\\mathscr F_d$, then", "112": "\\begin{equation}", "113": " \\bigl\\|(A_S-\\mu_{d,S})\\cdot B\\bigr\\|_{L^2}", "114": "        \\le v_N(S,d)^{1/4}.", "115": " \\label{decor:contraction-bound}", "116": "\\end{equation}", "117": "If $X,Y,Z$ are conditionally independent copies of a bounded random", "118": "vector given a sigma field $\\mathscr G$, and $C$ is its conditional", "119": "covariance matrix, then", "120": "\\begin{equation}", "121": " \\mathbb E(X\\cdot Y-X\\cdot Z)^2", "122": "       \\ge \\frac2{N^2}\\mathbb E\\sum_{i,j}C_{ij}^2.", "123": " \\label{decor:three-copy-bound}", "124": "\\end{equation}", "87": "For a sampled copy of $S$, set", "88": "\\[", "89": " A_S=\\left(\\prod_{a\\in S}\\sigma_i^a\\right)_{i\\le N},", "90": " \\qquad R_S=\\mathbf1\\cdot A_S,", "91": " \\qquad x\\cdot y=N^{-1}\\sum_{i=1}^Nx_i y_i,", "92": " \\qquad \\|x\\|_N^2=x\\cdot x.", "93": "\\]", "94": "At a depth $d$ on its initial stem, including its first branching depth,", "95": "let $\\mathscr F_d$ be generated by the root and the sampled prefix through $d$,", "97": "\\begin{align}", "98": " \\mu_{d,S}&=\\mathbb E[A_S\\mid\\mathscr F_d],\\notag\\\\", "99": " v_N(S,d)&=\\frac1{N^2}\\mathbb E\\sum_{i,j=1}^N", "100": "  \\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2.", "101": " \\label{decor:covariance-definition}", "102": "\\end{align}", "103": "The expectation includes the root. Every coordinate of $A_S$ and", "104": "$\\mu_{d,S}$ has absolute value at most one, and $0\\le v_N(S,d)\\le1$.", "108": "\\begin{lemma}[Contractions and three copies]", "109": "\\label{decor:contractions}", "125": "\\end{lemma}", "126": "", "127": "\\begin{proof}", "128": "Conditional on $\\mathscr F_d$ and $B$, the squared contraction has", "129": "expectation $N^{-2}\\sum_{ij}C_{ij}B_iB_j$.  Its absolute value is at", "130": "most $N^{-2}\\sum_{ij}|C_{ij}|$.  Cauchy--Schwarz, first over $i,j$", "131": "and then over the prefix, proves \\eqref{decor:contraction-bound}.", "132": "For the second assertion, write $\\mu=\\mathbb E[X\\mid\\mathscr G]$.", "133": "Conditional independence gives", "134": "\\[", "135": " \\mathbb E[(X\\cdot Y-X\\cdot Z)^2\\mid\\mathscr G]", "136": " =\\frac2{N^2}\\operatorname{tr}\\bigl((C+\\mu\\mu^{\\mathsf T})C\\bigr)", "137": " \\ge\\frac2{N^2}\\operatorname{tr}(C^2),", "138": "\\]", "139": "since $C$ is positive semidefinite.", "140": "\\end{proof}", "144": "Fix a topology $S$ and a subset $U$ of its branching vertices. For each", "145": "$\\eta$-regular depth assignment, let $S^U$ have the same topology with", "146": "the depths of the vertices in $U$ increased by one. At an ancestral", "147": "evaluation depth $d$, compare the means using the same sampled prefix.", "148": "Then, for all sufficiently large $L$,", "149": "\\begin{equation}", "150": " \\mathcal A_{L,\\eta}\\mathbb E", "151": "       \\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L.", "152": " \\label{decor:branch-depth-continuity}", "153": "\\end{equation}", "154": "The average ranges over all branching depths; the coordinate $d$ is", "155": "also averaged if it ranges, and otherwise is held fixed. If $d$ ranges", "156": "along an initial unary stretch of $S$, then", "157": "\\begin{equation}", "158": " \\mathcal A_{L,\\eta}\\mathbb E", "159": "       \\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le C/L,", "160": " \\label{decor:evaluation-depth-continuity}", "161": "\\end{equation}", "162": "where this average includes $d$ and all branching depths, and the means", "163": "are evaluated along the same sampled path. The constant depends only on", "164": "the number of vertices and shifts, uniformly in $N$, the evaluation", "165": "depth, and the transition kernels.", "169": "Keep the later branching depths of $T$ fixed and sample a single path", "170": "along its initial stem. On this path, $\\mu_{t,T}$ is a bounded vector", "171": "martingale. Orthogonality of its increments gives", "172": "\\begin{equation}", "173": " \\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\le1.", "174": " \\label{decor:martingale-energy}", "175": "\\end{equation}", "203": "$L$, lie in the enlarged $\\eta/2$-regular domain.  All relevant", "204": "one-prefix marginal laws are unchanged when other sampled branches", "205": "are omitted, so these estimates hold in any larger sampled tree.", "142": "\\begin{lemma}[Averaged continuity in depth]", "143": "\\label{decor:depth-continuity}", "166": "\\end{lemma}", "167": "", "168": "\\begin{proof}", "176": "This proves the evaluation-depth assertion after summing over the", "177": "ranged depth and dividing by $L$.", "178": "", "179": "Consider a branching vertex at depth $q$ with child shapes", "180": "$T_1,\\ldots,T_s$.  Holding their later depths fixed, its original", "181": "conditional mean is $\\prod_j \\mu_{q,T_j}$, with products understood", "182": "coordinatewise.  If the split is delayed to $q+1$, its conditional mean", "183": "at the same prefix of depth $q$ is", "184": "$\\mathbb E[\\prod_j \\mu_{q+1,T_j}\\mid\\mathscr F_q]$, where the child means", "185": "are evaluated on a common one-step continuation.  Jensen's inequality", "186": "and the product difference inequality on $[-1,1]^s$ yield", "187": "\\begin{equation}", "188": " \\mathbb E\\left\\|\\prod_j \\mu_{q,T_j}", "189": "       -\\mathbb E\\left[\\prod_j \\mu_{q+1,T_j}\\mid\\mathscr F_q\\right]", "190": "       \\right\\|_N^2", "191": " \\le s\\sum_j\\mathbb E\\|\\mu_{q+1,T_j}-\\mu_{q,T_j}\\|_N^2.", "192": " \\label{decor:one-vertex-shift}", "193": "\\end{equation}", "194": "Summing over $q$ uses \\eqref{decor:martingale-energy} with each child", "195": "shape fixed.  Propagating a changed subtree mean towards an ancestral", "196": "evaluation consists of conditional expectations and multiplication", "197": "by factors bounded by one.  Both operations contract this squared", "198": "norm.  Averaging over all other depth coordinates therefore proves", "199": "the claimed $C/L$ bound for one shift.  For several shifts, change the", "200": "vertices one at a time and use the squared triangle inequality with", "201": "a factor equal to the number of shifts.  Regularity ensures that the", "202": "intermediate shapes have the same ancestry relations and, for large", "206": "\\end{proof}", "208": "Suppose now that $S$ first branches at depth $e$ into proper child shapes", "209": "$T_1,\\ldots,T_s$. Conditional independence of the children gives", "210": "$\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$. Write", "216": "For any vector $B\\in[-1,1]^N$ independent of the continuation of $S$", "217": "given its prefix at $e$, successive replacement of the children,", "218": "using \\eqref{decor:contraction-bound}, gives", "219": "\\begin{equation}", "220": " \\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e).", "221": " \\label{decor:projection-bound}", "222": "\\end{equation}", "223": "At each replacement the other child vectors and the already replaced", "224": "means form a bounded multiplier independent of the child being", "225": "replaced, conditionally on $\\mathscr F_e$.  In particular this applies", "226": "to $B=\\mathbf1$, and to a vector sampled on another side separated", "227": "before $e$.  For two such sides, both can be projected with total", "228": "$L^2$ error at most $2p_N(S,e)$.  Multiplication of the contracted", "229": "error by any scalar test $f$ with $|f|\\le1$, even a correlated one,", "230": "does not increase its $L^1$ bound.", "211": "\\begin{equation}", "212": " a_{S,e}=\\prod_{j=1}^s \\mu_{e,T_j},", "213": " \\qquad p_N(S,e)=\\sum_{j=1}^s v_N(T_j,e)^{1/4}.", "214": " \\label{decor:projection-definition}", "215": "\\end{equation}", "236": "For every fixed labeled topology $S$ and every $\\eta>0$,", "237": "\\begin{equation}", "238": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "239": "       \\mathcal A_{L,\\eta}v_N(S,d)=0,", "240": " \\label{decor:conditional-concentration-equation}", "241": "\\end{equation}", "242": "where the average ranges over all branching depths of $S$ and an", "243": "additional regular depth $d$ strictly before its first split.  For a", "244": "singleton, the average ranges over $d$ alone.", "522": "bounded by one.  The base case and induction now imply", "523": "$V_{k,L}(\\eta)\\to0$ for every fixed $k,\\eta$, proving the proposition.", "345": "For large $L$, regularity ensures that each shifted depth differs from", "346": "every branching depth of the old tree, including $d$. Thus these $2b$", "347": "target branching vertices must be created by fresh unary splits.", "348": "Lemma~\\ref{tree:charging} gives", "349": "\\begin{equation}", "350": " \\frac1{|J|}\\sum_{\\text{allowed extensions}}|c|", "351": "        \\le C_{k,\\eta}.", "352": " \\label{decor:relative-absolute-cost}", "353": "\\end{equation}", "491": "Each child in either $p_N$ has fewer than $k$ leaves. To make the", "492": "averaging step explicit, the aligned construction has", "493": "$D=b(S)+1$ distinct depth coordinates, including $d$ and $e$.", "494": "A term belonging to $T_j$ uses only $D_j=b(T_j)+1$ coordinates.", "495": "For the shifted term these are", "496": "$\\pi_j(\\mathbf q)=(e+1,(q_v+1)_{v\\in\\operatorname{Br}(T_j)})$.", "497": "Every retained assignment has at most $L^{D-D_j}$ preimages, and its", "498": "coordinates are $\\eta/2$-regular for large $L$. If $w_j$ is the child", "499": "covariance as a function of these coordinates, then, for $0<\\gamma\\le1$,", "500": "\\begin{align}", "501": " L^{-D}\\sum_{\\mathbf q\\;\\eta\\text{-regular}}", "502": "       w_j(\\pi_j(\\mathbf q))^\\gamma", "503": " &\\le L^{-D_j}\\sum_{\\mathbf y\\;\\eta/2\\text{-regular}}w_j(\\mathbf y)^\\gamma", "504": " \\notag\\\\", "505": " &\\le\\left(L^{-D_j}\\sum_{\\mathbf y\\;\\eta/2\\text{-regular}}", "506": "       w_j(\\mathbf y)\\right)^\\gamma.", "507": " \\label{decor:fiber-bound}", "508": "\\end{align}", "509": "The unshifted term has the same bound without translating the coordinates.", "253": "\\begin{equation}", "254": " V_{k,L}(\\eta)=\\max_{1\\le |S|\\le k}", "255": "       \\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d).", "256": " \\label{decor:V-definition}", "257": "\\end{equation}", "297": "anchor.  Let $S^+$ be the topology $S$ with every internal branching", "298": "depth increased by one.  In the prescribed-tree identity require", "333": "\\begin{equation}", "334": " J=\\kappa(S^+)^2.", "335": " \\label{decor:J-definition}", "336": "\\end{equation}", "60": "Recall that $R_S$ is the multioverlap of the sampled leaves of $S$,", "61": "defined in \\eqref{tree:multioverlap}. The result to be proved is the following.", "234": "\\begin{proposition}", "235": "\\label{decor:conditional-concentration}", "245": "\\end{proposition}", "246": "", "247": "\\begin{proof}", "248": "We induct on the number $k$ of leaves. The induction replaces each", "249": "proper child by its conditional mean. It then applies the prescribed-tree", "250": "identity to two copies with delayed branching depths; after summing the", "251": "signed coefficients, this becomes a nonnegative three-copy estimate.", "252": "To keep track of the depth averages, let", "258": "The maximum is over finitely many labeled topologies.  Averages of", "259": "any lower-order covariance used below, including averages with extra", "260": "unused coordinates or shifted depths, are bounded by the appropriate", "261": "$V_{k-1,L}(\\eta/2)$, using", "262": "\\eqref{decor:average-holder} when fractional powers occur.", "263": "", "264": "\\paragraph{One leaf.}", "265": "Take two old paths splitting at $d$, with path $1$ a spin anchor, and", "266": "add one color required to split from the anchor exactly at $d$.", "267": "The available old path $2$ has coefficient $1$.  A fresh path can", "268": "split from both old paths at $d$, with coefficient $-c_d$, or follow", "269": "path $2$ and leave it at $\\ell>d$, with coefficient $-c_\\ell$, where", "270": "\\begin{equation}", "271": " c_d=2m_{d+1}-m_d=(d+2)\\delta,", "272": " \\qquad c_\\ell=\\delta\\quad(d<\\ell\\le L-1).", "273": " \\label{decor:c-weights}", "274": "\\end{equation}", "275": "From the anchor alone the total coefficient is $-\\delta$.", "276": "Write $X=R_{12}$ and $X_\\ell=R_{13}$ for the corresponding fresh", "277": "extension.  Each $X_\\ell$ has the marginal law of $X$, and", "278": "$\\sum_{\\ell=d}^{L-1}c_\\ell=1+\\delta$.  The prescribed-tree identity", "279": "with $f=X$ therefore gives", "280": "\\begin{equation}", "281": " \\frac12\\sum_{\\ell=d}^{L-1}c_\\ell", "282": "      \\mathbb E(X-X_\\ell)^2", "283": "       =\\delta\\operatorname{Var}(X)+o_N(1)", "284": "       \\le\\delta+o_N(1).", "285": " \\label{decor:singleton-identity}", "286": "\\end{equation}", "287": "For $\\ell=d$, the three spin vectors are conditionally independent", "288": "below $d$.  Hence \\eqref{decor:three-copy-bound} and $c_d\\ge\\eta$", "289": "give $v_N(S,d)\\le\\delta/\\eta+o_N(1)$ at each fixed $L,d$.", "290": "This proves $V_{1,L}(\\eta)\\le\\delta/\\eta$.", "291": "", "292": "\\paragraph{Shifted copies and their coefficients.}", "293": "Let $|S|=k\\ge2$, its first split be $e>d$, and its proper child shapes", "294": "be $T_1,\\ldots,T_s$.  Sample an old tree consisting of two copies of", "295": "$S$, denoted I and II, whose stems split at $d$ and whose internal", "296": "depth assignments are aligned.  Fix an old leaf in I as the spin", "299": "the anchor and the added colors to form two copies of $S^+$,", "300": "separated at $d$, with the anchor in its original labeled position", "301": "in the first copy.  These constraints involve only the anchor and", "302": "the added colors.  Add all other colors of side I first, then those", "303": "of side II. \\Cref{decor:shift-figure} illustrates one local shift.", "304": "", "305": "\\begin{figure}[!ht]", "306": "\\centering", "307": "\\begin{tikzpicture}[x=1.05cm,y=0.82cm,>=stealth,font=\\small]", "308": " \\draw[gray!45,densely dotted] (-2.9,-1) -- (2.3,-1);", "309": " \\draw[gray!45,densely dotted] (-2.9,-2) -- (2.3,-2);", "310": " \\node[left] at (-2.9,-1) {$e$};", "311": " \\node[left] at (-2.9,-2) {$e+1$};", "312": " \\draw[thick] (0,0) -- (0,-1) -- (-1,-2) -- (-2,-3.2);", "313": " \\draw[thick] (0,-1) -- (1.5,-3.2);", "314": " \\draw[blue!65!black,very thick,dashed] (-1,-2) -- (-0.05,-3.2);", "315": " \\fill (0,-1) circle (2pt);", "316": " \\fill[blue!65!black] (-1,-2) circle (2.2pt);", "317": " \\node[above] at (0,0) {common stem};", "318": " \\node[below] at (-2,-3.2) {anchor};", "319": " \\node[below,blue!65!black] at (-0.05,-3.2) {new child};", "320": " \\node[below] at (1.5,-3.2) {old leaf};", "321": " \\node[right,blue!65!black] at (-0.5,-2.6) {$-\\delta$};", "322": "\\end{tikzpicture}", "323": "\\caption{One local effect of delaying a target split. The old tree is solid;", "324": "the dashed child creates a split at the previously unary depth-$e+1$ vertex,", "325": "with coefficient $m_{e+1}-m_{e+2}=-\\delta$.", "326": "The proof shifts every internal target depth and charges distinct vertices", "327": "separately, even when their depths coincide. Later target colors may reuse", "328": "eligible old leaves.}", "329": "\\label{decor:shift-figure}", "330": "\\end{figure}", "331": "", "332": "Let $\\kappa(T)$ be the reference coefficient \\eqref{tree:K}, and put", "337": "At each", "338": "vertex the $j=1$ factor is $-\\delta$; for $j\\ge2$ its absolute value", "339": "is at least $\\eta/2$ for all sufficiently large $L$.  If $b=b(S)$,", "340": "then", "341": "\\begin{equation}", "342": " |J|\\ge c_{k,\\eta}\\delta^{2b}>0.", "343": " \\label{decor:J-lower-bound}", "344": "\\end{equation}", "354": "The two copies have aligned depths but distinct branching vertices:", "355": "each vertex supplies its own factor $\\delta$. This is the reason for", "356": "the shift. The full signed coefficient has an additional factor", "357": "$-\\delta$ from separation at $d$; we divide by $J$ and leave that", "358": "factor in the identity. Equation~\\eqref{decor:relative-absolute-cost}", "359": "then controls every projection error after division.", "360": "", "361": "\\paragraph{Projecting the two target sides.}", "362": "In every extension, the marginal target tree consists of two", "363": "ordinary copies of $S^+$, independent below their separation at $d$.", "364": "By \\eqref{decor:projection-bound} its multioverlap differs in", "365": "$L^2$ from the contraction of its projected means at $e+1$ by at", "366": "most $2p_N(S^+,e+1)$.  Change the proper child depths back by one,", "367": "then change their evaluation depth from $e+1$ to $e$.  The product", "368": "difference inequality and Lemma~\\ref{decor:depth-continuity} show", "369": "that this adds an error at most $h_N(S)$ in $L^2$, with", "370": "\\begin{equation}", "371": " \\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L.", "372": " \\label{decor:projection-shift-error}", "373": "\\end{equation}", "374": "One can take $h_N(S)$ to be the sum of the finitely many", "375": "$L^2(\\|\\cdot\\|_N)$ distances in these comparisons, multiplied by", "376": "a size-dependent constant.  This definition depends only on the", "377": "single-copy marginal shapes, not on the particular extension.", "378": "Thus \\eqref{decor:projection-shift-error} holds uniformly for the", "379": "comparisons in the extension sum, even though the union of the", "380": "old and target trees itself need not have regular depths.", "381": "", "382": "Let $a,b$ denote the vectors $a_{S,e}$ on the old stems I and II.", "383": "The target stem in I shares the old prefix through $e$ because it", "384": "contains the anchor, so its final projected vector is $a$.", "385": "", "386": "\\paragraph{The signed extension sum.}", "387": "Set $f$ to be the overlap of all $2k$ old leaves, an allowed fixed", "388": "overlap monomial. All target-I additions stay in the anchor's branch", "389": "below $d$, so they leave the old-II stem and its child counts unchanged.", "390": "Classify the first added path of target side II by its prefix", "391": "through $e$.  It may diverge freshly at $\\ell=d$, with coefficient", "392": "$-c_d$, or follow the old II stem and diverge at $d<\\ell<e$, with", "393": "coefficient $-c_\\ell=-\\delta$.  In such a class let $b_\\ell$ be", "394": "$a_{S,e}$ on the new stem; it shares the old II prefix through", "395": "$\\ell$.  At $\\ell=d$ the stems carrying $a,b,b_d$ are conditionally", "396": "independent below $d$.  Every remaining possibility follows the", "397": "old II prefix through $e$ and has final projected vector $b$.", "398": "All later target paths in side II follow its first path through", "399": "$e$, since their earliest split is $e+1$.", "400": "", "401": "For a fixed extension history, retain every old path and the first", "402": "target-II prefix through $e$, and delete all other new branches.", "403": "The target-I projection $a$ already depends only on the retained old", "404": "anchor prefix. Each deleted subtree integrates to one under its", "405": "probability kernels; a reused old leaf introduces no new variable.", "406": "The retained tree depends only on the class: it is the old tree with a", "407": "fresh stem attached at $\\ell<e$, or just the old tree in the remaining", "408": "class. The history is a combinatorial choice, not a condition on sampled", "409": "values. Thus the joint marginal of the old paths and projected prefixes", "410": "is fixed within each class. In particular, the expectation of $f$ times", "411": "the projected overlap is constant within a class and can be multiplied", "412": "by its total signed coefficient.", "413": "", "414": "By Lemma~\\ref{tree:reference-total}, summing later side-II colors", "415": "backwards gives $\\kappa(S^+)$ for each first-path choice.  Summing the", "416": "side-I choices gives the other factor $\\kappa(S^+)$. The fresh class", "417": "at $\\ell$ therefore has total coefficient $-c_\\ell J$.", "418": "The total coefficient is $-\\delta J$, both from the old tree and", "419": "from the anchor alone. Since", "420": "\\[", "421": " \\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta=m_e+\\delta,", "422": "\\]", "423": "the remaining prefix-through-$e$ class has coefficient $m_eJ$.", "424": "Thus the projected terms have the following coefficients:", "425": "\\[", "426": " \\begin{array}{c|c|c}", "427": " \\text{side-II prefix} & \\text{projected overlap}", "428": "      & \\text{total coefficient}\\\\ \\hline", "429": " \\text{fresh divergence at }d\\le\\ell<e & a\\cdot b_\\ell & -c_\\ell J\\\\", "430": " \\text{old prefix through }e & a\\cdot b & m_eJ", "431": " \\end{array}", "432": "\\]", "433": "", "434": "Multiply the projected overlap in each row by $f$ and divide the", "435": "prescribed-tree identity by $J$. Rearranging gives", "436": "\\begin{equation}", "437": " \\sum_{\\ell=d}^{e-1}c_\\ell", "438": "   \\mathbb E\\bigl[f(a\\cdot b-a\\cdot b_\\ell)\\bigr]", "439": " =\\delta\\bigl(\\mathbb E[f(a\\cdot b)]", "440": "          -\\mathbb Ef\\,\\mathbb ER_{\\mathrm{target}}\\bigr)", "441": "       +\\rho_N(S,d),", "442": " \\label{decor:induction-identity}", "443": "\\end{equation}", "444": "where $R_{\\mathrm{target}}$ on the right is the target overlap in", "445": "the anchor-alone extension.  Its absolute value is at most one.", "446": "The error satisfies", "447": "\\begin{equation}", "448": " |\\rho_N(S,d)|\\le C_{k,\\eta}", "449": "       \\bigl(p_N(S^+,e+1)+h_N(S)\\bigr)", "450": "       +C_{L,k,\\eta}\\varepsilon_{N,L,k}.", "451": " \\label{decor:induction-error}", "452": "\\end{equation}", "453": "Indeed, multiplying a projection error by $f$, even when correlated", "454": "with it, costs at most its $L^2$ norm since $|f|\\le1$. Sum these errors", "455": "with absolute coefficients and apply", "456": "\\eqref{decor:relative-absolute-cost}. The final term includes division", "457": "of the original identity error by $J$ and tends to zero at fixed $L$.", "458": "", "459": "\\paragraph{Closing the induction.}", "460": "Equation~\\eqref{decor:projection-bound} gives", "461": "$\\|f-a\\cdot b\\|_{L^2}\\le2p_N(S,e)$.", "462": "Moreover", "463": "$\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta\\le1$.", "464": "Replacing $f$ by $a\\cdot b$ on the left of", "465": "\\eqref{decor:induction-identity} therefore costs at most", "466": "$4p_N(S,e)$.  Each $a\\cdot b_\\ell$ has the same marginal law as", "467": "$a\\cdot b$, so that left side becomes", "468": "\\[", "469": " \\frac12\\sum_{\\ell=d}^{e-1}c_\\ell", "470": "        \\mathbb E(a\\cdot b-a\\cdot b_\\ell)^2.", "471": "\\]", "472": "Its summands are nonnegative and $c_d\\ge\\eta$.  The right side", "473": "of \\eqref{decor:induction-identity} is bounded in absolute value", "474": "by $2\\delta+|\\rho_N(S,d)|$.  Hence", "475": "\\begin{equation}", "476": " \\mathbb E(a\\cdot b-a\\cdot b_d)^2", "477": " \\le C_\\eta\\bigl(\\delta+p_N(S,e)+|\\rho_N(S,d)|\\bigr).", "478": " \\label{decor:projected-three-copy}", "479": "\\end{equation}", "480": "Sample three copies of $A_S$ conditionally independently below", "481": "$d$.  Projecting each of the two contractions involving the", "482": "first copy changes it in $L^2$ by at most $2p_N(S,e)$.", "483": "Using \\eqref{decor:three-copy-bound},", "484": "\\eqref{decor:projected-three-copy}, and $p_N(S,e)\\le k$, we obtain", "485": "\\begin{equation}", "486": " v_N(S,d)\\le C_{k,\\eta}\\bigl(", "487": "       \\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S)\\bigr)", "488": "       +C_{L,k,\\eta}\\varepsilon_{N,L,k}.", "489": " \\label{decor:covariance-induction-estimate}", "490": "\\end{equation}", "510": "Thus the two aligned copies use single-copy estimates; there is no", "511": "restriction of an independently averaged pair of copies to a diagonal.", "512": "Taking $\\gamma=1/4$ and then $\\limsup_N$, and using", "513": "\\eqref{decor:projection-shift-error} and", "514": "\\eqref{decor:identity-error}, gives, for sufficiently large $L$,", "515": "\\begin{equation}", "516": " V_{k,L}(\\eta)\\le C_{k,\\eta}\\left(", "517": "       L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4}\\right).", "518": " \\label{decor:induction-recursion}", "519": "\\end{equation}", "520": "The maximum over smaller topologies in \\eqref{decor:V-definition}", "521": "can be absorbed in the right side because these covariances are", "524": "\\end{proof}", "65": "For every fixed labeled topology $S$,", "66": "\\begin{equation}", "67": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "68": "       \\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)=0", "69": "       \\qquad(\\eta>0),", "70": " \\label{decor:overlap-concentration-equation}", "71": "\\end{equation}", "72": "where only the $b(S)$ branching depths are averaged. For a", "73": "singleton, whose average has no coordinates,", "74": "$\\operatorname{Var}(R_S)\\to0$ as $N\\to\\infty$ at every fixed $L$.", "63": "\\begin{theorem}", "64": "\\label{decor:overlap-concentration}", "75": "\\end{theorem}", "532": "\\begin{proof}[Proof of \\cref{decor:overlap-concentration}]", "533": "For a singleton, use the spin-anchor identity with no added colors", "534": "and $f=R_S$.  It gives", "535": "$\\mathbb ER_S^2=(\\mathbb ER_S)^2+o_N(1)$.", "536": "", "537": "Suppose $S$ first splits at $e$ and has proper child shapes", "538": "$T_1,\\ldots,T_s$. We will condition one step before $e$. Use $S$ as", "539": "the old tree, designate one of its", "540": "leaves as a marker anchor, and add a full copy of $S$ all of whose", "541": "leaves split from the anchor at $e-1$.  Its first path must be", "542": "fresh at $e-1$, because the old tree has not yet branched there.", "543": "All other target paths lie in the resulting fresh subtree.", "544": "The extension coefficient on both sides of the prescribed-tree", "545": "identity is the same nonzero number", "546": "\\begin{equation}", "547": " C(S,e)=-\\delta \\kappa(S).", "548": " \\label{decor:marker-coefficient}", "549": "\\end{equation}", "550": "The target and old copies are conditionally independent and", "551": "identically distributed below $\\mathscr F_{e-1}$. With", "552": "$f=R_S$ and $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$, their product has", "553": "conditional expectation $M^2$. On the anchor-alone side, deleting the", "554": "marker's continuation below $e-1$ integrates a probability kernel to one", "555": "and leaves the ordinary target law $S$, with mean $\\mathbb E R_S$.", "556": "The identity therefore gives", "557": "\\begin{equation}", "558": " C(S,e)\\bigl(\\mathbb EM^2-(\\mathbb E R_S)^2\\bigr)", "559": " =C(S,e)\\operatorname{Var}(M)=o_N(1),", "560": " \\label{decor:marker-variance-identity}", "561": "\\end{equation}", "562": "and hence", "563": "\\begin{equation}", "564": " \\qquad \\operatorname{Var}(M)\\longrightarrow0", "565": " \\quad\\text{at each fixed }L,S,e.", "566": " \\label{decor:prefix-projection-concentration}", "567": "\\end{equation}", "568": "Division by $C(S,e)$ is made only at fixed $L$; no uniform lower", "569": "bound as $L\\to\\infty$ is needed.", "570": "", "571": "It remains to control the conditional variance below this prefix.", "572": "The child covariances are evaluated at $e$, which is separated from", "573": "all their branching depths; the move to $e-1$ will use martingale", "574": "continuity instead. Set", "575": "\\[", "576": " G=\\mathbf1\\cdot\\prod_j \\mu_{e,T_j},", "577": " \\qquad G_-=\\mathbf1\\cdot\\prod_j \\mu_{e-1,T_j}.", "578": "\\]", "579": "The latter is $\\mathscr F_{e-1}$-measurable.  By", "580": "\\eqref{decor:projection-bound},", "581": "$\\mathbb E(R_S-G)^2\\le p_N(S,e)^2$.", "582": "Keeping all proper child depths fixed, the product difference", "583": "inequality and \\eqref{decor:martingale-energy} imply", "584": "\\begin{equation}", "585": " \\mathcal A_{L,\\eta}\\mathbb E(G-G_-)^2\\le C_k/L.", "586": " \\label{decor:adjacent-prefix-error}", "587": "\\end{equation}", "588": "Here $e$ is itself a ranged coordinate, so the one-step increments", "589": "are summed before division by $L$.  Since conditional expectation", "590": "is the optimal $L^2$ projection,", "591": "\\[", "592": " \\mathbb E(R_S-M)^2", "593": "   \\le\\mathbb E(R_S-G_-)^2", "594": "   \\le2p_N(S,e)^2+2\\mathbb E(G-G_-)^2.", "595": "\\]", "596": "Variance decomposition and", "597": "\\eqref{decor:prefix-projection-concentration} now show", "598": "\\begin{equation}", "599": " \\limsup_{N\\to\\infty}", "600": "      \\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)", "601": " \\le C_k\\left(L^{-1}+V_{k-1,L}(\\eta/2)^{1/2}\\right)", "602": " \\quad\\text{for all sufficiently large }L.", "603": " \\label{decor:variance-estimate}", "604": "\\end{equation}", "605": "In this estimate we used", "606": "$p_N(S,e)^2\\le s\\sum_jv_N(T_j,e)^{1/2}$ and", "607": "\\eqref{decor:fiber-bound} with $\\gamma=1/2$: here the full average has", "608": "$D=b(S)$ coordinates because $d$ is absent, while still", "609": "$D_j=b(T_j)+1$. Proposition~\\ref{decor:conditional-concentration}", "610": "finishes the proof.", "611": "\\end{proof}", "613": "\\begin{remark}", "614": "\\label{decor:order-of-limits}", "615": "All uncancelled small denominators in this section occur only in prescribed-tree", "616": "identity errors.  At fixed $L$ there are finitely many relevant trees,", "617": "so those errors disappear before any depth average or $L$ limit is", "618": "taken.  Errors that survive the $N$ limit are controlled by the", "619": "uniform relative absolute-cost bound", "620": "\\eqref{decor:relative-absolute-cost}, the lower-order covariance", "621": "averages, and the martingale estimate $C/L$.  No rate of convergence", "622": "in $N$ uniform in $L$ is used.", "623": "\\end{remark}"}, "trees.tex": {"47": "\\end{equation}", "48": "An unspecified expectation $\\E$ below includes the root and the", "346": "Consequently, if the anchor and the colors must have a prescribed", "347": "tree $S$, the total coefficient over all compatible extensions of", "348": "any old tree is", "349": "\\begin{equation}\\label{tree:K}", "350": " \\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}", "351": "           \\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1}),", "352": "\\end{equation}", "353": "where $a_v$ and $d_v$ are the child count and depth of each branching", "354": "vertex in the prescribed reference tree.  More generally, the same", "259": "Here is the companion rule with old replicas.  Fix a tree", "260": "$\\mathcal T$ with an anchor leaf $a_*$.  Starting from all its old", "261": "paths, assign colors $1,\\ldots,k$ in that order.  For the next color,", "262": "one may either", "263": "\\begin{enumerate}[label=(\\roman*),nosep]", "264": "  \\item choose an unused old leaf other than $a_*$, with coefficient", "265": "  $1$; or", "266": "  \\item create a fresh path from any internal vertex $\\beta$ of the", "267": "  current tree, with coefficient", "268": "  $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$.", "269": "\\end{enumerate}", "270": "Each fresh path uses a new child at its divergence vertex and new", "271": "vertices at every greater depth.  Every chosen leaf receives its color", "272": "and cannot be chosen again.  The current tree includes all old paths,", "273": "including unused ones, and every path already added.  An extension", "274": "history $E$ records these choices; write $a_j(E)$ for the leaf carrying", "275": "color $j$, $\\mathcal T_E$ for its final tree, and $c_E$ for the product", "276": "of its coefficients.", "42": "$\\sigma^a\\in\\{-1,1\\}^N$, the multioverlap on a subset $S$ of the", "43": "replica leaves is", "44": "\\begin{equation}\\label{tree:multioverlap}", "45": " R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a,", "46": " \\qquad R_\\varnothing=1.", "337": "\\begin{lemma}[Reference-path totals]\\label{tree:reference-total}", "338": "Suppose the next color must follow a specified reference prefix to", "339": "depth $d$ and then enter a child distinct from all $j\\geq1$ children", "340": "there that contain reference paths.  Apart from these ancestry", "341": "constraints its continuation is unrestricted.  The sum of the", "342": "coefficients of all allowed choices is", "343": "\\begin{equation}\\label{tree:one-reference-total}", "344": "  m_d-jm_{d+1}.", "345": "\\end{equation}", "355": "one-step rule can be iterated starting from any already constructed", "356": "set of references.", "393": "\\begin{lemma}[Charging fresh splits]\\label{tree:charging}", "394": "Assume $m_d=d/L$ and put $\\delta=L^{-1}$.  Start with an old tree having", "395": "$q$ leaves and assign $k$ colors by the canceled-anchor extension", "396": "rule.  Prescribe the reference shape of the anchor and the colors,", "397": "possibly with additional restrictions on allowed extensions.  Suppose", "398": "$b$ specified branching vertices of that shape have depths which", "399": "are not branching depths anywhere in the old tree.  Then", "400": "\\begin{equation}\\label{tree:charging-bound}", "401": "   \\sum_{E\\text{ allowed}}|c_E|\\leq C_{q,k}\\delta^b.", "402": "\\end{equation}", "403": "The constant is independent of $L$, the prescribed depths, and their", "404": "coincidences at different vertices.", "405": "", "406": "In particular, for these $b$ vertices let", "407": "\\[", "408": " J=\\prod_v\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1}).", "409": "\\]", "410": "If $m_{d_v}\\geq\\eta>0$ at all of them, then $J\\ne0$ and", "411": "\\begin{equation}\\label{tree:relative-charging}", "412": "   \\frac{1}{|J|}\\sum_{E\\text{ allowed}}|c_E|", "413": "        \\leq C_{q,k,\\eta}.", "414": "\\end{equation}", "295": "left-hand side, uniformly over the path kernels.  The empty extension has weight $1$.", "28": "", "29": "A finite tree $\\mathcal T$ consists of a common root and finitely many", "30": "labeled paths, each ending at depth $L$.  Every internal vertex has at", "31": "least one child; in particular, all unary portions of paths are retained.", "32": "At each vertex, different children are drawn independently using the", "33": "appropriate kernel.  We write $E_{\\mathcal T}$ for this sampling", "34": "expectation conditional on the root.  A split at depth $d$ means that", "38": "Removing some leaves and the portions of their paths unused by the", "39": "remaining leaves preserves the sampling law of the remaining tree.", "35": "the last common vertex is at depth $d$.  Replica positions at depth $L$", "36": "are distinct vertices, but the values sampled there need not differ.", "37": "Thus independent spin replicas may be the same spin configuration.", "278": "\\begin{lemma}[Canceled-anchor expansion]\\label{tree:extension-expansion}", "279": "Let $H$ be a bounded function of the variables on the old tree, fixed", "280": "as the insertion parameters vary.  For", "281": "$A_{\\boldsymbol t}=1+\\sum_{j=1}^k t_jD_j$, with bounded real path", "282": "functions $D_j$, one has", "283": "\\begin{equation}\\label{tree:mixed-expansion}", "284": "  \\left.\\partial_{t_1}\\cdots\\partial_{t_k}", "285": "       E_{\\mathcal T}^{A_{\\boldsymbol t}}", "286": "        \\frac{H}{A_{\\boldsymbol t}^{a_*}}", "287": "  \\right|_{\\boldsymbol t=0}", "288": "   =\\sum_E c_E\\,", "289": "       E_{\\mathcal T_E}", "290": "          \\left[H\\prod_{j=1}^kD_j^{a_j(E)}\\right].", "291": "\\end{equation}", "292": "The formula holds in any fixed order of the colors.  For identical", "293": "directions $D_j=D$, the coefficient of $t^k$ is the right-hand side", "294": "divided by $k!$.  The analytic bounds established above apply to its", "296": "\\end{lemma}", "357": "\\end{lemma}", "415": "\\end{lemma}"}, "perturbations.tex": {"427": "\\subsection{Prescribing the colored tree}", "428": "", "429": "The anchor is called a \\emph{spin anchor} when $S_0=\\sigma_i$, and a", "430": "\\emph{marker anchor} when $S_0=1$.  Added colors are ordered", "431": "$1,\\ldots,k$; the anchor has color $0$.  They occupy distinct replica", "432": "positions, none equal to the anchor, according to the canceled-anchor", "433": "extension rule of Lemma~\\ref{tree:extension-expansion}.  A constraint", "434": "$\\mathcal C$ prescribes any consistent collection of their pairwise", "435": "split depths, involving only the added colors and the anchor.", "436": "It imposes no extra restrictions involving the other old replicas.", "437": "Let $\\mathfrak E(\\mathcal T,a_*,\\mathcal C)$ be the allowed extension", "438": "histories, with coefficients $c_E$ from that lemma.  For a history", "439": "$E$, set", "440": "\\[", "441": " R_E=\\frac1N\\sum_{i=1}^N", "442": " \\begin{cases}", "443": " \\displaystyle\\sigma_i^{a_*}\\prod_{j=1}^k\\sigma_i^{a_j(E)},", "444": "       &\\text{spin anchor},\\\\[2pt]", "445": " \\displaystyle\\prod_{j=1}^k\\sigma_i^{a_j(E)},", "446": "       &\\text{marker anchor}.", "447": " \\end{cases}", "448": "\\]", "449": "For $k=0$ these are respectively $R_{\\{a_*\\}}$ and $1$.", "450": "", "452": "\\label{pert:tree-identity}", "453": "\\label{pert:identity}", "454": "For the perturbation family defined above, along every sequence from", "455": "Lemma~\\ref{pert:selection},", "456": "\\begin{equation}", "457": " \\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}", "458": "       c_E\\,\\mathbb E[fR_E]", "459": " -\\mathbb E f", "460": "  \\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}", "461": "       c_E\\,\\mathbb E[R_E]", "462": " \\longrightarrow0.", "463": " \\label{pert:tree-identity-eq}", "464": "\\end{equation}", "465": "This holds for every fixed old tree, either kind of anchor, every", "466": "bounded polynomial $f$ in its multioverlaps, every finite number of", "467": "ordered added colors, and every prescribed constraint $\\mathcal C$.", "468": "The empty addition is allowed.  The error is taken to zero at fixed", "469": "$L$, fixed tree, and fixed constraint, before any limit in $L$.", "470": "\\end{theorem}", "451": "\\begin{theorem}[Identity on prescribed trees]", "255": "\\begin{lemma}[Deterministic parameter selection]", "256": "\\label[lemma]{pert:selection}", "257": "For every fixed $L\\geq2$ and $\\varepsilon>0$, there are sizes", "258": "$N_j\\uparrow\\infty$ and deterministic vectors $\\mathbf u_j$ such that", "259": "\\begin{enumerate}[label=\\textup{(\\roman*)}]", "260": " \\item $\\Delta_{N_j}(\\mathbf u_j)\\leq \\underline F+2\\varepsilon$;", "261": " \\item for every fixed type $\\nu$,", "262": " $e_{\\nu,N_j}(\\mathbf u_j)\\longrightarrow0$ in the reservoir;", "263": " \\item in the reservoir, the expectations of every finite product of multioverlaps on", "264": " every fixed finite prescribed tree of depth $L$ converge along this", "265": " sequence.", "266": "\\end{enumerate}", "267": "\\end{lemma}"}, "comparison.tex": {"148": "exactly the normalization $L^{-a'}$ in $\\mathcal A_{L,\\eta}$.", "149": "Cauchy--Schwarz bounds the resulting average of mean absolute deviations", "150": "by $\\bigl(\\mathcal A_{L,\\eta}\\Var(R_U)\\bigr)^{1/2}$.", "151": "Summing over the finitely many topologies and subsets, and using the bound", "152": "two for each deviation on nonregular trees, proves", "153": "\\eqref{comp:shape-error-bound}. Apply \\cref{decor:overlap-concentration}", "154": "first at fixed $\\eta$, taking the fixed-$L$ limit in $N$ before", "155": "$L\\to\\infty$, and then let $\\eta\\downarrow0$ to obtain", "156": "\\eqref{comp:shape-error}.", "2": "\\label{comp:section}"}};
const CARDTEXT = {"decor:average-definition": {"title": "깊이 평균 $\\mathcal A_{L,\\eta}$", "math": "$a$개의 깊이 좌표 위의 음이 아닌 배열 $z(\\mathbf q)$에 대해\n$$\\mathcal A_{L,\\eta}z=L^{-a}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}z(\\mathbf q).$$\n$d<\\min_vq_v$ 같은 추가 순서 조건은 합의 범위에 넣는다. $\\eta$-regular 배정의 수는 $L^a$ 이하이므로 총 질량 $\\mathcal A_{L,\\eta}1\\le1$이다(정규화하지 않은 평균). $a=0$이면 $\\mathcal A_{L,\\eta}z=z$."}, "decor:average-holder": {"title": "깊이 평균의 분수 거듭제곱 부등식", "math": "음이 아닌 $z$와 $0<\\gamma\\le1$에 대해 $\\mathcal A_{L,\\eta}(z^\\gamma)\\le(\\mathcal A_{L,\\eta}z)^\\gamma$."}, "x:decor-average-comparisons": {"title": "깊이 평균의 두 기본 비교 (안 쓰는 좌표, 정수 이동)", "math": "(i) 안 쓰는 좌표. $\\pi$가 $a$개 좌표 중 $a'$개만 남기는 사영이고 $w\\ge0$가 남은 좌표의 함수이면, 각 상이 많아야 $L^{a-a'}$개의 원상을 가지므로 $L^{-a}\\sum_{\\mathbf q}w(\\pi\\mathbf q)\\le L^{-a'}\\sum_{\\mathbf y\\in\\pi(\\text{domain})}w(\\mathbf y)$.\n(ii) 정수 이동. 좌표의 일부를 고정된 정수만큼 옮기는 사상은 단사이고, $L\\ge L_0(\\eta,\\text{이동량})$이면 $\\eta$-regular 배정을 $\\eta/2$-regular 배정으로 보낸다 (가지를 따른 엄격한 증가도 보존된다).\n(iii) (작성자 추가, 자명) $\\eta'\\le\\eta$이면 $\\eta$-regular 배정은 $\\eta'$-regular이므로 $z\\ge0$에 대해 $\\mathcal A_{L,\\eta}z\\le\\mathcal A_{L,\\eta'}z$."}, "decor:depth-continuity.s1": {"title": "martingale energy와 평가 깊이 연속성", "math": "모양 $T$의 나중 branching depth를 고정하고 initial stem을 따라 한 경로를 뽑으면 $t\\mapsto\\mu_{t,T}$는 그 stem의 prefix filtration $(\\mathscr F_t)$에 대한 vector martingale이고 좌표가 $[-1,1]$에 있다. 증분의 직교성에서\n$$\\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2=\\mathbb E\\|\\mu_{t_1,T}\\|_N^2-\\mathbb E\\|\\mu_{t_0,T}\\|_N^2\\le1$$\n(합은 initial stem 위의 $t,t+1$에 대해, $t_0$, $t_1$은 그 범위의 처음과 끝). 특히 $t\\mapsto\\mathbb E\\|\\mu_{t,T}\\|_N^2$는 증가한다(각 증분이 $\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\ge0$). 이것을 범위를 갖는 $d$에 대해 합하고 정규화 $L^{-1}$을 곱하면, 나머지 좌표의 합은 $L$의 거듭제곱으로 상쇄되어 $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le1/L$."}, "decor:depth-continuity.s2": {"title": "갈라짐 하나를 한 칸 늦추는 효과", "math": "깊이 $q$의 branching vertex $v$ (첫 갈라짐이 아니어도 된다)가 자식 모양 $T_1,\\ldots,T_s$를 갖고 그 나중 깊이들을 고정한다. x:decor-topology의 약속대로 각 $T_j$는 root에서 $v$까지의 경로를 stem으로 갖는 topology이므로 $q$는 $T_j$의 initial stem 위에 있고, $\\mathscr F_q$는 root와 그 경로의 깊이 $q$까지 sampled prefix가 생성하는 $\\sigma$-field, $\\mu_{q,T_j}=\\mathbb E[A_{T_j}\\mid\\mathscr F_q]$는 decor:covariance-definition을 $T_j$에 적용한 것이다. $q+1$이 각 $T_j$의 첫 branching depth보다 작으면(그리고 $T_j$가 leaf 하나이면 $q+1\\le L-1$) $\\mu_{q+1,T_j}$도 같은 뜻으로 정의된다. 그 vertex 아래 spin 곱의 원래 조건부 평균은 $\\prod_j\\mu_{q,T_j}$ (좌표별)이다. 갈라짐을 $q+1$로 늦추면 같은 깊이-$q$ prefix에서의 조건부 평균은 $\\mathbb E[\\prod_j\\mu_{q+1,T_j}\\mid\\mathscr F_q]$이다 (자식 평균은 공통 한 걸음 continuation 위에서 계산). 그리고\n$$\\mathbb E\\Bigl\\|\\prod_j\\mu_{q,T_j}-\\mathbb E\\Bigl[\\prod_j\\mu_{q+1,T_j}\\Bigm|\\mathscr F_q\\Bigr]\\Bigr\\|_N^2\\le s\\sum_j\\mathbb E\\|\\mu_{q+1,T_j}-\\mu_{q,T_j}\\|_N^2.$$"}, "decor:depth-continuity.s3": {"title": "이동 하나의 비용 $C/L$", "math": "$|U|=1$, $U=\\{v\\}$이고 깊이 배정이 $\\eta'$-regular ($\\eta'>0$; 평균도 $\\mathcal A_{L,\\eta'}$)이면 $\\eta'L\\ge1$일 때 $\\mathcal A_{L,\\eta'}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L$ ($C$는 $S$의 vertex 수에만 의존). 조건 $\\eta'L\\ge1$은 작성자 유도다(원문은 이 단계에서 큰 $L$을 따로 부르지 않는다): regularity에서 $v$의 자식의 다음 branching depth $q'$는 $q'-q_v>\\eta'L\\ge1$이므로 $q_v+1<q'$이고, $q_v<(1-\\eta')L$이므로 $q_v+1\\le L-1$이다. 그래서 s2의 $\\mu_{q_v+1,T_j}$가 정의되고 $S^U$의 깊이 배정이 가지를 따라 엄격히 증가한다. 근거: s2의 우변을 $q=q_v$에 대해 합하면 각 자식 모양에 대해 s1에 의해 $s\\cdot s$ 이하다. 깊이 $q_v$에서 바뀐 부분 tree 평균을 조상 깊이 $d$로 올리는 연산은 조건부 기대값과 절댓값 1 이하 인자의 좌표별 곱뿐이므로 $\\mathbb E\\|\\cdot\\|_N^2$를 늘리지 않는다. 나머지 좌표에 대한 평균은 $L$의 거듭제곱으로 상쇄된다."}, "decor:depth-continuity.s4": {"title": "여러 이동과 더 큰 tree", "math": "$U=\\{v_1,\\ldots,v_u\\}$이면 $S=S^{U_0},S^{U_1},\\ldots,S^{U_u}=S^U$ ($U_r=\\{v_1,\\ldots,v_r\\}$)로 하나씩 바꾸고 $\\|\\sum_{r=1}^u x_r\\|^2\\le u\\sum_r\\|x_r\\|^2$를 쓴다. regularity 때문에 중간 모양들은 같은 조상 관계를 갖고, $L$이 크면 그 깊이 배정은 $\\eta/2$-regular이다 (tex 201–203 \"for large $L$, lie in the enlarged $\\eta/2$-regular domain\"; x:decor-average-comparisons (ii)). 그래서 각 항에 $\\eta'=\\eta/2$로 s3을 적용해($\\eta L/2\\ge1$도 큰 $L$에서 성립) $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le u^2C/L$. 한 prefix의 marginal law는 다른 sampled branch를 빼도 바뀌지 않으므로 이 추정은 더 큰 sampled tree 안에서도 성립한다."}, "decor:projection-definition": {"title": "첫 갈라짐에서의 사영 $a_{S,e}$와 오차량 $p_N(S,e)$", "math": "$|S|\\ge2$이고 $S$가 깊이 $e$에서 처음 갈라져 proper child shape $T_1,\\ldots,T_s$를 갖는다고 하자. $e$는 각 $T_j$의 initial stem 위에 있다. 자식들은 $\\mathscr F_e$가 주어지면 조건부 독립이므로 $\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$ (좌표별 곱)이다.\n$$a_{S,e}=\\prod_{j=1}^s\\mu_{e,T_j},\\qquad p_N(S,e)=\\sum_{j=1}^sv_N(T_j,e)^{1/4}.$$\n$0\\le p_N(S,e)\\le s\\le|S|$."}, "decor:projection-bound": {"title": "첫 갈라짐에서 자식을 평균으로 바꾸는 오차", "math": "decor:projection-definition의 상황에서, $B\\in[-1,1]^N$가 $\\mathscr F_e$가 주어지면 $S$의 깊이 $e$ 아래 continuation과 조건부 독립인 확률 벡터이면\n$$\\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e).$$\n특히 $B=\\mathbf1$일 때, 그리고 $B$가 $e$ 이전에 갈라진 다른 측에서 뽑은 $[-1,1]^N$ 벡터일 때 성립한다. 두 측 I, II가 각각 같은 모양 $S$의 사본이고, 깊이 배정이 aligned이며(대응하는 vertex가 깊이 좌표 하나를 공유, x:decor-eta-regular) $e$ 이전(예: 깊이 $d<e$)에서 갈라졌으면, $\\|A_S^{\\rm I}\\cdot A_S^{\\rm II}-a^{\\rm I}_{S,e}\\cdot a^{\\rm II}_{S,e}\\|_{L^2}\\le2p_N(S,e)$. 마지막으로 $|f|\\le1$인 임의의 스칼라 $f$ (오차와 상관이 있어도 됨)에 대해 $\\mathbb E|f\\,Z|\\le\\|Z\\|_{L^2}$이므로, 위 오차에 $f$를 곱해도 $L^1$ 상계는 커지지 않는다."}, "comp:section": {"title": "§8 독립 계층 message와 cavity 비교", "math": "받는 것. x:cavity-bounded의 유계·순열 불변 모형, $m_d=d/L$ (cavity:grid), 고정 $\\varepsilon$ 과 깊이마다 pert:selection의 선택된 수열과 그 (i) (x:comp-standing, comp:low-increments), cavity:increment의 reservoir·삽입 $A_{\\rm s},A_{\\rm b}$·(5.5)·$\\lvert\\log Y_0\\rvert$ 상계, §3의 recursion과 log 전개와 $Q_k$ 의 깊이 분포, §7의 깊이 평균 multioverlap 집중, §2의 시행 사슬·$V_{\\rm s}$·$V_{\\rm e}$·$T_d$·$\\mathcal B_r$·(2.12)."}, "decor:conditional-concentration": {"title": "조건부 decorrelation: $\\mathcal A_{L,\\eta}v_N(S,d)\\to0$", "math": "모든 고정 labeled topology $S$와 모든 $\\eta>0$에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d)=0.$$\n평균은 $S$의 모든 branching depth와, 첫 갈라짐보다 엄격히 앞인 추가 깊이 $d$에 대해 취하며 $(d,\\mathbf q)$ 전체가 $\\eta$-regular이다. singleton이면 평균은 $d$에 대해서만 취한다. $N$ 극한은 x:decor-limit-order의 수열을 따른다."}, "decor:contractions": {"title": "축약 부등식과 세 사본 부등식", "math": "(a) $d$가 $S$의 initial stem 위의 깊이이고 확률 벡터 $B\\in[-1,1]^N$가 $\\mathscr F_d$가 주어지면 $A_S$와 조건부 독립이면\n$$\\bigl\\|(A_S-\\mu_{d,S})\\cdot B\\bigr\\|_{L^2}\\le v_N(S,d)^{1/4}.$$\n(b) $X,Y,Z$가 $\\sigma$-field $\\mathscr G$가 주어지면 조건부 독립이고 같은 조건부 법칙을 갖는 유계 확률 벡터($\\mathbb R^N$ 값)이고 $C$가 그 조건부 공분산 행렬이면\n$$\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\ge\\frac2{N^2}\\mathbb E\\sum_{i,j}C_{ij}^2.$$"}, "decor:covariance-definition": {"title": "조건부 평균 $\\mu_{d,S}$와 조건부 공분산 제곱 $v_N(S,d)$", "math": "$d$가 $S$의 initial stem 위의 깊이(첫 branching depth 포함)일 때, $\\mathscr F_d$는 root와 그 stem의 깊이 $d$까지의 sampled prefix가 생성하는 $\\sigma$-field다.\n$$\\mu_{d,S}=\\mathbb E[A_S\\mid\\mathscr F_d],\\qquad v_N(S,d)=\\frac1{N^2}\\mathbb E\\sum_{i,j=1}^N\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2.$$\n바깥 기대값은 root를 포함한다. $A_S$와 $\\mu_{d,S}$의 모든 좌표는 절댓값이 1 이하이고 $0\\le v_N(S,d)\\le1$이다."}, "decor:depth-continuity": {"title": "깊이에 대한 평균 연속성", "math": "topology $S$와 branching vertex의 부분집합 $U$를 고정한다. 각 $\\eta$-regular 깊이 배정에 대해 $S^U$는 같은 topology에서 $U$의 vertex 깊이를 1씩 늘린 것이다. 평가 깊이 $d$가 $S$와 $S^U$ 둘 다의 initial stem 위에 있으면(ancestral), 같은 sampled prefix에서 두 평균을 비교한다. 그러면 충분히 큰 $L$ ($L\\ge L_0(\\eta,S,U)$, tex 148 \"for all sufficiently large $L$\")에서\n$$\\mathcal A_{L,\\eta}\\,\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L.$$\n평균은 모든 branching depth에 대해, 그리고 $d$가 범위를 가지면 $d$에 대해서도 취하며, 그렇지 않으면 $d$는 고정이다. $d$가 $S$의 initial unary 구간을 따라 움직이면($d+1$도 initial stem 위)\n$$\\mathcal A_{L,\\eta}\\,\\mathbb E\\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le C/L$$\n(평균은 $d$와 모든 branching depth에 대해, 두 평균은 같은 sampled path 위에서). 상수 $C$는 vertex 수와 이동 수에만 의존하며 $N$, 평가 깊이, transition kernel에 균등하다. 같은 부등식은 $S$를 포함한 더 큰 sampled tree 안에서 계산해도 성립한다."}, "decor:identity-error": {"title": "항등식 오차의 최대 $\\varepsilon_{N,L,k}$", "math": "고정된 $L,k$에 대해, 아래에서 쓰는 pert:tree-identity의 사례들(leaf 수가 $k$에만 의존하는 상한 이하인 labeled topology와 그 $\\{0,\\ldots,L-1\\}$-깊이 배정으로 만든 old tree, anchor, 제약, 차수가 유계인 multioverlap 단항식 $f$, 유계 개수의 added color)은 유한 개다. 그 사례들에 대한 pert:tree-identity-eq 좌변의 절댓값의 최대를 $\\varepsilon_{N,L,k}$라 하면, x:decor-limit-order의 수열을 따라 각 고정 $L,k$에서\n$$\\varepsilon_{N,L,k}\\longrightarrow0\\qquad(N\\to\\infty).$$\n이 오차에 곱하는 상수는 $L$에 임의로 의존해도 된다.\n같은 유한성 때문에, 고정 $L$에서 깊이 평균 $\\mathcal A_{L,\\eta}$는 유한 개 배정에 대한 합이다. 따라서 음이 아닌 $z_N(\\mathbf q)$에 대해 $\\limsup_N\\mathcal A_{L,\\eta}z_N\\le\\mathcal A_{L,\\eta}\\limsup_Nz_N$이고, 특히 각 고정 배정에서 $o_N(1)$인 항(예: $C_{L,k,\\eta}\\varepsilon_{N,L,k}$, 고정 배정마다의 $\\operatorname{Var}(M)$)은 깊이 평균을 취한 뒤에도 $N\\to\\infty$에서 사라진다. 이 교환은 깊이 평균이나 $L$ 극한보다 먼저 한다 (tex 49–52, 616–618)."}, "decor:order-of-limits": {"title": "극한 순서에 관한 주의", "math": "이 절에서 상쇄되지 않는 작은 분모($J=\\kappa(S^+)^2$, $C(S,e)$로 나누기)는 prescribed-tree 항등식의 오차에만 붙는다. 고정 $L$에서 관련 tree는 유한 개이므로 그 오차는 깊이 평균이나 $L$ 극한보다 먼저 $N\\to\\infty$에서 사라진다 (decor:identity-error). $N$ 극한 후에 남는 오차는 균등한(uniform) 상대 절댓값 비용 상계 (conditional-concentration.s3.s3), 더 작은 모양의 공분산 평균, martingale 추정 $C/L$ (decor:depth-continuity)로 제어된다. $N$에 대한 $L$-균등 수렴 속도는 어디에도 쓰지 않는다."}, "decor:overlap-concentration": {"title": "모든 multioverlap의 깊이 평균 집중", "math": "모든 고정 labeled topology $S$에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)=0\\qquad(\\eta>0),$$\n여기서 $\\mathcal A_{L,\\eta}$는 $S$의 $b(S)$개 branching depth만을 $\\eta$-regular 배정에 대해 평균하고, $N$ 극한은 x:decor-limit-order의 수열을 따른다. singleton이면 (평균에 좌표가 없고) 각 고정 $L$에서 $\\operatorname{Var}(R_S)\\to0$ ($N\\to\\infty$)."}, "pert:selection": {"title": "결정적 매개변수 선택 (Lemma 6.2)", "math": "고정한 모든 $L\\ge2$ 와 $\\varepsilon>0$ 에 대해, 크기 $N_j\\uparrow\\infty$ 와 결정적 벡터 $\\mathbf u_j$ 가 있어 다음이 성립한다.\n(i) $\\Delta_{N_j}(\\mathbf u_j)\\le\\underline F+2\\varepsilon$;\n(ii) 모든 고정 type $\\nu$ 에 대해 reservoir에서 $e_{\\nu,N_j}(\\mathbf u_j)\\longrightarrow0$;\n(iii) reservoir에서, 깊이 $L$ 의 모든 고정 유한 prescribed tree 위 multioverlap의 모든 유한곱의 기대값이 이 수열을 따라 수렴한다."}, "pert:tree-identity": {"title": "prescribed tree 위의 항등식 (Theorem 6.5)", "math": "위에서 정의한 섭동 족에 대해, pert:selection의 모든 수열을 따라\n$$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E[R_E]\\longrightarrow0.$$\n이것은 모든 고정 old tree, 두 종류의 anchor 모두, 그 multioverlap의 모든 유계 다항식 $f$, 순서 붙은 추가 color의 모든 유한 개수, 지정된 모든 제약 $\\mathcal C$ 에 대해 성립한다. 빈 추가도 허용된다. 오차는 고정 $L$, 고정 tree, 고정 제약에서, $L$ 에 대한 어떤 극한보다도 먼저 0으로 보낸다."}, "tree:charging": {"title": "Charging fresh splits (fresh split에 작은 인자 매기기)", "math": "($m_d=d/L$, $\\delta=L^{-1}$로 둔다.) $q$개 leaf를 가진 old tree에서 시작해 canceled-anchor 확장 규칙으로 $k$개 color를 준다. anchor와 color들의 reference 모양을 처방한다. 허용 확장에 추가 제한이 있어도 된다. 그 모양의 지정된 branching vertex $b$개의 깊이가 old tree 어디에서도 branching 깊이가 아니라고 하자. 그러면\n$$\\sum_{E\\text{ allowed}}|c_E|\\leq C_{q,k}\\delta^b.$$\n상수는 $L$, 지정된 깊이, 서로 다른 vertex에서의 깊이 일치에 무관하다."}, "tree:extension-expansion": {"title": "Canceled-anchor expansion (anchor 상쇄 전개)", "math": "$H$를 old tree 위 변수들의 유계 함수로, 삽입 매개변수가 변해도 고정된 것이라 하자. 유계 실수 path 함수 $D_j$와 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$에 대해\n$$\\left.\\partial_{t_1}\\cdots\\partial_{t_k}E_{\\mathcal T}^{A_{\\boldsymbol t}}\\frac{H}{A_{\\boldsymbol t}^{a_*}}\\right|_{\\boldsymbol t=0}=\\sum_Ec_E\\,E_{\\mathcal T_E}\\left[H\\prod_{j=1}^kD_j^{a_j(E)}\\right].$$\n이 공식은 color의 어떤 고정된 순서에서도 성립한다. 같은 방향 $D_j=D$이면 $t^k$의 계수는 우변을 $k!$로 나눈 것이다. 위에서 세운 해석적 경계가 좌변에 kernel에 대해 균등하게 적용된다. 빈 확장의 무게는 $1$이다."}, "tree:reference-total": {"title": "Reference-path totals (reference 경로 합)", "math": "다음 color가 지정된 reference prefix를 깊이 $d$까지 따라간 뒤, 그곳에서 reference path를 담은 $j\\ge1$개의 자식 모두와 다른 자식으로 들어가야 한다고 하자. 이 조상 제약 말고는 그 이음은 제한이 없다. 그러면 허용된 모든 선택의 계수 합은\n$$m_d-jm_{d+1}$$\n이다. 따라서 anchor와 color들이 지정된 tree $S$를 이루어야 하면, 임의의 old tree의 모든 호환 확장에 대한 총 계수는\n$$\\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$$\n이다. 여기서 $a_v$와 $d_v$는 지정된 reference tree의 각 branching vertex의 자식 수와 깊이다. 더 일반적으로, 같은 한 걸음 규칙을 이미 만든 임의의 reference 집합에서 시작해 반복할 수 있다."}, "x:decor-eta-regular": {"title": "$\\eta$-regular 깊이 배정", "math": "$\\eta>0$을 고정한다. 깊이 배정 $\\mathbf q$가 $\\eta$-regular라는 것은 모든 $v$에 대해 $q_v/L\\in(\\eta,1-\\eta)$이고 서로 다른 branching vertex $v\\ne w$에 대해 $|q_v-q_w|/L>\\eta$라는 뜻이다. 추가 prefix depth $d$가 지정되면 $d$도 같은 조건을 만족해야 한다: $d/L\\in(\\eta,1-\\eta)$, 모든 $v$에 대해 $|d-q_v|/L>\\eta$. 한 topology의 두 사본이 aligned depth를 쓰면 대응하는 vertex는 깊이 좌표 하나를 공유하고, regularity는 이 서로 다른 좌표들에 부과한다."}, "x:decor-topology": {"title": "topology, 깊이 배정, $b(S)$, 자식 모양", "math": "topology $S$는 labeled leaf를 가진 유한 rooted tree에서 unary vertex를 지운 것이다. $\\operatorname{Br}(S)$는 branching vertex의 집합, $b(S)=|\\operatorname{Br}(S)|$, $|S|$는 leaf 수다. 깊이 배정 $\\mathbf q=(q_v)_{v\\in\\operatorname{Br}(S)}$는 각 branching vertex에 $\\{0,\\ldots,L-1\\}$의 정수를 주며 모든 가지를 따라 엄격히 증가한다. $(S,\\mathbf q)$의 sampled copy는 x:decor-tree-sampling의 규칙으로 뽑은, leaf가 $S$의 leaf이고 갈라짐이 정확히 깊이 $q_v$에서 일어나는(그 밖의 vertex는 unary) 깊이-$L$ tree다. $S$의 initial stem은 root에서 첫 branching vertex(깊이 $e$)까지의 경로다. 그 vertex 아래의 부분 topology $T_1,\\ldots,T_s$ ($s\\ge2$, 각각 첫 branching vertex를 거치는 경로를 root부터 공유)를 proper child shape라 한다. singleton은 $|S|=1$, $b(S)=0$이고 initial stem이 경로 전체다. 더 일반적으로, 임의의 branching vertex $v$ (깊이 $q_v$) 아래의 부분 모양은 root에서 $v$까지의 경로를 initial stem으로 갖는 topology로 본다. 그래서 $q_v$는 그 부분 모양의 initial stem 위에 있고, $v$의 자식 부분 모양들은 root에서 $v$까지 prefix를 공유한다. 첫 branching vertex의 proper child shape는 이 약속의 특수한 경우다."}, "cavity:grid": {"title": "깊이 $L\\ge2$, $r=L-1$, 균등 격자 $m_d=d/L$ (5.1)", "math": "$L\\ge2$ 를 고정하고 $r=L-1$ 개의 보조 단계를\n$$m_d=d/L\\quad(0\\le d\\le L),\\qquad\\delta=1/L\\tag{5.1}$$\n로 쓴다."}, "cavity:increment": {"title": "Cavity increments (cavity 증분)", "math": "증분 $\\Delta_N^{L,\\mathbf u}=P_{N+1}^{L,\\mathbf u}-P_N^{L,\\mathbf u}$ 는 $N,L,\\mathbf u$ 에 대해 균일하게 유계다. 물리 상호작용 개수의 평균이\n$$\\rho_N=\\alpha(N+1)\\Bigl(\\frac N{N+1}\\Bigr)^p\\tag{5.4}$$\n이고 보통의 장과 평균 $c_\\nu s_N$ 의 섭동 개수를 갖는 $N$ spin 위의 reservoir가 있어\n$$\\Delta_N^{L,\\mathbf u}=\\log2+\\mathbb E\\log Y_{0,\\rm s}-\\mathbb E\\log Y_{0,\\rm b}+o_N(1)\\tag{5.5}$$\n이다. 오차는 $L,\\mathbf u$ 에 균일하다. insertion recursion은 tilted reservoir kernel과 독립인 새 root disorder를 쓰며, terminal insertion은\n$$A_{\\rm s}(\\sigma)=\\frac12\\sum_{\\varepsilon=\\pm1}\\exp\\Bigl(h\\varepsilon+\\sum_{j=1}^{K_{\\rm s}}\\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p-1,j}},\\varepsilon)\\Bigr),\\tag{5.6}$$\n$$A_{\\rm b}(\\sigma)=\\exp\\Bigl(\\sum_{j=1}^{K_{\\rm b}}\\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p,j}})\\Bigr)\\tag{5.7}$$\n이다. 여기서 $K_{\\rm s}\\sim\\mathrm{Pois}(\\alpha p)$, $K_{\\rm b}\\sim\\mathrm{Pois}(\\alpha(p-1))$ 이고 표시된 index는 모두 $[N]$ 의 독립 균일 index다."}, "comp:low-increments": {"title": "선택된 수열 위의 낮은 증분 (8.1)", "math": "x:comp-standing의 선택에서, 각 $L\\ge2$ 와 그 수열 위의 모든 $N$ 에 대해(작성자: \"모든 $N$\"; 근거 perturbations.tex 299 \"Relabeling the tail proves (i)\")\n$$\\Delta_N^{L,\\mathbf u_{L,N}}\\le\\underline F+2\\varepsilon.\\tag{8.1}$$"}, "x:cavity-bounded": {"title": "하한의 유계·순열 불변 가정 ($B(\\theta)\\le B$, $\\lvert h\\rvert\\le H$)", "math": "reduction:section까지 $B(\\theta)\\le B$ 와 $\\lvert h\\rvert\\le H$ 가 a.s. 성립하고, $\\theta$ 의 법칙이 $p$ 개 좌표의 순열에 대해 불변이라고 가정한다. 하한에서는 factorization도 positivity 가정도 쓰지 않는다."}, "x:comp-standing": {"title": "§8의 고정된 선택: $\\varepsilon$, 깊이마다의 선택된 수열, 선택 전의 $\\underline F$", "math": "$\\varepsilon>0$ 을 고정한다. 각 깊이 $L\\ge2$ 에서 pert:selection이 주는 크기 수열과 결정적 매개변수 선택을 쓴다. 이 수열 위의 크기를 $N$ 으로 쓰고, 그 크기의 선택된 벡터를 $\\mathbf u_{L,N}$ 으로 쓴다(작성자; 표기는 14행에서 처음 나온다). 선택은 $L$ 에 의존할 수 있고, 아래의 모든 진술은 이 선택에 관한 것이다. $\\underline F$ 는 선택 전과 같이 bounded 모형의 **모든** 크기에 대한 liminf로 남겨 둔다."}, "x:decor-limit-order": {"title": "선택된 수열과 극한 순서", "math": "각 고정 $L$에 대해 (그리고 pert:selection의 고정된 $\\varepsilon>0$에 대해) $N\\to\\infty$의 모든 극한과 $\\limsup_N$, $o_N(1)$은 pert:selection이 주는 크기 $N_j\\uparrow\\infty$와 결정적 매개변수 $\\mathbf u_j$의 수열을 따라 취한다. 이 수열에서 pert:tree-identity의 항등식\n$$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E[R_E]\\longrightarrow0$$\n이 모든 고정 old tree $\\mathcal T$, spin/marker anchor $a_*$, 유계 multioverlap 다항식 $f$, 유한 개 added color, 제약 $\\mathcal C$에 대해 성립한다. 수열은 $L$마다 다를 수 있다. $\\lim_L\\limsup_N$ 꼴의 진술은 항상 고정 $L$에서 $N$ 극한을 먼저 취한다."}, "x:decor-tree-sampling": {"title": "tree 표본 규칙 (조건부 독립과 사영 일관성)", "math": "§3의 규칙. 유한 prescribed tree $\\mathcal T$는 공통 root(깊이 0 변수: disorder와 섭동의 개수·type·site. 섭동 매개변수는 root 변수가 아니라 선택된 고정값이다, cavity.tex 29–31)와 깊이 $L$에서 끝나는 labeled path들로 이루어진다. 각 vertex에서 서로 다른 children은 그 vertex까지의 prefix가 주어지면 kernel $K_{d+1}$로 서로 조건부 독립으로 뽑힌다. 깊이 $L$의 leaf에는 spin 배치 $\\sigma^a\\in\\{-1,1\\}^N$이 놓인다. 일부 leaf와 그것들만 쓰는 경로 부분을 지워도 나머지 tree의 표본 법칙은 바뀌지 않는다. 특히 한 경로(또는 한 부분 tree)의 법칙은 그것을 포함한 더 큰 tree에 무관하고, 어떤 vertex 아래의 부분 tree는 그 vertex까지의 prefix(root 포함)가 주어지면 tree의 나머지 전부와 조건부 독립이다."}, "reduction:section": {"title": "§9 정규화, truncation, 증명의 완성", "math": "받는 것. bounded이고 순열 불변인 상호작용의 하한 comp:bounded-lower, 상한 upper:bound, 그리고 §2의 모형·가정·시행 functional."}, "__labels__": {"comp:section": ["comparison.tex", 2, 2], "decor:average-definition": ["decorrelation.tex", 31, 35], "decor:average-holder": ["decorrelation.tex", 39, 43], "decor:identity-error": ["decorrelation.tex", 54, 57], "decor:overlap-concentration": ["decorrelation.tex", 63, 75], "decor:covariance-definition": ["decorrelation.tex", 97, 102], "decor:contractions": ["decorrelation.tex", 108, 125], "decor:three-copy-bound": ["decorrelation.tex", 120, 124], "decor:depth-continuity": ["decorrelation.tex", 142, 166], "decor:projection-definition": ["decorrelation.tex", 211, 215], "decor:projection-bound": ["decorrelation.tex", 219, 222], "decor:conditional-concentration": ["decorrelation.tex", 234, 245], "decor:c-weights": ["decorrelation.tex", 270, 274], "decor:relative-absolute-cost": ["decorrelation.tex", 349, 353], "decor:projection-shift-error": ["decorrelation.tex", 370, 373], "decor:induction-identity": ["decorrelation.tex", 436, 443], "decor:induction-error": ["decorrelation.tex", 447, 452], "decor:covariance-induction-estimate": ["decorrelation.tex", 485, 490], "decor:fiber-bound": ["decorrelation.tex", 500, 508], "decor:induction-recursion": ["decorrelation.tex", 515, 519], "decor:prefix-projection-concentration": ["decorrelation.tex", 563, 567], "decor:adjacent-prefix-error": ["decorrelation.tex", 584, 587], "decor:variance-estimate": ["decorrelation.tex", 598, 604], "decor:order-of-limits": ["decorrelation.tex", 613, 623], "pert:selection": ["perturbations.tex", 255, 267], "pert:tree-identity": ["perturbations.tex", 451, 470], "tree:extension-expansion": ["trees.tex", 278, 296], "tree:reference-total": ["trees.tex", 337, 357], "tree:charging": ["trees.tex", 393, 415]}, "__items__": {"AVG.def_A": {"from": "깊이 평균과 그 두 비교", "item": "def_A", "statement": "$\\mathcal A_{L,\\eta}z=L^{-a}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}z(\\mathbf q)$ (음 아닌 $z$, $a$ 개 좌표). 추가 순서 제한은 합의 범위에 넣는다. 총질량 $\\le1$.", "lines": ["decorrelation.tex", 30, 38], "flag": ""}, "AVG.holder": {"from": "깊이 평균과 그 두 비교", "item": "holder", "statement": "$0<\\gamma\\le1$ 이면 $\\mathcal A_{L,\\eta}(z^\\gamma)\\le(\\mathcal A_{L,\\eta}z)^\\gamma$.", "lines": ["decorrelation.tex", 38, 43], "flag": ""}, "AVG.unused_coord": {"from": "깊이 평균과 그 두 비교", "item": "unused_coord", "statement": "쓰지 않는 좌표에 대한 합은 많아야 $L$ 배이고 그 좌표의 정규화가 상쇄한다.", "lines": ["decorrelation.tex", 44, 45], "flag": ""}, "AVG.shift_regular": {"from": "깊이 평균과 그 두 비교", "item": "shift_regular", "statement": "좌표의 임의 부분집합을 고정 정수만큼 옮기면, 충분히 큰 $L$ 에서 $\\eta$-regular 배정이 $\\eta/2$-regular 배정으로 단사로 간다.", "lines": ["decorrelation.tex", 45, 47], "flag": ""}, "IDE.eps_def": {"from": "항등식 오차의 유한 최대", "item": "eps_def", "statement": "유계 크기의 labeled topology는 유한 개이고 고정 $L$ 에서 깊이 배정도 유한 개이므로, Theorem pert:tree-identity 의 오차를 아래의 유한 모음 위에서 $N\\to\\infty$ 전에 최대화할 수 있다. 그 최대가 $\\varepsilon_{N,L,k}$.", "lines": ["decorrelation.tex", 49, 53], "flag": ""}, "IDE.eps_to_zero": {"from": "항등식 오차의 유한 최대", "item": "eps_to_zero", "statement": "각 고정 $L,k$ 에서 $\\varepsilon_{N,L,k}\\to0$ ($N\\to\\infty$).", "lines": ["decorrelation.tex", 53, 57], "flag": ""}, "IDE.L_constants": {"from": "항등식 오차의 유한 최대", "item": "L_constants", "statement": "이 오차에 곱하는 상수는 $L$ 에 임의로 의존해도 된다.", "lines": ["decorrelation.tex", 58, 58], "flag": ""}, "CON.contraction": {"from": "Lemma: 축약과 세 사본", "item": "contraction", "statement": "random vector $B\\in[-1,1]^N$ 이 $\\mathscr F_d$ 가 주어졌을 때 $A_S$ 와 조건부 독립이면 $\\|(A_S-\\mu_{d,S})\\cdot B\\|_{L^2}\\le v_N(S,d)^{1/4}$.", "lines": ["decorrelation.tex", 110, 116], "flag": ""}, "CON.three_copy": {"from": "Lemma: 축약과 세 사본", "item": "three_copy", "statement": "$X,Y,Z$ 가 sigma field $\\mathscr G$ 가 주어졌을 때 유계 random vector의 조건부 독립 사본이고 $C$ 가 그 조건부 공분산 행렬이면 $\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\ge\\frac2{N^2}\\mathbb E\\sum_{i,j}C_{ij}^2$.", "lines": ["decorrelation.tex", 117, 124], "flag": ""}, "DC.branch_shift": {"from": "Lemma: 깊이에 대한 평균 연속성", "item": "branch_shift", "statement": "topology $S$ 와 branching vertex 부분집합 $U$ 를 고정하고 각 $\\eta$-regular 배정에서 $S^U$ 를 둔다. 조상 쪽 평가 깊이 $d$ 에서 같은 표본 prefix로 평균을 비교하면, 충분히 큰 $L$ 에서 $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L$. 평균은 모든 branching 깊이에 대해서이고, $d$ 가 움직이면 $d$ 도 평균하고 아니면 고정한다.", "lines": ["decorrelation.tex", 144, 155], "flag": ""}, "DC.eval_shift": {"from": "Lemma: 깊이에 대한 평균 연속성", "item": "eval_shift", "statement": "$d$ 가 $S$ 의 처음 unary 구간을 따라 움직이면 $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le C/L$. 이 평균은 $d$ 와 모든 branching 깊이를 포함하고, 평균들은 같은 표본 path 위에서 평가한다.", "lines": ["decorrelation.tex", 155, 163], "flag": ""}, "DC.uniform_constant": {"from": "Lemma: 깊이에 대한 평균 연속성", "item": "uniform_constant", "statement": "상수는 vertex 수와 shift 수에만 의존하고 $N$, 평가 깊이, transition kernel에 균일하다.", "lines": ["decorrelation.tex", 163, 165], "flag": ""}, "DC.martingale_energy": {"from": "Lemma: 깊이에 대한 평균 연속성", "item": "martingale_energy", "statement": "$T$ 의 나중 branching 깊이를 고정하고 처음 stem을 따라 path 하나를 뽑으면 $\\mu_{t,T}$ 는 유계 vector martingale이고 $\\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\le1$. (증명 블록 안의 식을 밖에서 참조)", "lines": ["decorrelation.tex", 169, 175], "flag": ""}, "DC.larger_tree": {"from": "Lemma: 깊이에 대한 평균 연속성", "item": "larger_tree", "statement": "관련된 한-prefix 주변 법칙은 다른 표본 가지를 빼도 변하지 않으므로 이 평가들은 더 큰 표본 tree 안에서도 성립한다.", "lines": ["decorrelation.tex", 203, 205], "flag": ""}, "PB.product_mean": {"from": "자식을 평균으로 바꾸는 사영", "item": "product_mean", "statement": "$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\ldots,T_s$ 로 갈라지면 자식의 조건부 독립으로 $\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$.", "lines": ["decorrelation.tex", 208, 210], "flag": ""}, "PB.projection": {"from": "자식을 평균으로 바꾸는 사영", "item": "projection", "statement": "$e$ 의 prefix가 주어졌을 때 $S$ 의 연속과 독립인 $B\\in[-1,1]^N$ 에 대해 $\\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e)$.", "lines": ["decorrelation.tex", 216, 225], "flag": ""}, "PB.two_sides": {"from": "자식을 평균으로 바꾸는 사영", "item": "two_sides", "statement": "특히 $B=\\mathbf 1$ 과, $e$ 전에 갈라진 다른 쪽에서 뽑은 vector에 적용된다. 그런 두 쪽은 함께 사영해 총 $L^2$ 오차가 많아야 $2p_N(S,e)$.", "lines": ["decorrelation.tex", 225, 228], "flag": ""}, "PB.scalar_test": {"from": "자식을 평균으로 바꾸는 사영", "item": "scalar_test", "statement": "$|f|\\le1$ 인 scalar 시험함수를 축약 오차에 곱하면, 상관되어 있어도 $L^1$ 경계가 커지지 않는다.", "lines": ["decorrelation.tex", 228, 230], "flag": ""}, "CC.main": {"from": "Proposition: 조건부 decorrelation", "item": "main", "statement": "모든 고정 labeled topology $S$ 와 $\\eta>0$ 에서 $\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d)=0$. 평균은 $S$ 의 모든 branching 깊이와 첫 split보다 엄격히 앞선 regular 깊이 $d$ 에 대해서. singleton이면 $d$ 만.", "lines": ["decorrelation.tex", 236, 244], "flag": ""}, "CC.V_to_zero": {"from": "Proposition: 조건부 decorrelation", "item": "V_to_zero", "statement": "모든 고정 $k,\\eta$ 에서 $V_{k,L}(\\eta)\\to0$ ($L\\ /* 노드 장애물을 피하는 연결선과 선 위의 라벨 기준점. DOM에 의존하지 않는다. */
function routeHits(a,b,r,pad=9){
  const minX=r.x-pad,maxX=r.x+r.w+pad,minY=r.y-pad,maxY=r.y+r.h+pad;
  let lo=0,hi=1;
  for(const [start,delta,min,max] of [[a[0],b[0]-a[0],minX,maxX],[a[1],b[1]-a[1],minY,maxY]]){
    if(Math.abs(delta)<1e-9){if(start<min||start>max)return false;}
    else{let u=(min-start)/delta,v=(max-start)/delta;if(u>v)[u,v]=[v,u];lo=Math.max(lo,u);hi=Math.min(hi,v);if(lo>hi)return false;}
  }
  return true;
}
function routeLength(points){let len=0;for(let i=1;i<points.length;i++)len+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);return len;}
function edgeRoute(a,b,obstacles){
  const clip=(r,tx,ty)=>{const cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;const k=Math.min(dx?(r.w/2+3)/Math.abs(dx):1e9,dy?(r.h/2+3)/Math.abs(dy):1e9);return [cx+dx*k,cy+dy*k];};
  const direct=[clip(a,b.x+b.w/2,b.y+b.h/2),clip(b,a.x+a.w/2,a.y+a.h/2)];
  const hits=points=>obstacles.reduce((sum,r)=>sum+points.slice(1).filter((p,i)=>routeHits(points[i],p,r)).length,0);
  if(!hits(direct))return direct;
  const ys=[...obstacles.flatMap(r=>[r.y-25,r.y+r.h+25]),Math.min(a.y,b.y)-30,Math.max(a.y+a.h,b.y+b.h)+30];
  let best=null;
  for(const y of ys){
    const start=[a.x+a.w/2,y<a.y+a.h/2?a.y-3:a.y+a.h+3];
    const end=[b.x+b.w/2,y<b.y+b.h/2?b.y-3:b.y+b.h+3];
    const points=[start,[start[0],y],[end[0],y],end];
    // 자기 양 끝 상자를 다시 가로지르는 우회 경로도 배제한다.
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);
    const score=100000*hits(points)+(selfCross?100000:0)+routeLength(points);
    if(!best||score<best.score)best={points,score};
  }
  const xs=[...obstacles.flatMap(r=>[r.x-25,r.x+r.w+25]),Math.min(a.x,b.x)-30,Math.max(a.x+a.w,b.x+b.w)+30];
  for(const x of xs){
    const start=[x<a.x+a.w/2?a.x-3:a.x+a.w+3,a.y+a.h/2];
    const end=[x<b.x+b.w/2?b.x-3:b.x+b.w+3,b.y+b.h/2];
    const points=[start,[x,start[1]],[x,end[1]],end];
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);
    const score=100000*hits(points)+(selfCross?100000:0)+routeLength(points);
    if(!best||score<best.score)best={points,score};
  }
  return best.points;
}
function routePoint(points,fraction){
  const total=routeLength(points);let remain=total*fraction;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(remain<=len||i===points.length-1){const t=len?remain/len:0;return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,dx:(b[0]-a[0])/(len||1),dy:(b[1]-a[1])/(len||1)};}
    remain-=len;
  }
  return {x:points[0][0],y:points[0][1],dx:1,dy:0};
}
if(typeof module!=='undefined')module.exports={edgeRoute,routeHits,routePoint};

function linkifyPanel(root){
  const LAB = CARDS.__labels__ || {}, IT = CARDS.__items__ || {}, LN = CARDS.__label_node__ || {}, TN = CARDS.__top_nodes__ || {}, TOP = CARDS.__top__;
  if (!Object.keys(IT).length && !Object.keys(LAB).length) return;
  const nodeIds = Object.keys(TN).filter(k => k.length >= 2).sort((a,b) => b.length - a.length);
  const re = new RegExp(String.raw`\[([A-Z][A-Za-z_]*\.[a-z_]+)\]|\b([A-Z][A-Z_]+\.[a-z_]+)\b|\b((?:decor|pert|tree|comp|cavity|model|upper|reduction|cons|intro|over|x)[a-z]*:[a-z0-9.-]*[a-z0-9])|\b(` + nodeIds.map(x => x.replace(/[^A-Za-z0-9_]/g,'')).join('|') + String.raw`)\b`, 'g');

  list.forEach(t => {
    const frag = document.createElement('span'); let last = 0, out = '';
    t.textContent.replace(re, (m, a, b, lab, nid, off) => {
      out += esc(t.textContent.slice(last, off)); last = off + m.length;
      const key = a || b;
      if (key && IT[key]) out += itemBlock(IT[key], false);
      else if (lab && LN[lab]) out += `<button class="linkish jump-node" data-map="${esc(TOP)}" data-node="${esc(LN[lab])}">${esc(lab)} (${esc(TN[LN[lab]])}) ↗</button>`;
      else if (lab && CARDS[lab] && CARDS[lab].math !== undefined) out += `<details class="item"><summary>${esc(lab)} — ${esc(CARDS[lab].title)} (카드)</summary><div class="formula">${esc(CARDS[lab].math)}</div></details>`;
      else if (lab && LAB[lab]) out += `<details class="src"><summary>${esc(lab)}</summary>${srcBlock(LAB[lab], true)}</details>`;

function boundaryCheck(mapId){

function layoutRest(m, maxc, maxr){
