<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증명 지도 — 수 5 — decorrelation.tex (원문 구조로 자른 계약 graph)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#fbfaf7; --ink:#1d1d1b; --muted:#6b6a65; --line:#cfcdc6; --panel:#ffffff;
  --obj:#eeeeea; --obj-b:#8a8983;
  --rule:#e3edf9; --rule-b:#2f6fb5;
  --fact:#fbf0d9; --fact-b:#b07a12;
  --step:#e4f3e6; --step-b:#2f8a45;
  --ext:#ffffff; --ext-b:#8a8983;
  --frame:#9a6fb0; --sel:#d2452f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191918; --ink:#ecebe6; --muted:#a3a29b; --line:#4a4944; --panel:#232321;
    --obj:#2e2e2b; --obj-b:#8f8e87;
    --rule:#1d3048; --rule-b:#6aa6e6;
    --fact:#3d3115; --fact-b:#d9a441;
    --step:#1c3523; --step-b:#62bd78;
    --ext:#232321; --ext-b:#8f8e87;
    --frame:#b993cd; --sel:#ff7a63;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 4px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--rule-b);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:4px}
.lk{display:inline-block;width:26px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.lk.call{border-top-style:dashed}
.lk.def{border-top:1px solid var(--muted)}
main{display:flex;gap:0;align-items:stretch;min-height:calc(100vh - 110px)}
#stage{flex:1 1 auto;overflow:auto;padding:16px;min-width:0}
#canvas{position:relative}
#edges{position:absolute;left:0;top:0;pointer-events:none}
#panel{flex:0 0 340px;max-width:340px;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto}
@media (max-width:1100px){main{flex-direction:column}#panel{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line)}}
.node{position:absolute;width:210px;border:1.5px solid;border-radius:8px;padding:7px 9px 8px;cursor:pointer;background:var(--obj)}
.node .k{font-size:11px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.node .t{font-weight:600;margin:1px 0 3px}
.node .s{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.node.obj{background:var(--obj);border-color:var(--obj-b)}
.node.rule{background:var(--rule);border-color:var(--rule-b)}
.node.fact{background:var(--fact);border-color:var(--fact-b)}
.node.step{background:var(--step);border-color:var(--step-b);border-radius:18px}
.node.ext{background:var(--ext);border-color:var(--ext-b);border-style:dashed}
.node.out{background:var(--rule);border-color:var(--rule-b);border-width:2.5px}
.node.sel{outline:3px solid var(--sel);outline-offset:2px}
.node.done{border-width:3px}
.node.todo{opacity:.72;border-style:dotted}
.elabel.member{border:1.5px solid var(--ink)}
.elabel.wide.member .et b{color:var(--ink)}

.node .z{font-size:11px;color:var(--rule-b);margin-top:4px}
.frame{position:absolute;border:1.5px dashed var(--frame);border-radius:14px}
.frame .cap{position:absolute;left:10px;right:10px;top:5px;font-size:12px;line-height:1.4;color:var(--frame);max-height:40px;overflow:hidden}
.elabel{position:absolute;transform:translate(-50%,-50%);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.elabel.sel{border-color:var(--sel);color:var(--sel)}
.elabel.wide{white-space:normal;width:max-content;max-width:176px;text-align:left;border-radius:6px;padding:2px 6px;line-height:1.35;color:var(--ink)}
.elabel .et{display:block;font-size:10px;color:var(--muted)}
.recv{border-left:2px solid var(--line);padding:2px 0 4px 8px;margin:6px 0}
.recv .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:4px}
.recv .rl{margin-top:3px}
.recv .rl > span.lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.recv details{margin-top:3px}
.recv summary{font-size:12px;color:var(--rule-b);cursor:pointer}
details.src summary,details.item summary,details.sym summary{font-size:12px;cursor:pointer;color:var(--rule-b)}
details.src pre{font-size:11px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:3px 0;max-height:260px;overflow:auto}
details.item,details.sym{border-left:2px solid var(--line);padding:1px 0 3px 8px;margin:5px 0}
details.item .it-body{margin-top:3px}
.it-from{font-size:11px;color:var(--muted)}
.filled{color:#a33;font-size:12.5px}
button.linkish{background:none;border:0;padding:0;color:var(--rule-b);cursor:pointer;text-decoration:underline;font:inherit;text-align:left}
#panel h2{font-size:15px;margin:0 0 2px}
#panel .kind{font-size:12px;color:var(--muted);margin-bottom:10px}
#panel dl{margin:0}
#panel dt{font-size:12px;color:var(--muted);margin-top:10px}
#panel dd{margin:2px 0 0}
#panel ul{margin:2px 0 0;padding-left:18px}
#panel .formula{overflow-x:auto;padding:4px 0}
button.zoom{margin-top:12px;font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--rule-b);background:var(--rule);color:var(--ink);cursor:pointer}
.check{margin-top:10px;font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.check.ok{border-color:var(--step-b)}
.check.bad{border-color:var(--sel)}

#vertex{display:none;max-width:1180px}
#vertex h2{font-size:16px;margin:0 0 2px}
#vertex h3{font-size:13px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
#vertex .claim{margin:6px 0 0;color:var(--muted)}
.vc{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--panel)}
.vc.ctx{border-color:var(--frame);border-style:dashed}
.vc.in{border-left:5px solid var(--ink)}
.vc.in.call{border-left-style:dashed}
.vc.in.def{border-left-color:var(--muted)}
.vc.step{border-color:var(--step-b);background:var(--step);border-radius:14px}
.vc.out{border-right:5px solid var(--ink)}
.vc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vc .hd b{font-size:14px}
.vc .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.vc .row{margin-top:5px}
.vc .row > .lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.vc .formula{overflow-x:auto}
.vc .flag{margin-top:5px;font-size:12.5px;color:var(--sel)}
.vc ul{margin:0;padding-left:18px}

#vertex.wide{max-width:none}
.vgrid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.35fr) minmax(240px,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.vgrid{grid-template-columns:1fr}}
.vc.edge{border:1.5px solid var(--ink);border-radius:4px}
.vc.edge.def{border-color:var(--muted)}
.vc.edge.fact{border-color:var(--fact-b)}
.vc .eid{font-weight:700;color:var(--ink);border-color:var(--ink)}
.chain{border-top:1px solid var(--step-b);margin-top:8px;padding-top:6px}
.chain:first-of-type{border-top:0}
.chain .cn{font-size:11px;color:var(--muted)}
.arrowdown{text-align:center;color:var(--muted);font-size:18px;line-height:1;margin:2px 0}
.note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
code{font-size:12px}

/* 상태와 edge 식별자 */
.node.state-incomplete{border-color:var(--sel);border-style:dashed}
.node.state-unassessed{border-style:dotted;border-color:var(--fact-b)}
.node.state-complete{border-width:3px}
.node .state-tag{font-weight:600;color:var(--muted)}
.node.state-incomplete .state-tag,.issue{color:var(--sel)}
.node .issue{font-size:11px;margin-top:5px;font-weight:600}
.node .child-state{font-size:11px;color:var(--muted);margin-top:4px}
#map-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.status-pill{border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.status-pill.incomplete{border-color:var(--sel);color:var(--sel)}
.status-pill.unassessed{border-color:var(--fact-b)}
.elabel{font:11px/1.3 -apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);padding:3px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--bg)}
.elabel.pending{border-style:dashed;border-color:var(--fact-b)}
.elabel.open-edge{border-color:var(--sel);color:var(--sel)}
.elabel.sel{outline:2px solid var(--sel);outline-offset:1px}
.elabel .edge-id{font-weight:700;font-variant-numeric:tabular-nums}
.elabel .edge-pending{margin-left:4px;font-weight:700;color:var(--fact-b)}
.elabel:focus-visible,.node:focus-visible{outline:3px solid var(--sel)}
.focus-node{font:inherit;text-align:left;background:transparent;color:var(--rule-b);border:0;padding:4px 0;cursor:pointer}
.audit-list{padding-left:17px;font-size:12px}
.node-warning{border-left:3px solid var(--sel);padding:5px 8px;margin:9px 0;font-size:12px}
</style>
</head>

lation.tex 450, 457, 514", "lib": "-", "col": 0, "row": 6, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": "t9", "statementRef": null, "coverage": {"imports": {"node": "ext_IDE", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": "t9", "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "x": {"items": [{"from": "항등식 오차의 유한 최대", "item": "eps_def", "statement": "유계 크기의 labeled topology는 유한 개이고 고정 $L$ 에서 깊이 배정도 유한 개이므로, Theorem pert:tree-identity 의 오차를 아래의 유한 모음 위에서 $N\\to\\infty$ 전에 최대화할 수 있다. 그 최대가 $\\varepsilon_{N,L,k}$.", "lines": ["decorrelation.tex", 49, 53], "flag": ""}, {"from": "항등식 오차의 유한 최대", "item": "eps_to_zero", "statement": "각 고정 $L,k$ 에서 $\\varepsilon_{N,L,k}\\to0$ ($N\\to\\infty$).", "lines": ["decorrelation.tex", 53, 57], "flag": ""}, {"from": "항등식 오차의 유한 최대", "item": "L_constants", "statement": "이 오차에 곱하는 상수는 $L$ 에 임의로 의존해도 된다.", "lines": ["decorrelation.tex", 58, 58], "flag": ""}], "groundingRefs": [["decorrelation.tex", 450, 450], ["decorrelation.tex", 457, 457], ["decorrelation.tex", 514, 514]]}, "ref": "IDE"}, {"id": "ext_X_TI", "kind": "ext", "title": "prescribed-tree identity (X_TI, Theorem pert:tree-identity)", "short": "", "in": [], "cond": [], "out": "", "type": "-", "cards": [], "source": "decorrelation.tex 250, 265, 279, 296–299, 435", "lib": "-", "col": 0, "row": 7, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": "t10", "statementRef": null, "coverage": {"imports": {"node": "ext_X_TI", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": "t10", "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "x": {"items": [{"from": "Theorem: prescribed tree 위의 항등식", "item": "identity", "statement": "섭동족과 Lemma pert:selection 의 모든 수열을 따라 $\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\mathbb E[R_E]\\to0$. 모든 고정 old tree, 두 종류의 anchor, multioverlap의 모든 유계 다항식 $f$, 유한 개의 순서 있는 추가 color, 모든 처방 제약 $\\mathcal C$ 에서 성립. 빈 추가도 허용. 오차는 고정 $L$, tree, 제약에서 $L$ 의 극한 전에 0으로 간다.", "lines": ["perturbations.tex", 452, 470], "flag": ""}, {"from": "Theorem: prescribed tree 위의 항등식", "item": "anchor_constraint", "statement": "$S_0=\\sigma_i$ 이면 spin anchor, $S_0=1$ 이면 marker anchor. 추가 color $1..k$ 는 anchor가 아닌 서로 다른 replica 자리를 차지한다. $\\mathcal C$ 는 추가 color와 anchor만의 쌍별 split 깊이의 일관된 모음을 처방하고 다른 old replica에는 제한을 걸지 않는다. $R_E$ 는 spin anchor이면 $\\frac1N\\sum_i\\sigma_i^{a_*}\\prod_j\\sigma_i^{a_j(E)}$, marker anchor이면 $\\frac1N\\sum_i\\prod_j\\sigma_i^{a_j(E)}$.", "lines": ["perturbations.tex", 427, 450], "flag": ""}], "groundingRefs": [["decorrelation.tex", 250, 250], ["decorrelation.tex", 265, 265], ["decorrelation.tex", 279, 279], ["decorrelation.tex", 296, 299], ["decorrelation.tex", 435, 435]]}, "ref": "X_TI"}, {"id": "ext_X_EXT", "kind": "ext", "title": "extension 규칙 (X_EXT)", "short": "", "in": [], "cond": [], "out": "", "type": "-", "cards": [], "source": "decorrelation.tex 266–269, 391–393", "lib": "-", "col": 0, "row": 8, "audit": {"state": "external", "label": "외부 입력", "issues": [], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": "t11", "statementRef": null, "coverage": {"imports": {"node": "ext_X_EXT", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": "t11", "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "x": {"items": [{"from": "extension 규칙 (계수 $1$, $\\gamma_\\beta$)", "item": "rule", "statement": "anchor leaf $a_*$ 를 가진 tree $\\mathcal T$ 에서 color $1..k$ 를 차례로 배정한다. 다음 color는 (i) $a_*$ 가 아닌 안 쓴 old leaf (계수 $1$) 또는 (ii) 현재 tree의 내부 vertex $\\beta$ 에서 fresh path (계수 $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$). 현재 tree는 안 쓴 것을 포함한 모든 old path와 이미 붙인 path. $c_E$ 는 계수들의 곱, $\\mathcal T_E$ 는 마지막 tree.", "lines": ["trees.tex", 259, 276], "flag": ""}], "groundingRefs": [["decorrelation.tex", 266, 269], ["decorrelation.tex", 391, 393]]}, "ref": "X_EXT"}, {"id": "ext_X_SAMP", "kind": "ext", "title": "표본 tree 의 법칙 (X_SAMP)", "short": "", "in": [], "cond": [], "out": "", "type": "-", "cards": [], "source": "decorrelation.tex 277, 287, 363, 395, 404–405, 466", "lib": "-", "col": 0, "row": 9, "audit": {"state": "external", "label": "외부 입력", "issues": ["edge 내용 미작성: e22"], "missing": [], "declared": null, "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": "t12", "statementRef": null, "coverage": {"imports": {"node": "ext_X_SAMP", "tracked": false, "matched": false, "parentGraph": "top", "parentEdge": "t12", "items": [], "issues": [], "upstreamPending": []}, "overlaps": [], "pending": ["외부 입력–부모 입력의 항목 참조 미적용"], "forwarded": [], "bodyMode": "independent"}, "x": {"items": [{"from": "tree 표본 규칙", "item": "children_independent", "statement": "각 vertex에서 서로 다른 자식은 해당 kernel로 독립으로 뽑는다. $E_{\\mathcal T}$ 는 root가 주어진 표본 기대값.", "lines": ["trees.tex", 28, 34], "flag": ""}, {"from": "tree 표본 규칙", "item": "leaf_removal", "statement": "leaf 몇 개와 남은 leaf가 쓰지 않는 path 부분을 지우면 남은 tree의 표본 법칙이 보존된다.", "lines": ["trees.tex", 38, 39], "flag": ""}], "groundingRefs": [["decorrelation.tex", 277, 277], ["decorrelation.tex", 287, 287], ["decorrelation.tex", 363, 363], ["decorrelation.tex", 395, 395], ["decorrelation.tex", 404, 405], ["decorrelation.tex", 466, 466]]}, "ref": "X_SAMP"}, {"id": "s1_setup", "kind": "step", "title": "귀납의 틀과 $V_{k,L}$", "short": "", "in": [], "cond": [], "out": "잎 수 $k$ 에 대해 귀납한다. $V_{k,L}(\\eta)=\\max_{1\\le|S|\\le k}\\limsup_N\\mathcal A_{L,\\eta}v_N(S,d)$ (유한 개 labeled topology 위의 최대). 아래에서 쓰는 더 낮은 차수 공분산의 평균은, 쓰지 않는 좌표나 옮긴 깊이가 더 있어도 $V_{k-1,L}(\\eta/2)$ 로 막히고, 분수 거듭제곱이 나오면 eq decor:average-holder 를 쓴다.", "type": "-", "cards": [], "source": "decorrelation.tex 248–262", "lib": "-", "col": 1, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$V_{k,L}(\\eta)$", "text": "$V_{k,L}(\\eta)=\\max_{1\\le|S|\\le k}\\limsup_{N}\\mathcal A_{L,\\eta}v_N(S,d)$. 최대는 유한 개 labeled topology 위.", "at": [["decorrelation.tex", 253, 257]]}, {"tex": "$v_N(S,d)$", "text": "$v_N(S,d)=N^{-2}\\mathbb E\\sum_{i,j}\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2$. 기대값은 root를 포함한다. $A_S$, $\\mu_{d,S}$ 의 좌표는 절댓값 $\\le1$, $0\\le v_N\\le1$.", "at": [["decorrelation.tex", 99, 104]]}, {"tex": "$\\mathcal A_{L,\\eta}$", "text": "$a$ 개 깊이 좌표 위의 음 아닌 배열 $z$ 에 대해 $\\mathcal A_{L,\\eta}z=L^{-a}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}z(\\mathbf q)$. 추가 순서 제한(예: $d<\\min_vq_v$)은 합의 범위에 넣는다. 정규화하지 않은 평균이라 총질량 $\\le1$.", "at": [["decorrelation.tex", 30, 38]]}, {"tex": "$\\eta$-regular", "text": "모든 배정 깊이$/L$ 이 $(\\eta,1-\\eta)$ 안에 있고 서로 다른 branching vertex의 정규화 깊이가 $\\eta$ 보다 더 떨어진 배정. prefix 깊이 $d$ 가 추가로 지정되면 모든 branching 깊이에 대해 같은 제한을 지킨다. 한 topology의 두 사본이 aligned 깊이를 쓰면 대응 vertex는 깊이 좌표 하나를 공유하고, regularity는 서로 다른 좌표들에 건다.", "at": [["decorrelation.tex", 21, 28]]}, {"tex": "topology $S$", "text": "labeled leaf를 갖는 유한 rooted tree에서 unary vertex를 지운 것. 각 branching vertex에 $\\{0,\\ldots,L-1\\}$ 의 정수 깊이를 주며, 깊이는 모든 가지를 따라 엄격히 증가한다.", "at": [["decorrelation.tex", 18, 20]]}], "groundingRefs": [["decorrelation.tex", 248, 262]]}, "status": "미완결"}, {"id": "s2_one_leaf", "kind": "step", "title": "잎 하나: $V_{1,L}(\\eta)\\le\\delta/\\eta$", "short": "", "in": [], "cond": [], "out": "$d$ 에서 갈라지는 old path 둘(path 1이 spin anchor)에 color 하나를 붙이되 anchor와 정확히 $d$ 에서 갈라지게 한다. old path 2 는 계수 $1$, 두 old path에서 $d$ 에서 갈라지는 fresh path는 $-c_d$, path 2를 따라가다 $\\ell>d$ 에서 떠나면 $-c_\\ell$; $c_d=2m_{d+1}-m_d=(d+2)\\delta$, $c_\\ell=\\delta$. anchor만에서의 총계수는 $-\\delta$. $X=R_{12}$, $X_\\ell=R_{13}$ 로 두면 $X_\\ell$ 은 $X$ 와 주변 법칙이 같고 $\\sum_{\\ell=d}^{L-1}c_\\ell=1+\\delta$. $f=X$ 로 identity를 쓰면 $\\frac12\\sum_\\ell c_\\ell\\mathbb E(X-X_\\ell)^2=\\delta\\operatorname{Var}(X)+o_N(1)\\le\\delta+o_N(1)$. $\\ell=d$ 에서 세 spin vector는 $d$ 아래에서 조건부 독립이므로 three-copy 부등식과 $c_d\\ge\\eta$ 로 $v_N(S,d)\\le\\delta/\\eta+o_N(1)$ (고정 $L,d$). 따라서 $V_{1,L}(\\eta)\\le\\delta/\\eta$.", "type": "-", "cards": [], "source": "decorrelation.tex 264–290", "lib": "-", "col": 2, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$m_d$", "text": "이 절 전체에서 $m_d=d/L$.", "at": [["decorrelation.tex", 4, 4]]}, {"tex": "$\\delta$", "text": "$\\delta=L^{-1}$.", "at": [["decorrelation.tex", 4, 4]]}, {"tex": "$R_S$", "text": "spin replica leaf 부분집합 $S$ 의 multioverlap $R_S=\\frac1N\\sum_{i}\\prod_{a\\in S}\\sigma_i^a$, $R_\\varnothing=1$. 수 5에서는 표본 leaf에 대해 $R_S=\\mathbf 1\\cdot A_S$.", "at": [["trees.tex", 42, 46], ["decorrelation.tex", 60, 61], ["decorrelation.tex", 90, 90]]}, {"tex": "$v_N(S,d)$", "text": "$v_N(S,d)=N^{-2}\\mathbb E\\sum_{i,j}\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2$. 기대값은 root를 포함한다. $A_S$, $\\mu_{d,S}$ 의 좌표는 절댓값 $\\le1$, $0\\le v_N\\le1$.", "at": [["decorrelation.tex", 99, 104]]}, {"tex": "$V_{k,L}(\\eta)$", "text": "$V_{k,L}(\\eta)=\\max_{1\\le|  와 사영 prefix 의 결합 주변은 class 안에서 고정이고, $f$ 곱하기 사영 overlap 의 기대값은 class 안에서 상수라 총 부호 계수를 곱할 수 있다.", "type": "-", "cards": [], "source": "decorrelation.tex 386–412", "lib": "-", "col": 3, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$a_{S,e}$, $p_N(S,e)$", "text": "$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\ldots,T_s$ 로 갈라질 때 $a_{S,e}=\\prod_j\\mu_{e,T_j}$ (좌표별 곱), $p_N(S,e)=\\sum_jv_N(T_j,e)^{1/4}$.", "at": [["decorrelation.tex", 208, 215]]}, {"tex": "$E$, $c_E$, $\\mathfrak E(\\mathcal T,a_*,\\mathcal C)$", "text": "extension history와 그 계수(선택한 계수들의 곱), 제약 $\\mathcal C$ 를 지키는 허용 history의 모음.", "at": [["trees.tex", 259, 276], ["perturbations.tex", 427, 440]]}, {"tex": "$R_S$", "text": "spin replica leaf 부분집합 $S$ 의 multioverlap $R_S=\\frac1N\\sum_{i}\\prod_{a\\in S}\\sigma_i^a$, $R_\\varnothing=1$. 수 5에서는 표본 leaf에 대해 $R_S=\\mathbf 1\\cdot A_S$.", "at": [["trees.tex", 42, 46], ["decorrelation.tex", 60, 61], ["decorrelation.tex", 90, 90]]}, {"tex": "$\\mathbb E$", "text": "따로 적지 않은 기대값 $\\mathbb E$ 는 root와 해당 tree의 표본추출을 포함한다.", "at": [["trees.tex", 47, 48]]}, {"tex": "$f$", "text": "$2k$ 개 old leaf 전체의 overlap.", "at": [["decorrelation.tex", 387, 388]], "local": true}, {"tex": "$b_\\ell$", "text": "side-II 첫 path 가 $\\ell$ 에서 fresh 로 갈라지는 class 에서 새 stem 위의 $a_{S,e}$.", "at": [["decorrelation.tex", 393, 395]], "local": true}], "groundingRefs": [["decorrelation.tex", 386, 412]]}, "status": "미완결"}, {"id": "s7_class_totals", "kind": "step", "title": "class 별 총계수", "short": "", "in": [], "cond": [], "out": "Lemma tree:reference-total 로 이후 side-II color 를 거꾸로 합하면 첫 path 선택마다 $\\kappa(S^+)$, side-I 선택을 합하면 다른 인자 $\\kappa(S^+)$. 따라서 $\\ell$ 의 fresh class 총계수는 $-c_\\ell J$. 총계수는 old tree 에서나 anchor 만에서나 $-\\delta J$. $\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta=m_e+\\delta$ 이므로 $e$ 까지 old prefix class 의 계수는 $m_eJ$. 표: fresh divergence $d\\le\\ell<e$ 는 $a\\cdot b_\\ell$, $-c_\\ell J$; old prefix through $e$ 는 $a\\cdot b$, $m_eJ$.", "type": "-", "cards": [], "source": "decorrelation.tex 414–432", "lib": "-", "col": 4, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$\\kappa(T)$", "text": "reference 계수 $\\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$; $a_v$, $d_v$ 는 처방한 reference tree에서 vertex의 자식 수와 깊이.", "at": [["trees.tex", 346, 354]]}, {"tex": "$J$", "text": "$J=\\kappa(S^+)^2$.", "at": [["decorrelation.tex", 333, 336]]}, {"tex": "$m_d$", "text": "이 절 전체에서 $m_d=d/L$.", "at": [["decorrelation.tex", 4, 4]]}, {"tex": "$\\delta$", "text": "$\\delta=L^{-1}$.", "at": [["decorrelation.tex", 4, 4]]}, {"tex": "$S^+$", "text": "$S$ 의 모든 내부 branching 깊이를 1씩 올린 topology.", "at": [["decorrelation.tex", 297, 298]]}], "groundingRefs": [["decorrelation.tex", 414, 432]]}, "status": "미완결"}, {"id": "s8_induction_identity", "kind": "step", "title": "귀납 항등식과 오차 $\\rho_N$", "short": "", "in": [], "cond": [], "out": "각 행의 사영 overlap 에 $f$ 를 곱하고 identity 를 $J$ 로 나누어 정리하면 $\\sum_{\\ell=d}^{e-1}c_\\ell\\mathbb E[f(a\\cdot b-a\\cdot b_\\ell)]=\\delta(\\mathbb E[f(a\\cdot b)]-\\mathbb Ef\\,\\mathbb ER_{\\mathrm{target}})+\\rho_N(S,d)$, $R_{\\mathrm{target}}$ 은 anchor-alone extension 의 목표 overlap(절댓값 $\\le1$). $|\\rho_N(S,d)|\\le C_{k,\\eta}(p_N(S^+,e+1)+h_N(S))+C_{L,k,\\eta}\\varepsilon_{N,L,k}$: 사영 오차에 $|f|\\le1$ 을 곱해도(상관되어도) $L^2$ 노름 이상 들지 않고, 절대 계수로 합해 상대 절대 비용을 쓴다. 마지막 항은 원 identity 오차를 $J$ 로 나눈 것을 포함하며 고정 $L$ 에서 0으 \|f-a\\cdot b\\|_{L^2}\\le2p_N(S,e)$, $\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta\\le1$ 이므로 왼쪽에서 $f$ 를 $a\\cdot b$ 로 바꾸는 비용은 많아야 $4p_N(S,e)$. $a\\cdot b_\\ell$ 은 $a\\cdot b$ 와 주변 법칙이 같아 왼쪽은 $\\frac12\\sum_\\ell c_\\ell\\mathbb E(a\\cdot b-a\\cdot b_\\ell)^2$; 항들은 음 아니고 $c_d\\ge\\eta$. 오른쪽은 $2\\delta+|\\rho_N|$ 이하. 따라서 $\\mathbb E(a\\cdot b-a\\cdot b_d)^2\\le C_\\eta(\\delta+p_N(S,e)+|\\rho_N(S,d)|)$. $A_S$ 세 사본을 $d$ 아래로 조건부 독립으로 뽑고 첫 사본을 포함한 두 축약을 사영하면 각각 $L^2$ 에서 많아야 $2p_N(S,e)$ 바뀐다. three-copy 부등식, 위 경계, $p_N(S,e)\\le k$ 로 $v_N(S,d)\\le C_{k,\\eta}(\\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S))+C_{L,k,\\eta}\\varepsilon_{N,L,k}$.", "type": "-", "cards": [], "source": "decorrelation.tex 459–490", "lib": "-", "col": 6, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": ["edge 내용 미작성: e22"], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$a_{S,e}$, $p_N(S,e)$", "text": "$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\ldots,T_s$ 로 갈라질 때 $a_{S,e}=\\prod_j\\mu_{e,T_j}$ (좌표별 곱), $p_N(S,e)=\\sum_jv_N(T_j,e)^{1/4}$.", "at": [["decorrelation.tex", 208, 215]]}, {"tex": "$v_N(S,d)$", "text": "$v_N(S,d)=N^{-2}\\mathbb E\\sum_{i,j}\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2$. 기대값은 root를 포함한다. $A_S$, $\\mu_{d,S}$ 의 좌표는 절댓값 $\\le1$, $0\\le v_N\\le1$.", "at": [["decorrelation.tex", 99, 104]]}, {"tex": "$A_S$, $x\\cdot y$, $\\|x\\|_N$", "text": "$S$ 의 표본 사본에 대해 $A_S=(\\prod_{a\\in S}\\sigma_i^a)_{i\\le N}$, $x\\cdot y=N^{-1}\\sum_ix_iy_i$, $\\|x\\|_N^2=x\\cdot x$.", "at": [["decorrelation.tex", 87, 93]]}, {"tex": "$\\mathscr F_d$", "text": "처음 stem 위의 깊이 $d$ (첫 branching 깊이 포함)에서 root와 깊이 $d$ 까지의 표본 prefix가 생성하는 sigma field.", "at": [["decorrelation.tex", 94, 95]]}, {"tex": "$\\varepsilon_{N,L,k}$", "text": "아래에서 쓰는 유한 모음 위에서 취한 Theorem pert:tree-identity 오차의 최대.", "at": [["decorrelation.tex", 49, 58]]}, {"tex": "$\\delta$", "text": "$\\delta=L^{-1}$.", "at": [["decorrelation.tex", 4, 4]]}], "filled": ["$f\\to a\\cdot b$ 교체 비용 $4p$ 의 Cauchy–Schwarz 계산, 사영한 세 사본의 축약 $X\\cdot Y,X\\cdot Z$ 를 $a\\cdot b,a\\cdot b_d$ 와 같은 법칙으로 맞추는 것, 제곱 오차를 $p_N\\le k$ 로 선형으로 만드는 것은 원문이 적지 않아 작성자가 채웠다."], "groundingRefs": [["decorrelation.tex", 459, 490]]}, "status": "미완결"}, {"id": "s10_average", "kind": "step", "title": "fiber 경계, 재귀식, 결론", "short": "", "in": [], "cond": [], "out": "$p_N$ 의 각 자식은 잎이 $k$ 개보다 적다. aligned 구성은 $d,e$ 를 포함해 $D=b(S)+1$ 개 서로 다른 깊이 좌표를 갖고, $T_j$ 의 항은 $D_j=b(T_j)+1$ 개 좌표만 쓴다. shift 항에서 그 좌표는 $\\pi_j(\\mathbf q)=(e+1,(q_v+1)_{v\\in\\operatorname{Br}(T_j)})$. 남는 배정마다 원상이 많아야 $L^{D-D_j}$ 개이고 큰 $L$ 에서 좌표는 $\\eta/2$-regular. $w_j$ 를 이 좌표의 함수로 본 자식 공분산이라 하면 $0<\\gamma\\le1$ 에서 $L^{-D}\\sum_{\\mathbf q\\ \\eta\\text{-reg}}w_j(\\pi_j(\\mathbf q))^\\gamma\\le L^{-D_j}\\sum_{\\mathbf y\\ \\eta/2\\text{-reg}}w_j(\\mathbf y)^\\gamma\\le(L^{-D_j}\\sum_{\\mathbf y\\ \\eta/2\\text{-reg}}w_j(\\mathbf y))^\\gamma$. shift 하지 않은 항은 좌표를 옮기지 않고 같은 경계. 두 aligned 사본은 단일 사본 추정을 쓰고 대각선 제한은 없다. $\\gamma=1/4$, $\\limsup_N$, eq decor:projection-shift-error, eq decor:identity-error 로 큰 $L$ 에서 $V_{k,L}(\\eta)\\le C_{k,\\eta}(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4})$. 더 작은 topology 위의 최대는 공분산이 1 이하라 오른쪽에 흡수된다. base case 와 귀납으로 모든 고정 $k,\\eta$ 에서 $V_{k,L}(\\eta)\\to0$, 명제가 증명된다.", "type": "-", "cards": [], "source": "decorrelation.tex 491–523", "lib": "-", "col": 7, "row": 0, "audit": {"state": "incomplete", "label": "미완결", "issues": [], "missing": [], "declared": "sketch", "child": null, "contractIssues": []}, "outputs": {}, "inputPorts": {}, "importEdge": null, "statementRef": null, "coverage": {"imports": null, "overlaps": [], "pending": [], "forwarded": [], "bodyMode": "independent"}, "x": {"symbols": [{"tex": "$V_{k,L}(\\eta)$", "text": "$V_{k,L}(\\eta)=\\max_{1\\le|S|\\le k}\\limsup_{N}\\mathcal A_{L,\\eta}v_N(S,d)$. 최대는
