<title>Multioverlap 집중 유도 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 화면 전체가 모눈 캔버스(이동·확대). 위에 얇은 도구 막대, 오른쪽(휴대폰에서는 아래)에 선택한 node의 상세. */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#18202d; --muted:#5a6578; --line:#b9c2d0; --grid:#dfe4eb;
  --accent:#0d6b72; --accent-soft:#d5ecec; --warn:#9a5b00;
  --g-ext:#f6efe2; --g-ext-b:#cdb68a;
  --g-71:#eef2f9; --g-71-b:#a9b8d3;
  --g-72:#f1eef8; --g-72-b:#b6a9d3;
  --g-73:#eef6f0; --g-73-b:#9fc6ab;
  --g-74:#e4f2f2; --g-74-b:#6fb3b6;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-head:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --paper:#18202b; --ink:#e3e8f0; --muted:#97a2b4; --line:#3b4556; --grid:#1a212c;
  --accent:#55c3c6; --accent-soft:#163a3d; --warn:#e0a54a;
  --g-ext:#2a2518; --g-ext-b:#7a6640;
  --g-71:#1b2230; --g-71-b:#4a5a78;
  --g-72:#211d2e; --g-72-b:#5d5180;
  --g-73:#18261e; --g-73-b:#3f6b4e;
  --g-74:#142a2b; --g-74-b:#2f7275;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#18202b; --ink:#e3e8f0; --muted:#97a2b4; --line:#3b4556; --grid:#1a212c;
  --accent:#55c3c6; --accent-soft:#163a3d; --warn:#e0a54a;
  --g-ext:#2a2518; --g-ext-b:#7a6640;
  --g-71:#1b2230; --g-71-b:#4a5a78;
  --g-72:#211d2e; --g-72-b:#5d5180;
  --g-73:#18261e; --g-73-b:#3f6b4e;
  --g-74:#142a2b; --g-74-b:#2f7275;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
header h1{font-family:var(--font-head);font-size:17px;margin:0;font-weight:700;text-wrap:balance}
header .sub{color:var(--muted);font-size:12.5px;flex:1 1 260px;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.main{flex:1;display:flex;min-height:0;position:relative}
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.cluster{position:absolute;border:1.5px solid;border-radius:14px;pointer-events:none}
.cluster .cl{position:absolute;left:12px;top:-11px;padding:0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;background:var(--bg);color:var(--muted);white-space:nowrap}
.node{position:absolute;width:max-content;max-width:340px;padding:9px 12px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;transition:opacity .15s}
.node .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;display:flex;gap:8px;justify-content:space-between}
.node.supplement{border-color:var(--warn)}
#panel .node-id{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
#panel .supplement-badge{color:var(--warn);font-weight:600}
#panel .subgraph{position:relative;overflow-x:auto;padding:12px;border:1px solid var(--line);border-radius:8px}
#panel .subgraph-grid{display:flex;gap:34px;position:relative;min-width:max-content}
#panel .subgraph-col{display:flex;flex-direction:column;gap:12px;min-width:140px;max-width:190px}
#panel .subgraph-node{position:relative;background:var(--paper);z-index:1;white-space:normal;text-align:left}
#panel .subgraph-node.supplement{border-color:var(--warn);color:var(--warn)}
#panel .subgraph svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
#panel .subgraph-detail{margin-top:10px}
.node .t{font-weight:600;font-size:13.5px;margin-top:1px}
.node .f{margin-top:5px;font-size:13px;line-height:1.9}
.node .f mjx-container{margin:0!important}
.node.ext{background:var(--g-ext);border-color:var(--g-ext-b);border-style:dashed}
.node.key{border-color:var(--accent);border-width:2px}
.node.goal{border-color:var(--accent);border-width:3px;box-shadow:0 0 0 4px var(--accent-soft)}
.node.note{border-style:dotted;background:transparent}
.node.sel{outline:3px solid var(--accent);outline-offset:3px}
.dim .node:not(.lit){opacity:.22}
.dim .elabel:not(.lit){opacity:.15}
.elabel{position:absolute;font-size:11px;line-height:1.35;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:4px;max-width:150px;width:max-content;text-align:center;pointer-events:none;transition:opacity .15s}
.elabel.key{color:var(--accent);font-weight:500}
.elabel.minor{display:none}
.dim .elabel.minor.lit{display:block}
path.e{fill:none;stroke:var(--line);stroke-width:1.4;transition:opacity .15s}
path.e.key{stroke:var(--accent);stroke-width:2.2}
path.e.note{stroke-dasharray:3 4}
.dim path.e:not(.lit){opacity:.12}
#panel{width:380px;max-width:42%;border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;padding:16px 18px 24px;padding-right:max(18px,env(safe-area-inset-right,0px))}
#panel h2{font-family:var(--font-head);font-size:16px;margin:4px 0 8px;text-wrap:balance}
#panel .ptag{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
#panel .stmt{margin:10px 0;padding:10px 12px;background:var(--bg);border-radius:8px;overflow-x:auto}
#panel h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:600}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#panel li button{width:100%;text-align:left;display:block;padding:6px 9px}
#panel li button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#panel .src{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
#panel .warn{color:var(--warn);font-size:12.5px;margin-top:8px}
#panel p{margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--line);vertical-align:middle;margin-right:5px}
.legend i.k{border-color:var(--accent);border-top-width:2.5px}
.legend i.n{border-top-style:dotted}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1.5px dashed var(--g-ext-b);background:var(--g-ext)}
#hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;pointer-events:none}
#zoomlvl{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:44px;text-align:right;align-self:center}
#loading[hidden]{display:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .main{flex-direction:column}
  #panel{width:auto;max-width:none;max-height:42%;border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  header .sub{display:none}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){.node,path.e,.elabel{transition:none}}
</style>

<header>
  <h1>§7 정리: 모든 multioverlap의 깊이 평균 집중</h1>
  <div class="sub">원문 <span style="font-family:var(--font-mono)">decorrelation.tex</span> Theorem <span style="font-family:var(--font-mono)">decor:overlap-concentration</span> 의 유도. 왼쪽에서 오른쪽으로 흐른다. node를 누르면 그 결과까지 쓰인 것만 밝아진다.</div>
  <div class="tools">
    <button id="zin" type="button" aria-label="확대">＋</button>
    <button id="zout" type="button" aria-label="축소">－</button>
    <span id="zoomlvl">100%</span>

    <button id="focus" type="button">정리의 증명으로</button>

      <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>

  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>
</div>

<script>
const R=String.raw;
const GRAPH={"groups":{"ext":{"label":"밖에서 받는 것 (§3·§6)","fill":"--g-ext","b":"--g-ext-b"},"s71":{"label":"§7.1 깊이 평균","fill":"--g-71","b":"--g-71-b"},"s72":{"label":"§7.2 조건부 공분산과 깊이 연속성","fill":"--g-72","b":"--g-72-b"},"s73":{"label":"§7.3 Proposition: 조건부 decorrelation","fill":"--g-73","b":"--g-73-b"},"s74":{"label":"§7.4 정리의 증명","fill":"--g-74","b":"--g-74-b"}},"nodes":[{"id":"X_TI","g":"ext","cls":"ext","tag":"Thm pert:tree-identity","t":"Prescribed tree 위의 항등식","f":"$\\sum_{E}c_E\\,\\mathbb E[fR_E]$\u003cbr>$\\quad-\\,\\mathbb E f\\sum_{E\\,\\text{(anchor만)}}c_E\\,\\mathbb E[R_E]\\to0$","body":"\u003cp>pert:selection 이 준 수열을 따라, 고정 $L$·고정 old tree·고정 제약에서 $N\\to\\infty$ 일 때 0으로 간다. spin anchor와 marker anchor 둘 다, 추가 color가 없는 경우도 허용.\u003c/p>","src":"perturbations.tex 450–465"},{"id":"X_EXT","g":"ext","cls":"ext","tag":"§3 extension 규칙","t":"Extension 계수 $c_E$","f":"old leaf 재사용 $+1$, fresh 갈라짐 $-c_\\ell$","body":"\u003cp>각 extension history $E$ 에 붙는 부호 있는 계수. 정리 증명에서는 marker 쪽 계수 $C(S,e)$ 를 셀 때 쓰인다.\u003c/p>","src":"trees.tex (extension rule), perturbations.tex"},{"id":"X_RT","g":"ext","cls":"ext","tag":"Lemma tree:reference-total","t":"Reference 계수의 총합 $\\kappa(S)$","f":"$\\kappa(S)=\\prod_{v\\in\\mathrm{Br}(S)}\\prod_{j=1}^{a_v-1}(m_{d_v}-j\\,m_{d_v+1})$","body":"\u003cp>anchor와 color들이 지정된 tree $S$ 를 이루도록 할 때, 호환되는 모든 extension의 계수 합.\u003c/p>","src":"trees.tex 337–355"},{"id":"X_CH","g":"ext","cls":"ext","tag":"Lemma tree:charging","t":"Fresh split의 상대 비용","f":"계수 절대합 $\\le C\\cdot$ 순 계수","body":"\u003cp>Proposition의 귀납 단계에서 상대 절대 비용 경계 (decor:relative-absolute-cost)로 쓰인다. 정리 증명 본문은 직접 쓰지 않는다.\u003c/p>","src":"trees.tex 393–"},{"id":"X_SAMP","g":"ext","cls":"ext","tag":"§3 tree 표본 규칙","t":"잎 제거와 조건부 독립","f":"갈라진 뒤 자식들은 prefix가 주어지면 조건부 독립","body":"\u003cp>잎 일부와 그 경로를 지워도 남은 tree의 표본 법칙은 그대로다. 갈라짐 뒤의 자식 continuation은 prefix에 대해 조건부 독립이다.\u003c/p>","src":"trees.tex 38–40"},{"id":"X_MO","g":"ext","cls":"ext","tag":"eq tree:multioverlap","t":"Multioverlap","f":"$R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a$","body":"\u003cp>표본 tree $S$ 의 잎들의 multioverlap. $R_\\varnothing=1$.\u003c/p>","src":"trees.tex 44–47"},{"id":"A_DEF","g":"s71","tag":"eq decor:average-definition","t":"깊이 평균 $\\mathcal A_{L,\\eta}$","f":"$\\mathcal A_{L,\\eta}z=L^{-a}\\!\\!\\sum_{\\mathbf q\\ \\eta\\text{-regular}}\\! z(\\mathbf q)$","body":"\u003cp>$m_d=d/L$, $\\delta=L^{-1}$. 깊이 배정이 $\\eta$-regular 이면 정규화한 깊이가 모두 $(\\eta,1-\\eta)$ 에 있고 서로 $\\eta$ 보다 멀다. 정규화하지 않은 평균이라 전체 질량은 1 이하다.\u003c/p>","src":"decorrelation.tex 15–37"},{"id":"A_HOL","g":"s71","tag":"eq decor:average-holder","t":"분수 거듭제곱","f":"$\\mathcal A_{L,\\eta}(z^\\gamma)\\le(\\mathcal A_{L,\\eta}z)^\\gamma,\\ 0\u003c\\gamma\\le1$","body":"\u003cp>질량이 1 이하라서 Jensen으로 나온다.\u003c/p>","src":"decorrelation.tex 38–43"},{"id":"A_CMP","g":"s71","tag":"§7.1 두 비교","t":"쓰지 않는 좌표, 정수 이동","f":"이동: $\\eta$-regular $\\hookrightarrow$ $\\eta/2$-regular","body":"\u003cp>(1) 쓰지 않는 좌표에 대한 합은 많아야 $L$ 이고 정규화가 그것을 상쇄한다. (2) 좌표 일부를 고정 정수만큼 옮기면 충분히 큰 $L$ 에서 $\\eta$-regular 배정이 $\\eta/2$-regular 배정으로 단사로 간다.\u003c/p>","src":"decorrelation.tex 44–47"},{"id":"A_ERR","g":"s71","tag":"eq decor:identity-error","t":"항등식 오차의 유한 최대","f":"$\\varepsilon_{N,L,k}\\to0\\quad(N\\to\\infty;\\ L,k\\ \\text{고정})$","body":"\u003cp>고정 $L$ 에서 크기가 유계인 topology와 깊이 배정은 유한개다. 그래서 $N\\to\\infty$ 전에 X_TI의 오차를 그 모음 전체에서 최대로 잡을 수 있다. 이 오차에 곱해지는 상수는 $L$ 에 마음대로 의존해도 된다.\u003c/p>","src":"decorrelation.tex 48–58"},{"id":"B_DEF","g":"s72","tag":"eq decor:covariance-definition","t":"조건부 평균과 제곱 공분산","f":"$\\mu_{d,S}=\\mathbb E[A_S\\mid\\mathscr F_d]$\u003cbr>$v_N(S,d)=\\frac1{N^2}\\mathbb E\\sum_{i,j}\\mathrm{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2$","body":"\u003cp>$A_S=(\\prod_{a\\in S}\\sigma_i^a)_{i\\le N}$, $R_S=\\mathbf 1\\cdot A_S$, $x\\cdot y=N^{-1}\\sum_i x_iy_i$. $\\mathscr F_d$ 는 root와 깊이 $d$ 까지의 표본 prefix가 만든다. $0\\le v_N(S,d)\\le1$.\u003c/p>","src":"decorrelation.tex 86–106"},{"id":"B_CON","g":"s72","tag":"Lemma decor:contractions","t":"축약과 세 사본","f":"$\\|(A_S-\\mu_{d,S})\\cdot B\\|_{L^2}\\le v_N(S,d)^{1/4}$","body":"\u003cp>$B\\in[-1,1]^N$ 가 $\\mathscr F_d$ 에 대해 $A_S$ 와 조건부 독립일 때. 둘째 주장: 조건부 독립 사본 $X,Y,Z$ 와 조건부 공분산 $C$ 에 대해 $\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\ge\\frac2{N^2}\\mathbb E\\sum_{ij}C_{ij}^2$ (decor:three-copy-bound).\u003c/p>","src":"decorrelation.tex 108–140"},{"id":"B_ME","g":"s72","tag":"eq decor:martingale-energy","t":"Martingale energy","f":"$\\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\le1$","body":"\u003cp>한 경로를 따라 $\\mu_{t,T}$ 는 유계 vector martingale이고 증분이 직교한다.\u003c/p>","src":"decorrelation.tex 168–175"},{"id":"B_DC","g":"s72","tag":"Lemma decor:depth-continuity","t":"깊이에 대한 평균 연속성","f":"$\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L$","body":"\u003cp>갈라짐 깊이 일부를 한 칸 늦춘 $S^U$ 와 원래 $S$ 의 평균 차이. 평가 깊이를 한 칸 옮기는 것도 같은 꼴 (decor:evaluation-depth-continuity). 상수는 vertex 수와 이동 수에만 의존한다. Proposition의 귀납 단계가 쓴다.\u003c/p>","src":"decorrelation.tex 142–230"},{"id":"B_PB","g":"s72","tag":"eq decor:projection-bound","t":"자식을 평균으로 바꾸는 사영","f":"$\\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e)$","body":"\u003cp>$S$ 가 $e$ 에서 처음 자식 $T_1,\\dots,T_s$ 로 갈라지면 $\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$. $a_{S,e}=\\prod_j\\mu_{e,T_j}$, $p_N(S,e)=\\sum_j v_N(T_j,e)^{1/4}$. 자식을 하나씩 바꾸며 축약 경계를 쓴다. 특히 $B=\\mathbf 1$ 에 적용된다.\u003c/p>","src":"decorrelation.tex 205–230"},{"id":"P_V","g":"s73","tag":"eq decor:V-definition","t":"귀납 양 $V_{k,L}(\\eta)$","f":"$V_{k,L}(\\eta)=\\max_{1\\le|S|\\le k}\\limsup_{N}\\mathcal A_{L,\\eta}v_N(S,d)$","body":"\u003cp>최대는 유한개 labeled topology에 대해서다. 낮은 차수의 평균은 (분수 거듭제곱이면 Hölder로) $V_{k-1,L}(\\eta/2)$ 로 누른다.\u003c/p>","src":"decorrelation.tex 247–260"},{"id":"P_1","g":"s73","tag":"§7.3 잎 하나","t":"기저: $V_{1,L}(\\eta)\\le\\delta/\\eta$","f":"$\\tfrac12\\sum_\\ell c_\\ell\\,\\mathbb E(X-X_\\ell)^2=\\delta\\,\\mathrm{Var}(X)+o_N(1)$","body":"\u003cp>두 old path, spin anchor, color 하나. $c_d=(d+2)\\delta$, $c_\\ell=\\delta$. $\\ell=d$ 항에 세 사본 부등식과 $c_d\\ge\\eta$ 를 쓴다.\u003c/p>","src":"decorrelation.tex 262–300"},{"id":"P_IND","g":"s73","tag":"§7.3 귀납 단계","t":"늦춘 두 사본과 세 사본 추정","f":"$J=\\kappa(S^+)^2$, 사영 오차, 귀납 항등식 → $v_N(S,d)$ 추정","body":"\u003cp>$S$ 의 두 사본 I, II를 $d$ 에서 갈라 두고, 갈라짐을 한 칸 늦춘 $S^+$ 두 사본을 목표로 항등식을 쓴다. 부호 있는 계수를 class별로 더하면 음이 아닌 세 사본 추정이 된다. 자식을 사영으로 바꾼 오차는 $p_N$ 으로, 깊이 되돌림은 깊이 연속성으로 누른다.\u003c/p>","src":"decorrelation.tex 300–490"},{"id":"P_FB","g":"s73","tag":"eq decor:fiber-bound","t":"Fiber 경계","f":"$L^{-D}\\!\\sum_{\\mathbf q}w_j(\\pi_j\\mathbf q)^\\gamma$\u003cbr>$\\quad\\le\\big(L^{-D_j}\\!\\sum_{\\mathbf y\\ \\eta/2}w_j(\\mathbf y)\\big)^\\gamma$","body":"\u003cp>자식 $T_j$ 에 속한 항은 $D_j=b(T_j)+1$ 개 좌표만 쓴다. 남는 배정마다 원상이 많아야 $L^{D-D_j}$ 개이고, 좌표는 큰 $L$ 에서 $\\eta/2$-regular. 그 위에 Hölder.\u003c/p>","src":"decorrelation.tex 491–511"},{"id":"P_REC","g":"s73","tag":"eq decor:induction-recursion","t":"재귀 부등식","f":"$V_{k,L}(\\eta)\\le C_{k,\\eta}\\big(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4}\\big)$","body":"\u003cp>$\\gamma=1/4$ 로 fiber 경계를 쓰고 $\\limsup_N$ 을 취한다. 충분히 큰 $L$ 에서.\u003c/p>","src":"decorrelation.tex 512–519"},{"id":"PROP","g":"s73","cls":"key","tag":"Prop decor:conditional-concentration","t":"조건부 decorrelation","f":"$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d)=0$","body":"\u003cp>평균은 $S$ 의 모든 갈라짐 깊이와 첫 갈라짐 앞의 regular 깊이 $d$ 에 대해서. $k$ 에 대한 귀납으로 모든 고정 $k,\\eta$ 에서 $V_{k,L}(\\eta)\\to0$.\u003c/p>","src":"decorrelation.tex 234–245, 520–524"},{"id":"T_S","g":"s74","cls":"key","tag":"증명 1","t":"Singleton","f":"$\\mathbb ER_S^2=(\\mathbb ER_S)^2+o_N(1)$","body":"\u003cp>Spin anchor 항등식을 추가 color 없이 $f=R_S$ 로 쓴다. 그래서 singleton에서는 고정 $L$ 마다 $\\mathrm{Var}(R_S)\\to0$.\u003c/p>","src":"decorrelation.tex 533–535"},{"id":"T_SET","g":"s74","cls":"key","tag":"증명 2","t":"$e-1$ 에서의 marker anchor","f":"old tree $=S$, 사본 $S$ 를 anchor에서 $e-1$ 에 갈라 붙임","body":"\u003cp>$S$ 가 $e$ 에서 처음 자식 $T_1,\\dots,T_s$ 로 갈라진다. $S$ 를 old tree로 쓰고 그 잎 하나를 marker anchor로 정한다. 모든 잎이 anchor에서 $e-1$ 에 갈라지는 $S$ 의 사본 전체를 더한다. old tree가 $e-1$ 에서는 아직 갈라지지 않았으므로 첫 path는 $e-1$ 에서 fresh여야 하고 나머지 목표 path는 그 fresh subtree 안에 있다. $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$.\u003c/p>","src":"decorrelation.tex 537–545"},{"id":"T_C","g":"s74","cls":"key","tag":"eq decor:marker-coefficient","t":"Marker 계수","f":"$C(S,e)=-\\delta\\,\\kappa(S)\\neq0$","body":"\u003cp>항등식 양쪽의 extension 계수가 같은 0 아닌 수다.\u003c/p>\u003cp class=\"warn\">원문은 \"nonzero\"라고만 한다. 작성자 확인: $\\kappa(S)$ 의 각 인수는 $m_d-j\\,m_{d+1}=(d-j(d+1))/L\u003c0$ ($j\\ge1$) 이라 0이 아니다. 이 근거를 싣는 edge는 기존 proofmap(move5)에도 없었다.\u003c/p>","src":"decorrelation.tex 545–549","supplement":true},{"id":"T_SIDES","g":"s74","cls":"key","tag":"eq decor:marker-variance-identity","t":"항등식의 두 쪽","f":"$C(S,e)\\big(\\mathbb EM^2-(\\mathbb ER_S)^2\\big)$\u003cbr>$\\quad=C(S,e)\\,\\mathrm{Var}(M)=o_N(1)$","body":"\u003cp>목표 사본과 old 사본은 $\\mathscr F_{e-1}$ 아래에서 조건부 iid이므로 $f=R_S$ 와의 곱의 조건부 기대값은 $M^2$. anchor만 있는 쪽에서는 marker의 $e-1$ 아래 continuation을 지우면 확률 kernel이 1로 적분되어 보통의 $S$ 법칙, 평균 $\\mathbb ER_S$ 가 남는다.\u003c/p>","src":"decorrelation.tex 550–561"},{"id":"T_VM","g":"s74","cls":"key","tag":"eq decor:prefix-projection-concentration","t":"Prefix 사영의 집중","f":"$\\mathrm{Var}(M)\\to0\\quad(L,S,e\\ \\text{고정})$","body":"\u003cp>$C(S,e)$ 로 나누는 것은 고정 $L$ 에서만 한다. $L\\to\\infty$ 에서 균일한 하한은 필요 없다.\u003c/p>","src":"decorrelation.tex 562–569"},{"id":"T_G","g":"s74","cls":"key","tag":"증명 3","t":"$G$, $G_-$ 와 사영 경계","f":"$G=\\mathbf1\\cdot\\prod_j\\mu_{e,T_j},\\ \\ G_-=\\mathbf1\\cdot\\prod_j\\mu_{e-1,T_j}$\u003cbr>$\\mathbb E(R_S-G)^2\\le p_N(S,e)^2$","body":"\u003cp>자식 공분산은 $e$ 에서 평가한다. $e$ 는 자식들의 갈라짐 깊이와 떨어져 있다. $G_-$ 는 $\\mathscr F_{e-1}$-가측. 경계는 projection bound에 $B=\\mathbf 1$.\u003c/p>","src":"decorrelation.tex 571–581"},{"id":"T_ADJ","g":"s74","cls":"key","tag":"eq decor:adjacent-prefix-error","t":"이웃 prefix 오차","f":"$\\mathcal A_{L,\\eta}\\,\\mathbb E(G-G_-)^2\\le C_k/L$","body":"\u003cp>자식의 깊이는 모두 고정하고, 곱 차이 부등식과 martingale energy를 쓴다. $e$ 자체가 평균되는 좌표라 한 칸 증분을 $L$ 로 나누기 전에 더한다.\u003c/p>","src":"decorrelation.tex 582–590"},{"id":"T_L2","g":"s74","cls":"key","tag":"증명 4","t":"조건부 기대값의 $L^2$ 최적성","f":"$\\mathbb E(R_S-M)^2\\le\\mathbb E(R_S-G_-)^2$\u003cbr>$\\qquad\\le2p_N^2+2\\,\\mathbb E(G-G_-)^2$","body":"\u003cp>$M$ 은 $\\mathscr F_{e-1}$-가측 함수 가운데 $R_S$ 에 대한 최적 $L^2$ 사영이고 $G_-$ 도 그 가운데 하나다.\u003c/p>","src":"decorrelation.tex 591–596"},{"id":"T_FIB","g":"s74","cls":"key","tag":"증명 5","t":"$p_N^2$ 의 평균","f":"$p_N(S,e)^2\\le s\\sum_j v_N(T_j,e)^{1/2}$\u003cbr>$\\limsup_N\\mathcal A_{L,\\eta}\\,p_N^2\\le C\\,V_{k-1,L}(\\eta/2)^{1/2}$","body":"\u003cp>fiber 경계를 $\\gamma=1/2$ 로 쓴다. 여기서는 $d$ 가 없어 전체 평균의 좌표 수가 $D=b(S)$ 이고, 여전히 $D_j=b(T_j)+1$ (평가 깊이 $e$ 가 자식의 $d$ 자리).\u003c/p>","src":"decorrelation.tex 604–609"},{"id":"T_VAR","g":"s74","cls":"key","tag":"eq decor:variance-estimate","t":"분산 추정","f":"$\\limsup_{N}\\mathcal A_{L,\\eta}\\mathrm{Var}(R_S)$\u003cbr>$\\quad\\le C_k\\big(L^{-1}+V_{k-1,L}(\\eta/2)^{1/2}\\big)$","body":"\u003cp>분산 분해 $\\mathrm{Var}(R_S)=\\mathrm{Var}(M)+\\mathbb E(R_S-M)^2$. 첫 항은 고정 $L$ 에서 유한개 배정의 합이라 $\\limsup_N$ 에서 사라진다. 둘째 항은 $L^2$ 최적성, 이웃 prefix 오차, $p_N^2$ 의 평균으로 누른다. 충분히 큰 $L$ 에서.\u003c/p>","src":"decorrelation.tex 597–603"},{"id":"THM","g":"s74","cls":"goal","tag":"Thm decor:overlap-concentration","t":"모든 multioverlap의 집중","f":"$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}\\mathrm{Var}(R_S)=0$\u003cbr>모든 $\\eta>0$, 모든 고정 $S$","body":"\u003cp>모든 고정 labeled topology $S$ 에 대해. 평균은 $S$ 의 $b(S)$ 개 갈라짐 깊이에 대해서만. singleton은 좌표가 없어 고정 $L$ 마다 $\\mathrm{Var}(R_S)\\to0$.\u003c/p>\u003cp>마지막 걸음: 분산 추정의 오른쪽에서 $L^{-1}\\to0$ 이고, Proposition으로 $V_{k-1,L}(\\eta/2)\\to0$.\u003c/p>","src":"decorrelation.tex 63–76, 609–611"},{"id":"REM","g":"s74","cls":"note","tag":"Remark decor:order-of-limits","t":"극한 순서","f":"$N\\to\\infty$ 먼저, 그 뒤 평균과 $L\\to\\infty$","body":"\u003cp>상쇄되지 않은 작은 분모는 prescribed-tree 항등식 오차에만 나온다. 고정 $L$ 에서 tree가 유한개라 그 오차는 깊이 평균과 $L$ 극한 전에 사라진다. $N$ 에 대한, $L$ 에 균일한 수렴 속도는 쓰지 않는다.\u003c/p>","src":"decorrelation.tex 613–623"},{"id":"OUT","g":null,"cls":"ext","tag":"§8 comp:section","t":"받는 곳: 독립 message 비교","f":"이 깊이 평균들이 §8의 비교에 필요하다","body":"\u003cp>원문 §7 첫 문단: \"These are the averages needed for the comparison with independent messages.\"\u003c/p>","src":"decorrelation.tex 11–13"}],"edges":[["X_MO","B_DEF","$R_S=\\mathbf1\\cdot A_S$"],["X_TI","A_ERR","오차를 유한 모음에서 최대"],["A_DEF","A_HOL","질량 ≤ 1"],["A_DEF","A_CMP",""],["B_DEF","B_CON",""],["B_DEF","B_ME","$\\mu_{t,T}$ 는 martingale"],["B_ME","B_DC","깊이에 대해 더함"],["A_CMP","B_DC","$\\eta/2$-regular 이동"],["X_SAMP","B_DC","한 prefix 주변법칙 불변"],["B_CON","B_PB","자식마다 축약 경계"],["X_SAMP","B_PB","$\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$"],["A_DEF","P_V",""],["B_DEF","P_V","$v_N(S,d)$"],["X_TI","P_1","spin anchor, color 하나"],["X_EXT","P_1","$c_d,\\ c_\\ell$"],["B_CON","P_1","세 사본 부등식"],["X_TI","P_IND","늦춘 두 사본"],["X_RT","P_IND","$J=\\kappa(S^+)^2$"],["X_CH","P_IND","상대 절대 비용"],["B_PB","P_IND","자식 사영"],["B_DC","P_IND","깊이 되돌림 $C/L$"],["A_CMP","P_FB",""],["A_HOL","P_FB","$\\gamma\\le1$"],["P_IND","P_REC",""],["P_FB","P_REC","$\\gamma=1/4$"],["A_ERR","P_REC","$\\varepsilon_{N,L,k}\\to0$"],["P_V","P_REC",""],["P_1","PROP","기저"],["P_REC","PROP","귀납"],["X_TI","T_S","color 없음, $f=R_S$","key"],["X_MO","T_SET","$f=R_S$"],["B_DEF","T_SET","$\\mathscr F_{e-1}$"],["T_SET","T_C","첫 path는 $e-1$ 에서 fresh","key"],["X_EXT","T_C","extension 계수"],["X_RT","T_C","$\\kappa(S)$"],["T_SET","T_SIDES","$e-1$ 아래 조건부 iid","key"],["T_C","T_SIDES","양쪽 같은 계수","key"],["X_TI","T_SIDES","marker anchor 항등식","key"],["X_SAMP","T_SIDES","continuation 삭제 → 법칙 $S$"],["T_SIDES","T_VM","$C\\,\\mathrm{Var}(M)=o_N(1)$","key"],["T_C","T_VM","$C\\neq0$, 고정 $L$ 에서 나눔","key"],["B_PB","T_G","$B=\\mathbf1$","key"],["B_DEF","T_G","$\\mu_{e,T_j}$"],["T_G","T_ADJ","$G-G_-$","key"],["B_ME","T_ADJ","곱 차이 + energy"],["A_DEF","T_ADJ","$e$ 를 평균"],["T_G","T_L2","$\\mathbb E(R_S-G)^2\\le p_N^2$","key"],["T_SET","T_L2","$M$ 의 정의"],["B_PB","T_FIB","$p_N=\\sum_j v_N^{1/4}$"],["P_FB","T_FIB","$\\gamma=1/2,\\ D=b(S)$","key"],["P_V","T_FIB","$V_{k-1,L}(\\eta/2)$"],["T_VM","T_VAR","$\\mathrm{Var}(M)$ 항","key"],["T_L2","T_VAR","$\\mathbb E(R_S-M)^2$ 항","key"],["T_ADJ","T_VAR","$C_k/L$","key"],["T_FIB","T_VAR","$V_{k-1}^{1/2}$","key"],["A_ERR","T_VAR","고정 $L$: 유한 합"],["T_VAR","THM","$L^{-1}\\to0$","key"],["PROP","THM","$V_{k-1,L}(\\eta/2)\\to0$","key"],["T_S","THM","singleton","key"],["REM","THM","","note"],["THM","OUT",""]],"positions":{"X_MO":[2,0],"X_SAMP":[2,0],"X_TI":[2,0],"X_EXT":[2,0],"X_RT":[2,0],"X_CH":[2,0],"A_DEF":[0,1],"A_ERR":[0,1],"A_HOL":[0,2],"A_CMP":[0,2],"B_DEF":[1,1],"B_CON":[1,2],"B_ME":[1,2],"B_PB":[1,3],"B_DC":[1,3],"P_V":[0,4],"P_1":[0,4],"P_IND":[0,5],"P_FB":[0,5],"P_REC":[0,6],"PROP":[0,7],"T_SET":[1,4],"T_S":[1,4],"T_C":[1,5],"T_G":[1,5],"T_SIDES":[1,6],"T_ADJ":[1,6],"T_L2":[1,6],"T_VM":[1,7],"T_FIB":[1,7],"T_VAR":[1,8],"REM":[1,8],"THM":[1,9],"OUT":[1,10]},"subgraphs":{}};
const {groups:GROUPS,nodes:N,edges:E,positions:POS,subgraphs:SUBGRAPHS}=GRAPH;
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const world=document.getElementById('world'), vp=document.getElementById('viewport'), svg=document.getElementById('edges'), panel=document.getElementById('panel');
const nodeEl={}, labelEl=[], pathEl=[];

function build(){
  for(const n of N){
    const d=document.createElement('div');
    d.className='node '+(n.cls||'')+(n.supplement?' supplement':'');
    d.dataset.id=n.id;
    d.innerHTML=`<div class="tag"><span>${n.tag}</span><span>${n.id}</span></div><div class="t">${n.t}</div><div class="f">${n.f}</div>`;
    world.appendChild(d); nodeEl[n.id]=d;
  }
  E.forEach((e,i)=>{
    const l=document.createElement('div');
    l.className='elabel '+(e[3]||'');
    l.innerHTML=e[2]||'';
    if(!e[2]) l.style.display='none';
    world.appendChild(l); labelEl[i]=l;
  });
}

// 배치: 왼쪽에서 오른쪽으로. 위 띠 = §7.1, §7.3 / 아래 띠 = §7.2, §7.4. 0열은 밖에서 받는 것.
const COLGAP=170, ROWGAP=26, BANDGAP=90, M=60;
function layout(){
  const NC=11, cell={};
  for(const n of N){const [b,c]=POS[n.id];(cell[b+','+c]=cell[b+','+c]||[]).push(n.id)}
  const colW=Array(NC).fill(0), bandH=[0,0], cellH={};
  for(const k in cell){
    const [b,c]=k.split(',').map(Number);
    let h=0; for(const id of cell[k]){colW[c]=Math.max(colW[c],nodeEl[id].offsetWidth);h+=nodeEl[id].offsetHeight+ROWGAP}
    h-=ROWGAP; cellH[k]=h; if(b<2) bandH[b]=Math.max(bandH[b],h);
  }
  const colX=[]; let x=M; for(let c=0;c<NC;c++){colX[c]=x;x+=colW[c]+COLGAP}
  const W=x-COLGAP+M;
  const bandY=[M+30,M+30+bandH[0]+BANDGAP];
  const H=bandY[1]+bandH[1]+M;
  const pos={};
  for(const k in cell){
    const [b,c]=k.split(',').map(Number);
    let y = b===2 ? (H-cellH[k])/2 : bandY[b]+(bandH[b]-cellH[k])/2;
    for(const id of cell[k]){
      const el=nodeEl[id],w=el.offsetWidth,h=el.offsetHeight;
      const px=colX[c]+(colW[c]-w)/2;
      el.style.left=px+'px'; el.style.top=y+'px';
      pos[id]={x:px,y,w,h}; y+=h+ROWGAP;
    }
  }
  for(const k in GROUPS){
    const ids=N.filter(n=>n.g===k).map(n=>n.id); if(!ids.length) continue;
    const pad=18;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const id of ids){const p=pos[id];x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h)}
    const c={x:x0-pad,y:y0-pad-8,w:x1-x0+2*pad,h:y1-y0+2*pad+8};
    const box=document.createElement('div');
    box.className='cluster';
    Object.assign(box.style,{left:c.x+'px',top:c.y+'px',width:c.w+'px',height:c.h+'px',background:`var(${GROUPS[k].fill})`,borderColor:`var(${GROUPS[k].b})`});
    if(k==='ext'){box.style.background='transparent';box.style.borderStyle='dashed'}
    box.innerHTML=`<span class="cl">${GROUPS[k].label}</span>`;
    world.insertBefore(box,svg);
    clusters[k]=c;
  }
  // 같은 node에서 나가거나 들어오는 선의 끝점을 위아래로 나눠 겹치지 않게 한다
  const outs={},ins={};
  E.forEach((e,i)=>{(outs[e[0]]=outs[e[0]]||[]).push(i);(ins[e[1]]=ins[e[1]]||[]).push(i)});
  const cy=id=>pos[id].y+pos[id].h/2;
  for(const id in outs) outs[id].sort((a,b)=>cy(E[a][1])-cy(E[b][1]));
  for(const id in ins) ins[id].sort((a,b)=>cy(E[a][0])-cy(E[b][0]));
  const port=(id,list,i)=>{const p=pos[id],n=list.length,j=list.indexOf(i);return p.y+p.h*(n===1?0.5:0.2+0.6*j/(n-1))};
  E.forEach((e,i)=>{
    const a=pos[e[0]],b=pos[e[1]];
    const x1=a.x+a.w, y1=port(e[0],outs[e[0]],i), x2=b.x-4, y2=port(e[1],ins[e[1]],i);
    const dx=Math.max(50,(x2-x1)*0.5);
    const d=`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);
    p.setAttribute('class','e '+(e[3]||''));
    p.setAttribute('marker-end',e[3]==='key'?'url(#ark)':'url(#ar)');
    svg.appendChild(p); pathEl[i]=p;
    const l=labelEl[i];
    if(e[2]){
      // 받는 node 바로 앞의 빈 열 가운데에 둔다 (긴 선도 다른 node 위에 놓이지 않게)
      const L=p.getTotalLength(), tx=x2-COLGAP/2;
      let lo=0,hi=L; for(let it=0;it<24;it++){const m=(lo+hi)/2; if(p.getPointAtLength(m).x<tx) lo=m; else hi=m}
      const pt=p.getPointAtLength(lo);
      l.style.left=(pt.x-l.offsetWidth/2)+'px'; l.style.top=(pt.y-l.offsetHeight/2)+'px';
      if(e[3]!=='key') l.classList.add('minor');
    }
  });
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  world.style.width=W+'px';world.style.height=H+'px';
  bounds={w:W,h:H};
}
const clusters={}; let bounds={w:1000,h:1000};

// ---------- pan / zoom
const view={x:0,y:0,k:1};
const KMIN=0.12,KMAX=4;
function apply(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const s=28*view.k;
  vp.style.backgroundSize=`${s}px ${s}px`;
  vp.style.backgroundPosition=`${view.x}px ${view.y}px`;
  document.getElementById('zoomlvl').textContent=Math.round(view.k*100)+'%';
}
function zoomAt(cx,cy,f){
  const k=Math.min(KMAX,Math.max(KMIN,view.k*f));
  const r=k/view.k;
  view.x=cx-(cx-view.x)*r; view.y=cy-(cy-view.y)*r; view.k=k; apply();
}
let anim=null;
function animateTo(t){
  cancelAnimationFrame(anim);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){Object.assign(view,t);apply();return}
  const s={...view},t0=performance.now(),dur=380;
  const step=now=>{
    const u=Math.min(1,(now-t0)/dur),q=1-Math.pow(1-u,3);
    view.x=s.x+(t.x-s.x)*q;view.y=s.y+(t.y-s.y)*q;view.k=s.k+(t.k-s.k)*q;apply();
    if(u<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function fitRect(x,y,w,h,maxK=1.6){
  const W=vp.clientWidth,H=vp.clientHeight,m=24;
  const k=Math.min(maxK,Math.max(KMIN,Math.min((W-2*m)/w,(H-2*m)/h)));
  return {k,x:(W-w*k)/2-x*k,y:(H-h*k)/2-y*k};
}
const fitAll=()=>animateTo(fitRect(0,0,bounds.w,bounds.h));
const focusProof=()=>{const c=clusters.s74; if(c) animateTo(fitRect(c.x,c.y-20,c.w,c.h+20,1.2))};

vp.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=vp.getBoundingClientRect();
  const dy=ev.deltaMode===1?ev.deltaY*16:ev.deltaY;
  if(ev.shiftKey){view.x-=ev.deltaX||dy;view.y-=ev.deltaX?dy:0;apply()}
  else zoomAt(ev.clientX-r.left,ev.clientY-r.top,Math.exp(-Math.max(-60,Math.min(60,dy))*(ev.ctrlKey?0.01:0.0025)));
},{passive:false});

const ptrs=new Map(); let moved=0, pinch=null, downNode=null;
vp.addEventListener('pointerdown',ev=>{
  cancelAnimationFrame(anim);
  vp.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  moved=0;
  const n=ev.target.closest('.node'); downNode=n?n.dataset.id:null;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};
  }
  vp.classList.add('dragging');
});
vp.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)) return;
  const prev=ptrs.get(ev.pointerId), cur={x:ev.clientX,y:ev.clientY};
  ptrs.set(ev.pointerId,cur);
  if(ptrs.size===1){
    view.x+=cur.x-prev.x; view.y+=cur.y-prev.y; moved+=Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y); apply();
  }else if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const r=vp.getBoundingClientRect();
    const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
    zoomAt(cx,cy,(pinch.k*d/pinch.d)/view.k);
    // 두 손가락 중심 이동도 따라간다
    const pc={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(pinch.c){view.x+=pc.x-pinch.c.x;view.y+=pc.y-pinch.c.y;apply()}
    pinch.c=pc; moved+=99;
  }
});
let lastTap={id:null,t:0};
function up(ev){
  if(!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){
    vp.classList.remove('dragging');
    if(moved<6){
      if(downNode){
        const now=performance.now();
        if(lastTap.id===downNode&&now-lastTap.t<350) zoomToNode(downNode);
        lastTap={id:downNode,t:now};
        select(downNode);
      }else if(ev.type==='pointerup') select(null);
    }
  }
}
vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',up);

function zoomToNode(id){
  const el=nodeEl[id];
  const x=parseFloat(el.style.left),y=parseFloat(el.style.top);
  animateTo(fitRect(x-60,y-60,el.offsetWidth+120,el.offsetHeight+120,2.2));
}
const center=()=>({x:vp.clientWidth/2,y:vp.clientHeight/2});
document.getElementById('zin').onclick=()=>{const c=center();zoomAt(c.x,c.y,1.3)};
document.getElementById('zout').onclick=()=>{const c=center();zoomAt(c.x,c.y,1/1.3)};
document.getElementById('fit').onclick=fitAll;
document.getElementById('focus').onclick=focusProof;
document.getElementById('clear').onclick=()=>select(null);
vp.addEventListener('keydown',ev=>{
  const c=center();
  if(ev.key==='+'||ev.key==='=') zoomAt(c.x,c.y,1.25);
  else if(ev.key==='-') zoomAt(c.x,c.y,0.8);
  else if(ev.key==='0') fitAll();
  else if(ev.key.startsWith('Arrow')){const s=60;if(ev.key==='ArrowLeft')view.x+=s;if(ev.key==='ArrowRight')view.x-=s;if(ev.key==='ArrowUp')view.y+=s;if(ev.key==='ArrowDown')view.y-=s;apply()}
  else if(ev.key==='Escape') select(null);
  else return;
  ev.preventDefault();
});

// ---------- 선택과 조상 강조
function ancestors(id){
  const seen=new Set([id]),st=[id];
  while(st.length){const v=st.pop();for(const e of E) if(e[1]===v&&!seen.has(e[0])){seen.add(e[0]);st.push(e[0])}}
  return seen;
}
let selected=null;
function select(id){
  selected=id;
  document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'));
  if(!id){world.classList.remove('dim');renderPanel(null);return}
  const A=ancestors(id);
  world.classList.add('dim');
  A.forEach(a=>nodeEl[a].classList.add('lit'));
  E.forEach((e,i)=>{if(A.has(e[0])&&A.has(e[1])){pathEl[i].classList.add('lit');labelEl[i].classList.add('lit')}});
  nodeEl[id].classList.add('sel');
  renderPanel(id,A.size-1);
}
function edgeItem(e,other,dir){
  const n=byId[other];
  return `<li><button type="button" data-go="${other}">${dir} ${n.t}<small>${e[2]?e[2]:'&nbsp;'}</small></button></li>`;
}
function renderPanel(id,nAnc){
  if(!id){
    panel.innerHTML=R`<div class="ptag">읽는 법</div><h2>정리까지의 유도 지도</h2>
    <p>오른쪽 끝의 굵은 테두리 node가 정리다. 청록 선은 정리 증명(§7.4)의 주된 사슬, 회색 선은 정의나 보조 결과를 넘기는 선이다. 선 위의 글은 그 선이 싣는 내용이다.</p>
    <div class="legend"><span><i class="k"></i>정리 증명의 사슬</span><span><i></i>입력</span><span><i class="n"></i>주석</span><span><b></b>밖에서 받는 결과</span></div>
    <h3>증명의 두 부분</h3>
    <p>(1) Proposition: 표본 prefix 아래의 무작위성을 조건부 공분산 $v_N$ 으로 누른다. 잎 수에 대한 귀납이고, 갈라짐을 한 칸 늦추어 부호 있는 계수를 다룬다.</p>
    <p>(2) 정리: marker anchor로 남은 조건부 평균 $M$ 을 고정 깊이에서 집중시키고, 둘을 깊이 평균으로 묶는다.</p>
    <h3>극한 순서</h3><p>고정 $L$ 에서 $N\to\infty$ 를 먼저 보내고, 그다음 깊이 평균과 $L\to\infty$.</p>
    <p class="src">node를 누르면 그 결과에 쓰인 것만 밝아지고 여기에 진술과 원문 줄이 나온다. 두 번 누르면 확대한다.</p>`;
  }else{
    const n=byId[id];
    const ins=E.filter(e=>e[1]===id), outs=E.filter(e=>e[0]===id);
    panel.innerHTML=`<div class="ptag">${n.tag} · ${n.g?GROUPS[n.g].label:'§8'}</div>
      <div><span class="node-id">${n.id}</span> <button type="button" id="copy-ref">참조 복사</button>${n.supplement?'<span class="supplement-badge"> · 원문 밖 보충</span>':''}</div><h2>${n.t}</h2>
      <div class="stmt">${n.f}</div>${n.body||''}
      <div class="src">원문: ${n.src}</div>
      ${SUBGRAPHS[id]?'<h3>하위 유도</h3><div class="subgraph"><div class="subgraph-grid"></div><div class="subgraph-detail"></div></div>':''}
      ${ins.length?`<h3>받는 것 ${ins.length}</h3><ul>${ins.map(e=>edgeItem(e,e[0],'←')).join('')}</ul>`:''}
      ${outs.length?`<h3>보내는 것 ${outs.length}</h3><ul>${outs.map(e=>edgeItem(e,e[1],'→')).join('')}</ul>`:''}
      <p class="src" style="margin-top:14px">이 결과에 쓰인 앞선 node: ${nAnc}개</p>`;
  }
  const copy=panel.querySelector('#copy-ref');
  if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(id);copy.textContent='복사됨'}catch{copy.textContent='복사 실패: '+id}};
  if(id&&SUBGRAPHS[id])renderSubgraph(SUBGRAPHS[id]);
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=b.dataset.go;select(t);zoomToNode(t)});
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([panel]).catch(()=>{});
}
function renderSubgraph(g){
  const box=panel.querySelector('.subgraph'), grid=box.querySelector('.subgraph-grid');
  const cols=new Map();for(const n of g.nodes){const c=n.col||0;if(!cols.has(c))cols.set(c,[]);cols.get(c).push(n)}
  for(const c of [...cols.keys()].sort((a,b)=>a-b)){
    const col=document.createElement('div');col.className='subgraph-col';
    for(const n of cols.get(c)){
      const b=document.createElement('button');b.type='button';b.className='subgraph-node'+(n.supplement?' supplement':'');
      b.dataset.sub=n.id;b.textContent=n.id+' · '+n.t;
      b.onclick=()=>{box.querySelector('.subgraph-detail').innerHTML=`<strong>${n.id}</strong><div class="stmt">${n.f}</div>${n.body||''}<div class="src">원문: ${n.src}</div>`;
        if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([box.querySelector('.subgraph-detail')]).catch(()=>{})};
      col.appendChild(b);
    }grid.appendChild(col);
  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');grid.prepend(svg);
  requestAnimationFrame(()=>{
    svg.setAttribute('width',grid.scrollWidth);svg.setAttribute('height',grid.scrollHeight);
    for(const [a,b] of g.edges){const x=grid.querySelector(`[data-sub="${a}"]`),y=grid.querySelector(`[data-sub="${b}"]`);
      if(!x||!y)continue;const l=document.createElementNS('http://www.w3.org/2000/svg','path');
      const x1=x.offsetLeft+x.offsetWidth,y1=x.offsetTop+x.offsetHeight/2,x2=y.offsetLeft,y2=y.offsetTop+y.offsetHeight/2;
      l.setAttribute('d',`M${x1},${y1} L${x2},${y2}`);l.setAttribute('stroke','var(--accent)');l.setAttribute('fill','none');svg.appendChild(l)}
  });
}

// ---------- 시작
let started=false;
function start(){
  if(started) return; started=true;
  try{layout()}catch(err){document.getElementById('loading').textContent='배치를 만들지 못했다: '+err.message;return}
  document.getElementById('loading').hidden=true;
  renderPanel(null);
  requestAnimationFrame(()=>{Object.assign(view,fitRect(0,0,bounds.w,bounds.h)); apply()});
}
build();
const ready=(window.MathJax&&MathJax.startup&&MathJax.startup.promise)?MathJax.startup.promise.then(()=>MathJax.typesetPromise([world])):Promise.resolve();
const fontsReady=document.fonts?document.fonts.ready:Promise.resolve();
Promise.race([Promise.all([ready,fontsReady]),new Promise(r=>setTimeout(r,9000))]).then(start,start);
</script>
