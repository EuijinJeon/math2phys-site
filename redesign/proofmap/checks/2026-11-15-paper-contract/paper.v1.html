of $b$ zero;", "31": "the even moments are nonnegative. Finally,", "32": "$B(\\theta_\\beta)=\\beta|J|$ and $|h_\\beta|=\\beta|H|$.", "33": "Thus all hypotheses of \\cref{main:theorem} hold.", "34": "\\end{proof}", "35": "", "36": "\\begin{corollary}[Soft random even-$K$ SAT]", "37": "\\label[corollary]{models:sat}", "38": "Fix an even integer $K\\ge2$ and $\\alpha>0$. Let", "39": "$\\varepsilon_1,\\ldots,\\varepsilon_K$ be independent fair signs and let", "40": "$W\\ge0$ be independent of the signs, with $\\E W<\\infty$. For every", "41": "$\\beta>0$, the interaction", "42": "\\[", "43": " \\theta_\\beta(s_1,\\ldots,s_K)", "44": " =-\\beta W\\prod_{\\ell=1}^K\\frac{1+\\varepsilon_\\ell s_\\ell}{2},", "45": " \\qquad h=0,", "46": "\\]", "47": "satisfies \\eqref{main:formula}. The choice $W=1$ is the soft random", "48": "even-$K$ SAT model; $W$ gives an independent nonnegative clause weight.", "49": "\\end{corollary}", "50": "", "51": "\\begin{proof}", "52": "The product", "53": "$I_\\varepsilon(s)=\\prod_\\ell(1+\\varepsilon_\\ell s_\\ell)/2$ takes", "54": "values in $\\{0,1\\}$ and indicates a violated clause. Therefore", "55": "\\[", "56": " e^{\\theta_\\beta(s)}", "57": " =1+(e^{-\\beta W}-1)I_\\varepsilon(s).", "58": "\\]", "59": "Take $a=1$, $b=e^{-\\beta W}-1$, and", "60": "$f_\\ell(s)=(1+\\varepsilon_\\ell s)/2$. The functions are independent", "61": "copies and independent of $b$. Since $0\\le-b<1$, the strict product", "62": "condition and every positivity inequality hold. Moreover,", "63": "$B(\\theta_\\beta)=\\beta W$, so \\cref{main:theorem} applies.", "64": "\\end{proof}", "65": "", "66": "For the spin model, define the unscaled energy score by", "67": "\\[", "68": " \\mathcal E_N(\\sigma)", "69": " =\\sum_{k=1}^{M_N}J_k\\prod_{\\ell=1}^p\\sigma_{i_{\\ell,k}}", "70": "   +\\sum_{i=1}^N H_i\\sigma_i.", "71": "\\]", "72": "For the satisfiability model, put", "73": "\\[", "74": " \\mathcal E_N(\\sigma)", "75": " =-\\sum_{k=1}^{M_N}W_k", "76": "      \\prod_{\\ell=1}^K\\frac{1+\\varepsilon_{\\ell,k}", "77": "       \\sigma_{i_{\\ell,k}}}{2}.", "78": "\\]", "79": "These scores and their disorder laws do not depend on $\\beta$; in", "80": "both cases the partition function is", "81": "$Z_N(\\beta)=\\sum_\\sigma e^{\\beta\\mathcal E_N(\\sigma)}$.", "82": "Let $\\cB_{r,\\beta}$ denote the functional", "83": "\\eqref{model:functional} for the corresponding laws at inverse", "84": "temperature $\\beta$.", "85": "", "86": "\\begin{corollary}[Zero-temperature variational limit]", "87": "\\label{models:ground}", "88": "For each model in \\cref{models:spin,models:sat}, the limit", "89": "\\[", "90": " g=\\lim_{N\\to\\infty}\\frac1N\\E\\max_\\sigma\\mathcal E_N(\\sigma)", "91": "\\]", "92": "exists and satisfies", "93": "\\begin{equation}\\label{models:ground-formula}", "94": " g=\\lim_{\\beta\\to\\infty}\\frac1\\beta", "95": "       \\inf_{r\\ge0}\\inf_{\\zeta,\\mathbf m}", "96": "          \\cB_{r,\\beta}(\\zeta,\\mathbf m).", "97": "\\end{equation}", "98": "More precisely, the expression inside the temperature limit lies in", "99": "$[g,g+\\log(2)/\\beta]$. For unit-weight SAT, the limiting expected", "100": "minimum number of violated clauses per variable is $-g$.", "101": "\\end{corollary}", "102": "", "103": "\\begin{proof}", "104": "Write $g_N=N^{-1}\\E\\max_\\sigma\\mathcal E_N(\\sigma)$ and", "105": "$P_N(\\beta)=N^{-1}\\E\\log Z_N(\\beta)$. The first-moment assumptions", "106": "make $g_N$ finite and uniformly bounded. Since there are $2^N$ spin", "107": "configurations,", "108": "\\[", "109": " g_N\\le\\frac{P_N(\\beta)}\\beta", "110": "       \\le g_N+\\frac{\\log2}{\\beta}.", "111": "\\]", "112": "For each fixed $\\beta>0$, \\cref{main:theorem} gives", "113": "$P_N(\\beta)\\to I(\\beta)$, where", "114": "$I(\\beta)=\\inf_{r,\\zeta,\\mathbf m}\\cB_{r,\\beta}(\\zeta,\\mathbf m)$.", "115": "Hence", "116": "\\[", "117": " \\limsup_N g_N\\le\\frac{I(\\beta)}\\beta", "118": "   \\le\\liminf_N g_N+\\frac{\\log2}{\\beta}.", "119": "\\]", "120": "Letting $\\beta\\to\\infty$ proves that $g_N$ converges to a limit $g$.", "121": "Taking $N\\to\\infty$ in the finite-volume bounds now gives", "122": "$g\\le I(\\beta)/\\beta\\le g+\\log(2)/\\beta$, proving", "123": "\\eqref{models:ground-formula}. In the satisfiability model, maximizing", "124": "the negative violation count is the same as minimizing that count.", "125": "\\end{proof}", "126": "", "127": "The infimum in \\eqref{models:ground-formula} is taken over all finite", "128": "hierarchies separately at each positive temperature. The formula", "129": "does not require attainment or a limiting hierarchy.", "130": "", "131": "\\begin{remark}", "132": "The even-arity hypothesis in \\cref{models:sat} excludes random 3-SAT.", "133": "For that model, the companion~\\cite[Theorem~8.4]{OpenAIThreeSAT2026}", "134": "gives an exact soft-pressure formula over finite rational trials for a", "135": "Poisson number of clauses whose variable positions are sampled independently", "136": "with replacement. Its sign-indexed message pairs need not form a probability", "137": "distribution, and its trial functional differs from \\eqref{model:functional}.", "138": "\\end{remark}"}};
const CARDTEXT = {"cavity:factor-bounds": {"title": "Poisson 섭동 factor 족과 한계 $1/2\\le\\psi_\\nu\\le3/2$ (5.2)", "math": "$(c_\\nu)_{\\nu\\ge1}$ 을 $\\sum_\\nu c_\\nu=1$ 인 양수열로, $s_N=N^{3/4}$ 로 둔다. spin weight에 단일 site factor $\\psi_\\nu$ 의 독립 Poisson 족을 더한다. 개수의 평균은 $c_\\nu s_N$ 이고 site는 $[N]$ 의 독립 균일 site다. 각 factor는 자기 보조 변수를 쓰며, 그 변수는 계층을 따라 곱 prior로 뽑힌다. 각 factor는\n$$1/2\\le\\psi_\\nu\\le3/2\\tag{5.2}$$\n를 만족한다."}, "cavity:grid": {"title": "깊이 $L\\ge2$, $r=L-1$, 균등 격자 $m_d=d/L$ (5.1)", "math": "$L\\ge2$ 를 고정하고 $r=L-1$ 개의 보조 단계를\n$$m_d=d/L\\quad(0\\le d\\le L),\\qquad\\delta=1/L\\tag{5.1}$$\n로 쓴다."}, "cavity:increment": {"title": "Cavity increments (cavity 증분)", "math": "증분 $\\Delta_N^{L,\\mathbf u}=P_{N+1}^{L,\\mathbf u}-P_N^{L,\\mathbf u}$ 는 $N,L,\\mathbf u$ 에 대해 균일하게 유계다. 물리 상호작용 개수의 평균이\n$$\\rho_N=\\alpha(N+1)\\Bigl(\\frac N{N+1}\\Bigr)^p\\tag{5.4}$$\n이고 보통의 장과 평균 $c_\\nu s_N$ 의 섭동 개수를 갖는 $N$ spin 위의 reservoir가 있어\n$$\\Delta_N^{L,\\mathbf u}=\\log2+\\mathbb E\\log Y_{0,\\rm s}-\\mathbb E\\log Y_{0,\\rm b}+o_N(1)\\tag{5.5}$$\n이다. 오차는 $L,\\mathbf u$ 에 균일하다. insertion recursion은 tilted reservoir kernel과 독립인 새 root disorder를 쓰며, terminal insertion은\n$$A_{\\rm s}(\\sigma)=\\frac12\\sum_{\\varepsilon=\\pm1}\\exp\\Bigl(h\\varepsilon+\\sum_{j=1}^{K_{\\rm s}}\\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p-1,j}},\\varepsilon)\\Bigr),\\tag{5.6}$$\n$$A_{\\rm b}(\\sigma)=\\exp\\Bigl(\\sum_{j=1}^{K_{\\rm b}}\\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p,j}})\\Bigr)\\tag{5.7}$$\n이다. 여기서 $K_{\\rm s}\\sim\\mathrm{Pois}(\\alpha p)$, $K_{\\rm b}\\sim\\mathrm{Pois}(\\alpha(p-1))$ 이고 표시된 index는 모두 $[N]$ 의 독립 균일 index다."}, "cavity:increment.s1": {"title": "물리 상호작용의 Poisson 분해", "math": "$(N+1)$-spin 계의 Poisson 상호작용 과정을 $N+1$ 과 같은 index의 개수로 쪼갠다. 새 index가 없는 항의 평균은 $\\rho_N$ 이다. 새 index가 정확히 하나인 항의 평균은 $\\alpha p(N/(N+1))^{p-1}=\\alpha p+O(N^{-1})$ 이고, 순열 불변성으로 새 입력을 마지막에 둘 수 있다. 그 항의 다른 index는 $[N]$ 의 독립 균일 index이고 상호작용 함수는 주어진 법칙을 유지한다. 새 index가 둘 이상인 항의 평균 합은 $O(N^{-1})$ 이다. 한편 $N$-spin 계는 같은 reservoir에 평균\n$$\\alpha N-\\rho_N=\\alpha(p-1)+O(N^{-1})$$\n의 Poisson 개수의 옛 상호작용을 더해 얻는다. 이 양들은 충분히 큰 모든 $N$ 에서 음이 아니다."}, "cavity:increment.s2": {"title": "섭동 개수의 맞춤과 항별 비용", "math": "$(N+1)$-spin 계에서 옛 site의 섭동 개수는 평균 $s_{N+1}N/(N+1)$, 새 site의 개수는 평균 $s_{N+1}/(N+1)$ 이다. 공통 Poisson 점을 써서 이 과정들을 reservoir 섭동에 맞춘다. 맞춰지지 않는 factor 수의 기대값은\n$$\\lvert s_{N+1}-s_N\\rvert+2s_{N+1}/(N+1)=O(N^{-1/4})$$\n이하다. 섭동 하나를 지우거나 더하면 root logarithm이 많아야 $\\log2$ 바뀌고, 상호작용 하나는 많아야 $B$ 바꾼다. 쓰이지 않는 보조 변수는 그 prior로 적분해 없애면 되므로, 보조 변수의 수가 바뀌어도 이 비교들은 유효하다."}, "cavity:increment.s3": {"title": "증분 항등식 (5.5)", "math": "따라서 새 index가 반복된 상호작용을 버리고, 섭동을 맞추고, 두 삽입 개수의 평균을 극한값으로 바꾸는 데 드는 기대 비용은 모두 합해 $O(N^{-1/4})$ 이다. 새 spin에 대해 합하면 $2A_{\\rm s}$ 가 나오고, 옛 계의 보정은 $A_{\\rm b}$ 를 준다. 인수 $2$ 가 증분의 $\\log2$ 항을 준다. 이제 power mean의 insertion 항등식이 (5.5)를 증명한다."}, "cavity:increment.s4": {"title": "$\\lvert\\log Y_0\\rvert$ 상계와 증분의 균일 유계성", "math": "끝으로\n$$\\lvert\\log Y_{0,\\rm s}\\rvert\\le H+BK_{\\rm s},\\qquad\\lvert\\log Y_{0,\\rm b}\\rvert\\le BK_{\\rm b}.$$\ncoupling 추정과 함께 이것이 큰 $N$ 에서 증분을 누르고, 상수를 키우면 나머지 크기도 덮는다. 모든 추정은 $L$ 과 $\\mathbf u$ 에 균일하다."}, "cavity:negligible": {"title": "섭동의 비용 $\\lvert P_N^{L,\\mathbf u}-NF_N\\rvert\\le(\\log2)s_N$ (5.3)", "math": "섭동되지 않은 spin weight와 점별로 비교한 뒤 recursion을 적용하면\n$$\\lvert P_N^{L,\\mathbf u}-NF_N\\rvert\\le(\\log2)s_N\\tag{5.3}$$\n이고, 이것은 계층, 그 매개변수, $N$ 에 대해 균일하다."}, "comp:bounded-lower": {"title": "bounded 법칙의 하한: $\\liminf_NF_N\\ge\\inf_{r\\ge0}\\Phi_r$", "math": "모든 bounded이고 순열 불변인 상호작용 법칙과 bounded 장 법칙에 대해, (2.11)과 그 $r=0$ 판으로 정의한 functional로\n$$\\liminf_{N\\to\\infty}F_N\\ge\\inf_{r\\ge0}\\Phi_r.$$"}, "comp:bounded-lower.s1": {"title": "고정 $L$ 의 부등식 $A\\le\\underline F+2\\varepsilon+\\limsup_N\\lvert\\Delta_N-\\mathcal B_{L-1}\\rvert$", "math": "$A=\\inf_{r\\ge0}\\Phi_r$ 로 쓴다. (2.12)에 의해 유한하다. 부호화된 각 시행값은 $A$ 이상이므로, (8.1)이 모든 고정 $L$ 에서\n$$A\\le\\underline F+2\\varepsilon+\\limsup_{N\\to\\infty}\\Bigl\\lvert\\Delta_N^{L,\\mathbf u_{L,N}}-\\mathcal B_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)})\\Bigr\\rvert$$\n를 준다. 안쪽 극한은 그 깊이의 선택된 수열을 쓴다."}, "comp:bounded-lower.s2": {"title": "$L\\to\\infty$, 그다음 $\\varepsilon\\downarrow0$", "math": "안쪽 극한은 그 깊이의 선택된 수열을 쓴다. comp:insertion-comparison에서 $L\\to\\infty$ 로 보내면 $A\\le\\underline F+2\\varepsilon$ 이고, 그다음 $\\varepsilon\\downarrow0$ 이 결론을 증명한다."}, "comp:encoding": {"title": "Recursive law encoding (재귀적 법칙 부호화)", "math": "고정한 각 $N$, $L\\ge2$, 선택된 매개변수 벡터에 대해, reservoir root disorder를 평균하면 결정적 시행 법칙 $\\zeta_{L,N}\\in\\mathcal M_L$ 이 있어, 그 label 하나의 spin 과정이 모든 prescribed tree 위에서 reservoir의 균일하게 고른 site와 같은 기대 spin 곱을 갖는다. 서로 다른 trial label은 독립으로 고를 수 있다."}, "comp:encoding.s1": {"title": "균일 site를 root에 넣고 깊이 $r$ 의 field $x=\\operatorname{arctanh}\\langle\\sigma_i\\rangle$", "math": "독립 균일 site $i\\in[N]$ 를 reservoir root disorder와 함께 root 변수에 넣는다. tilted reservoir 보조 kernel로 각 path를 뽑고, $\\mathscr G_d$ 를 이 넓힌 root와 깊이 $d$ 까지의 보조 prefix 전체가 생성하는 $\\sigma$-field라 하자. 깊이 $r=L-1$ 에서\n$$x=\\operatorname{arctanh}\\langle\\sigma_i\\rangle$$\n로 둔다. 괄호는 leaf Gibbs 기대값이다. 유한 $N$ 에서 모든 배치의 무게가 엄격히 양이므로 $-1<\\langle\\sigma_i\\rangle<1$ 이고 $x$ 는 유한하다. 따라서 $x$ 는 깊이 $L$ 의 terminal spin 전이 전에, 깊이 $r$ 에서 정해진다. 각 terminal replica leaf에서 법칙 $q_x$ 로 spin을 뽑는다. 보조 prefix가 주어지면 이 spin들은 독립이고, 독립인 terminal Gibbs replica들의 one-site 법칙과 정확히 같다."}, "comp:encoding.s2": {"title": "거꾸로 쌓은 측도 $\\eta_d$ 와 $\\zeta_{L,N}=\\operatorname{Law}(\\eta_0)\\in\\mathcal M_L$", "math": "무작위 측도를 거꾸로\n$$\\eta_{r-1}=\\operatorname{Law}(x\\mid\\mathscr G_{r-1}),\\qquad\\eta_d=\\operatorname{Law}(\\eta_{d+1}\\mid\\mathscr G_d)\\quad(0\\le d<r-1)$$\n로 정의한다. 그러면 $\\eta_d\\in\\mathcal M_{r-d}$ 이므로 $\\zeta_{L,N}=\\operatorname{Law}(\\eta_0)\\in\\mathcal M_L$ 이다. 모든 값 공간(변수들이 값을 갖는 공간; 원문 \"state spaces\")이 standard Borel이므로 이 조건부 확률 kernel들은 가측 판을 갖는다. 여기서 쓰는 보조 prior는 실현된 각 root에서 유한 mark 공간의 유한곱으로 잡을 수 있다. 따라서 같은 주장은 root 개수를 조건으로 건 유한합으로도 바로 나온다."}, "comp:encoding.s3": {"title": "branching pattern마다의 확인: backward recursion $G_T(\\eta_d)$", "math": "descendant tree $T$ 를 고정하고 각 terminal leaf에 spin $e_a$ 를 처방한다. 깊이 $r$ 에서 그 조건부 확률은 $G_T(x)=\\prod_aq_x(e_a)$ 이다. 깊이 $d<r$ 에서 $T_1,\\ldots,T_j$ 를 그 자식들에 뿌리를 둔 부분 tree라 하자. 자식들의 조건부 독립이 backward recursion\n$$G_T(\\eta_d)=\\prod_{\\ell=1}^j\\int G_{T_\\ell}(\\nu)\\,\\eta_d(d\\nu)$$\n를 준다. 귀납으로 이 확률은 prefix 전체에 $\\eta_d$ 를 통해서만 의존한다. 그러므로 거꾸로 쌓은 측도들은 unary 구간과 임의의 자식 수를 포함한 모든 descendant tree의 결합 출력 법칙을 보존한다. 이 recursion은 정확히 (2.7)의 branching 판이다."}, "comp:encoding.s4": {"title": "root 혼합의 보존, (comp:single-label-moments), label마다의 독립 사본", "math": "$\\zeta_{L,N}=\\operatorname{Law}(\\eta_0)$ 로 두면 root 혼합도 보존된다. 특히 leaf의 모든 부분집합 $S$ 에 대해\n$$\\mathbb E\\prod_{a\\in S}\\tau^a=\\frac1N\\sum_{i=1}^N\\mathbb E\\prod_{a\\in S}\\sigma_i^a=\\mathbb ER_S.\\tag{comp:single-label-moments}$$\n여기서 $\\tau^a$ 는 trial label 하나의 leaf $a$ spin이다(작성자; 원문은 $\\tau$ 를 정의하지 않고 17–24행 lemma의 \"single-label spin process\"에서 읽음). 서로 다른 label에는 reservoir root와 균일 site를 포함한 전체 구성의 독립 사본을 쓴다. 그렇게 얻은 message들은 cavity insertion의 새 물리 disorder와 독립이다."}, "comp:insertion-comparison": {"title": "삽입 logarithm의 비교: $\\Delta_N\\approx\\mathcal B_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)})$", "math": "comp:encoding의 시행 법칙과 $\\mathbf m^{(L)}=(1/L,\\ldots,(L-1)/L)$ 에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\Bigl\\lvert\\Delta_N^{L,\\mathbf u_{L,N}}-\\mathcal B_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)})\\Bigr\\rvert=0.\\tag{comp:increment-comparison}$$\n안쪽 극한은 각 $L$ 의 선택된 수열을 따른다(x:comp-standing)."}, "comp:insertion-comparison.s1": {"title": "trial 삽입과 정확한 trial 항등식", "math": "cavity:increment의 각 삽입에서 그 site label의 reservoir spin을 comp:encoding의 독립 spin 과정으로 바꾼다. 그렇게 얻은 trial 삽입을 $\\widetilde A_{\\rm s}$, $\\widetilde A_{\\rm b}$, (tree:Y-recursion)의 recursion을 $\\widetilde Y_{0,\\rm s}$, $\\widetilde Y_{0,\\rm b}$ 로 쓴다. 이 recursion은 trial kernel을 쓴다. 그러면 $\\widetilde Y_{0,\\rm s}=T_0V_{\\rm s}$ 이고\n$$\\mathbb E\\log\\widetilde Y_{0,\\rm b}=\\alpha(p-1)\\mathbb E\\log T_0V_{\\rm e},\\qquad\\log2+\\mathbb E\\log\\widetilde Y_{0,\\rm s}-\\mathbb E\\log\\widetilde Y_{0,\\rm b}=\\mathcal B_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)}).$$\n(5.5)에 의해 남은 일은 reservoir와 trial의 삽입 logarithm을 주어진 극한에서 비교하는 것이다."}, "comp:insertion-comparison.s1.s1": {"title": "reservoir spin을 trial spin 과정으로 바꾸기: $\\widetilde A$, $\\widetilde Y_0$", "math": "cavity:increment의 각 삽입($A_{\\rm s}$, $A_{\\rm b}$)에서 그 site label의 reservoir spin을 comp:encoding의 독립 spin 과정으로 바꾼다. 결과를 trial 삽입 $\\widetilde A_{\\rm s}$, $\\widetilde A_{\\rm b}$ 라 하고, (tree:Y-recursion)으로 계산한 그 recursion을 $\\widetilde Y_{0,\\rm s}$, $\\widetilde Y_{0,\\rm b}$ 라 한다. 이 recursion은 trial kernel을 쓴다."}, "comp:insertion-comparison.s1.s2": {"title": "site 쪽: $\\widetilde Y_{0,\\rm s}=T_0V_{\\rm s}$", "math": "terminal spin 전이에서 $\\widetilde A_{\\rm s}$ 를 그 독립 trial spin에 대해 평균하면 정확히 (2.8)의 $V_{\\rm s}$ 가 된다. 그러므로 $\\widetilde Y_{0,\\rm s}=T_0V_{\\rm s}$ 이다."}, "comp:insertion-comparison.s1.s3": {"title": "bond 쪽의 인수분해와 trial 증분 $=\\mathcal B_{L-1}$", "math": "$\\widetilde A_{\\rm b}$ 에서는 같은 전이가 서로 겹치지 않는 message label을 가진 $K_{\\rm b}$ 개 edge 인자의 곱을 준다. 한 깊이에서 물리 disorder와 모든 message prefix가 주어지면 이 label 묶음들은 독립으로 남는다. 그러므로 그 곱은 각 조건부 power mean을 마지막 단계부터 첫 단계까지 차례로 통과해 인수분해된다. 따라서\n$$\\mathbb E\\log\\widetilde Y_{0,\\rm b}=\\alpha(p-1)\\mathbb E\\log T_0V_{\\rm e},\\qquad\\log2+\\mathbb E\\log\\widetilde Y_{0,\\rm s}-\\mathbb E\\log\\widetilde Y_{0,\\rm b}=\\mathcal B_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)}).$$\n(5.5)에 의해 남은 일은 reservoir와 trial의 삽입 logarithm을 주어진 극한에서 비교하는 것이다."}, "comp:insertion-comparison.s2": {"title": "개수 절단 $K\\le M$ 과 정규화 $A=z(1+D)$, $\\lvert D\\rvert\\le c<1$", "math": "두 삽입 가운데 하나를 생각하고, 먼저 그 Poisson 개수 $K$ 를 고정한 $M$ 에 대해 $K\\le M$ 으로 제한한다. $C=H+BM$, $z=\\cosh C$, $c=\\tanh C<1$ 로 둔다. 이 사건 위에서 reservoir 삽입과 그 trial 판은 둘 다 모든 disorder와 path 변수에 균일하게\n$$A=z(1+D),\\qquad\\lvert D\\rvert\\le c$$\n로 쓸 수 있다. 결정적인 항 $\\log z$ 는 비교에서 지워진다."}, "comp:insertion-comparison.s3": {"title": "log 전개의 차수별 비교와 차수 절단", "math": "tree:log-expansion의 각 차수 $k$ 에서, $D$ 의 $k$ 사본의 곱은 많아야 $pM$ 개 label의 replica-spin pattern과 독립인 insertion disorder의 유계 함수다. comp:patterns에 의해 고정 tree 위에서 그 평가 오차는 $pM\\sum_{S\\ne\\varnothing}\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert$ 이하다. 그러므로 (comp:shape-error)가 tree 평균한 오차를 순서 있는 극한에서 0으로 보낸다. 모든 고정 $M$ 에 대해, 전개를 $q$ 항 뒤에서 자르면 양쪽 모두에서 오차가 $N,L$ 에 균일하게 많아야 $\\sum_{k>q}c^k/k$ 다."}, "comp:insertion-comparison.s4": {"title": "Poisson 꼬리와 극한의 조립", "math": "개수 절단 밖에서 원래의 삽입 logarithm은 양쪽 모두 $H+BK$ 로 유계다. 그 기대 기여는 많아야 $2\\mathbb E[(H+BK)\\mathbf1_{\\{K>M\\}}]$ 이고 $M\\to\\infty$ 에서 0으로 간다. 이것이 기대 삽입 logarithm의 수렴을 증명한다. 구체적으로, 먼저 Poisson 꼬리를 다루도록 $M$ 을 고르고, 그다음 기하 꼬리를 다루도록 $q$ 를 고르고, 그다음 남은 유한 개 전개 항에 대해 $N$ 과 $L$ 의 극한을 취한다. 위의 trial 항등식과 (5.5)와 합치면 (comp:increment-comparison)이 증명된다."}, "comp:low-increments": {"title": "선택된 수열 위의 낮은 증분 (8.1)", "math": "x:comp-standing의 선택에서, 각 $L\\ge2$ 와 그 수열 위의 모든 $N$ 에 대해(작성자: \"모든 $N$\"; 근거 perturbations.tex 299 \"Relabeling the tail proves (i)\")\n$$\\Delta_N^{L,\\mathbf u_{L,N}}\\le\\underline F+2\\varepsilon.\\tag{8.1}$$"}, "comp:patterns": {"title": "Empirical-pattern comparison (경험 pattern 비교)", "math": "leaf가 $k$ 개인 prescribed tree를 고정한다. 절댓값이 1 이하인 관측량이 $a$ 개의 독립 균일 site label에서의 replica-spin pattern을 쓴다고 하자. 이 pattern들을 comp:encoding의 독립 trial label pattern $a$ 개로 바꾸면 그 기대값은 많아야\n$$a\\sum_{\\varnothing\\ne S\\subseteq[k]}\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert\\tag{comp:pattern-error}$$\n만큼 바뀐다. 관측량은 reservoir와 독립인 새 insertion disorder에도 의존해도 된다."}, "comp:patterns.s1": {"title": "균일 site pattern의 경험분포 $\\pi$ 와 $\\bar\\pi=\\mathbb E\\pi$", "math": "표본으로 뽑은 reservoir 배치가 주어지면 균일 site의 pattern $\\boldsymbol\\sigma_i=(\\sigma_i^1,\\ldots,\\sigma_i^k)$ 의 경험분포는\n$$\\pi(\\boldsymbol e)=\\frac1N\\sum_i\\prod_{b=1}^k\\frac{1+e_b\\sigma_i^b}{2}=2^{-k}\\sum_{S\\subseteq[k]}R_S\\prod_{b\\in S}e_b,\\qquad\\boldsymbol e\\in\\{-1,1\\}^k$$\n이다. (comp:single-label-moments)에 의해 trial label의 분포는 $\\bar\\pi=\\mathbb E\\pi$ 다."}, "comp:shape-error": {"title": "tree 법칙 평균한 multioverlap 요동이 사라진다 (shape error)", "math": "$Q_k$ 를 tree:log-expansion의 tree 법칙($m_d=d/L$)이라 하자. 모든 고정 $k$ 에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathbb E_{Q_k}\\sum_{\\varnothing\\ne S\\subseteq[k]}\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert=0\\qquad(k\\text{ fixed}).\\tag{comp:shape-error}$$\n여기와 아래에서 안쪽 극한은 고정 $L$ 의 선택된 수열을 따른다. 안쪽 $\\mathbb E$ 는 $Q_k$ 로 뽑은 tree $\\mathcal T$ 를 고정한 채 root와 그 tree의 표본추출에 대한 기대값이다(작성자; 근거 trees.tex 48–49)."}, "comp:shape-error-bound": {"title": "shape error를 깊이 평균 분산으로 누르기 (comp:shape-error-bound)", "math": "$0<\\eta<1/2$ 를 고정하고 $\\mathfrak S_k$ 를 $[k]$ 의 공집합 아닌 부분집합 위의 labeled topology들의 유한 모임이라 하자. $C_k$ (작성자: $L$, $\\eta$, $N$ 에 무관; 근거 trees.tex 469–471과 원문의 상수 관례)가 있어\n$$\\mathbb E_{Q_k}\\sum_{\\varnothing\\ne S\\subseteq[k]}\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert\\le C_k\\Bigl(\\eta+L^{-1}+\\sum_{U\\in\\mathfrak S_k}\\bigl(\\mathcal A_{L,\\eta}\\operatorname{Var}(R_U)\\bigr)^{1/2}\\Bigr).\\tag{comp:shape-error-bound}$$\nsingleton $U$ 에 대한 평균은 깊이 좌표가 없다(작성자: 그래서 $\\mathcal A_{L,\\eta}z=z$; 근거 decor:average-definition의 정규화 $L^{-a'}$, $a'=0$)."}, "comp:shape-error-bound.s1": {"title": "regular가 아닌 tree의 기여", "math": "singleton에 대한 평균은 깊이 좌표가 없다. tree:regular-shapes에 의해 regular가 아닌 tree의 $Q_k$ 확률은 많아야 $C_k(\\eta+L^{-1})$ 이다. 그런 tree에서는 각 편차를 $\\mathbb E\\lvert R_S-\\mathbb ER_S\\rvert\\le2$ 로 누른다."}, "comp:shape-error-bound.s2": {"title": "regular tree: 유도된 부분 tree로 내려 깊이 평균 $\\mathcal A_{L,\\eta}$ 를 얻기", "math": "regular tree에서는 모든 유도된 부분 tree가 그 branching 깊이에 대한 내부 조건과 간격 조건을 유지한다. branching vertex가 $a$ 개인 topology에서 깊이 배정 하나의 확률은 $C_kL^{-a}$ 이하다. 유도된 부분 tree가 branching vertex $a'$ 개를 남기면, 그 깊이 배정 하나는 전체 tree로의 확장을 많아야 $L^{a-a'}$ 개 가진다. 쓰지 않는 좌표를 합해 없애면 $\\mathcal A_{L,\\eta}$ 의 정규화 $L^{-a'}$ 가 정확히 남는다."}, "comp:shape-error-bound.s3": {"title": "Cauchy–Schwarz와 유한 합으로 (comp:shape-error-bound)", "math": "Cauchy–Schwarz가 평균 절대 편차의 그 평균을 $\\bigl(\\mathcal A_{L,\\eta}\\operatorname{Var}(R_U)\\bigr)^{1/2}$ 로 누른다. 유한 개의 topology와 부분집합에 대해 더하고, regular가 아닌 tree에서는 각 편차를 2로 누르면 (comp:shape-error-bound)가 증명된다."}, "comp:shape-error.s2": {"title": "극한 순서: 고정 $\\eta$ 에서 $N$, 그다음 $L$, 마지막에 $\\eta\\downarrow0$", "math": "decor:overlap-concentration을 먼저 고정한 $\\eta$ 에서, 고정 $L$ 의 $N$ 극한을 $L\\to\\infty$ 보다 먼저 취해 적용하고, 그다음 $\\eta\\downarrow0$ 으로 보내 (comp:shape-error)를 얻는다."}, "decor:average-definition": {"title": "깊이 평균 $\\mathcal A_{L,\\eta}$", "math": "$a$개의 깊이 좌표 위의 음이 아닌 배열 $z(\\mathbf q)$에 대해\n$$\\mathcal A_{L,\\eta}z=L^{-a}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}z(\\mathbf q).$$\n$d<\\min_vq_v$ 같은 추가 순서 조건은 합의 범위에 넣는다. $\\eta$-regular 배정의 수는 $L^a$ 이하이므로 총 질량 $\\mathcal A_{L,\\eta}1\\le1$이다(정규화하지 않은 평균). $a=0$이면 $\\mathcal A_{L,\\eta}z=z$."}, "decor:average-holder": {"title": "깊이 평균의 분수 거듭제곱 부등식", "math": "음이 아닌 $z$와 $0<\\gamma\\le1$에 대해 $\\mathcal A_{L,\\eta}(z^\\gamma)\\le(\\mathcal A_{L,\\eta}z)^\\gamma$."}, "decor:conditional-concentration": {"title": "조건부 decorrelation: $\\mathcal A_{L,\\eta}v_N(S,d)\\to0$", "math": "모든 고정 labeled topology $S$와 모든 $\\eta>0$에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d)=0.$$\n평균은 $S$의 모든 branching depth와, 첫 갈라짐보다 엄격히 앞인 추가 깊이 $d$에 대해 취하며 $(d,\\mathbf q)$ 전체가 $\\eta$-regular이다. singleton이면 평균은 $d$에 대해서만 취한다. $N$ 극한은 x:decor-limit-order의 수열을 따른다."}, "decor:conditional-concentration.s1": {"title": "귀납량 $V_{k,L}(\\eta)$", "math": "$$V_{k,L}(\\eta)=\\max_{1\\le|S|\\le k}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d)$$\n로 둔다. 최대는 유한 개 labeled topology에 대해 취한다. $0\\le V_{k,L}(\\eta)\\le1$이고, 명제는 모든 $k,\\eta$에 대해 $\\lim_{L\\to\\infty}V_{k,L}(\\eta)=0$인 것과 동치다. 아래에서 쓰는 잎 수 $\\le k-1$인 모양의 공분산 평균(안 쓰는 좌표가 더해진 평균, 이동된 깊이의 평균 포함)은 x:decor-average-comparisons와, 분수 거듭제곱이 나오면 decor:average-holder로 $V_{k-1,L}(\\eta/2)$의 거듭제곱으로 눌린다 (구체적 형태는 s7.s3)."}, "decor:conditional-concentration.s2": {"title": "기저: 잎 하나, $V_{1,L}(\\eta)\\le\\delta/\\eta$", "math": "singleton $S$와 $\\eta$-regular $d$에 대해 각 고정 $L,d$에서 $v_N(S,d)\\le\\delta/\\eta+o_N(1)$이다. 따라서 $V_{1,L}(\\eta)\\le\\delta/\\eta$."}, "decor:conditional-concentration.s2.s1": {"title": "한 층 항등식 (singleton identity)", "math": "old tree는 깊이 $d$에서 갈라지는 두 경로 1, 2이고 경로 1이 spin anchor다. 제약: added color 하나가 anchor와 정확히 깊이 $d$에서 갈라진다. 허용된 선택과 계수는 옛 leaf 2 (계수 $1$), 깊이-$d$ vertex에서 fresh (계수 $-c_d$), 경로 2를 따라가다 깊이 $\\ell$ ($d<\\ell\\le L-1$)의 unary vertex에서 fresh (계수 $-c_\\ell$)이며\n$$c_d=2m_{d+1}-m_d=(d+2)\\delta,\\qquad c_\\ell=\\delta\\quad(d<\\ell\\le L-1).$$\nanchor 혼자일 때의 총 계수는 $-\\delta$이다. $X=R_{12}$, $X_\\ell=R_{13}$ (경로 3은 해당 fresh 확장)이라 하면 각 $X_\\ell$은 $X$와 같은 marginal law를 갖고 $\\sum_{\\ell=d}^{L-1}c_\\ell=1+\\delta$이다. $f=X$로 둔 pert:tree-identity에서\n$$\\frac12\\sum_{\\ell=d}^{L-1}c_\\ell\\,\\mathbb E(X-X_\\ell)^2=\\delta\\operatorname{Var}(X)+o_N(1)\\le\\delta+o_N(1).$$"}, "decor:conditional-concentration.s2.s2": {"title": "기저의 마무리: 세 사본 부등식", "math": "$\\ell=d$이면 경로 1, 2, 3은 $\\mathscr F_d$가 주어지면 조건부 독립이고 같은 조건부 법칙을 가지므로 decor:contractions (b)에서 $\\mathbb E(X-X_d)^2\\ge2v_N(S,d)$. $d/L>\\eta$이므로 $c_d=(d+2)\\delta\\ge\\eta$. s2.s1의 다른 항은 음이 아니므로 $v_N(S,d)\\le\\delta/\\eta+o_N(1)$ (고정 $L,d$). 질량 $\\le1$인 평균을 취하면 $V_{1,L}(\\eta)\\le\\delta/\\eta$."}, "decor:conditional-concentration.s3": {"title": "이동된 사본과 정규화 $J$의 상대 비용", "math": "$|S|=k\\ge2$, 첫 갈라짐 $e>d$, proper child shape $T_1,\\ldots,T_s$. old tree는 stem이 깊이 $d$에서 갈라지고 내부 깊이가 aligned인 $S$의 두 사본 I, II이며, I의 한 옛 leaf가 spin anchor다. $S^+$는 모든 내부 branching depth를 1 늘린 $S$다. 제약 $\\mathcal C$: anchor와 added color $2k-1$개가 $d$에서 분리된 $S^+$ 두 사본을 이루고 anchor는 첫 사본의 원래 labeled 자리에 있다. $J=\\kappa(S^+)^2$ ($\\kappa$는 tree:reference-total의 tree:K)라 하면, $b=b(S)$에 대해 $L\\ge L_0(k,\\eta)$에서\n$$|J|\\ge c_{k,\\eta}\\delta^{2b}>0,\\qquad\\frac1{|J|}\\sum_{E\\ \\text{allowed}}|c_E|\\le C_{k,\\eta}.$$\n전체 부호 있는 기준 계수는 $(m_d-m_{d+1})J=-\\delta J$이다."}, "decor:conditional-concentration.s3.s1": {"title": "두 사본 old tree와 $S^+$ 제약의 구성", "math": "$|S|=k\\ge2$이고 $(d,\\mathbf q)$가 $\\eta$-regular이며 $d<e$ ($e$는 $S$의 첫 branching depth)일 때 다음 prescribed-tree 항등식 사례를 쓴다. old tree: $S$의 두 사본 I, II, stem은 깊이 $d$에서 갈라지고 내부 깊이 배정은 같은 좌표 $\\mathbf q$를 공유한다. anchor: I의 고정된 옛 leaf (spin anchor). 제약 $\\mathcal C$: anchor와 added color들이 $d$에서 분리된 $S^+$ 두 사본(target I, target II)을 이루고, anchor는 target I에서 원래 labeled 자리에 있다. 이 제약은 anchor와 added color들로 이루어진 집합 안의 쌍별 split depth(added color끼리 포함)만 처방하고 다른 old replica에 대한 제약을 두지 않으므로 pert:tree-identity의 허용 제약이다. color 순서는 target I 쪽 color 전부, 그다음 target II 쪽이다."}, "decor:conditional-concentration.s3.s2": {"title": "정규화 $J=\\kappa(S^+)^2$의 하계", "math": "$\\kappa(T)=\\prod_{v\\in\\operatorname{Br}(T)}\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$ (tree:K)에 대해 $J=\\kappa(S^+)^2$. 각 vertex의 $j=1$ 인자는 $-\\delta$이고, $j\\ge2$ 인자는 $|m_{d_v}-jm_{d_v+1}|=(j-1)m_{d_v}+j\\delta\\ge\\eta/2$이다 ($L$이 크면, $d_v=q_v+1$). 따라서 $b=b(S)$에 대해 $|J|\\ge c_{k,\\eta}\\delta^{2b}>0$."}, "decor:conditional-concentration.s3.s3": {"title": "상대 절댓값 비용 (relative absolute cost)", "math": "$L$이 크면 regularity 때문에 각 shifted depth $q_v+1$은 old tree의 모든 branching depth($d$와 모든 $q_w$)와 다르다. 그래서 target의 $2b$개 branching vertex는 모두 fresh unary split로 만들어져야 하고, tree:charging의 (relative-charging) 부등식에서\n$$\\frac1{|J|}\\sum_{\\text{allowed extensions}}|c_E|\\le C_{k,\\eta}$$\n($C_{k,\\eta}$는 $L$과 깊이 배정에 무관). 전체 부호 있는 계수에는 깊이 $d$에서의 분리 인자 $-\\delta$가 더 붙는다. 이 인자는 $J$로 나눈 뒤에도 항등식 안에 남긴다."}, "decor:conditional-concentration.s4": {"title": "두 target 측의 사영", "math": "모든 허용 확장 $E$에서 target overlap $R_E$와, 두 target 측 stem 위에서 계산한 $a_{S,e}$ 두 개의 축약 $P_E$의 차이는 $L^2$에서 $2p_N(S^+,e+1)+h_N(S)$ 이하다. 여기서 $h_N(S)\\ge0$는 확장 $E$에 무관한 양이고 $L$이 크면 $\\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L$이다. target I의 사영 벡터는 old I의 $a:=a_{S,e}$와 같다. old II의 $a_{S,e}$를 $b$로 쓴다."}, "decor:conditional-concentration.s4.s1": {"title": "$e+1$에서 사영하고 깊이를 되돌리기", "math": "각 허용 확장에서 target tree는 marginal로 보통의 $S^+$ 두 사본이고 $d$ 아래에서 서로 독립이다. 그래서 decor:projection-bound (두 측 형태, 모양 $S^+$, 첫 갈라짐 $e+1$)에서 target overlap은 $e+1$에서의 사영 벡터 $a_{S^+,e+1}$ 두 개의 축약과 $L^2$에서 $2p_N(S^+,e+1)$ 이하로 다르다. 각 측에서 자식 깊이를 1 되돌리고($T_j^+\\to T_j$, 첫째 부등식) 평가 깊이를 $e+1$에서 $e$로 옮기면(둘째 부등식. $e$는 aligned 구성의 평균 좌표이고, regularity로 $[e,e+1]$은 각 $T_j$의 initial stem 위에 있으므로 적용된다) 축약은 $L^2$에서 $h_N(S)$ 이하로 바뀐다. $L$이 크면\n$$\\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L.$$"}, "decor:conditional-concentration.s4.s2": {"title": "$h_N$의 균등성과 사영 벡터 $a$, $b$", "math": "$h_N(S)$는 위 비교들의 유한 개 $L^2(\\|\\cdot\\|_N)$ 거리의 합에 크기 의존 상수를 곱한 것으로 잡을 수 있다. 이 거리들은 단일 사본 marginal 모양에만 의존하므로 $h_N(S)$는 확장에 무관하다. 그래서 old tree와 target tree의 합집합이 regular하지 않아도 $\\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L$이 확장 합의 모든 비교에 균등하게 성립한다. $a$, $b$를 old stem I, II 위의 $a_{S,e}$라 하자. target I의 stem은 anchor를 포함하므로 old I prefix를 깊이 $e$까지 공유하고, 그 최종 사영 벡터는 $a$이다."}, "decor:conditional-concentration.s5": {"title": "부호 있는 확장 합과 계수 표", "math": "$f$를 옛 leaf $2k$개 전체의 overlap $A^{\\rm I}_S\\cdot A^{\\rm II}_S$로 둔다. 확장을 target II 첫 경로의 깊이-$e$ prefix로 분류하면, 각 class 안에서 $\\mathbb E[f\\cdot P_E]$는 일정하고 class별 총 계수는 다음과 같다. class $\\ell$ ($d\\le\\ell<e$, fresh divergence at $\\ell$): 사영된 overlap $a\\cdot b_\\ell$, 총 계수 $-c_\\ell J$. class \"old prefix through $e$\": 사영된 overlap $a\\cdot b$, 총 계수 $m_eJ$. 여기서 $c_d=(d+2)\\delta$, $c_\\ell=\\delta$ ($d<\\ell<e$)이고 $b_\\ell$은 새 stem 위의 $a_{S,e}$로 old II와 깊이 $\\ell$까지 prefix를 공유한다. $\\ell=d$이면 $a,b,b_d$를 나르는 세 stem은 $d$ 아래에서 조건부 독립이다. 전체 계수는 old tree에서도 anchor 혼자에서도 $-\\delta J$이다. anchor 혼자인 쪽에서는 확장된 tree 전체가 target이고 제약이 그 모양($d$에서 분리된 $S^+$ 두 사본, anchor는 원래 자리)을 정하므로, x:decor-tree-sampling에 의해 anchor 혼자인 쪽의 모든 확장에서 target overlap $R_E$는 같은 법칙을 갖는다. 그 공통 기대값을 $\\mathbb ER_{\\rm target}$이라 하면 anchor 혼자인 쪽의 합은 $\\sum_Ec_E\\,\\mathbb ER_E=-\\delta J\\,\\mathbb ER_{\\rm target}$이다 (tex 362–363 \"In every extension\", 418–419, 444–445)."}, "decor:conditional-concentration.s5.s1": {"title": "target II 첫 경로의 분류", "math": "target I의 추가는 모두 깊이 $d$ 아래 anchor 가지 안에 머물므로 old II stem과 그 child count를 바꾸지 않는다. target II의 첫 추가 경로는 anchor와 깊이 $d$에서 갈라져야 하므로 깊이-$e$ prefix에 따라 정확히 다음 중 하나다. (i) 깊이-$d$ vertex에서 fresh divergence ($\\ell=d$, 계수 $-c_d$, $c_d=2m_{d+1}-m_d$). (ii) old II stem을 따라가다 깊이 $\\ell$ ($d<\\ell<e$)의 unary vertex에서 fresh divergence (계수 $-c_\\ell=-\\delta$). (iii) old II prefix를 깊이 $e$까지 따라감 (그 뒤의 선택은 무엇이든). (i), (ii)에서 $b_\\ell$은 새 stem 위의 $a_{S,e}$이고, (iii)에서 최종 사영 벡터는 $b$이다. target II의 나중 경로는 첫 경로와 $e+1$ 이상에서 갈라지므로 깊이 $e$까지 첫 경로를 따른다."}, "decor:conditional-concentration.s5.s2": {"title": "class 안에서 결합 법칙이 고정됨", "math": "고정된 확장 이력 $E$에서 모든 옛 경로와 target II 첫 경로의 깊이-$e$ prefix만 남기고 나머지 새 가지를 지워도, 옛 경로와 사영된 prefix들의 결합 법칙은 바뀌지 않는다. 남는 tree는 class에만 의존한다(깊이 $\\ell<e$에 fresh stem이 붙은 old tree, 또는 old tree 자체). 따라서 $\\mathbb E[f\\cdot(a\\cdot b_\\ell)]$, $\\mathbb E[f\\cdot(a\\cdot b)]$는 class 안에서 일정하고, 사영된 항의 합은 class별 (사영된 기대값)×(class의 총 부호 계수)의 합이다."}, "decor:conditional-concentration.s5.s3": {"title": "class별 계수 합 ($-c_\\ell J$, $m_eJ$)", "math": "tree:reference-total에 의해, 첫 경로의 각 선택마다 나중 target II color들의 계수를 거꾸로 합하면 $\\kappa(S^+)$이고, target I color들의 계수 합은 또 하나의 $\\kappa(S^+)$이다. 그래서 class $\\ell$의 총 계수는 $-c_\\ell J$이다. 기준 모양 전체의 계수는 $(m_d-m_{d+1})\\kappa(S^+)^2=-\\delta J$이고 이는 old tree에서나 anchor 혼자에서나 같다. $\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta=m_e+\\delta$이므로 나머지 class \"old prefix through $e$\"의 총 계수는 $-\\delta J+(m_e+\\delta)J=m_eJ$이다. anchor 혼자인 쪽에서는 확장된 tree 전체가 target이고 제약이 그 모양($d$에서 분리된 $S^+$ 두 사본, anchor는 원래 자리)을 정하므로, x:decor-tree-sampling에 의해 anchor 혼자인 쪽의 모든 확장에서 target overlap $R_E$는 같은 법칙을 갖는다. 그 공통 기대값을 $\\mathbb ER_{\\rm target}$이라 하면 anchor 혼자인 쪽의 합은 $\\sum_Ec_E\\,\\mathbb ER_E=-\\delta J\\,\\mathbb ER_{\\rm target}$이다 (tex 362–363 \"In every extension\", 418–419, 444–445)."}, "decor:conditional-concentration.s6": {"title": "사영된 항등식과 오차 $\\rho_N$", "math": "$$\\sum_{\\ell=d}^{e-1}c_\\ell\\,\\mathbb E\\bigl[f(a\\cdot b-a\\cdot b_\\ell)\\bigr]=\\delta\\bigl(\\mathbb E[f(a\\cdot b)]-\\mathbb Ef\\,\\mathbb ER_{\\rm target}\\bigr)+\\rho_N(S,d),$$\n여기서 $R_{\\rm target}$은 anchor 혼자인 확장의 target overlap이고 $|R_{\\rm target}|\\le1$이다. 이 식은 pert:tree-identity의 이 사례 $\\sum_Ec_E\\mathbb E[fR_E]-\\mathbb Ef\\cdot(-\\delta J\\,\\mathbb ER_{\\rm target})=O(\\varepsilon_{N,L,k})$에서 나온다. 둘째 항은 s5의 사실(anchor 혼자인 쪽의 모든 확장이 같은 법칙의 target을 주고 총 계수가 $-\\delta J$)로 묶인 것이고, 첫째 항의 $R_E$를 s4의 사영 $P_E$로 바꾼 뒤 s5의 class별 표를 쓰고 $J$로 나눈다. 오차는\n$$|\\rho_N(S,d)|\\le C_{k,\\eta}\\bigl(p_N(S^+,e+1)+h_N(S)\\bigr)+C_{L,k,\\eta}\\,\\varepsilon_{N,L,k}.$$"}, "decor:conditional-concentration.s7": {"title": "귀납 닫기: 점화식 $V_{k,L}\\le C(L^{-1/2}+V_{k-1,L}^{1/4})$", "math": "$L$이 충분히 크면 $V_{k,L}(\\eta)\\le C_{k,\\eta}\\bigl(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4}\\bigr)$. 이것과 $V_{1,L}(\\eta)\\le\\delta/\\eta$에서 귀납으로 모든 고정 $k,\\eta$에 대해 $V_{k,L}(\\eta)\\to0$ ($L\\to\\infty$)."}, "decor:conditional-concentration.s7.s1": {"title": "$f$를 $a\\cdot b$로 바꾸어 음이 아닌 세 사본 양 얻기", "math": "decor:projection-bound에서 $\\|f-a\\cdot b\\|_{L^2}\\le2p_N(S,e)$이고 $\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta\\le1$이다. 그래서 s6의 좌변에서 $f$를 $a\\cdot b$로 바꾸는 비용은 $4p_N(S,e)$ 이하이고, 각 $a\\cdot b_\\ell$이 $a\\cdot b$와 같은 marginal law를 가지므로 바뀐 좌변은 $\\frac12\\sum_{\\ell=d}^{e-1}c_\\ell\\mathbb E(a\\cdot b-a\\cdot b_\\ell)^2$이다. 각 항은 음이 아니고 $c_d\\ge\\eta$, s6의 우변은 절댓값이 $2\\delta+|\\rho_N(S,d)|$ 이하이므로\n$$\\mathbb E(a\\cdot b-a\\cdot b_d)^2\\le C_\\eta\\bigl(\\delta+p_N(S,e)+|\\rho_N(S,d)|\\bigr).$$"}, "decor:conditional-concentration.s7.s2": {"title": "$v_N(S,d)$의 귀납 추정", "math": "$$v_N(S,d)\\le C_{k,\\eta}\\bigl(\\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S)\\bigr)+C_{L,k,\\eta}\\,\\varepsilon_{N,L,k}.$$\n근거: $A_S$의 세 사본을 $d$ 아래에서 조건부 독립으로 뽑으면 decor:contractions (b)로 $\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\ge2v_N(S,d)$. 첫 사본이 들어간 두 축약을 사영하면 각각 $L^2$에서 $2p_N(S,e)$ 이하로 바뀌어 $a\\cdot b-a\\cdot b_d$가 된다. s7.s1, s6의 $\\rho_N$ 상계, $p_N(S,e)\\le k$를 쓴다."}, "decor:conditional-concentration.s7.s3": {"title": "자식 항의 깊이 평균 (fiber bound)", "math": "aligned 구성은 $d$와 $e$를 포함해 $D=b(S)+1$개의 서로 다른 깊이 좌표를 갖는다. $T_j$에 속한 항은 $D_j=b(T_j)+1$개 좌표만 쓴다: 이동된 항은 $\\pi_j(\\mathbf q)=(e+1,(q_v+1)_{v\\in\\operatorname{Br}(T_j)})$, 이동되지 않은 항은 $(e,(q_v)_{v\\in\\operatorname{Br}(T_j)})$. 남은 각 배정의 원상은 $L^{D-D_j}$개 이하이고, $L$이 크면 그 좌표는 $\\eta/2$-regular이다. $w_j\\ge0$가 이 좌표의 함수(자식 공분산)이면 $0<\\gamma\\le1$에 대해\n$$L^{-D}\\sum_{\\mathbf q\\ \\eta\\text{-regular}}w_j(\\pi_j(\\mathbf q))^\\gamma\\le L^{-D_j}\\sum_{\\mathbf y\\ \\eta/2\\text{-regular}}w_j(\\mathbf y)^\\gamma\\le\\Bigl(L^{-D_j}\\sum_{\\mathbf y\\ \\eta/2\\text{-regular}}w_j(\\mathbf y)\\Bigr)^\\gamma.$$\n이동되지 않은 항도 같은 상계를 갖는다."}, "decor:conditional-concentration.s7.s4": {"title": "점화식과 귀납의 완성", "math": "s7.s2를 $\\mathcal A_{L,\\eta}$로 평균하고 s7.s3을 $\\gamma=1/4$로 쓴 뒤 $\\limsup_N$을 취한다. 고정 $L$에서 $\\mathcal A_{L,\\eta}$는 유한 합이므로 decor:identity-error에 의해 $\\limsup_N\\mathcal A_{L,\\eta}\\le\\mathcal A_{L,\\eta}\\limsup_N$이고, $C_{L,k,\\eta}\\varepsilon_{N,L,k}$ 항은 평균 뒤에도 사라진다. 또 $\\limsup_N(\\cdot)^{1/4}=(\\limsup_N\\cdot)^{1/4}$이다. $\\mathcal A_{L,\\eta}h_N\\le(\\mathcal A_{L,\\eta}h_N^2)^{1/2}\\le(C_k/L)^{1/2}$이고 $\\varepsilon_{N,L,k}\\to0$이므로, $L$이 크면\n$$V_{k,L}(\\eta)\\le C_{k,\\eta}\\bigl(L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4}\\bigr).$$\n$V_{k,L}$ 정의의 더 작은 모양들은 공분산이 1 이하이므로 우변에 흡수된다. 기저 $V_{1,L}(\\eta)\\le\\delta/\\eta$와 이 점화식에서, 모든 $\\eta'$에 대해 $V_{k-1,L}(\\eta')\\to0$이면 $V_{k,L}(\\eta)\\to0$이다. 그러므로 모든 고정 $k,\\eta$에 대해 $V_{k,L}(\\eta)\\to0$이고 명제가 증명된다."}, "decor:contractions": {"title": "축약 부등식과 세 사본 부등식", "math": "(a) $d$가 $S$의 initial stem 위의 깊이이고 확률 벡터 $B\\in[-1,1]^N$가 $\\mathscr F_d$가 주어지면 $A_S$와 조건부 독립이면\n$$\\bigl\\|(A_S-\\mu_{d,S})\\cdot B\\bigr\\|_{L^2}\\le v_N(S,d)^{1/4}.$$\n(b) $X,Y,Z$가 $\\sigma$-field $\\mathscr G$가 주어지면 조건부 독립이고 같은 조건부 법칙을 갖는 유계 확률 벡터($\\mathbb R^N$ 값)이고 $C$가 그 조건부 공분산 행렬이면\n$$\\mathbb E(X\\cdot Y-X\\cdot Z)^2\\ge\\frac2{N^2}\\mathbb E\\sum_{i,j}C_{ij}^2.$$"}, "decor:contractions.s1": {"title": "축약 부등식", "math": "$C=\\operatorname{Cov}(A_S\\mid\\mathscr F_d)$라 하면, $B$의 조건부 독립성에서 $\\mathbb E\\bigl[((A_S-\\mu_{d,S})\\cdot B)^2\\mid\\mathscr F_d,B\\bigr]=N^{-2}\\sum_{ij}C_{ij}B_iB_j\\le N^{-2}\\sum_{ij}|C_{ij}|\\le\\bigl(N^{-2}\\sum_{ij}C_{ij}^2\\bigr)^{1/2}$. 기대값을 취하고 Jensen을 쓰면 $\\mathbb E((A_S-\\mu_{d,S})\\cdot B)^2\\le v_N(S,d)^{1/2}$."}, "decor:depth-continuity": {"title": "깊이에 대한 평균 연속성", "math": "topology $S$와 branching vertex의 부분집합 $U$를 고정한다. 각 $\\eta$-regular 깊이 배정에 대해 $S^U$는 같은 topology에서 $U$의 vertex 깊이를 1씩 늘린 것이다. 평가 깊이 $d$가 $S$와 $S^U$ 둘 다의 initial stem 위에 있으면(ancestral), 같은 sampled prefix에서 두 평균을 비교한다. 그러면 충분히 큰 $L$ ($L\\ge L_0(\\eta,S,U)$, tex 148 \"for all sufficiently large $L$\")에서\n$$\\mathcal A_{L,\\eta}\\,\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L.$$\n평균은 모든 branching depth에 대해, 그리고 $d$가 범위를 가지면 $d$에 대해서도 취하며, 그렇지 않으면 $d$는 고정이다. $d$가 $S$의 initial unary 구간을 따라 움직이면($d+1$도 initial stem 위)\n$$\\mathcal A_{L,\\eta}\\,\\mathbb E\\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le C/L$$\n(평균은 $d$와 모든 branching depth에 대해, 두 평균은 같은 sampled path 위에서). 상수 $C$는 vertex 수와 이동 수에만 의존하며 $N$, 평가 깊이, transition kernel에 균등하다. 같은 부등식은 $S$를 포함한 더 큰 sampled tree 안에서 계산해도 성립한다."}, "decor:depth-continuity.s1": {"title": "martingale energy와 평가 깊이 연속성", "math": "모양 $T$의 나중 branching depth를 고정하고 initial stem을 따라 한 경로를 뽑으면 $t\\mapsto\\mu_{t,T}$는 그 stem의 prefix filtration $(\\mathscr F_t)$에 대한 vector martingale이고 좌표가 $[-1,1]$에 있다. 증분의 직교성에서\n$$\\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2=\\mathbb E\\|\\mu_{t_1,T}\\|_N^2-\\mathbb E\\|\\mu_{t_0,T}\\|_N^2\\le1$$\n(합은 initial stem 위의 $t,t+1$에 대해, $t_0$, $t_1$은 그 범위의 처음과 끝). 특히 $t\\mapsto\\mathbb E\\|\\mu_{t,T}\\|_N^2$는 증가한다(각 증분이 $\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\ge0$). 이것을 범위를 갖는 $d$에 대해 합하고 정규화 $L^{-1}$을 곱하면, 나머지 좌표의 합은 $L$의 거듭제곱으로 상쇄되어 $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le1/L$."}, "decor:depth-continuity.s2": {"title": "갈라짐 하나를 한 칸 늦추는 효과", "math": "깊이 $q$의 branching vertex $v$ (첫 갈라짐이 아니어도 된다)가 자식 모양 $T_1,\\ldots,T_s$를 갖고 그 나중 깊이들을 고정한다. x:decor-topology의 약속대로 각 $T_j$는 root에서 $v$까지의 경로를 stem으로 갖는 topology이므로 $q$는 $T_j$의 initial stem 위에 있고, $\\mathscr F_q$는 root와 그 경로의 깊이 $q$까지 sampled prefix가 생성하는 $\\sigma$-field, $\\mu_{q,T_j}=\\mathbb E[A_{T_j}\\mid\\mathscr F_q]$는 decor:covariance-definition을 $T_j$에 적용한 것이다. $q+1$이 각 $T_j$의 첫 branching depth보다 작으면(그리고 $T_j$가 leaf 하나이면 $q+1\\le L-1$) $\\mu_{q+1,T_j}$도 같은 뜻으로 정의된다. 그 vertex 아래 spin 곱의 원래 조건부 평균은 $\\prod_j\\mu_{q,T_j}$ (좌표별)이다. 갈라짐을 $q+1$로 늦추면 같은 깊이-$q$ prefix에서의 조건부 평균은 $\\mathbb E[\\prod_j\\mu_{q+1,T_j}\\mid\\mathscr F_q]$이다 (자식 평균은 공통 한 걸음 continuation 위에서 계산). 그리고\n$$\\mathbb E\\Bigl\\|\\prod_j\\mu_{q,T_j}-\\mathbb E\\Bigl[\\prod_j\\mu_{q+1,T_j}\\Bigm|\\mathscr F_q\\Bigr]\\Bigr\\|_N^2\\le s\\sum_j\\mathbb E\\|\\mu_{q+1,T_j}-\\mu_{q,T_j}\\|_N^2.$$"}, "decor:depth-continuity.s3": {"title": "이동 하나의 비용 $C/L$", "math": "$|U|=1$, $U=\\{v\\}$이고 깊이 배정이 $\\eta'$-regular ($\\eta'>0$; 평균도 $\\mathcal A_{L,\\eta'}$)이면 $\\eta'L\\ge1$일 때 $\\mathcal A_{L,\\eta'}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L$ ($C$는 $S$의 vertex 수에만 의존). 조건 $\\eta'L\\ge1$은 작성자 유도다(원문은 이 단계에서 큰 $L$을 따로 부르지 않는다): regularity에서 $v$의 자식의 다음 branching depth $q'$는 $q'-q_v>\\eta'L\\ge1$이므로 $q_v+1<q'$이고, $q_v<(1-\\eta')L$이므로 $q_v+1\\le L-1$이다. 그래서 s2의 $\\mu_{q_v+1,T_j}$가 정의되고 $S^U$의 깊이 배정이 가지를 따라 엄격히 증가한다. 근거: s2의 우변을 $q=q_v$에 대해 합하면 각 자식 모양에 대해 s1에 의해 $s\\cdot s$ 이하다. 깊이 $q_v$에서 바뀐 부분 tree 평균을 조상 깊이 $d$로 올리는 연산은 조건부 기대값과 절댓값 1 이하 인자의 좌표별 곱뿐이므로 $\\mathbb E\\|\\cdot\\|_N^2$를 늘리지 않는다. 나머지 좌표에 대한 평균은 $L$의 거듭제곱으로 상쇄된다."}, "decor:depth-continuity.s4": {"title": "여러 이동과 더 큰 tree", "math": "$U=\\{v_1,\\ldots,v_u\\}$이면 $S=S^{U_0},S^{U_1},\\ldots,S^{U_u}=S^U$ ($U_r=\\{v_1,\\ldots,v_r\\}$)로 하나씩 바꾸고 $\\|\\sum_{r=1}^u x_r\\|^2\\le u\\sum_r\\|x_r\\|^2$를 쓴다. regularity 때문에 중간 모양들은 같은 조상 관계를 갖고, $L$이 크면 그 깊이 배정은 $\\eta/2$-regular이다 (tex 201–203 \"for large $L$, lie in the enlarged $\\eta/2$-regular domain\"; x:decor-average-comparisons (ii)). 그래서 각 항에 $\\eta'=\\eta/2$로 s3을 적용해($\\eta L/2\\ge1$도 큰 $L$에서 성립) $\\mathcal A_{L,\\eta}\\mathbb E\\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le u^2C/L$. 한 prefix의 marginal law는 다른 sampled branch를 빼도 바뀌지 않으므로 이 추정은 더 큰 sampled tree 안에서도 성립한다."}, "decor:identity-error": {"title": "항등식 오차의 최대 $\\varepsilon_{N,L,k}$", "math": "고정된 $L,k$에 대해, 아래에서 쓰는 pert:tree-identity의 사례들(leaf 수가 $k$에만 의존하는 상한 이하인 labeled topology와 그 $\\{0,\\ldots,L-1\\}$-깊이 배정으로 만든 old tree, anchor, 제약, 차수가 유계인 multioverlap 단항식 $f$, 유계 개수의 added color)은 유한 개다. 그 사례들에 대한 pert:tree-identity-eq 좌변의 절댓값의 최대를 $\\varepsilon_{N,L,k}$라 하면, x:decor-limit-order의 수열을 따라 각 고정 $L,k$에서\n$$\\varepsilon_{N,L,k}\\longrightarrow0\\qquad(N\\to\\infty).$$\n이 오차에 곱하는 상수는 $L$에 임의로 의존해도 된다.\n같은 유한성 때문에, 고정 $L$에서 깊이 평균 $\\mathcal A_{L,\\eta}$는 유한 개 배정에 대한 합이다. 따라서 음이 아닌 $z_N(\\mathbf q)$에 대해 $\\limsup_N\\mathcal A_{L,\\eta}z_N\\le\\mathcal A_{L,\\eta}\\limsup_Nz_N$이고, 특히 각 고정 배정에서 $o_N(1)$인 항(예: $C_{L,k,\\eta}\\varepsilon_{N,L,k}$, 고정 배정마다의 $\\operatorname{Var}(M)$)은 깊이 평균을 취한 뒤에도 $N\\to\\infty$에서 사라진다. 이 교환은 깊이 평균이나 $L$ 극한보다 먼저 한다 (tex 49–52, 616–618)."}, "decor:overlap-concentration": {"title": "모든 multioverlap의 깊이 평균 집중", "math": "모든 고정 labeled topology $S$에 대해\n$$\\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)=0\\qquad(\\eta>0),$$\n여기서 $\\mathcal A_{L,\\eta}$는 $S$의 $b(S)$개 branching depth만을 $\\eta$-regular 배정에 대해 평균하고, $N$ 극한은 x:decor-limit-order의 수열을 따른다. singleton이면 (평균에 좌표가 없고) 각 고정 $L$에서 $\\operatorname{Var}(R_S)\\to0$ ($N\\to\\infty$)."}, "decor:overlap-concentration.s1": {"title": "singleton: 추가 color 없는 spin anchor", "math": "singleton $S$에서 old tree를 $S$ 자신, spin anchor를 그 leaf, added color 없음, $f=R_S$로 둔 pert:tree-identity는 $\\mathbb ER_S^2-(\\mathbb ER_S)^2\\to0$, 즉 각 고정 $L$에서 $\\operatorname{Var}(R_S)\\to0$을 준다."}, "decor:overlap-concentration.s2": {"title": "marker anchor로 prefix 사영 $M$을 집중시키기", "math": "$|S|\\ge2$, 첫 갈라짐 $e$, $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$이라 하면 각 고정 $L$, $S$, 깊이 배정에서 $\\operatorname{Var}(M)\\to0$ ($N\\to\\infty$)."}, "decor:overlap-concentration.s2.s1": {"title": "marker anchor 구성과 계수 $C(S,e)$", "math": "old tree는 $S$의 sampled copy, 그 leaf 하나가 marker anchor다. added color $k=|S|$개가 $S$의 사본 하나를 이루고 그 모든 leaf가 anchor와 깊이 $e-1$에서 갈라진다는 제약을 둔다. 그러면 첫 target 경로는 깊이 $e-1$에서 fresh여야 하고(old tree는 거기서 아직 갈라지지 않았고 옛 leaf들은 anchor와 깊이 $e$까지 prefix를 공유하므로 쓸 수 없다), 나머지 target 경로는 그렇게 생긴 fresh 부분 tree 안에 놓인다. 확장 계수의 총합은 old tree 쪽과 anchor 혼자인 쪽 모두\n$$C(S,e)=-\\delta\\,\\kappa(S)\\ne0.$$"}, "decor:overlap-concentration.s2.s2": {"title": "$C(S,e)\\operatorname{Var}(M)=o_N(1)$", "math": "target 사본과 old 사본은 $\\mathscr F_{e-1}$가 주어지면 조건부 독립이고 같은 조건부 법칙을 가진다. $f=R_S$ (old), $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$이면 old 쪽 각 항은 $\\mathbb E[fR_E]=\\mathbb EM^2$이다. anchor 혼자인 쪽은 marker의 $e-1$ 아래 continuation을 지우면 보통의 target 법칙 $S$가 남아 평균이 $\\mathbb ER_S$이다. 따라서\n$$C(S,e)\\bigl(\\mathbb EM^2-(\\mathbb ER_S)^2\\bigr)=C(S,e)\\operatorname{Var}(M)=o_N(1),$$\n그리고 고정 $L$에서 $C(S,e)\\ne0$으로 나누어 $\\operatorname{Var}(M)\\to0$ (각 고정 $L,S,e$). $L\\to\\infty$에서 균등한 하계는 필요 없다."}, "decor:overlap-concentration.s3": {"title": "prefix 아래의 조건부 분산: $G$와 $G_-$", "math": "$|S|=k\\ge2$, 첫 갈라짐 $e$, 자식 $T_1,\\ldots,T_s$에 대해 $G=\\mathbf1\\cdot\\prod_j\\mu_{e,T_j}$, $G_-=\\mathbf1\\cdot\\prod_j\\mu_{e-1,T_j}$로 둔다. $G_-$는 $\\mathscr F_{e-1}$-가측이고, decor:projection-bound ($B=\\mathbf1$)에서 $\\mathbb E(R_S-G)^2\\le p_N(S,e)^2$이다. 자식 깊이를 고정하고 곱 차이 부등식과 martingale energy를 쓰면 $L$이 클 때\n$$\\mathcal A_{L,\\eta}\\,\\mathbb E(G-G_-)^2\\le C_k/L.$$"}, "decor:overlap-concentration.s4": {"title": "분산 추정 $\\limsup_N\\mathcal A\\operatorname{Var}(R_S)\\le C_k(L^{-1}+V_{k-1,L}^{1/2})$", "math": "조건부 기대값이 최적 $L^2$ 사영이므로 $\\mathbb E(R_S-M)^2\\le\\mathbb E(R_S-G_-)^2\\le2p_N(S,e)^2+2\\mathbb E(G-G_-)^2$이다. 분산 분해 $\\operatorname{Var}(R_S)=\\mathbb E(R_S-M)^2+\\operatorname{Var}(M)$와 s2, s3, 그리고 고정 $L$에서 유한 합인 $\\mathcal A_{L,\\eta}$와 $\\limsup_N$의 교환(decor:identity-error: 각 고정 배정에서 $\\operatorname{Var}(M)\\to0$이므로 $\\limsup_N\\mathcal A_{L,\\eta}\\operatorname{Var}(M)=0$)에서, $L$이 충분히 크면\n$$\\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)\\le C_k\\bigl(L^{-1}+V_{k-1,L}(\\eta/2)^{1/2}\\bigr).$$\n여기서 $p_N(S,e)^2\\le s\\sum_jv_N(T_j,e)^{1/2}$와 fiber bound(conditional-concentration.s7.s3)를 $\\gamma=1/2$로 쓴다. 이번에는 $d$가 없으므로 전체 평균은 $D=b(S)$개 좌표, 자식 항은 여전히 $D_j=b(T_j)+1$개 좌표를 쓴다."}, "decor:overlap-concentration.s5": {"title": "마무리: conditional-concentration 적용", "math": "decor:conditional-concentration (s1의 동치 형태)에서 $\\lim_{L\\to\\infty}V_{k-1,L}(\\eta/2)=0$이므로 s4의 우변이 $L\\to\\infty$에서 0으로 가고 정리가 증명된다."}, "decor:projection-bound": {"title": "첫 갈라짐에서 자식을 평균으로 바꾸는 오차", "math": "decor:projection-definition의 상황에서, $B\\in[-1,1]^N$가 $\\mathscr F_e$가 주어지면 $S$의 깊이 $e$ 아래 continuation과 조건부 독립인 확률 벡터이면\n$$\\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e).$$\n특히 $B=\\mathbf1$일 때, 그리고 $B$가 $e$ 이전에 갈라진 다른 측에서 뽑은 $[-1,1]^N$ 벡터일 때 성립한다. 두 측 I, II가 각각 같은 모양 $S$의 사본이고, 깊이 배정이 aligned이며(대응하는 vertex가 깊이 좌표 하나를 공유, x:decor-eta-regular) $e$ 이전(예: 깊이 $d<e$)에서 갈라졌으면, $\\|A_S^{\\rm I}\\cdot A_S^{\\rm II}-a^{\\rm I}_{S,e}\\cdot a^{\\rm II}_{S,e}\\|_{L^2}\\le2p_N(S,e)$. 마지막으로 $|f|\\le1$인 임의의 스칼라 $f$ (오차와 상관이 있어도 됨)에 대해 $\\mathbb E|f\\,Z|\\le\\|Z\\|_{L^2}$이므로, 위 오차에 $f$를 곱해도 $L^1$ 상계는 커지지 않는다."}, "decor:projection-definition": {"title": "첫 갈라짐에서의 사영 $a_{S,e}$와 오차량 $p_N(S,e)$", "math": "$|S|\\ge2$이고 $S$가 깊이 $e$에서 처음 갈라져 proper child shape $T_1,\\ldots,T_s$를 갖는다고 하자. $e$는 각 $T_j$의 initial stem 위에 있다. 자식들은 $\\mathscr F_e$가 주어지면 조건부 독립이므로 $\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$ (좌표별 곱)이다.\n$$a_{S,e}=\\prod_{j=1}^s\\mu_{e,T_j},\\qquad p_N(S,e)=\\sum_{j=1}^sv_N(T_j,e)^{1/4}.$$\n$0\\le p_N(S,e)\\le s\\le|S|$."}, "main:theorem": {"title": "주정리: $\\lim_NF_N=\\inf_{r\\ge0}\\Phi_r$", "math": "(2.1)–(2.4) 아래 열역학 극한이 존재하고\n$$\\lim_{N\\to\\infty}F_N=\\inf_{r\\ge0}\\Phi_r.\\tag{2.13}$$\n여기서 $\\Phi_r=\\inf_{\\zeta,\\mathbf m}\\mathcal B_r(\\zeta,\\mathbf m)$ ($r\\ge1$), $\\Phi_0=\\inf_\\zeta\\mathcal B_0(\\zeta)$ 이다."}, "main:theorem.s1": {"title": "상수 이동으로 승수 $a$ 제거와 순열 불변성", "math": "승수 $a$ 는 label 붙은 입력 함수들에 비대칭으로 의존할 수 있으므로 원래 상호작용 법칙은 순열 불변이 아닐 수 있다. $c=\\theta(1,\\ldots,1)$, $\\widehat\\theta=\\theta-c$ 로 둔다. $\\lvert c\\rvert\\le B(\\theta)$ 이므로 $c$ 는 적분 가능하다. (2.3)에서\n$$\\widehat\\theta(s)=\\log\\frac{1+b\\prod_{\\ell=1}^pf_\\ell(s_\\ell)}{1+b\\prod_{\\ell=1}^pf_\\ell(1)}.$$\n$a$ 가 사라졌다. $f_\\ell$ 들이 i.i.d.이고 $b$ 와 독립이므로 $\\widehat\\theta$ 의 법칙은 입력의 순열에 대해 불변이다. 또 $\\mathbb EB(\\widehat\\theta)\\le2\\mathbb EB(\\theta)<\\infty$."}, "main:theorem.s2": {"title": "truncation과 bounded 하한의 적용", "math": "$K>0$ 에 대해 $\\widehat\\theta$ 의 각 값과 $h$ 를 $[-K,K]$ 로 잘라 $\\widehat\\theta^{(K)}$, $h^{(K)}$ 를 얻는다. 순열 불변성은 보존된다. bounded 법칙의 하한 comp:bounded-lower는 truncation이 factorization을 보존하든 말든 적용된다. dominated convergence로\n$$D_K=\\mathbb E\\max_s\\lvert\\widehat\\theta(s)-\\widehat\\theta^{(K)}(s)\\rvert\\longrightarrow0,\\qquad d_K=\\mathbb E\\lvert h-h^{(K)}\\rvert\\longrightarrow0.$$"}, "main:theorem.s3": {"title": "$K\\to\\infty$ 와 상수 되돌리기: $\\liminf_NF_N\\ge\\inf_r\\Phi_r$", "math": "$\\widehat I$ 를 정규화된(상수 이동한) 시행 functional의 모든 깊이와 시행 법칙에 대한 inf, $I_K$ 를 잘린 물리 법칙으로 같은 inf라 하자. $\\widehat\\theta$ 와 $h$ 는 (2.1)을 만족하고($\\mathbb EB(\\widehat\\theta)\\le2\\mathbb EB(\\theta)$, main:theorem.s1) 잘린 $\\widehat\\theta^{(K)}$, $h^{(K)}$ 는 bounded이며, $c$ 는 적분 가능하므로(main:theorem.s1) reduction:stability가 적용된다. 균일한 시행 안정성(reduction:stability의 시행 functional 부등식)이\n$$\\lvert\\widehat I-I_K\\rvert\\le\\alpha(2p-1)D_K+d_K$$\n를 준다. pressure 안정성(reduction:stability의 $\\lvert F_N-F_N'\\rvert\\le\\alpha D+d$)과 comp:bounded-lower는\n$$\\liminf_N\\widehat F_N\\ge I_K-\\alpha D_K-d_K\\ge\\widehat I-2\\alpha pD_K-2d_K$$\n를 준다. $K\\to\\infty$ 로 $\\liminf_N\\widehat F_N\\ge\\widehat I=\\inf_r\\widehat\\Phi_r$. 상수 이동을 되돌리면(reduction:stability의 $\\widehat F_N=F_N-\\alpha\\mathbb Ec$, $\\widehat{\\mathcal B}_r=\\mathcal B_r-\\alpha\\mathbb Ec$) $\\liminf_NF_N\\ge\\inf_r\\Phi_r$."}, "main:theorem.s4": {"title": "상한과 합쳐 극한의 존재와 (2.13)", "math": "upper:bound(main:theorem의 가정 아래, 모든 $N$ 과 모든 유한 단계 시행 법칙에서 $F_N\\le\\mathcal B_r(\\zeta,\\mathbf m)$)가 $\\limsup_NF_N\\le\\inf_r\\Phi_r$ 를 준다. main:theorem.s3의 $\\liminf_NF_N\\ge\\inf_r\\Phi_r$ 와 합치면 두 극한이 일치하고, 극한의 존재와 (2.13)이 증명된다."}, "model:chain": {"title": "시행 법칙: $\\mathcal M_j$, $\\zeta\\in\\mathcal M_{r+1}$, $\\mathbf m$, label별 사슬 (2.7)", "math": "$\\mathcal P(E)$ 는 $E$ 위의 Borel 확률측도들이다. $\\mathcal M_1=\\mathcal P(\\mathbb R)$, $\\mathcal M_{j+1}=\\mathcal P(\\mathcal M_j)$ 로 두고 각각 약수렴 위상과 그 Borel $\\sigma$-field를 준다. $r\\ge1$, $\\zeta\\in\\mathcal M_{r+1}$, $0<m_1<\\cdots<m_r<1$ 을 고정한다. 각 message label $\\omega$ 마다 독립으로\n$$\\eta_0^\\omega\\sim\\zeta,\\qquad\\eta_{d+1}^\\omega\\mid\\eta_d^\\omega\\sim\\eta_d^\\omega\\ \\ (0\\le d\\le r-2),\\qquad x^\\omega\\mid\\eta_{r-1}^\\omega\\sim\\eta_{r-1}^\\omega\\tag{2.7}$$\n를 뽑는다. $r=1$ 이면 각 label이 먼저 법칙 $\\zeta$ 의 무작위 확률측도 $\\eta_0$ 를 뽑고, 다음에 법칙 $\\eta_0$ 의 $x$ 를 뽑는다. 더 높은 단계는 측도 뽑기를 반복한다. 이 변수들은 모두 물리적 disorder와 독립이다. $x_1,\\ldots,x_p$ 와 $x_\\ell^j$ ($j\\ge1$, $1\\le\\ell<p$) 에는 서로 다른 label을 쓴다."}, "model:edge": {"title": "edge 분배함수 $C_\\theta$ (2.5)", "math": "$$C_\\theta(x_1,\\ldots,x_p)=\\sum_{s\\in\\{-1,1\\}^p}e^{\\theta(s)}\\prod_{\\ell=1}^pq_{x_\\ell}(s_\\ell).\\tag{2.5}$$"}, "model:factorization": {"title": "factor weight 전개 (2.3)", "math": "모든 spin 조 $(s_1,\\ldots,s_p)$ 에 대해\n$$e^{\\theta(s_1,\\ldots,s_p)}=a\\Bigl(1+b\\prod_{\\ell=1}^pf_\\ell(s_\\ell)\\Bigr),\\qquad\\Bigl\\lvert b\\prod_{\\ell=1}^pf_\\ell(s_\\ell)\\Bigr\\rvert<1\\quad\\text{a.s.}\\tag{2.3}$$\n인 표현이 존재한다. 여기서 $a>0$ 과 $b$ 는 실수 확률변수, $f_\\ell:\\{-1,1\\}\\to\\mathbb R$ 은 한 무작위 함수의 독립 사본이고, $b$ 는 $f_\\ell$ 들과 독립이다."}, "model:functional": {"title": "시행 functional $\\mathcal B_r$ 와 변분값 $\\Phi_r$ (2.11)", "math": "$$\\mathcal B_r(\\zeta,\\mathbf m)=\\log2+\\mathbb E\\log T_0V_{\\rm s}-\\alpha(p-1)\\,\\mathbb E\\log T_0V_{\\rm e},\\qquad\\Phi_r=\\inf_{\\zeta,\\,\\mathbf m}\\mathcal B_r(\\zeta,\\mathbf m).\\tag{2.11}$$\n$\\mathbb E$ 는 물리적 disorder와 $\\eta_0$ 을 평균한다($T_0$ 이 나머지 보조 변수를 적분했다). inf는 모든 $\\zeta\\in\\mathcal M_{r+1}$ 과 $0<m_1<\\cdots<m_r<1$ 에 대한 것이다."}, "model:hamiltonian": {"title": "Hamiltonian $H_N$, 분배함수 $Z_N$, pressure $F_N$", "math": "서로 독립인 $M_N\\sim\\mathrm{Pois}(\\alpha N)$, $\\theta$ 의 독립 사본 $\\theta_k$, $h$ 의 독립 사본 $h_i$, 독립 균일 index $i_{\\ell,k}\\in[N]=\\{1,\\ldots,N\\}$ 에 대해\n$$-H_N(\\sigma)=\\sum_{k=1}^{M_N}\\theta_k(\\sigma_{i_{1,k}},\\ldots,\\sigma_{i_{p,k}})+\\sum_{i=1}^Nh_i\\sigma_i,\\qquad Z_N=\\sum_{\\sigma\\in\\{-1,1\\}^N}e^{-H_N(\\sigma)},\\qquad F_N=\\frac1N\\mathbb E\\log Z_N.\\tag{2.2}$$\n이 정의의 모든 족은 서로 독립이다. 특히 index는 복원추출이다(한 factor 안에서 같은 site가 반복될 수 있다). 모형 매개변수와 disorder 법칙은 $N$ 이 변해도 고정이다."}, "model:integrability": {"title": "매개변수 $p$, $\\alpha$, 법칙 $\\theta$, $h$ 와 1차 moment 가정 (2.1)", "math": "짝수 정수 $p\\ge2$ 와 $\\alpha>0$ 을 고정한다. $\\theta$ 는 $\\{-1,1\\}^p$ 위의 무작위 실함수, $h$ 는 실수 확률변수이다. $B(\\theta)=\\max_s\\lvert\\theta(s)\\rvert$ 로 쓰고\n$$\\mathbb E B(\\theta)+\\mathbb E\\lvert h\\rvert<\\infty\\tag{2.1}$$\n를 가정한다."}, "model:positivity": {"title": "부호 조건 (2.4)", "math": "(2.3)의 $b$ 에 대해\n$$\\mathbb E[(-b)^n]\\ge0\\qquad(n\\ge1).\\tag{2.4}$$\n이 기대값들은 유한한 실수 기대값으로 해석한다."}, "model:power-means": {"title": "조건부 power mean $T_d$ (2.10)", "math": "$0\\le d<r$ 에 대해 $\\mathscr F_d$ 는 이 식들($V_{\\rm s}$, $V_{\\rm e}$)의 모든 물리적 disorder와 모든 $\\eta^\\omega_j$ ($0\\le j\\le d$) 가 생성하는 $\\sigma$-field다.\n$$T_rV=V,\\qquad T_dV=\\Bigl(\\mathbb E\\bigl[(T_{d+1}V)^{m_{d+1}}\\bigm|\\mathscr F_d\\bigr]\\Bigr)^{1/m_{d+1}}\\quad(d=r-1,\\ldots,0).\\tag{2.10}$$\n이 조건부 기대값에서는 보조 message만 적분된다. 예: 깊이 1($r=1$)에서 $T_0V=(\\mathbb E_x[V^{m_1}\\mid\\boldsymbol\\eta_0])^{1/m_1}$. 깊이 2($r=2$)에서는 각 label이 $\\eta_0\\sim\\zeta$, $\\eta_1\\mid\\eta_0\\sim\\eta_0$, $x\\mid\\eta_1\\sim\\eta_1$ 을 뽑고\n$$T_0V=\\Bigl(\\mathbb E_{\\boldsymbol\\eta_1}\\Bigl[\\bigl(\\mathbb E_{\\boldsymbol x}[V^{m_2}\\mid\\boldsymbol\\eta_1]\\bigr)^{m_1/m_2}\\Bigm|\\boldsymbol\\eta_0\\Bigr]\\Bigr)^{1/m_1}.$$\n굵은 기호는 $V$ 안의 모든 message label을 모은 것이고, 두 줄임 표기를 포함해 물리적 disorder는 내내 고정된다."}, "model:site-message": {"title": "cavity log-weight $U_\\theta$ (2.6)", "math": "$\\varepsilon\\in\\{-1,1\\}$ 에 대해\n$$U_\\theta(x_1,\\ldots,x_{p-1};\\varepsilon)=\\log\\sum_{s\\in\\{-1,1\\}^{p-1}}e^{\\theta(s_1,\\ldots,s_{p-1},\\varepsilon)}\\prod_{\\ell=1}^{p-1}q_{x_\\ell}(s_\\ell).\\tag{2.6}$$\n새 spin $\\varepsilon$ 은 $\\theta$ 의 마지막($p$ 번째) 좌표에 놓인다."}, "model:trial-bounds": {"title": "moment 조건 없는 유한성 (2.12)", "math": "(2.11)의 양들은 시행 message에 대한 moment 가정 없이 유한하다. power-mean 연산자가 점별 곱셈적 한계를 보존하고\n$$\\lvert\\log T_0V_{\\rm s}\\rvert\\le\\lvert h\\rvert+\\sum_{j=1}^kB(\\theta_j),\\qquad\\lvert\\log T_0V_{\\rm e}\\rvert\\le B(\\theta)\\tag{2.12}$$\n이기 때문이다."}, "model:ve": {"title": "edge 항 $V_{\\rm e}$ (2.9)", "math": "$\\theta$ (model:vs와 같은 줄에서 잡은 독립 사본)와 서로 다른 label의 message $x_1,\\ldots,x_p$ 에 대해\n$$V_{\\rm e}=C_\\theta(x_1,\\ldots,x_p).\\tag{2.9}$$"}, "model:vs": {"title": "site 분배함수 $V_{\\rm s}$ (2.8)", "math": "서로 독립인 $k\\sim\\mathrm{Pois}(\\alpha p)$, $\\theta,\\theta_1,\\ldots$ ($\\theta$ 의 사본), $h$ 를 잡고\n$$V_{\\rm s}=\\frac12\\sum_{\\varepsilon=\\pm1}\\exp\\Bigl(h\\varepsilon+\\sum_{j=1}^kU_{\\theta_j}(x_1^j,\\ldots,x_{p-1}^j;\\varepsilon)\\Bigr).\\tag{2.8}$$\nmessage $x^j_\\ell$ 는 서로 다른 label이다(model:chain)."}, "models:ground": {"title": "영온도 변분 극한 (Corollary 10.3, 식 (10.1))", "math": "models:spin, models:sat의 각 모형에서 극한\n$$g=\\lim_{N\\to\\infty}\\frac1N\\mathbb E\\max_\\sigma\\mathcal E_N(\\sigma)$$\n이 존재하고\n$$g=\\lim_{\\beta\\to\\infty}\\frac1\\beta\\inf_{r\\ge0}\\inf_{\\zeta,\\mathbf m}\\mathcal B_{r,\\beta}(\\zeta,\\mathbf m)\\tag{10.1}$$\n를 만족한다. 더 정확히는 온도 극한 안의 식이 $[g,g+\\log(2)/\\beta]$ 안에 있다. 단위 가중치 SAT에서는 변수당 위반 clause 최소 개수 기대값의 극한이 $-g$ 이다."}, "models:ground.s1": {"title": "유한 크기 끼움: $g_N\\le P_N(\\beta)/\\beta\\le g_N+\\log2/\\beta$", "math": "$g_N=N^{-1}\\mathbb E\\max_\\sigma\\mathcal E_N(\\sigma)$, $P_N(\\beta)=N^{-1}\\mathbb E\\log Z_N(\\beta)$ 로 쓴다. 1차 moment 가정으로 $g_N$ 은 유한하고 균일하게 유계다. spin 배치가 $2^N$ 개이므로\n$$g_N\\le\\frac{P_N(\\beta)}\\beta\\le g_N+\\frac{\\log2}\\beta.$$"}, "models:ground.s2": {"title": "각 $\\beta$ 에서 주정리: $\\limsup_Ng_N\\le I(\\beta)/\\beta\\le\\liminf_Ng_N+\\log2/\\beta$", "math": "고정한 각 $\\beta>0$ 에서 main:theorem이 $P_N(\\beta)\\to I(\\beta)$ 를 준다. 여기서 $I(\\beta)=\\inf_{r,\\zeta,\\mathbf m}\\mathcal B_{r,\\beta}(\\zeta,\\mathbf m)$ 이다. 그러므로\n$$\\limsup_Ng_N\\le\\frac{I(\\beta)}\\beta\\le\\liminf_Ng_N+\\frac{\\log2}\\beta.$$"}, "models:ground.s4": {"title": "SAT에서 최대화 = 위반 수 최소화", "math": "satisfiability 모형에서 음의 위반 개수를 최대화하는 것은 그 개수를 최소화하는 것과 같다."}, "models:sat": {"title": "soft random 짝수 $K$-SAT (Corollary 10.2)", "math": "짝수 정수 $K\\ge2$ 와 $\\alpha>0$ 을 고정한다. $\\varepsilon_1,\\ldots,\\varepsilon_K$ 는 독립인 공정한 부호이고, $W\\ge0$ 은 부호들과 독립이며 $\\mathbb EW<\\infty$ 이다. 모든 $\\beta>0$ 에 대해 상호작용\n$$\\theta_\\beta(s_1,\\ldots,s_K)=-\\beta W\\prod_{\\ell=1}^K\\frac{1+\\varepsilon_\\ell s_\\ell}{2},\\qquad h=0$$\n은 (2.13)을 만족한다. $W=1$ 이 soft random 짝수 $K$-SAT 모형이고, 일반 $W$ 는 독립인 음이 아닌 clause 가중치를 준다."}, "models:sat.s2": {"title": "(2.3)과 (2.4) 확인: $0\\le-b<1$", "math": "$a=1$, $b=e^{-\\beta W}-1$, $f_\\ell(s)=(1+\\varepsilon_\\ell s)/2$ 로 둔다. 함수들은 독립 사본이고 $b$ 와 독립이다. $0\\le-b<1$ 이므로 엄격한 곱 조건과 모든 부호 부등식이 성립한다."}, "models:sat.s3": {"title": "(2.1) 확인과 주정리 적용", "math": "또 $B(\\theta_\\beta)=\\beta W$ 이므로 main:theorem이 적용된다."}, "models:spin": {"title": "Viana–Bray와 희석 짝수 $p$-spin 모형 (Corollary 10.1)", "math": "짝수 정수 $p\\ge2$, $\\alpha>0$ 과 서로 독립인 실수 확률변수 $J,H$ 를 고정한다. $J$ 의 분포는 대칭이고 $\\mathbb E\\lvert J\\rvert+\\mathbb E\\lvert H\\rvert<\\infty$ 이다. 모든 $\\beta>0$ 에 대해\n$$\\theta_\\beta(s_1,\\ldots,s_p)=\\beta J\\prod_{\\ell=1}^ps_\\ell,\\qquad h_\\beta=\\beta H$$\n인 모형은 변분 공식 (2.13)을 만족하고, 시행 functional은 이 상호작용 법칙과 장 법칙에서 계산한다. 특히 $p=2$ 인 Viana–Bray 모형에서 성립한다."}, "models:spin.s1": {"title": "tanh 전개로 (2.3) 확인", "math": "$$a=\\cosh(\\beta J),\\qquad b=\\tanh(\\beta J),\\qquad f_\\ell(s)=s$$\n로 둔다. 함수 $f_\\ell$ 들은 결정적인 독립 사본이고, $\\lvert b\\rvert<1$ a.s. 이다."}, "models:spin.s2": {"title": "대칭 coupling으로 (2.4) 확인", "math": "대칭성 때문에 $b$ 의 모든 홀수 moment는 0이다. 짝수 moment는 음이 아니다."}, "models:spin.s3": {"title": "(2.1) 확인과 주정리 적용", "math": "$B(\\theta_\\beta)=\\beta\\lvert J\\rvert$, $\\lvert h_\\beta\\rvert=\\beta\\lvert H\\rvert$ 이다. 따라서 main:theorem의 모든 가정이 성립한다."}, "pert:analytic": {"title": "insertion 계수의 소멸 (Lemma 6.4)", "math": "섭동 족에 포함된 모든 mark specification, old tree, anchor, 유계 overlap 다항식 시험 $f$ 에 대해, $H_N(t,0)$ 의 $t=0$ 에서의 모든 Taylor 계수가 선택된 수열을 따라 0으로 간다."}, "pert:analytic-difference": {"title": "차 $H_N(t,u)=J_{N,\\mathcal T}-\\mathbb Ef\\,J_{N,\\{a_*\\}}$ (6.15)", "math": "$$H_N(t,u)=J_{N,\\mathcal T}(t,u)-\\mathbb Ef\\,J_{N,\\{a_*\\}}(t,u).$$\nsingle-anchor 식 $J_{N,\\{a_*\\}}$ 에서 시험함수는 $1$ 이다."}, "pert:analytic.s1": {"title": "균등한 해석적 경계", "math": "tree:extension-expansion이 복소 근방 $|t|,|u|<\\rho$ 를 주고, 거기서 (6.15)의 함수들은 해석적이며 $N$ 과 선택된 매개변수 벡터에 균등하게 유계다. $\\rho$ 를 줄이면 그 $u$-도함수에도 균등한 경계가 나온다. 이 상수들은 고정 tree, $L$, $\\|f\\|_\\infty$ 에 의존해도 되지만 mark specification 안의 type 첨자 $j$ 에는 의존하지 않는다."}, "pert:analytic.s2": {"title": "Taylor 계수의 수렴과 극한 해석함수 $H$", "math": "$H_N(t,0)$ 의 각 Taylor 계수는 prescribed tree 위 multioverlap moment와 그런 moment 두 개의 곱의 유한 일차결합이다. 그 계수는 고정 tree, 지수, mark 법칙, 다항식 시험으로 정해지고 $N$ 에 무관하다. 실제로 canceled anchor 전개는 고정된 차수마다 유한 개의 확장을 주고, 독립 insertion site를 평균하면 그 spin 곱이 multioverlap이 된다. 이 계수들은 pert:selection (iii)으로 수렴한다. 그러면 균등 해석적 경계가 Taylor 꼬리의 기하 경계를 통해 $H_N(t,0)$ 이 각 더 작은 원판에서 해석함수 $H(t)$ 로 균등 수렴함을 함의한다."}, "pert:analytic.s3": {"title": "$u_\\nu\\le2j^{-j}$ 로 극한 함수를 0으로", "math": "충분히 큰 모든 고정 $j$ 에 대해, 해당 type과 pert:palm이\n$$\\limsup_{N\\to\\infty}|H_N(j^{-1},0)|\\le C\\limsup_{N\\to\\infty}|u_{\\nu,N}|\\le2Cj^{-j}$$\n를 준다. 여기서 score 오차는 $j$ 고정에서 0으로 가고, pert:palm에 의해 모든 $j$ 에 같은 함수 $H_N$ 이 쓰인다. 따라서 $|H(j^{-1})|\\le2Cj^{-j}$ 이다. $H$ 의 첫 0 아닌 Taylor 계수가 차수 $q$ 였다면 충분히 큰 모든 $j$ 에서 $|H(j^{-1})|\\ge cj^{-q}$ 가 되어 모순이다. 따라서 $H$ 는 0 근처에서 항등적으로 0이고, 이것이 계수마다 주장을 증명한다."}, "pert:concentration": {"title": "매개변수 평균한 score 집중 (Lemma 6.1)", "math": "각 고정 $L$ 과 각 고정 type $\\nu$ 에 대해\n$$\\int e_{\\nu,N}(\\mathbf u)\\,\\pi(d\\mathbf u)\\longrightarrow0.$$\n이 주장은 원래 계에서와 마찬가지로 reservoir에서도 성립한다. 상수는 $L$ 이나 $\\nu$ 에 균등할 필요가 없다."}, "pert:concentration.s1": {"title": "type 하나 고정, 구간 $J_\\nu$ 와 score 경계 (6.6)", "math": "다른 매개변수를 고정하고 $u=u_\\nu$, $n=n_\\nu$, $\\lambda_\\nu=c_\\nu s_N$ 으로 쓴다. $I_\\nu$ 를 품는 열린 구간 $J_\\nu$ 를 그 폐포 전체에서 $|t_\\nu|+|u|<1/2$ 가 되도록 고른다. 이 구간에서 path마다\n$$|D_\\nu|\\le2n,\\qquad -4n\\le\\partial_uD_\\nu=-\\sum_{q=1}^{n}\\frac{(g_{0,q}S_{0,q})^2}{\\psi_{\\nu,q}^{2}}\\le0.$$"}, "pert:concentration.s2": {"title": "path 요동: 2차 미분이 조건부 분산을 누른다", "math": "$X_0(u)$ 를 root 기대값을 취하기 전의 무작위 root log 분배함수, $M_d=\\langle D_\\nu\\mid\\mathscr F_d\\rangle$ 라 하면\n$$X_0'(u)=\\langle D_\\nu\\rangle,\\qquad X_0''(u)=\\langle\\partial_uD_\\nu\\rangle+\\sum_{d=1}^{L}m_d\\langle(M_d-M_{d-1})^2\\rangle\\ge m_1\\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)-4n.$$\n$I_\\nu=[a,b]$ 에서 적분하면\n$$\\int_a^b\\mathbb E_{\\mathbf u}\\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)\\,du\\le\\frac{4\\lambda_\\nu(1+b-a)}{m_1},$$\n따라서 구간 평균한 thermal 평균 절대 편차를 $\\lambda_\\nu$ 로 나눈 것은\n$$\\left(\\frac{4(1+|I_\\nu|)}{m_1|I_\\nu|\\lambda_\\nu}\\right)^{1/2}$$\n이하다."}, "pert:concentration.s2.s1": {"title": "root logarithm의 미분 공식 (6.7), (6.8)", "math": "$X_0(u)$ 를 root 기대값을 취하기 전의 무작위 root log 분배함수라 하자. 마지막 단계도 미분에 넣기 위해 spin weight의 로그를 $X_L$ 로, spin 분배함수를 지수 $m_L=1$ 의 단계로 본다. backward 한 단계를 미분하면\n$$\\partial_uX_{d-1}=K_d(\\partial_uX_d),\\qquad\\partial_u^2X_{d-1}=K_d(\\partial_u^2X_d)+m_d\\operatorname{Var}_{K_d}(\\partial_uX_d).$$\n따라서 $M_d=\\langle D_\\nu\\mid\\mathscr F_d\\rangle$ 에 대해\n$$X_0'(u)=\\langle D_\\nu\\rangle,\\qquad X_0''(u)=\\langle\\partial_uD_\\nu\\rangle+\\sum_{d=1}^{L}m_d\\langle(M_d-M_{d-1})^2\\rangle\\ge m_1\\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)-4n.$$\n조건부 기대값과 분산은 현재 $u$ 의 tilted path 법칙을 쓴다. root를 고정하면 모든 도함수는 유계 score와 그 도함수로 정당화되고, 유한 recursion이 위 미분 공식을 정당화한다. 그 root 기대값은 Poisson 개수의 유한 moment로 정당화된다."}, "pert:concentration.s2.s2": {"title": "구간 적분과 path 요동의 경계 (6.9), (6.10)", "math": "(6.8)을 $I_\\nu=[a,b]$ 에서 적분하고 $|X_0'|\\le2n$ 을 쓰면\n$$\\int_a^b\\mathbb E_{\\mathbf u}\\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)\\,du\\le\\frac{4\\lambda_\\nu(1+b-a)}{m_1}.$$\n따라서 구간 평균한 thermal 평균 절대 편차를 $\\lambda_\\nu$ 로 나눈 것은\n$$\\left(\\frac{4(1+|I_\\nu|)}{m_1|I_\\nu|\\lambda_\\nu}\\right)^{1/2}$$\n이하다."}, "pert:concentration.s3": {"title": "root 요동의 재료: 볼록 함수 $G$ 와 그 분산 (6.11)", "math": "무작위 함수 $G(u)=X_0(u)+2nu^2$ 는 $J_\\nu$ 에서 볼록이고, $u\\in J_\\nu$ 와 다른 모든 매개변수에 균등하게\n$$\\operatorname{Var}(G(u))\\le C_\\nu N,\\qquad|\\mathbb E_{\\mathbf u}G'(u)|\\le C_\\nu\\lambda_\\nu.$$"}, "pert:concentration.s3.s2": {"title": "개수에 조건을 건 Efron–Stein 부등식", "math": "첫 추정을 증명하려고 물리적 개수와 섭동 총 개수에 조건을 건다. 섭동 총 개수가 주어지면 그 type과 site는 독립 label이고, label 하나를 바꾸면 유계 인자 하나가 바뀐다. Efron–Stein 분산 부등식\n$$\\operatorname{Var}Z\\le\\frac12\\sum_j\\mathbb E(Z-Z^{(j)})^2$$\n을 쓴다. $Z^{(j)}$ 는 $j$ 번째 입력을 독립으로 다시 뽑아 얻는다. 완전성을 위해: 독립 입력 $X_1,\\ldots,X_k$ 에 대해 $E_j$ 는 $X_j$ 만 적분하고 $\\mathscr G_j=\\sigma(X_1,\\ldots,X_j)$ 라 하자. Doob 차분은 $D_j=\\mathbb E[Z-E_jZ\\mid\\mathscr G_j]$ 이다. 직교성과 Jensen이\n$$\\operatorname{Var}Z=\\sum_j\\mathbb ED_j^2\\le\\sum_j\\mathbb E(Z-E_jZ)^2=\\frac12\\sum_j\\mathbb E(Z-Z^{(j)})^2$$\n을 준다. 이 독립 입력 분해는 같은 법칙도 대칭 통계량도 요구하지 않는다(Efron–Stein, Section 2)."}, "pert:concentration.s3.s3": {"title": "유계 차분, Lipschitz 조건부 평균, Poisson 분산", "math": "상호작용, 장, 섭동 항 하나를 다시 뽑으면 $X_0$ 는 유계만큼 바뀐다: spin weight에서는 바로 보이고 각 power mean이 이를 보존한다. 항을 없앨 때는 쓰지 않는 그 독립 mark 변수를 적분해 없앨 수 있으므로 항의 추가나 삭제에도 같은 주장이 성립한다. 따라서 조건부 분산은 root 변수 개수의 상수배 이하다. 조건부 평균은 개수의 Lipschitz 함수이고 Lipschitz 상수가 유계다. $Q,Q'$ 이 Poisson 변수의 독립 사본이고 $b$ 가 $C$-Lipschitz이면\n$$\\operatorname{Var}(b(Q))=\\tfrac12\\mathbb E(b(Q)-b(Q'))^2\\le C^2\\operatorname{Var}(Q).$$\n이것을 독립 개수들에 적용하면 $O(N)$ 추정이 끝난다. 보정 $2nu^2$ 도 같은 추정을 따른다. (6.11)의 도함수 경계는 (6.6)에서 바로 나온다."}, "pert:concentration.s4": {"title": "볼록 함수에서 도함수로, 그리고 두 기여의 합", "math": "$\\bar G=\\mathbb E_{\\mathbf u}G$ 로 두면\n$$\\frac1{|I_\\nu|}\\int_{I_\\nu}\\mathbb E_{\\mathbf u}|G'(u)-\\mathbb E_{\\mathbf u}G'(u)|\\,du\\le C_\\nu\\left(\\frac{\\sqrt N}{\\rho}+\\frac{\\rho\\lambda_\\nu}{|I_\\nu|}\\right)$$\n이고, $\\rho=N^{-1/8}$ 과 $\\lambda_\\nu=c_\\nu N^{3/4}$ 에서 $\\lambda_\\nu$ 로 나눈 양이 0으로 간다. $G'$ 의 보정을 없애는 비용은 $C_\\nu\\lambda_\\nu^{-1/2}$ 이하다. 그래서 (6.4)의 root 기여가 0으로 가고, (6.10)과 합쳐 $u_\\nu$ 적분 뒤 결과가 나온다. 모든 추정이 다른 매개변수에 균등하므로 나머지 곱측도로 적분해 (6.5)를 얻는다."}, "pert:concentration.s4.s1": {"title": "차분몫과 단조성으로 얻는 (6.12)", "math": "$\\bar G=\\mathbb E_{\\mathbf u}G$, $Z=G-\\bar G$ 로 둔다. $u\\pm\\rho$ 가 $J_\\nu$ 안에 있으면 앞·뒤 차분몫이\n$$|G'(u)-\\bar G'(u)|\\le\\frac{|Z(u-\\rho)|+2|Z(u)|+|Z(u+\\rho)|}{\\rho}+\\bar G'(u+\\rho)-\\bar G'(u-\\rho)$$\n를 준다. $\\bar G'$ 의 단조성이\n$$\\int_a^b[\\bar G'(u+\\rho)-\\bar G'(u-\\rho)]\\,du\\le2\\rho[\\bar G'(b+\\rho)-\\bar G'(a-\\rho)]$$\n를 준다. (6.11)과 함께 이것이\n$$\\frac1{|I_\\nu|}\\int_{I_\\nu}\\mathbb E_{\\mathbf u}|G'(u)-\\mathbb E_{\\mathbf u}G'(u)|\\,du\\le C_\\nu\\left(\\frac{\\sqrt N}{\\rho}+\\frac{\\rho\\lambda_\\nu}{|I_\\nu|}\\right)$$\n를 증명한다."}, "pert:concentration.s4.s2": {"title": "$\\rho=N^{-1/8}$, 보정 제거, 두 기여의 합", "math": "충분히 큰 모든 $N$ 에서 $\\rho=N^{-1/8}$ 로 잡으면 이것은 고정된 근방 여유 안에 있다. $\\lambda_\\nu=c_\\nu N^{3/4}$ 로 나누면 두 항 모두 0으로 간다. $G'$ 의 보정을 없애는 비용은 많아야 $C_\\nu\\mathbb E|n-\\lambda_\\nu|/\\lambda_\\nu\\le C_\\nu\\lambda_\\nu^{-1/2}$ 이다. 따라서 (6.4)의 root 기여가 0으로 간다. 이것을 (6.10)과 합치면 $u_\\nu$ 에 대한 적분 뒤 결과가 증명된다. 모든 추정이 다른 매개변수에 균등하므로 나머지 곱측도에 대해 적분하면 (6.5)가 증명된다."}, "pert:error": {"title": "score 오차 $e_{\\nu,N}(\\mathbf u)$ 와 기대값 $\\langle\\cdot\\rangle$, $\\mathbb E_{\\mathbf u}$ (6.4)", "math": "$\\langle\\cdot\\rangle$ 은 root가 주어진 조건부로 tilted path 하나를 따른 기대값, $\\mathbb E_{\\mathbf u}$ 는 고정된 $\\mathbf u$ 에서 root를 평균하는 것이다.\n$$e_{\\nu,N}(\\mathbf u)=\\frac{1}{c_\\nu s_N}\\mathbb E_{\\mathbf u}\\Big\\langle\\big|D_\\nu-\\mathbb E_{\\mathbf u}\\langle D_\\nu\\rangle\\big|\\Big\\rangle.$$"}, "pert:factor": {"title": "Poisson 섭동 factor $\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$ (6.2)", "math": "type들을 $\\nu\\in\\mathbb N$ 으로 번호 매기고 $c_\\nu>0$, $\\sum_\\nu c_\\nu=1$ 인 상수를 고른다. type마다 독립으로 $n_\\nu\\sim\\operatorname{Poisson}(c_\\nu s_N)$, $s_N=N^{3/4}$ 로 둔다. 각 항은 독립 균일 site $i\\in[N]$ 와 자기 mark 과정의 독립 사본을 가진다. leaf에서 각 항은 spin weight에\n$$\\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0$$\n를 곱한다. 특히 $1/2<\\psi_\\nu<3/2$ 이다. 개수, type, site는 root에 속하고, mark 변수는 product prior로 배정된 보조 깊이에서 뽑힌다. 총 개수가 $\\operatorname{Poisson}(s_N)$ 이므로 이 구성은 거의 확실히 유한 개의 항만 쓴다. factor 경계는 (cavity:negligible)에서처럼 power mean을 거친 항별 비교를 허락한다."}, "pert:palm": {"title": "Palm 항등식 (Lemma 6.3)", "math": "$\\nu$ 가 지정된 mark를 가진 type이면\n$$|H_N(t_\\nu,u_\\nu)|\\le\\|f\\|_\\infty e_{\\nu,N}.$$\n고정된 mark specification에 대해 함수 $H_N(t,u)$ 는 그 모든 type $j$ 에 대해 같다: base reservoir는 모든 type을 포함한 원래 Poisson 족 전체를 담는다."}, "pert:palm-expression": {"title": "insertion 기대값 $J_{N,\\mathcal T}(t,u)$ (6.14)", "math": "고정된 mark specification에 대해 독립인 새 균일 site와 그 mark 과정의 독립 사본을 도입하고 $A=1+tg\\sigma_i+ug_0S_0$ 로 둔다. $Y$ 를 tree:insertion의 insertion recursion, $W_{\\mathcal T}(A)$ 를 updated-tree 밀도 (tree:density)라 하자. 아래 식의 기대값은 수정하지 않은 reservoir를 독립 insertion 변수와 그 prior kernel로 넓힌 것을 쓴다:\n$$J_{N,\\mathcal T}(t,u)=\\mathbb E\\left[f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A^{a_*}}W_{\\mathcal T}(A)\\right].$$"}, "pert:palm.s1": {"title": "Poisson add-one 항등식으로 score를 insertion으로", "math": "$D_\\nu$ 의 type-$\\nu$ 항 합에 Poisson add-one 항등식을 적용한다. 평균 $c_\\nu s_N$ 으로 나눈 뒤, 남은 개수는 다시 평균 $c_\\nu s_N$ 의 Poisson이고 다른 모든 개수는 바뀌지 않는다. 따라서 남은 모형은 정확히 원래 reservoir 법칙을 가진다. 구별된 항은 매개변수 $t_\\nu,u_\\nu$ 의 독립 새 insertion이 된다. 그 score는 $g_0^{a_*}S_0^{a_*}/A^{a_*}$ 이다. updated tree 밀도는 (tree:density)이므로 anchor 인자 $A^{a_*}$ 가 상쇄된다. 이로써\n$$\\frac{\\mathbb E[fD_\\nu^{a_*}]}{c_\\nu s_N}=J_{N,\\mathcal T}(t_\\nu,u_\\nu),\\qquad\\frac{\\mathbb E\\langle D_\\nu\\rangle}{c_\\nu s_N}=J_{N,\\{a_*\\}}(t_\\nu,u_\\nu).$$"}, "pert:palm.s2": {"title": "(6.16)과 $H_N$ 의 type 무관성", "math": "이제 (6.16)은 (6.13)에서 나온다. 특히 base reservoir의 법칙에서 어떤 type도 지워지지 않았다. 이것이 마지막 주장을 증명한다."}, "pert:parameters": {"title": "섭동 type $\\nu$ 와 매개변수 $t_\\nu=1/j$, $u_\\nu\\in[j^{-j},2j^{-j}]$ (6.1)", "math": "두 매개변수의 역할은 다르다: $u$ 에 대한 미분은 집중하는 score를 내고, $t$ 의 값들은 insertion의 Taylor 전개를 탐침한다. $u$ 를 $t$ 의 모든 고정 거듭제곱보다 작게 잡으면 각 극한 Taylor 계수가 0이 된다. 각 specification마다 모든 정수 $j\\ge4$ 로 첨자 붙은 type을 둔다. specification과 $j$ 에 대응하는 type $\\nu$ 는\n$$t_\\nu=j^{-1},\\qquad I_\\nu=[j^{-j},2j^{-j}],\\qquad u_\\nu\\in I_\\nu$$\n를 가진다."}, "pert:score": {"title": "perturbation score $D_\\nu$ (6.3)", "math": "type $\\nu$ 하나에 대해, tilted path(그 말단 Gibbs 배치 포함) 위에서\n$$D_\\nu=\\sum_{q=1}^{n_\\nu}\\frac{g_{0,q}S_{0,q}}{1+t_\\nu g_q\\sigma_{i_q}+u_\\nu g_{0,q}S_{0,q}}$$\n로 정의한다."}, "pert:score-identity": {"title": "anchor score와 시험함수의 분리 부등식 (6.13)", "math": "(6.4)는 각 고정 type $\\nu$ 에 대해\n$$\\left|\\frac{\\mathbb E[fD_\\nu^{a_*}]-\\mathbb Ef\\,\\mathbb E\\langle D_\\nu\\rangle}{c_\\nu s_N}\\right|\\le\\|f\\|_\\infty e_{\\nu,N}\\longrightarrow0$$\n을 함의한다."}, "pert:selection": {"title": "결정적 매개변수 선택 (Lemma 6.2)", "math": "고정한 모든 $L\\ge2$ 와 $\\varepsilon>0$ 에 대해, 크기 $N_j\\uparrow\\infty$ 와 결정적 벡터 $\\mathbf u_j$ 가 있어 다음이 성립한다.\n(i) $\\Delta_{N_j}(\\mathbf u_j)\\le\\underline F+2\\varepsilon$;\n(ii) 모든 고정 type $\\nu$ 에 대해 reservoir에서 $e_{\\nu,N_j}(\\mathbf u_j)\\longrightarrow0$;\n(iii) reservoir에서, 깊이 $L$ 의 모든 고정 유한 prescribed tree 위 multioverlap의 모든 유한곱의 기대값이 이 수열을 따라 수렴한다."}, "pert:selection.s1": {"title": "매개변수 평균한 증분이 낮은 크기가 무한히 많다", "math": "균일 섭동 경계 (cavity:negligible)가\n$$\\liminf_N\\frac1N\\int P_N^{L,\\mathbf u}\\,\\pi(d\\mathbf u)=\\underline F$$\n를 준다. 따라서 무한히 많은 $N$ 이 $\\int\\Delta_N\\,d\\pi\\le\\underline F+\\varepsilon$ 을 만족한다: 그렇지 않으면 평균 증분의 telescoping이 이 liminf와 모순이다. cavity:increment가 $|\\Delta_N(\\mathbf u)|\\le C$ 가 균등하게 성립하는 상수 $C$ 를 준다."}, "pert:selection.s2": {"title": "score 오차가 작은 매개변수를 Markov 부등식으로 고르기", "math": "유한 개 type 모임에 대해 pert:concentration과 Markov 부등식은 그 오차가 모두 작은 집합의 매개변수 측도가 1로 감을 보인다. 구체적으로, 앞의 무한 집합에서 $N_j$ 를 차례로 충분히 크게 골라\n$$\\sum_{\\nu\\le j}\\int e_{\\nu,N_j}(\\mathbf u)\\,\\pi(d\\mathbf u)\\le j^{-3}$$\n이 되게 한다. 그러면 모든 $\\nu\\le j$ 에서 $e_{\\nu,N_j}\\le j^{-1}$ 인 집합 $G_j$ 의 여집합 측도는 $q_j\\le j^{-2}$ 이다. $G_j$ 위 조건부 평균 증분은 충분히 큰 모든 $j$ 에서\n$$\\frac{\\underline F+\\varepsilon+Cq_j}{1-q_j}\\le\\underline F+2\\varepsilon$$\n이하다. 따라서 $G_j$ 안에서 증분이 $\\underline F+2\\varepsilon$ 이하인 벡터를 고를 수 있다. 꼬리를 다시 번호 매기면 (i)과 (ii)가 증명된다."}, "pert:selection.s3": {"title": "대각 부분수열로 모든 유한 tree moment를 수렴시키기", "math": "고정 $L$ 에서 유한 labeled tree 모양과 그 multioverlap의 유한곱은 가산 모임을 이룬다. 각 곱은 절댓값이 1 이하다. 대각 부분수열이 (iii)을 주고 (i)이나 (ii)에 영향을 주지 않는다."}, "pert:tree-identity": {"title": "prescribed tree 위의 항등식 (Theorem 6.5)", "math": "위에서 정의한 섭동 족에 대해, pert:selection의 모든 수열을 따라\n$$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E[R_E]\\longrightarrow0.$$\n이것은 모든 고정 old tree, 두 종류의 anchor 모두, 그 multioverlap의 모든 유계 다항식 $f$, 순서 붙은 추가 color의 모든 유한 개수, 지정된 모든 제약 $\\mathcal C$ 에 대해 성립한다. 빈 추가도 허용된다. 오차는 고정 $L$, 고정 tree, 고정 제약에서, $L$ 에 대한 어떤 극한보다도 먼저 0으로 보낸다."}, "pert:tree-identity.s1": {"title": "$k=0$ 과 polarization: 혼합 도함수를 같은 방향 계수로", "math": "$k=0$ 이면 주장은 상수 mark를 쓴 pert:analytic의 상수 계수 소멸이다. $k\\ge1$ 이면 서로 다른 colored mark를 뽑는 법을 설명한다. 모두 1 이하로 유계이고 같은 유한 개 보조 mark 모임에서 함께 만든 유리수값 함수 $g_0,g_1,\\ldots,g_k$ 를 고정한다. 혼합 insertion은 $A=1+\\sum_{j=1}^kz_jg_j\\sigma_i$ 를 쓴다. 모든 $z_j$ 에 대한 그 혼합 도함수는 단일 $g$ 에 대한 $k$ 차 계수를 polarization해서 얻는 대칭 다중선형 형식이다. 구체적으로 $Q_N(g)=k![t^k]H_N(t,0)$ 이면 혼합 도함수는\n$$\\frac{k^k}{2^kk!}\\sum_{\\epsilon\\in\\{-1,1\\}^k}\\left(\\prod_{j=1}^k\\epsilon_j\\right)Q_N\\left(k^{-1}\\sum_{j=1}^k\\epsilon_jg_j\\right)$$\n이다. $Q_N$ 의 모든 인자는 유리수값이고 1 이하로 유계이므로, 그 결과 각 쌍 $(g,g_0)$ 은 고정된 mark 족에 든다. pert:analytic이 위의 혼합 도함수를 0으로 보낸다. 혼합 도함수의 전개는 정확히 순서 붙은 확장 규칙이다: 그 계수에 추가 factorial은 없다."}, "pert:tree-identity.s2": {"title": "mark selector (6.18)", "math": "mark에 대한 기대값이 $\\mathcal C$ 를 만족하는 확장만 정확히 고르게 하는 일이 남았다. color 쌍 $a,b\\in\\{0,\\ldots,k\\}$ 와 깊이 $1\\le d\\le L-1$ 에 대해, 그 split 깊이가 $d$ 이상이라는 사건은 두 color가 깊이 $d$ 의 vertex를 공유한다는 사건이다. 그 깊이에 새 독립 Rademacher 좌표를 도입하고 $g_a$ 와 $g_b$ 모두에 그 인자를 준다. 그것이 둘의 결합 mark 기대값에 주는 기여는 vertex가 공유되면 $1$, 아니면 $0$ 이다. 이런 요구의 유한 모임에 대해서는 서로 다른 요구에 서로 다른 독립 좌표를 쓰고 각 $g_a$ 를 그에게 배정된 인자들의 곱으로 정의한다. 그러면\n$$\\mathbb E_{\\rm marks}\\left[g_0^{a_*}\\prod_{j=1}^kg_j^{a_j(E)}\\right]=\\prod_{(a,b,d)\\ {\\rm required}}\\mathbf1_{\\{a,b\\text{ share their depth-}d\\text{ vertex}\\}}.$$\n이 계산의 모든 mark는 base reservoir와 독립이다."}, "pert:tree-identity.s3": {"title": "정확한 split 깊이 $H_d-H_{d+1}$ 과 모양의 선택", "math": "$H_d(a,b)$ 를 (6.18)의 공유 지시함수라 하고, 서로 다른 replica 위치에 대해 $H_0=1$, $H_L=0$ 으로 둔다. 이것은 sampled tree 안의 위치이며, 그 spin 배치가 우연히 같아도 그렇다. 깊이 $d$ 에서의 정확한 갈라짐은 $0\\le d\\le L-1$ 에 대해 $H_d-H_{d+1}$ 로 표현된다. 따라서 곱과 유한 일차결합이 지정된 임의의 일관된 colored 모양이나 허용 모양의 모임을 고른다. 이 유한 일차결합의 각 항에서 함수 $g_0,\\ldots,g_k$ 는 부호의 곱이므로 값이 $\\{-1,1\\}$ 에 있다. 이 함수들과 그 polarization 평균은 절의 처음에 고정한 mark 족에 든다. 상수 mark가 $k=0$ 을 덮는다."}, "pert:tree-identity.s4": {"title": "조립: 혼합 전개, mark 평균, site 평균", "math": "마지막으로 혼합 canceled-anchor 전개를 차 (6.15)에 적용하고, selector를 써서 mark를 평균하고, 독립 균일 insertion site를 평균한다. 마지막 평균이 정확히 $R_E$ 다. pert:analytic과 polarization이 계수 차를 0으로 보내 (6.17)을 낳는다. 유한 일차결합이 결론을 overlap 단항식에서 진술된 시험함수로 넓힌다. 이 구성은 깊이 $L-1$ 까지의 mark만 쓴다: 확장 규칙은 anchor나 이미 쓴 color를 다시 쓰지 않으므로 깊이 $L$ 에서의 일치 검사가 필요 없다."}, "reduction:stability": {"title": "Stability ($L^1$ 안정성과 상수 이동)", "math": "$p$ 와 $\\alpha$ 를 고정하고, 각각 (2.1)을 만족하는 두 상호작용 법칙 $\\theta,\\theta'$ 와 두 장 법칙 $h,h'$ 를 결합한다. $D=\\mathbb E\\max_s\\lvert\\theta(s)-\\theta'(s)\\rvert$, $d=\\mathbb E\\lvert h-h'\\rvert$ 로 두면\n$$\\lvert F_N-F_N'\\rvert\\le\\alpha D+d,\\tag{reduction:free-stability}$$\n$$\\lvert\\mathcal B_r(\\zeta,\\mathbf m)-\\mathcal B_r'(\\zeta,\\mathbf m)\\rvert\\le\\alpha(2p-1)D+d\\tag{reduction:trial-stability}$$\n가 $N$, $r$, 모든 시행 법칙에 균일하게 성립한다($r=0$ 포함). $c$ 가 상호작용에 딸린 적분 가능한 무작위 상수이고 $\\widehat\\theta=\\theta-c$ 이면\n$$\\widehat F_N=F_N-\\alpha\\mathbb Ec,\\qquad\\widehat{\\mathcal B}_r=\\mathcal B_r-\\alpha\\mathbb Ec.\\tag{reduction:shift}$$"}, "reduction:stability.s1": {"title": "pressure 안정성 (reduction:free-stability)", "math": "두 Hamiltonian에 같은 개수와 index를 쓴다. 점별 log-weight 차이는 상호작용 sup-norm 차이들과 장 차이들의 합 이하다. 분배함수의 logarithm은 이 한계를 보존하고, 이것이 (reduction:free-stability)를 준다."}, "reduction:stability.s2": {"title": "시행 functional 안정성 (reduction:trial-stability)", "math": "각 cavity 상호작용 $U_\\theta$ 는 대응하는 상호작용 sup-norm 차이 이하로 바뀌고, 각 edge logarithm $\\log C_\\theta$ 도 그렇다. power mean은 이 root-가측 한계를 보존한다. site 항은 평균 $\\alpha p$ 개의 상호작용을 갖고 edge 항의 계수는 $\\alpha(p-1)$ 이므로 (reduction:trial-stability)가 나온다."}, "reduction:stability.s3": {"title": "상수 이동 (reduction:shift)", "math": "(reduction:shift)에 대해: 물리 상수는 spin 분배함수와 모든 power mean 밖으로 나온다. functional에서 site 항은 $-\\alpha p\\mathbb Ec$ 만큼 이동하고 edge 항은 $+\\alpha(p-1)\\mathbb Ec$ 를 보태므로 알짜 이동은 $-\\alpha\\mathbb Ec$ 다."}, "tree:averaging-remark": {"title": "깊이 평균을 $Q_k$ 평균으로 옮기기", "math": "고정 $k$에 대해 labeled topology는 유한 개다. 그러므로 (tree:assignment-probability)는 $a$개 branching 좌표를 가진 topology에 대한 정규화하지 않은 깊이 평균 $L^{-a}\\sum$을 그 topology의 $Q_k$ 아래 기여에 대한 상계로 바꾼다. 부분 모양 위의 오차에 대해서도 같다: 부분 모양이 버리는 좌표에 대해 합하는 비용은 많아야 해당하는 $L$의 거듭제곱이다. (tree:irregular-probability)와 함께, 이것이 regular 깊이 배정 위의 평균 추정을 log 전개에서 쓸 수 있게 한다."}, "tree:charging": {"title": "Charging fresh splits (fresh split에 작은 인자 매기기)", "math": "($m_d=d/L$, $\\delta=L^{-1}$로 둔다.) $q$개 leaf를 가진 old tree에서 시작해 canceled-anchor 확장 규칙으로 $k$개 color를 준다. anchor와 color들의 reference 모양을 처방한다. 허용 확장에 추가 제한이 있어도 된다. 그 모양의 지정된 branching vertex $b$개의 깊이가 old tree 어디에서도 branching 깊이가 아니라고 하자. 그러면\n$$\\sum_{E\\text{ allowed}}|c_E|\\leq C_{q,k}\\delta^b.$$\n상수는 $L$, 지정된 깊이, 서로 다른 vertex에서의 깊이 일치에 무관하다."}, "tree:charging.s1": {"title": "한 걸음의 절댓값 계수 합", "math": "현재 tree의 leaf가 $s$개이면 (tree:telescoping)은 모든 fresh 선택의 절댓값 계수 합이 $s$라고 말한다. 자격 있는 old 선택은 많아야 $s$개다. 그래서 제한 없는 걸음의 절댓값 계수 합은 $2s\\leq2(q+k)$ 이하다. 고정된 깊이에는 vertex가 많아야 $s$개다. 걸음을 지정된 깊이의 unary vertex에서의 fresh divergence로 제한하면 절댓값 계수 합은 $s\\delta$ 이하다. 그런 divergence의 계수가 각각 $m_d-m_{d+1}=-\\delta$이기 때문이다."}, "tree:charging.s2": {"title": "target vertex를 생성 걸음에 배정", "math": "허용된 history 하나와 그 지정된 target branching vertex 하나를 생각한다. 그 vertex는 old tree에서 이미 branching일 수 없다. 현재 tree에서 그것이 처음 branching이 된 걸음에서, 따라서 fresh path가 그것이 unary일 때 거기서 갈라졌어야 한다. 그 vertex 자체는 더 앞서 새 unary path의 일부로 만들어졌을 수 있다. 그때도 같은 결론이 성립한다. 서로 다른 target vertex는 서로 다른 걸음에서 branching이 된다. fresh path 하나는 branching vertex를 하나만 만들기 때문이다. $b$개 vertex 각각을 그 생성 걸음에 배정한다. 가능한 배정은 많아야 $k!/(k-b)!$가지다(그리고 반드시 $b\\leq k$)."}, "tree:extension-expansion": {"title": "Canceled-anchor expansion (anchor 상쇄 전개)", "math": "$H$를 old tree 위 변수들의 유계 함수로, 삽입 매개변수가 변해도 고정된 것이라 하자. 유계 실수 path 함수 $D_j$와 $A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$에 대해\n$$\\left.\\partial_{t_1}\\cdots\\partial_{t_k}E_{\\mathcal T}^{A_{\\boldsymbol t}}\\frac{H}{A_{\\boldsymbol t}^{a_*}}\\right|_{\\boldsymbol t=0}=\\sum_Ec_E\\,E_{\\mathcal T_E}\\left[H\\prod_{j=1}^kD_j^{a_j(E)}\\right].$$\n이 공식은 color의 어떤 고정된 순서에서도 성립한다. 같은 방향 $D_j=D$이면 $t^k$의 계수는 우변을 $k!$로 나눈 것이다. 위에서 세운 해석적 경계가 좌변에 kernel에 대해 균등하게 적용된다. 빈 확장의 무게는 $1$이다."}, "tree:extension-expansion.s1": {"title": "미분 규칙의 반복: 선택지는 old leaf 또는 fresh path", "math": "$C=\\{a_*\\}$, $G=H$에서 시작한다. 앞의 규칙(x:tree-differentiation-rule)을 차례로 적용하며 각 새 $D_j$를 $G$에 넣는다. fresh leaf는 곧바로 protected이므로 protected가 아닌 leaf는 쓰지 않은 old leaf뿐이다. (작성자) 혼합 편미분은 순서에 무관하므로(좌변은 $\\boldsymbol t$에 해석적, x:tree-analytic-bounds) 어떤 color 순서로 규칙을 적용해도 같은 좌변을 준다. 그래서 공식은 color의 어떤 고정된 순서에서도 성립한다."}, "tree:extension-expansion.s2": {"title": "$\\boldsymbol t=0$ 에서 계수만 남는다", "math": "$\\boldsymbol t=0$에서 모든 인자 $A$와 $Y$는 $1$이다. 이것이 주장한 규칙과 그 계수를 증명한다. (작성자) $D_j=D$이면 좌변은 $s=\\sum_jt_j$의 함수의 $k$계 도함수이므로 $t^k$의 계수는 우변$/k!$이다. $k=0$이면 유일한 항은 빈 history($c=1$, $\\mathcal T_E=\\mathcal T$)이므로 빈 확장의 무게는 $1$이다."}, "tree:first-variation": {"title": "첫 변분: $\\partial_{t_j}\\log Y_d$ 는 새 path 하나의 조건부 기대값", "math": "$A_{\\boldsymbol t}=1+\\sum_{j=1}^kt_jD_j$이고 실수 path 함수 $D_j$가 유계일 때, $A_{\\boldsymbol t}$가 균등하게 양인 실수 근방 어디서나 미분하면\n$$\\partial_{t_j}\\log Y_d=E^{A_{\\boldsymbol t}}\\left[\\left.\\frac{D_j}{A_{\\boldsymbol t}}\\right|\\mathscr F_d\\right].$$\n우변의 조건부 기대값은 지정된 prefix 아래로 새 path 하나를 따른다. 실제로 power mean 하나를 미분하면 $\\partial_{t_j}\\log Y_{d-1}=K_d^{A_{\\boldsymbol t}}\\partial_{t_j}\\log Y_d$이고, 말단 도함수는 $D_j/A$이다."}, "tree:insertion": {"title": "Insertion calculus (삽입 미적분)", "math": "leaf 분배함수를 지수 $m_1,\\ldots,m_{L-1}$의 power mean으로 반복하고 $K_1,\\ldots,K_{L-1}$이 그 tilted kernel (tree:original-tilt), $K_L$이 말단 Gibbs kernel이라 하자. 각 spin weight에 $A$를 곱하면 반복된 root logarithm이 $\\log Y_0$만큼 바뀐다. 여기서 (tree:Y-recursion)은 insertion 전의 kernel을 쓴다. 새 kernel은 (tree:updated-kernel)이다."}, "tree:insertion.s1": {"title": "backward induction: root log의 변화와 바뀐 kernel", "math": "말단 spin 적분에서 분배함수 비는 $m_L=1$이므로 $K_LA=Y_{L-1}$이다. $X_d$, $X_d^A$를 옛·새 backward logarithm이라 하면, 앞 power mean에 대입해\n$$\\exp\\bigl(m_d(X_{d-1}^A-X_{d-1})\\bigr)=K_d\\exp\\bigl(m_d(X_d^A-X_d)\\bigr).$$\nbackward induction이 $X_d^A-X_d=\\log Y_d$를 보이고, 이어서 (tree:updated-kernel)을 준다. $d=L$에서 같은 공식은 보통의 Gibbs 밀도비다."}, "tree:insertion.s2": {"title": "edge 밀도비의 곱 → $W_{\\mathcal T}(A)$", "math": "(tree:updated-kernel)의 edge 밀도비를 tree 위에서 곱한다. 양의 깊이 $d$의 내부 vertex는 들어오는 edge에서 지수 $m_d$를, 나가는 edge들에서 지수 $-n_\\beta m_{d+1}$를 받는다. root에는 들어오는 edge가 없고 이는 $m_0=0$과 맞는다. 각 말단 vertex는 지수 $m_L=1$을 받는다. 이것이 (tree:density)를 증명한다."}, "tree:insertion.s3": {"title": "단조성과 동차성", "math": "단조성과 동차성은 (tree:Y-recursion)에서 backward induction으로 바로 나온다: $a\\le Y_d\\le b$이면 $a^{m_d}\\le K_dY_d^{m_d}\\le b^{m_d}$이므로 $a\\le Y_{d-1}\\le b$ ($a,b$는 root-가측이므로 kernel 적분에서 상수). $A\\mapsto cA$이면 $Y_d\\mapsto cY_d$."}, "tree:log-expansion": {"title": "Logarithmic expansion (log 전개)", "math": "유계 실수 path 함수 $D$와 $A=1+tD$에 대해\n$$\\log Y_0=\\sum_{k\\geq1}\\frac{(-1)^{k-1}t^k}{k}\\mathbb E_{Q_k}E_{\\mathcal T}\\prod_{a=1}^kD^a,\\qquad |t|\\|D\\|_\\infty<1.$$\n이 항등식은 root가 주어진 조건부다. $|t|\\|D\\|_\\infty\\leq c<1$이면 차수 $K$ 뒤의 나머지의 절댓값은\n$$\\sum_{k>K}\\frac{c^k}{k}$$\n이하다. (작성자 보탬, 원문 문맥에서 읽은 것: $Y_0$은 insertion 전 kernel로 계산한 (tree:Y-recursion), $\\mathcal T$는 $Q_k$로 뽑은 tree, $E_{\\mathcal T}$는 그 위의 원래 kernel 표본 기대값이다.)"}, "tree:log-expansion.s1": {"title": "$k$차 도함수 = $(-1)^{k-1}(k-1)!\\,\\mathbb E_{Q_k}$", "math": "(tree:first-variation)에 의해 1차 도함수는 updated path 하나 위의 $D/A$의 기대값이다. 그 leaf를 protected로 둔다. 이후의 모든 도함수는 fresh path를 붙이는 것밖에 할 수 없다. 현재의 leaf가 모두 protected이기 때문이다. 차수 $k$에서 $k-1$개의 fresh 계수는 모두 음이다. (tree:telescoping)으로 정규화하면 그 절댓값의 곱은 $Q_k$의 확률의 $(k-1)!$배다. 따라서\n$$\\left.\\frac{d^k}{dt^k}\\log Y_0\\right|_{t=0}=(-1)^{k-1}(k-1)!\\,\\mathbb E_{Q_k}E_{\\mathcal T}\\prod_{a=1}^kD^a.$$"}, "tree:log-expansion.s2": {"title": "해석성, 수렴 영역, 꼬리 경계", "math": "해석성이 (tree:log-series)를 증명한다. 계수의 절댓값은 $\\|D\\|_\\infty^k/k$ 이하이고, 이것이 말한 수렴 영역과 (tree:log-tail)을 증명한다."}, "tree:multioverlap": {"title": "multioverlap $R_S$ 와 기대값 $\\mathbb E$ 의 약속", "math": "말단 변수가 spin 배치 $\\sigma^a\\in\\{-1,1\\}^N$일 때 replica leaf의 부분집합 $S$ 위 multioverlap은\n$$R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a,\\qquad R_\\varnothing=1.$$\n이하 첨자 없는 기대값 $\\mathbb E$는 root와 지시된 tree의 표본추출을 함께 포함한다."}, "tree:original-tilt": {"title": "분배함수에서 만든 tilted kernel", "math": "$P_d$ ($1\\le d<L$)를 보조 prior kernel이라 하고 $X_{L-1}=\\log Z$로 두고 재귀적으로\n$$X_{d-1}=m_d^{-1}\\log P_de^{m_dX_d}\\qquad(1\\le d<L)$$\n로 정한다. 대응하는 tilted kernel은\n$$K_d(dz\\mid\\mathscr F_{d-1})=e^{m_d(X_d(z)-X_{d-1})}P_d(dz\\mid\\mathscr F_{d-1}),\\qquad 1\\le d<L$$\n이다. recursion에 의해 확률 kernel이다. 마지막 kernel $K_L$은 보조 prefix가 주어진 spin 배치의 Gibbs 분포다. $L=1$이면 이 마지막 kernel만 있다."}, "tree:reference-total": {"title": "Reference-path totals (reference 경로 합)", "math": "다음 color가 지정된 reference prefix를 깊이 $d$까지 따라간 뒤, 그곳에서 reference path를 담은 $j\\ge1$개의 자식 모두와 다른 자식으로 들어가야 한다고 하자. 이 조상 제약 말고는 그 이음은 제한이 없다. 그러면 허용된 모든 선택의 계수 합은\n$$m_d-jm_{d+1}$$\n이다. 따라서 anchor와 color들이 지정된 tree $S$를 이루어야 하면, 임의의 old tree의 모든 호환 확장에 대한 총 계수는\n$$\\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$$\n이다. 여기서 $a_v$와 $d_v$는 지정된 reference tree의 각 branching vertex의 자식 수와 깊이다. 더 일반적으로, 같은 한 걸음 규칙을 이미 만든 임의의 reference 집합에서 시작해 반복할 수 있다."}, "tree:reference-total.s1": {"title": "한 걸음 합 $m_d-jm_{d+1}$", "math": "지정된 갈라짐 vertex에서 전체 현재 tree의 자식 수를 $n$이라 하자. 제외되는 $j$개 자식이 그 vertex를 지나는 모든 reference를 담는다. 나머지 $n-j$개 자식은 각각 reference가 없는 부분 tree의 뿌리다. 그 말단 vertex는 따라서 쓰지 않은 old leaf다. 그런 부분 tree가 깊이 $d+1$에 뿌리를 두면 허용되는 선택은 계수 $1$의 old leaf, 또는 부분 tree 안 내부 vertex에서의 fresh divergence다. leaf가 $q$개이면 그 안의 망원 합이\n$$q+\\sum_{\\beta\\text{ internal in the subtree}}(m_{d_\\beta}-n_\\beta m_{d_\\beta+1})=m_{d+1}$$\n을 준다. 이 공식은 자식이 말단인 경우(양변이 $1$)도 포함한다. 이 기여들을 지정 vertex에서의 fresh 선택에 더하면\n$$m_d-nm_{d+1}+(n-j)m_{d+1}=m_d-jm_{d+1}.$$"}, "tree:reference-total.s2": {"title": "거꾸로 합하기 → $\\kappa(S)$", "math": "모든 reference path와의 갈라짐 깊이가 일관되게 처방되면, 가장 깊은 요구 공통 prefix가 갈라지는 vertex와 그 제외 reference 자식들을 정한다. 따라서 한 걸음 합은 현재 reference tree에만 의존하고, 어떤 old path나 fresh path가 그것을 실현했는지에는 의존하지 않는다. 연속된 선택을 거꾸로 합한다. 최종 처방 tree의 branching vertex에서, 새 자식 무리에 처음 들어갈 때의 제외 reference 자식 수는 정확히 $1,\\ldots,a_v-1$이다. 그 인자들이 (tree:K)를 color 순서와 무관하게 준다."}, "tree:regular-shapes": {"title": "Regular shapes ($Q_k$ 아래 예외 깊이의 확률)", "math": "($m_d=d/L$, $0<\\eta<1/2$.) 모든 고정 $k$에 대해 $L$과 $\\eta$에 무관한 $C_k<\\infty$가 있어\n$$Q_k\\{\\mathcal T\\text{ is not regular}\\}\\leq C_k(\\eta+L^{-1}).$$\n$a$개 branching vertex를 가진 특정 labeled topology와 그 깊이의 일관된 배정 하나에 대해\n$$Q_k\\{\\text{that topology and depth assignment}\\}\\leq C_kL^{-a}.$$\nregular tree에서 leaf를 지우면, unary가 된 branching vertex를 버린 뒤 regular tree가 나온다."}, "tree:regular-shapes.s1": {"title": "비정칙 확률의 union bound", "math": "현재 tree의 leaf가 $n$개라 하자. 새 branching vertex는 다음 path가 unary vertex에서 갈라질 때 정확히 만들어진다. (tree:Q-rule)에 의해 그런 선택은 각각 확률 $\\delta/
