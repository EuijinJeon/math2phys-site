<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증명 지도 — 논문 전체 계약 (외부 입력 닫기, 증명 열지 않음)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#fbfaf7; --ink:#1d1d1b; --muted:#6b6a65; --line:#cfcdc6; --panel:#ffffff;
  --obj:#eeeeea; --obj-b:#8a8983;
  --rule:#e3edf9; --rule-b:#2f6fb5;
  --fact:#fbf0d9; --fact-b:#b07a12;
  --step:#e4f3e6; --step-b:#2f8a45;
  --ext:#ffffff; --ext-b:#8a8983;
  --frame:#9a6fb0; --sel:#d2452f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191918; --ink:#ecebe6; --muted:#a3a29b; --line:#4a4944; --panel:#232321;
    --obj:#2e2e2b; --obj-b:#8f8e87;
    --rule:#1d3048; --rule-b:#6aa6e6;
    --fact:#3d3115; --fact-b:#d9a441;
    --step:#1c3523; --step-b:#62bd78;
    --ext:#232321; --ext-b:#8f8e87;
    --frame:#b993cd; --sel:#ff7a63;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 4px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--rule-b);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:4px}
.lk{display:inline-block;width:26px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.lk.call{border-top-style:dashed}
.lk.def{border-top:1px solid var(--muted)}
main{display:flex;gap:0;align-items:stretch;min-height:calc(100vh - 110px)}
#stage{flex:1 1 auto;overflow:auto;padding:16px;min-width:0}
#canvas{position:relative}
#edges{position:absolute;left:0;top:0;pointer-events:none}
#panel{flex:0 0 340px;max-width:340px;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto}
@media (max-width:1100px){main{flex-direction:column}#panel{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line)}}
.node{position:absolute;width:210px;border:1.5px solid;border-radius:8px;padding:7px 9px 8px;cursor:pointer;background:var(--obj)}
.node .k{font-size:11px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.node .t{font-weight:600;margin:1px 0 3px}
.node .s{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.node.obj{background:var(--obj);border-color:var(--obj-b)}
.node.rule{background:var(--rule);border-color:var(--rule-b)}
.node.fact{background:var(--fact);border-color:var(--fact-b)}
.node.step{background:var(--step);border-color:var(--step-b);border-radius:18px}
.node.ext{background:var(--ext);border-color:var(--ext-b);border-style:dashed}
.node.out{background:var(--rule);border-color:var(--rule-b);border-width:2.5px}
.node.sel{outline:3px solid var(--sel);outline-offset:2px}
.node.done{border-width:3px}
.node.todo{opacity:.72;border-style:dotted}
.elabel.member{border:1.5px solid var(--ink)}
.elabel.wide.member .et b{color:var(--ink)}

.node .z{font-size:11px;color:var(--rule-b);margin-top:4px}
.frame{position:absolute;border:1.5px dashed var(--frame);border-radius:14px}
.frame .cap{position:absolute;left:10px;right:10px;top:5px;font-size:12px;line-height:1.4;color:var(--frame);max-height:40px;overflow:hidden}
.elabel{position:absolute;transform:translate(-50%,-50%);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.elabel.sel{border-color:var(--sel);color:var(--sel)}
.elabel.wide{white-space:normal;width:max-content;max-width:176px;text-align:left;border-radius:6px;padding:2px 6px;line-height:1.35;color:var(--ink)}
.elabel .et{display:block;font-size:10px;color:var(--muted)}
.recv{border-left:2px solid var(--line);padding:2px 0 4px 8px;margin:6px 0}
.recv .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:4px}
.recv .rl{margin-top:3px}
.recv .rl > span.lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.recv details{margin-top:3px}
.recv summary{font-size:12px;color:var(--rule-b);cursor:pointer}
details.src summary,details.item summary,details.sym summary{font-size:12px;cursor:pointer;color:var(--rule-b)}
details.src pre{font-size:11px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:3px 0;max-height:260px;overflow:auto}
details.item,details.sym{border-left:2px solid var(--line);padding:1px 0 3px 8px;margin:5px 0}
details.item .it-body{margin-top:3px}
.it-from{font-size:11px;color:var(--muted)}
.filled{color:#a33;font-size:12.5px}
button.linkish{background:none;border:0;padding:0;color:var(--rule-b);cursor:pointer;text-decoration:underline;font:inherit;text-align:left}
#panel h2{font-size:15px;margin:0 0 2px}
#panel .kind{font-size:12px;color:var(--muted);margin-bottom:10px}
#panel dl{margin:0}
#panel dt{font-size:12px;color:var(--muted);margin-top:10px}
#panel dd{margin:2px 0 0}
#panel ul{margin:2px 0 0;padding-left:18px}
#panel .formula{overflow-x:auto;padding:4px 0}
button.zoom{margin-top:12px;font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--rule-b);background:var(--rule);color:var(--ink);cursor:pointer}
.check{margin-top:10px;font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.check.ok{border-color:var(--step-b)}
.check.bad{border-color:var(--sel)}

#vertex{display:none;max-width:1180px}
#vertex h2{font-size:16px;margin:0 0 2px}
#vertex h3{font-size:13px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
#vertex .claim{margin:6px 0 0;color:var(--muted)}
.vc{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--panel)}
.vc.ctx{border-color:var(--frame);border-style:dashed}
.vc.in{border-left:5px solid var(--ink)}
.vc.in.call{border-left-style:dashed}
.vc.in.def{border-left-color:var(--muted)}
.vc.step{border-color:var(--step-b);background:var(--step);border-radius:14px}
.vc.out{border-right:5px solid var(--ink)}
.vc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vc .hd b{font-size:14px}
.vc .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.vc .row{margin-top:5px}
.vc .row > .lab{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px}
.vc .formula{overflow-x:auto}
.vc .flag{margin-top:5px;font-size:12.5px;color:var(--sel)}
.vc ul{margin:0;padding-left:18px}

#vertex.wide{max-width:none}
.vgrid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.35fr) minmax(240px,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.vgrid{grid-template-columns:1fr}}
.vc.edge{border:1.5px solid var(--ink);border-radius:4px}
.vc.edge.def{border-color:var(--muted)}
.vc.edge.fact{border-color:var(--fact-b)}
.vc .eid{font-weight:700;color:var(--ink);border-color:var(--ink)}
.chain{border-top:1px solid var(--step-b);margin-top:8px;padding-top:6px}
.chain:first-of-type{border-top:0}
.chain .cn{font-size:11px;color:var(--muted)}
.arrowdown{text-align:center;color:var(--muted);font-size:18px;line-height:1;margin:2px 0}
.note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
code{font-size:12px}

/* 상태와 edge 식별자 */
.node.state-incomplete{border-color:var(--sel);border-style:dashed}
.node.state-unassessed{border-style:dotted;border-color:var(--fact-b)}
.node.state-complete{border-width:3px}
.node .state-tag{font-weight:600;color:var(--muted)}
.node.state-incomplete .state-tag,.issue{color:var(--sel)}
.node .issue{font-size:11px;margin-top:5px;font-weight:600}
.node .child-state{font-size:11px;color:var(--muted);margin-top:4px}
#map-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.status-pill{border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.status-pill.incomplete{border-color:var(--sel);color:var(--sel)}
.status-pill.unassessed{border-color:var(--fact-b)}
.elabel{font:11px/1.3 -apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);padding:3px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--bg)}
.elabel.pending{border-style:dashed;border-color:var(--fact-b)}
.elabel.open-edge{border-color:var(--sel);color:var(--sel)}
.elabel.sel{outline:2px solid var(--sel);outline-offset:1px}
.elabel .edge-id{font-weight:700;font-variant-numeric:tabular-nums}
.elabel .edge-pending{margin-left:4px;font-weight:700;color:var(--fact-b)}
.elabel:focus-visible,.node:focus-visible{outline:3px solid var(--sel)}
.focus-node{font:inherit;text-align:left;background:transparent;color:var(--rule-b);border:0;padding:4px 0;cursor:pointer}
.audit-list{padding-left:17px;font-size:12px}
.node-warning{border-left:3px solid var(--sel);padding:5px 8px;margin:9px 0;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>증명 지도 — 논문 전체 계약 (외부 입력 닫기, 증명 열지 않음)</h1>
  <div class="crumbs" id="crumbs"></div>
  <div class="legend">
    <span><span class="chip" style="background:var(--obj);border-color:var(--obj-b)"></span>대상</span>
    <span><span class="chip" style="background:var(--rule);border-color:var(--rule-b)"></span>rule</span>
    <span><span class="chip" style="background:var(--fact);border-color:var(--fact-b)"></span>사실</span>
    <span><span class="chip" style="background:var(--step);border-color:var(--step-b);border-radius:7px"></span>단계</span>
    <span><span class="chip" style="background:var(--ext);border-color:var(--ext-b);border-style:dashed"></span>밖</span>
    <span><span class="lk"></span>흐름</span>
    <span><span class="lk call"></span>호출</span>
    <span><span class="lk def"></span>정의</span>
    <span id="frame-legend"><span class="chip" style="border-color:var(--frame);border-style:dashed;background:transparent"></span>틀</span>
    <label><input type="checkbox" id="tp" checked> edge 핵심어 표시</label>
    <span>edge는 ID + 핵심어로 표시합니다. ?는 내용 미작성, !는 열린 연결입니다.</span>
  </div>
  <div id="map-status" aria-live="polite"></div>
</header>
<main>
  <div id="stage"><div id="canvas"><svg id="edges"></svg></div><div id="vertex"></div></div>
  <aside id="panel"></aside>
</main>

lar}}w_j(\\mathbf y)^\\gamma\\le\\bigl(L^{-D_j}\\sum_{\\mathbf y\\ \\eta/2\\text{-regular}}w_j(\\mathbf y)\\bigr)^\\gamma$ ($w_j$ 는 자식 공분산을 이 좌표들의 함수로 본 것). 이동하지 않은 항도 이동 없이 같은 경계를 갖는다.", "lines": ["decorrelation.tex", 491, 509], "flag": ""}], "symbols": [{"tex": "$L,\\ r,\\ m_d,\\ \\delta$", "text": "깊이 $L\\ge2$, $r=L-1$ 단계, 균등 격자 $m_d=d/L$ ($0\\le d\\le L$), $\\delta=1/L$ (식 cavity:grid).", "at": [["cavity.tex", 16, 19]]}, {"tex": "$\\mathfrak E(\\mathcal T,a_*,\\mathcal C),\\ R_E$", "text": "$S_0=\\sigma_i$ 이면 spin anchor, $S_0=1$ 이면 marker anchor. anchor 는 색 $0$, 추가된 색은 순서대로 $1,\\ldots,k$ 이고 서로 다른 replica 위치를 차지하며 canceled-anchor extension 규칙을 따른다. 제약 $\\mathcal C$ 는 추가된 색과 anchor 사이의 쌍별 split 깊이의 일관된 모음을 지정하고 다른 old replica 에 대한 제한은 두지 않는다. $\\mathfrak E(\\mathcal T,a_*,\\mathcal C)$ 는 허용 extension history 들의 집합, 계수 $c_E$, $R_E$ 는 spin anchor 일 때 $\\frac1N\\sum_i\\sigma_i^{a_*}\\prod_j\\sigma_i^{a_j(E)}$, marker anchor 일 때 $\\frac1N\\sum_i\\prod_j\\sigma_i^{a_j(E)}$ ($k=0$ 이면 $R_{\\{a_*\\}}$ 또는 $1$).", "at": [["perturbations.tex", 429, 449]]}, {"tex": "$\\mathscr F_d,\\ \\mu_{d,S},\\ v_N(S,d)$", "text": "$S$ 의 초기 stem 위의 깊이 $d$ (첫 branching 깊이 포함) 에서 $\\mathscr F_d$ 는 root 와 깊이 $d$ 까지의 sampled prefix 가 생성하는 시그마 대수, $\\mu_{d,S}=\\mathbb E[A_S\\mid\\mathscr F_d]$, $v_N(S,d)=\\frac1{N^2}\\mathbb E\\sum_{i,j}\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2$ (기대값은 root 포함). $A_S$ 와 $\\mu_{d,S}$ 의 좌표는 절댓값 $\\le1$, $0\\le v_N\\le1$.", "at": [["decorrelation.tex", 94, 106]]}, {"tex": "$\\lim_L\\limsup_N$", "text": "고정된 $L$ 마다 $N$ 극한은 Lemma pert:selection 이 준 크기와 매개변수 선택을 따르고, 그 위에서 Theorem pert:tree-identity 의 항등식이 성립한다. $L$ 이 다르면 수열이 달라도 된다. 논증은 이 항등식과 tree 표본 규칙만 쓰며 상호작용 인수분해는 쓰지 않는다.", "at": [["decorrelation.tex", 4, 9]]}, {"tex": "$\\eta$-regular", "text": "$\\eta>0$ 에 대해 깊이 배정이 $\\eta$-regular 라는 것은 모든 깊이를 $L$ 로 나눈 값이 $(\\eta,1-\\eta)$ 에 있고 서로 다른 branching vertex 의 정규화 깊이가 $\\eta$ 보다 더 떨어져 있다는 것이다. 추가 prefix 깊이 $d$ 가 지정되면 모든 branching 깊이에 대해 같은 제약을 받는다. 한 const SRCLINES = {"introduction.tex": {"1": "\\section{Introduction}", "2": "", "3": "A diluted spin glass has a finite mean number of interactions per spin.", "4": "Its local environment remains random as the system grows, and the cavity", "5": "method describes that environment through a distribution of local fields.", "6": "When many competing states contribute to the partition function, the", "7": "proposed order parameter is a hierarchy of distributions of these fields.", "8": "The thermodynamic question is whether this hierarchy determines the", "9": "limiting expected log partition function per spin. We call this quantity", "10": "\\emph{pressure}. At inverse temperature $\\beta$, the usual physical free", "11": "energy per spin is its negative divided by $\\beta$.", "12": "", "13": "The Viana--Bray model is a classical diluted two-spin", "14": "model~\\cite{VB85}. M\\'ezard and Parisi~\\cite{MP01} developed the", "15": "hierarchical cavity picture for the fixed-connectivity Bethe-lattice", "16": "spin glass, with an explicit one-step replica-symmetry-breaking", "17": "functional. Franz and Leone~\\cite{FL03} adapted Guerra's", "18": "interpolation method~\\cite{Guerra03} to diluted systems and obtained", "19": "replica-symmetric and one-step pressure bounds for even-arity models.", "20": "Panchenko and", "21": "Talagrand~\\cite{PT04} then proved the arbitrary finite-level", "22": "hierarchical upper bounds considered here.", "23": "", "24": "We prove that the infimum of these bounds is the limiting pressure.", "25": "This resolves the equality conjecture stated immediately after", "26": "Theorem~4 of Panchenko--Talagrand~\\cite{PT04}, for their Poisson,", "27": "even-arity Ising model class with factorized interactions and the", "28": "specified positivity condition. Only first moments of the interaction", "29": "and external field are required. The result includes the Viana--Bray", "30": "model, diluted even-spin models with symmetric couplings, and soft", "31": "random even-$K$ SAT at every positive temperature. The exact model and", "32": "trial functional are defined in \\cref{model:section}; the named models", "33": "and their expected ground-state limits are treated in", "34": "\\cref{models:section}.", "35": "", "36": "An exact variational description and reduction to a prescribed", "37": "trial class are distinct problems. The cavity variational principle of", "38": "Aizenman, Sims and Starr~\\cite{ASS03} for the Sherrington--Kirkpatrick model", "39": "has a Viana--Bray counterpart in De Sanctis's formulation over random", "40": "multioverlap structures~\\cite{DeSanctis04}. Panchenko's", "41": "spin-distribution approach~\\cite[Theorems~1--2]{Pan13} gives an exact", "42": "variational formula over invariant exchangeable spin distributions.", "43": "Under their positivity condition, Coja-Oghlan and", "44": "Perkins~\\cite{COP19} obtain an invariant-kernel variational formula", "45": "for random regular factor graphs. These results", "46": "use different descriptions of the state from the finite hierarchy of", "47": "message laws optimized here. The additional task is to recover the", "48": "specific hierarchical cavity functional without losing the pressure.", "49": "", "50": "Panchenko~\\cite[Theorem~2]{Pan16} established a hierarchical", "51": "single-site representation for finite-RSB asymptotic Gibbs measures of", "52": "suitably modified models; approximation of general states by that class", "53": "remains a separate step. Biswas, Chen and", "54": "Sen~\\cite[Theorem~1.1 and Proposition~1.4]{BCS25} obtain exact", "55": "replica-symmetric pressure formulas in high-temperature and critical or", "56": "subcritical regimes for compact real spin spaces under moment and regularity", "57": "assumptions. For the zero-field Ising spin glass with Rademacher couplings", "58": "on random regular graphs, Concetti~\\cite[Theorem~1.3]{Concetti25}", "59": "gives a full-replica-symmetry-breaking pressure bound no larger than each", "60": "optimized finite-level bound; equality with that functional is", "61": "conjectural in that work. The result here", "62": "identifies the finite-depth Panchenko--Talagrand infimum at arbitrary", "63": "density in its stated interaction class.", "64": "", "65": "The main obstacle is the distribution of spins seen across several", "66": "replicas, that is, several samples from the same Gibbs system. The", "67": "probability of each replica-spin pattern depends on products of every", "68": "subset of those spins. The spatial average of such a product is a", "69": "\\emph{multioverlap}; pair overlaps alone do not determine all these", "70": "patterns. This is the information isolated by the spin-distribution", "71": "approach~\\cite{Pan13}. To compare a cavity insertion with independent", "72": "hierarchical messages, we must control all finite multioverlaps before", "73": "redrawing the message roots independently.", "74": "", "75": "We work with finite auxiliary hierarchies before taking the", "76": "thermodynamic limit. Their branching is part of the construction;", "77": "no ultrametric organization of the physical Gibbs states is assumed.", "78": "Bounded perturbations yield identities for", "79": "prescribed replica branching patterns. Delaying each branching depth", "80": "by one level permits an induction that concentrates multioverlaps", "81": "\\emph{on average over branching depths}. The cavity insertion itself", "82": "has an expansion averaging over finite trees, so this averaged control", "83": "is sufficient. The system size tends to infinity at each fixed depth;", "84": "only then does the depth increase. The proof strategy following", "85": "\\cref{main:theorem} explains how the finite-tree calculus, concentration", "86": "and independent-message comparison fit together."}, "model.tex": {"1": "\\section{The model and the variational principle}\\label{model:section}", "2": "", "3": "Fix an even integer $p\\ge2$ and $\\alpha>0$. Let $\\theta$ be a random real", "4": "function on $\\{-1,1\\}^p$ and let $h$ be a real random variable. Write", "5": "$B(\\theta)=\\max_s\\abs{\\theta(s)}$ and assume", "6": "\\begin{equation}\\label{model:integrability}", "7": " \\E B(\\theta)+\\E\\abs h<\\infty.", "8": "\\end{equation}", "9": "For independent $M_N\\sim\\Pois(\\alpha N)$, independent copies $\\theta_k$ of", "10": "$\\theta$, independent copies $h_i$ of $h$, and independent uniform indices", "11": "$i_{\\ell,k}\\in[N]=\\{1,\\ldots,N\\}$, set", "12": "\\begin{equation}\\label{model:hamiltonian}", "13": " \\begin{gathered}", "14": " -H_N(\\sigma)=\\sum_{k=1}^{M_N}", "15": " \\theta_k(\\sigma_{i_{1,k}},\\ldots,\\sigma_{i_{p,k}})", "16": " +\\sum_{i=1}^N h_i\\sigma_i,\\\\", "17": " Z_N=\\sum_{\\sigma\\in\\{-1,1\\}^N}e^{-H_N(\\sigma)},", "18": " \\qquad F_N=\\frac1N\\E\\log Z_N.", "19": " \\end{gathered}", "20": "\\end{equation}", "21": "All families in this definition are mutually independent. In particular,", "22": "indices are sampled with replacement. The model parameters and disorder", "23": "laws are fixed as $N$ varies.", "24": "", "25": "The interaction hypotheses are the existence of a representation", "26": "\\begin{equation}\\label{model:factorization}", "27": " e^{\\theta(s_1,\\ldots,s_p)}", "28": " =a\\left(1+b\\prod_{\\ell=1}^p f_\\ell(s_\\ell)\\right),", "29": " \\qquad", "30": " \\abs{b\\prod_{\\ell=1}^p f_\\ell(s_\\ell)}<1\\quad\\text{a.s.},", "31": "\\end{equation}", "32": "for every spin tuple, where $a>0$ and $b$ are real random variables,", "33": "the $f_\\ell:\\{-1,1\\}\\to\\R$ are independent copies of one random", "34": "function, $b$ is independent of them, and", "35": "\\begin{equation}\\label{model:positivity}", "36": " \\E[(-b)^n]\\ge0\\qquad(n\\ge1).", "37": "\\end{equation}", "38": "The expectations in \\eqref{model:positivity} are interpreted as finite real", "39": "expectations. This is automatic in the nondegenerate case: independence", "40": "and the strict product bound force $b$ and $\\max_s|f_1(s)|$ to be", "41": "essentially bounded, as shown in \\cref{upper:bound}. If the product term", "42": "vanishes identically, the interaction is spin independent and one may", "43": "take $b=0$. The multiplier $a$ may depend on all the other variables in", "44": "the representation; no separate integrability of $\\log a$ is assumed.", "45": "", "46": "\\subsection{The hierarchical cavity functional}", "47": "", "48": "We give the power-mean form of the Panchenko--Talagrand functional", "49": "\\cite[Section~5]{PT04}. A message $x$ specifies a probability distribution", "50": "on one spin. The site term inserts a new spin with its incident", "51": "interactions; the edge term corrects for interactions counted in that", "52": "insertion.", "53": "", "54": "For $x\\in\\R$ let $q_x(s)=e^{xs}/(2\\cosh x)$. Define", "55": "\\begin{align}", "56": " C_\\theta(x_1,\\ldots,x_p)", "57": " &=\\sum_{s\\in\\{-1,1\\}^p}e^{\\theta(s)}\\prod_{\\ell=1}^p q_{x_\\ell}(s_\\ell),", "58": " \\label{model:edge}\\\\", "59": " U_\\theta(x_1,\\ldots,x_{p-1};\\eps)", "60": " &=\\log\\sum_{s\\in\\{-1,1\\}^{p-1}}", "61": " e^{\\theta(s_1,\\ldots,s_{p-1},\\eps)}", "62": " \\prod_{\\ell=1}^{p-1}q_{x_\\ell}(s_\\ell).", "63": " \\label{model:site-message}", "64": "\\end{align}", "65": "Both $\\abs{\\log C_\\theta}$ and $\\abs{U_\\theta}$ are bounded by $B(\\theta)$,", "66": "uniformly in the messages.", "67": "", "68": "Write $\\mathcal P(E)$ for the Borel probability measures on $E$.", "69": "Let $\\mathcal M_1=\\mathcal P(\\R)$ and", "70": "$\\mathcal M_{j+1}=\\mathcal P(\\mathcal M_j)$, equipped with the topology of weak convergence and its Borel sigma-field. Fix $r\\ge1$, $\\zeta\\in\\mathcal M_{r+1}$, and", "71": "$0<m_1<\\cdots<m_r<1$. For each message label $\\omega$ independently, draw", "72": "\\begin{equation}\\label{model:chain}", "73": " \\eta_0^\\omega\\sim\\zeta,\\qquad", "74": " \\eta_{d+1}^\\omega\\mid\\eta_d^\\omega\\sim\\eta_d^\\omega\\ (0\\le d\\le r-2),", "75": " \\qquad x^\\omega\\mid\\eta_{r-1}^\\omega\\sim\\eta_{r-1}^\\omega.", "76": "\\end{equation}", "77": "At $r=1$, this means that each label first draws a random probability", "78": "measure $\\eta_0$ with law $\\zeta$, then draws $x$ with law $\\eta_0$.", "79": "Higher levels repeat this sampling of measures. All these variables are", "80": "independent of the physical disorder. Use different", "81": "labels for $x_1,\\ldots,x_p$ and for $x_\\ell^j$, $j\\ge1$, $1\\le\\ell<p$.", "82": "Take independent $k\\sim\\Pois(\\alpha p)$, $\\theta,\\theta_1,\\ldots$, and $h$,", "83": "and put", "84": "\\begin{align}", "85": " V_{\\rm s}&=\\frac12\\sum_{\\eps=\\pm1}", "86": " \\exp\\left(h\\eps+\\sum_{j=1}^k", "87": " U_{\\theta_j}(x_1^j,\\ldots,x_{p-1}^j;\\eps)\\right),\\label{model:vs}\\\\", "88": " V_{\\rm e}&=C_\\theta(x_1,\\ldots,x_p).\\label{model:ve}", "89": "\\end{align}", "90": "For $0\\le d<r$, let $\\mathscr F_d$ be generated by all the physical disorder in these", "91": "expressions and all $\\eta_j^\\omega$, $0\\le j\\le d$. Set", "92": "\\begin{equation}\\label{model:power-means}", "93": " T_rV=V,\\qquad", "94": " T_dV=\\left(\\E[(T_{d+1}V)^{m_{d+1}}\\mid\\mathscr F_d]\\right)^{1/m_{d+1}}", "95": " \\quad(d=r-1,\\ldots,0).", "96": "\\end{equation}", "97": "Only auxiliary messages are integrated in these conditional expectations.", "98": "For example, at depth one,", "99": "$T_0V=(\\E_x[V^{m_1}\\mid\\boldsymbol\\eta_0])^{1/m_1}$.", "100": "At depth two, each label draws", "101": "$\\eta_0\\sim\\zeta$, then $\\eta_1\\mid\\eta_0\\sim\\eta_0$, and then", "102": "$x\\mid\\eta_1\\sim\\eta_1$, and", "103": "\\[", "104": " T_0V=\\left(\\E_{\\boldsymbol\\eta_1}", "105": "   \\left[\\left(\\E_{\\boldsymbol x}", "106": "      [V^{m_2}\\mid\\boldsymbol\\eta_1]\\right)^{m_1/m_2}", "107": "      \\,\\middle|\\,\\boldsymbol\\eta_0\\right]\\right)^{1/m_1}.", "108": "\\]", "109": "Here bold symbols collect all message labels in $V$; physical disorder is", "110": "held fixed throughout, including in the two abbreviated displays.", "111": "Define", "112": "\\begin{equation}\\label{model:functional}", "113": " \\cB_r(\\zeta,\\mathbf m)", "114": " =\\log2+\\E\\log T_0V_{\\rm s}", "115": " -\\alpha(p-1)\\E\\log T_0V_{\\rm e},", "116": " \\qquad \\Phi_r=\\inf_{\\zeta,\\,\\mathbf m}\\cB_r(\\zeta,\\mathbf m).", "117": "\\end{equation}", "118": "At $r=0$, the messages are independent with common law", "119": "$\\zeta\\in\\mathcal P(\\R)$ and the operators $T_d$ are omitted; this defines", "120": "$\\cB_0(\\zeta)$ and $\\Phi_0$.", "121": "", "122": "The quantities in \\eqref{model:functional} are finite without any moment", "123": "assumption on the trial messages. Indeed, the power-mean operators preserve", "124": "pointwise multiplicative bounds, and", "125": "\\begin{equation}\\label{model:trial-bounds}", "126": " \\abs{\\log T_0V_{\\rm s}}\\le\\abs h+\\sum_{j=1}^k B(\\theta_j),", "127": " \\qquad \\abs{\\log T_0V_{\\rm e}}\\le B(\\theta).", "128": "\\end{equation}", "129": "", "130": "\\begin{theorem}\\label{main:theorem}", "131": "Under \\eqref{model:integrability}--\\eqref{model:positivity}, the thermodynamic", "132": "limit exists and", "133": "\\begin{equation}\\label{main:formula}", "134": " \\lim_{N\\to\\infty}F_N=\\inf_{r\\ge0}\\Phi_r.", "135": "\\end{equation}", "136": "\\end{theorem}", "137": "", "138": "The right side is an infimum over finite hierarchies. The theorem does not", "139": "assume that a trial law attains it or that a limiting infinite-depth", "140": "Gibbs state has been constructed."}, "overview.tex": {"1": "\\subsection{Proof strategy}", "2": "", "3": "The interpolation upper bound holds at every system size and every", "4": "finite depth. We reproduce it in \\cref{upper:section}, including a", "5": "normalization that avoids assuming integrability of the multiplier", "6": "$\\log a$. The lower bound has four steps.", "7": "", "8": "\\begin{enumerate}[label=\\textup{\\arabic*.},leftmargin=*]", "9": "\\item \\emph{Select a cavity reservoir.}", "10": "A reservoir is a common Gibbs system on $N$ spins used to compare", "11": "systems of sizes $N$ and $N+1$.", "12": "For bounded interaction and field laws, add bounded Poisson perturbations whose", "13": "number is sublinear in the system size. Their effect on the pressure", "14": "vanishes. At each fixed hierarchy depth, select system sizes and", "15": "deterministic perturbation parameters for which the difference between", "16": "successive expected logarithms after the auxiliary power-mean recursion", "17": "is at most an arbitrarily small error above the original pressure liminf. The same choices give concentration of every", "18": "perturbation score (\\cref{cavity:section,pert:selection}).", "19": "", "20": "\\item \\emph{Prescribe branching patterns.}", "21": "An elementary calculus for finite probability trees expands insertions", "22": "into signed sums over added replica paths. Independent marks select any", "23": "prescribed branching pattern. Score concentration then gives identities", "24": "for these signed sums (\\cref{tree:section,pert:tree-identity}).", "25": "", "26": "\\item \\emph{Concentrate all multioverlaps.}", "27": "Move each internal branching depth of a target tree one step later.", "28": "The first fresh split at each new depth supplies the same small factor", "29": "as the normalizing coefficient. A relative bound on the sum of absolute", "30": "coefficients preserves control of errors after division. Conditional", "31": "covariance then decays by induction on the number of replicas.", "32": "A second identity concentrates the remaining conditional mean", "33": "(\\cref{decor:section}).", "34": "", "35": "\\item \\emph{Recover independent cavity messages.}", "36": "Encode a uniformly chosen reservoir site's entire finite hierarchy by", "37": "successive conditional laws. Multioverlap concentration permits different", "38": "site labels to be replaced by independent copies of this process in", "39": "the cavity insertion. This yields an admissible trial value close to", "40": "the selected increment (\\cref{comp:section}).", "41": "\\end{enumerate}", "42": "", "43": "The estimates in Step~3 are averages over separated interior branching", "44": "depths. The insertion expansion assigns vanishing probability to the", "45": "exceptional trees, so these averages are sufficient for Step~4. No", "46": "uniform concentration in the depth is needed. The resulting lower bound", "47": "holds for every bounded interaction law invariant under permutations of", "48": "its inputs, without factorization or positivity. Finally, normalization", "49": "and estimates uniform over all trial laws remove boundedness and give", "50": "\\cref{main:theorem} under the stated first moment assumption", "51": "(\\cref{reduction:section})."}, "trees.tex": {"1": "\\section{Calculus on finite trees}\\label{tree:section}", "2": "", "3": "A power-mean insertion admits two expansions.  The logarithmic expansion", "4": "will compare pressures; an expansion with one canceled replica factor", "5": "will extract the perturbation identities.  Both follow from one", "6": "differentiation rule on trees.  We also bound their coefficients and the", "7": "probability of exceptional branching depths. Power-mean calculations for", "8": "hierarchical trial laws appear in M\\'ezard--Parisi~\\cite[Appendix~A]{MP01}", "9": "and Panchenko--Talagrand~\\cite[Section~5]{PT04}; the latter uses cascade", "10": "weights introduced by Ruelle~\\cite{Ruelle87}. Here we derive", "11": "the needed identities directly for finite sequences of arbitrary", "12": "probability kernels, without assuming an infinite hierarchy.", "13": "", "14": "\\subsection{Path kernels and insertions}", "15": "", "16": "Fix an integer $L\\geq1$ and numbers", "17": "\\[", "18": "  0=m_0<m_1<\\cdots<m_{L-1}<m_L=1.", "19": "\\]", "20": "A path has depths $0,\\ldots,L$.  Its depth-zero variable is the root.", "21": "For $1\\leq d\\leq L$, the probability kernel $K_d$ draws the next variable", "22": "given the whole prefix through depth $d-1$; $\\mathscr F_d$ is the prefix", "23": "sigma-field.  The root distribution is fixed throughout all insertions.", "24": "In an $r$-level application, $L=r+1$: depths $1,\\ldots,r$ carry", "25": "auxiliary variables, and depth $L$ carries a Gibbs spin configuration.", "26": "For the trial law \\eqref{model:chain} with $r\\ge1$, $\\eta_d$ is the", "27": "depth-$d$ variable for $0\\le d<r$, and $x$ is the depth-$r$ variable.", "28": "", "29": "A finite tree $\\mathcal T$ consists of a common root and finitely many", "30": "labeled paths, each ending at depth $L$.  Every internal vertex has at", "31": "least one child; in particular, all unary portions of paths are retained.", "32": "At each vertex, different children are drawn independently using the", "33": "appropriate kernel.  We write $E_{\\mathcal T}$ for this sampling", "34": "expectation conditional on the root.  A split at depth $d$ means that", "35": "the last common vertex is at depth $d$.  Replica positions at depth $L$", "36": "are distinct vertices, but the values sampled there need not differ.", "37": "Thus independent spin replicas may be the same spin configuration.", "38": "Removing some leaves and the portions of their paths unused by the", "39": "remaining leaves preserves the sampling law of the remaining tree.", "40": "", "41": "When the terminal variables are spin configurations", "42": "$\\sigma^a\\in\\{-1,1\\}^N$, the multioverlap on a subset $S$ of the", "43": "replica leaves is", "44": "\\begin{equation}\\label{tree:multioverlap}", "45": " R_S=\\frac1N\\sum_{i=1}^N\\prod_{a\\in S}\\sigma_i^a,", "46": " \\qquad R_\\varnothing=1.", "47": "\\end{equation}", "48": "An unspecified expectation $\\E$ below includes the root and the", "49": "sampling of the indicated tree.", "50": "", "51": "Here is how the path kernels arise from a partition function. Let", "52": "$P_d$, $1\\le d<L$, be the auxiliary prior kernels, put", "53": "$X_{L-1}=\\log Z$, and recursively set", "54": "\\[", "55": " X_{d-1}=m_d^{-1}\\log P_d e^{m_dX_d}\\qquad(1\\le d<L).", "56": "\\]", "57": "The corresponding \\emph{tilted kernels} are", "58": "\\begin{equation}\\label{tree:original-tilt}", "59": " K_d(dz\\mid\\mathscr F_{d-1})", "60": " =e^{m_d(X_d(z)-X_{d-1})}P_d(dz\\mid\\mathscr F_{d-1}),", "61": " \\qquad 1\\le d<L.", "62": "\\end{equation}", "63": "They are probability kernels by the recursion. The final kernel $K_L$", "64": "is the Gibbs distribution of the spin configuration conditional on its", "65": "auxiliary prefix. When $L=1$, only this final kernel is present.", "66": "", "67": "For a positive path function $A$, define", "68": "\\begin{equation}\\label{tree:Y-recursion}", "69": "  Y_L=A,\\qquad", "70": "  Y_{d-1}=\\bigl(K_dY_d^{m_d}\\bigr)^{1/m_d},", "71": "  \\qquad d=L,\\ldots,1.", "72": "\\end{equation}", "73": "We initially suppose that $A$ is bounded above and away from zero,", "74": "conditionally on the root.  Every expression below is then well", "75": "defined.  Denote the kernels after insertion by", "76": "\\begin{equation}\\label{tree:updated-kernel}", "77": "  K_d^A(dz\\mid\\mathscr F_{d-1})", "78": "  =\\left(\\frac{Y_d(z)}{Y_{d-1}}\\right)^{m_d}", "79": "     K_d(dz\\mid\\mathscr F_{d-1}).", "80": "\\end{equation}", "81": "The recursion shows that these are probability kernels.  Superscript", "82": "$A$ on a tree expectation means that these kernels are used.", "83": "", "84": "\\begin{lemma}[Insertion calculus]\\label{tree:insertion}", "85": "Suppose a leaf partition function is iterated by power means, with", "86": "exponents $m_1,\\ldots,m_{L-1}$, and $K_1,\\ldots,K_{L-1}$ are its tilted", "87": "kernels.  Let $K_L$ be its terminal Gibbs kernel.  Multiplying each spin", "88": "weight by $A$ changes the iterated root logarithm by $\\log Y_0$, where", "89": "\\eqref{tree:Y-recursion} uses the kernels before insertion.  The new", "90": "kernels are \\eqref{tree:updated-kernel}.", "91": "", "92": "For an internal vertex $\\beta$ of a prescribed tree, let $d_\\beta$ be", "93": "its depth, let $n_\\beta$ be its number of children, and put", "94": "\\[", "95": "  \\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}.", "96": "\\]", "97": "The conditional joint density of its updated tree law is", "98": "\\begin{equation}\\label{tree:density}", "99": "  W_{\\mathcal T}(A)", "100": "  :=\\frac{dP_{\\mathcal T}^A}{dP_{\\mathcal T}}", "101": "  =\\prod_{a\\in\\operatorname{Leaves}(\\mathcal T)}A^a", "102": "       \\prod_{\\beta\\in\\operatorname{Int}(\\mathcal T)}", "103": "            Y_\\beta^{\\gamma_\\beta}.", "104": "\\end{equation}", "105": "Here $Y_\\beta$ is $Y_{d_\\beta}$ evaluated on the prefix at $\\beta$.", "106": "", "107": "The recursion is monotone and homogeneous: if $a\\leq A\\leq b$, for", "108": "positive root-measurable $a,b$, then $a\\leq Y_d\\leq b$ at every depth;", "109": "and multiplying $A$ by a positive root-measurable constant multiplies", "110": "every $Y_d$ by that constant.", "111": "\\end{lemma}", "112": "", "113": "\\begin{proof}", "114": "At the terminal spin integration, the partition-function ratio is", "115": "$K_LA=Y_{L-1}$, because $m_L=1$.  If $X_d$ and $X_d^A$ are the old and", "116": "new backward logarithms, substitution in the preceding power mean", "117": "gives", "118": "\\[", "119": "  \\exp\\bigl(m_d(X_{d-1}^A-X_{d-1})\\bigr)", "120": "  =K_d\\exp\\bigl(m_d(X_d^A-X_d)\\bigr).", "121": "\\]", "122": "Backward induction proves $X_d^A-X_d=\\log Y_d$ and then gives", "123": "\\eqref{tree:updated-kernel}; the same formula at $d=L$ is the usual", "124": "Gibbs density ratio.", "125": "", "126": "Multiply the edge density ratios in \\eqref{tree:updated-kernel} over", "127": "the tree.  An internal vertex at positive depth $d$ receives exponent", "128": "$m_d$ from its incoming edge and exponent $-n_\\beta m_{d+1}$ from its", "129": "outgoing edges.  At the root there is no incoming edge, which agrees", "130": "with $m_0=0$.  Each terminal vertex receives exponent $m_L=1$.", "131": "This proves \\eqref{tree:density}.  Monotonicity and homogeneity follow", "132": "at once by backward induction in \\eqref{tree:Y-recursion}.", "133": "\\end{proof}", "134": "", "135": "An insertion may use additional variables that were absent from the", "136": "original model.  Enlarge each path kernel by their independent prior", "137": "kernels before applying the lemma.  The original backward logarithms", "138": "do not depend on these variables, so the original tilt leaves their", "139": "conditional prior kernels unchanged.  Additional root variables remain", "140": "quenched.", "141": "", "142": "We will use differentiation of \\eqref{tree:Y-recursion}.  For", "143": "$A_{\\boldsymbol t}=1+\\sum_{j=1}^k t_jD_j$, where the real path functions", "144": "$D_j$ are bounded, differentiation on any real neighborhood where", "145": "$A_{\\boldsymbol t}$ is uniformly positive gives", "146": "\\begin{equation}\\label{tree:first-variation}", "147": "  \\partial_{t_j}\\log Y_d", "148": "  =E^{A_{\\boldsymbol t}}\\left[", "149": "       \\left.\\frac{D_j}{A_{\\boldsymbol t}}\\right|\\mathscr F_d\\right].", "150": "\\end{equation}", "151": "The conditional expectation on the right follows one new path below", "152": "the specified prefix.  Indeed, differentiating one power mean gives", "153": "$\\partial_{t_j}\\log Y_{d-1}=K_d^{A_{\\boldsymbol t}}", "154": "\\partial_{t_j}\\log Y_d$, and the terminal derivative is $D_j/A$.", "155": "", "156": "\\paragraph{Analytic bounds.}", "157": "The expressions are analytic on the complex domain", "158": "\\[", "159": " \\sum_j|t_j|\\|D_j\\|_\\infty<1,", "160": "\\]", "161": "with bounds uniform over the kernels.", "162": "On a smaller closed domain with this sum at most $\\rho<1$, $A$ has argument bounded", "163": "by $\\vartheta=\\arcsin\\rho<\\pi/2$ and modulus between $1-\\rho$ and", "164": "$1+\\rho$.  If $Y_d$ has argument in $[-\\vartheta,\\vartheta]$, then", "165": "$K_dY_d^{m_d}$ has argument in", "166": "$[-m_d\\vartheta,m_d\\vartheta]$, using the principal powers.  It is", "167": "nonzero, and taking its $1/m_d$ power gives the same argument bound", "168": "for $Y_{d-1}$.  More quantitatively, a lower modulus bound $a_d>0$", "169": "gives the lower bound", "170": "$a_{d-1}=a_d\\cos(m_d\\vartheta)^{1/m_d}>0$, whereas the upper modulus", "171": "bound $1+\\rho$ is preserved.  These bounds justify integration of", "172": "analytic functions at each step and all subsequent differentiations.", "173": "They also bound \\eqref{tree:density}, its canceled versions below,", "174": "and their derivatives on smaller domains, uniformly over the kernels", "175": "for fixed depth, exponents, tree size, and bounds on the inserted", "176": "functions.", "177": "", "178": "\\subsection{The two expansion rules}", "179": "", "180": "Call a leaf \\emph{protected} if its factor $A^a$ in the tree density is", "181": "canceled by a denominator $A^a$.  For a set $C$ of protected leaves and", "182": "a bounded parameter-independent function $G$, consider", "183": "$E_{\\mathcal T}^A[G\\prod_{a\\in C}(A^a)^{-1}]$.", "184": "Differentiating", "185": "\\eqref{tree:density} shows that", "186": "\\[", "187": " \\partial_{t_j}\\log W_{\\mathcal T}(A)", "188": "   =\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\frac{D_j^a}{A^a}", "189": "      +\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}", "190": "           \\gamma_\\beta\\,\\partial_{t_j}\\log Y_\\beta.", "191": "\\]", "192": "In the derivative of", "193": "$E_{\\mathcal T}^A[G\\prod_{a\\in C}(A^a)^{-1}]$, the leaf terms at", "194": "$a\\in C$ cancel exactly with differentiation of their denominators.", "195": "Each remaining leaf term inserts $D_j^a/A^a$ and makes that leaf", "196": "protected.  By \\eqref{tree:first-variation}, an internal-vertex term", "197": "is the same expectation after adjoining an independent updated path", "198": "below $\\beta$, with an additional factor $D_j/A$ at its terminal", "199": "vertex.  This is precisely a fresh path at $\\beta$, with coefficient", "200": "$\\gamma_\\beta$, and its new leaf is protected.  Conditional", "201": "independence of children and the projectivity of tree sampling justify", "202": "this representation even when $G$ uses the other children of $\\beta$.", "203": "", "204": "For a tree with $n$ leaves, telescoping gives the useful identity", "205": "\\begin{equation}\\label{tree:telescoping}", "206": "  \\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}", "207": "       \\bigl(n_\\beta m_{d_\\beta+1}-m_{d_\\beta}\\bigr)=n.", "208": "\\end{equation}", "209": "All summands are positive.  Define a probability law $Q_k$ on trees", "210": "with leaves labeled $1,\\ldots,k$ as follows.  Start with a single path.", "211": "When the current tree has $n$ leaves, choose an internal vertex", "212": "$\\beta$ with probability", "213": "\\begin{equation}\\label{tree:Q-rule}", "214": "  \\frac{n_\\beta m_{d_\\beta+1}-m_{d_\\beta}}{n},", "215": "\\end{equation}", "216": "create a fresh child there, and continue with a completely new path", "217": "to depth $L$.  Give its terminal vertex label $n+1$.  Identity", "218": "\\eqref{tree:telescoping} verifies the normalization.  The random tree", "219": "is chosen independently of all variables subsequently sampled on it.", "220": "For example, under $Q_2$ the two paths split at depth $d$ with probability", "221": "$m_{d+1}-m_d$, for $0\\le d<L$. This split is uniform on the depths when", "222": "$m_d=d/L$.", "223": "", "224": "\\begin{lemma}[Logarithmic expansion]\\label[lemma]{tree:log-expansion}", "225": "For a bounded real path function $D$ and $A=1+tD$,", "226": "\\begin{equation}\\label{tree:log-series}", "227": "  \\log Y_0", "228": "   =\\sum_{k\\geq1}\\frac{(-1)^{k-1}t^k}{k}", "229": "       \\mathbb E_{Q_k}E_{\\mathcal T}", "230": "          \\prod_{a=1}^k D^a,", "231": "       \\qquad |t|\\|D\\|_\\infty<1.", "232": "\\end{equation}", "233": "This identity is conditional on the root.  If", "234": "$|t|\\|D\\|_\\infty\\leq c<1$, the absolute value of the remainder after", "235": "order $K$ is at most", "236": "\\begin{equation}\\label{tree:log-tail}", "237": "  \\sum_{k>K}\\frac{c^k}{k}.", "238": "\\end{equation}", "239": "\\end{lemma}", "240": "", "241": "\\begin{proof}", "242": "The first derivative is, by", "243": "\\eqref{tree:first-variation}, the expectation of $D/A$ on one updated", "244": "path.  Protect that leaf.  Every subsequent derivative can only add", "245": "a fresh path, because all current leaves are protected.  At order", "246": "$k$, all $k-1$ fresh coefficients are negative.  After normalization", "247": "by \\eqref{tree:telescoping}, their absolute products are", "248": "$(k-1)!$ times the probabilities in $Q_k$.  Therefore", "249": "\\[", "250": "  \\left.\\frac{d^k}{dt^k}\\log Y_0\\right|_{t=0}", "251": "    =(-1)^{k-1}(k-1)!\\,", "252": "       \\mathbb E_{Q_k}E_{\\mathcal T}\\prod_{a=1}^kD^a.", "253": "\\]", "254": "Analyticity proves \\eqref{tree:log-series}; the coefficients have", "255": "absolute value at most $\\|D\\|_\\infty^k/k$, which proves the stated", "256": "convergence domain and \\eqref{tree:log-tail}.", "257": "\\end{proof}", "258": "", "259": "Here is the companion rule with old replicas.  Fix a tree", "260": "$\\mathcal T$ with an anchor leaf $a_*$.  Starting from all its old", "261": "paths, assign colors $1,\\ldots,k$ in that order.  For the next color,", "262": "one may either", "263": "\\begin{enumerate}[label=(\\roman*),nosep]", "264": "  \\item choose an unused old leaf other than $a_*$, with coefficient", "265": "  $1$; or", "266": "  \\item create a fresh path from any internal vertex $\\beta$ of the", "267": "  current tree, with coefficient", "268": "  $\\gamma_\\beta=m_{d_\\beta}-n_\\beta m_{d_\\beta+1}$.", "269": "\\end{enumerate}", "270": "Each fresh path uses a new child at its divergence vertex and new", "271": "vertices at every greater depth.  Every chosen leaf receives its color", "272": "and cannot be chosen again.  The current tree includes all old paths,", "273": "including unused ones, and every path already added.  An extension", "274": "history $E$ records these choices; write $a_j(E)$ for the leaf carrying", "275": "color $j$, $\\mathcal T_E$ for its final tree, and $c_E$ for the product", "276": "of its coefficients.", "277": "", "278": "\\begin{lemma}[Canceled-anchor expansion]\\label{tree:extension-expansion}", "279": "Let $H$ be a bounded function of the variables on the old tree, fixed", "280": "as the insertion parameters vary.  For", "281": "$A_{\\boldsymbol t}=1+\\sum_{j=1}^k t_jD_j$, with bounded real path", "282": "functions $D_j$, one has", "283": "\\begin{equation}\\label{tree:mixed-expansion}", "284": "  \\left.\\partial_{t_1}\\cdots\\partial_{t_k}", "285": "       E_{\\mathcal T}^{A_{\\boldsymbol t}}", "286": "        \\frac{H}{A_{\\boldsymbol t}^{a_*}}", "287": "  \\right|_{\\boldsymbol t=0}", "288": "   =\\sum_E c_E\\,", "289": "       E_{\\mathcal T_E}", "290": "          \\left[H\\prod_{j=1}^kD_j^{a_j(E)}\\right].", "291": "\\end{equation}", "292": "The formula holds in any fixed order of the colors.  For identical", "293": "directions $D_j=D$, the coefficient of $t^k$ is the right-hand side", "294": "divided by $k!$.  The analytic bounds established above apply to its", "295": "left-hand side, uniformly over the path kernels.  The empty extension has weight $1$.", "296": "\\end{lemma}", "297": "", "298": "\\begin{proof}", "299": "Begin with $C=\\{a_*\\}$ and $G=H$.", "300": "Apply the preceding rule successively, incorporating each new $D_j$", "301": "in $G$.  Fresh leaves are protected immediately, so the only", "302": "unprotected leaves are unused old leaves.  At zero all factors $A$", "303": "and $Y$ are $1$, proving the claimed rule and its coefficients.", "304": "\\end{proof}", "305": "", "306": "\\subsection{Sums of extension coefficients}", "307": "", "308": "We now control the signed normalization and the accumulated error in", "309": "the prescribed-tree identities used for the lower bound.", "310": "", "311": "In an extension history, the anchor and the already colored paths", "312": "are called reference paths.  Constraints on the new color will only", "313": "specify its splitting depths with these paths.  In particular, a", "314": "constraint does not distinguish unused old paths with the same", "315": "specified ancestry.", "316": "", "317": "To see the cancellation that must be controlled, start with two old", "318": "paths splitting at depth $d$, and let the first be the anchor. Require", "319": "one added color to split from the anchor exactly at $d$. It may use the", "320": "second old leaf, create a fresh path at the depth-$d$ vertex, or follow", "321": "the second old path and leave it at a depth $\\ell>d$. The respective", "322": "coefficients give the total", "323": "\\[", "324": "  1+(m_d-2m_{d+1})", "325": "       +\\sum_{\\ell=d+1}^{L-1}(m_\\ell-m_{\\ell+1})", "326": "  =m_d-m_{d+1}.", "327": "\\]", "328": "On the uniform mesh $m_d=d/L$, with $\\delta=L^{-1}$, this signed total", "329": "is $-\\delta$, but the sum of absolute coefficients is $2+\\delta$.", "330": "If instead the required split is delayed to $d+1<L$, the only allowed", "331": "choice is a fresh split at the unary depth-$(d+1)$ vertex on the anchor", "332": "path. Its coefficient is $-\\delta$, so the absolute sum is now $\\delta$.", "333": "The next two lemmas extend these two calculations: the first", "334": "computes signed totals, and the second controls absolute sums when", "335": "specified splits occur away from old branching depths.", "336": "", "337": "\\begin{lemma}[Reference-path totals]\\label{tree:reference-total}", "338": "Suppose the next color must follow a specified reference prefix to", "339": "depth $d$ and then enter a child distinct from all $j\\geq1$ children", "340": "there that contain reference paths.  Apart from these ancestry", "341": "constraints its continuation is unrestricted.  The sum of the", "342": "coefficients of all allowed choices is", "343": "\\begin{equation}\\label{tree:one-reference-total}", "344": "  m_d-jm_{d+1}.", "345": "\\end{equation}", "346": "Consequently, if the anchor and the colors must have a prescribed", "347": "tree $S$, the total coefficient over all compatible extensions of", "348": "any old tree is", "349": "\\begin{equation}\\label{tree:K}", "350": " \\kappa(S)=\\prod_{v\\in\\operatorname{Br}(S)}", "351": "           \\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1}),", "352": "\\end{equation}", "353": "where $a_v$ and $d_v$ are the child count and depth of each branching", "354": "vertex in the prescribed reference tree.  More generally, the same", "355": "one-step rule can be iterated starting from any already constructed", "356": "set of references.", "357": "\\end{lemma}", "358": "", "359": "\\begin{proof}", "360": "At the specified divergence vertex, let $n$ be the child count in", "361": "the entire current tree.  The $j$ excluded children contain all", "362": "references passing through that vertex.  Each of the other $n-j$", "363": "children roots a subtree containing no reference.  Its terminal", "364": "vertices are therefore unused old leaves.  If such a subtree is", "365": "rooted at depth $d+1$, its permitted choices are an old leaf, with", "366": "coefficient $1$, or a fresh divergence at an internal vertex in the", "367": "subtree.  If it has $q$ leaves, telescoping within it gives", "368": "\\[", "369": "  q+\\sum_{\\beta\\text{ internal in the subtree}}", "370": "       (m_{d_\\beta}-n_\\beta m_{d_\\beta+1})=m_{d+1}.", "371": "\\]", "372": "The formula includes the case of a terminal child, when both sides", "373": "are $1$.  Adding these contributions to the fresh choice at the", "374": "specified vertex gives", "375": "$m_d-nm_{d+1}+(n-j)m_{d+1}=m_d-jm_{d+1}$.", "376": "", "377": "For consistent prescribed splitting depths with all reference paths,", "378": "the deepest required common prefix determines the divergence vertex", "379": "and its excluded reference children.  Thus the one-step sum depends", "380": "only on the current reference tree, not on which old paths or fresh", "381": "paths realized it.  Sum backwards over successive choices.  At a", "382": "branching vertex of the final prescribed tree, the numbers of", "383": "excluded reference children when new child groups are first entered", "384": "are exactly $1,\\ldots,a_v-1$.  Their factors give", "385": "\\eqref{tree:K}, independently of the color order.", "386": "\\end{proof}", "387": "", "388": "To control errors after division by a small reference coefficient, we", "389": "also need an absolute bound.  Moving a target branching depth away from", "390": "all old branching depths forces a fresh unary split.  The next estimate", "391": "charges one small factor to each such vertex.", "392": "", "393": "\\begin{lemma}[Charging fresh splits]\\label{tree:charging}", "394": "Assume $m_d=d/L$ and put $\\delta=L^{-1}$.  Start with an old tree having", "395": "$q$ leaves and assign $k$ colors by the canceled-anchor extension", "396": "rule.  Prescribe the reference shape of the anchor and the colors,", "397": "possibly with additional restrictions on allowed extensions.  Suppose", "398": "$b$ specified branching vertices of that shape have depths which", "399": "are not branching depths anywhere in the old tree.  Then", "400": "\\begin{equation}\\label{tree:charging-bound}", "401": "   \\sum_{E\\text{ allowed}}|c_E|\\leq C_{q,k}\\delta^b.", "402": "\\end{equation}", "403": "The constant is independent of $L$, the prescribed depths, and their", "404": "coincidences at different vertices.", "405": "", "406": "In particular, for these $b$ vertices let", "407": "\\[", "408": " J=\\prod_v\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1}).", "409": "\\]", "410": "If $m_{d_v}\\geq\\eta>0$ at all of them, then $J\\ne0$ and", "411": "\\begin{equation}\\label{tree:relative-charging}", "412": "   \\frac{1}{|J|}\\sum_{E\\text{ allowed}}|c_E|", "413": "        \\leq C_{q,k,\\eta}.", "414": "\\end{equation}", "415": "\\end{lemma}", "416": "", "417": "\\begin{proof}", "418": "If the current tree has $s$ leaves, \\eqref{tree:telescoping} says", "419": "that the total absolute coefficient of all fresh choices is $s$.", "420": "There are at most $s$ eligible old choices.  Hence the total absolute", "421": "coefficient at an unrestricted step is at most $2s\\leq2(q+k)$.", "422": "At any fixed depth there are at most $s$ vertices.  Restricting a", "423": "step to fresh divergences at unary vertices of a prescribed depth", "424": "therefore gives total absolute coefficient at most $s\\delta$, because", "425": "each such divergence has coefficient $m_d-m_{d+1}=-\\delta$.", "426": "", "427": "Consider an allowed history and one of its specified target", "428": "branching vertices.  That vertex cannot already be branching in the", "429": "old tree.  At the first step at which it became branching in the", "430": "current tree, a fresh path must therefore have diverged there while", "431": "it was unary.  The vertex may itself have been created earlier as", "432": "part of a new unary path; the same conclusion then applies.  Distinct", "433": "target vertices become branching at distinct steps, since a fresh", "434": "path creates only one branching vertex.  Assign each of the $b$", "435": "vertices to its creation step.  There are at most", "436": "$k!/(k-b)!$ possible assignments (and necessarily $b\\leq k$).", "437": "", "438": "For each fixed assignment, enlarge the family of histories by", "439": "discarding all constraints except that a designated step creates a", "440": "unary split at its assigned depth.  Bound its step sum by", "441": "$(q+k)\\delta$ and every other step sum by $2(q+k)$.  Iterated summation", "442": "over choices gives at most", "443": "\\[", "444": " \\frac{k!}{(k-b)!}(q+k)^b\\bigl(2(q+k)\\bigr)^{k-b}\\delta^b.", "445": "\\]", "446": "This proves \\eqref{tree:charging-bound}, including repeated assigned", "447": "depths, because the designated steps remain distinct.", "448": "", "449": "For the final assertion, the $j=1$ factor at each designated vertex", "450": "has absolute value $\\delta$, whereas for $j\\geq2$", "451": "\\[", "452": "  |m_d-jm_{d+1}|=(j-1)m_d+j\\delta\\geq\\eta.", "453": "\\]", "454": "There are only a size-dependent number of the latter factors.  Thus", "455": "$|J|\\geq\\delta^b\\eta^{\\sum_v(a_v-2)}$, and the result follows.", "456": "\\end{proof}", "457": "", "458": "\\subsection{The distribution of branching depths}", "459": "", "460": "Still take $m_d=d/L$.  Suppress unary stretches only for the purpose", "461": "of describing a shape by a finite topology and its branching-depth", "462": "coordinates.  For $0<\\eta<1/2$, call a shape \\emph{regular} if every", "463": "branching depth divided by $L$ lies in $(\\eta,1-\\eta)$ and any two", "464": "distinct branching vertices have normalized depths differing by more", "465": "than $\\eta$.  A singleton is regular.  This is the regularity used", "466": "when sampling a single tree; later we also use two copies whose", "467": "corresponding depth assignments are deliberately aligned.", "468": "", "469": "\\begin{lemma}[Regular shapes]\\label[lemma]{tree:regular-shapes}", "470": "For every fixed $k$ there is $C_k<\\infty$, independent of $L$ and", "471": "$\\eta$, such that", "472": "\\begin{equation}\\label{tree:irregular-probability}", "473": "  Q_k\\{\\mathcal T\\text{ is not regular}\\}", "474": "        \\leq C_k(\\eta+L^{-1}).", "475": "\\end{equation}", "476": "For any particular labeled topology with $a$ branching vertices and", "477": "any consistent assignment of their depths,", "478": "\\begin{equation}\\label{tree:assignment-probability}", "479": "  Q_k\\{\\text{that topology and depth assignment}\\}", "480": "       \\leq C_kL^{-a}.", "481": "\\end{equation}", "482": "Deleting leaves from a regular tree produces a regular tree, after", "483": "discarding branching vertices that become unary.", "484": "\\end{lemma}", "485": "", "486": "\\begin{proof}", "487": "Suppose the current tree has $n$ leaves.  A new branching vertex is", "488": "created exactly when the next path diverges at a unary vertex.", "489": "Each such choice has probability $\\delta/n$ by", "490": "\\eqref{tree:Q-rule}.  At any depth there are at most $n$ vertices;", "491": "hence for a set $B$ of depths the probability that the next path", "492": "creates a branching vertex at a depth in $B$ is at most $|B|\\delta$.", "493": "At each of the first $k-1$ steps, the boundary depths and the depths", "494": "within normalized distance $\\eta$ of any previous branching vertex", "495": "form a set of cardinality at most $C_k(\\eta L+1)$.  If none of these", "496": "forbidden creation events occurs, the final tree is regular.", "497": "A union bound proves \\eqref{tree:irregular-probability}.  Divergence", "498": "at an already branching vertex does not create a new coordinate and", "499": "requires no extra exclusion.", "500": "", "501": "For \\eqref{tree:assignment-probability}, restrict a specified final", "502": "labeled tree to leaves $1,\\ldots,n$, retaining every unary stretch.", "503": "These restrictions determine its successive histories under", "504": "\\eqref{tree:Q-rule}.  Each of its $a$ branching vertices is first", "505": "created by a unary divergence, whose probability is at most", "506": "$\\delta$; every other transition probability is at most $1$.", "507": "The probability of the specified history is therefore at most", "508": "$\\delta^a$.  If a topology description identifies equivalent", "509": "child orderings, their number is bounded in terms of $k$ alone,", "510": "which gives the stated version with $C_k$.", "511": "Finally, a retained branching vertex after deletion was already a", "512": "branching vertex of the original tree, at the same depth.  Its depth", "513": "coordinates are a subset of the old ones, so regularity is preserved.", "514": "\\end{proof}", "515": "", "516": "\\begin{remark}\\label{tree:averaging-remark}", "517": "For fixed $k$ there are finitely many labeled topologies.  Therefore", "518": "\\eqref{tree:assignment-probability} converts an unnormalized depth", "519": "average $L^{-a}\\sum$ for a topology with $a$ branching coordinates", "520": "into a bound for its contribution under $Q_k$.  The same is true for", "521": "errors on subshapes: summing over coordinates discarded by the", "522": "subshape costs at most the corresponding power of $L$.  Together", "523": "with \\eqref{tree:irregular-probability}, this allows averaged estimates", "524": "on regular depth assignments to be used in the logarithmic expansion.", "525": "\\end{remark}"}, "upper.tex": {"1": "\\section{The interpolation upper bound}\\label{upper:section}", "2": "", "3": "The interpolation method of Guerra~\\cite{Guerra03}, adapted to diluted", "4": "systems by Franz and Leone~\\cite{FL03} and to arbitrary finite levels by", "5": "Panchenko and Talagrand~\\cite{PT04}, replaces each real interaction by", "6": "$p$ independent cavity interactions. The difference is", "7": "controlled by the convexity of $x\\mapsto x^p$. We give the argument for", "8": "the full trial class, including unbounded messages and integrable", "9": "physical disorder.", "10": "", "11": "\\begin{proposition}\\label[proposition]{upper:bound}", "12": "Under the hypotheses of \\cref{main:theorem},", "13": "$F_N\\le\\cB_r(\\zeta,\\mathbf m)$ for every $N$ and every admissible finite-level", "14": "trial law. Consequently $F_N\\le\\inf_{r\\ge0}\\Phi_r$.", "15": "\\end{proposition}", "16": "", "17": "\\begin{proof}", "18": "First dispose of the degenerate factorization. Put", "19": "$M=\\max_{s=\\pm1}|f(s)|$. If $b=0$ almost surely or $M=0$ almost surely,", "20": "the interaction is a spin-independent random constant $c$, and", "21": "\\[", "22": " F_N=\\cB_r=\\log2+\\E\\log\\cosh h+\\alpha\\E c", "23": "\\]", "24": "for every trial law. Otherwise choose $u,v>0$ with", "25": "$\\P(M\\ge u)>0$ and $\\P(|b|\\ge v)>0$. Since", "26": "$|b|\\prod_{\\ell=1}^p M_\\ell<1$ almost surely, independence gives", "27": "\\[", "28": " \\|b\\|_\\infty\\le u^{-p},\\qquad", "29": " \\|M\\|_\\infty\\le(vu^{p-1})^{-1}.", "30": "\\]", "31": "Indeed, violating either bound on a set of positive probability and", "32": "restricting the other independent factors to these lower bounds would", "33": "violate the strict product condition. All moments used below are", "34": "therefore finite.", "35": "", "36": "\\emph{Interpolation.}", "37": "Fix a trial law and set $L=r+1$. Interpolate between real interactions of mean $t\\alpha N$", "38": "and, at each site $i$, independent cavity interactions", "39": "$U_\\theta(x_1,\\ldots,x_{p-1};\\sigma_i)$ of mean $(1-t)\\alpha p$.", "40": "Different cavity terms have disjoint message labels. Counts, interactions,", "41": "fields, and root message measures are quenched. Apply the backward", "42": "power-mean recursion to the spin partition function and denote its expected", "43": "root logarithm divided by $N$ by $\\varphi(t)$. For $r=0$ all messages are", "44": "quenched and there is no auxiliary recursion. Independence between different", "45": "sites throughout the recursion gives", "46": "\\[", "47": " \\varphi(1)=F_N,\\qquad", "48": " \\varphi(0)=\\log2+\\E\\log T_0V_{\\rm s}.", "49": "\\]", "50": "", "51": "Poisson differentiation gives $\\varphi'(t)/\\alpha$ as the expected insertion", "52": "increment of one real interaction minus $p$ times the increment of one", "53": "cavity interaction at a uniform site. Each increment has absolute value at", "54": "most $B(\\theta)$, since the recursion preserves multiplicative bounds.", "55": "Conditioning on the counts justifies the derivative on $(0,1)$, and the same", "56": "bound gives continuity at the endpoints.", "57": "", "58": "We claim that", "59": "\\begin{equation}\\label{upper:derivative}", "60": " \\varphi'(t)+\\alpha(p-1)\\E\\log T_0V_{\\rm e}\\le0.", "61": "\\end{equation}", "62": "All three insertions have the form $a(1+D)$ under", "63": "\\eqref{model:factorization}. For a real interaction,", "64": "$D=b\\prod_\\ell f_\\ell(\\sigma_{i_\\ell})$; for a cavity interaction, replace", "65": "$p-1$ of the factors by", "66": "$\\bar f(x)=\\sum_s f(s)q_x(s)$; for an edge insertion, replace all $p$.", "67": "In the last case the independent message process is appended to the", "68": "unperturbed tilted tree, so its increment is $\\log T_0V_{\\rm e}$.", "69": "", "70": "\\emph{Normalization.}", "71": "We remove $a$ before taking expectations, so no integrability of", "72": "$\\log a$ is needed. Put", "73": "$D_*=b\\prod_\\ell f_\\ell(1)$ and $c=\\theta(1,\\ldots,1)$.", "74": "Subtract $c$ from each insertion increment. These integrable subtractions", "75": "cancel in the combination with coefficients $1,-p,p-1$.", "76": "Keep the interpolated system fixed. For $0<\\lambda<1$, replace", "77": "each normalized increment by", "78": "\\begin{equation}\\label{upper:regularization}", "79": " \\log Y_0(1+\\lambda D)-\\log(1+\\lambda D_*),", "80": "\\end{equation}", "81": "where $Y_0$ is the insertion recursion of \\cref{tree:log-expansion}.", "82": "For every spin input, the ratio", "83": "\\[", "84": " \\frac{1+\\lambda D}{1+\\lambda D_*}", "85": " =(1-w)+w\\frac{1+D}{1+D_*},", "86": " \\qquad w=\\frac{\\lambda(1+D_*)}{1+\\lambda D_*}\\in[0,1],", "87": "\\]", "88": "lies between $e^{-2B(\\theta)}$ and $e^{2B(\\theta)}$. The same is true", "89": "after averaging any subset of the spin inputs against the $q_x$'s.", "90": "It follows that \\eqref{upper:regularization} is bounded in absolute value by", "91": "$2B(\\theta)$. For each fixed interaction, convergence as $\\lambda\\uparrow1$", "92": "is uniform in the spin inputs and messages and is preserved by the finite", "93": "recursion. Dominated convergence therefore recovers the desired normalized", "94": "increments.", "95": "", "96": "\\emph{Convexity.}", "97": "Apply \\cref{tree:log-expansion} to the regularized increments. On a tree", "98": "$\\cT$ with $n$ replica leaves define", "99": "\\[", "100": " P_{\\cT}=\\frac1N\\sum_{i=1}^N\\E_f\\prod_{a=1}^n f(\\sigma_i^a),\\qquad", "101": " B_{\\cT}=\\E_{f,x}\\prod_{a=1}^n\\bar f(x^a).", "102": "\\]", "103": "Here $\\E_f$ averages one fresh function $f$, shared by all $n$ replica", "104": "factors in the product. The expectation $\\E_{f,x}$ also averages an", "105": "entire fresh message-label tree, including its root. This function and", "106": "message tree are independent of one another and of the old tilted system.", "107": "Thus $B_{\\cT}$ is deterministic for a fixed tree, while $P_{\\cT}$ still", "108": "depends on the old spin replicas. At $r=0$, the message itself is a root", "109": "variable shared by all replica leaves. Averaging the", "110": "independent uniform indices and the independent copies of $f$ and of", "111": "the new message label gives, respectively,", "112": "$P_{\\cT}^p$, $P_{\\cT}B_{\\cT}^{p-1}$, and $B_{\\cT}^p$.", "113": "The inserted $b$ is independent of these variables. Thus the order-$n$", "114": "coefficient of the combined regularized increment is", "115": "\\begin{equation}\\label{upper:remainder}", "116": " -\\frac{\\lambda^n}{n}\\E[(-b)^n]\\,", "117": " \\E_{Q_n}\\E\\left[", "118": " P_{\\cT}^p-pP_{\\cT}B_{\\cT}^{p-1}+(p-1)B_{\\cT}^p\\right].", "119": "\\end{equation}", "120": "The regularized baseline terms cancel. The tree law $Q_n$ is that of", "121": "\\cref{tree:log-expansion}; it is common to the three insertions.", "122": "The series is absolutely convergent for $\\lambda<1$, with each insertion", "123": "controlled by $\\sum_{n\\ge1}\\lambda^n/n$. Since $p$ is even,", "124": "convexity of $x\\mapsto x^p$ makes the bracket nonnegative, and", "125": "\\eqref{model:positivity} makes \\eqref{upper:remainder} nonpositive.", "126": "Taking $\\lambda\\uparrow1$ proves \\eqref{upper:derivative}. Integration over", "127": "$t\\in[0,1]$ gives the proposition.", "128": "\\end{proof}"}, "cavity.tex": {"1": "\\section{A perturbed cavity reservoir}\\label{cavity:section}", "2": "", "3": "We compare systems of sizes $N$ and $N+1$ through a common $N$-spin", "4": "system, the \\emph{reservoir}. This cavity comparison follows the", "5": "Aizenman--Sims--Starr variational scheme~\\cite{ASS03} and its", "6": "spin-distribution form in Panchenko~\\cite[Section~2.2]{Pan13}. We add a sublinear number of bounded perturbations", "7": "to obtain identities for its spin trees. The comparison below shows", "8": "that these perturbations change the pressure by $o(1)$ and preserve", "9": "the site-minus-bond cavity increment.", "10": "", "11": "Until \\cref{reduction:section}, assume that $B(\\theta)\\le B$ and", "12": "$|h|\\le H$ almost surely and that the law of $\\theta$ is invariant under", "13": "permutations of its $p$ coordinates. Neither the factorization nor the", "14": "positivity assumption is used in the lower bound.", "15": "", "16": "Fix $L\\ge2$ and use $r=L-1$ auxiliary levels with", "17": "\\begin{equation}\\label{cavity:grid}", "18": " m_d=d/L\\quad(0\\le d\\le L),\\qquad\\delta=1/L.", "19": "\\end{equation}", "20": "Let $(c_\\nu)_{\\nu\\ge1}$ be positive with $\\sum_\\nu c_\\nu=1$, and let", "21": "$s_N=N^{3/4}$. To the spin weight add independent Poisson families of", "22": "single-site factors $\\psi_\\nu$, with counts of means $c_\\nu s_N$ and", "23": "independent uniform sites in $[N]$. Each factor uses its own auxiliary", "24": "variables, drawn along the hierarchy with product priors, and satisfies", "25": "\\begin{equation}\\label{cavity:factor-bounds}", "26": " 1/2\\le\\psi_\\nu\\le3/2.", "27": "\\end{equation}", "28": "The total number of factors is $\\Pois(s_N)$ and is finite almost surely.", "29": "Counts, types, and sites are root variables. The parameters of the factors", "30": "are denoted by $\\mathbf u$ and are fixed, not quenched random variables,", "31": "unless a parameter average is explicitly taken. The factors needed later", "32": "are specified in \\cref{pert:section}.", "33": "", "34": "Apply the power-mean recursion to the resulting leaf partition function.", "35": "Write $P_N^{L,\\mathbf u}$ for its expected root logarithm. Comparing", "36": "pointwise with the unperturbed spin weight and then applying the recursion", "37": "gives", "38": "\\begin{equation}\\label{cavity:negligible}", "39": " |P_N^{L,\\mathbf u}-NF_N|\\le (\\log2)s_N,", "40": "\\end{equation}", "41": "uniformly in the hierarchy, its parameters, and $N$.", "42": "", "43": "\\begin{lemma}[Cavity increments]\\label[lemma]{cavity:increment}", "44": "The increments $\\Delta_N^{L,\\mathbf u}=P_{N+1}^{L,\\mathbf u}-P_N^{L,\\mathbf u}$", "45": "are uniformly bounded in $N,L,\\mathbf u$. There is a reservoir on $N$ spins", "46": "with physical interaction count of mean", "47": "\\begin{equation}\\label{cavity:reservoir-mean}", "48": " \\rho_N=\\alpha(N+1)\\left(\\frac{N}{N+1}\\right)^p,", "49": "\\end{equation}", "50": "the usual fields, and the perturbation counts of means $c_\\nu s_N$, such that", "51": "\\begin{equation}\\label{cavity:identity}", "52": " \\Delta_N^{L,\\mathbf u}", "53": " =\\log2+\\E\\log Y_{0,\\rm s}-\\E\\log Y_{0,\\rm b}+o_N(1).", "54": "\\end{equation}", "55": "The error is uniform in $L,\\mathbf u$. The insertion recursion uses the", "56": "tilted reservoir kernels and independent new root disorder, with terminal", "57": "insertions", "58": "\\begin{align}", "59": " A_{\\rm s}(\\sigma)&=\\frac12\\sum_{\\eps=\\pm1}", "60": " \\exp\\left(h\\eps+\\sum_{j=1}^{K_{\\rm s}}", "61": " \\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p-1,j}},\\eps)\\right),", "62": " \\label{cavity:site-insertion}\\\\", "63": " A_{\\rm b}(\\sigma)&=\\exp\\left(\\sum_{j=1}^{K_{\\rm b}}", "64": " \\theta_j(\\sigma_{i_{1,j}},\\ldots,\\sigma_{i_{p,j}})\\right),", "65": " \\label{cavity:bond-insertion}", "66": "\\end{align}", "67": "where $K_{\\rm s}\\sim\\Pois(\\alpha p)$, $K_{\\rm b}\\sim\\Pois(\\alpha(p-1))$,", "68": "and all displayed indices are independent uniform indices in $[N]$.", "69": "\\end{lemma}", "70": "", "71": "\\begin{proof}", "72": "\\emph{The physical interactions.}", "73": "Split the Poisson interaction process of the $(N+1)$-spin system according", "74": "to the number of indices equal to $N+1$. Terms with no new index have mean", "75": "$\\rho_N$. Terms with exactly one new index have mean", "76": "$\\alpha p(N/(N+1))^{p-1}=\\alpha p+O(N^{-1})$; by permutation invariance we", "77": "may place the new input last. Their other indices are independent uniform", "78": "indices in $[N]$, and their interaction functions retain the prescribed", "79": "law. Terms with at least two new indices have total mean $O(N^{-1})$.", "80": "Meanwhile, the $N$-spin system can be obtained from the same reservoir by", "81": "adding a Poisson number of old interactions of mean", "82": "\\[", "83": " \\alpha N-\\rho_N=\\alpha(p-1)+O(N^{-1}).", "84": "\\]", "85": "These quantities are nonnegative for all sufficiently large $N$.", "86": "", "87": "\\paragraph{The perturbations.}", "88": "The old-site perturbation count in the $(N+1)$-spin system has total mean", "89": "$s_{N+1}N/(N+1)$, and the new-site count has mean $s_{N+1}/(N+1)$.", "90": "Couple these processes to the reservoir perturbations using common Poisson", "91": "points. The expected number of unmatched factors is at most", "92": "\\[", "93": " |s_{N+1}-s_N|+2s_{N+1}/(N+1)=O(N^{-1/4}).", "94": "\\]", "95": "Deleting or adding a perturbation changes the root logarithm by at most", "96": "$\\log2$; an interaction changes it by at most $B$. An unused auxiliary", "97": "variable can simply be integrated out with its prior, so these comparisons", "98": "remain valid when the number of auxiliary variables changes.", "99": "", "100": "\\paragraph{The increment.}", "101": "We may consequently discard the repeated-new-index interactions, match the", "102": "perturbations, and replace the two insertion count means by their limits", "103": "at a total expected cost $O(N^{-1/4})$. Summing over the new spin gives", "104": "$2A_{\\rm s}$, while the old-system correction gives $A_{\\rm b}$.", "105": "The factor $2$ supplies the term $\\log2$ in the increment. The insertion", "106": "identity for the power means then proves", "107": "\\eqref{cavity:identity}. Finally,", "108": "\\[", "109": " |\\log Y_{0,\\rm s}|\\le H+BK_{\\rm s},\\qquad", "110": " |\\log Y_{0,\\rm b}|\\le BK_{\\rm b}.", "111": "\\]", "112": "Together with the coupling estimate this bounds the increments for large", "113": "$N$; increasing the constant covers the remaining sizes. All estimates are", "114": "uniform in $L$ and $\\mathbf u$.", "115": "\\end{proof}", "116": "", "117": "In the rest of the lower-bound proof, all spin trees are sampled from this", "118": "reservoir using its tilted auxiliary kernels and its terminal Gibbs kernel.", "119": "The reservoir retains an independent Poisson interaction process of mean", "120": "$O(N)$ and $N$ independent bounded fields. Thus the concentration argument", "121": "applies to its slightly modified interaction mean as well."}, "perturbations.tex": {"1": "\\section{Perturbations and identities on prescribed trees}", "2": "\\label{pert:section}", "3": "", "4": "Throughout this section the interaction and field are bounded, and the", "5": "depth $L\\geq2$ is fixed.  The arguments apply both to the $N$-spin system", "6": "and to the reservoir in \\cref{cavity:increment}. Its physical disorder", "7": "consists of independent bounded interactions with a Poisson count of", "8": "mean $O(N)$, together with $N$ independent bounded fields.", "9": "All expectations in a statement at a specified parameter vector are", "10": "taken with that vector held fixed.", "11": "", "12": "We choose perturbations whose derivatives concentrate, while selecting", "13": "cavity increments at most an arbitrarily small error above the", "14": "unperturbed liminf. A Poisson insertion", "15": "then turns concentration into Taylor-coefficient identities. Independent", "16": "signs along the inserted paths select the prescribed splitting depths.", "17": "The use of concentration to obtain overlap identities has antecedents", "18": "in the self-averaging argument of Ghirlanda--Guerra~\\cite{GG98}.", "19": "Related antecedents are the stochastic-stability relations of", "20": "Aizenman--Contucci~\\cite{AC98} and their extensions to diluted", "21": "multioverlaps by Barra and De Sanctis~\\cite{BarraDeSanctis07}.", "22": "Panchenko's spin-distribution identities~\\cite{Pan13} provide the cavity", "23": "context. The bounded perturbation family and the identities on colored", "24": "finite trees needed here are constructed and proved below.", "25": "", "26": "\\subsection{The perturbation family}", "27": "", "28": "A \\emph{mark specification} consists of a finite number $n\\geq0$ of", "29": "labeled Rademacher coordinates, a depth in $\\{1,\\ldots,L-1\\}$ assigned", "30": "to each coordinate, two functions", "31": "$g,g_0:\\{-1,1\\}^n\\to\\mathbb Q\\cap[-1,1]$, and a choice $S_0=1$ or", "32": "$S_0=\\sigma_i$. Each coordinate is sampled at its assigned depth along", "33": "an auxiliary path. Distinct coordinates are independent; the value of", "34": "a coordinate is shared at a shared vertex and is independent at", "35": "different vertices. The case $n=0$ includes constant functions.", "36": "We use all such specifications, a countable collection because each", "37": "sign domain is finite. Products of signs and their rational averages", "38": "belong to this collection; these will select branching patterns.", "39": "", "40": "The two parameters have different roles: differentiation in $u$ produces", "41": "a concentrated score, while the values of $t$ probe an insertion's Taylor", "42": "expansion. Taking $u$ smaller than every fixed power of $t$ will force", "43": "each limiting Taylor coefficient to vanish. For each specification", "44": "include types indexed by all integers $j\\geq4$.", "45": "The type $\\nu$ corresponding to this specification and $j$ has", "46": "\\begin{equation}", "47": " t_\\nu=j^{-1},\\qquad", "48": " I_\\nu=[j^{-j},2j^{-j}],\\qquad u_\\nu\\in I_\\nu.", "49": " \\label{pert:parameters}", "50": "\\end{equation}", "51": "Enumerate these types by $\\nu\\in\\mathbb N$ and choose constants", "52": "$c_\\nu>0$ with $\\sum_\\nu c_\\nu=1$.  Independently for each type, put", "53": "$n_\\nu\\sim\\operatorname{Poisson}(c_\\nu s_N)$, where $s_N=N^{3/4}$.", "54": "Each term has an independent uniform site $i\\in[N]$ and an independent", "55": "copy of its mark process.  At a leaf it multiplies the spin weight by", "56": "\\begin{equation}", "57": " \\psi_\\nu=1+t_\\nu g\\sigma_i+u_\\nu g_0S_0.", "58": " \\label{pert:factor}", "59": "\\end{equation}", "60": "In particular $1/2<\\psi_\\nu<3/2$.  Counts, types, and sites belong to the", "61": "root; the mark variables are sampled with their product priors at their", "62": "assigned auxiliary depths.  Since the total count is", "63": "$\\operatorname{Poisson}(s_N)$, this construction uses only finitely many", "64": "terms almost surely.  The factor bound permits termwise comparison", "65": "through the power means, as in \\eqref{cavity:negligible}.", "66": "", "67": "Write $\\pi$ for the product of the uniform probability measures on the", "68": "intervals $I_\\nu$, and $\\mathbf u=(u_\\nu)_\\nu$. We use $\\pi$ to select", "69": "deterministic parameter vectors, not as part of their quenched law.", "70": "Each interval has fixed positive length for a fixed type; concentration", "71": "estimates may therefore depend on its length.", "72": "", "73": "\\subsection{Concentration of each perturbation score}", "74": "", "75": "For one type $\\nu$, define on a tilted path, including its terminal", "76": "Gibbs configuration,", "77": "\\begin{equation}", "78": " D_\\nu
