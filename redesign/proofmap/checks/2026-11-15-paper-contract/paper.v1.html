n$이다. 어떤 깊이에도 vertex는 많아야 $n$개다. 그러므로 깊이 집합 $B$에 대해 다음 path가 $B$ 안 깊이에 branching vertex를 만들 확률은 $|B|\\delta$ 이하다. 처음 $k-1$ 걸음 각각에서, 경계 깊이와 앞선 어떤 branching vertex에서 정규화 거리 $\\eta$ 안에 있는 깊이들은 크기 $C_k(\\eta L+1)$ 이하의 집합을 이룬다. 이 금지된 생성 사건이 하나도 일어나지 않으면 최종 tree는 regular다. union bound가 (tree:irregular-probability)를 증명한다. 이미 branching인 vertex에서의 divergence는 새 좌표를 만들지 않으므로 추가로 뺄 필요가 없다."}, "tree:regular-shapes.s2": {"title": "특정 깊이 배정의 확률 $\\le C_kL^{-a}$", "math": "(tree:assignment-probability)를 위해, 지정된 최종 labeled tree를 unary 구간을 모두 남긴 채 leaf $1,\\ldots,n$으로 제한한다. 이 제한들이 (tree:Q-rule) 아래의 연속된 history를 정한다. $a$개 branching vertex 각각은 처음에 unary divergence로 만들어지고 그 확률은 $\\delta$ 이하다. 다른 모든 전이 확률은 $1$ 이하다. 따라서 지정된 history의 확률은 $\\delta^a$ 이하다. topology 기술이 동치인 자식 순서들을 같게 보면, 그 수는 $k$만으로 유계이고 이것이 $C_k$를 붙인 판을 준다."}, "tree:regular-shapes.s3": {"title": "leaf를 지워도 regular", "math": "지운 뒤 남은 branching vertex는 원래 tree에서 이미 같은 깊이의 branching vertex였다. 그 깊이 좌표는 옛 좌표의 부분집합이므로 regularity가 보존된다."}, "tree:telescoping": {"title": "망원 항등식 $\\sum_\\beta(n_\\beta m_{d_\\beta+1}-m_{d_\\beta})=n$", "math": "leaf가 $n$개인 tree $\\mathcal T$ (x:tree-sampling)에서 $\\operatorname{Int}(\\mathcal T)$를 내부 vertex(root와 unary vertex 포함)의 집합, 내부 vertex $\\beta$의 깊이를 $d_\\beta$, 자식 수를 $n_\\beta$라 하자(trees.tex 92–93의 정의). 망원 합이\n$$\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\bigl(n_\\beta m_{d_\\beta+1}-m_{d_\\beta}\\bigr)=n$$\n을 준다. 모든 항은 양이다."}, "upper:bound": {"title": "interpolation 상한 $F_N\\le\\mathcal B_r(\\zeta,\\mathbf m)$", "math": "main:theorem의 가정(x:model-hypotheses) 아래, 모든 $N$ 과 모든 admissible 유한 단계 시행 법칙에 대해\n$$F_N\\le\\mathcal B_r(\\zeta,\\mathbf m).$$\n따라서 $F_N\\le\\inf_{r\\ge0}\\Phi_r$.\n(작성자 읽기: \"admissible\"은 원문에 정의가 없다. $r\\ge1$ 이면 $\\zeta\\in\\mathcal M_{r+1}$, $0<m_1<\\cdots<m_r<1$ (model:chain), $r=0$ 이면 $\\zeta\\in\\mathcal P(\\mathbb R)$ (x:model-depth-zero)로 읽었다. 이것이 $\\Phi_r$ 의 inf 범위와 같다. 근거: model.tex 70–71, 118–120이 시행 법칙을 그렇게만 정의한다; upper.tex 14 \"Consequently $F_N\\le\\inf_{r\\ge0}\\Phi_r$\"가 따르려면 inf 범위 전체가 admissible이어야 한다; upper.tex 7–9 \"the full trial class, including unbounded messages\"; overview.tex 39–40과 reduction.tex 19 \"all trial laws, including $r=0$\". 검토자 동의.)"}, "upper:bound.s1": {"title": "퇴화 경우와 $b$, $M$ 의 본질적 유계성", "math": "$M=\\max_{s=\\pm1}\\lvert f(s)\\rvert$ 로 둔다. $b=0$ a.s. 이거나 $M=0$ a.s. 이면 상호작용은 spin 무관인 무작위 상수 $c$ 이고, 모든 시행 법칙에 대해\n$$F_N=\\mathcal B_r=\\log2+\\mathbb E\\log\\cosh h+\\alpha\\mathbb Ec.$$\n그렇지 않으면 $\\mathbb P(M\\ge u)>0$, $\\mathbb P(\\lvert b\\rvert\\ge v)>0$ 인 $u,v>0$ 을 고른다. $\\lvert b\\rvert\\prod_{\\ell=1}^pM_\\ell<1$ a.s. 이므로 독립성에서\n$$\\lVert b\\rVert_\\infty\\le u^{-p},\\qquad\\lVert M\\rVert_\\infty\\le(vu^{p-1})^{-1}.$$\n실제로 어느 한계든 양의 확률 집합에서 어기고 나머지 독립 인자를 이 하계로 제한하면 엄격한 곱 조건을 어기게 된다. 따라서 이후에 쓰는 모든 moment는 유한하다."}, "upper:bound.s2": {"title": "interpolation $\\varphi(t)$ 와 두 끝점", "math": "시행 법칙을 고정하고 $L=r+1$ 로 둔다. 평균 $t\\alpha N$ 의 실제 상호작용과, 각 site $i$ 에서 평균 $(1-t)\\alpha p$ 의 독립 cavity 상호작용 $U_\\theta(x_1,\\ldots,x_{p-1};\\sigma_i)$ 사이를 보간한다. 서로 다른 cavity 항은 서로소인 message label을 쓴다. 개수, 상호작용, 장, root message 측도는 quenched이다. spin 분배함수에 backward power-mean recursion을 적용하고, 그 root logarithm의 기대값을 $N$ 으로 나눈 것을 $\\varphi(t)$ 로 쓴다. $r=0$ 에서는 모든 message가 quenched이고 보조 recursion이 없다. recursion 전체에서 서로 다른 site가 독립이므로\n$$\\varphi(1)=F_N,\\qquad\\varphi(0)=\\log2+\\mathbb E\\log T_0V_{\\rm s}.$$"}, "upper:bound.s3": {"title": "Poisson 미분: $\\varphi^\\prime(t)/\\alpha$ 를 삽입 증분으로", "math": "Poisson 미분은 $\\varphi'(t)/\\alpha$ 를 실제 상호작용 하나의 기대 삽입 증분에서, 균일 site에 놓은 cavity 상호작용 하나의 증분의 $p$ 배를 뺀 것으로 준다. recursion이 곱셈적 한계를 보존하므로 각 증분의 절댓값은 $B(\\theta)$ 이하다. 개수에 조건을 걸면 $(0,1)$ 에서 도함수가 정당화되고, 같은 한계가 끝점에서의 연속성을 준다."}, "upper:bound.s4": {"title": "$t\\in[0,1]$ 에서 적분", "math": "$t\\in[0,1]$ 에서 적분하면 명제가 나온다.\n(작성자 풀이: upper:bound.s3의 끝점 연속성과 (4.1)에서 $F_N-\\log2-\\mathbb E\\log T_0V_{\\rm s}=\\varphi(1)-\\varphi(0)=\\int_0^1\\varphi'(t)\\,dt\\le-\\alpha(p-1)\\mathbb E\\log T_0V_{\\rm e}$, 곧 $F_N\\le\\mathcal B_r(\\zeta,\\mathbf m)$. 시행 법칙과 $r$ 에 대해 inf를 취하면 $F_N\\le\\inf_{r\\ge0}\\Phi_r$.)"}, "upper:derivative": {"title": "핵심 부등식 $\\varphi^\\prime(t)+\\alpha(p-1)\\mathbb E\\log T_0V_{\\rm e}\\le0$ (4.1)", "math": "모든 $t\\in(0,1)$ 에서 (작성자 보탬: 원문 58–61은 범위를 적지 않는다. 55행 \"justifies the derivative on $(0,1)$\"에서 온 범위다)\n$$\\varphi'(t)+\\alpha(p-1)\\mathbb E\\log T_0V_{\\rm e}\\le0.\\tag{4.1}$$\n(작성자 정리: upper:bound.s3와 함께 읽으면, 보간된 계에 실제 상호작용 하나, 균일 site의 cavity 상호작용 하나, edge 삽입 하나를 넣는 증분을 $I_{\\rm real}$, $I_{\\rm cav}$, $I_{\\rm e}$ 라 할 때 $\\mathbb E[I_{\\rm real}-pI_{\\rm cav}+(p-1)I_{\\rm e}]\\le0$ 과 같다. $I_{\\rm e}=\\log T_0V_{\\rm e}$ 는 upper:derivative.s1.)"}, "upper:derivative.s1": {"title": "세 삽입의 꼴 $a(1+D)$ 와 edge 증분 $\\log T_0V_{\\rm e}$", "math": "주장 (4.1)을 세운다(upper:derivative). (2.3) 아래 세 삽입은 모두 $a(1+D)$ 꼴이다. 실제 상호작용이면 $D=b\\prod_\\ell f_\\ell(\\sigma_{i_\\ell})$, cavity 상호작용이면 $p-1$ 개 인자를\n$$\\bar f(x)=\\sum_sf(s)q_x(s)$$\n로 바꾸고, edge 삽입이면 $p$ 개 모두 바꾼다. 마지막 경우 독립 message 과정은 섭동되지 않은 tilted tree에 덧붙여지므로 그 증분은 $\\log T_0V_{\\rm e}$ 이다."}, "upper:regularization": {"title": "정규화: $a$ 떼기, $c$ 빼기, $\\lambda<1$ 정규화 (4.2)", "math": "기대값을 취하기 전에 $a$ 를 떼므로 $\\log a$ 의 적분 가능성은 필요 없다. $D_*=b\\prod_\\ell f_\\ell(1)$, $c=\\theta(1,\\ldots,1)$ 로 두고 각 삽입 증분에서 $c$ 를 뺀다. 이 적분 가능한 뺄셈은 계수 $1,-p,p-1$ 의 결합에서 상쇄된다. 보간된 계는 고정한다. $0<\\lambda<1$ 에 대해 정규화된 증분 각각을\n$$\\log Y_0(1+\\lambda D)-\\log(1+\\lambda D_*)\\tag{4.2}$$\n로 바꾼다. 여기서 $Y_0$ 는 tree:log-expansion의 insertion recursion이다. 모든 spin 입력에 대해 비\n$$\\frac{1+\\lambda D}{1+\\lambda D_*}=(1-w)+w\\frac{1+D}{1+D_*},\\qquad w=\\frac{\\lambda(1+D_*)}{1+\\lambda D_*}\\in[0,1]$$\n는 $e^{-2B(\\theta)}$ 와 $e^{2B(\\theta)}$ 사이에 있다. spin 입력의 임의 부분집합을 $q_x$ 들로 평균한 뒤에도 같다. 따라서 (4.2)의 절댓값은 $2B(\\theta)$ 이하다. 각 고정 상호작용에 대해 $\\lambda\\uparrow1$ 의 수렴은 spin 입력과 message에 균일하고 유한 recursion이 그것을 보존한다. dominated convergence가 원하는 정규화된 증분을 회복한다."}, "upper:remainder": {"title": "볼록성: 나머지항의 $n$차 계수 (4.3)와 부호", "math": "정규화된 증분에 tree:log-expansion을 적용한다. replica leaf $n$ 개의 tree $\\mathcal T$ 위에서\n$$P_{\\mathcal T}=\\frac1N\\sum_{i=1}^N\\mathbb E_f\\prod_{a=1}^nf(\\sigma_i^a),\\qquad B_{\\mathcal T}=\\mathbb E_{f,x}\\prod_{a=1}^n\\bar f(x^a).$$\n$\\mathbb E_f$ 는 새 함수 $f$ 하나를 평균하며 곱의 $n$ 개 replica 인자가 그것을 공유한다. $\\mathbb E_{f,x}$ 는 root를 포함해 새 message-label tree 전체도 평균한다. 이 함수와 message tree는 서로 독립이고 옛 tilted 계와도 독립이다. 따라서 $B_{\\mathcal T}$ 는 고정 tree에서 결정적이고 $P_{\\mathcal T}$ 는 옛 spin replica에 의존한다. $r=0$ 에서는 message 자체가 모든 replica leaf가 공유하는 root 변수다. 독립 균일 index와 $f$, 새 message label의 독립 사본을 평균하면 세 삽입에서 각각 $P_{\\mathcal T}^p$, $P_{\\mathcal T}B_{\\mathcal T}^{p-1}$, $B_{\\mathcal T}^p$ 가 나온다. 삽입된 $b$ 는 이 변수들과 독립이다. 그래서 결합된 정규화 증분의 $n$차 계수는\n$$-\\frac{\\lambda^n}{n}\\mathbb E[(-b)^n]\\,\\mathbb E_{Q_n}\\mathbb E\\bigl[P_{\\mathcal T}^p-pP_{\\mathcal T}B_{\\mathcal T}^{p-1}+(p-1)B_{\\mathcal T}^p\\bigr]\\tag{4.3}$$\n이다. 정규화된 기준항들은 상쇄된다. tree 법칙 $Q_n$ 은 tree:log-expansion의 것이고 세 삽입에 공통이다. $\\lambda<1$ 이면 급수는 절대수렴하고 각 삽입은 $\\sum_{n\\ge1}\\lambda^n/n$ 으로 눌린다. $p$ 가 짝수이므로 $x\\mapsto x^p$ 의 볼록성이 괄호를 0 이상으로 만들고, (2.4)가 (4.3)을 0 이하로 만든다. $\\lambda\\uparrow1$ 이 (4.1)을 증명한다."}, "x:cavity-root-logarithm": {"title": "섭동된 계의 기대 root logarithm $P_N^{L,\\mathbf u}$", "math": "섭동을 더한 leaf 분배함수에 power-mean recursion을 적용한다. 그 root logarithm의 기대값을 $P_N^{L,\\mathbf u}$ 로 쓴다."}, "x:comp-standing": {"title": "§8의 고정된 선택: $\\varepsilon$, 깊이마다의 선택된 수열, 선택 전의 $\\underline F$", "math": "$\\varepsilon>0$ 을 고정한다. 각 깊이 $L\\ge2$ 에서 pert:selection이 주는 크기 수열과 결정적 매개변수 선택을 쓴다. 이 수열 위의 크기를 $N$ 으로 쓰고, 그 크기의 선택된 벡터를 $\\mathbf u_{L,N}$ 으로 쓴다(작성자; 표기는 14행에서 처음 나온다). 선택은 $L$ 에 의존할 수 있고, 아래의 모든 진술은 이 선택에 관한 것이다. $\\underline F$ 는 선택 전과 같이 bounded 모형의 **모든** 크기에 대한 liminf로 남겨 둔다."}, "x:decor-average-comparisons": {"title": "깊이 평균의 두 기본 비교 (안 쓰는 좌표, 정수 이동)", "math": "(i) 안 쓰는 좌표. $\\pi$가 $a$개 좌표 중 $a'$개만 남기는 사영이고 $w\\ge0$가 남은 좌표의 함수이면, 각 상이 많아야 $L^{a-a'}$개의 원상을 가지므로 $L^{-a}\\sum_{\\mathbf q}w(\\pi\\mathbf q)\\le L^{-a'}\\sum_{\\mathbf y\\in\\pi(\\text{domain})}w(\\mathbf y)$.\n(ii) 정수 이동. 좌표의 일부를 고정된 정수만큼 옮기는 사상은 단사이고, $L\\ge L_0(\\eta,\\text{이동량})$이면 $\\eta$-regular 배정을 $\\eta/2$-regular 배정으로 보낸다 (가지를 따른 엄격한 증가도 보존된다).\n(iii) (작성자 추가, 자명) $\\eta'\\le\\eta$이면 $\\eta$-regular 배정은 $\\eta'$-regular이므로 $z\\ge0$에 대해 $\\mathcal A_{L,\\eta}z\\le\\mathcal A_{L,\\eta'}z$."}, "x:decor-eta-regular": {"title": "$\\eta$-regular 깊이 배정", "math": "$\\eta>0$을 고정한다. 깊이 배정 $\\mathbf q$가 $\\eta$-regular라는 것은 모든 $v$에 대해 $q_v/L\\in(\\eta,1-\\eta)$이고 서로 다른 branching vertex $v\\ne w$에 대해 $|q_v-q_w|/L>\\eta$라는 뜻이다. 추가 prefix depth $d$가 지정되면 $d$도 같은 조건을 만족해야 한다: $d/L\\in(\\eta,1-\\eta)$, 모든 $v$에 대해 $|d-q_v|/L>\\eta$. 한 topology의 두 사본이 aligned depth를 쓰면 대응하는 vertex는 깊이 좌표 하나를 공유하고, regularity는 이 서로 다른 좌표들에 부과한다."}, "x:decor-limit-order": {"title": "선택된 수열과 극한 순서", "math": "각 고정 $L$에 대해 (그리고 pert:selection의 고정된 $\\varepsilon>0$에 대해) $N\\to\\infty$의 모든 극한과 $\\limsup_N$, $o_N(1)$은 pert:selection이 주는 크기 $N_j\\uparrow\\infty$와 결정적 매개변수 $\\mathbf u_j$의 수열을 따라 취한다. 이 수열에서 pert:tree-identity의 항등식\n$$\\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}c_E\\,\\mathbb E[fR_E]-\\mathbb Ef\\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}c_E\\,\\mathbb E[R_E]\\longrightarrow0$$\n이 모든 고정 old tree $\\mathcal T$, spin/marker anchor $a_*$, 유계 multioverlap 다항식 $f$, 유한 개 added color, 제약 $\\mathcal C$에 대해 성립한다. 수열은 $L$마다 다를 수 있다. $\\lim_L\\limsup_N$ 꼴의 진술은 항상 고정 $L$에서 $N$ 극한을 먼저 취한다."}, "x:decor-product-difference": {"title": "곱 차이 부등식", "math": "$x,y\\in[-1,1]^s$이면 $\\bigl|\\prod_jx_j-\\prod_jy_j\\bigr|\\le\\sum_j|x_j-y_j|$이고 따라서 $\\bigl(\\prod_jx_j-\\prod_jy_j\\bigr)^2\\le s\\sum_j(x_j-y_j)^2$이다. 좌표별 곱을 취한 벡터 $x_j,y_j\\in[-1,1]^N$에 대해서는 $\\|\\prod_jx_j-\\prod_jy_j\\|_N^2\\le s\\sum_j\\|x_j-y_j\\|_N^2$이다. 또 $x,x',y,y'\\in[-1,1]^N$이면 $|x\\cdot y-x'\\cdot y'|\\le\\|x-x'\\|_N+\\|y-y'\\|_N$."}, "x:model-moment-finiteness": {"title": "(2.4)의 기대값이 자동으로 유한한 경우 (비퇴화 경우)", "math": "(2.4)의 기대값은 유한한 실수 기대값으로 해석한다(model:positivity). 비퇴화 경우에는 이것이 자동이다: $b$ 와 $f_\\ell$ 들의 독립성과 엄격한 곱 한계 (2.3)이 $b$ 와 $\\max_s\\lvert f_1(s)\\rvert$ 를 본질적으로 유계로 만든다. 원문은 이것을 upper:bound(의 증명)에서 보인다고 미리 말한다."}, "x:pert-selected-limits": {"title": "이후의 $N\\to\\infty$ 는 선택된 수열을 따른다", "math": "이제부터 $L$ 은 고정이고, $N\\to\\infty$ 는 pert:selection의 한 수열을 따른 수렴을 뜻한다. 아래 기대값은 선택된 결정적 벡터에서 계산하며 그 $N$ 의존은 표기에서 생략한다. 이 극한들에 대해 $L$, path 수, 섭동 type에 대한 균등성은 주장하지 않는다."}, "x:pert-test-setup": {"title": "old tree $\\mathcal T$, anchor $a_*$, 시험함수 $f$ 의 고정과 $\\mathbb Ef$", "math": "old labeled tree $\\mathcal T$, 구별된 leaf $a_*$, 그 old replica들의 multioverlap에 대한 유계 다항식 $f$ 를 고정한다. 다항식과 그 계수는 $N$ 과 insertion 매개변수가 변해도 고정이다. 이 tree 위의 root 평균한 기대값을 간단히 $\\mathbb Ef$ 로 쓴다. anchor marginal은 언제나 tilted path 하나다."}, "x:reduction-power-mean-scaling": {"title": "power mean의 단조성과 root-가측 인자에 대한 동차성 (작성자 정식화)", "math": "(작성자 정식화. 원문은 성질을 쓰기만 하고 진술하지 않는다.) $V,V'$ 는 양수이고, 유한한 $\\mathscr F_0$-가측 $c$ 가 있어 $e^{-c}\\le V,V'\\le e^c$ 라 하자(쓰이는 곳에서는 [[model:trial-bounds]]의 (2.12)에서처럼 $c$ 가 물리 disorder만의 함수다: $V_{\\rm s},V_{\\rm s}'$ 에는 $c=\\max(\\lvert h\\rvert,\\lvert h'\\rvert)+\\sum_{j\\le k}\\max(B(\\theta_j),B(\\theta_j'))$, $V_{\\rm e},V_{\\rm e}'$ 에는 $c=\\max(B(\\theta),B(\\theta'))$). 그러면 $0\\le d\\le r$ 에서 $T_dV\\in[e^{-c},e^c]$ 로 유한하고, (2.10)의 $T_d$ 는 다음을 만족한다.\n(a) 단조성: $V\\le V'$ 이면 $T_dV\\le T_dV'$.\n(b) 동차성: $\\lambda>0$ 이 유한하고 $\\mathscr F_0$-가측(\"root-measurable\", 특히 물리 disorder만의 함수)이면, $\\mathscr F_0\\subseteq\\mathscr F_j$ 이므로 모든 $\\mathscr F_j$ 에 가측이고 $T_d(\\lambda V)=\\lambda\\,T_dV$.\n따라서 $\\mathscr F_0$-가측인 $\\delta\\ge0$ 에 대해 $e^{-\\delta}V\\le V'\\le e^\\delta V$ 이면 $\\lvert\\log T_0V'-\\log T_0V\\rvert\\le\\delta$. $r=0$ 에서는 $T$ 가 없고 같은 결론이 $V$ 에 바로 성립한다."}, "x:tree-analytic-bounds": {"title": "해석적 경계 (복소 영역에서의 $Y_d$)", "math": "유계 실수 path 함수 $D_j$와 $A=A_{\\boldsymbol t}=1+\\sum_jt_jD_j$ (tree:first-variation)에 대해, 앞의 식들 — (tree:Y-recursion)의 $Y_d$와 (tree:updated-kernel), (tree:first-variation) — 은 복소 영역\n$$\\sum_j|t_j|\\|D_j\\|_\\infty<1$$\n위에서 해석적이며, 경계는 kernel에 대해 균등하다(원문 157 \"The expressions\"가 가리키는 대상을 이 셋으로 읽은 것은 작성자 읽기). 이 합이 $\\rho<1$ 이하인 더 작은 닫힌 영역에서 $A$의 argument는 $\\vartheta=\\arcsin\\rho<\\pi/2$ 이하이고 modulus는 $1-\\rho$와 $1+\\rho$ 사이다. $Y_d$의 argument가 $[-\\vartheta,\\vartheta]$에 있으면 principal power를 써서 $K_dY_d^{m_d}$의 argument는 $[-m_d\\vartheta,m_d\\vartheta]$에 있다. 그것은 0이 아니고, $1/m_d$ 거듭제곱을 취하면 $Y_{d-1}$에 같은 argument 경계가 나온다. 정량적으로, modulus 하계 $a_d>0$은 하계\n$$a_{d-1}=a_d\\cos(m_d\\vartheta)^{1/m_d}>0$$\n을 주고, modulus 상계 $1+\\rho$는 보존된다. 이 경계들이 각 단계의 해석함수 적분과 이후의 모든 미분을 정당화한다. 또 (tree:density), 아래의 상쇄된 판들, 그리고 더 작은 영역에서 그 도함수들을 깊이, 지수, tree 크기, 삽입 함수의 경계를 고정하면 kernel에 대해 균등하게 누른다."}, "decor:covariance-definition": {"title": "조건부 평균 $\\mu_{d,S}$와 조건부 공분산 제곱 $v_N(S,d)$", "math": "$d$가 $S$의 initial stem 위의 깊이(첫 branching depth 포함)일 때, $\\mathscr F_d$는 root와 그 stem의 깊이 $d$까지의 sampled prefix가 생성하는 $\\sigma$-field다.\n$$\\mu_{d,S}=\\mathbb E[A_S\\mid\\mathscr F_d],\\qquad v_N(S,d)=\\frac1{N^2}\\mathbb E\\sum_{i,j=1}^N\\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2.$$\n바깥 기대값은 root를 포함한다. $A_S$와 $\\mu_{d,S}$의 모든 좌표는 절댓값이 1 이하이고 $0\\le v_N(S,d)\\le1$이다."}, "x:decor-topology": {"title": "topology, 깊이 배정, $b(S)$, 자식 모양", "math": "topology $S$는 labeled leaf를 가진 유한 rooted tree에서 unary vertex를 지운 것이다. $\\operatorname{Br}(S)$는 branching vertex의 집합, $b(S)=|\\operatorname{Br}(S)|$, $|S|$는 leaf 수다. 깊이 배정 $\\mathbf q=(q_v)_{v\\in\\operatorname{Br}(S)}$는 각 branching vertex에 $\\{0,\\ldots,L-1\\}$의 정수를 주며 모든 가지를 따라 엄격히 증가한다. $(S,\\mathbf q)$의 sampled copy는 x:decor-tree-sampling의 규칙으로 뽑은, leaf가 $S$의 leaf이고 갈라짐이 정확히 깊이 $q_v$에서 일어나는(그 밖의 vertex는 unary) 깊이-$L$ tree다. $S$의 initial stem은 root에서 첫 branching vertex(깊이 $e$)까지의 경로다. 그 vertex 아래의 부분 topology $T_1,\\ldots,T_s$ ($s\\ge2$, 각각 첫 branching vertex를 거치는 경로를 root부터 공유)를 proper child shape라 한다. singleton은 $|S|=1$, $b(S)=0$이고 initial stem이 경로 전체다. 더 일반적으로, 임의의 branching vertex $v$ (깊이 $q_v$) 아래의 부분 모양은 root에서 $v$까지의 경로를 initial stem으로 갖는 topology로 본다. 그래서 $q_v$는 그 부분 모양의 initial stem 위에 있고, $v$의 자식 부분 모양들은 root에서 $v$까지 prefix를 공유한다. 첫 branching vertex의 proper child shape는 이 약속의 특수한 경우다."}, "x:decor-tree-sampling": {"title": "tree 표본 규칙 (조건부 독립과 사영 일관성)", "math": "§3의 규칙. 유한 prescribed tree $\\mathcal T$는 공통 root(깊이 0 변수: disorder와 섭동의 개수·type·site. 섭동 매개변수는 root 변수가 아니라 선택된 고정값이다, cavity.tex 29–31)와 깊이 $L$에서 끝나는 labeled path들로 이루어진다. 각 vertex에서 서로 다른 children은 그 vertex까지의 prefix가 주어지면 kernel $K_{d+1}$로 서로 조건부 독립으로 뽑힌다. 깊이 $L$의 leaf에는 spin 배치 $\\sigma^a\\in\\{-1,1\\}^N$이 놓인다. 일부 leaf와 그것들만 쓰는 경로 부분을 지워도 나머지 tree의 표본 법칙은 바뀌지 않는다. 특히 한 경로(또는 한 부분 tree)의 법칙은 그것을 포함한 더 큰 tree에 무관하고, 어떤 vertex 아래의 부분 tree는 그 vertex까지의 prefix(root 포함)가 주어지면 tree의 나머지 전부와 조건부 독립이다."}, "x:model-depth-zero": {"title": "$r=0$ (replica symmetric) 경우: $\\mathcal B_0(\\zeta)$, $\\Phi_0$", "math": "$r=0$ 에서는 message들이 공통 법칙 $\\zeta\\in\\mathcal P(\\mathbb R)$ 를 갖는 독립 변수이고 연산자 $T_d$ 는 생략한다. 이것이 $\\mathcal B_0(\\zeta)=\\log2+\\mathbb E\\log V_{\\rm s}-\\alpha(p-1)\\mathbb E\\log V_{\\rm e}$ 와 $\\Phi_0=\\inf_\\zeta\\mathcal B_0(\\zeta)$ 를 정한다."}, "x:model-hypotheses": {"title": "주정리의 가정 묶음", "math": "고정한 짝수 $p\\ge2$, $\\alpha>0$ 과 model:hamiltonian의 모형에 대해 (2.1) $\\mathbb EB(\\theta)+\\mathbb E\\lvert h\\rvert<\\infty$, (2.3)의 표현과 엄격한 곱 한계, (2.4) $\\mathbb E[(-b)^n]\\ge0$ $(n\\ge1)$ (유한한 실수 기대값으로 해석). 원문 표현은 \"Under (2.1)–(2.4)\"(식 라벨 model:integrability–model:positivity)이며 이 범위가 (2.1)–(2.4)이므로 (2.2) 모형 정의도 포함한다."}, "x:tree-differentiation-rule": {"title": "미분 규칙: protected leaf와 fresh path", "math": "tree 밀도의 leaf 인자 $A^a$가 분모 $A^a$로 상쇄되면 그 leaf를 protected라 한다. protected leaf의 집합 $C$와 유계이고 매개변수에 무관한 함수 $G$에 대해 $E_{\\mathcal T}^A[G\\prod_{a\\in C}(A^a)^{-1}]$를 생각한다. (tree:density)를 미분하면\n$$\\partial_{t_j}\\log W_{\\mathcal T}(A)=\\sum_{a\\in\\operatorname{Leaves}(\\mathcal T)}\\frac{D_j^a}{A^a}+\\sum_{\\beta\\in\\operatorname{Int}(\\mathcal T)}\\gamma_\\beta\\,\\partial_{t_j}\\log Y_\\beta.$$\n$E_{\\mathcal T}^A[G\\prod_{a\\in C}(A^a)^{-1}]$의 도함수에서 $a\\in C$의 leaf 항은 분모의 미분과 정확히 상쇄된다. function routeHits(a,b,r,pad=9){
  const minX=r.x-pad,maxX=r.x+r.w+pad,minY=r.y-pad,maxY=r.y+r.h+pad;
  let lo=0,hi=1;
  for(const [start,delta,min,max] of [[a[0],b[0]-a[0],minX,maxX],[a[1],b[1]-a[1],minY,maxY]]){
    if(Math.abs(delta)<1e-9){if(start<min||start>max)return false;}
    else{let u=(min-start)/delta,v=(max-start)/delta;if(u>v)[u,v]=[v,u];lo=Math.max(lo,u);hi=Math.min(hi,v);if(lo>hi)return false;}
  }
  return true;
}
function routeLength(points){let len=0;for(let i=1;i<points.length;i++)len+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);return len;}
function edgeRoute(a,b,obstacles){
  const clip=(r,tx,ty)=>{const cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;const k=Math.min(dx?(r.w/2+3)/Math.abs(dx):1e9,dy?(r.h/2+3)/Math.abs(dy):1e9);return [cx+dx*k,cy+dy*k];};
  const direct=[clip(a,b.x+b.w/2,b.y+b.h/2),clip(b,a.x+a.w/2,a.y+a.h/2)];
  const hits=points=>obstacles.reduce((sum,r)=>sum+points.slice(1).filter((p,i)=>routeHits(points[i],p,r)).length,0);
  if(!hits(direct))return direct;
  const ys=[...obstacles.flatMap(r=>[r.y-25,r.y+r.h+25]),Math.min(a.y,b.y)-30,Math.max(a.y+a.h,b.y+b.h)+30];
  let best=null;
  for(const y of ys){
    const start=[a.x+a.w/2,y<a.y+a.h/2?a.y-3:a.y+a.h+3];
    const end=[b.x+b.w/2,y<b.y+b.h/2?b.y-3:b.y+b.h+3];
    const points=[start,[start[0],y],[end[0],y],end];
    // 자기 양 끝 상자를 다시 가로지르는 우회 경로도 배제한다.
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);
    const score=100000*hits(points)+(selfCross?100000:0)+routeLength(points);
    if(!best||score<best.score)best={points,score};
  }
  const xs=[...obstacles.flatMap(r=>[r.x-25,r.x+r.w+25]),Math.min(a.x,b.x)-30,Math.max(a.x+a.w,b.x+b.w)+30];
  for(const x of xs){
    const start=[x<a.x+a.w/2?a.x-3:a.x+a.w+3,a.y+a.h/2];
    const end=[x<b.x+b.w/2?b.x-3:b.x+b.w+3,b.y+b.h/2];
    const points=[start,[x,start[1]],[x,end[1]],end];
    const selfCross=routeHits(points[1],points[2],a,0)||routeHits(points[1],points[2],b,0);
    const score=100000*hits(points)+(selfCross?100000:0)+routeLength(points);
    if(!best||score<best.score)best={points,score};
  }
  return best.points;
}
function routePoint(points,fraction){
  const total=routeLength(points);let remain=total*fraction;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(remain<=len||i===points.length-1){const t=len?remain/len:0;return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,dx:(b[0]-a[0])/(len||1),dy:(b[1]-a[1])/(len||1)};}
    remain-=len;
  }
  return {x:points[0][0],y:points[0][1],dx:1,dy:0};
}
if(typeof module!=='undefined')module.exports={edgeRoute,routeHits,routePoint};

  const overlaps = (a,b,pad=5) => a.x < b.x+b.w+pad && a.x+a.w+pad > b.x && a.y < b.y+b.h+pad && a.y+a.h+pad > b.y;
  m.edges.forEach((e, i) => {
    const a = rect(e.from), b = rect(e.to);
    const loop = e.from === e.to;
    let [x1,y1] = clip(a, b.x + b.w/2, b.y + b.h/2), [x2,y2] = clip(b, a.x + a.w/2, a.y + a.h/2);
    if (loop){ x1 = a.x + a.w*0.68; x2 = a.x + a.w*0.32; y1 = y2 = a.y + a.h + 3; }
    const route = loop ? null : edgeRoute(a,b,m.nodes.filter(n => n.id !== e.from && n.id !== e.to).map(n => rect(n.id)));
    const isSel = selEdge === i;
    const col = isSel ? sel : (e.type === 'def' ? muted : ink);
    const dash = e.type === 'call' ? ' stroke-dasharray="6 4"' : '';
    const wdt = (e.type === 'def' ? 1 : 1.6) + (e.member ? 1.4 : 0);
    const mk = isSel ? 'ahs' : (e.type === 'def' ? 'ahm' : 'ah');
    s += loop ? `<path d="M${x1},${y1} C${x1+30},${y1+70} ${x2-30},${y1+70} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${wdt}"${dash} marker-end="url(#${mk})"/>` : `<polyline data-edge="${esc(e.id)}" points="${route.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${wdt}"${dash} marker-end="url(#${mk})"/>`;
    const l = document.createElement('button'); l.type = 'button';
    l.className = 'elabel' + (isSel ? ' sel' : '') + (!e.contentComplete ? ' pending' : '') + (e.open || e.contractIssues.length ? ' open-edge' : '');
    const status = e.contractIssues.length ? '출력 대응 재검토 필요' : e.open ? '열린 연결' : (e.contentComplete ? '내용 완결' : '내용 미작성');
    l.title = `${e.id} · ${e.caption} · ${status}`;
    l.setAttribute('aria-label', `${e.displayId} ${e.caption} — ${status}`);
    l.innerHTML = `<span class="edge-id">${esc(e.displayId)}</span>${showPass ? ' · ' + esc(e.caption) : ''}${e.open || e.contractIssues.length ? '<span class="edge-pending">!</span>' : (!e.contentComplete ? '<span class="edge-pending">?</span>' : '')}`;
    l.onclick = ev => { ev.stopPropagation(); selEdge = i; selNode = null; render(); };
    canvas.appendChild(l);
    const lw = l.offsetWidth, lh = l.offsetHeight;
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
    let best = null;
    const slots = loop ? [0.5] : [0.5,0.35,0.65,0.2,0.8];
    for (const t of slots) for (const offset of [0,18,-18,36,-36,54,-54]){
      const anchor = loop ? {x:(x1+x2)/2,y:y1+65,dx:1,dy:0} : routePoint(route,t);
      const cx = anchor.x-anchor.dy*offset;
      const cy = anchor.y+anchor.dx*offset;
      const box = {x:cx-lw/2,y:cy-lh/2,w:lw,h:lh};
      const score = 10000*occupied.filter(r => overlaps(box,r)).length + 1000*labels.filter(r => overlaps(box,r)).length + Math.abs(offset) + 100*Math.abs(t-0.5);
      if (!best || score < best.score) best = {cx,cy,box,score,anchor,offset};
    }
    if (Math.abs(best.offset)>10) s += `<line x1="${best.anchor.x}" y1="${best.anchor.y}" x2="${best.cx}" y2="${best.cy}" stroke="${muted}" stroke-width="0.7" stroke-dasharray="2 3"/>`;
    l.dataset.edgeId = e.id;
    l.style.left = best.cx + 'px'; l.style.top = best.cy + 'px'; labels.push(best.box);

  });
  svg.innerHTML = s;
}

    const ne = m.edges.length, nc = m.edges.filter(e => e.type === 'call').length;
    h += `<h2>${esc(m.title)}</h2><div class="kind">지도</div><p>${esc(m.intro)}</p><dl><dt>센 것</dt><dd>상자 ${m.nodes.length}개 (밖 ${m.nodes.filter(n => n.kind==='ext').length}개 포함), 화살표 ${ne}개 (호출 ${nc}개), 틀 ${m.frames.length}개.<br>카드에 닿는 상자 ${g.grounded}/${g.all}.</dd></dl>`;
    if (m.parent){ const b = boundaryCheck(cur); h += `<div class="check ${b.ok ? 'ok' : 'bad'}">닿는 면: ${b.ok ? '상위 상자 「' + esc(b.parent.title) + '」의 받는 것과 일치' : '불일치'}</div>`; }
    h += `<p class="note">상자를 누르면 칸이 열립니다. "확대할 수 있음"이 붙은 상자는 두 번 누르거나 오른쪽 단추로 하위 지도에 들어갑니다. 화살표의 이름표를 누르면 넘기는 것과 맞음이 뜹니다.</p>`;
  }
  h += `<p class="note">내용은 현행 L2 §6, rules.md, 카드에서 옮겼다. 모든 근거의 상태는 proposed이고 사용자 확인 전이다. 닿는 면 검사는 이 파일의 자료에서 계산한 것이다.</p>`;
  panel.innerHTML = h;
  panel.querySelectorAll('button.focus-node').forEach(b => b.onclick = () => { selNode = b.dataset.node; selEdge = null; render(); });
  for (let pass = 0; pass < 3; pass++) linkifyPanel(panel);  // 펼친 항목 안의 참조도 펼친다(깊이 3까지)
  panel.querySelectorAll('button.sel-edge').forEach(b => b.onclick = () => { const i = MAPS[cur].edges.findIndex(x => x.id === b.dataset.edge); if (i >= 0){ selNode = null; selEdge = i; render(); } });
  panel.querySelectorAll('button.zoom').forEach(b => b.onclick = () => go(b.dataset.go));
  panel.querySelectorAll('button.follow-import').forEach(b => b.onclick = () => { cur=b.dataset.map; selNode=null; selEdge=MAPS[cur].edges.findIndex(e => e.id === b.dataset.edge); if (selEdge < 0) selEdge=null; render(); });
  tex(panel);
}
function go(id){ cur = id; selNode = null; selEdge = null; render(); $('#stage').scrollTo(0,0); }
canvas.addEventListener('click', e => { if (e.target === canvas || e.target === svg){ selNode = null; selEdge = null; render(); } });
window.addEventListener('load', () => { $('#tp').onchange = ev => { showPass = ev.target.checked; render(); }; render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
</script>
</body>
