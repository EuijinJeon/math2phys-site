=\\sum_{q=1}^{n_\\nu}", "79": " \\frac{g_{0,q}S_{0,q}}", "80": " {1+t_\\nu g_q\\sigma_{i_q}+u_\\nu g_{0,q}S_{0,q}}.", "81": " \\label{pert:score}", "82": "\\end{equation}", "83": "Let $\\langle\\cdot\\rangle$ denote expectation along one tilted path", "84": "conditional on the root, and let $\\mathbb E_{\\mathbf u}$ average the", "85": "root at fixed $\\mathbf u$.  Define", "86": "\\begin{equation}", "87": " e_{\\nu,N}(\\mathbf u)", "88": " =\\frac{1}{c_\\nu s_N}", "89": " \\mathbb E_{\\mathbf u}\\Big\\langle", "90": " \\big|D_\\nu-\\mathbb E_{\\mathbf u}\\langle D_\\nu\\rangle\\big|", "91": " \\Big\\rangle.", "92": " \\label{pert:error}", "93": "\\end{equation}", "94": "", "95": "\\begin{lemma}[Averaged score concentration]", "96": "\\label{pert:concentration}", "97": "For each fixed $L$ and each fixed type $\\nu$,", "98": "\\begin{equation}", "99": " \\int e_{\\nu,N}(\\mathbf u)\\,\\pi(d\\mathbf u)\\longrightarrow0.", "100": " \\label{pert:concentration-eq}", "101": "\\end{equation}", "102": "The assertion holds for the reservoir as well as for the original", "103": "system.  Constants need not be uniform in $L$ or $\\nu$.", "104": "\\end{lemma}", "105": "", "106": "\\begin{proof}", "107": "Hold the other parameters fixed, write $u=u_\\nu$, $n=n_\\nu$, and put", "108": "$\\lambda_\\nu=c_\\nu s_N$.  Choose an open interval $J_\\nu$ containing", "109": "$I_\\nu$ such that $|t_\\nu|+|u|<1/2$ throughout its closure.  On this", "110": "interval, pathwise,", "111": "\\begin{equation}", "112": " |D_\\nu|\\leq2n,\\qquad", "113": " -4n\\leq\\partial_uD_\\nu", "114": " =-\\sum_{q=1}^{n}", "115": " \\frac{(g_{0,q}S_{0,q})^2}{\\psi_{\\nu,q}^{2}}", "116": " \\leq0.", "117": " \\label{pert:score-bounds}", "118": "\\end{equation}", "119": "", "120": "\\paragraph{Fluctuations along a tilted path.}", "121": "Let $X_0(u)$ be the random root log partition function before taking the", "122": "root expectation.  To include the last step in the differentiation,", "123": "regard the logarithm of the spin weight as $X_L$ and the spin partition", "124": "function as the step with exponent $m_L=1$.  Differentiation of one", "125": "backward step gives", "126": "\\[", "127": " \\partial_uX_{d-1}=K_d(\\partial_uX_d),\\qquad", "128": " \\partial_u^2X_{d-1}", "129": " =K_d(\\partial_u^2X_d)", "130": "   +m_d\\operatorname{Var}_{K_d}(\\partial_uX_d).", "131": "\\]", "132": "Thus, for $M_d=\\langle D_\\nu\\mid\\mathscr F_d\\rangle$,", "133": "\\begin{align}", "134": " X_0'(u)&=\\langle D_\\nu\\rangle,\\label{pert:first-derivative}\\\\", "135": " X_0''(u)&=\\langle\\partial_uD_\\nu\\rangle", "136": "   +\\sum_{d=1}^{L}m_d", "137": "        \\langle(M_d-M_{d-1})^2\\rangle \\nonumber\\\\", "138": " &\\geq m_1\\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)-4n.", "139": " \\label{pert:second-derivative}", "140": "\\end{align}", "141": "Here the conditional expectations and variances use the tilted path", "142": "law at the current $u$.  At fixed root all derivatives are justified by", "143": "the bounded score and its derivatives; the finite recursion then", "144": "justifies the displayed differentiation formulas.  Their root", "145": "expectations are justified by the finite moments of the Poisson counts.", "146": "", "147": "Integrating \\eqref{pert:second-derivative} over $I_\\nu=[a,b]$ and using", "148": "$|X_0'|\\leq2n$ yields", "149": "\\begin{equation}", "150": " \\int_a^b\\mathbb E_{\\mathbf u}", "151": "       \\operatorname{Var}(D_\\nu\\mid\\mathscr F_0)\\,du", "152": " \\leq\\frac{4\\lambda_\\nu(1+b-a)}{m_1}.", "153": " \\label{pert:thermal-variance}", "154": "\\end{equation}", "155": "Consequently the interval-averaged thermal mean absolute deviation,", "156": "divided by $\\lambda_\\nu$, is at most", "157": "\\begin{equation}", "158": " \\left(\\frac{4(1+|I_\\nu|)}", "159": " {m_1|I_\\nu|\\lambda_\\nu}\\right)^{1/2}.", "160": " \\label{pert:thermal-bound}", "161": "\\end{equation}", "162": "", "163": "\\paragraph{Fluctuations of the root mean.}", "164": "It remains to concentrate $X_0'$ over the root. By", "165": "\\eqref{pert:second-derivative}, the random function", "166": "\\[", "167": " G(u)=X_0(u)+2nu^2", "168": "\\]", "169": "is convex on $J_\\nu$.  Uniformly for $u\\in J_\\nu$ and all the other", "170": "parameters,", "171": "\\begin{equation}", "172": " \\operatorname{Var}(G(u))\\leq C_\\nu N,", "173": " \\qquad |\\mathbb E_{\\mathbf u}G'(u)|\\leq C_\\nu\\lambda_\\nu.", "174": " \\label{pert:root-variance}", "175": "\\end{equation}", "176": "To prove the first estimate, condition on the physical and total", "177": "perturbation counts. Conditional on the latter count, its types and sites", "178": "are independent labels; changing a label replaces a single bounded", "179": "factor. Apply the Efron--Stein variance inequality~\\cite{EfronStein}", "180": "$\\Var Z\\le\\frac12\\sum_j\\E(Z-Z^{(j)})^2$, where $Z^{(j)}$ is obtained", "181": "by independently resampling the $j$th input. For completeness, with", "182": "independent inputs $X_1,\\ldots,X_k$, let $E_j$ integrate only $X_j$ and", "183": "let $\\mathscr G_j=\\sigma(X_1,\\ldots,X_j)$. The Doob differences are", "184": "$D_j=\\E[Z-E_jZ\\mid\\mathscr G_j]$. Orthogonality and Jensen give", "185": "\\[", "186": " \\Var Z=\\sum_j\\E D_j^2", "187": " \\le\\sum_j\\E(Z-E_jZ)^2", "188": " =\\frac12\\sum_j\\E(Z-Z^{(j)})^2.", "189": "\\]", "190": "This independent-input decomposition requires neither identical laws", "191": "nor a symmetric statistic; see Efron--Stein~\\cite[Section~2]{EfronStein}.", "192": "Resampling one interaction, field, or", "193": "perturbation term changes $X_0$ by a bounded amount: this is immediate", "194": "for the spin weights and is preserved by each power mean.  When a term", "195": "is removed, its unused independent mark variables can be integrated", "196": "out, so the same assertion holds for addition or deletion of a term.", "197": "Conditional variances are therefore bounded by a constant times the", "198": "number of root variables.  Conditional means are Lipschitz functions", "199": "of the counts, with bounded Lipschitz constants.  If $Q,Q'$ are", "200": "independent copies of a Poisson variable and $b$ is $C$-Lipschitz, then", "201": "\\[", "202": " \\operatorname{Var}(b(Q))", "203": " =\\tfrac12\\mathbb E(b(Q)-b(Q'))^2", "204": " \\leq C^2\\operatorname{Var}(Q).", "205": "\\]", "206": "Applying this to the independent counts completes the $O(N)$ estimate.", "207": "The correction $2nu^2$ obeys the same estimates.  The derivative bound", "208": "in \\eqref{pert:root-variance} follows directly from", "209": "\\eqref{pert:score-bounds}.", "210": "", "211": "\\paragraph{Passing from a convex function to its derivative.}", "212": "Put", "213": "$\\bar G=\\mathbb E_{\\mathbf u}G$ and $Z=G-\\bar G$.  If $u\\pm\\rho$ lie", "214": "in $J_\\nu$, forward and backward difference quotients imply", "215": "\\begin{align*}", "216": " |G'(u)-\\bar G'(u)|", "217": " &\\leq\\frac{|Z(u-\\rho)|+2|Z(u)|+|Z(u+\\rho)|}{\\rho}\\\\", "218": " &\\quad+\\bar G'(u+\\rho)-\\bar G'(u-\\rho).", "219": "\\end{align*}", "220": "The monotonicity of $\\bar G'$ gives", "221": "\\[", "222": " \\int_a^b[\\bar G'(u+\\rho)-\\bar G'(u-\\rho)]\\,du", "223": " \\leq2\\rho[\\bar G'(b+\\rho)-\\bar G'(a-\\rho)].", "224": "\\]", "225": "Together with \\eqref{pert:root-variance}, this proves", "226": "\\begin{equation}", "227": " \\frac1{|I_\\nu|}\\int_{I_\\nu}", "228": " \\mathbb E_{\\mathbf u}|G'(u)-\\mathbb E_{\\mathbf u}G'(u)|\\,du", "229": " \\leq C_\\nu\\left(\\frac{\\sqrt N}{\\rho}", "230": "              +\\frac{\\rho\\lambda_\\nu}{|I_\\nu|}\\right).", "231": " \\label{pert:convex-bound}", "232": "\\end{equation}", "233": "For all sufficiently large $N$, take $\\rho=N^{-1/8}$, which lies", "234": "within the fixed neighborhood margin.  After division by", "235": "$\\lambda_\\nu=c_\\nu N^{3/4}$, both terms tend to zero.  Removing the", "236": "correction to $G'$ costs at most", "237": "$C_\\nu\\mathbb E|n-\\lambda_\\nu|/\\lambda_\\nu", "238": "\\leq C_\\nu\\lambda_\\nu^{-1/2}$.  Thus the root contribution to", "239": "\\eqref{pert:error} tends to zero.  Combining it with", "240": "\\eqref{pert:thermal-bound} proves the result after integration over", "241": "$u_\\nu$.  All estimates are uniform in the other parameters, so their", "242": "integration against the remaining product measure proves", "243": "\\eqref{pert:concentration-eq}.", "244": "\\end{proof}", "245": "", "246": "\\subsection{One sequence for low increments and all identities}", "247": "", "248": "The parameter choices must satisfy concentration and a low cavity", "249": "increment simultaneously. Let $\\underline F=\\liminf_NF_N$ over all", "250": "system sizes for the bounded model. Recall that", "251": "$P_N^{L,\\mathbf u}$ denotes the root-averaged perturbed log partition", "252": "function, and put", "253": "$\\Delta_N(\\mathbf u)=P_{N+1}^{L,\\mathbf u}-P_N^{L,\\mathbf u}$.", "254": "", "255": "\\begin{lemma}[Deterministic parameter selection]", "256": "\\label[lemma]{pert:selection}", "257": "For every fixed $L\\geq2$ and $\\varepsilon>0$, there are sizes", "258": "$N_j\\uparrow\\infty$ and deterministic vectors $\\mathbf u_j$ such that", "259": "\\begin{enumerate}[label=\\textup{(\\roman*)}]", "260": " \\item $\\Delta_{N_j}(\\mathbf u_j)\\leq \\underline F+2\\varepsilon$;", "261": " \\item for every fixed type $\\nu$,", "262": " $e_{\\nu,N_j}(\\mathbf u_j)\\longrightarrow0$ in the reservoir;", "263": " \\item in the reservoir, the expectations of every finite product of multioverlaps on", "264": " every fixed finite prescribed tree of depth $L$ converge along this", "265": " sequence.", "266": "\\end{enumerate}", "267": "\\end{lemma}", "268": "", "269": "\\begin{proof}", "270": "\\emph{Find low averaged increments.}", "271": "The uniform perturbation bound \\eqref{cavity:negligible} gives", "272": "\\[", "273": " \\liminf_N\\frac1N\\int P_N^{L,\\mathbf u}\\,\\pi(d\\mathbf u)=\\underline F.", "274": "\\]", "275": "Hence infinitely many $N$ satisfy", "276": "$\\int\\Delta_N\\,d\\pi\\leq \\underline F+\\varepsilon$: otherwise telescoping the", "277": "averaged increments would contradict this liminf.  \\Cref{cavity:increment}", "278": "supplies a constant $C$ such that", "279": "$|\\Delta_N(\\mathbf u)|\\leq C$ uniformly.", "280": "", "281": "\\paragraph{Choose parameters with small score errors.}", "282": "For a finite collection of types, Lemma~\\ref{pert:concentration} and", "283": "Markov's inequality show that the set where all its errors are small", "284": "has parameter measure tending to one.  More explicitly, choose", "285": "$N_j$ successively among the preceding infinite set so large that", "286": "\\[", "287": " \\sum_{\\nu\\leq j}\\int e_{\\nu,N_j}(\\mathbf u)\\,\\pi(d\\mathbf u)", "288": " \\leq j^{-3}.", "289": "\\]", "290": "Then the set $G_j$ where $e_{\\nu,N_j}\\leq j^{-1}$ for all $\\nu\\leq j$", "291": "has complement of measure $q_j\\leq j^{-2}$.  Its conditional mean", "292": "increment is at most", "293": "\\[", "294": " \\frac{\\underline F+\\varepsilon+Cq_j}{1-q_j}", "295": " \\leq \\underline F+2\\varepsilon", "296": "\\]", "297": "for all sufficiently large $j$.  A vector in $G_j$ with increment at", "298": "most $\\underline F+2\\varepsilon$ can therefore be chosen. Relabeling the tail", "299": "proves (i) and (ii).", "300": "", "301": "\\paragraph{Make all finite-tree moments converge.}", "302": "At fixed $L$ the finite labeled tree", "303": "shapes and finite products of their multioverlaps form a countable", "304": "collection.  Each such product is bounded by one in absolute value.", "305": "A diagonal subsequence gives (iii), without affecting (i) or (ii).", "306": "\\end{proof}", "307": "", "308": "From now on $L$ is fixed and $N\\to\\infty$ means convergence along a", "309": "sequence from Lemma~\\ref{pert:selection}. Expectations below are evaluated at", "310": "the selected deterministic vector, whose dependence on $N$ is", "311": "suppressed.  No uniformity in $L$, in the number of paths, or in a", "312": "perturbation type is asserted for these limits.", "313": "", "314": "\\subsection{Poisson insertion and analytic extraction}", "315": "", "316": "Fix an old labeled tree $\\mathcal T$, a distinguished leaf $a_*$, and", "317": "a bounded polynomial $f$ in multioverlaps of its old replicas.  The", "318": "polynomial and its coefficients are fixed as $N$ and the insertion", "319": "parameters vary. The", "320": "root-averaged expectation on this tree is denoted simply by", "321": "$\\mathbb E f$.  The anchor marginal is always one tilted path.", "322": "Therefore \\eqref{pert:error} implies, for each fixed type $\\nu$,", "323": "\\begin{equation}", "324": " \\left|\\frac{\\mathbb E[fD_\\nu^{a_*}]", "325": "       -\\mathbb E f\\,\\mathbb E\\langle D_\\nu\\rangle}", "326": "       {c_\\nu s_N}\\right|", "327": " \\leq\\|f\\|_\\infty e_{\\nu,N}\\longrightarrow0.", "328": " \\label{pert:score-identity}", "329": "\\end{equation}", "330": "", "331": "For a fixed mark specification, introduce an independent new uniform", "332": "site and an independent copy of its mark process, and set", "333": "$A=1+tg\\sigma_i+ug_0S_0$.  Let $Y$ be its insertion recursion from", "334": "Lemma~\\ref{tree:insertion}, and let $W_{\\mathcal T}(A)$ be the updated-tree", "335": "density \\eqref{tree:density}. The expectations in the following display use", "336": "the unmodified reservoir, extended by the independent insertion", "337": "variables with their prior kernels:", "338": "\\begin{align}", "339": " J_{N,\\mathcal T}(t,u)", "340": " &=\\mathbb E\\left[", "341": " f\\,\\frac{g_0^{a_*}S_0^{a_*}}{A^{a_*}}", "342": "          W_{\\mathcal T}(A)\\right],\\label{pert:palm-expression}\\\\", "343": " H_N(t,u)", "344": " &=J_{N,\\mathcal T}(t,u)", "345": "   -\\mathbb E f\\,J_{N,\\{a_*\\}}(t,u).", "346": " \\label{pert:analytic-difference}", "347": "\\end{align}", "348": "In the single-anchor expression $J_{N,\\{a_*\\}}$, the test is $1$.", "349": "", "350": "\\begin{lemma}[Palm identity]", "351": "\\label{pert:palm}", "352": "If $\\nu$ is a type with the specified marks, then", "353": "\\begin{equation}", "354": " |H_N(t_\\nu,u_\\nu)|\\leq\\|f\\|_\\infty e_{\\nu,N}.", "355": " \\label{pert:palm-bound}", "356": "\\end{equation}", "357": "For a fixed mark specification the function $H_N(t,u)$ is the same", "358": "for all its types $j$: its base reservoir contains the full original", "359": "Poisson families, including all types.", "360": "\\end{lemma}", "361": "", "362": "\\begin{proof}", "363": "Apply the Poisson add-one identity to the sum over type-$\\nu$ terms", "364": "in $D_\\nu$.  After division by its mean $c_\\nu s_N$, the remaining", "365": "count is again Poisson with mean $c_\\nu s_N$, and all the other counts", "366": "are unchanged.  Thus the remaining model has exactly the original", "367": "reservoir law.  The distinguished term becomes an independent new", "368": "insertion with parameters $t_\\nu,u_\\nu$.  Its score is", "369": "$g_0^{a_*}S_0^{a_*}/A^{a_*}$.  The updated tree density is", "370": "\\eqref{tree:density}, so the anchor factor $A^{a_*}$ cancels.", "371": "This proves", "372": "\\[", "373": " \\frac{\\mathbb E[fD_\\nu^{a_*}]}{c_\\nu s_N}", "374": " =J_{N,\\mathcal T}(t_\\nu,u_\\nu),\\qquad", "375": " \\frac{\\mathbb E\\langle D_\\nu\\rangle}{c_\\nu s_N}", "376": " =J_{N,\\{a_*\\}}(t_\\nu,u_\\nu).", "377": "\\]", "378": "Equation~\\eqref{pert:palm-bound} now follows from", "379": "\\eqref{pert:score-identity}.  In particular no type has been deleted", "380": "from the law of the base reservoir.  This proves the last assertion.", "381": "\\end{proof}", "382": "", "383": "\\begin{lemma}[Vanishing insertion coefficients]", "384": "\\label[lemma]{pert:analytic}", "385": "For every mark specification included in the perturbation family, old tree, anchor, and bounded", "386": "overlap-polynomial test $f$, every Taylor coefficient at $t=0$ of", "387": "$H_N(t,0)$ tends to zero along the selected sequence.", "388": "\\end{lemma}", "389": "", "390": "\\begin{proof}", "391": "Lemma~\\ref{tree:extension-expansion} gives a complex neighborhood", "392": "$|t|,|u|<\\rho$ on which the functions in", "393": "\\eqref{pert:analytic-difference} are analytic and uniformly bounded", "394": "in $N$ and in the selected parameter vector.  Shrinking $\\rho$ gives", "395": "a uniform bound on their $u$-derivatives as well.  These constants may", "396": "depend on the fixed tree, $L$, and $\\|f\\|_\\infty$, but not on the type", "397": "index $j$ in the mark specification.", "398": "", "399": "Each Taylor coefficient of $H_N(t,0)$ is a finite linear combination", "400": "of multioverlap moments and products of two such moments on prescribed trees.", "401": "Their coefficients are determined by the fixed tree, exponents, mark law,", "402": "and polynomial test, and are independent of $N$. Indeed the canceled", "403": "anchor expansion supplies finitely many extensions at any fixed", "404": "order; averaging the independent insertion site turns its spin", "405": "product into a multioverlap.  These coefficients converge by", "406": "Lemma~\\ref{pert:selection}(iii).  The uniform analytic bound then", "407": "implies, by the geometric bound on the Taylor tails, that", "408": "$H_N(t,0)$ converges uniformly on each smaller disk to an analytic", "409": "function $H(t)$.", "410": "", "411": "For every sufficiently large fixed $j$, the corresponding type and", "412": "Lemma~\\ref{pert:palm} give", "413": "\\[", "414": " \\limsup_{N\\to\\infty}|H_N(j^{-1},0)|", "415": " \\leq C\\limsup_{N\\to\\infty}|u_{\\nu,N}|", "416": " \\leq2Cj^{-j}.", "417": "\\]", "418": "Here the score error tends to zero with $j$ fixed, and the same", "419": "function $H_N$ is used for every $j$, by Lemma~\\ref{pert:palm}.", "420": "Hence $|H(j^{-1})|\\leq2Cj^{-j}$.  If the first nonzero Taylor", "421": "coefficient of $H$ had degree $q$, then", "422": "$|H(j^{-1})|\\geq c j^{-q}$ for all sufficiently large $j$, a", "423": "contradiction.  Thus $H$ vanishes identically near zero, proving the", "424": "claim coefficient by coefficient.", "425": "\\end{proof}", "426": "", "427": "\\subsection{Prescribing the colored tree}", "428": "", "429": "The anchor is called a \\emph{spin anchor} when $S_0=\\sigma_i$, and a", "430": "\\emph{marker anchor} when $S_0=1$.  Added colors are ordered", "431": "$1,\\ldots,k$; the anchor has color $0$.  They occupy distinct replica", "432": "positions, none equal to the anchor, according to the canceled-anchor", "433": "extension rule of Lemma~\\ref{tree:extension-expansion}.  A constraint", "434": "$\\mathcal C$ prescribes any consistent collection of their pairwise", "435": "split depths, involving only the added colors and the anchor.", "436": "It imposes no extra restrictions involving the other old replicas.", "437": "Let $\\mathfrak E(\\mathcal T,a_*,\\mathcal C)$ be the allowed extension", "438": "histories, with coefficients $c_E$ from that lemma.  For a history", "439": "$E$, set", "440": "\\[", "441": " R_E=\\frac1N\\sum_{i=1}^N", "442": " \\begin{cases}", "443": " \\displaystyle\\sigma_i^{a_*}\\prod_{j=1}^k\\sigma_i^{a_j(E)},", "444": "       &\\text{spin anchor},\\\\[2pt]", "445": " \\displaystyle\\prod_{j=1}^k\\sigma_i^{a_j(E)},", "446": "       &\\text{marker anchor}.", "447": " \\end{cases}", "448": "\\]", "449": "For $k=0$ these are respectively $R_{\\{a_*\\}}$ and $1$.", "450": "", "451": "\\begin{theorem}[Identity on prescribed trees]", "452": "\\label{pert:tree-identity}", "453": "\\label{pert:identity}", "454": "For the perturbation family defined above, along every sequence from", "455": "Lemma~\\ref{pert:selection},", "456": "\\begin{equation}", "457": " \\sum_{E\\in\\mathfrak E(\\mathcal T,a_*,\\mathcal C)}", "458": "       c_E\\,\\mathbb E[fR_E]", "459": " -\\mathbb E f", "460": "  \\sum_{E\\in\\mathfrak E(\\{a_*\\},a_*,\\mathcal C)}", "461": "       c_E\\,\\mathbb E[R_E]", "462": " \\longrightarrow0.", "463": " \\label{pert:tree-identity-eq}", "464": "\\end{equation}", "465": "This holds for every fixed old tree, either kind of anchor, every", "466": "bounded polynomial $f$ in its multioverlaps, every finite number of", "467": "ordered added colors, and every prescribed constraint $\\mathcal C$.", "468": "The empty addition is allowed.  The error is taken to zero at fixed", "469": "$L$, fixed tree, and fixed constraint, before any limit in $L$.", "470": "\\end{theorem}", "471": "", "472": "\\begin{proof}", "473": "For $k=0$, the claim is the vanishing constant coefficient from", "474": "\\cref{pert:analytic}, using constant marks. For $k\\ge1$, we explain", "475": "how to extract distinct colored marks. Fix rational-valued functions", "476": "$g_0,g_1,\\ldots,g_k$, all bounded by one and constructed jointly from", "477": "the same finite collection of auxiliary marks.  The mixed insertion", "478": "uses $A=1+\\sum_{j=1}^kz_jg_j\\sigma_i$.  Its mixed derivative in all", "479": "$z_j$ is the symmetric multilinear form obtained by polarizing the", "480": "degree-$k$ coefficient for a single $g$.  More explicitly, if", "481": "$Q_N(g)=k![t^k]H_N(t,0)$, then the mixed derivative is", "482": "\\[", "483": " \\frac{k^k}{2^k k!}", "484": " \\sum_{\\epsilon\\in\\{-1,1\\}^k}", "485": "    \\left(\\prod_{j=1}^k\\epsilon_j\\right)", "486": " Q_N\\left(k^{-1}\\sum_{j=1}^k\\epsilon_jg_j\\right).", "487": "\\]", "488": "Every argument of $Q_N$ is rational-valued and bounded by one, so each", "489": "resulting pair $(g,g_0)$ belongs to the fixed mark family.  Lemma", "490": "\\ref{pert:analytic} makes the displayed mixed derivative tend to zero.", "491": "The mixed derivative expansion is precisely the ordered extension", "492": "rule: there is no additional factorial in its coefficients.", "493": "", "494": "It remains to arrange that the expectation over the marks selects", "495": "exactly the extensions satisfying $\\mathcal C$.  For a pair of colors", "496": "$a,b\\in\\{0,\\ldots,k\\}$ and a depth $1\\leq d\\leq L-1$, the event", "497": "that their split depth is at least $d$ is the event that they share", "498": "their vertex at depth $d$.  Introduce a new independent Rademacher", "499": "coordinate at that depth and give both $g_a$ and $g_b$ its factor.", "500": "Its contribution to their joint mark expectation is $1$ if the", "501": "vertex is shared and $0$ otherwise.  For a finite collection of such", "502": "requirements, use different independent coordinates for the", "503": "different requirements and define each $g_a$ as the product of its", "504": "assigned factors.  Then", "505": "\\begin{equation}", "506": " \\mathbb E_{\\rm marks}", "507": "       \\left[g_0^{a_*}\\prod_{j=1}^kg_j^{a_j(E)}\\right]", "508": " =\\prod_{(a,b,d)\\ {\\rm required}}", "509": "       \\mathbf1_{\\{a,b\\text{ share their depth-}d\\text{ vertex}\\}}.", "510": " \\label{pert:mark-selector}", "511": "\\end{equation}", "512": "All marks in this calculation are independent of the base reservoir.", "513": "", "514": "Let $H_d(a,b)$ denote the sharing indicator in", "515": "\\eqref{pert:mark-selector}, with $H_0=1$ and $H_L=0$ for distinct", "516": "replica positions. These are positions in the sampled tree, even when", "517": "their spin configurations happen to agree. Exact splitting at depth $d$ is expressed by", "518": "$H_d-H_{d+1}$, for $0\\leq d\\leq L-1$.  Products and finite linear", "519": "combinations therefore select any prescribed consistent colored", "520": "shape or collection of allowed shapes. For each term of this finite", "521": "linear combination, the functions $g_0,\\ldots,g_k$ are products of signs", "522": "and hence take values in $\\{-1,1\\}$. These functions and their", "523": "polarization averages belong to the mark family fixed at the start of", "524": "the section. Constant marks cover $k=0$.", "525": "", "526": "Finally apply the mixed canceled-anchor expansion to the difference", "527": "\\eqref{pert:analytic-difference}, average the marks using the", "528": "selector, and average the independent uniform insertion site.  The", "529": "latter average is exactly $R_E$.  Lemma~\\ref{pert:analytic} and", "530": "polarization make the coefficient difference tend to zero, yielding", "531": "\\eqref{pert:tree-identity-eq}.  Finite linear combinations extend the", "532": "conclusion from overlap monomials to the stated tests.  The", "533": "construction uses only marks through depth $L-1$: the extension rule", "534": "never reuses the anchor or an already used color, so no test of", "535": "coincidence at depth $L$ is required.", "536": "\\end{proof}", "537": "", "538": "\\begin{remark}[Order of the choices]", "539": "The mark specifications and their positive weights $c_\\nu$ are fixed", "540": "first, for a fixed $L$.  Parameter averaging then gives one selected", "541": "sequence on which all types concentrate and all finite overlap", "542": "moments converge.  The analytic argument takes $N\\to\\infty$ with", "543": "each $j$ fixed before sending $j\\to\\infty$.  Only after the resulting", "544": "prescribed-tree identities have been established is $L$ allowed to", "545": "increase.  No concentration estimate uniform over the countable", "546": "family is needed.", "547": "\\end{remark}"}, "decorrelation.tex": {"1": "\\section{Decorrelation on prescribed trees}", "2": "\\label{decor:section}", "3": "", "4": "Throughout this section $m_d=d/L$ and $\\delta=L^{-1}$.  For each fixed", "5": "$L$, all limits in $N$ are along the sizes and parameter choices supplied", "6": "by \\cref{pert:selection}; they satisfy the identities of", "7": "\\cref{pert:tree-identity}. Different values of $L$ may use different", "8": "sequences. The argument uses only these identities and the tree sampling", "9": "rules; in particular, it does not use the interaction factorization.", "10": "", "11": "Our goal is concentration of every finite multioverlap, averaged over", "12": "separated interior branching depths. These are the averages needed for", "13": "the comparison with independent messages in \\cref{comp:section}.", "14": "", "15": "\\subsection{Averages over depths}", "16": "\\label{decor:averages}", "17": "", "18": "A topology is a finite rooted tree on labeled leaves, with unary vertices", "19": "suppressed.  Each branching vertex is assigned an integer depth in", "20": "$\\{0,\\ldots,L-1\\}$, increasing strictly along every branch.  Write $b(S)$", "21": "for the number of branching vertices of a topology $S$.  Fix $\\eta>0$.", "22": "A depth assignment is \\emph{$\\eta$-regular} if every assigned depth divided", "23": "by $L$ lies in $(\\eta,1-\\eta)$ and the normalized depths of distinct", "24": "branching vertices differ by more than $\\eta$.  When an additional", "25": "prefix depth $d$ is specified, it must satisfy the same restrictions", "26": "relative to all branching depths.  When two copies of one topology use", "27": "aligned depths, corresponding vertices share one depth coordinate;", "28": "regularity is imposed on these distinct coordinates.", "29": "", "30": "For a nonnegative array $z(\\mathbf q)$ on $a$ depth coordinates, put", "31": "\\begin{equation}", "32": " \\mathcal A_{L,\\eta}z", "33": "   =L^{-a}\\sum_{\\mathbf q\\;\\eta\\text{-regular}}z(\\mathbf q).", "34": " \\label{decor:average-definition}", "35": "\\end{equation}", "36": "Additional ordering restrictions, such as $d<\\min_v q_v$, are included", "37": "in the summation domain.  These are unnormalized averages: their total", "38": "mass is at most one.  Consequently, for $0<\\gamma\\le1$,", "39": "\\begin{equation}", "40": " \\mathcal A_{L,\\eta}(z^\\gamma)", "41": "       \\le (\\mathcal A_{L,\\eta}z)^\\gamma.", "42": " \\label{decor:average-holder}", "43": "\\end{equation}", "44": "Two elementary comparisons will recur. Summing over an unused coordinate", "45": "costs at most $L$, canceled by its normalization. A fixed integer shift of", "46": "any subset of the coordinates maps $\\eta$-regular assignments injectively", "47": "into $\\eta/2$-regular assignments for all sufficiently large $L$.", "48": "", "49": "There are only finitely many labeled topologies of any bounded size and,", "50": "at fixed $L$, only finitely many assignments of their depths.  Thus", "51": "errors in Theorem~\\ref{pert:tree-identity} can be maximized over any", "52": "of the finite collections used below before taking $N\\to\\infty$.", "53": "We denote such a maximum by $\\varepsilon_{N,L,k}$; for each fixed $L,k$,", "54": "\\begin{equation}", "55": " \\varepsilon_{N,L,k}\\longrightarrow0.", "56": " \\label{decor:identity-error}", "57": "\\end{equation}", "58": "Constants multiplying this error may depend arbitrarily on $L$.", "59": "", "60": "Recall that $R_S$ is the multioverlap of the sampled leaves of $S$,", "61": "defined in \\eqref{tree:multioverlap}. The result to be proved is the following.", "62": "", "63": "\\begin{theorem}", "64": "\\label{decor:overlap-concentration}", "65": "For every fixed labeled topology $S$,", "66": "\\begin{equation}", "67": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "68": "       \\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)=0", "69": "       \\qquad(\\eta>0),", "70": " \\label{decor:overlap-concentration-equation}", "71": "\\end{equation}", "72": "where only the $b(S)$ branching depths are averaged. For a", "73": "singleton, whose average has no coordinates,", "74": "$\\operatorname{Var}(R_S)\\to0$ as $N\\to\\infty$ at every fixed $L$.", "75": "\\end{theorem}", "76": "", "77": "The proof has two parts. First we control the randomness below a", "78": "sampled prefix through the squared conditional covariance of the", "79": "spin-product vector. This is an induction on the number of leaves;", "80": "delaying the target splits by one level will control its signed", "81": "extension coefficients. We then use a marker anchor to concentrate the", "82": "remaining conditional mean at each fixed depth. Averaging over depths", "83": "is essential when combining the two estimates.", "84": "", "85": "\\subsection{Conditional covariance and continuity in depth}", "86": "", "87": "For a sampled copy of $S$, set", "88": "\\[", "89": " A_S=\\left(\\prod_{a\\in S}\\sigma_i^a\\right)_{i\\le N},", "90": " \\qquad R_S=\\mathbf1\\cdot A_S,", "91": " \\qquad x\\cdot y=N^{-1}\\sum_{i=1}^Nx_i y_i,", "92": " \\qquad \\|x\\|_N^2=x\\cdot x.", "93": "\\]", "94": "At a depth $d$ on its initial stem, including its first branching depth,", "95": "let $\\mathscr F_d$ be generated by the root and the sampled prefix through $d$,", "96": "and define", "97": "\\begin{align}", "98": " \\mu_{d,S}&=\\mathbb E[A_S\\mid\\mathscr F_d],\\notag\\\\", "99": " v_N(S,d)&=\\frac1{N^2}\\mathbb E\\sum_{i,j=1}^N", "100": "  \\operatorname{Cov}(A_{S,i},A_{S,j}\\mid\\mathscr F_d)^2.", "101": " \\label{decor:covariance-definition}", "102": "\\end{align}", "103": "The expectation includes the root. Every coordinate of $A_S$ and", "104": "$\\mu_{d,S}$ has absolute value at most one, and $0\\le v_N(S,d)\\le1$.", "105": "The next lemma explains why this squared covariance is the useful", "106": "quantity to induct on.", "107": "", "108": "\\begin{lemma}[Contractions and three copies]", "109": "\\label{decor:contractions}", "110": "If a random vector $B\\in[-1,1]^N$ is conditionally independent of $A_S$", "111": "given $\\mathscr F_d$, then", "112": "\\begin{equation}", "113": " \\bigl\\|(A_S-\\mu_{d,S})\\cdot B\\bigr\\|_{L^2}", "114": "        \\le v_N(S,d)^{1/4}.", "115": " \\label{decor:contraction-bound}", "116": "\\end{equation}", "117": "If $X,Y,Z$ are conditionally independent copies of a bounded random", "118": "vector given a sigma field $\\mathscr G$, and $C$ is its conditional", "119": "covariance matrix, then", "120": "\\begin{equation}", "121": " \\mathbb E(X\\cdot Y-X\\cdot Z)^2", "122": "       \\ge \\frac2{N^2}\\mathbb E\\sum_{i,j}C_{ij}^2.", "123": " \\label{decor:three-copy-bound}", "124": "\\end{equation}", "125": "\\end{lemma}", "126": "", "127": "\\begin{proof}", "128": "Conditional on $\\mathscr F_d$ and $B$, the squared contraction has", "129": "expectation $N^{-2}\\sum_{ij}C_{ij}B_iB_j$.  Its absolute value is at", "130": "most $N^{-2}\\sum_{ij}|C_{ij}|$.  Cauchy--Schwarz, first over $i,j$", "131": "and then over the prefix, proves \\eqref{decor:contraction-bound}.", "132": "For the second assertion, write $\\mu=\\mathbb E[X\\mid\\mathscr G]$.", "133": "Conditional independence gives", "134": "\\[", "135": " \\mathbb E[(X\\cdot Y-X\\cdot Z)^2\\mid\\mathscr G]", "136": " =\\frac2{N^2}\\operatorname{tr}\\bigl((C+\\mu\\mu^{\\mathsf T})C\\bigr)", "137": " \\ge\\frac2{N^2}\\operatorname{tr}(C^2),", "138": "\\]", "139": "since $C$ is positive semidefinite.", "140": "\\end{proof}", "141": "", "142": "\\begin{lemma}[Averaged continuity in depth]", "143": "\\label{decor:depth-continuity}", "144": "Fix a topology $S$ and a subset $U$ of its branching vertices. For each", "145": "$\\eta$-regular depth assignment, let $S^U$ have the same topology with", "146": "the depths of the vertices in $U$ increased by one. At an ancestral", "147": "evaluation depth $d$, compare the means using the same sampled prefix.", "148": "Then, for all sufficiently large $L$,", "149": "\\begin{equation}", "150": " \\mathcal A_{L,\\eta}\\mathbb E", "151": "       \\|\\mu_{d,S^U}-\\mu_{d,S}\\|_N^2\\le C/L.", "152": " \\label{decor:branch-depth-continuity}", "153": "\\end{equation}", "154": "The average ranges over all branching depths; the coordinate $d$ is", "155": "also averaged if it ranges, and otherwise is held fixed. If $d$ ranges", "156": "along an initial unary stretch of $S$, then", "157": "\\begin{equation}", "158": " \\mathcal A_{L,\\eta}\\mathbb E", "159": "       \\|\\mu_{d+1,S}-\\mu_{d,S}\\|_N^2\\le C/L,", "160": " \\label{decor:evaluation-depth-continuity}", "161": "\\end{equation}", "162": "where this average includes $d$ and all branching depths, and the means", "163": "are evaluated along the same sampled path. The constant depends only on", "164": "the number of vertices and shifts, uniformly in $N$, the evaluation", "165": "depth, and the transition kernels.", "166": "\\end{lemma}", "167": "", "168": "\\begin{proof}", "169": "Keep the later branching depths of $T$ fixed and sample a single path", "170": "along its initial stem. On this path, $\\mu_{t,T}$ is a bounded vector", "171": "martingale. Orthogonality of its increments gives", "172": "\\begin{equation}", "173": " \\sum_t\\mathbb E\\|\\mu_{t+1,T}-\\mu_{t,T}\\|_N^2\\le1.", "174": " \\label{decor:martingale-energy}", "175": "\\end{equation}", "176": "This proves the evaluation-depth assertion after summing over the", "177": "ranged depth and dividing by $L$.", "178": "", "179": "Consider a branching vertex at depth $q$ with child shapes", "180": "$T_1,\\ldots,T_s$.  Holding their later depths fixed, its original", "181": "conditional mean is $\\prod_j \\mu_{q,T_j}$, with products understood", "182": "coordinatewise.  If the split is delayed to $q+1$, its conditional mean", "183": "at the same prefix of depth $q$ is", "184": "$\\mathbb E[\\prod_j \\mu_{q+1,T_j}\\mid\\mathscr F_q]$, where the child means", "185": "are evaluated on a common one-step continuation.  Jensen's inequality", "186": "and the product difference inequality on $[-1,1]^s$ yield", "187": "\\begin{equation}", "188": " \\mathbb E\\left\\|\\prod_j \\mu_{q,T_j}", "189": "       -\\mathbb E\\left[\\prod_j \\mu_{q+1,T_j}\\mid\\mathscr F_q\\right]", "190": "       \\right\\|_N^2", "191": " \\le s\\sum_j\\mathbb E\\|\\mu_{q+1,T_j}-\\mu_{q,T_j}\\|_N^2.", "192": " \\label{decor:one-vertex-shift}", "193": "\\end{equation}", "194": "Summing over $q$ uses \\eqref{decor:martingale-energy} with each child", "195": "shape fixed.  Propagating a changed subtree mean towards an ancestral", "196": "evaluation consists of conditional expectations and multiplication", "197": "by factors bounded by one.  Both operations contract this squared", "198": "norm.  Averaging over all other depth coordinates therefore proves", "199": "the claimed $C/L$ bound for one shift.  For several shifts, change the", "200": "vertices one at a time and use the squared triangle inequality with", "201": "a factor equal to the number of shifts.  Regularity ensures that the", "202": "intermediate shapes have the same ancestry relations and, for large", "203": "$L$, lie in the enlarged $\\eta/2$-regular domain.  All relevant", "204": "one-prefix marginal laws are unchanged when other sampled branches", "205": "are omitted, so these estimates hold in any larger sampled tree.", "206": "\\end{proof}", "207": "", "208": "Suppose now that $S$ first branches at depth $e$ into proper child shapes", "209": "$T_1,\\ldots,T_s$. Conditional independence of the children gives", "210": "$\\mu_{e,S}=\\prod_j\\mu_{e,T_j}$. Write", "211": "\\begin{equation}", "212": " a_{S,e}=\\prod_{j=1}^s \\mu_{e,T_j},", "213": " \\qquad p_N(S,e)=\\sum_{j=1}^s v_N(T_j,e)^{1/4}.", "214": " \\label{decor:projection-definition}", "215": "\\end{equation}", "216": "For any vector $B\\in[-1,1]^N$ independent of the continuation of $S$", "217": "given its prefix at $e$, successive replacement of the children,", "218": "using \\eqref{decor:contraction-bound}, gives", "219": "\\begin{equation}", "220": " \\|(A_S-a_{S,e})\\cdot B\\|_{L^2}\\le p_N(S,e).", "221": " \\label{decor:projection-bound}", "222": "\\end{equation}", "223": "At each replacement the other child vectors and the already replaced", "224": "means form a bounded multiplier independent of the child being", "225": "replaced, conditionally on $\\mathscr F_e$.  In particular this applies", "226": "to $B=\\mathbf1$, and to a vector sampled on another side separated", "227": "before $e$.  For two such sides, both can be projected with total", "228": "$L^2$ error at most $2p_N(S,e)$.  Multiplication of the contracted", "229": "error by any scalar test $f$ with $|f|\\le1$, even a correlated one,", "230": "does not increase its $L^1$ bound.", "231": "", "232": "\\subsection{Conditional decorrelation}", "233": "", "234": "\\begin{proposition}", "235": "\\label{decor:conditional-concentration}", "236": "For every fixed labeled topology $S$ and every $\\eta>0$,", "237": "\\begin{equation}", "238": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "239": "       \\mathcal A_{L,\\eta}v_N(S,d)=0,", "240": " \\label{decor:conditional-concentration-equation}", "241": "\\end{equation}", "242": "where the average ranges over all branching depths of $S$ and an", "243": "additional regular depth $d$ strictly before its first split.  For a", "244": "singleton, the average ranges over $d$ alone.", "245": "\\end{proposition}", "246": "", "247": "\\begin{proof}", "248": "We induct on the number $k$ of leaves. The induction replaces each", "249": "proper child by its conditional mean. It then applies the prescribed-tree", "250": "identity to two copies with delayed branching depths; after summing the", "251": "signed coefficients, this becomes a nonnegative three-copy estimate.", "252": "To keep track of the depth averages, let", "253": "\\begin{equation}", "254": " V_{k,L}(\\eta)=\\max_{1\\le |S|\\le k}", "255": "       \\limsup_{N\\to\\infty}\\mathcal A_{L,\\eta}v_N(S,d).", "256": " \\label{decor:V-definition}", "257": "\\end{equation}", "258": "The maximum is over finitely many labeled topologies.  Averages of", "259": "any lower-order covariance used below, including averages with extra", "260": "unused coordinates or shifted depths, are bounded by the appropriate", "261": "$V_{k-1,L}(\\eta/2)$, using", "262": "\\eqref{decor:average-holder} when fractional powers occur.", "263": "", "264": "\\paragraph{One leaf.}", "265": "Take two old paths splitting at $d$, with path $1$ a spin anchor, and", "266": "add one color required to split from the anchor exactly at $d$.", "267": "The available old path $2$ has coefficient $1$.  A fresh path can", "268": "split from both old paths at $d$, with coefficient $-c_d$, or follow", "269": "path $2$ and leave it at $\\ell>d$, with coefficient $-c_\\ell$, where", "270": "\\begin{equation}", "271": " c_d=2m_{d+1}-m_d=(d+2)\\delta,", "272": " \\qquad c_\\ell=\\delta\\quad(d<\\ell\\le L-1).", "273": " \\label{decor:c-weights}", "274": "\\end{equation}", "275": "From the anchor alone the total coefficient is $-\\delta$.", "276": "Write $X=R_{12}$ and $X_\\ell=R_{13}$ for the corresponding fresh", "277": "extension.  Each $X_\\ell$ has the marginal law of $X$, and", "278": "$\\sum_{\\ell=d}^{L-1}c_\\ell=1+\\delta$.  The prescribed-tree identity", "279": "with $f=X$ therefore gives", "280": "\\begin{equation}", "281": " \\frac12\\sum_{\\ell=d}^{L-1}c_\\ell", "282": "      \\mathbb E(X-X_\\ell)^2", "283": "       =\\delta\\operatorname{Var}(X)+o_N(1)", "284": "       \\le\\delta+o_N(1).", "285": " \\label{decor:singleton-identity}", "286": "\\end{equation}", "287": "For $\\ell=d$, the three spin vectors are conditionally independent", "288": "below $d$.  Hence \\eqref{decor:three-copy-bound} and $c_d\\ge\\eta$", "289": "give $v_N(S,d)\\le\\delta/\\eta+o_N(1)$ at each fixed $L,d$.", "290": "This proves $V_{1,L}(\\eta)\\le\\delta/\\eta$.", "291": "", "292": "\\paragraph{Shifted copies and their coefficients.}", "293": "Let $|S|=k\\ge2$, its first split be $e>d$, and its proper child shapes", "294": "be $T_1,\\ldots,T_s$.  Sample an old tree consisting of two copies of", "295": "$S$, denoted I and II, whose stems split at $d$ and whose internal", "296": "depth assignments are aligned.  Fix an old leaf in I as the spin", "297": "anchor.  Let $S^+$ be the topology $S$ with every internal branching", "298": "depth increased by one.  In the prescribed-tree identity require", "299": "the anchor and the added colors to form two copies of $S^+$,", "300": "separated at $d$, with the anchor in its original labeled position", "301": "in the first copy.  These constraints involve only the anchor and", "302": "the added colors.  Add all other colors of side I first, then those", "303": "of side II. \\Cref{decor:shift-figure} illustrates one local shift.", "304": "", "305": "\\begin{figure}[!ht]", "306": "\\centering", "307": "\\begin{tikzpicture}[x=1.05cm,y=0.82cm,>=stealth,font=\\small]", "308": " \\draw[gray!45,densely dotted] (-2.9,-1) -- (2.3,-1);", "309": " \\draw[gray!45,densely dotted] (-2.9,-2) -- (2.3,-2);", "310": " \\node[left] at (-2.9,-1) {$e$};", "311": " \\node[left] at (-2.9,-2) {$e+1$};", "312": " \\draw[thick] (0,0) -- (0,-1) -- (-1,-2) -- (-2,-3.2);", "313": " \\draw[thick] (0,-1) -- (1.5,-3.2);", "314": " \\draw[blue!65!black,very thick,dashed] (-1,-2) -- (-0.05,-3.2);", "315": " \\fill (0,-1) circle (2pt);", "316": " \\fill[blue!65!black] (-1,-2) circle (2.2pt);", "317": " \\node[above] at (0,0) {common stem};", "318": " \\node[below] at (-2,-3.2) {anchor};", "319": " \\node[below,blue!65!black] at (-0.05,-3.2) {new child};", "320": " \\node[below] at (1.5,-3.2) {old leaf};", "321": " \\node[right,blue!65!black] at (-0.5,-2.6) {$-\\delta$};", "322": "\\end{tikzpicture}", "323": "\\caption{One local effect of delaying a target split. The old tree is solid;", "324": "the dashed child creates a split at the previously unary depth-$e+1$ vertex,", "325": "with coefficient $m_{e+1}-m_{e+2}=-\\delta$.", "326": "The proof shifts every internal target depth and charges distinct vertices", "327": "separately, even when their depths coincide. Later target colors may reuse", "328": "eligible old leaves.}", "329": "\\label{decor:shift-figure}", "330": "\\end{figure}", "331": "", "332": "Let $\\kappa(T)$ be the reference coefficient \\eqref{tree:K}, and put", "333": "\\begin{equation}", "334": " J=\\kappa(S^+)^2.", "335": " \\label{decor:J-definition}", "336": "\\end{equation}", "337": "At each", "338": "vertex the $j=1$ factor is $-\\delta$; for $j\\ge2$ its absolute value", "339": "is at least $\\eta/2$ for all sufficiently large $L$.  If $b=b(S)$,", "340": "then", "341": "\\begin{equation}", "342": " |J|\\ge c_{k,\\eta}\\delta^{2b}>0.", "343": " \\label{decor:J-lower-bound}", "344": "\\end{equation}", "345": "For large $L$, regularity ensures that each shifted depth differs from", "346": "every branching depth of the old tree, including $d$. Thus these $2b$", "347": "target branching vertices must be created by fresh unary splits.", "348": "Lemma~\\ref{tree:charging} gives", "349": "\\begin{equation}", "350": " \\frac1{|J|}\\sum_{\\text{allowed extensions}}|c|", "351": "        \\le C_{k,\\eta}.", "352": " \\label{decor:relative-absolute-cost}", "353": "\\end{equation}", "354": "The two copies have aligned depths but distinct branching vertices:", "355": "each vertex supplies its own factor $\\delta$. This is the reason for", "356": "the shift. The full signed coefficient has an additional factor", "357": "$-\\delta$ from separation at $d$; we divide by $J$ and leave that", "358": "factor in the identity. Equation~\\eqref{decor:relative-absolute-cost}", "359": "then controls every projection error after division.", "360": "", "361": "\\paragraph{Projecting the two target sides.}", "362": "In every extension, the marginal target tree consists of two", "363": "ordinary copies of $S^+$, independent below their separation at $d$.", "364": "By \\eqref{decor:projection-bound} its multioverlap differs in", "365": "$L^2$ from the contraction of its projected means at $e+1$ by at", "366": "most $2p_N(S^+,e+1)$.  Change the proper child depths back by one,", "367": "then change their evaluation depth from $e+1$ to $e$.  The product", "368": "difference inequality and Lemma~\\ref{decor:depth-continuity} show", "369": "that this adds an error at most $h_N(S)$ in $L^2$, with", "370": "\\begin{equation}", "371": " \\mathcal A_{L,\\eta}h_N(S)^2\\le C_k/L.", "372": " \\label{decor:projection-shift-error}", "373": "\\end{equation}", "374": "One can take $h_N(S)$ to be the sum of the finitely many", "375": "$L^2(\\|\\cdot\\|_N)$ distances in these comparisons, multiplied by", "376": "a size-dependent constant.  This definition depends only on the", "377": "single-copy marginal shapes, not on the particular extension.", "378": "Thus \\eqref{decor:projection-shift-error} holds uniformly for the", "379": "comparisons in the extension sum, even though the union of the", "380": "old and target trees itself need not have regular depths.", "381": "", "382": "Let $a,b$ denote the vectors $a_{S,e}$ on the old stems I and II.", "383": "The target stem in I shares the old prefix through $e$ because it", "384": "contains the anchor, so its final projected vector is $a$.", "385": "", "386": "\\paragraph{The signed extension sum.}", "387": "Set $f$ to be the overlap of all $2k$ old leaves, an allowed fixed", "388": "overlap monomial. All target-I additions stay in the anchor's branch", "389": "below $d$, so they leave the old-II stem and its child counts unchanged.", "390": "Classify the first added path of target side II by its prefix", "391": "through $e$.  It may diverge freshly at $\\ell=d$, with coefficient", "392": "$-c_d$, or follow the old II stem and diverge at $d<\\ell<e$, with", "393": "coefficient $-c_\\ell=-\\delta$.  In such a class let $b_\\ell$ be", "394": "$a_{S,e}$ on the new stem; it shares the old II prefix through", "395": "$\\ell$.  At $\\ell=d$ the stems carrying $a,b,b_d$ are conditionally", "396": "independent below $d$.  Every remaining possibility follows the", "397": "old II prefix through $e$ and has final projected vector $b$.", "398": "All later target paths in side II follow its first path through", "399": "$e$, since their earliest split is $e+1$.", "400": "", "401": "For a fixed extension history, retain every old path and the first", "402": "target-II prefix through $e$, and delete all other new branches.", "403": "The target-I projection $a$ already depends only on the retained old", "404": "anchor prefix. Each deleted subtree integrates to one under its", "405": "probability kernels; a reused old leaf introduces no new variable.", "406": "The retained tree depends only on the class: it is the old tree with a", "407": "fresh stem attached at $\\ell<e$, or just the old tree in the remaining", "408": "class. The history is a combinatorial choice, not a condition on sampled", "409": "values. Thus the joint marginal of the old paths and projected prefixes", "410": "is fixed within each class. In particular, the expectation of $f$ times", "411": "the projected overlap is constant within a class and can be multiplied", "412": "by its total signed coefficient.", "413": "", "414": "By Lemma~\\ref{tree:reference-total}, summing later side-II colors", "415": "backwards gives $\\kappa(S^+)$ for each first-path choice.  Summing the", "416": "side-I choices gives the other factor $\\kappa(S^+)$. The fresh class", "417": "at $\\ell$ therefore has total coefficient $-c_\\ell J$.", "418": "The total coefficient is $-\\delta J$, both from the old tree and", "419": "from the anchor alone. Since", "420": "\\[", "421": " \\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta=m_e+\\delta,", "422": "\\]", "423": "the remaining prefix-through-$e$ class has coefficient $m_eJ$.", "424": "Thus the projected terms have the following coefficients:", "425": "\\[", "426": " \\begin{array}{c|c|c}", "427": " \\text{side-II prefix} & \\text{projected overlap}", "428": "      & \\text{total coefficient}\\\\ \\hline", "429": " \\text{fresh divergence at }d\\le\\ell<e & a\\cdot b_\\ell & -c_\\ell J\\\\", "430": " \\text{old prefix through }e & a\\cdot b & m_eJ", "431": " \\end{array}", "432": "\\]", "433": "", "434": "Multiply the projected overlap in each row by $f$ and divide the", "435": "prescribed-tree identity by $J$. Rearranging gives", "436": "\\begin{equation}", "437": " \\sum_{\\ell=d}^{e-1}c_\\ell", "438": "   \\mathbb E\\bigl[f(a\\cdot b-a\\cdot b_\\ell)\\bigr]", "439": " =\\delta\\bigl(\\mathbb E[f(a\\cdot b)]", "440": "          -\\mathbb Ef\\,\\mathbb ER_{\\mathrm{target}}\\bigr)", "441": "       +\\rho_N(S,d),", "442": " \\label{decor:induction-identity}", "443": "\\end{equation}", "444": "where $R_{\\mathrm{target}}$ on the right is the target overlap in", "445": "the anchor-alone extension.  Its absolute value is at most one.", "446": "The error satisfies", "447": "\\begin{equation}", "448": " |\\rho_N(S,d)|\\le C_{k,\\eta}", "449": "       \\bigl(p_N(S^+,e+1)+h_N(S)\\bigr)", "450": "       +C_{L,k,\\eta}\\varepsilon_{N,L,k}.", "451": " \\label{decor:induction-error}", "452": "\\end{equation}", "453": "Indeed, multiplying a projection error by $f$, even when correlated", "454": "with it, costs at most its $L^2$ norm since $|f|\\le1$. Sum these errors", "455": "with absolute coefficients and apply", "456": "\\eqref{decor:relative-absolute-cost}. The final term includes division", "457": "of the original identity error by $J$ and tends to zero at fixed $L$.", "458": "", "459": "\\paragraph{Closing the induction.}", "460": "Equation~\\eqref{decor:projection-bound} gives", "461": "$\\|f-a\\cdot b\\|_{L^2}\\le2p_N(S,e)$.", "462": "Moreover", "463": "$\\sum_{\\ell=d}^{e-1}c_\\ell=(e+1)\\delta\\le1$.", "464": "Replacing $f$ by $a\\cdot b$ on the left of", "465": "\\eqref{decor:induction-identity} therefore costs at most", "466": "$4p_N(S,e)$.  Each $a\\cdot b_\\ell$ has the same marginal law as", "467": "$a\\cdot b$, so that left side becomes", "468": "\\[", "469": " \\frac12\\sum_{\\ell=d}^{e-1}c_\\ell", "470": "        \\mathbb E(a\\cdot b-a\\cdot b_\\ell)^2.", "471": "\\]", "472": "Its summands are nonnegative and $c_d\\ge\\eta$.  The right side", "473": "of \\eqref{decor:induction-identity} is bounded in absolute value", "474": "by $2\\delta+|\\rho_N(S,d)|$.  Hence", "475": "\\begin{equation}", "476": " \\mathbb E(a\\cdot b-a\\cdot b_d)^2", "477": " \\le C_\\eta\\bigl(\\delta+p_N(S,e)+|\\rho_N(S,d)|\\bigr).", "478": " \\label{decor:projected-three-copy}", "479": "\\end{equation}", "480": "Sample three copies of $A_S$ conditionally independently below", "481": "$d$.  Projecting each of the two contractions involving the", "482": "first copy changes it in $L^2$ by at most $2p_N(S,e)$.", "483": "Using \\eqref{decor:three-copy-bound},", "484": "\\eqref{decor:projected-three-copy}, and $p_N(S,e)\\le k$, we obtain", "485": "\\begin{equation}", "486": " v_N(S,d)\\le C_{k,\\eta}\\bigl(", "487": "       \\delta+p_N(S,e)+p_N(S^+,e+1)+h_N(S)\\bigr)", "488": "       +C_{L,k,\\eta}\\varepsilon_{N,L,k}.", "489": " \\label{decor:covariance-induction-estimate}", "490": "\\end{equation}", "491": "Each child in either $p_N$ has fewer than $k$ leaves. To make the", "492": "averaging step explicit, the aligned construction has", "493": "$D=b(S)+1$ distinct depth coordinates, including $d$ and $e$.", "494": "A term belonging to $T_j$ uses only $D_j=b(T_j)+1$ coordinates.", "495": "For the shifted term these are", "496": "$\\pi_j(\\mathbf q)=(e+1,(q_v+1)_{v\\in\\operatorname{Br}(T_j)})$.", "497": "Every retained assignment has at most $L^{D-D_j}$ preimages, and its", "498": "coordinates are $\\eta/2$-regular for large $L$. If $w_j$ is the child", "499": "covariance as a function of these coordinates, then, for $0<\\gamma\\le1$,", "500": "\\begin{align}", "501": " L^{-D}\\sum_{\\mathbf q\\;\\eta\\text{-regular}}", "502": "       w_j(\\pi_j(\\mathbf q))^\\gamma", "503": " &\\le L^{-D_j}\\sum_{\\mathbf y\\;\\eta/2\\text{-regular}}w_j(\\mathbf y)^\\gamma", "504": " \\notag\\\\", "505": " &\\le\\left(L^{-D_j}\\sum_{\\mathbf y\\;\\eta/2\\text{-regular}}", "506": "       w_j(\\mathbf y)\\right)^\\gamma.", "507": " \\label{decor:fiber-bound}", "508": "\\end{align}", "509": "The unshifted term has the same bound without translating the coordinates.", "510": "Thus the two aligned copies use single-copy estimates; there is no", "511": "restriction of an independently averaged pair of copies to a diagonal.", "512": "Taking $\\gamma=1/4$ and then $\\limsup_N$, and using", "513": "\\eqref{decor:projection-shift-error} and", "514": "\\eqref{decor:identity-error}, gives, for sufficiently large $L$,", "515": "\\begin{equation}", "516": " V_{k,L}(\\eta)\\le C_{k,\\eta}\\left(", "517": "       L^{-1/2}+V_{k-1,L}(\\eta/2)^{1/4}\\right).", "518": " \\label{decor:induction-recursion}", "519": "\\end{equation}", "520": "The maximum over smaller topologies in \\eqref{decor:V-definition}", "521": "can be absorbed in the right side because these covariances are", "522": "bounded by one.  The base case and induction now imply", "523": "$V_{k,L}(\\eta)\\to0$ for every fixed $k,\\eta$, proving the proposition.", "524": "\\end{proof}", "525": "", "526": "\\subsection{Concentration of every multioverlap}", "527": "", "528": "The covariance estimate controls fluctuations below a sampled prefix.", "529": "We now use a marker anchor to concentrate the prefix projection, and", "530": "combine this with the averaged continuity estimate.", "531": "", "532": "\\begin{proof}[Proof of \\cref{decor:overlap-concentration}]", "533": "For a singleton, use the spin-anchor identity with no added colors", "534": "and $f=R_S$.  It gives", "535": "$\\mathbb ER_S^2=(\\mathbb ER_S)^2+o_N(1)$.", "536": "", "537": "Suppose $S$ first splits at $e$ and has proper child shapes", "538": "$T_1,\\ldots,T_s$. We will condition one step before $e$. Use $S$ as", "539": "the old tree, designate one of its", "540": "leaves as a marker anchor, and add a full copy of $S$ all of whose", "541": "leaves split from the anchor at $e-1$.  Its first path must be", "542": "fresh at $e-1$, because the old tree has not yet branched there.", "543": "All other target paths lie in the resulting fresh subtree.", "544": "The extension coefficient on both sides of the prescribed-tree", "545": "identity is the same nonzero number", "546": "\\begin{equation}", "547": " C(S,e)=-\\delta \\kappa(S).", "548": " \\label{decor:marker-coefficient}", "549": "\\end{equation}", "550": "The target and old copies are conditionally independent and", "551": "identically distributed below $\\mathscr F_{e-1}$. With", "552": "$f=R_S$ and $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$, their product has", "553": "conditional expectation $M^2$. On the anchor-alone side, deleting the", "554": "marker's continuation below $e-1$ integrates a probability kernel to one", "555": "and leaves the ordinary target law $S$, with mean $\\mathbb E R_S$.", "556": "The identity therefore gives", "557": "\\begin{equation}", "558": " C(S,e)\\bigl(\\mathbb EM^2-(\\mathbb E R_S)^2\\bigr)", "559": " =C(S,e)\\operatorname{Var}(M)=o_N(1),", "560": " \\label{decor:marker-variance-identity}", "561": "\\end{equation}", "562": "and hence", "563": "\\begin{equation}", "564": " \\qquad \\operatorname{Var}(M)\\longrightarrow0", "565": " \\quad\\text{at each fixed }L,S,e.", "566": " \\label{decor:prefix-projection-concentration}", "567": "\\end{equation}", "568": "Division by $C(S,e)$ is made only at fixed $L$; no uniform lower", "569": "bound as $L\\to\\infty$ is needed.", "570": "", "571": "It remains to control the conditional variance below this prefix.", "572": "The child covariances are evaluated at $e$, which is separated from", "573": "all their branching depths; the move to $e-1$ will use martingale", "574": "continuity instead. Set", "575": "\\[", "576": " G=\\mathbf1\\cdot\\prod_j \\mu_{e,T_j},", "577": " \\qquad G_-=\\mathbf1\\cdot\\prod_j \\mu_{e-1,T_j}.", "578": "\\]", "579": "The latter is $\\mathscr F_{e-1}$-measurable.  By", "580": "\\eqref{decor:projection-bound},", "581": "$\\mathbb E(R_S-G)^2\\le p_N(S,e)^2$.", "582": "Keeping all proper child depths fixed, the product difference", "583": "inequality and \\eqref{decor:martingale-energy} imply", "584": "\\begin{equation}", "585": " \\mathcal A_{L,\\eta}\\mathbb E(G-G_-)^2\\le C_k/L.", "586": " \\label{decor:adjacent-prefix-error}", "587": "\\end{equation}", "588": "Here $e$ is itself a ranged coordinate, so the one-step increments", "589": "are summed before division by $L$.  Since conditional expectation", "590": "is the optimal $L^2$ projection,", "591": "\\[", "592": " \\mathbb E(R_S-M)^2", "593": "   \\le\\mathbb E(R_S-G_-)^2", "594": "   \\le2p_N(S,e)^2+2\\mathbb E(G-G_-)^2.", "595": "\\]", "596": "Variance decomposition and", "597": "\\eqref{decor:prefix-projection-concentration} now show", "598": "\\begin{equation}", "599": " \\limsup_{N\\to\\infty}", "600": "      \\mathcal A_{L,\\eta}\\operatorname{Var}(R_S)", "601": " \\le C_k\\left(L^{-1}+V_{k-1,L}(\\eta/2)^{1/2}\\right)", "602": " \\quad\\text{for all sufficiently large }L.", "603": " \\label{decor:variance-estimate}", "604": "\\end{equation}", "605": "In this estimate we used", "606": "$p_N(S,e)^2\\le s\\sum_jv_N(T_j,e)^{1/2}$ and", "607": "\\eqref{decor:fiber-bound} with $\\gamma=1/2$: here the full average has", "608": "$D=b(S)$ coordinates because $d$ is absent, while still", "609": "$D_j=b(T_j)+1$. Proposition~\\ref{decor:conditional-concentration}", "610": "finishes the proof.", "611": "\\end{proof}", "612": "", "613": "\\begin{remark}", "614": "\\label{decor:order-of-limits}", "615": "All uncancelled small denominators in this section occur only in prescribed-tree", "616": "identity errors.  At fixed $L$ there are finitely many relevant trees,", "617": "so those errors disappear before any depth average or $L$ limit is", "618": "taken.  Errors that survive the $N$ limit are controlled by the", "619": "uniform relative absolute-cost bound", "620": "\\eqref{decor:relative-absolute-cost}, the lower-order covariance", "621": "averages, and the martingale estimate $C/L$.  No rate of convergence", "622": "in $N$ uniform in $L$ is used.", "623": "\\end{remark}"}, "comparison.tex": {"1": "\\section{Independent hierarchical messages and the cavity comparison}", "2": "\\label{comp:section}", "3": "", "4": "We turn the reservoir into a trial law in three steps: encode its full", "5": "one-site branching law, use multioverlap concentration to separate the", "6": "sites, and compare the resulting insertion logarithms.", "7": "", "8": "Fix $\\eps>0$. At each depth $L\\ge2$, use the sequence of sizes and", "9": "deterministic parameter choices supplied by \\cref{pert:selection}.", "10": "Write $N$ for sizes on this sequence. The choices may depend on $L$, and all statements below concern", "11": "these choices. Retain $\\underline F$ for the liminf over \\emph{all} system", "12": "sizes of the bounded model, as before selection. In particular,", "13": "\\begin{equation}\\label{comp:low-increments}", "14": " \\Delta_N^{L,\\mathbf u_{L,N}}\\le\\underline F+2\\eps.", "15": "\\end{equation}", "16": "", "17": "\\subsection{Encoding a single-site tree}", "18": "", "19": "\\begin{lemma}[Recursive law encoding]\\label[lemma]{comp:encoding}", "20": "For each fixed $N$, $L\\ge2$, and selected parameter vector, with the reservoir", "21": "root disorder averaged, there is a deterministic trial law", "22": "$\\zeta_{L,N}\\in\\mathcal M_L$ whose single-label spin process has the same", "23": "expected spin products on every prescribed tree as a uniformly chosen site", "24": "of the reservoir. Different trial labels can be chosen independently.", "25": "\\end{lemma}", "26": "", "27": "\\begin{proof}", "28": "Include an independent uniform site $i\\in[N]$ in the root variable, along", "29": "with the reservoir root disorder. Sample the tilted reservoir auxiliary", "30": "kernels along each path, and let $\\mathscr G_d$ be the sigma-field generated", "31": "by this enlarged root and the full auxiliary prefix through depth $d$.", "32": "At depth $r=L-1$ put", "33": "\\[", "34": " x=\\arctanh\\angles{\\sigma_i},", "35": "\\]", "36": "where the brackets denote the leaf Gibbs expectation. This is finite:", "37": "at finite $N$ all configuration weights are strictly positive, so", "38": "$-1<\\angles{\\sigma_i}<1$.", "39": "Thus $x$ is determined at depth $r$, before the terminal spin transition", "40": "at depth $L$. At each terminal replica leaf, draw a spin with law $q_x$. Given the", "41": "auxiliary prefix, these spins are independent and have exactly the", "42": "one-site law of the independent terminal Gibbs replicas.", "43": "", "44": "Define the random measures backward by", "45": "\\[", "46": " \\eta_{r-1}=\\operatorname{Law}(x\\mid\\mathscr G_{r-1}),\\qquad", "47": " \\eta_d=\\operatorname{Law}(\\eta_{d+1}\\mid\\mathscr G_d)", "48": " \\quad(0\\le d<r-1).", "49": "\\]", "50": "Then $\\eta_d\\in\\mathcal M_{r-d}$, so", "51": "$\\zeta_{L,N}=\\operatorname{Law}(\\eta_0)\\in\\mathcal M_L$.", "52": "All state spaces are standard", "53": "Borel, so these conditional probability kernels have measurable versions.", "54": "The auxiliary priors used here may be taken to be finite products of finite", "55": "mark spaces at each realized root; hence the same assertion also follows", "56": "directly by finite sums conditional on the root counts.", "57": "", "58": "Here is an explicit verification for every branching pattern. Fix a", "59": "descendant tree $T$ and prescribe a spin $e_a$ at each terminal leaf.", "60": "At depth $r$, its conditional probability is", "61": "$G_T(x)=\\prod_a q_x(e_a)$. At depth $d<r$, let $T_1,\\ldots,T_j$ be", "62": "the subtrees rooted at its children. Conditional independence of children", "63": "gives the backward recursion", "64": "\\[", "65": " G_T(\\eta_d)=\\prod_{\\ell=1}^j", "66": "       \\int G_{T_\\ell}(\\nu)\\,\\eta_d(d\\nu).", "67": "\\]", "68": "By induction, this probability depends on the full prefix only through", "69": "$\\eta_d$. Thus the nested measures preserve the joint output law of every", "70": "descendant tree, including unary stretches and arbitrary numbers of", "71": "children. This recursion is precisely the branching version of", "72": "\\eqref{model:chain}. Taking $\\zeta_{L,N}=\\operatorname{Law}(\\eta_0)$", "73": "preserves the root mixture as well. In particular, for every subset $S$", "74": "of the leaves,", "75": "\\begin{equation}\\label{comp:single-label-moments}", "76": " \\E\\prod_{a\\in S}\\tau^a", "77": " =\\frac1N\\sum_{i=1}^N\\E\\prod_{a\\in S}\\sigma_i^a", "78": " =\\E R_S.", "79": "\\end{equation}", "80": "Use independent copies of the entire construction, including the reservoir", "81": "root and uniform site, for different labels. The resulting messages are", "82": "independent of the new physical disorder in the cavity insertions.", "83": "\\end{proof}", "84": "", "85": "\\subsection{From multioverlaps to spin patterns}", "86": "", "87": "\\begin{lemma}[Empirical-pattern comparison]\\label[lemma]{comp:patterns}", "88": "Fix a prescribed tree with $k$ leaves. Suppose an observable of absolute", "89": "value at most one uses the replica-spin patterns at $a$ independent uniform", "90": "site labels. Replacing these patterns by $a$ independent trial-label patterns", "91": "from \\cref{comp:encoding} changes its expected value by at most", "92": "\\begin{equation}\\label{comp:pattern-error}", "93": " a\\sum_{\\varnothing\\ne S\\subseteq[k]}\\E|R_S-\\E R_S|.", "94": "\\end{equation}", "95": "The observable may also depend on new insertion disorder, independent of", "96": "the reservoir.", "97": "\\end{lemma}", "98": "", "99": "\\begin{proof}", "100": "Conditional on the sampled reservoir configurations, the pattern", "101": "$\\boldsymbol\\sigma_i=(\\sigma_i^1,\\ldots,\\sigma_i^k)$ at a uniform site", "102": "has empirical distribution", "103": "\\[", "104": " \\pi(\\boldsymbol e)=\\frac1N\\sum_i", "105": " \\prod_{b=1}^k\\frac{1+e_b\\sigma_i^b}{2}", "106": " =2^{-k}\\sum_{S\\subseteq[k]}R_S\\prod_{b\\in S}e_b,", "107": " \\qquad \\boldsymbol e\\in\\{-1,1\\}^k.", "108": "\\]", "109": "The trial-label distribution is $\\bar\\pi=\\E\\pi$ by", "110": "\\eqref{comp:single-label-moments}. Independent uniform sampling with", "111": "replacement gives $\\pi^{\\otimes a}$ conditionally in the reservoir; the", "112": "trial distribution is $\\bar\\pi^{\\otimes a}$. The elementary telescoping", "113": "bound for product measures gives", "114": "\\[", "115": " \\norm{\\pi^{\\otimes a}-\\bar\\pi^{\\otimes a}}_{\\rm TV}", "116": " \\le a\\norm{\\pi-\\bar\\pi}_{\\rm TV}", "117": " \\le\\frac a2\\sum_{\\varnothing\\ne S\\subseteq[k]}|R_S-\\E R_S|.", "118": "\\]", "119": "Integrating a function bounded by one costs at most twice total variation.", "120": "Conditioning on the independent insertion disorder proves the last assertion.", "121": "\\end{proof}", "122": "", "123": "Let $Q_k$ be the tree law in \\cref{tree:log-expansion}. We need the following", "124": "consequence of the decorrelation theorem:", "125": "\\begin{equation}\\label{comp:shape-error}", "126": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "127": " \\E_{Q_k}\\sum_{\\varnothing\\ne S\\subseteq[k]}", "128": " \\E|R_S-\\E R_S|=0\\qquad(k\\text{ fixed}).", "129": "\\end{equation}", "130": "Here and below the inner limit is along the selected fixed-$L$ sequence.", "131": "To see this, fix $0<\\eta<1/2$, and let $\\mathfrak S_k$ be the finite collection", "132": "of labeled topologies on nonempty subsets of $[k]$. We claim the bound", "133": "\\begin{equation}\\label{comp:shape-error-bound}", "134": " \\E_{Q_k}\\sum_{\\varnothing\\ne S\\subseteq[k]}", "135": "       \\E|R_S-\\E R_S|", "136": " \\le C_k\\left(\\eta+L^{-1}", "137": "       +\\sum_{U\\in\\mathfrak S_k}", "138": "          \\bigl(\\mathcal A_{L,\\eta}\\Var(R_U)\\bigr)^{1/2}\\right).", "139": "\\end{equation}", "140": "The average for a singleton has no depth coordinates.", "141": "By \\cref{tree:regular-shapes}, nonregular trees", "142": "have probability at most $C_k(\\eta+L^{-1})$. On regular trees every induced", "143": "subtree retains the interior and separation conditions on its branching", "144": "depths. For a topology with $a$ branching vertices, each depth assignment", "145": "has probability at most $C_kL^{-a}$. If an induced subtree retains $a'$", "146": "branching vertices, each assignment of its depths has at most $L^{a-a'}$", "147": "extensions to the full tree. Summing out these unused coordinates leaves", "148": "exactly the normalization $L^{-a'}$ in $\\mathcal A_{L,\\eta}$.", "149": "Cauchy--Schwarz bounds the resulting average of mean absolute deviations", "150": "by $\\bigl(\\mathcal A_{L,\\eta}\\Var(R_U)\\bigr)^{1/2}$.", "151": "Summing over the finitely many topologies and subsets, and using the bound", "152": "two for each deviation on nonregular trees, proves", "153": "\\eqref{comp:shape-error-bound}. Apply \\cref{decor:overlap-concentration}", "154": "first at fixed $\\eta$, taking the fixed-$L$ limit in $N$ before", "155": "$L\\to\\infty$, and then let $\\eta\\downarrow0$ to obtain", "156": "\\eqref{comp:shape-error}.", "157": "", "158": "\\subsection{Comparison of the insertion logarithms}", "159": "", "160": "\\begin{proposition}\\label[proposition]{comp:insertion-comparison}", "161": "For the trial laws of \\cref{comp:encoding}, with", "162": "$\\mathbf m^{(L)}=(1/L,\\ldots,(L-1)/L)$,", "163": "\\begin{equation}\\label{comp:increment-comparison}", "164": " \\lim_{L\\to\\infty}\\limsup_{N\\to\\infty}", "165": " \\left|\\Delta_N^{L,\\mathbf u_{L,N}}", "166": " -\\cB_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)})\\right|=0.", "167": "\\end{equation}", "168": "\\end{proposition}", "169": "", "170": "\\begin{proof}", "171": "For each insertion in \\cref{cavity:increment}, replace the reservoir spins", "172": "at its site labels by independent spin processes from \\cref{comp:encoding}.", "173": "Denote the resulting trial insertions by $\\widetilde A_{\\rm s}$ and", "174": "$\\widetilde A_{\\rm b}$, and their recursions from", "175": "\\eqref{tree:Y-recursion} by $\\widetilde Y_{0,\\rm s}$ and", "176": "$\\widetilde Y_{0,\\rm b}$. These recursions use the trial kernels.", "177": "", "178": "At the terminal spin transition, averaging $\\widetilde A_{\\rm s}$ over", "179": "its independent trial spins gives exactly $V_{\\rm s}$ in", "180": "\\eqref{model:vs}; hence $\\widetilde Y_{0,\\rm s}=T_0V_{\\rm s}$.", "181": "For $\\widetilde A_{\\rm b}$ the same transition gives a product of", "182": "$K_{\\rm b}$ edge factors with disjoint message labels. Given the physical", "183": "disorder and all message prefixes at a depth, these label groups remain", "184": "independent. Their product therefore factors through each conditional", "185": "power mean, successively from the last level to the first. Consequently,", "186": "\\[", "187": " \\begin{aligned}", "188": " \\E\\log\\widetilde Y_{0,\\rm b}", "189": " &=\\alpha(p-1)\\E\\log T_0V_{\\rm e},\\\\", "190": " \\log2+\\E\\log\\widetilde Y_{0,\\rm s}", "191": "       -\\E\\log\\widetilde Y_{0,\\rm b}", "192": " &=\\cB_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)}).", "193": " \\end{aligned}", "194": "\\]", "195": "By \\eqref{cavity:identity}, it remains to compare the reservoir and trial", "196": "insertion logarithms in the stated limits.", "197": "", "198": "Consider either insertion and first restrict its", "199": "Poisson count $K$ to $K\\le M$, where $M$ is fixed. Set", "200": "$C=H+BM$, $z=\\cosh C$, and $c=\\tanh C<1$. On this event both the reservoir", "201": "insertion and its trial version can be written as", "202": "$A=z(1+D)$ with $|D|\\le c$, uniformly in all disorder and path variables.", "203": "The deterministic term $\\log z$ cancels in the comparison.", "204": "", "205": "At each order $k$ of \\cref{tree:log-expansion}, the product of the $k$", "206": "copies of $D$ is a bounded function of replica-spin patterns at at most", "207": "$pM$ labels and of independent insertion disorder. By", "208": "\\cref{comp:patterns}, its evaluation error on a fixed tree is bounded by", "209": "$pM\\sum_{S\\ne\\varnothing}\\E|R_S-\\E R_S|$. Hence", "210": "\\eqref{comp:shape-error} makes its tree-averaged error tend to zero in the", "211": "ordered limits. For every fixed $M$, truncating the expansion after $q$", "212": "terms leaves an error at most", "213": "$\\sum_{k>q}c^k/k$ on either side, uniformly in $N,L$.", "214": "", "215": "Outside the count cutoff the original insertion logarithms, on both sides,", "216": "are bounded by $H+BK$. Their expected contribution is therefore at most", "217": "$2\\E[(H+BK)\\mathbf1_{\\{K>M\\}}]$, which tends to zero as $M\\to\\infty$.", "218": "This proves convergence of the expected insertion logarithms: explicitly,", "219": "first choose $M$ to control the Poisson tail, then $q$ to control the", "220": "geometric tail, and then take the limits in $N$ and $L$ for the finitely", "221": "many remaining expansion terms. Together with the trial identities above", "222": "and \\eqref{cavity:identity}, this proves \\eqref{comp:increment-comparison}.", "223": "\\end{proof}", "224": "", "225": "\\begin{corollary}\\label[corollary]{comp:bounded-lower}", "226": "For every bounded permutation-invariant interaction law and bounded field", "227": "law, with the functionals defined in \\cref{model:section},", "228": "\\[", "229": " \\liminf_{N\\to\\infty}F_N\\ge\\inf_{r\\ge0}\\Phi_r.", "230": "\\]", "231": "\\end{corollary}", "232": "", "233": "\\begin{proof}", "234": "Write $A=\\inf_{r\\ge0}\\Phi_r$, which is finite by", "235": "\\eqref{model:trial-bounds}. Each encoded trial value is at least $A$, so", "236": "\\eqref{comp:low-increments} gives, at every fixed $L$,", "237": "\\[", "238": " A\\le\\underline F+2\\eps+", "239": " \\limsup_{N\\to\\infty}", "240": " \\left|\\Delta_N^{L,\\mathbf u_{L,N}}", "241": "       -\\cB_{L-1}(\\zeta_{L,N},\\mathbf m^{(L)})\\right|.", "242": "\\]", "243": "The inner limit uses that depth's selected sequence. Letting $L\\to\\infty$", "244": "in \\cref{comp:insertion-comparison} gives", "245": "$A\\le\\underline F+2\\eps$, and then $\\eps\\downarrow0$ proves the result.", "246": "\\end{proof}"}, "reduction.tex": {"1": "\\section{Normalization, truncation, and completion of the proof}", "2": "\\label{reduction:section}", "3": "", "4": "The lower bound proved in \\cref{comp:bounded-lower} requires bounded", "5": "permutation-invariant interactions, whereas the upper bound uses the", "6": "factorization and positivity hypotheses. An integrable constant shift", "7": "and uniform approximation connect the two statements.", "8": "", "9": "\\begin{lemma}[Stability]\\label{reduction:stability}", "10": "Couple two interaction laws $\\theta,\\theta'$ and two field laws $h,h'$,", "11": "each satisfying \\eqref{model:integrability} for the fixed $p$ and $\\alpha$,", "12": "and put $D=\\E\\max_s|\\theta(s)-\\theta'(s)|$ and", "13": "$d=\\E|h-h'|$. Then", "14": "\\begin{align}", "15": " |F_N-F_N'|&\\le\\alpha D+d,\\label{reduction:free-stability}\\\\", "16": " |\\cB_r(\\zeta,\\mathbf m)-\\cB_r'(\\zeta,\\mathbf m)|", "17": " &\\le\\alpha(2p-1)D+d\\label{reduction:trial-stability}", "18": "\\end{align}", "19": "uniformly in $N,r$ and all trial laws, including $r=0$.", "20": "If $c$ is an integrable random constant associated with an interaction and", "21": "$\\widehat\\theta=\\theta-c$, then", "22": "\\begin{equation}\\label{reduction:shift}", "23": " \\widehat F_N=F_N-\\alpha\\E c,", "24": " \\qquad\\widehat{\\cB}_r=\\cB_r-\\alpha\\E c.", "25": "\\end{equation}", "26": "\\end{lemma}", "27": "", "28": "\\begin{proof}", "29": "Use the same counts and indices in the two Hamiltonians. Their pointwise", "30": "log-weight difference is bounded by the sum of the interaction sup-norm", "31": "differences and field differences. The logarithm of the partition function", "32": "preserves this bound, which gives \\eqref{reduction:free-stability}.", "33": "Each cavity interaction changes by at most the corresponding sup-norm", "34": "interaction difference, and so does each edge logarithm. The power means", "35": "preserve these root-measurable bounds. The site term has mean $\\alpha p$", "36": "interactions and the edge term has coefficient $\\alpha(p-1)$, giving", "37": "\\eqref{reduction:trial-stability}.", "38": "", "39": "For \\eqref{reduction:shift}, the physical constants factor out of the spin", "40": "partition function and of every power mean. In the functional, the site", "41": "term shifts by $-\\alpha p\\E c$ and the edge term contributes", "42": "$+\\alpha(p-1)\\E c$, for a net shift $-\\alpha\\E c$.", "43": "\\end{proof}", "44": "", "45": "\\begin{proof}[Proof of \\cref{main:theorem}]", "46": "The multiplier $a$ may depend asymmetrically on the labeled input functions,", "47": "so the original interaction law need not be permutation invariant.", "48": "We first remove this multiplier by an integrable scalar shift.", "49": "Set $c=\\theta(1,\\ldots,1)$ and $\\widehat\\theta=\\theta-c$. The", "50": "constant is integrable, since $|c|\\le B(\\theta)$. The factorization gives", "51": "\\[", "52": " \\widehat\\theta(s)=", "53": " \\log\\frac{1+b\\prod_{\\ell=1}^p f_\\ell(s_\\ell)}", "54": " {1+b\\prod_{\\ell=1}^p f_\\ell(1)}.", "55": "\\]", "56": "The multiplier $a$ has disappeared. Independence and identical distribution", "57": "of the $f_\\ell$, and their independence of $b$, show that the law of", "58": "$\\widehat\\theta$ is invariant under permutations of its inputs.", "59": "Moreover $\\E B(\\widehat\\theta)\\le2\\E B(\\theta)<\\infty$.", "60": "", "61": "For $K>0$, truncate each entry of $\\widehat\\theta$ to $[-K,K]$ and truncate", "62": "$h$ to $[-K,K]$, obtaining $\\widehat\\theta^{(K)},h^{(K)}$.", "63": "Permutation invariance is preserved. The bounded-law lower bound", "64": "\\cref{comp:bounded-lower} applies whether or not truncation preserves the", "65": "factorization. By dominated convergence,", "66": "\\[", "67": " D_K=\\E\\max_s|\\widehat\\theta(s)-\\widehat\\theta^{(K)}(s)|\\longrightarrow0,", "68": " \\qquad d_K=\\E|h-h^{(K)}|\\longrightarrow0.", "69": "\\]", "70": "Write $\\widehat I$ for the infimum of the normalized trial functional", "71": "over all depths and trial laws, and $I_K$ for the same infimum with", "72": "the truncated physical laws. The uniform trial estimate gives", "73": "\\[", "74": " |\\widehat I-I_K|\\le\\alpha(2p-1)D_K+d_K.", "75": "\\]", "76": "The pressure estimate and \\cref{comp:bounded-lower} now imply", "77": "\\[", "78": " \\liminf_N\\widehat F_N", "79": " \\ge I_K-\\alpha D_K-d_K", "80": " \\ge\\widehat I-2\\alpha pD_K-2d_K.", "81": "\\]", "82": "Letting $K\\to\\infty$ proves", "83": "$\\liminf_N\\widehat F_N\\ge\\widehat I=\\inf_r\\widehat\\Phi_r$.", "84": "Undoing the constant shift gives $\\liminf_NF_N\\ge\\inf_r\\Phi_r$.", "85": "Finally \\cref{upper:bound} gives $\\limsup_NF_N\\le\\inf_r\\Phi_r$.", "86": "Both limits agree, proving existence and \\eqref{main:formula}.", "87": "\\end{proof}"}, "consequences.tex": {"1": "\\section{Named models and the zero-temperature limit}", "2": "\\label{models:section}", "3": "", "4": "The standard examples of the factorization are the diluted spin models", "5": "and random satisfiability models of", "6": "Franz--Leone and Panchenko--Talagrand~\\cite{FL03,PT04}.", "7": "We retain the Poisson counts and sampling with replacement specified", "8": "in \\eqref{model:hamiltonian}.", "9": "", "10": "\\begin{corollary}[Viana--Bray and diluted even-spin models]", "11": "\\label[corollary]{models:spin}", "12": "Fix an even integer $p\\ge2$, $\\alpha>0$, and independent real random", "13": "variables $J,H$ such that $J$ has a symmetric distribution and", "14": "$\\E|J|+\\E|H|<\\infty$. For every $\\beta>0$, the model with", "15": "\\[", "16": " \\theta_\\beta(s_1,\\ldots,s_p)=\\beta J\\prod_{\\ell=1}^p s_\\ell,", "17": " \\qquad h_\\beta=\\beta H", "18": "\\]", "19": "satisfies the variational formula \\eqref{main:formula}, with the trial", "20": "functional evaluated at these interaction and field laws. In particular,", "21": "this holds for the Viana--Bray model~\\cite{VB85}, which is the case $p=2$.", "22": "\\end{corollary}", "23": "", "24": "\\begin{proof}", "25": "Use", "26": "\\[", "27": " a=\\cosh(\\beta J),\\qquad b=\\tanh(\\beta J),\\qquad f_\\ell(s)=s.", "28": "\\]", "29": "The functions $f_\\ell$ are deterministic independent copies, and", "30": "$|b|<1$ almost surely. Symmetry makes every odd moment
