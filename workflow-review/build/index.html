*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}button,select,textarea{font:inherit;color:inherit}button,select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 10px}button{cursor:pointer}button:hover,a.scale-link:hover{border-color:var(--accent);background:var(--soft)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent);text-underline-offset:3px}button[hidden],[hidden]{display:none!important}.app{height:100dvh;display:flex;flex-direction:column}header{padding:15px 24px 12px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.1em;font-weight:700}.brand a{text-decoration:none}.brand span{color:var(--muted);letter-spacing:0;margin-left:9px;font-weight:400}.brand .progress-link{letter-spacing:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:14px}h1{font-size:23px;letter-spacing:-.04em;margin:0;font-weight:700}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:2px}.case-label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:190px}.case-label select{font-size:13px}.heading h1{line-height:1.4}#breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:12px;font-size:12px}#breadcrumbs a{text-decoration:none}#breadcrumbs span.current{font-weight:600}#description{margin:7px 0 0;font-size:12px;color:var(--muted)}.toolbar{padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--paper)}.tools{display:flex;align-items:center;gap:6px}.tools button{font-size:12px}#zoom-level{font-size:11px;color:var(--muted);width:40px;text-align:center}.jump-label{font-size:12px;color:var(--muted)}#jump{max-width:230px;font-size:12px}.main{display:flex;flex:1;min-height:0}#viewport{position:relative;flex:1;min-width:0;overflow:hidden;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:20px 20px;touch-action:none;cursor:grab}#world{position:absolute;transform-origin:0 0}#edges,#nodes{position:absolute;top:0;left:0}#edges{overflow:visible;color:var(--line);pointer-events:none}.edge{fill:none;stroke:var(--line);stroke-width:2}.edge.note{stroke-dasharray:6 5}.edge.active{stroke:var(--accent)}.edge-label{fill:var(--muted);font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:5;stroke-linejoin:round}.node{position:absolute;width:238px;min-height:142px;text-align:left;padding:15px 16px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);box-shadow:var(--shadow)}.node .id{font:10px/1.5 ui-monospace,monospace;letter-spacing:.04em;color:var(--muted)}.node h2{font-size:15px;line-height:1.5;margin:7px 0 4px;font-weight:650}.node .summary{font-size:12px;color:var(--muted);display:block;margin-bottom:12px}.node .node-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}.badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--muted);display:inline-block}.badge.reported,.badge.mixed{color:var(--amber);background:var(--amber-bg)}.badge.not_done{color:var(--bad);background:var(--bad-bg)}.badge.specified{color:var(--accent);background:var(--soft)}.detail-mark{font-size:11px;color:var(--accent);font-weight:600}.node.selected{outline:3px solid var(--accent);outline-offset:4px}.node.dim{opacity:.36}.canvas-hint{position:absolute;bottom:14px;left:16px;padding:5px 9px;font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:6px;pointer-events:none}#panel{width:360px;flex-shrink:0;padding:24px;overflow-y:auto;background:var(--paper);border-left:1px solid var(--line)}#panel h2{font-size:20px;line-height:1.5;margin:8px 0 10px;letter-spacing:-.03em}#panel h3{font-size:12px;margin:24px 0 8px;color:var(--muted)}#panel p{font-size:13px;margin:8px 0}#panel .muted{color:var(--muted)}.callout{padding:12px 14px;background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:5px;font-size:12px;color:var(--amber);margin:16px 0}.scale-link{display:block;padding:12px 14px;border:1px solid var(--accent);border-radius:7px;text-decoration:none;margin-top:8px;font-size:13px;font-weight:600}.scale-link small{display:block;color:var(--muted);font-size:11px;font-weight:400}.node-ref{font:11px ui-monospace,monospace;color:var(--muted)}.panel-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.panel-actions button{font-size:12px}.evidence{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}.evidence a{font-size:12px}.evidence small{display:block;color:var(--muted);font-size:11px}.evidence summary{cursor:pointer;font-size:12px;margin-top:9px}.evidence pre{font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto}.io{display:grid;grid-template-columns:36px 1fr;gap:8px;font-size:12px}.io dt{color:var(--muted)}.io dd{margin:0}.neighbors{display:flex;flex-direction:column;gap:6px}.neighbors button{text-align:left;font-size:12px}.neighbors small{color:var(--muted);display:block}footer{padding:7px 24px;font-size:10px;display:flex;justify-content:space-between;gap:10px;color:var(--muted);border-top:1px solid var(--line);background:var(--paper)}#toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:8px;z-index:5;font-size:13px}dialog{max-width:520px;width:90vw;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0007}dialog h2{font-size:17px}dialog p{font-size:13px}textarea{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vert <script>const DATA={"schema":"workflow-review/0.1","version":"0.1.1","updated":"2026-11-17","title":"AI 업무 검토 지도","cases":[{"id":"creation-report","title":"제작 기록 검토","root":"creation","kind":"report","description":"제작자의 회고 기록 기반 · 원래 실행 로그 미연결"},{"id":"update-procedure","title":"갱신 절차 살펴보기","root":"update","kind":"specification","description":"운영 절차 기반 · 실제 수행 여부 확인 불가"}],"documents":{"procedure":{"path":"redesign/proofmap/checks/2026-11-16-thm-derivation-map/PROCEDURE.md","revision":"d9dad1a4a689540d165696a70f25037b65b1f727","text":"# 현재 운영 절차\n\n이 문서의 1–12절은 2026-11-16에 첫 지도를 만들던 당시의 기록이다. 당시에는 HTML 내부 JS와 Claude Artifact 게시를 사용했고, 아래 코드·게시 명령은 현재 저장소에 그대로 적용되지 않는다. **노드 질문을 받아 기존 지도를 고치고 GitHub Pages에 게시하는 작업은 [UPDATE-PROCEDURE.md](UPDATE-PROCEDURE.md)를 따른다.** 현재 자료는 `graphs/*.json`, 공통 보기 틀은 `viewer/decor-thm-template.html`, 검사와 빌드는 저장소 뿌리의 `make check`다.\n\n---\n\n# 유도 지도 만드는 절차\n\n`decor-thm-derivation.html` 을 만든 과정을 실제 순서대로 적는다. 각 단계에 **한 일**, **판단 규칙**, **이번에 나온 값**을 둔다. 다른 정리에 적용할 때는 12절의 점검표만 따라가도 된다.\n\n표기: **[규칙]** 다시 만들 때 지킬 것. **[이번 값]** 이 지도에서 나온 결과. **[시행착오]** 처음에 틀렸다가 고친 것.\n\n---\n\n## 1. 요청을 원문의 위치로 바꾼다\n\n\"7장\"은 논문의 §7이다. 절 번호는 `redesign/source/main.tex` 의 `\\input` 순서와 각 파일의 `\\section` 유무로 정한다.\n\n```bash\ngrep -n '\\\\input' redesign/source/main.tex\ngrep -n '\\\\section' redesign/source/sections/*.tex\n```\n\n**[이번 값]** `overview.tex` 에는 `\\section` 이 없다. 그래서 introduction §1, model §2, trees §3, upper §4, cavity §5, perturbations §6, **decorrelation §7** 이다. `redesign/HANDOFF.md` 의 \"수 5(§7)\"와도 맞는다.\n\n\"multioverlap의 깊이 평균 집중\"은 §7의 목표 정리다.\n\n```bash\ngrep -n 'begin{\\|label{\\|section' redesign/source/sections/decorrelation.tex\n```\n\n**[이번 값]** Theorem `decor:overlap-concentration` (63–76행)이다. 그 증명은 532–611행에 있다. 증명이 정리와 떨어진 곳에 있으므로 두 곳을 다 읽어야 한다.\n\n**[규칙]** 기존 증명 지도에 같은 정리가 있는지 먼저 본다. `graphs/move5.json` 의 `thm` 하위 graph에 이 증명이 18 node로 있었다. 그러나 모두 sketch였고 확대해 보는 보기가 아니었다. 이번에는 그 자료를 읽지 않고 **원문에서 새로 지었다.** move5의 node 이름과 대조는 하지 않았다.\n\n```bash\npython3 -c \"\nimport json;d=json.load(open('redesign/proofmap/graphs/move5.json'))\nfor g in d['graphs']: print(g['id'], g.get('title'), len(g.get('nodes',[])), len(g.get('edges',[])))\"\n```\n\n## 2. 원문을 읽는다\n\n읽은 범위와 목적이다. 정리 하나를 위해 §7 전체(623행)를 읽었다.\n\n| 파일:행 | 무엇 | 왜 |\n|---|---|---|\n| decorrelation.tex 1–84 | 절 첫머리, §7.1 깊이 평균, 정리 진술, 증명 개요 | 정리의 진술과 쓰이는 정의 |\n| decorrelation.tex 85–300 | §7.2 정의·Lemma 둘·사영 경계, §7.3 Proposition 첫 부분 | 정리 증명이 부르는 식 라벨의 출처 |\n| decorrelation.tex 490–525 | fiber 경계, 재귀 부등식, Proposition 결론 | 정리 증명이 `\\eqref{decor:fiber-bound}` 를 직접 부른다 |\n| decorrelation.tex 526–623 | §7.4 정리의 증명, Remark | 지도의 중심 |\n| perturbations.tex 440–465 | Theorem `pert:tree-identity` 진술 | 증명이 쓰는 항등식의 정확한 꼴 |\n| trees.tex 38–50 | 표본 규칙, `tree:multioverlap` | $R_S$ 의 정의 |\n| trees.tex 337–360 | Lemma `tree:reference-total`, $\\kappa(S)$ | marker 계수 $C(S,e)=-\\delta\\kappa(S)$ 의 $\\kappa$ |\n\n300–490행(Proposition 귀납 단계 본문)은 **읽지 않았다.** 정리 증명이 그 내부를 쓰지 않고 결론과 fiber 경계만 쓰기 때문이다. 그래서 그 부분은 node 하나(`P_IND`)로 줄였다. 이것이 이 지도의 가장 큰 생략이다.\n\n**[규칙]** 증명 본문의 `\\ref`·`\\eqref`·`\\cref` 를 모두 따라가 출처를 읽는다. 그리고 **`\\ref` 없이 쓰는 것**을 따로 찾는다. 예를 들어 \"spin-anchor identity\", \"product difference inequality\", \"variance decomposition\"은 라벨 없이 쓰인다. 앞의 둘은 각각 `pert:tree-identity`, `decor:one-vertex-shift` 주변 문장에서 왔다. 마지막 것은 기초 확률이라 node로 세우지 않고 걸음 안에 적었다.\n\n```bash\ngrep -n 'spin-anchor\\|product difference\\|martingale' redesign/source/sections/*.tex\ngrep -n 'kappa' redesign/source/sections/*.tex\n```\n\n## 3. 묶음(cluster)을 정한다\n\n**[규칙]** 묶음은 원문의 절 구조 그대로 둔다. 물리 해석으로 묶지 않는다(proofmap HANDOFF 5절 \"경계는 원문 구조로 자른다\"와 같은 원칙). 다른 절에서 받는 것은 \"밖에서 받는 것\" 하나로 모은다.\n\n**[이번 값]**\n\n| 묶음 키 | 이름 | 원문 |\n|---|---|---|\n| `ext` | 밖에서 받는 것 (§3·§6) | trees.tex, perturbations.tex |\n| `s71` | §7.1 깊이 평균 | 15–84 |\n| `s72` | §7.2 조건부 공분산과 깊이 연속성 | 85–231 |\n| `s73` | §7.3 Proposition | 232–525 |\n| `s74` | §7.4 정리의 증명 | 526–623 |\n| (없음) | 받는 곳 §8 | `OUT` 하나 |\n\n## 4. node를 고른다\n\n### 4.1 규칙\n\n1. **번호 붙은 진술과 라벨 붙은 식**이 기본 단위다. 정리, 보조정리, 명제, 정의식, 다른 곳에서 `\\eqref` 로 불리는 식이다.\n2. **정리의 증명은 걸음 단위로 쪼갠다.** 한 걸음은 \"새 대상을 도입하거나 새 부등식·등식 하나를 얻는 문장 묶음\"이다. 원문의 문단 경계와 라벨 식이 걸음의 경계와 대개 맞는다.\n3. 정리 증명이 **내부를 쓰지 않는** 긴 증명(여기서는 Proposition의 귀납)은 결론, 그리고 정리가 직접 부르는 중간 결과만 node로 세운다.\n4. 다른 절의 결과는 `ext` node로 세운다. 쓰이는 만큼만 진술을 옮긴다.\n5. 극한 순서 같은 주의 사항(Remark)은 `note` 종류로 세우고 점선으로 잇는다.\n6. 정리를 밖에서 받는 곳이 있으면 `OUT` 하나를 둔다. 원문 첫 문단이 밝힌 사용처(§8)다.\n\n### 4.2 정리 증명을 걸음으로 쪼갠 대응표\n\ndecorrelation.tex 533–611행을 문장 단위로 읽고 이렇게 나눴다.\n\n| node | 원문 행 | 원문의 핵심 문장 | 얻는 것 |\n|---|---|---|---|\n| `T_S` | 533–535 | \"For a singleton, use the spin-anchor identity with no added colors and $f=R_S$.\" | $\\mathbb ER_S^2=(\\mathbb ER_S)^2+o_N(1)$ |\n| `T_SET` | 537–545 | \"Suppose $S$ first splits at $e$ … add a full copy of $S$ … split from the anchor at $e-1$.\" | marker anchor 구성, $M=\\mathbb E[R_S\\mid\\mathscr F_{e-1}]$ |\n| `T_C` | 545–549 | \"The extension coefficient on both sides … is the same nonzero number\" | $C(S,e)=-\\delta\\kappa(S)$ |\n| `T_SIDES` | 550–561 | \"The target and old copies are conditionally independent … anchor-alone side …\" | $C(S,e)\\mathrm{Var}(M)=o_N(1)$ |\n| `T_VM` | 562–569 | \"Division by $C(S,e)$ is made only at fixed $L$\" | $\\mathrm{Var}(M)\\to0$ |\n| `T_G` | 571–581 | \"Set $G=\\ldots$, $G_-=\\ldots$. By (projection-bound) …\" | $\\mathbb E(R_S-G)^2\\le p_N^2$ |\n| `T_ADJ` | 582–590 | \"the product difference inequality and (martingale-energy) imply\" | $\\mathcal A\\,\\mathbb E(G-G_-)^2\\le C_k/L$ |\n| `T_L2` | 591–596 | \"Since conditional expectation is the optimal $L^2$ projection\" | $\\mathbb E(R_S-M)^2\\le2p_N^2+2\\mathbb E(G-G_-)^2$ |\n| `T_FIB` | 604–609 | \"we used $p_N^2\\le s\\sum_j v_N^{1/2}$ and (fiber-bound) with $\\gamma=1/2$\" | $\\limsup_N\\mathcal A\\,p_N^2\\le C\\,V_{k-1,L}(\\eta/2)^{1/2}$ |\n| `T_VAR` | 597–603 | \"Variance decomposition and (prefix-projection-concentration) now show\" | 분산 추정 (variance-estimate) |\n| `THM` | 63–76, 609–611 | \"Proposition … finishes the proof.\" | 정리 |\n| `REM` | 613–623 | Remark order-of-limits | 극한 순서 |\n\n**[규칙]** 원문은 `T_FIB` 의 내용을 `T_VAR` 식 **뒤에** \"In this estimate we used …\"로 적는다. 지도에서는 의존 순서대로 `T_FIB → T_VAR` 로 앞에 둔다. 원문 순서와 의존 순서가 다를 때는 의존 순서를 따르고, node의 원문 행으로 원래 자리를 남긴다.\n\n**[규칙]** `T_VAR` 에는 원문이 한 줄로 넘긴 걸음을 풀어 적었다. 분산 분해 $\\mathrm{Var}(R_S)=\\mathrm{Var}(M)+\\mathbb E(R_S-M)^2$ 가 그것이다. 또 첫 항의 깊이 평균이 $\\limsup_N$ 에서 사라지는 이유도 적었다. 고정 $L$ 에서 배정이 유한개라는 것이고, 원문 48–58행이 근거다. 그래서 `A_ERR → T_VAR` edge를 두었다.\n\n### 4.3 §7.1–§7.3과 밖의 node\n\n전체 목록과 원문 행은 `NODES.md` 에 있다. 고른 이유만 적는다.\n\n- §7.1: 정의(`A_DEF`), Hölder(`A_HOL`), 두 비교(`A_CMP`), 항등식 오차의 유한 최대(`A_ERR`). 정리 증명과 Proposition이 모두 쓴다.\n- §7.2: 정의(`B_DEF`), Lemma 둘(`B_CON`, `B_DC`), `B_DC` 증명 안의 식 `decor:martingale-energy`(`B_ME`), 사영 경계(`B_PB`). `B_ME` 를 Lemma에서 떼어 따로 세운 것은 정리 증명(`T_ADJ`)이 이 식을 직접 부르기 때문이다.\n- §7.3: `P_V`(귀납 양의 정의), `P_1`(기저), `P_IND`(귀납 단계 전체를 한 node로), `P_FB`(fiber 경계; 정리가 직접 부름), `P_REC`(재귀식), `PROP`.\n- 밖: `X_TI`, `X_EXT`, `X_RT`, `X_CH`, `X_SAMP`, `X_MO`. `X_CH` 는 Proposition만 쓴다.\n\n## 5. edge를 고르고 내용을 단다\n\n### 5.1 규칙\n\n1. edge는 \"보낸 node의 결과 가운데 받는 node가 실제로 쓰는 것\"이다. 라벨에는 **싣는 내용**을 적는다. 식 하나이거나 짧은 말이다.\n2. 종류 셋:\n   - `key`: 정리 증명(§7.4) 안의 사슬과 정리로 들어가는 선. 청록 굵은 선. 라벨이 늘 보인다.\n   - 입력(종류 칸 비움): 정의나 보조 결과를 넘기는 선. 회색 선. 라벨은 선택했을 때만 보인다.\n   - `note`: 주의 사항. 점선.\n3. 정의만 넘기는 선도 단다(예: `B_DEF → T_G` \"$\\mu_{e,T_j}$\"). 선택했을 때 \"이 결과에 쓰인 것\"이 빠짐없이 밝아지게 하려는 것이다.\n4. 모든 edge는 왼쪽 열에서 오른쪽 열로 간다(6절). 거꾸로 가면 의존 순서가 틀린 것이다.\n\n### 5.2 정리 증명 쪽 edge를 찾은 방법\n\n각 걸음 node에 대해 원문 문장이 **무엇을 받아 쓰는지**를 세 가지로 찾았다.\n\n- `\\eqref`·`\\cref` 로 부르는 것. 예: `B_PB → T_G`, `P_FB → T_FIB`, `B_ME → T_ADJ`.\n- 이름으로 부르는 것. 예: \"spin-anchor identity\"는 `X_TI → T_S`, \"product difference inequality\"는 `B_ME → T_ADJ` 의 라벨에 포함했다.\n- 앞 걸음에서 정의한 대상. 예: $M$ 은 `T_SET → T_L2`, $G, G_-$ 는 `T_G → T_ADJ`.\n\n### 5.3 전체 목록\n\n`NODES.md` 의 edge 표(61개)에 있다.\n\n### 5.4 원문에 없는 보충\n\n**[이번 값]** 원문 545행은 $C(S,e)$ 가 \"nonzero\"라고만 한다. 지도의 `T_C` 에는 작성자 확인을 경고색(`class=\"warn\"`)으로 붙였다. $\\kappa(S)$ 의 각 인수가 $m_d-j\\,m_{d+1}=(d-j(d+1))/L\u003c0$ ($j\\ge1$) 이라 0이 아니라는 것이다. proofmap HANDOFF 4절 \"알려진 어긋남 6\"이 지적한 빈 곳이다.\n\n**[규칙]** 원문 밖에서 채운 것은 반드시 표시한다. 표시는 패널 본문의 `\u003cp class=\"warn\">` 이다.\n\n## 6. 자료를 HTML에 쓴다\n\n자료는 HTML 파일의 `\u003cscript>` 안에 있는 JS 배열 셋과 객체 하나다. 별도 JSON은 없다.\n\n```js\nconst R=String.raw;                 // TeX 백슬래시를 그대로 두기 위함 (6.2)\nconst GROUPS={ key:{label, fill:'--css변수', b:'--테두리변수'} , ... };\nconst N=[ {id, g, cls, tag, t, f, body, src}, ... ];\nconst E=[ [보냄id, 받음id, 라벨, 종류], ... ];\nconst POS={ id:[띠, 열], ... };\n```\n\n| 칸 | 뜻 | 예 |\n|---|---|---|\n| `id` | 짧은 고유 이름. 접두어는 묶음(`X_`, `A_`, `B_`, `P_`, `T_`) | `T_SIDES` |\n| `g` | 묶음 키. 없으면 `null` | `s74` |\n| `cls` | `ext` 밖 / `key` 주된 사슬 / `goal` 목표 / `note` 주석 / 없음 | `key` |\n| `tag` | 원문의 라벨이나 걸음 번호. node 위쪽 작은 글씨 | `eq decor:marker-variance-identity` |\n| `t` | 제목. TeX 가능 | `항등식의 두 쪽` |\n| `f` | 대표식. node에 보이는 것. 길면 `\u003cbr>` 로 나눈다 | `$C(S,e)\\,\\mathrm{Var}(M)=o_N(1)$` |\n| `body` | 패널에만 보이는 설명(HTML) | |\n| `src` | 원문 파일과 행 | `decorrelation.tex 550–561` |\n| E의 라벨 | 선이 싣는 내용. 빈 문자열이면 라벨 없음 | `$C\\,\\mathrm{Var}(M)=o_N(1)$` |\n| E의 종류 | `key` / `note` / 생략(입력) | |\n| `POS` | `[띠, 열]`. 띠 0 = 위, 1 = 아래, 2 = 세로 가운데(밖 node) | `[1,6]` |\n\n### 6.1 node 문안 규칙\n\n- 제목은 그 걸음이 하는 일을 한국어 명사구로 쓴다. 대표식은 그 걸음이 **얻는 식** 하나다.\n- 대표식이 node 폭(최대 340px)을 넘으면 `\u003cbr>` 로 줄을 나누고, 이어지는 줄은 `$\\quad\\le\\ldots$` 처럼 들여 쓴다.\n- 원문 용어(anchor, prefix, fresh, extension, multioverlap)는 영어 그대로 둔다. 프로젝트 문서들과 같은 관례다.\n- 원문이 증명하지 않은 동일시(RPC, ultrametricity 등)는 쓰지 않는다(프로젝트 원칙).\n\n### 6.2 [시행착오] TeX 백슬래시\n\n`t:'기저: $V_{1,L}(\\eta)\\le\\delta/\\eta$'` 처럼 **작은따옴표 문자열**에 TeX를 쓰면 JS가 `\\e`, `\\l`, `\\d` 를 이스케이프로 처리해 백슬래시가 사라진다. `\\t`, `\\b`, `\\f`, `\\v` 는 제어문자가 된다. 화면에는 \"(eta)ledelta\"처럼 나온다. 처음 판에서 제목 넷이 이렇게 깨졌다.\n\n같은 일이 패널의 템플릿 문자열에서도 났다. `` `…$N\\to\\infty$…` `` 의 `\\t` 가 탭이 되어 \"Noinfty\"로 보였다.\n\n**[규칙]** TeX가 들어가는 문자열은 모두 ``R`…` `` 로 쓴다. 보간(`${}`)이 있는 템플릿에도 ``R`…${x}…` `` 를 쓸 수 있다. `check_graph.cjs` 가 이 사고를 오류로 잡는다(7절).\n\n## 7. 배치\n\n### 7.1 [시행착오] 자동 배치(dagre)를 버린 이유\n\n처음에는 dagre 0.8.5의 compound graph(묶음을 부모 node로)로 위→아래 배치를 했다. 결과는 5820×1830px였다. 밖 node 여섯이 모든 묶음으로 선을 뻗어 묶음들이 가로로 흩어졌고, 전체 보기에서 16%로 줄어 읽을 수 없었다. 묶음 상자도 겹쳤다.\n\n**[규칙]** node가 수십 개이고 묶음이 원문 절 순서를 따르면 **손으로 정한 격자 배치**가 낫다. 자리는 `POS` 에 `[띠, 열]` 로만 주고, 픽셀 좌표는 잰 크기로 계산한다.\n\n### 7.2 격자 설계\n\n왼쪽에서 오른쪽으로 흐른다. 띠 둘을 위아래로 둔다.\n\n```\n열:     0        1–3                 4–7                         8–10\n띠 0:   (밖)     §7.1 깊이 평균       §7.3 Proposition\n띠 1:            §7.2 공분산·연속성    §7.4 정리의 증명 ─────────→ THM → OUT\n띠 2:   밖 node 여섯을 세로 가운데에\n```\n\n**[이번 값]** `POS` 전체:\n\n```\nX_*:[2,0]\nA_DEF,A_ERR:[0,1]   A_HOL,A_CMP:[0,2]\nB_DEF:[1,1]   B_CON,B_ME:[1,2]   B_PB,B_DC:[1,3]\nP_V,P_1:[0,4]   P_IND,P_FB:[0,5]   P_REC:[0,6]   PROP:[0,7]\nT_SET,T_S:[1,4]   T_C,T_G:[1,5]   T_SIDES,T_ADJ,T_L2:[1,6]   T_VM,T_FIB:[1,7]   T_VAR,REM:[1,8]\nTHM:[1,9]   OUT:[1,10]\n```\n\n**[규칙]** 열 번호는 의존의 **가장 긴 경로 깊이**와 대략 맞춘다. 정확한 위상 순서일 필요는 없지만, 모든 edge가 열이 커지는 방향이어야 한다(`check_graph.cjs` 4번 검사). 같은 칸(띠·열)에 여러 node를 두면 `N` 배열의 순서대로 위에서 아래로 쌓인다. 그래서 `N` 의 순서도 배치의 일부다.\n\n### 7.3 좌표 계산 (`layout()`)\n\n1. MathJax가 수식을 그린 **뒤에** 각 node의 `offsetWidth`·`offsetHeight` 를 잰다. 그 전에 재면 TeX 원문 길이로 재서 틀린다.\n2. 열 폭 = 그 열의 모든 node 폭의 최대. 열의 x = 앞 열들의 폭 + `COLGAP`(170px)의 누적. 바깥 여백 `M` 은 60px다.\n3. 칸 높이 = 쌓인 node 높이의 합 + `ROWGAP`(26px) 간격. 띠 높이 = 그 띠 칸 높이의 최대. 띠 1은 띠 0 아래 `BANDGAP`(90px)에서 시작한다.\n4. node는 칸 안에서 가로 가운데, 칸 묶음은 띠 안에서 세로 가운데에 둔다. 띠 2(밖 node)는 전체 높이의 세로 가운데다.\n5. 묶음 상자 = 그 묶음 node들의 외접 사각형 + 여백 18px(위쪽은 이름표 자리로 8px 더).\n6. **선의 끝점 나누기:** 한 node에서 나가는 선들을 받는 node의 y 순서로 정렬한다. 그리고 node 오른쪽 변의 높이 20%–80% 구간에 고르게 나눠 붙인다. 들어오는 선도 왼쪽 변에서 같은 방식으로 나눈다. 선 다발이 한 점에 몰리는 것을 막는다.\n7. **선 모양:** 3차 Bézier `M x1,y1 C x1+dx,y1 x2-dx,y2 x2,y2`, `dx = max(50, (x2-x1)/2)`. 화살촉은 SVG `marker`.\n8. **라벨 위치:** [시행착오] 처음에는 선 길이의 50% 지점(긴 선은 82%)에 두었다. 그러자 긴 선의 라벨이 중간 열의 node 위에 얹혔다. **받는 node 바로 앞 빈 열의 가운데**(x = 받는 node 왼쪽 − `COLGAP`/2)에 놓는 것으로 바꿨다. 그 x에 해당하는 선 위의 점은 `getPointAtLength` 를 이분법으로 24번 돌려 찾는다. 라벨 최대 폭은 150px로 열 간격 170px 안에 들어가게 했다.\n\n**[이번 값]** 전체 크기 5041×836px.\n\n## 8. 보기 기능\n\n전부 HTML 안의 손으로 쓴 JS다. 쓰는 외부 자원은 MathJax 3.2.2(`tex-svg.js`, cdnjs)와 Google Fonts뿐이다. MathJax는 SVG 출력을 쓴다. 이유는 둘이다. 글꼴 파일을 따로 받지 않으므로 게시 환경의 CSP(cdnjs의 글꼴·CSS 차단)에 걸리지 않고, 확대해도 수식이 흐려지지 않는다. KaTeX는 CSS와 글꼴을 cdnjs에서 받아야 해서 쓰지 않았다.\n\n| 기능 | 구현 |\n|---|---|\n| 확대·이동 | `#world` 에 `transform: translate(x,y) scale(k)`, `transform-origin:0 0`. 휠은 커서 위치를 고정하고 확대한다(Shift+휠은 이동). 한 손가락·마우스로 끌면 이동, 두 손가락이면 확대와 중심 이동. 배율 범위는 0.12–4 |\n| 버튼과 키 | ＋/－(1.3배), 전체 보기(`fitRect` 로 전체를 화면에), 정리의 증명으로(§7.4 묶음 상자에 맞춤), 선택 해제. 키: `+` `-` `0` 방향키 `Esc` |\n| 모눈 배경 | `#viewport` 의 `background-size`·`background-position` 을 확대·이동과 같이 바꾼다 |\n| 선택 | node를 누르면(움직임 6px 미만) 그 node의 **조상 전체**를 거꾸로 BFS로 구해 밝히고 나머지를 흐리게 한다. 조상 사이의 선과 라벨만 남는다. 입력 선의 라벨은 이때만 보인다 |\n| 두 번 누르기 | 350ms 안에 같은 node를 다시 누르면 그 node로 확대(최대 2.2배) |\n| 패널 | 진술, 설명, 원문 행, 받는 것·보내는 것 목록. 목록 항목을 누르면 그 node를 선택하고 확대한다. 패널을 채운 뒤 `MathJax.typesetPromise([panel])` |\n| 시작 순서 | node·라벨 DOM 생성 → MathJax 조판과 글꼴 준비를 기다림(최대 9초) → `layout()` → 패널 그리기 → 다음 프레임에 전체 보기 |\n| 화면 폭 | 760px 이하에서 패널을 아래로 내리고(높이 최대 42%) 설명 줄과 안내를 숨긴다 |\n| 테마 | 색은 모두 `:root` 변수. 다크는 `prefers-color-scheme` 과 `data-theme=\"dark\"` 두 곳에 같은 값 |\n\n**[시행착오]** 셋이 있었다.\n- `#loading{display:flex}` 가 `hidden` 속성을 이겨서 로딩 문구가 사라지지 않았다. `#loading[hidden]{display:none}` 을 더했다.\n- 전체 보기를 패널보다 먼저 계산하자 휴대폰 폭에서 지도가 화면 아래로 치우쳤다. 패널이 들어오며 보이는 영역의 높이가 바뀌기 때문이다. 패널을 먼저 그리고 `requestAnimationFrame` 안에서 맞췄다.\n- 휠 처리기에 트랙패드 구분 조건을 섞었다가 판정이 꼬였다. \"휠은 확대, Shift는 이동\"으로 단순하게 했다.\n\n## 9. 검사\n\n### 9.1 구조 검사\n\n```bash\nnode redesign/proofmap/checks/2026-11-16-thm-derivation-map/tools/check_graph.cjs redesign/proofmap/build/decor-thm-derivation.html\n```\n\n검사 항목:\n1. id 중복\n2. 필수 칸(`tag`, `t`, `f`, `src`)과 묶음 키\n3. `POS` 누락과 남는 `POS`\n4. edge 양끝 node의 존재\n5. 모든 edge가 열이 커지는 방향인지\n6. 순환\n7. THM에 닿지 않는 node(경고)\n8. TeX 백슬래시 사고: 제어문자, 또는 `$…$` 안에서 백슬래시 없이 남은 `eta`, `le`, `delta`, `mathbb` 등\n9. `$` 짝\n\n**[이번 값]** 오류 0. node 34, edge 61, key 18, THM의 조상 32.\n\n결함을 일부러 넣어 검사가 잡는지 확인했다(사본 4개).\n\n| 넣은 결함 | 결과 |\n|---|---|\n| 제목 하나를 작은따옴표 문자열로 (`\\eta` 사라짐) | 오류 1 (\"백슬래시 빠진 TeX 의심\"). 처음에는 경고였는데, 놓치기 쉬워서 오류로 올렸다 |\n| edge 끝을 없는 id로 | 오류 + 연쇄 경고 |\n| `OUT → T_VAR` 역방향 edge | \"열이 오른쪽으로 가지 않음\" + \"순환\" 오류 2 |\n| `POS` 에서 THM 삭제 | 오류 1 |\n\n### 9.2 화면 검사\n\n```bash\nnode .../tools/render_check.cjs \u003c지도.html> \u003c출력폴더> \u003ctex-svg.js 경로>\n```\n\n이 스크립트가 하는 일:\n1. 게시 전 파일에는 `\u003c!doctype>`·`\u003cbody>` 가 없다. 게시 때 껍데기가 씌워지기 때문이다. 그래서 껍데기와 `[hidden]` 규칙을 씌운 사본을 만든다.\n2. 이 작업 환경에서는 cdnjs 접속이 막혀 있었다(프록시가 거부). 그래서 같은 판의 MathJax를 npm(`mathjax@3.2.2`)으로 받아 두고, Playwright `route` 로 cdnjs 요청에 그 파일을 넣는다. 글꼴 요청은 끊고 대체 글꼴로 본다.\n3. 1440×900 라이트·다크, 400×800 휴대폰에서 로딩이 끝나기를 기다린다. 그다음 MathJax 수식 수, 지도 크기, node 수, 가로 넘침, 콘솔·페이지 오류를 출력하고 스크린샷을 남긴다.\n4. 데스크톱에서는 \"정리의 증명으로\", §7.4 왼쪽 절반과 오른쪽 절반을 100%로 확대한 화면, THM 선택 화면도 찍는다.\n\n**[이번 값]** 세 경우 모두 오류 없음, node 34, 수식 96개, 가로 넘침 없음. 스크린샷은 사람이 눈으로 봤다. 라벨과 node 겹침, 깨진 TeX, 휴대폰 배치를 이 스크린샷으로 찾아 고쳤다(6.2, 7.3의 8, 8의 시행착오).\n\n**[하지 않은 것]** 게시된 claude.ai 페이지를 열어 보지 않았다. 실제 글꼴(IBM Plex Sans KR, Noto Serif KR)로 그린 화면도 보지 않았다. 내용의 독립 검토도 하지 않았다.\n\n## 10. 게시와 저장\n\n### 10.1 게시\n\nclaude.ai Artifact로 게시했다(파일 경로 `redesign/proofmap/build/decor-thm-derivation.html`, 아이콘 `graph`). 같은 파일 경로로 다시 게시하면 같은 주소가 갱신된다. 다른 대화에서 갱신할 때는 주소를 `url` 로 준다. 게시본은 비공개이고, 공유는 페이지의 Share 메뉴에서 한다.\n\n이 파일은 게시 규약을 따른다. 맨 앞에 `\u003ctitle>` 과 `\u003cstyle>` 이 오고 `\u003c!doctype>`·`\u003chtml>`·`\u003cbody>` 는 없다. 그래서 로컬에서 직접 열면 quirks 모드가 된다. 로컬 확인은 9.2처럼 감싼 사본으로 한다.\n\n### 10.2 proofmap 규격과의 관계\n\n이 지도는 `SPEC.md` 의 proofmap/0.1 JSON을 쓰지 않는다. `tools/build_viewer.py` 로 만든 것도 아니다. 자료(`N`, `E`, `POS`)가 HTML 안에 있다. proofmap 자료로 옮기려면 다음이 필요하다.\n- `N` 의 각 node를 그 규격의 node로 옮긴다. `src` 는 원문 참조로 간다.\n- `E` 의 라벨을 edge의 \"싣는 항목\"으로 옮긴다.\n- move5 `thm` 하위 graph와 대응을 맞춘다.\n\n하지 않았다.\n\n### 10.3 커밋\n\n`git add` → 커밋 → `git push -u origin \u003c브랜치>`. 처음 커밋은 `9695be6` 이다.\n\n## 11. 다시 만드는 순서 요약\n\n1. 원문 위치 찾기 (1절)\n2. 원문 읽기 (2절의 표)\n3. 묶음 → node → edge (3–5절). 정리 증명의 걸음 대응표(4.2)를 먼저 쓰면 나머지가 빨라진다.\n4. HTML 자료 작성 (6절). 이 파일을 복사해 `GROUPS`·`N`·`E`·`POS` 와 머리 문구만 바꾸면 된다. 배치·보기 코드는 그대로 쓸 수 있다.\n5. `check_graph.cjs` → 오류 0\n6. `render_check.cjs` → 스크린샷을 보고 겹침·깨짐을 고침. 보통 `POS` 조정, 대표식 줄 나누기, 라벨 줄이기로 해결된다.\n7. `dump_table.cjs` 로 표 갱신, 게시, 커밋\n\n## 12. 다른 정리에 적용하는 점검표\n\n- [ ] 목표 정리의 라벨, 진술 행, 증명 행을 찾았다(증명이 진술과 떨어져 있을 수 있다)\n- [ ] 증명 본문의 모든 `\\ref`·`\\eqref`·`\\cref` 를 따라가 출처를 읽었다\n- [ ] `\\ref` 없이 이름으로 부르는 결과(\"… identity\", \"… inequality\")를 grep으로 찾았다\n- [ ] 묶음을 원문 절 구조로 정했다\n- [ ] 정리 증명을 걸음으로 나눈 대응표(node, 원문 행, 핵심 문장, 얻는 것)를 썼다\n- [ ] 내부를 쓰지 않는 긴 증명은 결론과 직접 불리는 중간 결과만 세웠다. 이 생략을 문서에 적었다\n- [ ] 원문 밖에서 채운 걸음은 `warn` 으로 표시했다\n- [ ] TeX 문자열은 모두 ``R`…` `` 다\n- [ ] 모든 edge가 왼쪽 열 → 오른쪽 열이다\n- [ ] `check_graph.cjs \u003chtml> \u003c목표 id>` 오류 0\n- [ ] `render_check.cjs` 세 화면에서 오류 없음, 스크린샷을 눈으로 봤다\n- [ ] `NODES.md` 를 다시 만들었다\n- [ ] 독립 검토를 받았는지, 받지 않았는지 적었다\n","title":"PROCEDURE.md"},"update":{"path":"redesign/proofmap/checks/2026-11-16-thm-derivation-map/UPDATE-PROCEDURE.md","revision":"d9dad1a4a689540d165696a70f25037b65b1f727","text":"# 노드 질문을 유도 지도와 웹페이지에 반영하는 절차\n\n이 문서는 **이미 있는 지도**의 노드에 대해 “왜?”, “더 자세히”, “선이 잘못됐다”라는 질문을 받았을 때 쓰는 작업 순서다. 처음부터 정리 전체의 지도를 만드는 방법과 당시의 선택은 [PROCEDURE.md](PROCEDURE.md)에 남겨 두었다. 작업의 짧은 입구와 내용 규칙은 [../../AGENTS.md](../../AGENTS.md)가 기준이다. 이 문서는 그 규칙을 실제 명령과 검토 순서로 펼친 것이다.\n\n현재 범위는 §7 정리의 상위 지도 `decor-thm`과 세부 지도 `b-con`, `b-dc`다. 원본 자료는 `redesign/proofmap/graphs/*.json`, 공통 화면 코드는 `viewer/decor-thm-template.html`, 생성물은 `build/*-derivation.html`이다. 아래 경로와 명령은 **저장소 뿌리**에서 실행한다. 수학적 해석은 사용자가 확정하며, 지도 변경은 proposed 상태다.\n\n## 0. 작업 준비와 범위 확정\n\n1. 대상 브랜치와 기존 수정 사항을 확인한다. 다른 브랜치에서 작업 중이면 해당 작업을 덮지 않는다.\n\n   ```bash\n   git fetch origin\n   git switch ccr-9aa9b310-d8u9tb\n   git pull --ff-only origin ccr-9aa9b310-d8u9tb\n   git status --short\n   cat redesign/proofmap/AGENTS.md\n   ```\n\n   Git 작업 공간이 없는 환경에서는 연결된 GitHub 도구로 **같은 브랜치**의 파일과 최신 head를 읽고 변경한다. 현재 checkout이 저장소인지 확인하지 않고 다른 브랜치로 push하지 않는다.\n\n2. 질문을 유형으로 분류한다. “왜 그런가?”는 먼저 근거를 읽어 수학적으로 답한다. 원문의 한두 문장을 풀어 주는 정도면 노드의 `body`를 보강한다. 독립적인 추론 걸음이 둘 이상이면 세부 그래프를 만든다. edge 지적은 양끝 노드와 원문을 대조한다. **대화로만 답해 달라는 요청이면 저장소를 바꾸지 않는다.**\n3. 설명의 목표를 문장으로 적는다. 예: “B_DC에서 갈라짐 깊이를 한 칸 늦출 때 왜 평균 제곱 오차가 `C/L`인가?” 이렇게 하면 다른 정리의 물리 해석으로 범위가 번지지 않는다.\n\n## 1. 노드, 이웃, 원문을 찾는다\n\n노드 ID를 알면 한 번에 현재 진술·설명·받고 보내는 edge·원문 행을 출력한다.\n\n```bash\nnode redesign/proofmap/tools/show_node.cjs B_DC\nnode redesign/proofmap/tools/show_node.cjs B_DC/DC_ONE\n```\n\nID를 모르면 화면의 node 또는 선택 패널에서 ID를 보고 **참조 복사**를 누른다. 제목이나 원문 라벨만 있으면 `NODES.md`에서 찾는다.\n\n```bash\nrg -n 'depth-continuity|깊이에 대한 평균 연속성' redesign/proofmap/checks/2026-11-16-thm-derivation-map/NODES.md\n```\n\n1. 출력의 **진술**을 질문과 대조한다. 같은 이름의 다른 식이나 부모/세부 노드를 혼동하지 않는다.\n2. **받는 edge**의 선행 결과를 필요한 것만 조회한다. B_DC라면 B_ME의 martingale energy, A_CMP의 regularity 이동, X_SAMP의 prefix 주변법칙을 확인한다. **보내는 edge**를 보면 이 결과를 다음 단계가 어떤 형태로 쓰는지 알 수 있다.\n3. `src`의 원문 행을 읽는다. 조회 도구는 긴 범위를 최대 80행까지만 보여 주므로 생략된 부분은 해당 구간만 연다. 원문 증명이 다른 식을 `\\eqref`, `\\cref`, 이름으로 부르면 그 결과의 진술과 필요한 증명까지 따라간다.\n\n   ```bash\n   nl -ba redesign/source/sections/decorrelation.tex | sed -n '168,206p'\n   rg -n 'label\\{decor:martingale-energy\\}|product difference|one-vertex-shift' redesign/source/sections/*.tex\n   ```\n\n4. 원문의 **대상과 조건**을 적는다. 무엇을 고정하고(`T_j`의 나중 깊이 등), 무엇을 평균하는지(`q`, `d`, 다른 깊이), 두 양이 같은 prefix/path에서 결합되는지, 상수의 의존 대상, `N\\to\\infty`와 `L\\to\\infty`의 순서를 구별한다. 원문이 한 줄로 넘긴 부등식은 실제로 전개해 확인한다.\n5. 원문에 없는 새 주장을 써야 한다면 그 사실을 분리한다. 근거 없는 물리적 동일시를 증명의 edge처럼 추가하지 않는다.\n\n처음부터 긴 HANDOFF, 카드 전체, 큰 graph 파일을 읽을 필요가 없다. 조회 출력에서 빠진 **특정** 정의나 원문 행이 있을 때만 읽는 범위를 넓힌다.\n\n## 2. 유도를 먼저 검산하고 node 경계를 정한다\n\n수정 전에 아래 네 칸을 메모하거나 초안에 적는다. 그래프를 그리는 순서보다 이 검산이 먼저다.\n\n| 칸 | 확인할 것 | B_DC의 예 |\n|---|---|---|\n| 입력 | 정확히 쓰는 선행 결과 | `B_ME`의 제곱 증분 합, 자식 평균의 곱 표현 |\n| 변환 | 각 등식·부등식의 이유 | 조건부 Jensen, 곱 차이, 제곱합 |\n| 출력 | 이 걸음에서 처음 얻는 결과 | 한 vertex 이동의 제곱 오차, 깊이 평균 `C/L` |\n| 조건 | 같은 표본, regularity, 평균 좌표 | 같은 한 단계 continuation, `\\eta/2` 영역 |\n\n한 노드의 `body`에 한두 문장을 더하면 끝나는 경우에는 기존 ID를 유지한다. 새 식·대상·부등식이 각각 다음 걸음의 입력이 되는 경우에는 세부 지도에서 **한 결과당 한 node**로 나눈다. B_DC에서는 `DC_ME → DC_EVAL`과 `DC_PROD → DC_ONE → DC_SUM → DC_ALL`을 분리했다. 원문 순서와 의존 순서가 다르면 edge는 의존 순서대로 놓고 각 node의 `src`에 원래 행을 남긴다.\n\n각 edge의 라벨은 “증명에 필요함” 같은 설명 대신 **전달하는 내용**을 짧게 적는다. 원문에 있는 증명과 원문 밖에서 채운 걸음을 구별한다. 후자는 해당 node에 `\"supplement\": true`와 `\u003cp class=\"warn\">작성자 보충: …\u003c/p>`를 함께 둔다. 근거가 부족하면 단정하는 node를 만들지 말고 막힌 지점을 답변에 남긴다.\n\n## 3. JSON만 편집한다\n\n상위 지도 노드의 진술·설명·edge는 `graphs/decor-thm.json`에서 고친다. 기존 세부 노드는 해당 `graphs/b-con.json` 또는 `graphs/b-dc.json`에서 고친다. `build/*.html`의 데이터나 보기 코드를 손으로 수정하지 않는다.\n\n### 3.1 짧은 설명\n\n`body`는 패널의 HTML이며 `f`는 지도 카드의 대표식이다. 원문에서 무엇을 고정하고 어떤 연산으로 결론이 나는지 서술하고, `src`를 실제 원문 행으로 좁힌다. 진술 자체가 달라진 경우에만 `f`도 바꾼다. JSON에서 TeX의 백슬래시는 두 개로 적는다. 예: `\"$\\\\mathbb E\\\\|D_t\\\\|_N^2$\"`.\n\nHTML 문자열 속에는 원시 `\u003c`를 쓰지 않는다. 예를 들어 `$s\u003ct$`를 `body`에 넣으면 브라우저가 그 뒤를 태그로 해석해 문단이 사라질 수 있다. `$s\\\\lt t$` 또는 `$s&lt;t$`로 적고 공개 페이지에서 확인한다. 따옴표와 `$…$` 짝도 점검한다.\n\n### 3.2 세부 지도 추가\n\n1. `graphs/b-dc.json`처럼 새 JSON을 만든다. `meta.title`, `meta.description`, `meta.parent={label,href}`, `groups`, `nodes`, `edges`, `positions`, `subgraphs`를 둔다. 세부 node에는 고유 ID, `tag`, `t`, `f`, `body`, `src`, `g`, `col`을 적는다. `positions`는 `[띠, 열]`이고 edge는 **작은 열에서 큰 열**로만 연결한다. 같은 칸의 node는 `nodes` 배열 순서대로 쌓인다.\n2. 부모 node의 `links`에 `{ \"label\": \"…\", \"href\": \"새파일-derivation.html\" }`을, 자식 `meta.parent.href`에 `\"decor-thm-derivation.html#node=부모ID\"`를 둔다. 모바일 패널 안에 작은 그래프를 끼워 넣지 않는다. Pages 캐시로 복귀한 부모 HTML이 낡게 보이면 `?v=변경식별자#node=부모ID`처럼 쿼리를 **hash 앞**에 두고 새 버전으로 확인한다. 부모가 다시 바뀌면 그 식별자도 갱신한다.\n3. `tools/build_decor.cjs`의 `[source, target]` 목록에 JSON/HTML 쌍을 추가한다. 저장소 뿌리 `Makefile`의 `check_graph.cjs \u003c새 JSON> -`와 `dump_table.cjs \u003c새 JSON> > …/새-NODES.md` 행도 추가한다. `show_node.cjs`는 `graphs/`의 세부 JSON을 찾아 조회하고, `check_decor.cjs`는 부모·자식 왕복 링크를 검사한다.\n4. `AGENTS.md`의 현재 지도 목록을 한 줄 갱신한다. 세부 지도 추가 사실은 `CHANGELOG.md`에 기록한다.\n\nedge만 고치는 질문이면 양끝 node를 각각 조회하고, 받는 쪽의 원문이 실제로 보내는 결과를 쓰는지 확인한 다음 `edges` 항목과 라벨을 고친다. 새 node를 넣었다면 `positions`와 필요할 경우 `NODES.md` 표도 함께 갱신한다.\n\n## 4. 검사, 빌드, 화면 확인\n\n```bash\nmake check\ngit status --short\ngit diff --check\ngit diff --stat\ngit diff -- redesign/proofmap Makefile\n```\n\n`make check`가 (1) 상위 구조와 왕복 링크, (2) 각 세부 지도의 구조, (3) 공통 템플릿으로 HTML 빌드, (4) node 표 재생성을 수행한다. **오류 0**이 필수다. 검사기는 ID 중복, edge 끝, 열 방향, 순환, 일부 TeX 사고를 잡지만 **수학적 타당성과 브라우저에서의 실제 조판을 보증하지 않는다.** 생성된 HTML과 표의 의도치 않은 변경을 `git diff`에서 확인한다.\n\n화면에서는 실제 웹페이지에서 대상 `#node=ID`가 선택되는지, 식과 본문이 끝까지 보이는지, 긴 수식이 패널을 깨지 않는지, 모바일 폭에서 선택·스크롤·확대가 되는지 확인한다. 세부 페이지의 **왕복 링크**, 앞뒤 node 링크, **참조 복사/링크 복사**도 확인한다. CDN이 제한된 로컬 환경에서는 HTML을 Chrome에서 파일로 여는 결과를 게시본과 동일하게 취급하지 않는다. 필요하면 [PROCEDURE.md 9.2절](PROCEDURE.md#92-화면-검사)의 로컬 MathJax 렌더 절차를 쓴다.\n\n## 5. 변경 기록과 브랜치 저장\n\n`redesign/proofmap/CHANGELOG.md`에 **요청 한 건당 한 줄**을 쓴다. 날짜, 사용자 요청 원문, 바꾼 ID, 원문 밖 보충 여부, 검사 결과를 남긴다. 예:\n\n> 2026-11-16 · “B_DC 이건 어떻게 유도하지?” · B_DC, DC_ONE, DC_SUM · 원문 밖 보충 없음 · 검사 오류 0\n\n수정한 JSON, 도구, 문서, `make check`가 만든 HTML과 표를 같이 커밋한다. **실제로 검토한 파일만 명시해 stage**하고 다른 작업자의 변경을 포함시키지 않는다. 아래는 B_DC 세부 지도를 처음 추가할 때의 예시이며, 요청에 따라 파일 목록을 바꾼다.\n\n```bash\ngit add Makefile redesign/proofmap/AGENTS.md redesign/proofmap/CHANGELOG.md\ngit add redesign/proofmap/graphs/decor-thm.json redesign/proofmap/graphs/b-dc.json\ngit add redesign/proofmap/tools/build_decor.cjs redesign/proofmap/build/decor-thm-derivation.html redesign/proofmap/build/b-dc-derivation.html\ngit add redesign/proofmap/checks/2026-11-16-thm-derivation-map/B-DC-NODES.md\ngit diff --cached --check\ngit diff --cached --stat\ngit commit -m \"Explain B_DC depth continuity\"\ngit push origin HEAD:ccr-9aa9b310-d8u9tb\n```\n\nGitHub 연결 도구만 있는 환경에서는 현재 branch head와 base tree를 읽고, 바뀐 파일로 tree를 만든 뒤 parent가 최신 head인 commit을 생성하고 **expected head를 확인하며** branch ref를 전진시킨다. ref가 바뀌면 최신 상태를 다시 읽고 충돌을 해결한다. 강제 push하지 않는다.\n\n## 6. GitHub Pages에 생성 HTML을 반영한다\n\n이 저장소의 공개 페이지는 **`gh-pages` 브랜치**에서 제공된다. 작업 브랜치의 JSON·HTML을 push하는 것만으로는 공개 URL이 갱신되지 않는다. 게시할 때는 **이번에 바뀐 생성 HTML만** 같은 상대 경로로 복사한다. 아래는 Git CLI 예시다.\n\n```bash\ngit fetch origin gh-pages\npages_dir=$(mktemp -d)\ngit worktree add --detach \"$pages_dir\" origin/gh-pages\nmkdir -p \"$pages_dir/redesign/proofmap/build\"\ncp redesign/proofmap/build/decor-thm-derivation.html \"$pages_dir/redesign/proofmap/build/\"\ncp redesign/proofmap/build/b-dc-derivation.html \"$pages_dir/redesign/proofmap/build/\"\ngit -C \"$pages_dir\" add redesign/proofmap/build\ngit -C \"$pages_dir\" diff --cached --check\ngit -C \"$pages_dir\" diff --cached --stat\ngit -C \"$pages_dir\" commit -m \"Publish B_DC derivation\"\ngit -C \"$pages_dir\" push origin HEAD:gh-pages\ngit worktree remove \"$pages_dir\"\n```\n\n여기서 `b-dc`는 예시다. **실제로 수정된 HTML만** `cp`한다. 작업 브랜치의 `gh-pages`가 아니라 최신 `origin/gh-pages`를 바탕으로 게시한다. push가 non-fast-forward로 거절되면 새 head를 가져와 변경을 재적용한 뒤 다시 push한다. 게시 브랜치에 JSON/원문/검사 문서를 복사할 필요는 없다. GitHub 연결 도구로 게시할 때도 같은 원칙으로 `gh-pages`의 최신 tree에 HTML blob을 넣고 새 commit/ref를 만든다.\n\nGitHub Actions의 **pages build and deployment**가 게시 commit에 대해 성공한 뒤 URL을 확인한다. 예를 들어 `gh run list --branch gh-pages --limit 3` 또는 저장소 Actions 화면에서 게시 commit의 성공을 확인한다. 새 페이지가 잠시 404이거나 이전 설명이 보이면 배포 상태를 먼저 확인하고, `?v=게시커밋` 쿼리를 붙여 캐시를 구별한다. URL 형태는 `https://euijinjeon.github.io/math2phys-site/redesign/proofmap/build/b-dc-derivation.html?v=\u003c게시커밋>#node=DC_ONE`이다. `#node=ID`는 쿼리 뒤에 둔다. 상위·세부 페이지 양쪽을 실제로 열어 왕복 링크가 새 버전으로 연결되는지 확인한다.\n\n## 7. 사용자에게 답한다\n\n대화에는 유도의 핵심 식과 각 부등식의 이유를 **그 자리에서 이해할 수 있게** 설명한다. 무엇을 평균해서 `1/L`이 되는지, 필요한 조건과 원문 밖 보충이 있는지를 분명히 한다. 저장소에 넣었다는 사실, 검사 결과, 공개 페이지의 **검증한 직접 node URL**과 원문 행을 함께 준다. 특정 걸음이 아직 미검증이면 완료했다고 쓰지 않는다.\n\n## 완료 점검표\n\n- [ ] 대상 브랜치와 node ID를 확인하고 `show_node.cjs`로 이웃·원문을 읽었다.\n- [ ] 원문의 식·참조·고정 변수·평균 좌표를 따라 유도를 독립적으로 검산했다.\n- [ ] `body` 보강 또는 세부 지도 분해를 선택하고 원문 밖 보충을 표시했다.\n- [ ] JSON의 수식, node/edge/positions, 부모·자식 왕복 링크를 확인했다.\n- [ ] 새 그래프라면 빌드 목록, Makefile, AGENTS, 표 생성 경로를 갱신했다.\n- [ ] CHANGELOG에 요청 원문·ID·보충 여부를 한 줄 남겼다.\n- [ ] `make check` 오류 0, diff 확인, 작업 브랜치에 커밋·push했다.\n- [ ] 바뀐 HTML을 `gh-pages`에 게시하고 Pages 배포 성공을 확인했다.\n- [ ] 공개 페이지에서 수식·모바일 배치·노드 선택·왕복 링크를 확인했다.\n- [ ] 사용자에게 유도와 검증한 직접 링크를 제공했다.\n","title":"UPDATE-PROCEDURE.md"},"move5-before-creation":{"path":"redesign/proofmap/graphs/move5.json","revision":"99252bb816e614ef669161add34f64bcbdb170c2","text":"{\n \"format\": \"proofmap/0.1\",\n \"id\": \"move5\",\n \"title\": \"수 5 — decorrelation.tex (원문 구조로 자른 계약 graph)\",\n \"language\": \"ko\",\n \"math_syntax\": \"LaTeX in text: $...$ inline, $$...$$ display (KaTeX-compatible)\",\n \"source\": {\n  \"root\": \"redesign/source/sections\",\n  \"range\": \"decorrelation.tex 1–623\",\n  \"note\": \"grounding.source 는 이 폴더의 파일과 줄 범위다.\"\n },\n \"floor\": {\n  \"reader\": [\n   \"대학원 확률: 조건부 기대값, martingale, Cauchy–Schwarz, Jensen\",\n   \"곱 차이 부등식: 좌표가 $[-1,1]$ 인 vector들의 좌표별 곱의 차는 각 인자 차의 합으로 누른다 (decorrelation.tex 186, 368, 582가 이름으로만 씀; THM을 열 때 바닥으로 지정)\"\n  ],\n  \"source\": \"원문이 적은 수준.\"\n },\n \"content_note\": \"2026-11-15 PoC. node 경계는 원문 구조(extract_tex.py 기계 추출)이고 물리 라벨은 없다. 모든 node는 계약(진술·출력 항목·필요 입력)만 있는 sketch다. 안쪽 유도는 하위 graph를 연 node에만 있다. edge의 carries[].origin 이 machine 이면 \\\\ref/\\\\eqref/\\\\cref 로 기계 추출, supplemented 이면 작성자가 증명 본문에서 보충. edge의 complete:true 는 싣는 항목의 진술이 다 적혔다는 뜻이고(SPEC 5절), 의존 목록이 빠짐없다는 보증은 아니다. 모든 근거는 proposed. 원문 4–9행의 절 머리 가정, figure, remark decor:order-of-limits 는 node가 아니다(기호 표 N_lim, REPORT 참조).\",\n \"symbols\": [\n  {\n   \"id\": \"m_d\",\n   \"tex\": \"$m_d$\",\n   \"defined_at\": \"decorrelation.tex 4\",\n   \"text\": \"이 절 전체에서 $m_d=d/L$.\"\n  },\n  {\n   \"id\": \"delta\",\n   \"tex\": \"$\\\\delta$\",\n   \"defined_at\": \"decorrelation.tex 4\",\n   \"text\": \"$\\\\delta=L^{-1}$.\"\n  },\n  {\n   \"id\": \"N_lim\",\n   \"tex\": \"$N\\\\to\\\\infty$\",\n   \"defined_at\": \"decorrelation.tex 4–8\",\n   \"text\": \"각 고정 $L$ 에서 $N$ 의 극한은 모두 Lemma pert:selection 이 주는 크기와 매개변수 선택을 따라 취한다. 그 선택은 Theorem pert:tree-identity 의 항등식을 만족한다. $L$ 마다 다른 수열을 써도 된다. (선택 자체는 perturbations.tex 255–268)\"\n  },\n  {\n   \"id\": \"topology\",\n   \"tex\": \"topology $S$\",\n   \"defined_at\": \"decorrelation.tex 18–20\",\n   \"text\": \"labeled leaf를 갖는 유한 rooted tree에서 unary vertex를 지운 것. 각 branching vertex에 $\\\\{0,\\\\ldots,L-1\\\\}$ 의 정수 깊이를 주며, 깊이는 모든 가지를 따라 엄격히 증가한다.\"\n  },\n  {\n   \"id\": \"b_S\",\n   \"tex\": \"$b(S)$\",\n   \"defined_at\": \"decorrelation.tex 20–21\",\n   \"text\": \"topology $S$ 의 branching vertex 수.\"\n  },\n  {\n   \"id\": \"eta_regular\",\n   \"tex\": \"$\\\\eta$-regular\",\n   \"defined_at\": \"decorrelation.tex 21–28\",\n   \"text\": \"모든 배정 깊이$/L$ 이 $(\\\\eta,1-\\\\eta)$ 안에 있고 서로 다른 branching vertex의 정규화 깊이가 $\\\\eta$ 보다 더 떨어진 배정. prefix 깊이 $d$ 가 추가로 지정되면 모든 branching 깊이에 대해 같은 제한을 지킨다. 한 topology의 두 사본이 aligned 깊이를 쓰면 대응 vertex는 깊이 좌표 하나를 공유하고, regularity는 서로 다른 좌표들에 건다.\"\n  },\n  {\n   \"id\": \"A_avg\",\n   \"tex\": \"$\\\\mathcal A_{L,\\\\eta}$\",\n   \"defined_at\": \"decorrelation.tex 30–38\",\n   \"text\": \"$a$ 개 깊이 좌표 위의 음 아닌 배열 $z$ 에 대해 $\\\\mathcal A_{L,\\\\eta}z=L^{-a}\\\\sum_{\\\\mathbf q\\\\ \\\\eta\\\\text{-regular}}z(\\\\mathbf q)$. 추가 순서 제한(예: $d\u003c\\\\min_vq_v$)은 합의 범위에 넣는다. 정규화하지 않은 평균이라 총질량 $\\\\le1$.\"\n  },\n  {\n   \"id\": \"eps_NLk\",\n   \"tex\": \"$\\\\varepsilon_{N,L,k}$\",\n   \"defined_at\": \"decorrelation.tex 49–58\",\n   \"text\": \"아래에서 쓰는 유한 모음 위에서 취한 Theorem pert:tree-identity 오차의 최대.\"\n  },\n  {\n   \"id\": \"E_root\",\n   \"tex\": \"$\\\\mathbb E$\",\n   \"defined_at\": \"trees.tex 47–48\",\n   \"text\": \"따로 적지 않은 기대값 $\\\\mathbb E$ 는 root와 해당 tree의 표본추출을 포함한다.\"\n  },\n  {\n   \"id\": \"R_S\",\n   \"tex\": \"$R_S$\",\n   \"defined_at\": \"trees.tex 42–46; decorrelation.tex 60–61, 90\",\n   \"text\": \"spin replica leaf 부분집합 $S$ 의 multioverlap $R_S=\\\\frac1N\\\\sum_{i}\\\\prod_{a\\\\in S}\\\\sigma_i^a$, $R_\\\\varnothing=1$. 수 5에서는 표본 leaf에 대해 $R_S=\\\\mathbf 1\\\\cdot A_S$.\"\n  },\n  {\n   \"id\": \"A_S\",\n   \"tex\": \"$A_S$, $x\\\\cdot y$, $\\\\|x\\\\|_N$\",\n   \"defined_at\": \"decorrelation.tex 87–93\",\n   \"text\": \"$S$ 의 표본 사본에 대해 $A_S=(\\\\prod_{a\\\\in S}\\\\sigma_i^a)_{i\\\\le N}$, $x\\\\cdot y=N^{-1}\\\\sum_ix_iy_i$, $\\\\|x\\\\|_N^2=x\\\\cdot x$.\"\n  },\n  {\n   \"id\": \"F_d\",\n   \"tex\": \"$\\\\mathscr F_d$\",\n   \"defined_at\": \"decorrelation.tex 94–95\",\n   \"text\": \"처음 stem 위의 깊이 $d$ (첫 branching 깊이 포함)에서 root와 깊이 $d$ 까지의 표본 prefix가 생성하는 sigma field.\"\n  },\n  {\n   \"id\": \"mu\",\n   \"tex\": \"$\\\\mu_{d,S}$\",\n   \"defined_at\": \"decorrelation.tex 97–98\",\n   \"text\": \"$\\\\mu_{d,S}=\\\\mathbb E[A_S\\\\mid\\\\mathscr F_d]$.\"\n  },\n  {\n   \"id\": \"v_N\",\n   \"tex\": \"$v_N(S,d)$\",\n   \"defined_at\": \"decorrelation.tex 99–104\",\n   \"text\": \"$v_N(S,d)=N^{-2}\\\\mathbb E\\\\sum_{i,j}\\\\operatorname{Cov}(A_{S,i},A_{S,j}\\\\mid\\\\mathscr F_d)^2$. 기대값은 root를 포함한다. $A_S$, $\\\\mu_{d,S}$ 의 좌표는 절댓값 $\\\\le1$, $0\\\\le v_N\\\\le1$.\"\n  },\n  {\n   \"id\": \"S_U\",\n   \"tex\": \"$S^U$\",\n   \"defined_at\": \"decorrelation.tex 144–146\",\n   \"text\": \"$S$ 와 같은 topology에서 branching vertex 부분집합 $U$ 의 깊이를 1씩 올린 것.\"\n  },\n  {\n   \"id\": \"a_p\",\n   \"tex\": \"$a_{S,e}$, $p_N(S,e)$\",\n   \"defined_at\": \"decorrelation.tex 208–215\",\n   \"text\": \"$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\\\ldots,T_s$ 로 갈라질 때 $a_{S,e}=\\\\prod_j\\\\mu_{e,T_j}$ (좌표별 곱), $p_N(S,e)=\\\\sum_jv_N(T_j,e)^{1/4}$.\"\n  },\n  {\n   \"id\": \"V_kL\",\n   \"tex\": \"$V_{k,L}(\\\\eta)$\",\n   \"defined_at\": \"decorrelation.tex 253–257\",\n   \"text\": \"$V_{k,L}(\\\\eta)=\\\\max_{1\\\\le|S|\\\\le k}\\\\limsup_{N}\\\\mathcal A_{L,\\\\eta}v_N(S,d)$. 최대는 유한 개 labeled topology 위.\"\n  },\n  {\n   \"id\": \"S_plus\",\n   \"tex\": \"$S^+$\",\n   \"defined_at\": \"decorrelation.tex 297–298\",\n   \"text\": \"$S$ 의 모든 내부 branching 깊이를 1씩 올린 topology.\"\n  },\n  {\n   \"id\": \"kappa\",\n   \"tex\": \"$\\\\kappa(T)$\",\n   \"defined_at\": \"trees.tex 346–354\",\n   \"text\": \"reference 계수 $\\\\kappa(S)=\\\\prod_{v\\\\in\\\\operatorname{Br}(S)}\\\\prod_{j=1}^{a_v-1}(m_{d_v}-jm_{d_v+1})$; $a_v$, $d_v$ 는 처방한 reference tree에서 vertex의 자식 수와 깊이.\"\n  },\n  {\n   \"id\": \"J\",\n   \"tex\": \"$J$\",\n   \"defined_at\": \"decorrelation.tex 333–336\",\n   \"text\": \"$J=\\\\kappa(S^+)^2$.\"\n  },\n  {\n   \"id\": \"ext_hist\",\n   \"tex\": \"$E$, $c_E$, $\\\\mathfrak E(\\\\mathcal T,a_*,\\\\mathcal C)$\",\n   \"defined_at\": \"trees.tex 259–276; perturbations.tex 427–440\",\n   \"text\": \"extension history와 그 계수(선택한 계수들의 곱), 제약 $\\\\mathcal C$ 를 지키는 허용 history의 모음.\"\n  },\n  {\n   \"id\": \"anchor\",\n   \"tex\": \"spin / marker anchor, $\\\\mathcal C$, $R_E$\",\n   \"defined_at\": \"perturbations.tex 427–450\",\n   \"text\": \"$S_0=\\\\sigma_i$ 이면 spin anchor, $S_0=1$ 이면 marker anchor. $\\\\mathcal C$ 는 추가 color와 anchor만의 쌍별 split 깊이를 처방한다. $R_E$ 는 history가 고른 새 replica(spin anchor이면 anchor 포함)의 multioverlap.\"\n  },\n  {\n   \"id\": \"D_coord\",\n   \"tex\": \"$D$, $D_j$\",\n   \"defined_at\": \"decorrelation.tex 492–494\",\n   \"text\": \"aligned 구성의 서로 다른 깊이 좌표 수 $D=b(S)+1$ ($d$, $e$ 포함). $T_j$ 에 속한 항은 $D_j=b(T_j)+1$ 개 좌표만 쓴다. (THM 607–609 는 $d$ 가 없어 $D=b(S)$ 로 다시 쓴다)\",\n   \"added_by\": \"open CC\"\n  },\n  {\n   \"id\": \"pi_j\",\n   \"tex\": \"$\\\\pi_j(\\\\mathbf q)$\",\n   \"defined_at\": \"decorrelation.tex 495–496\",\n   \"text\": \"shift한 항의 좌표 $\\\\pi_j(\\\\mathbf q)=(e+1,(q_v+1)_{v\\\\in\\\\operatorname{Br}(T_j)})$.\",\n   \"added_by\": \"open CC\"\n  },\n  {\n   \"id\": \"w_j\",\n   \"tex\": \"$w_j$\",\n   \"defined_at\": \"decorrelation.tex 498–499\",\n   \"text\": \"자식 공분산을 그 좌표의 함수로 본 것.\",\n   \"added_by\": \"open CC\"\n  },\n  {\n   \"id\": \"gamma_pow\",\n   \"tex\": \"$\\\\gamma$\",\n   \"defined_at\": \"decorrelation.tex 499\",\n   \"text\": \"fiber 경계의 지수 $0\u003c\\\\gamma\\\\le1$ (CC는 $1/4$, THM은 $1/2$).\",\n   \"added_by\": \"open CC\"\n  }\n ],\n \"graphs\": [\n  {\n   \"id\": \"top\",\n   \"title\": \"수 5 전체 (계약)\",\n   \"parent\": null,\n   \"summary\": \"decorrelation.tex 의 번호 붙은 진술 7개와 외부 입력 5개, 받는 곳 1개.\",\n   \"nodes\": [\n    {\n     \"id\": \"AVG\",\n     \"kind\": \"object\",\n     \"title\": \"깊이 평균과 그 두 비교\",\n     \"summary\": \"$\\\\mathcal A_{L,\\\\eta}$, Hölder, 쓰지 않는 좌표, 정수 shift\",\n     \"inputs\": [],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 30–47\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:average-holder\",\n      \"extraction_rule\": \"E\",\n      \"statement_span\": [\n       30,\n       47\n      ],\n      \"proof_span\": null,\n      \"outputs\": [\n       {\n        \"id\": \"def_A\",\n        \"statement\": \"$\\\\mathcal A_{L,\\\\eta}z=L^{-a}\\\\sum_{\\\\mathbf q\\\\ \\\\eta\\\\text{-regular}}z(\\\\mathbf q)$ (음 아닌 $z$, $a$ 개 좌표). 추가 순서 제한은 합의 범위에 넣는다. 총질량 $\\\\le1$.\",\n        \"lines\": [\n         30,\n         38\n        ]\n       },\n       {\n        \"id\": \"holder\",\n        \"statement\": \"$0\u003c\\\\gamma\\\\le1$ 이면 $\\\\mathcal A_{L,\\\\eta}(z^\\\\gamma)\\\\le(\\\\mathcal A_{L,\\\\eta}z)^\\\\gamma$.\",\n        \"lines\": [\n         38,\n         43\n        ]\n       },\n       {\n        \"id\": \"unused_coord\",\n        \"statement\": \"쓰지 않는 좌표에 대한 합은 많아야 $L$ 배이고 그 좌표의 정규화가 상쇄한다.\",\n        \"lines\": [\n         44,\n         45\n        ]\n       },\n       {\n        \"id\": \"shift_regular\",\n        \"statement\": \"좌표의 임의 부분집합을 고정 정수만큼 옮기면, 충분히 큰 $L$ 에서 $\\\\eta$-regular 배정이 $\\\\eta/2$-regular 배정으로 단사로 간다.\",\n        \"lines\": [\n         45,\n         47\n        ]\n       }\n      ],\n      \"needs\": []\n     },\n     \"symbols\": [\n      \"A_avg\",\n      \"eta_regular\",\n      \"topology\"\n     ],\n     \"layout\": {\n      \"col\": 0,\n      \"row\": 0\n     },\n     \"subgraph\": \"avg\"\n    },\n    {\n     \"id\": \"IDE\",\n     \"kind\": \"object\",\n     \"title\": \"항등식 오차의 유한 최대\",\n     \"summary\": \"$\\\\varepsilon_{N,L,k}\\\\to0$ (고정 $L,k$), 상수는 $L$ 에 의존 가능\",\n     \"inputs\": [\n      \"X_TI\"\n     ],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 49–58\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:identity-error\",\n      \"extraction_rule\": \"E\",\n      \"statement_span\": [\n       49,\n       58\n      ],\n      \"proof_span\": null,\n      \"outputs\": [\n       {\n        \"id\": \"eps_def\",\n        \"statement\": \"유계 크기의 labeled topology는 유한 개이고 고정 $L$ 에서 깊이 배정도 유한 개이므로, Theorem pert:tree-identity 의 오차를 아래의 유한 모음 위에서 $N\\\\to\\\\infty$ 전에 최대화할 수 있다. 그 최대가 $\\\\varepsilon_{N,L,k}$.\",\n        \"lines\": [\n         49,\n         53\n        ]\n       },\n       {\n        \"id\": \"eps_to_zero\",\n        \"statement\": \"각 고정 $L,k$ 에서 $\\\\varepsilon_{N,L,k}\\\\to0$ ($N\\\\to\\\\infty$).\",\n        \"lines\": [\n         53,\n         57\n        ]\n       },\n       {\n        \"id\": \"L_constants\",\n        \"statement\": \"이 오차에 곱하는 상수는 $L$ 에 임의로 의존해도 된다.\",\n        \"lines\": [\n         58,\n         58\n        ]\n       }\n      ],\n      \"needs\": [\n       {\n        \"from\": \"X_TI\",\n        \"items\": [\n         \"identity\"\n        ]\n       }\n      ]\n     },\n     \"symbols\": [\n      \"eps_NLk\",\n      \"N_lim\",\n      \"topology\"\n     ],\n     \"layout\": {\n      \"col\": 0,\n      \"row\": 1\n     }\n    },\n    {\n     \"id\": \"CON\",\n     \"kind\": \"step\",\n     \"title\": \"Lemma: 축약과 세 사본\",\n     \"summary\": \"$\\\\|(A_S-\\\\mu_{d,S})\\\\cdot B\\\\|_{L^2}\\\\le v_N^{1/4}$; 세 사본 하계\",\n     \"inputs\": [],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 108–140\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:contractions\",\n      \"extraction_rule\": \"S\",\n      \"statement_span\": [\n       108,\n       125\n      ],\n      \"proof_span\": [\n       127,\n       140\n      ],\n      \"outputs\": [\n       {\n        \"id\": \"contraction\",\n        \"statement\": \"random vector $B\\\\in[-1,1]^N$ 이 $\\\\mathscr F_d$ 가 주어졌을 때 $A_S$ 와 조건부 독립이면 $\\\\|(A_S-\\\\mu_{d,S})\\\\cdot B\\\\|_{L^2}\\\\le v_N(S,d)^{1/4}$.\",\n        \"lines\": [\n         110,\n         116\n        ]\n       },\n       {\n        \"id\": \"three_copy\",\n        \"statement\": \"$X,Y,Z$ 가 sigma field $\\\\mathscr G$ 가 주어졌을 때 유계 random vector의 조건부 독립 사본이고 $C$ 가 그 조건부 공분산 행렬이면 $\\\\mathbb E(X\\\\cdot Y-X\\\\cdot Z)^2\\\\ge\\\\frac2{N^2}\\\\mathbb E\\\\sum_{i,j}C_{ij}^2$.\",\n        \"lines\": [\n         117,\n         124\n        ]\n       }\n      ],\n      \"needs\": []\n     },\n     \"symbols\": [\n      \"A_S\",\n      \"F_d\",\n      \"mu\",\n      \"v_N\",\n      \"E_root\"\n     ],\n     \"layout\": {\n      \"col\": 1,\n      \"row\": 0\n     },\n     \"subgraph\": \"con\"\n    },\n    {\n     \"id\": \"DC\",\n     \"kind\": \"step\",\n     \"title\": \"Lemma: 깊이에 대한 평균 연속성\",\n     \"summary\": \"깊이 1칸 이동의 비용 $\\\\le C/L$ (깊이 평균)\",\n     \"inputs\": [\n      \"AVG\",\n      \"X_SAMP\"\n     ],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 142–206\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:depth-continuity\",\n      \"extraction_rule\": \"S\",\n      \"statement_span\": [\n       142,\n       166\n      ],\n      \"proof_span\": [\n       168,\n       206\n      ],\n      \"outputs\": [\n       {\n        \"id\": \"branch_shift\",\n        \"statement\": \"topology $S$ 와 branching vertex 부분집합 $U$ 를 고정하고 각 $\\\\eta$-regular 배정에서 $S^U$ 를 둔다. 조상 쪽 평가 깊이 $d$ 에서 같은 표본 prefix로 평균을 비교하면, 충분히 큰 $L$ 에서 $\\\\mathcal A_{L,\\\\eta}\\\\mathbb E\\\\|\\\\mu_{d,S^U}-\\\\mu_{d,S}\\\\|_N^2\\\\le C/L$. 평균은 모든 branching 깊이에 대해서이고, $d$ 가 움직이면 $d$ 도 평균하고 아니면 고정한다.\",\n        \"lines\": [\n         144,\n         155\n        ]\n       },\n       {\n        \"id\": \"eval_shift\",\n        \"statement\": \"$d$ 가 $S$ 의 처음 unary 구간을 따라 움직이면 $\\\\mathcal A_{L,\\\\eta}\\\\mathbb E\\\\|\\\\mu_{d+1,S}-\\\\mu_{d,S}\\\\|_N^2\\\\le C/L$. 이 평균은 $d$ 와 모든 branching 깊이를 포함하고, 평균들은 같은 표본 path 위에서 평가한다.\",\n        \"lines\": [\n         155,\n         163\n        ]\n       },\n       {\n        \"id\": \"uniform_constant\",\n        \"statement\": \"상수는 vertex 수와 shift 수에만 의존하고 $N$, 평가 깊이, transition kernel에 균일하다.\",\n        \"lines\": [\n         163,\n         165\n        ]\n       },\n       {\n        \"id\": \"martingale_energy\",\n        \"statement\": \"$T$ 의 나중 branching 깊이를 고정하고 처음 stem을 따라 path 하나를 뽑으면 $\\\\mu_{t,T}$ 는 유계 vector martingale이고 $\\\\sum_t\\\\mathbb E\\\\|\\\\mu_{t+1,T}-\\\\mu_{t,T}\\\\|_N^2\\\\le1$. (증명 블록 안의 식을 밖에서 참조)\",\n        \"lines\": [\n         169,\n         175\n        ]\n       },\n       {\n        \"id\": \"larger_tree\",\n        \"statement\": \"관련된 한-prefix 주변 법칙은 다른 표본 가지를 빼도 변하지 않으므로 이 평가들은 더 큰 표본 tree 안에서도 성립한다.\",\n        \"lines\": [\n         203,\n         205\n        ]\n       }\n      ],\n      \"needs\": [\n       {\n        \"from\": \"AVG\",\n        \"items\": [\n         \"shift_regular\",\n         \"unused_coord\"\n        ]\n       },\n       {\n        \"from\": \"X_SAMP\",\n        \"items\": [\n         \"leaf_removal\",\n         \"children_independent\"\n        ]\n       }\n      ]\n     },\n     \"symbols\": [\n      \"topology\",\n      \"S_U\",\n      \"mu\",\n      \"F_d\",\n      \"A_avg\",\n      \"eta_regular\",\n      \"A_S\"\n     ],\n     \"layout\": {\n      \"col\": 1,\n      \"row\": 1\n     },\n     \"subgraph\": \"dc\"\n    },\n    {\n     \"id\": \"PB\",\n     \"kind\": \"step\",\n     \"title\": \"자식을 평균으로 바꾸는 사영\",\n     \"summary\": \"$\\\\|(A_S-a_{S,e})\\\\cdot B\\\\|_{L^2}\\\\le p_N(S,e)$\",\n     \"inputs\": [\n      \"CON\",\n      \"X_SAMP\"\n     ],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 208–230\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:projection-bound\",\n      \"extraction_rule\": \"E\",\n      \"statement_span\": [\n       208,\n       230\n      ],\n      \"proof_span\": null,\n      \"outputs\": [\n       {\n        \"id\": \"product_mean\",\n        \"statement\": \"$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\\\ldots,T_s$ 로 갈라지면 자식의 조건부 독립으로 $\\\\mu_{e,S}=\\\\prod_j\\\\mu_{e,T_j}$.\",\n        \"lines\": [\n         208,\n         210\n        ]\n       },\n       {\n        \"id\": \"projection\",\n        \"statement\": \"$e$ 의 prefix가 주어졌을 때 $S$ 의 연속과 독립인 $B\\\\in[-1,1]^N$ 에 대해 $\\\\|(A_S-a_{S,e})\\\\cdot B\\\\|_{L^2}\\\\le p_N(S,e)$.\",\n        \"lines\": [\n         216,\n         225\n        ]\n       },\n       {\n        \"id\": \"two_sides\",\n        \"statement\": \"특히 $B=\\\\mathbf 1$ 과, $e$ 전에 갈라진 다른 쪽에서 뽑은 vector에 적용된다. 그런 두 쪽은 함께 사영해 총 $L^2$ 오차가 많아야 $2p_N(S,e)$.\",\n        \"lines\": [\n         225,\n         228\n        ]\n       },\n       {\n        \"id\": \"scalar_test\",\n        \"statement\": \"$|f|\\\\le1$ 인 scalar 시험함수를 축약 오차에 곱하면, 상관되어 있어도 $L^1$ 경계가 커지지 않는다.\",\n        \"lines\": [\n         228,\n         230\n        ]\n       }\n      ],\n      \"needs\": [\n       {\n        \"from\": \"CON\",\n        \"items\": [\n         \"contraction\"\n        ]\n       },\n       {\n        \"from\": \"X_SAMP\",\n        \"items\": [\n         \"children_independent\"\n        ]\n       }\n      ]\n     },\n     \"symbols\": [\n      \"a_p\",\n      \"mu\",\n      \"v_N\",\n      \"A_S\",\n      \"F_d\"\n     ],\n     \"layout\": {\n      \"col\": 2,\n      \"row\": 0\n     },\n     \"subgraph\": \"pb\"\n    },\n    {\n     \"id\": \"CC\",\n     \"kind\": \"step\",\n     \"title\": \"Proposition: 조건부 decorrelation\",\n     \"summary\": \"$\\\\lim_L\\\\limsup_N\\\\mathcal A_{L,\\\\eta}v_N(S,d)=0$\",\n     \"inputs\": [\n      \"AVG\",\n      \"CON\",\n      \"DC\",\n      \"IDE\",\n      \"PB\",\n      \"X_CH\",\n      \"X_EXT\",\n      \"X_RT\",\n      \"X_SAMP\",\n      \"X_TI\"\n     ],\n     \"abstraction\": \"exact\",\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 234–524\",\n      \"state\": \"proposed\"\n     },\n     \"library\": \"미대조\",\n     \"contract\": {\n      \"source_label\": \"decor:conditional-concentration\",\n      \"extraction_rule\": \"S\",\n      \"statement_span\": [\n       234,\n       245\n      ],\n      \"proof_span\": [\n       247,\n       524\n      ],\n      \"outputs\": [\n       {\n        \"id\": \"main\",\n        \"statement\": \"모든 고정 labeled topology $S$ 와 $\\\\eta>0$ 에서 $\\\\lim_{L\\\\to\\\\infty}\\\\limsup_{N\\\\to\\\\infty}\\\\mathcal A_{L,\\\\eta}v_N(S,d)=0$. 평균은 $S$ 의 모든 branching 깊이와 첫 split보다 엄격히 앞선 regular 깊이 $d$ 에 대해서. singleton이면 $d$ 만.\",\n        \"lines\": [\n         236,\n         244\n        ]\n       },\n       {\n        \"id\": \"V_to_zero\",\n        \"statement\": \"모든 고정 $k,\\\\eta$ 에서 $V_{k,L}(\\\\eta)\\\\to0$ ($L\\\\to\\\\infty$).\",\n        \"lines\": [\n         522,\n         523\n        ]\n       },\n       {\n        \"id\": \"relative_cost\",\n        \"statement\": \"증명의 구성($S^+$, $J$) 안에서 Lemma tree:charging 으로 $\\\\frac1{|J|}\\\\sum_{\\\\text{allowed}}|c|\\\\le C_{k,\\\\eta}$. (증명 블록 안의 식; 밖의 참조는 remark 하나뿐)\",\n        \"lines\": [\n      \"author_filled\": [\n      \"빈 추가의 spin-anchor 항등식이 왜 정확히 $\\\\mathbb ER_S^2$ 와 $(\\\\mathbb ER_S)^2$ 를 주는지(계수와 $R_E$ 의 식별)를 채웠다.\"\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 533–535\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s2_marker_setup\",\n     \"kind\": \"step\",\n     \"title\": \"$e-1$ 에서의 marker anchor 구성\",\n     \"statement\": \"$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\\\ldots,T_s$ 로 갈라진다고 하자. $S$ 를 old tree로 쓰고 그 leaf 하나를 marker anchor로 지정하고, 모든 leaf가 anchor로부터 $e-1$ 에서 갈라지는 $S$ 의 온전한 사본을 추가한다. 추가 사본의 첫 path는 $e-1$ 에서 fresh여야 하며(old tree가 거기서 아직 갈라지지 않았으므로), 다른 target path는 모두 그 결과 생긴 fresh subtree 안에 있다.\",\n     \"symbols\": [\n      \"topology\",\n      \"anchor\",\n      \"ext_hist\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"e\",\n       \"tex\": \"$e$\",\n       \"defined_at\": \"decorrelation.tex 537\",\n       \"text\": \"$S$ 의 첫 split 깊이. 평균에서 범위를 도는 좌표.\"\n      },\n      {\n       \"id\": \"T_j\",\n       \"tex\": \"$T_1,\\\\ldots,T_s$\",\n       \"defined_at\": \"decorrelation.tex 537–538\",\n       \"text\": \"깊이 $e$ 에서의 proper child shape, $s$ 는 그 수.\"\n      }\n     ],\n     \"derivation\": [\n      {\n       \"by\": \"e3\",\n       \"expr\": \"old tree $=S$, marker anchor $=S$ 의 leaf 하나, 추가 color $=$ anchor와 $e-1$ 에서 갈라지는 $S$ 의 사본.\",\n       \"by_refs\": [\n        \"e3\"\n       ]\n      },\n      {\n       \"by\": \"e3\",\n       \"expr\": \"old tree는 $e-1$ 에서 아직 갈라지지 않았으므로 첫 path는 $e-1$ 에서 fresh.\",\n       \"by_refs\": [\n        \"e3\"\n       ]\n      }\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 537–543\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s3_coefficient\",\n     \"kind\": \"step\",\n     \"title\": \"extension 계수 $C(S,e)=-\\\\delta\\\\kappa(S)$\",\n     \"statement\": \"prescribed-tree 항등식 양쪽의 extension 계수는 같은 0 아닌 수 $C(S,e)=-\\\\delta\\\\kappa(S)$ 이다.\",\n     \"symbols\": [\n      \"kappa\",\n      \"delta\",\n      \"ext_hist\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"C_Se\",\n       \"tex\": \"$C(S,e)$\",\n       \"defined_at\": \"decorrelation.tex 547\",\n       \"text\": \"marker 구성의 extension 계수 $-\\\\delta\\\\kappa(S)$.\"\n      }\n     ],\n     \"derivation\": [\n      {\n       \"by\": \"e5\",\n       \"expr\": \"호환 extension 위의 계수 총합은 $\\\\kappa(S)$.\",\n       \"by_refs\": [\n        \"e5\"\n       ]\n      },\n      {\n       \"by\": \"e5; e4\",\n       \"expr\": \"$C(S,e)=-\\\\delta\\\\kappa(S)\\\\neq0$ 이고 양쪽에서 같다.\",\n       \"by_refs\": [\n        \"e5\",\n        \"e4\"\n       ]\n      }\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 544–549\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s4_two_sides\",\n     \"kind\": \"step\",\n     \"title\": \"항등식 두 쪽의 값\",\n     \"statement\": \"target 사본과 old 사본은 $\\\\mathscr F_{e-1}$ 아래에서 조건부 독립이고 같은 분포다. $f=R_S$, $M=\\\\mathbb E[R_S\\\\mid\\\\mathscr F_{e-1}]$ 이면 그 곱의 조건부 기대값은 $M^2$. anchor만 있는 쪽에서는 marker의 $e-1$ 아래 연속을 지우면 확률 kernel이 1로 적분되고 보통의 target 법칙 $S$ 가 남아 평균은 $\\\\mathbb ER_S$.\",\n     \"symbols\": [\n      \"R_S\",\n      \"F_d\",\n      \"anchor\",\n      \"E_root\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"M\",\n       \"tex\": \"$M$\",\n       \"defined_at\": \"decorrelation.tex 552\",\n       \"text\": \"$M=\\\\mathbb E[R_S\\\\mid\\\\mathscr F_{e-1}]$.\"\n      }\n     ],\n     \"derivation\": [\n      {\n       \"by\": \"e6; s2_marker_setup\",\n       \"author_filled\": \"fresh subtree 의 자식이 독립으로 뽑힌다는 [X_SAMP.children_independent] 를 두 사본의 조건부 iid로 읽었다.\",\n       \"expr\": \"두 사본은 $\\\\mathscr F_{e-1}$ 아래에서 조건부 iid.\",\n       \"by_refs\": [\n        \"e6\",\n        \"s2_marker_setup\"\n       ]\n      },\n      {\n       \"by\": \"앞선 줄\",\n       \"expr\": \"$\\\\mathbb E[R_S^{\\\\rm tatus\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 556–569\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s6_projection\",\n     \"kind\": \"step\",\n     \"title\": \"$G$, $G_-$ 와 projection bound\",\n     \"statement\": \"$G=\\\\mathbf1\\\\cdot\\\\prod_j\\\\mu_{e,T_j}$, $G_-=\\\\mathbf1\\\\cdot\\\\prod_j\\\\mu_{e-1,T_j}$ 로 둔다. $G_-$ 는 $\\\\mathscr F_{e-1}$-가측. projection bound로 $\\\\mathbb E(R_S-G)^2\\\\le p_N(S,e)^2$. child covariance는 $e$ 에서 재며 $e$ 는 그 branching 깊이들과 떨어져 있고, $e-1$ 로의 이동은 martingale 연속성으로 한다.\",\n     \"symbols\": [\n      \"mu\",\n      \"F_d\",\n      \"a_p\",\n      \"R_S\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"G\",\n       \"tex\": \"$G$\",\n       \"defined_at\": \"decorrelation.tex 576\",\n       \"text\": \"$G=\\\\mathbf1\\\\cdot\\\\prod_j\\\\mu_{e,T_j}$.\"\n      },\n      {\n       \"id\": \"G_minus\",\n       \"tex\": \"$G_-$\",\n       \"defined_at\": \"decorrelation.tex 577\",\n       \"text\": \"$G_-=\\\\mathbf1\\\\cdot\\\\prod_j\\\\mu_{e-1,T_j}$.\"\n      }\n     ],\n     \"derivation\": [\n      {\n       \"by\": \"e11\",\n       \"expr\": \"$G=\\\\mathbf1\\\\cdot a_{S,e}$ ($=\\\\mathbf1\\\\cdot\\\\mu_{e,S}$).\",\n       \"by_refs\": [\n        \"e11\"\n       ]\n      },\n      {\n       \"by\": \"앞선 줄\",\n       \"author_filled\": \"$\\\\mu_{e-1,T_j}=\\\\mathbb E[A_{T_j}\\\\mid\\\\mathscr F_{e-1}]$ 의 정의에서 가측성을 읽었다.\",\n       \"expr\": \"$G_-$ 는 $\\\\mathscr F_{e-1}$-가측.\",\n       \"by_refs\": [\n        \"앞선 줄\"\n       ]\n      },\n      {\n       \"by\": \"e12\",\n       \"author_filled\": \"projection bound에서 $B=\\\\mathbf1$ 로 두고 $R_S=\\\\mathbf1\\\\cdot A_S$ 를 써서 $L^2$ norm의 제곱으로 읽었다.\",\n       \"expr\": \"$\\\\mathbb E(R_S-G)^2\\\\le p_N(S,e)^2$.\",\n       \"by_refs\": [\n        \"e12\"\n       ]\n      }\n     ],\n     \"author_filled\": [\n      \"$G_-$ 의 $\\\\mathscr F_{e-1}$-가측성.\",\n      \"projection bound에 $B=\\\\mathbf1$ 을 넣은 것.\" [f(a\\\\cdot b)]-\\\\mathbb Ef\\\\,\\\\mathbb ER_{\\\\mathrm{target}})+\\\\rho_N(S,d)$, $R_{\\\\mathrm{target}}$ 은 anchor-alone extension 의 목표 overlap(절댓값 $\\\\le1$). $|\\\\rho_N(S,d)|\\\\le C_{k,\\\\eta}(p_N(S^+,e+1)+h_N(S))+C_{L,k,\\\\eta}\\\\varepsilon_{N,L,k}$: 사영 오차에 $|f|\\\\le1$ 을 곱해도(상관되어도) $L^2$ 노름 이상 들지 않고, 절대 계수로 합해 상대 절대 비용을 쓴다. 마지막 항은 원 identity 오차를 $J$ 로 나눈 것을 포함하며 고정 $L$ 에서 0으로 간다.\",\n     \"symbols\": [\n      \"eps_NLk\",\n      \"a_p\",\n      \"J\",\n      \"anchor\",\n      \"N_lim\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"rho_N\",\n       \"tex\": \"$\\\\rho_N(S,d)$\",\n       \"defined_at\": \"decorrelation.tex 441–452\",\n       \"text\": \"귀납 항등식 eq decor:induction-identity 의 오차; eq decor:induction-error 로 막힘.\"\n      },\n      {\n       \"id\": \"R_target\",\n       \"tex\": \"$R_{\\\\mathrm{target}}$\",\n       \"defined_at\": \"decorrelation.tex 444–445\",\n       \"text\": \"anchor-alone extension 의 목표 overlap, $|R_{\\\\mathrm{target}}|\\\\le1$.\"\n      }\n     ],\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 434–457\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s9_close\",\n     \"kind\": \"step\",\n     \"status\": \"sketch\",\n     \"title\": \"사영 three-copy 경계와 $v_N(S,d)$ 의 귀납 추정\",\n     \"statement\": \"eq decor:projection-bound 로 $\\\\|f-a\\\\cdot b\\\\|_{L^2}\\\\le2p_N(S,e)$, $\\\\sum_{\\\\ell=d}^{e-1}c_\\\\ell=(e+1)\\\\delta\\\\le1$ 이므로 왼쪽에서 $f$ 를 $a\\\\cdot b$ 로 바꾸는 비용은 많아야 $4p_N(S,e)$. $a\\\\cdot b_\\\\ell$ 은 $a\\\\cdot b$ 와 주변 법칙이 같아 왼쪽은 $\\\\frac12\\\\sum_\\\\ell c_\\\\ell\\\\mathbb E(a\\\\cdot b-a\\\\cdot b_\\\\ell)^2$; 항들은 음 아니고 $c_d\\\\ge\\\\eta$. 오른쪽은 $2\\\\delta+|\\\\rho_N|$ 이하. 따라서 $\\\\mathbb E(a\\\\cdot b-a\\\\cdot b_d)^2\\\\le C_\\\\eta(\\\\delta+p_N(S,e)+|\\\\rho_N(S,d)|)$. $A_S$ 세 사본을 $d$ 아래로 조건부 독립으로 뽑고 첫 사본을 포함한 두 축약을 사영하면 각각 $L^2$ 에서 많아야 $2p_N(S,e)$ 바뀐다. three-copy 부등식, 위 경계, $p_N(S,e)\\\\le k$ 로 $v_N(S,d)\\\\le C_{k,\\\\eta}(\\\\delta+p_N(S,e)+ us\": \"sketch\",\n     \"title\": \"fiber 경계, 재귀식, 결론\",\n     \"statement\": \"$p_N$ 의 각 자식은 잎이 $k$ 개보다 적다. aligned 구성은 $d,e$ 를 포함해 $D=b(S)+1$ 개 서로 다른 깊이 좌표를 갖고, $T_j$ 의 항은 $D_j=b(T_j)+1$ 개 좌표만 쓴다. shift 항에서 그 좌표는 $\\\\pi_j(\\\\mathbf q)=(e+1,(q_v+1)_{v\\\\in\\\\operatorname{Br}(T_j)})$. 남는 배정마다 원상이 많아야 $L^{D-D_j}$ 개이고 큰 $L$ 에서 좌표는 $\\\\eta/2$-regular. $w_j$ 를 이 좌표의 함수로 본 자식 공분산이라 하면 $0\u003c\\\\gamma\\\\le1$ 에서 $L^{-D}\\\\sum_{\\\\mathbf q\\\\ \\\\eta\\\\text{-reg}}w_j(\\\\pi_j(\\\\mathbf q))^\\\\gamma\\\\le L^{-D_j}\\\\sum_{\\\\mathbf y\\\\ \\\\eta/2\\\\text{-reg}}w_j(\\\\mathbf y)^\\\\gamma\\\\le(L^{-D_j}\\\\sum_{\\\\mathbf y\\\\ \\\\eta/2\\\\text{-reg}}w_j(\\\\mathbf y))^\\\\gamma$. shift 하지 않은 항은 좌표를 옮기지 않고 같은 경계. 두 aligned 사본은 단일 사본 추정을 쓰고 대각선 제한은 없다. $\\\\gamma=1/4$, $\\\\limsup_N$, eq decor:projection-shift-error, eq decor:identity-error 로 큰 $L$ 에서 $V_{k,L}(\\\\eta)\\\\le C_{k,\\\\eta}(L^{-1/2}+V_{k-1,L}(\\\\eta/2)^{1/4})$. 더 작은 topology 위의 최대는 공분산이 1 이하라 오른쪽에 흡수된다. base case 와 귀납으로 모든 고정 $k,\\\\eta$ 에서 $V_{k,L}(\\\\eta)\\\\to0$, 명제가 증명된다.\",\n     \"symbols\": [\n      \"V_kL\",\n      \"A_avg\",\n      \"eta_regular\",\n      \"b_S\",\n      \"a_p\",\n      \"v_N\",\n      \"eps_NLk\",\n      \"N_lim\",\n      \"delta\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"D_coords\",\n       \"tex\": \"$D,\\\\ D_j$\",\n       \"defined_at\": \"decorrelation.tex 492–494\",\n       \"text\": \"$D=b(S)+1$ (aligned 구성의 서로 다른 깊이 좌표 수, $d,e$ 포함), $D_j=b(T_j)+1$.\"\n      },\n      {\n       \"id\": \"pi_j\",\n       \"tex\": \"$\\\\pi_j(\\\\mathbf q)$\",\n       \"defined_at\": \"decorrelation.tex 495–496\",\n       \"text\": \"shift 항이 쓰는 좌표 $(e+1,(q_v+1)_{v\\\\in\\\\operatorname{Br}(T_j)})$.\"\n      },\n      {\n       \"id\": \"w_j\",\n       \"tex\": \"$w_j$\",\n       \"defined_at\": \"decorrelation.tex 498–499\",\n       \"text\": \"자식 $T_j$ 의 공분산을 그 좌표의 함수로 본 것.\"\n      },\n      {\n       \"id\": \"gamma\",\n       \"tex\": \"$\\\\gamma$\", )))\"\n```\n\n## 2. 원문을 읽는다\n\n읽은 범위와 목적이다. 정리 하나를 위해 §7 전체(623행)를 읽었다.\n\n| 파일:행 | 무엇 | 왜 |\n|---|---|---|\n| decorrelation.tex 1–84 | 절 첫머리, §7.1 깊이 평균, 정리 진술, 증명 개요 | 정리의 진술과 쓰이는 정의 |\n| decorrelation.tex 85–300 | §7.2 정의·Lemma 둘·사영 경계, §7.3 Proposition 첫 부분 | 정리 증명이 부르는 식 라벨의 출처 |\n| decorrelation.tex 490–525 | fiber 경계, 재귀 부등식, Proposition 결론 | 정리 증명이 `\\eqref{decor:fiber-bound}` 를 직접 부른다 |\n| decorrelation.tex 526–623 | §7.4 정리의 증명, Remark | 지도의 중심 |\n| perturbations.tex 440–465 | Theorem `pert:tree-identity` 진술 | 증명이 쓰는 항등식의 정확한 꼴 |\n| trees.tex 38–50 | 표본 규칙, `tree:multioverlap` | $R_S$ 의 정의 |\n| trees.tex 337–360 | Lemma `tree:reference-total`, $\\kappa(S)$ | marker 계수 $C(S,e)=-\\delta\\kappa(S)$ 의 $\\kappa$ |\n\n300–490행(Proposition 귀납 단계 본문)은 **읽지 않았다.** 정리 증명이 그 내부를 쓰지 않고 결론과 fiber 경계만 쓰기 때문이다. 그래서 그 부분은 node 하나(`P_IND`)로 줄였다. 이것이 이 지도의 가장 큰 생략이다.\n\n**[규칙]** 증명 본문의 `\\ref`·`\\eqref`·`\\cref` 를 모두 따라가 출처를 읽는다. 그리고 **`\\ref` 없이 쓰는 것**을 따로 찾는다. 예를 들어 \"spin-anchor identity\", \"product difference inequality\", \"variance decomposition\"은 라벨 없이 쓰인다. 앞의 둘은 각각 `pert:tree-identity`, `decor:one-vertex-shift` 주변 문장에서 왔다. 마지막 것은 기초 확률이라 node로 세우지 않고 걸음 안에 적었다.\n"},"model":{"document":"procedure","lines":[61,153],"kind":"report","excerpt":"grep -n 'spin-anchor\\|product difference\\|martingale' redesign/source/sections/*.tex\ngrep -n 'kappa' redesign/source/sections/*.tex\n```\n\n## 3. 묶음(cluster)을 정한다\n\n**[규칙]** 묶음은 원문의 절 구조 그대로 둔다. 물리 해석으로 묶지 않는다(proofmap HANDOFF 5절 \"경계는 원문 구조로 자른다\"와 같은 원칙). 다른 절에서 받는 것은 \"밖에서 받는 것\" 하나로 모은다.\n\n**[이번 값]**\n\n| 묶음 키 | 이름 | 원문 |\n|---|---|---|\n| `ext` | 밖에서 받는 것 (§3·§6) | trees.tex, perturbations.tex |\n| `s71` | §7.1 깊이 평균 | 15–84 |\n| `s72` | §7.2 조건부 공분산과 깊이 연속성 | 85–231 |\n| `s73` | §7.3 Proposition | 232–525 |\n| `s74` | §7.4 정리의 증명 | 526–623 |\n| (없음) | 받는 곳 §8 | `OUT` 하나 |\n\n## 4. node를 고른다\n\n### 4.1 규칙\n\n1. **번호 붙은 진술과 라벨 붙은 식**이 기본 단위다. 정리, 보조정리, 명제, 정의식, 다른 곳에서 `\\eqref` 로 불리는 식이다.\n2. **정리의 증명은 걸음 단위로 쪼갠다.** 한 걸 다. `check_graph.cjs` 가 이 사고를 오류로 잡는다(7절).\n\n## 7. 배치\n\n### 7.1 [시행착오] 자동 배치(dagre)를 버린 이유\n\n처음에는 dagre 0.8.5의 compound graph(묶음을 부모 node로)로 위→아래 배치를 했다. 결과는 5820×1830px였다. 밖 node 여섯이 모든 묶음으로 선을 뻗어 묶음들이 가로로 흩어졌고, 전체 보기에서 16%로 줄어 읽을 수 없었다. 묶음 상자도 겹쳤다.\n\n**[규칙]** node가 수십 개이고 묶음이 원문 절 순서를 따르면 **손으로 정한 격자 배치**가 낫다. 자리는 `POS` 에 `[띠, 열]` 로만 주고, 픽셀 좌표는 잰 크기로 계산한다.\n\n### 7.2 격자 설계\n\n왼쪽에서 오른쪽으로 흐른다. 띠 둘을 위아래로 둔다.\n\n```\n열:     0        1–3                 4–7                         8–10\n띠 0:   (밖)     §7.1 깊이 평균       §7.3 Proposition\n띠 1:            §7.2 공분산·연속성    §7.4 정리의 증명 ─────────→ THM → OUT\n띠 2:   밖 node 여섯을 세로 가운데에\n```\n\n**[이번 값]** `POS` 전체:\n\n```\nX_*:[2,0]\nA_DEF,A_ERR:[0,1]   A_HOL,A_CMP:[0,2]\nB_DEF:[1,1]   B_CON,B_ME:[1,2]   B_PB,B_DC:[1,3]\nP_V,P_1:[0,4]   P_IND,P_FB:[0,5]   P_REC:[0,6]   PROP:[0,7]\nT_SET,T_S:[1,4]   T_C,T_G:[1,5]   T_SIDES,T_ADJ,T_L2:[1,6]   T_VM,T_FIB:[1,7]   T_VAR,REM:[1,8]\nTHM:[1,9]   OUT:[1,10]\n```\n\n**[규칙]** 열 번호는 의존의 **가장 긴 경로 깊이**와 대략 맞춘다. 정확한 위상 순서일 필요는 없지만, 모든 edge가 열이 커지는 방향이어야 한다(`check_graph.cjs` 4번 검사). 같은 칸(띠·열)에 여러 node를 두면 `N` 배열의 순서대로 위에서 아래로 쌓인다. 그래서 `N` 의 순서도 배치의 일부다.\n\n### 7.3 좌표 계산 (`layout()`)\n\n1. MathJax가 수식을 그린 **뒤에** 각 node의 `offsetWidth`·`offsetHeight` 를 잰다. 그 전에 재면 TeX 원문 길이로 재서 틀린다.\n2. 열 폭 = 그 열의 모든 node 폭의 최대. 열의 x = 앞 열들의 폭 + `COLGAP`(170px)의 누적. 바깥 여백 `M` 은 60px다.\n3. 칸 높이 = 쌓인 node 높이의 합 + `ROWGAP`(26px) 간격. 띠 높이 = 그 띠 칸 높이의 최대. 띠 1은 띠 0 아래 `BANDGAP`(90px)에서 시작한다.\n4. node는 칸 안에서 가로 가운데, 칸 묶음은 띠 안에서 세로 가운데에 둔다. 띠 2(밖 node)는 전체 높이의 세로 가운데다.\n5. 묶음 상자 = 그 묶음 node들의 외접 사각형 + 여백 18px(위쪽은 이름표 자리로 8px 더).\n6. **선의 끝점 나누기:** 한 node에서 나가는 선들을 받는 node의 y 순서로 정렬한다. 그리고 node 오른쪽 변의 높이 20%–80% 구간에 고르게 나눠 붙인다. 들어오는 선도 왼쪽 변에서 같은 방식으로 나눈다. 선 다발이 한 점에 몰리는 것을 막는다.\n7. **선 모양:** 3차 Bézier `M x1,y1 C x1+dx,y1 x2-dx,y2 x2,y2`, `dx = max(50, (x2-x1)/2)`. 화살촉은 SVG `marker`.\n8. **라벨 위치:** [시행착오] 처음에는 선 길이의 50% 지점(긴 선은 82%)에 두었다. 그러자 긴 선의 라벨이 중간 열의 node 위에 얹혔다. **받는 node 바로 앞 빈 열의 가운데**(x = 받는 node 왼쪽 − `COLGAP` 알면 한 번에 현재 진술·설명·받고 보내는 edge·원문 행을 출력한다.\n\n```bash\nnode redesign/proofmap/tools/show_node.cjs B_DC\nnode redesign/proofmap/tools/show_node.cjs B_DC/DC_ONE\n```\n\nID를 모르면 화면의 node 또는 선택 패널에서 ID를 보고 **참조 복사**를 누른다. 제목이나 원문 라벨만 있으면 `NODES.md`에서 찾는다.\n\n```bash\nrg -n 'depth-continuity|깊이에 대한 평균 연속성' redesign/proofmap/checks/2026-11-16-thm-derivation-map/NODES.md\n```\n\n1. 출력의 **진술**을 질문과 대조한다. 같은 이름의 다른 식이나 부모/세부 노드를 혼동하지 않는다.\n2. **받는 edge**의 선행 결과를 필요한 것만 조회한다. B_DC라면 B_ME의 martingale energy, A_CMP의 regularity 이동, X_SAMP의 prefix 주변법칙을 확인한다. **보내는 edge**를 보면 이 결과를 다음 단계가 어떤 형태로 쓰는지 알 수 있다.\n3. `src`의 원문 행을 읽는다. 조회 도구는 긴 범위를 최대 80행까지만 보여 주므로 생략된 부분은 해당 구간만 연다. 원문 증명이 다른 식을 `\\eqref`, `\\cref`, 이름으로 부르면 그 결과의 진술과 필요한 증명까지 따라간다.\n\n   ```bash\n   nl -ba redesign/source/sections/decorrelation.tex | sed -n '168,206p'\n   rg -n 'label\\{decor:martingale-energy\\}|product difference|one-vertex-shift' redesign/source/sections/*.tex\n   ```\n\n4. 원문의 **대상과 조건**을 적는다. 무엇을 고정하고(`T_j`의 나중 깊이 등), 무엇을 평균하는지(`q`, `d`, 다른 깊이), 두 양이 같은 prefix/path에서 결합되는지, 상수의 의존 대상, `N\\to\\infty`와 `L\\to\\infty`의 순서를 구별한다. 원문이 한 줄로 넘긴 부등식은 실제로 전개해 확인한다.\n5. 원문에 없는 새 주장을 써야 한다면 그 사실을 분리한다. 근거 없는 물리적 동일시를 증명의 edge처럼 추가하지 않는다.\n\n처음부터 긴 HANDOFF, 카드 전체, 큰 graph 파일을 읽을 필요가 없다. 조회 출력에서 빠진 **특정** 정의나 원문 행이 있을 때만 읽는 범위를 넓힌다."},"u-reason":{"document":"update","lines":[53,66],"kind":"specification","excerpt":"## 2. 유도를 먼저 검산하고 node 경계를 정한다\n\n수정 전에 아래 네 칸을 메모하거나 초안에 적는다. 그래프를 그리는 순서보다 이 검산이 먼저다.\n\n| 칸 | 확인할 것 | B_DC의 예 |\n|---|---|---|\n| 입력 | 정확히 쓰는 선행 결과 | `B_ME`의 제곱 증분 합, 자식 평균의 곱 표현 |\n| 변환 | 각 등식·부등식의 이유 | 조건부 Jensen, 곱 차이, 제곱합 |\n| 출력 | 이 걸음에서 처음 얻는 결과 | 한 vertex 이동의 제곱 오차, 깊이 평균 `C/L` |\n| 조건 | 같은 표본, regularity, 평균 좌표 | 같은 한 단계 continuation, `\\eta/2` 영역 |\n\n한 노드의 `body`에 한두 문장을 더하면 끝나는 경우에는 기존 ID를 유지한다. 새 식·대상·부등식이 각각 다음 걸음의 입력이 되는 경우에는 세부 지도에서 **한 결과당 한 node**로 나눈다. B_DC에서는 `DC_ME → DC_EVAL`과 `DC_PROD → DC_ONE → DC_SUM → DC_ALL`을 분리했다. 원문 순서와 의존 순서가 다르면 edge는 의존 순서대로 놓고 각 node의 `src`에 원래 행을 남긴다.\n\n각 edge의 라벨은 “증명에 필요함” 같은 설명 대신 **전달하는 내용**을 짧게 적는다. 원문에 있는 증명과 원문 밖에서 채운 걸음을 구별한다. 후자는 해당 node에 `\"supplement\": true`와 `\u003cp class=\"warn\">작성자 보충: …\u003c/p>`를 함께 둔다. 근거가 부족하면 단정하는 node를 만들지 말고 막힌 지점을 답변에 남긴다."},"u-edit":{"document":"update","lines":[68,85],"kind":"specification","excerpt":"## 3. JSON만 편집한다\n\n상위 지도 노드의 진술·설명·edge는 `graphs/decor-thm.json`에서 고친다. 기존 세부 노드는 해당 `graphs/b-con.json` 또는 `graphs/b-dc.json`에서 고친다. `build/*.html`의 데이터나 보기 코드를 손으로 수정하지 않는다.\n\n### 3.1 짧은 설명\n\n`body`는 패널의 HTML이며 `f`는 지도 카드의 대표식이다. 원문에서 무엇을 고정하고 어떤 연산으로 결론이 나는지 서술하고, `src`를 실제 원문 행으로 좁힌다. 진술 자체가 달라진 경우에만 `f`도 바꾼다. JSON에서 TeX의 백슬래시는 두 개로 적는다. 예: `\"$\\\\mathbb E\\\\|D_t\\\\|_N^2$\"`.\n\nHTML 문자열 속에는 원시 `\u003c`를 쓰지 않는다. 예를 들어 `$s\u003ct$`를 `body`에 넣으면 브라우저가 그 뒤를 태그로 해석해 문단이 사라질 수 있다. `$s\\\\lt t$` 또는 `$s&lt;t$`로 적고 공개 페이지에서 확인한다. 따옴표와 `$…$` 짝도 점검한다.\n\n### 3.2 세부 지도 추가\n\n1. `graphs/b-dc.json`처럼 새 JSON을 만든다. `meta.title`, `meta.description`, `meta.parent={label,href}`, `groups`, `nodes`, `edges`, `positions`, `subgraphs`를 둔다. 세부 node에는 고유 ID, `tag`, `t`, `f`, `body`, `src`, `g`, `col`을 적는다. `positions`는 `[띠, 열]`이고 edge는 **작은 열에서 큰 열**로만 연결한다. 같은 칸의 node는 `nodes` 배열 순서대로 쌓인다.\n2. 부모 node의 `links`에 `{ \"label\": \"…\", \"href\": \"새파일-derivation.html\" }`을, 자식 `meta.parent.href`에 `\"decor-thm-derivation.html#node=부모ID\"`를 둔다. 모바일 패널 안에 작은 그래프를 끼워 넣지 않는다. Pages 캐시로 복귀한 부모 HTML이 낡게 보이면 `?v=변경식별자#node=부모ID`처럼 쿼리를 **hash 앞**에 두고 새 버전으로 확인한다. 부모가 다시 바뀌면 그 식별자도 갱신한다.\n3. `tools/build_decor.cjs`의 `[source, target]` 목록에 JSON/HTML 쌍을 추가한다. 저장소 뿌리 `Makefile`의 `check_graph.cjs \u003c새 JSON> -`와 `dump_table.cjs \u003c새 JSON> > …/새-NODES.md` 행도 추가한다. `show_node.cjs`는 `graphs/`의 세부 JSON을 찾아 조회하고, `check_decor.cjs`는 부모·자식 왕복 링크를 검사한다.\n4. `AGENTS.md`의 현재 지도 목록을 한 줄 갱신한다. 세부 지도 추가 사실은 `CHANGELOG.md`에 기록한다.\n\nedge만 고치는 질문이면 양끝 node를 각각 조회하고, 받는 쪽의 원문이 실제로 보내는 결과를 쓰는지 확인한 다음 `edges` 항목과 라벨을 고친다. 새 node를 넣었다면 `positions`와 필요할 경우 `NODES.md` 표도 함께 갱신한다."},"u-check":{"document":"update","lines":[87,99],"kind":"specification","excerpt":"## 4. 검사, 빌드, 화면 확인\n\n```bash\nmake check\ngit status --short\ngit diff --check\ngit diff --stat\ngit diff -- redesign/proofmap Makefile\n```\n\n`make check`가 (1) 상위 구조와 왕복 링크, (2) 각 세부 지도의 구조, (3) 공통 템플릿으로 HTML 빌드, (4) node 표 재생성을 수행한다. **오류 0**이 필수다. 검사기는 ID 중복, edge 끝, 열 방향, 순환, 일부 TeX 사고를 잡지만 **수학적 타당성과 브라우저에서의 실제 조판을 보증하지 않는다.** 생성된 HTML과 표의 의도치 않은 변경을 `git diff`에서 확인한다.\n\n화면에서는 실제 웹페이지에서 대상 `#node=ID`가 선택되는지, 식과 본문이 끝까지 보이는지, 긴 수식이 패널을 깨지 않는지, 모바일 폭에서 선택·스크롤·확대가 되는지 확인한다. 세부 페이지의 **왕복 링크**, 앞뒤 node 링크, **참조 복사/링크 복사**도 확인한다. CDN이 제한된 로컬 환경에서는 HTML을 Chrome에서 파일로 여는 결과를 게시본과 동일하게 취급하지 않는다. 필요하면 [PROCEDURE.md 9.2절](PROCEDURE.md#92-화면-검사)의 로컬 MathJax 렌더 절차를 쓴다."},"u-save":{"document":"update","lines":[101,120],"kind":"specification","excerpt":"## 5. 변경 기록과 브랜치 저장\n\n`redesign/proofmap/CHANGELOG.md`에 **요청 한 건당 한 줄**을 쓴다. 날짜, 사용자 요청 원문, 바꾼 ID, 원문 밖 보충 여부, 검사 결과를 남긴다. 예:\n\n> 2026-11-16 · “B_DC 이건 어떻게 유도하지?” · B_DC, DC_ONE, DC_SUM · 원문 밖 보충 없음 · 검사 오류 0\n\n수정한 JSON, 도구, 문서, `make check`가 만든 HTML과 표를 같이 커밋한다. **실제로 검토한 파일만 명시해 stage**하고 다른 작업자의 변경을 포함시키지 않는다. 아래는 B_DC 세부 지도를 처음 추가할 때의 예시이며, 요청에 따라 파일 목록을 바꾼다.\n\n```bash\ngit add Makefile redesign/proofmap/AGENTS.md redesign/proofmap/CHANGELOG.md\ngit add redesign/proofmap/graphs/decor-thm.json redesign/proofmap/graphs/b-dc.json\ngit add redesign/proofmap/tools/build_decor.cjs redesign/proofmap/build/decor-thm-derivation.html redesign/proofmap/build/b-dc-derivation.html\ngit add redesign/proofmap/checks/2026-11-16-thm-derivation-map/B-DC-NODES.md\ngit diff --cached --check\ngit diff --cached --stat\ngit commit -m \"Explain B_DC depth continuity\"\ngit push origin HEAD:ccr-9aa9b310-d8u9tb\n```\n\nGitHub 연결 도구만 있는 환경에서는 현재 branch head와 base tree를 읽고, 바뀐 파일로 tree를 만든 뒤 parent가 최신 head인 commit을 생성하고 **expected head를 확인하며** branch ref를 전진시킨다. ref가 바뀌면 최신 상태를 다시 읽고 충돌을 해결한다. 강제 push하지 않는다."},"u-publish":{"document":"update","lines":[122,143],"kind":"specification","excerpt":"## 6. GitHub Pages에 생성 HTML을 반영한다\n\n이 저장소의 공개 페이지는 **`gh-pages` 브랜치**에서 제공된다. 작업 브랜치의 JSON·HTML을 push하는 것만으로는 공개 URL이 갱신되지 않는다. 게시할 때는 **이번에 바뀐 생성 HTML만** 같은 상대 경로로 복사한다. 아래는 Git CLI 예시다.\n\n```bash\ngit fetch origin gh-pages\npages_dir=$(mktemp -d)\ngit worktree add --detach \"$pages_dir\" origin/gh-pages\nmkdir -p \"$pages_dir/redesign/proofmap/build\"\ncp redesign/proofmap/build/decor-thm-derivation.html \"$pages_dir/redesign/proofmap/build/\"\ncp redesign/proofmap/build/b-dc-derivation.html \"$pages_dir/redesign/proofmap/build/\"\ngit -C \"$pages_dir\" add redesign/proofmap/build\ngit -C \"$pages_dir\" diff --cached --check\ngit -C \"$pages_dir\" diff --cached --stat\ngit -C \"$pages_dir\" commit -m \"Publish B_DC derivation\"\ngit -C \"$pages_dir\" push origin HEAD:gh-pages\ngit worktree remove \"$pages_dir\"\n```\n\n여기서 `b-dc`는 예시다. **실제로 수정된 HTML만** `cp`한다. 작업 브랜치의 `gh-pages`가 아니라 최신 `origin/gh-pages`를 바탕으로 게시한다. push가 non-fast-forward로 거절되면 새 head를 가져와 변경을 재적용한 뒤 다시 push한다. 게시 브랜치에 JSON/원문/검사 문서를 복사할 필요는 없다. GitHub 연결 도구로 게시할 때도 같은 원칙으로 `gh-pages`의 최신 tree에 HTML blob을 넣고 새 commit/ref를 만든다.\n\nGitHub Actions의 **pages build and deployment**가 게시 commit에 대해 성공한 뒤 URL을 확인한다. 예를 들어 `gh run list --branch gh-pages --limit 3` 또는 저장소 Actions 화면에서 게시 commit의 성공을 확인한다. 새 페이지가 잠시 404이거나 이전 설명이 보이면 배포 상태를 먼저 확인하고, `?v=게시커밋` 쿼리를 붙여 캐시를 구별한다. URL 형태는 `https://euijinjeon.github.io/math2phys-site/redesign/proofmap/build/b-dc-derivation.html?v=\u003c게시커밋>#node=DC_ONE`이다. `#node=ID`는 쿼리 뒤에 둔다. 상위·세부 페이지 양쪽을 실제로 열어 왕복 링크가 새 버전으로 연결되는지 확인한다."},"u-reply":{"document":"update","lines":[145,147],"kind":"specification","excerpt":"## 7. 사용자에게 답한다\n\n대화에는 유도의 핵심 식과 각 부등식의 이유를 **그 자리에서 이해할 수 있게** 설명한다. 무엇을 평균해서 `1/L`이 되는지, 필요한 조건과 원문 밖 보충이 있는지를 분명히 한다. 저장소에 넣었다는 사실, 검사 결과, 공개 페이지의 **검증한 직접 node URL**과 원문 행을 함께 준다. 특정 걸음이 아직 미검증이면 완료했다고 쓰지 않는다."},"scope-section":{"document":"procedure","lines":[17,24],"kind":"report","excerpt":"\"7장\"은 논문의 §7이다. 절 번호는 `redesign/source/main.tex` 의 `\\input` 순서와 각 파일의 `\\section` 유무로 정한다.\n\n```bash\ngrep -n '\\\\input' redesign/source/main.tex\ngrep -n '\\\\section' redesign/source/sections/*.tex\n```\n\n**[이번 값]** `overview.tex` 에는 `\\section` 이 없다. 그래서 introduction §1, model §2, trees §3, upper §4, cavity §5, perturbations §6, **decorrelation §7** 이다. `redesign/HANDOFF.md` 의 \"수 5(§7)\"와도 맞는다."},"scope-target":{"document":"procedure","lines":[26,32],"kind":"report","excerpt":"\"multioverlap의 깊이 평균 집중\"은 §7의 목표 정리다.\n\n```bash\ngrep -n 'begin{\\|label{\\|section' redesign/source/sections/decorrelation.tex\n```\n\n**[이번 값]** Theorem `decor:overlap-concentration` (63–76행)이다. 그 증명은 532–611행에 있다. 증명이 정리와 떨어진 곳에 있으므로 두 곳을 다 읽어야 한다."},"scope-proof":{"document":"procedure","lines":[32,32],"kind":"report","excerpt":"**[이번 값]** Theorem `decor:overlap-concentration` (63–76행)이다. 그 증명은 532–611행에 있다. 증명이 정리와 떨어진 곳에 있으므로 두 곳을 다 읽어야 한다."},"scope-existing":{"document":"procedure","lines":[34,40],"kind":"report","excerpt":"**[규칙]** 기존 증명 지도에 같은 정리가 있는지 먼저 본다. `graphs/move5.json` 의 `thm` 하위 graph에 이 증명이 18 node로 있었다. 그러나 모두 sketch였고 확대해 보는 보기가 아니었다. 이번에는 그 자료를 읽지 않고 **원문에서 새로 지었다.** move5의 node 이름과 대조는 하지 않았다.\n\n```bash\npython3 -c \"\nimport json;d=json.load(open('redesign/proofmap/graphs/move5.json'))\nfor g in d['graphs']: print(g['id'], g.get('title'), len(g.get('nodes',[])), len(g.get('edges',[])))\"\n```"},"scope-choice":{"document":"procedure","lines":[34,34],"kind":"report","excerpt":"**[규칙]** 기존 증명 지도에 같은 정리가 있는지 먼저 본다. `graphs/move5.json` 의 `thm` 하위 graph에 이 증명이 18 node로 있었다. 그러나 모두 sketch였고 확대해 보는 보기가 아니었다. 이번에는 그 자료를 읽지 않고 **원문에서 새로 지었다.** move5의 node 이름과 대조는 하지 않았다."},"scope-existing-artifact":{"document":"move5-before-creation","lines":[2391,3582],"kind":"artifact","excerpt":"   \"id\": \"thm\",\n   \"title\": \"Theorem decor:overlap-concentration 의 증명\",\n   \"parent\": {\n    \"graph\": \"top\",\n    \"node\": \"THM\"\n   },\n   \"summary\": \"singleton은 spin-anchor 항등식으로 바로 끝난다. 그 밖에는 첫 split 깊이 $e$ 보다 한 걸음 앞 $e-1$ 에 marker anchor를 두고 $S$ 의 사본을 붙여 prescribed-tree 항등식에서 $C(S,e)\\\\operatorname{Var}(M)=o_N(1)$ 을 얻고, $M=\\\\mathbb E[R_S\\\\mid\\\\mathscr F_{e-1}]$ 아래의 조건부 분산은 projection bound와 martingale energy로 $G_-$ 에 대한 $L^2$ 거리로 누른다. 분산 분해와 fiber bound로 $V_{k-1,L}(\\\\eta/2)$ 에 대한 재귀 부등식을 얻고 Proposition conditional-concentration 으로 끝낸다.\",\n   \"nodes\": [\n    {\n     \"id\": \"ext_PB\",\n     \"kind\": \"external\",\n     \"external_ref\": \"PB\",\n     \"import_edge\": \"t13\",\n     \"items\": [\n      \"projection\",\n      \"product_mean\"\n     ],\n     \"title\": \"PB에서 받는 것\",\n     \"statement\": \"[PB.projection] $\\\\|(A_S-a_{S,e})\\\\cdot B\\\\|_{L^2}\\\\le p_N(S,e)$. [PB.product_mean] $\\\\mu_{e,S}=\\\\prod_j\\\\mu_{e,T_j}$.\",\n     \"symbols\": [\n      \"a_p\",\n      \"mu\"\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 576, 580\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"ext_DC\",\n     \"kind\": \"external\",\n     \"external_ref\": \"DC\",\n     \"import_edge\": \"t14\",\n     \"items\": [\n      \"martingale_energy\"\n     ],\n     \"title\": \"DC에서 받는 것\",\n     \"statement\": \"[DC.martingale_energy] $\\\\sum_t\\\\mathbb E\\\\|\\\\mu_{t+1,T}-\\\\mu_{t,T}\\\\|_N^2\\\\le1$.\",\n     \"symbols\": [\n      \"mu\",\n      \"F_d\"\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 583\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"ext_CC\",\n     \"kind\": \"external\",\n     \"external_ref\": \"CC\",\n     \"import_edge\": \"t15\",\n     \"items\": [\n      \"fiber_bound\",\n      \"V_to_zero\",\n      \"main\"\n     ],\n     \"title\": \"CC에서 받는 것\",\n     \"statement\": \"[CC.fiber_bound] $\\\\gamma$-거듭제곱 fiber 경계. [CC.V_to_zero] $V_{k,L}(\\\\eta)\\\\to0$. [CC.main] $\\\\lim_L\\\\limsup_N\\\\mathcal A_{L,\\\\eta}v_N(S,d)=0$.\",\n     \"symbols\": [\n      \"V_kL\",\n      \"A_avg\",\n      \"eta_re 55\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s1_singleton\",\n     \"kind\": \"step\",\n     \"title\": \"singleton의 경우\",\n     \"statement\": \"singleton $S$ 에 대해 spin-anchor 항등식을 추가 color 없이 $f=R_S$ 로 쓰면 $\\\\mathbb ER_S^2=(\\\\mathbb ER_S)^2+o_N(1)$, 곧 각 고정 $L$ 에서 $\\\\operatorname{Var}(R_S)\\\\to0$.\",\n     \"symbols\": [\n      \"R_S\",\n      \"anchor\",\n      \"ext_hist\",\n      \"N_lim\",\n      \"E_root\"\n     ],\n     \"derivation\": [\n      {\n       \"by\": \"e1\",\n       \"expr\": \"spin anchor, 빈 추가, $f=R_S$ 로 [X_TI.identity] 를 쓴다.\",\n       \"by_refs\": [\n        \"e1\"\n       ]\n      },\n      {\n       \"by\": \"e1; e2\",\n       \"author_filled\": \"빈 추가에서 history는 하나뿐이고 그 계수가 0이 아니며, 두 항이 각각 $\\\\mathbb ER_S^2$ 와 $(\\\\mathbb ER_S)^2$ (의 같은 상수배) 가 된다는 읽기는 원문이 적지 않았다.\",\n       \"expr\": \"$\\\\mathbb ER_S^2-(\\\\mathbb ER_S)^2=o_N(1)$.\",\n       \"by_refs\": [\n        \"e1\",\n        \"e2\"\n       ]\n      }\n     ],\n     \"author_filled\": [\n      \"빈 추가의 spin-anchor 항등식이 왜 정확히 $\\\\mathbb ER_S^2$ 와 $(\\\\mathbb ER_S)^2$ 를 주는지(계수와 $R_E$ 의 식별)를 채웠다.\"\n     ],\n     \"status\": \"sketch\",\n     \"grounding\": {\n      \"source\": \"decorrelation.tex 533–535\",\n      \"state\": \"proposed\"\n     }\n    },\n    {\n     \"id\": \"s2_marker_setup\",\n     \"kind\": \"step\",\n     \"title\": \"$e-1$ 에서의 marker anchor 구성\",\n     \"statement\": \"$S$ 가 깊이 $e$ 에서 처음 proper child shape $T_1,\\\\ldots,T_s$ 로 갈라진다고 하자. $S$ 를 old tree로 쓰고 그 leaf 하나를 marker anchor로 지정하고, 모든 leaf가 anchor로부터 $e-1$ 에서 갈라지는 $S$ 의 온전한 사본을 추가한다. 추가 사본의 첫 path는 $e-1$ 에서 fresh여야 하며(old tree가 거기서 아직 갈라지지 않았으므로), 다른 target path는 모두 그 결과 생긴 fresh subtree 안에 있다.\",\n     \"symbols\": [\n      \"topology\",\n      \"anchor\",\n      \"ext_hist\"\n     ],\n     \"local_symbols\": [\n      {\n       \"id\": \"e\",\n       \"tex\": \"$e$\",\n       \"defined_at\": \"decorrelation.tex 537\",\n       \"text\": \"$S$ 의 첫 split 깊이. 평균에서 범위를 도는
