<h1 lang="en">The Mézard–Parisi formula for diluted spin glasses</h1>
<p>OpenAI · September 23, 2026</p><p>문장번호를 누르면 그 문장 아래에서 주석을 펼치거나 접을 수 있습니다.</p></header>
<nav aria-label="원문 탐색"><select aria-label="목차"><option value="">목차에서 이동</option><!--TOC--></select><button id="all" type="button">주석 모두 펼치기</button></nav>
<main><!--BODY--></main>
<footer><a href="../../redesign/source/NOTICE.md">원문 출처 및 라이선스</a></footer>
<script>
const all = document.getElementById('all');
const noted = [...document.querySelectorAll('aside[data-noted]')];
function toggle(panel, show) {
  panel.hidden = !show;
  panel.parentElement.querySelector('.number').setAttribute('aria-expanded', String(show));
}
function update() {
  all.disabled = !noted.length;
  all.textContent = !noted.length ? '작성된 주석 0개' : noted.some(p => !p.hidden) ? '주석 모두 접기' : '주석 모두 펼치기';
}
for (const p of noted) p.parentElement.querySelector('.number').classList.add('marked');
all.onclick = () => {
  const show = !noted.some(p => !p.hidden);
  for (const p of noted) toggle(p,show);
  update();
};
document.querySelector('main').addEventListener('click',e => {
  const a = e.target.closest('.number');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const panel = a.parentElement.querySelector('aside');
  history.replaceState(null,'',a.hash);
  toggle(panel,panel.hidden); update();
});
function openHash(){
  const row = document.getElementById(location.hash.slice(1));
  if (row?.matches('article')) toggle(row.querySelector('aside'),true);
  update();
}
addEventListener('hashchange',openHash); openHash();
document.querySelector('select').onchange = e => {
  if (e.target.value) location.hash = e.target.value;
  e.target.selectedIndex = 0;
};
</script></html>
